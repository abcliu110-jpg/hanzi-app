<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.kai{font-family:"KaiTi","STKaiti","楷体","Kaiti SC",serif}
/* 顶部一级菜单 */

.brand h1{font-size:1.25rem}.brand small{color:var(--sub);font-weight:400;font-size:.85rem;margin-left:.4rem}
nav.topnav{display:flex;gap:.4rem;overflow-x:auto;padding:.4rem 1rem .6rem;max-width:1280px;margin:0 auto;scrollbar-width:none}
nav.topnav::-webkit-scrollbar{display:none}
.tn{flex:none;border:none;background:#f1ecff;color:var(--ink);border-radius:1.2rem;padding:.55rem 1rem;font-size:1rem;cursor:pointer;white-space:nowrap;font-weight:700}
.tn.on{background:linear-gradient(135deg,#ff8a5c,#b05cff);color:#fff;box-shadow:0 .25rem .8rem rgba(176,92,255,.35)}
.tn .soon{font-size:.7rem;opacity:.6;margin-left:.2rem}

.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:17rem 1fr;gap:1.2rem;padding:1rem}
aside{position:sticky;top:7.2rem;align-self:start;max-height:calc(100vh - 8rem);overflow:auto;background:#fff;border-radius:1.4rem;padding:.8rem;box-shadow:0 .4rem 1.4rem rgba(80,60,160,.08)}
.search{position:relative;margin-bottom:.7rem}
.search input{width:100%;border:2px solid var(--line);border-radius:1rem;padding:.65rem .8rem .65rem 2.3rem;font-size:1rem;outline:none;background:#faf8ff}
.search input:focus{border-color:#b05cff}
.search span{position:absolute;left:.75rem;top:50%;transform:translateY(-50%)}
.cat{margin-bottom:.4rem}
.cat-h{display:flex;align-items:center;gap:.5rem;width:100%;border:none;background:none;padding:.6rem .5rem;border-radius:.9rem;cursor:pointer;font-size:1.05rem;font-weight:800;color:var(--ink);text-align:left}

main{min-width:0}

.card.flash{animation:flash 1.2s}
@keyframes flash{30%{box-shadow:0 0 0 .4rem rgba(176,92,255,.35)}}
.card h3{font-size:1.25rem;display:flex;align-items:center;gap:.5rem}
.card h3 .no{font-size:.8rem;background:var(--cc);color:#fff;border-radius:.6rem;padding:.1rem .45rem}
.one{font-size:1.05rem;line-height:1.6;background:#faf7ff;border-radius:1rem;padding:.6rem .8rem}
.lab{font-size:.85rem;font-weight:800;color:var(--sub);margin-bottom:.3rem;letter-spacing:.05em}
.ex{list-style:none;display:flex;flex-direction:column;gap:.35rem}

.ex li b{font-family:"KaiTi","STKaiti","楷体",serif;font-size:1.2rem;color:var(--ink)}
.counter{background:#fff3f0;border-radius:1rem;padding:.6rem .8rem;font-size:1rem;line-height:1.55}
.counter .lab{color:#d9534f}
.src{font-size:.85rem;color:var(--sub);line-height:1.5}
.src .tag{display:inline-block;border-radius:.5rem;padding:0 .4rem;font-size:.75rem;margin-left:.3rem;background:#fff1c2;color:#8a6100}
.src .tag.q{background:#ffe0e0;color:#c0392b}
.quiz{border:2px dashed var(--line);border-radius:1rem;padding:.7rem .8rem}
.quiz .q{font-size:1.05rem;margin-bottom:.5rem;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{border:2px solid var(--line);background:#fff;border-radius:.9rem;padding:.55rem 1rem;font-size:1.05rem;cursor:pointer;color:var(--ink);min-height:2.8rem}
.opt:hover{border-color:#b05cff}
.opt.ok{background:#e3f8ee;border-color:#22b07d}
.opt.bad{background:#ffe9e9;border-color:#e45b5b}
.fb{margin-top:.5rem;font-size:.98rem;line-height:1.5;display:none}
.fb.show{display:block}
mark{background:#ffe27a;border-radius:.2rem;padding:0 .1rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--sub);font-size:1.1rem}
.soonbox{background:#fff;border-radius:1.6rem;padding:3rem 1.5rem;text-align:center;box-shadow:0 .4rem 1.4rem rgba(80,60,160,.08)}
.soonbox .em{font-size:4rem}
.soonbox h2{margin:.6rem 0}
.soonbox button{margin-top:1rem;border:none;background:linear-gradient(135deg,#ff8a5c,#b05cff);color:#fff;border-radius:1.2rem;padding:.8rem 1.4rem;font-size:1.05rem;cursor:pointer;font-weight:700}
.stat{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.stat span{background:rgba(255,255,255,.25);border-radius:1rem;padding:.2rem .7rem;font-size:.9rem}
@media(max-width:860px){
 .wrap{grid-template-columns:1fr;padding:.7rem}
 aside{position:fixed;left:0;top:0;bottom:0;width:82%;max-width:20rem;max-height:none;border-radius:0 1.4rem 1.4rem 0;z-index:40;transform:translateX(-105%);transition:transform .25s}
 aside.show{transform:none}
 .mask{position:fixed;inset:0;background:rgba(30,20,60,.35);z-index:35;display:none}
 .mask.show{display:block}
 .menu-btn{display:inline-flex;align-items:center;gap:.4rem;border:none;background:#fff;border-radius:1rem;padding:.6rem 1rem;font-size:1rem;font-weight:700;margin-bottom:.8rem;box-shadow:0 .3rem 1rem rgba(80,60,160,.1);cursor:pointer;color:var(--ink)}
 .cards{grid-template-columns:1fr}
 .hero .big{font-size:4rem}
}
</style>
</head>

/* 来源字段：能确认出处的写出处并标"待核对"；没有把握的写"待查"，不编造。 */
const CATS=[
{id:"c1",name:"形体密码",icon:"形",color:"#ff7a59",grad:"linear-gradient(135deg,#ff9a62,#ff6f91)",intro:"看字的样子，找出它藏着的意思和读音线索。",rules:[
 {t:"偏旁表义",one:"形旁常常告诉我们：这个字的意思和什么有关。",
  ex:["<b>氵</b>：河、湖、海、洗——都和水有关","<b>木</b>：林、松、桥、桌——都和树木、木头有关","<b>扌</b>：打、拍、提、推——都是手的动作","<b>口</b>：吃、喝、叫、唱——都要用到嘴"],
  no:"“特”是牛字旁，可“特别”和牛没关系。偏旁只提示字最早的意思，字义变了以后就不能硬套。",
  src:"《说文解字》按部首把字分组（待核对）",
  quiz:{q:"哪个字的偏旁告诉我们它和“手”有关？",o:["拍","柏","怕"],a:0,e:"“拍”是提手旁，拍手要用手。“柏”是木字旁，“怕”是竖心旁。"}},
 {t:"易混偏旁",one:"长得很像的偏旁，管的意思却不一样，要分清楚。",
  ex:["<b>衤</b>（衣字旁）：衬、衫、裙、袖——和衣服有关","<b>礻</b>（示字旁）：礼、祝、福、神——和祭祀、祝福有关","<b>冫</b>（两点水）：冰、冷、冻——和寒冷有关","<b>氵</b>（三点水）：河、流、洗——和水有关"],
  no:"“初”是衣字旁，意思却是“开始”。古人做衣服先用刀裁布，裁布是做衣服的开头，所以不能只看偏旁猜今天的意思。",
  src:"《说文解字》：“初，始也。从刀从衣，裁衣之始也。”（待核对）",
  quiz:{q:"“袜子”的“袜”是什么旁？",o:["衤 衣字旁","礻 示字旁"],a:0,e:"袜子是穿的，和衣服有关，所以是衣字旁“衤”，比“礻”多一点。"}},
 {t:"声旁表音",one:"形声字的声旁，会提示这个字大概怎么读。",
  ex:["<b>青</b>：清、晴、情、请——都读 qing（声调不同）","<b>包</b>：跑、泡、饱、抱——韵母都是 ao","<b>马</b>：妈、吗、骂——都读 ma","<b>方</b>：芳、房、访——都读 fang"],
  no:"“江”的声旁是“工”，今天却读 jiāng，不读 gōng。读音几千年里变了，声旁只能“提示”，不能当标准答案。",
  src:"《说文解字·叙》：“形声者，以事为名，取譬相成。”（待核对）",
  quiz:{q:"猜一猜，“蜻蜓”的“蜻”怎么读？",o:["qīng","zhēng","mǎ"],a:0,e:"声旁是“青”，所以读 qīng。"}},
 {t:"声旁表义（右文说）",one:"有些声旁不只管读音，还带着一点意思。宋代有人发现了这个规律，叫“右文说”。",
  ex:["<b>浅</b>：水少——“小”的水","<b>钱</b>：古代指小块的金属钱","<b>残</b>：剩下的一点点","<b>贱</b>：价钱小、便宜"],
  no:"不是每个声旁都带意思。“请”“情”里的“青”主要是表音，硬说它们都和“青色”有关就牵强了。",
  src:"沈括《梦溪笔谈》卷十四记王圣美“右文”之说，以“戋”为“小”（待核对）",
  quiz:{q:"按“右文说”，“浅、钱、残、贱”里的“戋”表示什么？",o:["小","大","红"],a:0,e:"“戋”有“小”的意思：水小是浅，剩下一点是残。"}},
 {t:"古今字",one:"古时一个字身兼好几职，后来加个偏旁造出新字，帮它分担一个意思。",
  ex:["<b>莫 → 暮</b>：“莫”本来是太阳落进草丛，后来加“日”写成“暮”","<b>然 → 燃</b>：“然”本来就是烧，后来加“火”写成“燃”","<b>要 → 腰</b>：“要”本来指腰，后来加“月”写成“腰”","<b>责 → 债</b>：“责”本来有欠债的意思，后来写成“债”"],
  no:"分开以后就各管各的。今天“然”表示“这样、但是”，“燃”表示烧，写“自然”不能写成“自燃”。",
  src:"《说文解字》：“莫，日且冥也。”“然，烧也。”“要，身中也。”（待核对）",
  quiz:{q:"“要”字最早的意思是什么？",o:["腰","想要","重要"],a:0,e:"“要”本义是腰，后来另造了“腰”字。"}},
 {t:"同源分化与只是像",one:"有的字是从同一个字变出来的，意思也连着；有的字只是长得像，其实毫无关系。",
  ex:["同源：<b>木 → 本、末</b>——在“木”下面加一横指树根，上面加一横指树梢","同源：<b>刀 → 刃</b>——在刀上加一点，指刀口","只是像：<b>已、己、巳</b>——差一点点，来历各不相同","只是像：<b>人、入</b>——一撇一捺方向不同，意思无关"],
  no:"不要因为“己”和“已”长得像，就以为它们意思相近。“自己”和“已经”完全不是一回事。",
  src:"《说文解字》：“木下曰本”“木上曰末”（待核对）；已己巳、人入的来源：待查",
  quiz:{q:"下面哪一组只是长得像，没有亲戚关系？",o:["本—末","己—已","刀—刃"],a:1,e:"“本末”“刀刃”都是在原字上加记号变来的；“己”和“已”只是像。"}}
]},
{id:"c2",name:"字义演变密码",icon:"义",color:"#4f8cff",grad:"linear-gradient(135deg,#5aa8ff,#7b6cff)",intro:"一个字的意思会长大、搬家、换方向，看看它是怎么变的。",rules:[
 {t:"由具体到抽象",one:"先指看得见、摸得着的东西，后来指看不见的意思。",
  ex:["<b>头</b>：脑袋 → 带头、开头","<b>口</b>：嘴巴 → 人口、口才","<b>手</b>：人的手 → 能手、手段","<b>心</b>：心脏 → 心情、用心"],
  no:"旧意思没有消失。“头发”“洗手”里的“头”“手”还是具体的身体部位，要看在哪个词里。",
  src:"待查",
  quiz:{q:"“他是我们队的带头人”里的“头”是什么意思？",o:["脑袋","领头、在前面"],a:1,e:"这里不是脑袋，是“走在前面、领头”，是抽象的意思。"}},
 {t:"由空间到时间",one:"表示位置、长短的字，后来也用来说时间。",
  ex:["<b>前</b>：前门 → 前天","<b>后</b>：后院 → 后来","<b>长</b>：长绳子 → 长久","<b>短</b>：短裤 → 短暂"],
  no:"“向前走”“排在后面”里的“前”“后”还是空间方向，不是时间。",
  src:"待查",
  quiz:{q:"“三天以后”的“后”说的是什么？",o:["位置","时间"],a:1,e:"“三天以后”说的是时间。"}},
 {t:"转喻",one:"用和它紧紧连在一起的东西，来代替它本身（也叫借代）。",
  ex:["<b>巾帼</b>：古代女子的头巾 → 指女子","<b>须眉</b>：胡子眉毛 → 指男子","<b>丝竹</b>：琴弦和竹笛 → 指音乐","<b>烽火</b>：报警的烟火 → 指战争"],
  no:"要看语境。“她织了一条头巾”里的“头巾”就是头巾本身，没有指代谁。",
  src:"待查",
  quiz:{q:"“巾帼英雄”的“巾帼”指什么？",o:["头巾","女子","帽子"],a:1,e:"用古代女子戴的头巾来代指女子。"}},
 {t:"比喻引申",one:"因为两样东西很像，打的比方用久了，就变成了字词的新意思。",
  ex:["<b>骨干</b>：撑起身体的骨头 → 团队里最重要的人","<b>桥梁</b>：连接两岸的桥 → 起沟通作用的人或事","<b>包袱</b>：布包 → 心里的负担","<b>尾巴</b>：动物的尾巴 → 事情剩下的一小部分"],
  no:"临时打的比方不算。“他像一头狮子”并没有让“狮子”多出“勇敢的人”这个固定意思，大家都这么用、词典收了才算。",
  src:"待查",
  quiz:{q:"“放下思想包袱”的“包袱”是什么意思？",o:["布做的包","心里的负担"],a:1,e:"把心里的负担比作背着的包袱。"}},
 {t:"扩大、缩小、转移",one:"字义会变宽（扩大）、变窄（缩小），或干脆换成别的意思（转移）。",
  ex:["扩大：<b>江、河</b>——古代专指长江、黄河 → 今天泛指河流","缩小：<b>臭</b>——古代指各种气味 → 今天只指难闻的气味","转移：<b>走</b>——古代是“跑” → 今天是“走路”","转移：<b>汤</b>——古代指热水 → 今天指菜汤"],
  no:"不是所有字都变了。“山”“水”“人”的基本意思几千年来差不多没变。",
  src:"王力主编《古代汉语》常举此类例子（待核对）",
  quiz:{q:"“赴汤蹈火”的“汤”是什么？",o:["菜汤","热水"],a:1,e:"“汤”古义是热水，成语里保留了古义。"}},
 {t:"反训",one:"同一个字，可以表示两个相反的意思。",
  ex:["<b>受</b>：古时“接受”和“给予”都写作“受”，后来“给予”另写成“授”","<b>借</b>：借进来、借出去都叫“借”","<b>乱</b>：古书里有时表示“治理”，如“予有乱臣十人”","<b>租</b>：租进、租出都叫“租”"],
  no:"“买卖”“东西”是两个字组成一个词，不是一个字有相反的意思，不算反训。",
  src:"《论语·泰伯》：“予有乱臣十人。”（待核对）",
  quiz:{q:"“我借你一本书”和“我向你借一本书”，书走的方向相反吗？",o:["相反","一样"],a:0,e:"前一句书从我到你，后一句从你到我，同一个“借”方向相反。"}}
]},
{id:"c3",name:"构词密码",icon:"词",color:"#22b07d",grad:"linear-gradient(135deg,#34c38f,#1fa2b8)",intro:"两个字怎么搭成一个词？搭法不同，意思大不一样。",rules:[
 {t:"同义项近义",one:"两个词里有同一个字，并且这个字取的是同一个意思，词义就比较接近。",
  ex:["<b>成功、成就、成果</b>——“成”都是“做成、完成”","<b>明亮、光明</b>——“明”都是“亮”","<b>美丽、美好</b>——“美”都是“好看、好”"],
  no:"有同一个字不一定意思近。“开心”和“开门”都有“开”，但一个是心情好，一个是打开门。",
  src:"待查",

const TOP=["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];

/* ===================== 状态与渲染 ===================== */
let topSel=4,catSel="c1",ruleSel=null,query="";
const $=id=>document.getElementById(id);
const strip=s=>s.replace(/<[^>]+>/g,"");
const escR=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hl(html){if(!query)return html;const re=new RegExp("("+escR(query)+")","g");
 return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:p.replace(re,"<mark>$1</mark>")).join("")}

function renderTop(){
 $("topnav").innerHTML=TOP.map((t,i)=>`<button class="tn ${i===topSel?"on":""}" onclick="pickTop(${i})">${t}${i===4?"":'<span class="soon">· 待开放</span>'}</button>`).join("");
}
function pickTop(i){topSel=i;renderTop();$("wrap").style.gridTemplateColumns=i===4?"":"1fr";$("side").style.display=i===4?"":"none";renderMain()}
function renderSide(){
 $("catlist").innerHTML=CATS.map((c,ci)=>`<div class="cat ${c.id===catSel||query?"open":""}">
  <button class="cat-h ${c.id===catSel&&!query?"on":""}" onclick="pickCat('${c.id}')"><span class="dot kai" style="background:${c.color}">${c.icon}</span>${ci+1} ${c.name}<span class="arr">›</span></button>
  <div class="subs">${c.rules.map((r,ri)=>`<button class="sub ${ruleSel===c.id+"-"+ri?"on":""}" onclick="pickRule('${c.id}',${ri})">${ci+1}.${ri+1} ${r.t}</button>`).join("")}</div></div>`).join("");
}
function pickCat(id){catSel=id;ruleSel=null;clearSearch();renderSide();renderMain();window.scrollTo({top:0,behavior:"smooth"})}
function pickRule(cid,ri){
 const changed=catSel!==cid||query;catSel=cid;ruleSel=cid+"-"+ri;clearSearch();renderSide();if(changed)renderMain();
 toggleSide(false);
 setTimeout(()=>{const el=$("card-"+cid+"-"+ri);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}},50);
}
function clearSearch(){if(query){query="";$("q").value=""}}
function onSearch(v){query=v.trim();renderSide();renderMain()}

function card(c,ci,r,ri){
 const id=c.id+"-"+ri;
 return`<article class="card" id="card-${id}" style="--cc:${c.color}">
  <h3><span class="no">${ci+1}.${ri+1}</span>${hl(r.t)}</h3>
  <div class="one">💡 ${hl(r.one)}</div>
  <div><div class="lab">✅ 正例</div><ul class="ex">${r.ex.map(e=>`<li>${hl(e)}</li>`).join("")}</ul></div>
  <div class="counter"><div class="lab">⚠️ 反例：什么时候不能套用</div>${hl(r.no)}</div>
  <div class="src">📚 来源：${hl(r.src)}${/待查/.test(r.src)&&!/待核对/.test(r.src)?'<span class="tag q">待查</span>':'<span class="tag">请老师核对</span>'}</div>
  <div class="quiz"><div class="lab">🎯 小练习</div><div class="q">${r.quiz.q}</div>
   <div class="opts">${r.quiz.o.map((o,oi)=>`<button class="opt" onclick="answer(this,'${id}',${oi})">${o}</button>`).join("")}</div>
   <div class="fb" id="fb-${id}"></div></div>
 </article>`;
}
function answer(btn,id,oi){
 const [cid,ri]=[id.split("-")[0],+id.split("-")[1]];const r=CATS.find(c=>c.id===cid).rules[ri];
 const box=btn.parentNode;box.querySelectorAll(".opt").forEach((b,i)=>{b.classList.remove("ok","bad");if(i===r.quiz.a&&oi===r.quiz.a)b.classList.add("ok")});
 const fb=$("fb-"+id);
 if(oi===r.quiz.a){btn.classList.add("ok");fb.innerHTML="🎉 答对啦！"+r.quiz.e}
 else{btn.classList.add("bad");fb.innerHTML="🤔 再想想，可以换一个试试。"}
 fb.classList.add("show");
}
function renderMain(){
 const m=$("main");
 if(topSel!==4){m.innerHTML=`<div class="soonbox"><div class="em">🚧</div><h2>「${TOP[topSel]}」正在建设中</h2><p style="color:var(--sub)">本页先开放「汉字密码」模块。</p><button onclick="pickTop(4)">去看汉字密码 →</button></div>`;return}
 const menuBtn=`<button class="menu-btn" onclick="toggleSide(true)">☰ 规律目录 / 搜索</button>`;
 if(query){
  const q=query;let html="",n=0;
  CATS.forEach((c,ci)=>c.rules.forEach((r,ri)=>{const text=[r.t,r.one,...r.ex,r.no,r.src,r.quiz.q].map(strip).join(" ");
   if(text.includes(q)){html+=card(c,ci,r,ri);n++}}));
  m.innerHTML=menuBtn+`<div class="hero" style="background:linear-gradient(135deg,#6c5ce7,#b05cff)"><h2>🔍 “${q.replace(/</g,"&lt;")}” 的搜索结果</h2><p>找到 ${n} 条规律</p></div>`+(n?`<div class="cards">${html}</div>`:`<div class="empty">没找到哦，换个字试试，比如“汤”“量词”“通假”。</div>`);
  return}
 const ci=CATS.findIndex(c=>c.id===catSel),c=CATS[ci];
 m.innerHTML=menuBtn+`<div class="hero" style="background:${c.grad}"><div class="big kai">${c.icon}</div><h2>${ci+1} ${c.name}</h2><p>${c.intro}</p>
  <div class="stat"><span>📇 ${c.rules.length} 条规律</span><span>🎯 每条一道小练习</span></div></div>
  <div class="cards">${c.rules.map((r,ri)=>card(c,ci,r,ri)).join("")}</div>`;
}
function toggleSide(v){$("side").classList.toggle("show",v);$("mask").classList.toggle("show",v)}

renderTop();renderSide();renderMain();
</script>
