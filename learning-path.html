<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习路径 · 识字星球</title>
<!-- 兜底变量：xzq-theme.css 缺失时使用，外部主题加载后覆盖 -->
<style>
:root{
  --xzq-bg:#fbf7ef; --xzq-surface:#ffffff; --xzq-surface-2:#fffdf8;
  --xzq-ink:#2b2a33; --xzq-sub:#6f6b7a; --xzq-line:#e8e1d3;
  --xzq-radius:16px; --xzq-shadow:0 6px 20px rgba(80,60,30,.08);
  --xzq-font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --xzq-kai:"STKaiti","KaiTi","Kaiti SC","楷体",serif;
  --xzq-meaning:#c2483d; --xzq-radical:#2f8f6a; --xzq-words:#e08a2b;
  --xzq-clinic:#d65a7a; --xzq-review:#1f9aa8; --xzq-path:#5a7d2a;
}
</style>
<link rel="stylesheet" href="xzq-theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--xzq-font);background:var(--xzq-bg);color:var(--xzq-ink);display:flex;flex-direction:column;overflow:hidden;--pc:var(--xzq-path);--pc-soft:color-mix(in srgb,var(--xzq-path) 12%,#fff)}
button{font:inherit;cursor:pointer}
.kai{font-family:var(--xzq-kai)}
/* 顶部统计 */
.stats{display:flex;gap:12px;padding:12px 18px;background:var(--xzq-surface);border-bottom:1px solid var(--xzq-line);align-items:stretch;flex-wrap:wrap}
.stat{background:var(--xzq-surface-2);border:1px solid var(--xzq-line);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:10px;min-width:150px}
.stat .ic{font-size:24px}
.stat b{font-size:20px;color:var(--pc)}
.stat small{display:block;font-size:11px;color:var(--xzq-sub)}
.stat.prog{flex:1;min-width:260px}
.bar{height:10px;border-radius:999px;background:#eee7d8;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pc),color-mix(in srgb,var(--pc) 60%,#ffd28a));border-radius:999px;transition:width .6s}
.main{flex:1;display:grid;grid-template-columns:190px 1fr;min-height:0}
aside{background:var(--xzq-surface-2);border-right:1px solid var(--xzq-line);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
aside .mh{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;border-bottom:1px dashed var(--xzq-line);margin-bottom:6px}
aside .mh span{width:34px;height:34px;border-radius:11px;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:18px}
aside .mh b{font-size:15px}
aside button.nv{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--xzq-ink);display:flex;align-items:center;gap:8px}
aside button.nv:hover{background:#f4efe5}
aside button.nv.on{background:var(--pc-soft);color:var(--pc);font-weight:600}
aside button.nv em{margin-left:auto;font-style:normal;font-size:11px;background:var(--pc);color:#fff;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
aside button.nv em.z{background:#d9d2c3}
.idx{margin-top:auto;font-size:11px;color:var(--xzq-sub);line-height:1.6;padding:8px;border-top:1px dashed var(--xzq-line)}
.idx label{color:var(--pc);text-decoration:underline;cursor:pointer}
.idx input{display:none}
section.view{overflow-y:auto;padding:20px 24px;position:relative}
h2.t{font-size:20px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
p.lead{color:var(--xzq-sub);font-size:13px;margin-bottom:16px}
.card{background:var(--xzq-surface);border-radius:var(--xzq-radius);box-shadow:var(--xzq-shadow);padding:16px 18px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--pc)}
.btn{border:0;background:var(--pc);color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;box-shadow:0 4px 10px color-mix(in srgb,var(--pc) 30%,transparent);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 40%,#fff);box-shadow:none}
.btn.sm{padding:5px 12px;font-size:12px}
.empty{color:var(--xzq-sub);font-size:13px;padding:20px;text-align:center}
/* 地图 */
.map{position:relative;padding:10px 0 30px}
.row{display:flex;justify-content:space-between;position:relative;margin-bottom:34px;padding:0 20px}
.row.rev{flex-direction:row-reverse}
.row::before{content:"";position:absolute;left:52px;right:52px;top:38px;border-top:4px dashed #d8cfbd;z-index:0}
.row .turn{position:absolute;top:38px;width:40px;height:110px;border:4px dashed #d8cfbd;z-index:0}
.row:not(.rev) .turn{right:12px;border-left:0;border-radius:0 60px 60px 0}
.row.rev .turn{left:12px;border-right:0;border-radius:60px 0 0 60px}
.lv{position:relative;z-index:1;width:76px;text-align:center;border:0;background:none}
.lv .orb{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#fff;border:3px solid #d8cfbd;color:#b3aa98;transition:.2s;position:relative;font-family:var(--xzq-kai)}
.lv .no{font-size:11.5px;color:var(--xzq-sub);margin-top:6px;display:block;line-height:1.3}
.lv.done .orb{background:var(--pc);border-color:var(--pc);color:#fff}
.lv.done .orb::after{content:"✓";position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#ffc93c;color:#fff;font-size:13px;display:grid;place-items:center;font-family:var(--xzq-font);border:2px solid #fff}
.lv.cur .orb{border-color:var(--pc);color:var(--pc);background:var(--pc-soft);box-shadow:0 0 0 7px color-mix(in srgb,var(--pc) 16%,transparent);animation:pulse 2s infinite}
.lv.cur .no{color:var(--pc);font-weight:700}
.lv.part .orb{border-color:var(--pc);color:var(--pc)}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--pc) 6%,transparent)}}
.lv:hover .orb{transform:scale(1.06)}
.lv .ring{position:absolute;inset:-6px;border-radius:50%}
.stage-tag{display:inline-block;font-size:12px;background:var(--pc-soft);color:var(--pc);border-radius:999px;padding:3px 12px;margin:0 0 14px 20px;font-weight:600}
/* 关卡详情抽屉 */
.drawer{position:fixed;top:0;right:0;width:min(440px,92vw);height:100%;background:#fff;box-shadow:-12px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:.3s;z-index:40;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .hd{padding:16px 18px;border-bottom:1px solid var(--xzq-line);display:flex;align-items:center;gap:10px}
.drawer .hd b{font-size:17px}
.drawer .hd button{margin-left:auto;border:0;background:#f4efe5;border-radius:50%;width:32px;height:32px;font-size:16px}
.drawer .bd{flex:1;overflow-y:auto;padding:16px 18px}
.mask{position:fixed;inset:0;background:rgba(40,30,20,.25);opacity:0;pointer-events:none;transition:.3s;z-index:39}
.mask.show{opacity:1;pointer-events:auto}
.zis{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-bottom:14px}
.zi{border:1px solid var(--xzq-line);background:#fff;border-radius:10px;padding:5px 0 3px;font-size:24px;font-family:var(--xzq-kai);position:relative;color:var(--xzq-ink);text-align:center}
.zi small{display:block;font-size:9.5px;color:var(--xzq-sub);font-family:var(--xzq-font)}
.zi:hover{border-color:var(--xzq-meaning)}
.zi.seen{border-color:color-mix(in srgb,var(--xzq-meaning) 50%,#fff);background:color-mix(in srgb,var(--xzq-meaning) 6%,#fff)}
.zi.learned::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--pc)}
.steps{list-style:none;counter-reset:s}
.steps li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--xzq-line);margin-bottom:8px;background:#fff}
.steps li .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--c);flex:none}
.steps li.ok{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff)}
.steps li.ok .n::after{content:"✓"}
.steps li.ok .n span{display:none}
.steps li .tx{flex:1;font-size:13.5px;line-height:1.4}
.steps li .tx small{display:block;color:var(--xzq-sub);font-size:11.5px}
.steps li .acts{display:flex;gap:6px;flex:none}
.steps li.lock{opacity:.5}
/* 今日任务 */
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.task{background:#fff;border-radius:14px;box-shadow:var(--xzq-shadow);padding:14px;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:6px}
.task .h{display:flex;align-items:center;gap:8px;font-weight:600}
.task .h span{font-size:22px}
.task p{font-size:12.5px;color:var(--xzq-sub);line-height:1.6;flex:1}
.task.ok{opacity:.7}
.task.ok .h::after{content:"已完成";margin-left:auto;font-size:11px;background:var(--pc);color:#fff;border-radius:999px;padding:1px 8px;font-weight:500}
.week{display:flex;gap:8px;margin-top:6px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--xzq-sub)}
.week i{display:block;height:34px;border-radius:9px;background:#efe8da;margin-bottom:4px;display:grid;place-items:center;font-style:normal;font-size:16px}
.week i.on{background:var(--pc);color:#fff}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--xzq-line)}
th{font-size:12px;color:var(--xzq-sub);font-weight:500}
td .z{font-size:22px;font-family:var(--xzq-kai)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--xzq-line);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;background:#fff}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#f4efe5;color:var(--xzq-sub)}
/* 复习卡 */
.flash{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}
.fc{width:220px;height:260px;border-radius:22px;background:#fff;box-shadow:0 14px 34px rgba(31,154,168,.18);border:3px solid var(--xzq-review);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.fc .z{font-size:110px;line-height:1;font-family:var(--xzq-kai)}
.fc small{color:var(--xzq-sub);font-size:12px}
.grade{display:flex;gap:10px}
.grade button{border:0;border-radius:14px;padding:10px 18px;color:#fff;font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2a33;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:820px){.main{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;padding:8px}aside .mh,.idx{display:none}aside button.nv{white-space:nowrap}}
</style>
<script>if(location.protocol==="file:")document.write('<script src="data/char-index.js"><\/script>')</script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FF8A5C"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><script src="xzq-common.js"></script>
</head>
<body>
<div class="stats">
  <div class="stat"><span class="ic">🔥</span><div><b id="sStreak">0</b> 天<small>连续学习</small></div></div>
  <div class="stat"><span class="ic">🎯</span><div><b id="sToday">0</b> 字<small>今日已学</small></div></div>
  <div class="stat prog"><span class="ic">🪐</span><div style="flex:1"><div><b id="sLearned">0</b> / <span id="sTotal">3499</span> 字 <small style="display:inline;margin-left:6px" id="sPct">0%</small></div><div class="bar"><i id="sBar" style="width:0"></i></div></div></div>
  <div class="stat"><span class="ic">🚩</span><div><b id="sLevel">1</b><small id="sLevelOf">当前关卡</small></div></div>
</div>
<div class="main">
  <aside>
    <div class="mh"><span>🗺️</span><b>学习路径</b></div>
    <button class="nv" data-v="map">🧭 路线总览</button>
    <button class="nv" data-v="today">📅 今日任务<em id="bToday" class="z">0</em></button>
    <button class="nv" data-v="learned">📚 已学的字<em id="bLearned" class="z">0</em></button>
    <button class="nv" data-v="wrong">🩹 错题本<em id="bWrong" class="z">0</em></button>
    <button class="nv" data-v="srs">🧠 复习卡<em id="bSrs" class="z">0</em></button>
    <div class="idx" id="idxInfo"></div>
  </aside>
  <section class="view" id="view"></section>
</div>
<div class="mask" id="mask"></div>
<div class="drawer" id="drawer"><div class="hd"><b id="dTitle"></b><button id="dClose" title="关闭">✕</button></div><div class="bd" id="dBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   识字星球 · 学习路径（只做导航与进度，不含字义内容）
   localStorage 共用约定：
     xzq_learned  [{zi,date}]                       已学会的字
     xzq_meanings 看过字义扩展图的字（兼容数组或 {zi:date} 对象）
     xzq_path     本模块状态 {version,steps:{关卡id:{meaning,radical,words,quiz,review}},days:[日期],current}
     hz_wrong     错题（兼容数组 / 对象，字段 zi|char|hanzi）
     hz_srs       复习卡（兼容数组 / 对象，字段 zi,due,interval,ease,reps）
   ========================================================= */
const TOTAL = 3500, LEVEL_MIN = 10, LEVEL_MAX = 20;
const PAGES = {viewer:'ziyi-viewer.html', radical:'pianpang-bushou.html', words:'zicijv.html', clinic:'yicuo-fuxi.html', review:'yicuo-fuxi.html'};
const STEPS = [
  {k:'meaning', name:'看字义扩展图', desc:'逐个打开本关的字', c:'var(--xzq-meaning)', ic:'🌳'},
  {k:'radical', name:'偏旁部首',     desc:'找出本关字的偏旁', c:'var(--xzq-radical)', ic:'🧩'},
  {k:'words',   name:'字词句',       desc:'用本关的字组词造句', c:'var(--xzq-words)', ic:'📖'},
  {k:'quiz',    name:'易错诊所小测', desc:'测一测易读错、易写错', c:'var(--xzq-clinic)', ic:'🩺'},
  {k:'review',  name:'记忆复习',     desc:'把本关的字放进复习卡', c:'var(--xzq-review)', ic:'🧠'}
];
const FALLBACK = [
 ..."撇粟粪尹苟癫蚂禹廖俭帖煎缕窦簇棱叩呐瑶墅".split('').map(z=>({zi:z,group:147})),
 ..."樊镕垢瘟缪菇琦剃迸溺炫惚嗨陨赃羁臻嘀膳赣".split('').map(z=>({zi:z,group:167}))
];

const $ = id => document.getElementById(id);
const esc = XZQ.esc;
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return dstr(d); };

/* ---------- 存储工具 ---------- */
/* 存储用 XZQ.store：localStorage 不可用时退回内存，本次打开期间照常使用 */
const LS = {
  get(k,def){ return XZQ.store.get(k,def); },
  set(k,v){ if(!XZQ.store.set(k,v) && !LS.warned){ LS.warned=true; toast('浏览器不允许保存进度，关闭页面后会丢失'); } }
};
const ziOf = o => typeof o==='string' ? o : (o && (o.zi||o.char||o.hanzi||o.c||o['字'])) || '';
// 把数组或对象统一成 [{zi,...raw}]
function listOf(raw){
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.map(o=>typeof o==='string'?{zi:o}:Object.assign({},o,{zi:ziOf(o)})).filter(o=>o.zi);
  if(typeof raw==='object') return Object.entries(raw).map(([k,v])=>Object.assign({zi:k}, (v&&typeof v==='object')?v:{value:v}));
  return [];
}

/* ---------- 读写各键 ---------- */
function getLearned(){ return listOf(LS.get('xzq_learned',[])).map(o=>({zi:o.zi,date:o.date||''})); }
function learnedSet(){ return new Set(getLearned().map(o=>o.zi)); }
function addLearned(zis){
  const arr=LS.get('xzq_learned',[]); const list=Array.isArray(arr)?arr:[]; const have=new Set(list.map(ziOf)); const d=today(); let n=0;
  zis.forEach(z=>{ if(!have.has(z)){ list.push({zi:z,date:d}); n++; } });
  LS.set('xzq_learned',list); return n;
}
function meaningSet(){ return new Set(listOf(LS.get('xzq_meanings',null)).map(o=>o.zi)); }
function markMeaning(zi){
  const raw=LS.get('xzq_meanings',null), d=today();
  if(raw && !Array.isArray(raw) && typeof raw==='object'){ if(!(zi in raw)) raw[zi]={date:d}; LS.set('xzq_meanings',raw); }
  else { const arr=Array.isArray(raw)?raw:[]; if(!arr.some(o=>ziOf(o)===zi)) arr.push({zi,date:d}); LS.set('xzq_meanings',arr); }
}
function getPath(){ const p=LS.get('xzq_path',{}); p.version=1; p.steps=p.steps||{}; p.days=p.days||[]; return p; }
function savePath(p){ LS.set('xzq_path',p); }
function touchDay(){ const p=getPath(), d=today(); if(!p.days.includes(d)){ p.days.push(d); p.days=p.days.slice(-400); } savePath(p); }
/* 同一个字可能错过好几道题：按字合并，次数相加，类型列出，最近日期取最新 */
const WRONG_CAT={poly:'多音字',misread:'易读错',similar:'形近字',stroke:'笔画笔顺',homo:'同音别字'};
function getWrong(){
  const by=new Map();
  listOf(LS.get('hz_wrong',[])).forEach(o=>{
    const t=WRONG_CAT[o.cat]||o.type||o.kind||o.reason||'', d=o.date||o.last||o.time||'', n=+(o.count||o.times||1)||1;
    const cur=by.get(o.zi);
    if(!cur) by.set(o.zi,{zi:o.zi,type:t,times:n,last:d});
    else{ cur.times+=n; if(t&&!cur.type.split('、').includes(t)) cur.type=cur.type?cur.type+'、'+t:t; if(d>cur.last) cur.last=d; }
  });
  return [...by.values()].sort((a,b)=>String(b.last).localeCompare(String(a.last)));
}
function removeWrong(zi){
  const raw=LS.get('hz_wrong',[]);
  if(Array.isArray(raw)) LS.set('hz_wrong',raw.filter(o=>ziOf(o)!==zi));
  else if(raw && typeof raw==='object'){ delete raw[zi]; LS.set('hz_wrong',raw); }
}
function getSrs(){ return listOf(LS.get('hz_srs',[])).map(o=>Object.assign(o,{due:o.due||o.next||o.nextDate||''})); }
function upsertSrs(zi, patch){
  const raw=LS.get('hz_srs',[]);
  if(raw && !Array.isArray(raw) && typeof raw==='object'){ raw[zi]=Object.assign({}, raw[zi]&&typeof raw[zi]==='object'?raw[zi]:{}, patch); LS.set('hz_srs',raw); return; }
  const arr=Array.isArray(raw)?raw:[]; const i=arr.findIndex(o=>ziOf(o)===zi);
  if(i>=0) arr[i]=Object.assign({}, typeof arr[i]==='object'?arr[i]:{zi}, patch, {zi}); else arr.push(Object.assign({zi},patch));
  LS.set('hz_srs',arr);
}
function addSrsNew(zis){ const have=new Set(getSrs().map(o=>o.zi)); zis.forEach(z=>{ if(!have.has(z)) upsertSrs(z,{due:addDays(today(),1),interval:1,ease:2.5,reps:0,added:today()}); }); }

/* ---------- 字表与关卡 ---------- */
let INDEX=[], LEVELS=[], idxSrc='';
function normalize(raw){
  let arr=Array.isArray(raw)?raw:(raw&&(raw.chars||raw.data||raw.list));
  if(!arr && raw && typeof raw==='object') arr=Object.entries(raw).map(([k,v])=>typeof v==='object'?Object.assign({zi:k},v):{zi:k,group:v});
  return (arr||[]).map(o=>{ if(typeof o==='string') return {zi:o,group:null};
    const g=o.group??o.zu??o['组']; return {zi:ziOf(o), py:o.py||o.pinyin||'', group:g!=null&&g!==''?Number(g):null}; }).filter(o=>o.zi);
}
async function loadIndex(){
  const raw=await XZQ.loadIndex(); INDEX=raw?normalize(raw):[];
  if(INDEX.length) idxSrc='file'; else { INDEX=FALLBACK.slice(); idxSrc='fallback'; }
  buildLevels();
}
// 按组号排序；每组一关，超过 20 字拆分，不足 10 字并入相邻关
function buildLevels(){
  const seen=new Set(), byG=new Map();
  INDEX.forEach((o,i)=>{ if(seen.has(o.zi)) return; seen.add(o.zi); const g=o.group==null?9999:o.group; if(!byG.has(g)) byG.set(g,[]); byG.get(g).push(o); });
  const groups=[...byG.keys()].sort((a,b)=>a-b);
  let chunks=[];
  groups.forEach(g=>{
    const arr=byG.get(g);
    if(arr.length<=LEVEL_MAX){ chunks.push({groups:[g],chars:arr}); return; }
    const parts=Math.ceil(arr.length/LEVEL_MAX), size=Math.ceil(arr.length/parts);
    for(let i=0;i<arr.length;i+=size) chunks.push({groups:[g],chars:arr.slice(i,i+size),part:true});
  });
  const merged=[];
  chunks.forEach(c=>{
    const last=merged[merged.length-1];
    if(last && (last.chars.length<LEVEL_MIN || c.chars.length<LEVEL_MIN) && last.chars.length+c.chars.length<=LEVEL_MAX){
      last.chars=last.chars.concat(c.chars); c.groups.forEach(g=>{ if(!last.groups.includes(g)) last.groups.push(g); });
    } else merged.push({groups:c.groups.slice(),chars:c.chars.slice()});
  });
  const cnt={};
  LEVELS=merged.map((c,i)=>{ const key=c.groups.join('+'); cnt[key]=(cnt[key]||0)+1;
    return {idx:i, id:'L'+key+(cnt[key]>1?'-'+cnt[key]:''), no:i+1, groups:c.groups, chars:c.chars.map(o=>o.zi), py:Object.fromEntries(c.chars.map(o=>[o.zi,o.py]))}; });
  // 同组被拆成多关时补上 -1
  LEVELS.forEach(l=>{ const key='L'+l.groups.join('+'); if(cnt[l.groups.join('+')]>1 && l.id===key) l.id=key+'-1'; });
}
const groupLabel = l => l.groups[0]===9999 ? '未分组' : (l.groups.length>1?`第 ${l.groups[0]}–${l.groups[l.groups.length-1]} 组`:`第 ${l.groups[0]} 组`);

/* ---------- 关卡进度 ---------- */
function levelSteps(l){
  const p=getPath(), s=Object.assign({},p.steps[l.id]||{}), ms=meaningSet();
  if(l.chars.every(z=>ms.has(z))) s.meaning=true;
  return s;
}
function levelDone(l){ const s=levelSteps(l); return STEPS.every(x=>s[x.k]); }
function levelProgress(l){ const s=levelSteps(l); return STEPS.filter(x=>s[x.k]).length; }
function currentLevel(){ const i=LEVELS.findIndex(l=>!levelDone(l)); return i<0?LEVELS.length-1:i; }
function setStep(l,k,val){
  const p=getPath(); p.steps[l.id]=Object.assign({},p.steps[l.id]||{},{[k]:val}); savePath(p); touchDay();
  if(k==='review' && val) addSrsNew(l.chars);
  if(levelDone(l)){ const n=addLearned(l.chars); celebrate(l,n); }
  refresh();
}
function celebrate(l,n){ toast(`🎉 第 ${l.no} 关通关！新学会 ${n} 个字`); }

/* ---------- 跳转到其他模块（在外壳 iframe 中保持顶部菜单） ---------- */
function go(url){ touchDay(); location.href=url; }
function openZi(zi){
  markMeaning(zi); touchDay();
  const url=`${PAGES.viewer}?zi=${encodeURIComponent(zi)}`;
  // 在 app-shell 内时通知外壳切到字义模块；否则直接跳转
  if(window.parent!==window){ try{ window.parent.postMessage({type:'xzq-open',zi},'*'); return; }catch(e){} }
  location.href=url;
}
function stepUrl(l,k){
  const zis=encodeURIComponent(l.chars.join(''));
  return {radical:`${PAGES.radical}?zis=${zis}&from=path`, words:`${PAGES.words}?zis=${zis}&from=path`,
          quiz:`${PAGES.clinic}?zis=${zis}&from=path#yicuo`, review:`${PAGES.review}?zis=${zis}&from=path#fuxi`}[k];
}

/* ---------- 统计 ---------- */
function streak(){
  const days=new Set(getPath().days); getLearned().forEach(o=>o.date&&days.add(o.date));
  let d=today(); if(!days.has(d)) d=addDays(d,-1);
  let n=0; while(days.has(d)){ n++; d=addDays(d,-1); } return n;
}
function dueCards(){ const t=today(); return getSrs().filter(o=>!o.due || o.due<=t); }
function refreshStats(){
  const L=getLearned(), t=today(), lt=L.filter(o=>o.date===t).length;
  const total=Math.max(TOTAL, idxSrc==='file'?INDEX.length:0);
  $('sStreak').textContent=streak(); $('sToday').textContent=lt;
  $('sLearned').textContent=L.length; $('sTotal').textContent=total;
  const pct=Math.min(100,L.length/total*100); $('sPct').textContent=pct.toFixed(pct<1?2:1)+'%'; $('sBar').style.width=pct+'%';
  const cl=LEVELS[currentLevel()]; $('sLevel').textContent=cl?`第 ${cl.no} 关`:'—'; $('sLevelOf').textContent=`共 ${LEVELS.length} 关`;
  const due=dueCards().length, wr=getWrong().length;
  const todo=(cl&&!levelDone(cl)?1:0)+(due?1:0)+(wr?1:0);
  setBadge('bToday',todo); setBadge('bLearned',L.length); setBadge('bWrong',wr); setBadge('bSrs',due);
  $('idxInfo').innerHTML = idxSrc==='file' ? `字表：char-index.json · ${INDEX.length} 字 · ${LEVELS.length} 关`
    : `未能读取 char-index.json（直接双击打开时浏览器会拦截），暂用内置样例 ${INDEX.length} 字。<br><label>手动载入 char-index.json<input type="file" id="idxFile" accept=".json"></label>`;
  const f=$('idxFile'); if(f) f.onchange=()=>{ const fl=f.files[0]; if(!fl) return; const r=new FileReader(); r.onload=()=>{ try{ const a=normalize(JSON.parse(r.result)); if(a.length){ INDEX=a; idxSrc='file'; buildLevels(); refresh(); toast(`已载入 ${a.length} 字`);} }catch(e){ toast('文件格式无法识别'); } }; r.readAsText(fl,'utf-8'); };
}
function setBadge(id,n){ const e=$(id); e.textContent=n; e.className=n?'':'z'; }

/* ---------- 视图 ---------- */
let VIEW='map';
const VIEWS={map:viewMap,today:viewToday,learned:viewLearned,wrong:viewWrong,srs:viewSrs};
function show(v){ VIEW=v; document.querySelectorAll('aside .nv').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); const p=getPath(); p.lastView=v; savePath(p); VIEWS[v](); }
function refresh(){ refreshStats(); VIEWS[VIEW](); if($('drawer').classList.contains('show') && openLv!=null) renderDrawer(LEVELS[openLv]); }

function viewMap(){
  const cur=currentLevel(), PER=6;
  let h=`<h2 class="t">🧭 路线总览</h2><p class="lead">按组号顺序闯关，每关 10–20 个字，每关 5 步：字义扩展图 → 偏旁部首 → 字词句 → 易错小测 → 记忆复习。点击关卡查看。</p>
    <div class="toolbar"><button class="btn sm" id="toCur">回到当前关卡</button><span class="pill">✓ 已通关 ${LEVELS.filter(levelDone).length}</span><span class="pill">共 ${LEVELS.length} 关</span></div><div class="map">`;
  for(let r=0; r*PER<LEVELS.length; r++){
    if(r%5===0) h+=`<div class="stage-tag">🌍 第 ${r/5+1} 站 · 第 ${r*PER+1}–${Math.min((r+5)*PER,LEVELS.length)} 关</div>`;
    const row=LEVELS.slice(r*PER,(r+1)*PER);
    h+=`<div class="row ${r%2?'rev':''}">`;
    row.forEach(l=>{ const done=levelDone(l), pg=levelProgress(l), cls=done?'done':(l.idx===cur?'cur':(pg?'part':''));
      h+=`<button class="lv ${cls}" data-lv="${l.idx}" id="lv${l.idx}" title="${esc(groupLabel(l))} · ${l.chars.length} 字"><span class="orb">${esc(l.chars[0])}</span><span class="no">第 ${l.no} 关<br>${pg&&!done?pg+'/5':esc(groupLabel(l))}</span></button>`; });
    for(let k=row.length;k<PER;k++) h+=`<span style="width:76px"></span>`;
    if((r+1)*PER<LEVELS.length) h+=`<span class="turn"></span>`;
    h+=`</div>`;
  }
  h+=`</div>`;
  $('view').innerHTML=h;
  $('view').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>openLevel(Number(b.dataset.lv)));
  $('toCur').onclick=()=>{ const e=$('lv'+cur); if(e) e.scrollIntoView({behavior:'smooth',block:'center'}); };
}

let openLv=null;
function openLevel(i){
  const cur=currentLevel();
  if(i>cur && !levelProgress(LEVELS[i]) && !confirm('这一关还没解锁，要提前去看看吗？')) return;
  openLv=i; renderDrawer(LEVELS[i]); $('drawer').classList.add('show'); $('mask').classList.add('show');
}
function closeDrawer(){ $('drawer').classList.remove('show'); $('mask').classList.remove('show'); openLv=null; }
$('dClose').onclick=closeDrawer; $('mask').onclick=closeDrawer;
function renderDrawer(l){
  const s=levelSteps(l), ms=meaningSet(), ls=learnedSet(), seen=l.chars.filter(z=>ms.has(z)).length;
  $('dTitle').textContent=`第 ${l.no} 关 · ${groupLabel(l)}`;
  let h=`<div class="hint" style="font-size:12px;color:var(--xzq-sub);margin-bottom:8px">本关 ${l.chars.length} 字 · 已看字义 ${seen}/${l.chars.length} · 点字打开字义扩展图</div><div class="zis">`;
  l.chars.forEach(z=>h+=`<button class="zi ${ms.has(z)?'seen':''} ${ls.has(z)?'learned':''}" data-zi="${esc(z)}">${esc(z)}<small>${esc((l.py[z]||'').split(/[\s\/]/)[0]||'　')}</small></button>`);
  h+=`</div><ol class="steps">`;
  STEPS.forEach((st,i)=>{
    const ok=!!s[st.k], prevOk=i===0||!!s[STEPS[i-1].k];
    let acts='';
    if(st.k==='meaning'){
      const next=l.chars.find(z=>!ms.has(z));
      acts = ok ? `<button class="btn ghost sm" data-undo="meaning">重来</button>` : `<button class="btn sm" data-go="meaning" data-zi="${esc(next||l.chars[0])}">${seen?'继续':'开始'}</button><button class="btn ghost sm" data-ok="meaning">完成</button>`;
    } else {
      acts = `<button class="btn ${ok?'ghost':''} sm" data-go="${st.k}">${ok?'再去':'去学习'}</button>` + (ok?`<button class="btn ghost sm" data-undo="${st.k}">撤销</button>`:`<button class="btn ghost sm" data-ok="${st.k}">完成</button>`);
    }
    h+=`<li class="${ok?'ok':''} ${!ok&&!prevOk?'lock':''}" style="--c:${st.c}"><span class="n"><span>${i+1}</span></span><div class="tx">${st.ic} ${st.name}<small>${st.k==='meaning'?`看过 ${seen}/${l.chars.length} 字`:st.desc}</small></div><div class="acts">${acts}</div></li>`;
  });
  h+=`</ol>${levelDone(l)?'<div class="card" style="text-align:center;background:var(--pc-soft)">🏅 本关已通关，字已加入“已学的字”和复习卡。</div>':''}`;
  $('dBody').innerHTML=h;
  const b=$('dBody');
  b.querySelectorAll('.zi').forEach(e=>e.onclick=()=>openZi(e.dataset.zi));
  b.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{ const k=e.dataset.go; if(k==='meaning') openZi(e.dataset.zi); else go(stepUrl(l,k)); });
  b.querySelectorAll('[data-ok]').forEach(e=>e.onclick=()=>{ if(e.dataset.ok==='meaning') l.chars.forEach(markMeaning); setStep(l,e.dataset.ok,true); });
  b.querySelectorAll('[data-undo]').forEach(e=>e.onclick=()=>setStep(l,e.dataset.undo,false));
}

function viewToday(){
  const cl=LEVELS[currentLevel()], s=cl?levelSteps(cl):{}, next=cl?STEPS.find(x=>!s[x.k]):null;
  const due=dueCards(), wr=getWrong(), p=getPath();
  const lt=getLearned().filter(o=>o.date===today()).length;
  const days=new Set(p.days); getLearned().forEach(o=>o.date&&days.add(o.date));
  let week=''; const wd='日一二三四五六';
  for(let i=6;i>=0;i--){ const d=addDays(today(),-i); week+=`<div><i class="${days.has(d)?'on':''}">${days.has(d)?'⭐':''}</i>${i===0?'今天':'周'+wd[new Date(d+'T00:00:00').getDay()]}</div>`; }
  let h=`<h2 class="t">📅 今日任务</h2><p class="lead">${today()} · 今天已学 ${lt} 字。完成下面的任务，保持连续学习 🔥</p><div class="tasks">`;
  if(cl){
    h+=`<div class="task ${next?'':'ok'}" style="--c:var(--xzq-path)"><div class="h"><span>🚩</span>闯关：第 ${cl.no} 关</div><p>${esc(groupLabel(cl))} · ${cl.chars.length} 字：<span class="kai" style="font-size:15px;color:var(--xzq-ink)">${esc(cl.chars.join(''))}</span><br>进度 ${levelProgress(cl)}/5${next?` · 下一步：${next.name}`:''}</p><button class="btn sm" id="tLevel">${next?'继续闯关':'查看'}</button></div>`;
  }
  h+=`<div class="task ${due.length?'':'ok'}" style="--c:var(--xzq-review)"><div class="h"><span>🧠</span>复习卡</div><p>${due.length?`有 ${due.length} 张卡今天到期：<span class="kai" style="font-size:15px;color:var(--xzq-ink)">${esc(due.slice(0,12).map(o=>o.zi).join(''))}${due.length>12?'…':''}</span>`:'今天没有到期的卡。'}</p><button class="btn sm" id="tSrs">${due.length?'开始复习':'看看复习卡'}</button></div>`;
  h+=`<div class="task ${wr.length?'':'ok'}" style="--c:var(--xzq-clinic)"><div class="h"><span>🩹</span>错题本</div><p>${wr.length?`还有 ${wr.length} 个易错字待巩固。`:'错题本是空的，真棒！'}</p><button class="btn sm" id="tWrong">${wr.length?'去巩固':'打开错题本'}</button></div>`;
  h+=`</div><div class="card" style="margin-top:14px"><h3>最近 7 天</h3><div class="week">${week}</div></div>`;
  $('view').innerHTML=h;
  if($('tLevel')) $('tLevel').onclick=()=>openLevel(cl.idx);
  $('tSrs').onclick=()=>show('srs'); $('tWrong').onclick=()=>show('wrong');
}

function viewLearned(){
  const L=getLearned().slice().reverse();
  const lvOf={}; LEVELS.forEach(l=>l.chars.forEach(z=>lvOf[z]=l));
  let h=`<h2 class="t">📚 已学的字</h2><p class="lead">一共学会了 ${L.length} 个字。点字可以重新打开字义扩展图。</p>
   <div class="toolbar"><input id="lq" placeholder="查找已学的字"><select id="lsort"><option value="date">按学习日期</option><option value="level">按关卡</option></select></div><div id="lbox"></div>`;
  $('view').innerHTML=h;
  const draw=()=>{
    const q=$('lq').value.trim(); let arr=L.filter(o=>!q||q.includes(o.zi));
    if(!arr.length){ $('lbox').innerHTML=`<div class="card empty">${L.length?'没有找到这个字。':'还没有学会的字，去闯第一关吧！'}</div>`; return; }
    const key=$('lsort').value, groups={};
    arr.forEach(o=>{ const k=key==='date'?(o.date||'未记日期'):(lvOf[o.zi]?`第 ${lvOf[o.zi].no} 关 · ${groupLabel(lvOf[o.zi])}`:'其他'); (groups[k]=groups[k]||[]).push(o.zi); });
    $('lbox').innerHTML=Object.entries(groups).map(([k,zs])=>`<div class="card"><h3>${esc(k)} <span class="pill">${zs.length} 字</span></h3><div class="zis">${zs.map(z=>`<button class="zi learned" data-zi="${esc(z)}">${esc(z)}</button>`).join('')}</div></div>`).join('');
    $('lbox').querySelectorAll('.zi').forEach(e=>e.onclick=()=>openZi(e.dataset.zi));
  };
  $('lq').oninput=draw; $('lsort').onchange=draw; draw();
}

function viewWrong(){
  const W=getWrong();
  let h=`<h2 class="t">🩹 错题本</h2><p class="lead">易错诊所小测里答错的字会出现在这里。巩固好了可以移出。</p>`;
  if(!W.length){ $('view').innerHTML=h+`<div class="card empty">错题本是空的 🎉</div>`; return; }
  h+=`<div class="card"><table><thead><tr><th>字</th><th>类型</th><th>次数</th><th>最近</th><th></th></tr></thead><tbody>`;
  W.forEach(o=>{ h+=`<tr><td><span class="z">${esc(o.zi)}</span></td><td>${esc(o.type||o.kind||o.reason||'—')}</td><td>${esc(o.count||o.times||1)}</td><td>${esc(o.date||o.last||o.time||'—')}</td>
    <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-zi="${esc(o.zi)}" data-a="view">字义</button> <button class="btn ghost sm" data-zi="${esc(o.zi)}" data-a="clinic">去诊所</button> <button class="btn ghost sm" data-zi="${esc(o.zi)}" data-a="rm">移出</button></td></tr>`; });
  h+=`</tbody></table></div><button class="btn" id="wAll">全部错字去易错诊所</button>`;
  $('view').innerHTML=h;
  $('view').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ const z=b.dataset.zi, a=b.dataset.a;
    if(a==='view') openZi(z); else if(a==='clinic') go(`${PAGES.clinic}?zis=${encodeURIComponent(z)}&from=path#yicuo`);
    else if(confirm(`把“${z}”移出错题本？`)){ removeWrong(z); refresh(); } });
  $('wAll').onclick=()=>go(`${PAGES.clinic}?zis=${encodeURIComponent(W.map(o=>o.zi).join(''))}&from=path#yicuo`);
}

let srsQueue=[];
function viewSrs(){
  const all=getSrs(), due=dueCards();
  srsQueue=due.map(o=>o.zi);
  let h=`<h2 class="t">🧠 复习卡</h2><p class="lead">共 ${all.length} 张卡，今天到期 ${due.length} 张。想一想这个字的意思，再点“记得 / 模糊 / 忘了”。</p>`;
  if(!all.length){ $('view').innerHTML=h+`<div class="card empty">还没有复习卡。每关完成“记忆复习”一步后，本关的字会自动放进来。</div>`; return; }
  h+=`<div class="card"><div class="flash" id="flash"></div></div>`;
  const upcoming=all.filter(o=>o.due && o.due>today()).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,60);
  if(upcoming.length) h+=`<div class="card"><h3>即将到期</h3><table><thead><tr><th>字</th><th>下次复习</th><th>间隔</th></tr></thead><tbody>${upcoming.map(o=>`<tr><td><span class="z">${esc(o.zi)}</span></td><td>${esc(o.due)}</td><td>${esc(o.interval||'—')} 天</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<button class="btn ghost" id="sFull">去记忆复习模块</button>`;
  $('view').innerHTML=h; drawFlash();
  $('sFull').onclick=()=>go(`${PAGES.review}?from=path#fuxi`);
}
function drawFlash(){
  const box=$('flash'); if(!box) return;
  if(!srsQueue.length){ box.innerHTML=`<div class="empty">今天的卡都复习完了 ✨</div>`; return; }
  const z=srsQueue[0];
  box.innerHTML=`<div class="fc"><span class="z">${esc(z)}</span><small>还剩 ${srsQueue.length} 张</small></div>
    <button class="btn ghost sm" id="fView">看字义扩展图</button>
    <div class="grade"><button style="background:#e07a5f" data-g="0">😵 忘了</button><button style="background:#e0a92b" data-g="1">🤔 模糊</button><button style="background:var(--xzq-review)" data-g="2">😄 记得</button></div>`;
  $('fView').onclick=()=>openZi(z);
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>gradeCard(z,Number(b.dataset.g)));
}
// 简化的间隔重复：忘了→明天；模糊→间隔×1.2；记得→间隔×ease
function gradeCard(z,g){
  const c=getSrs().find(o=>o.zi===z)||{interval:1,ease:2.5,reps:0};
  let iv=Number(c.interval)||1, ease=Number(c.ease)||2.5, reps=Number(c.reps)||0;
  if(g===0){ iv=1; ease=Math.max(1.3,ease-.2); reps=0; }
  else if(g===1){ iv=Math.max(1,Math.round(iv*1.2)); ease=Math.max(1.3,ease-.05); reps++; }
  else { iv=reps===0?2:Math.round(iv*ease); reps++; }
  upsertSrs(z,{interval:iv,ease:+ease.toFixed(2),reps,due:addDays(today(),iv),last:today()});
  touchDay(); srsQueue.shift(); refreshStats(); drawFlash();
}

/* ---------- 其他 ---------- */
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }
document.querySelectorAll('aside .nv').forEach(b=>b.onclick=()=>show(b.dataset.v));
// 其他页面修改了共用进度（同源多标签页）时自动刷新
window.addEventListener('storage',e=>{ if(['xzq_learned','xzq_meanings','xzq_path','hz_wrong','hz_srs'].includes(e.key)) refresh(); });
window.addEventListener('focus',()=>refresh());

(async function(){
  await loadIndex();
  refreshStats();
  const hash=location.hash.replace('#','');
  const v = VIEWS[hash] ? hash : (getPath().lastView && VIEWS[getPath().lastView] ? getPath().lastView : 'map');
  show(v);
})();
