<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#fbf7ef;--paper2:#f4ecdc;--ink:#2b2622;--ink2:#6b6158;--line:#e4d9c4;
  --brand:#c2503a;--brand2:#f6e3d9;--card:#ffffff;
  --yin:#2f7d6d;--bi:#d07a2b;--zhuan:#6a5acd;--jia:#b8475a;
  --ok:#3d8b4f;--tong:#3a6fb0;--dai:#9a8f84;
  --r:14px;--shadow:0 6px 24px rgba(80,55,30,.10);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);overflow:hidden}
/* 顶部一级菜单 */
header{height:62px;display:flex;align-items:center;gap:22px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,55,30,.05);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-family:var(--serif);font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{border:0;background:none;padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:.15s}
nav.top button:hover{background:var(--paper2);color:var(--ink)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600}
/* 主体 */
main{display:grid;grid-template-columns:200px 1fr 300px;height:calc(100% - 62px)}
aside.left{background:#fff;border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto}
.sec-title{font-size:12px;color:var(--ink2);letter-spacing:.1em;margin:0 4px 10px}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chars button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:.15s;font:inherit}
.chars button b{font-family:var(--serif);font-size:28px;line-height:1.15;font-weight:600}
.chars button small{font-size:11px;color:var(--ink2)}
.chars button:hover{border-color:var(--brand);transform:translateY(-1px)}
.chars button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chars button.on small{color:#fde9e1}
/* 中间画布 */
section.stage{position:relative;display:flex;flex-direction:column;min-width:0}
.hero{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff, var(--paper))}
.hero .big{font-family:var(--serif);font-size:54px;font-weight:700;width:76px;height:76px;border-radius:18px;background:#fff;border:2px solid var(--brand2);display:grid;place-items:center;color:var(--brand);flex:none}
.hero h2{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero h2 span.py{font-weight:400;color:var(--ink2);font-size:15px}
.hero .sw{margin-top:5px;font-family:var(--serif);font-size:14px;color:var(--ink2);line-height:1.6}
.hero .sw em{font-style:normal;color:var(--brand);font-weight:600;margin-right:4px}
.canvas{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#e9dfcb 1px,transparent 1.2px) 0 0/22px 22px, var(--paper)}
svg#map{width:100%;height:100%;cursor:grab;display:block}
svg#map.drag{cursor:grabbing}
.tools{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.tools button:hover{color:var(--brand)}
.legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow);z-index:2;max-width:calc(100% - 420px)}
.legend span{display:flex;align-items:center;gap:5px;color:var(--ink2)}
.legend i{width:16px;height:4px;border-radius:2px;display:inline-block}
/* 义项详情卡 */
.detail{position:absolute;right:14px;top:14px;bottom:14px;width:360px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 36px rgba(80,55,30,.16);overflow-y:auto;padding:18px 18px 22px;z-index:3;transition:transform .25s, opacity .25s}
.detail.hide{transform:translateX(30px);opacity:0;pointer-events:none}
.detail .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink2)}
.detail h3{font-size:20px;font-family:var(--serif);margin-right:24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail .mean{margin:8px 0 4px;color:var(--ink);line-height:1.7;font-size:14px}
.blk{margin-top:14px}
.blk h4{font-size:12px;color:var(--ink2);letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.blk h4::before{content:"";width:4px;height:12px;border-radius:2px;background:var(--brand)}
.blk p{font-size:14px;line-height:1.75}
.path{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--brand2);color:#8a3524;border-radius:999px;padding:4px 11px;font-size:13.5px;font-family:var(--serif)}
.quote{border-left:3px solid var(--line);padding:6px 0 6px 12px;font-family:var(--serif);font-size:15px;line-height:1.8}
.quote .src{font-family:var(--sans);font-size:12px;color:var(--ink2);margin-top:2px}
.quote .tr{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.65}
.tag{font-family:var(--sans);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.tag.demo{background:#efe6d6;color:#8b6d43}
.cert{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;font-family:var(--sans);font-weight:600;white-space:nowrap}
.cert.c1{color:var(--ok);border-color:#b9dcc1;background:#eef7f0}
.cert.c2{color:var(--tong);border-color:#bcd0ea;background:#eef3fa}
.cert.c3{color:var(--dai);border-color:#d8d0c6;background:#f6f3ef;border-style:dashed}
.pending{color:var(--dai);font-size:13.5px;background:#f6f3ef;border:1px dashed #d8d0c6;border-radius:10px;padding:8px 12px}
.evo{display:flex;gap:6px;flex-wrap:wrap}
.evo div{flex:1;min-width:58px;border:1px dashed #d9cbb2;border-radius:10px;padding:6px 4px;text-align:center;background:var(--paper)}
.evo div b{display:block;font-family:var(--serif);font-size:20px;color:#b8a78c;height:28px;line-height:28px}
.evo div.k b{color:var(--ink);font-size:24px}
.evo div small{font-size:11px;color:var(--ink2)}
/* 右侧侧栏 */
aside.right{background:#fff;border-left:1px solid var(--line);padding:16px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:#fff}
.card h5{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h5 i{font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#fff}
.split{display:flex;align-items:stretch;gap:8px}
.split .p{flex:1;border-radius:12px;padding:10px;text-align:center}
.split .p b{display:block;font-family:var(--serif);font-size:24px}
.split .p small{display:block;font-size:11px;font-weight:600;margin:2px 0 4px}
.split .p span{font-size:12px;line-height:1.5;display:block;color:var(--ink2)}
.split .sem{background:#eaf4f1}.split .sem small{color:var(--yin)}
.split .pho{background:#fbefe2}.split .pho small{color:var(--bi)}
.struct{font-size:12px;color:var(--ink2);margin-bottom:8px}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.6}
.warn{display:flex;gap:8px;font-size:13px;line-height:1.65;margin-top:6px}
.warn b{flex:none;font-size:11px;padding:2px 7px;border-radius:6px;height:fit-content;margin-top:2px}
.warn .r{background:#fdebe6;color:var(--brand)}
.warn .w{background:#ece9f8;color:var(--zhuan)}
.code{background:var(--paper);border-radius:10px;padding:9px 11px;margin-top:8px}
.code b{font-size:13px;display:block;margin-bottom:3px}
.code p{font-size:12.5px;color:var(--ink2);line-height:1.6}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* SVG */
.edge{stroke-width:2.2;fill:none}
.node{cursor:pointer}
.node rect{transition:filter .15s}
.node:hover rect{filter:drop-shadow(0 4px 10px rgba(80,55,30,.22))}
.node.sel rect.box{stroke-width:3}
@media (max-width:1100px){main{grid-template-columns:150px 1fr}aside.right{display:none}.detail{width:300px}}
</style>
</head>

<header>
  <div class="logo"><i>字</i>小字典 · 识字乐园</div>
  <nav class="top" id="topnav"></nav>
</header>
<main>
  <aside class="left">

  </aside>
  <section class="stage">
    <div class="hero" id="hero"></div>
    <div class="canvas" id="canvas">
      <div class="tools">
        <button id="zin" title="放大">＋</button>

        <button id="zfit" title="复位">⟲</button>
      </div>
      <svg id="map"><g id="vp"></g></svg>
      <div class="legend">
        <span><i style="background:var(--yin)"></i>引申</span>
        <span><i style="background:var(--bi)"></i>比喻</span>
        <span><i style="background:var(--zhuan)"></i>转喻</span>
        <span><i style="background:var(--jia)"></i>假借</span>
        <span style="margin-left:6px">滚轮缩放 · 拖动平移 · 点击义项看详情</span>
      </div>
      <div class="detail" id="detail"></div>
    </div>
  </section>
  <aside class="right" id="side"></aside>
</main>
<div class="toast" id="toast"></div>

},
{

"meaning": "把好东西毁掉。",
"type": "比喻",
"why": "把美好的东西像埋掉一样毁了。",
"words": [

"断送",
"葬身"
],

"modern": "贪玩会葬送了好好的学习时光。",

}
],
"parts": {

"sem": "艹＋死＋廾",
"semNote": "上下是草，中间是「死」",
"pho": "—",
"phoNote": "没有声旁",
"note": "下面古为草，楷书写成「廾」。"
},
"misread": "读 zàng（第四声）。",

},
{

}
]
},
{
"char": "铭",
"pinyin": "míng",
"evo": "篆隶楷",
"center": {
"label": "器物上的刻字",
"meaning": "刻在器物上记事、警示的文字。",
"shuowen": "《说文》正文未见；大徐本新附「銘」：记也。（引述待核）",
"swCert": "待查",
"reason": "形旁「钅」表示金属，古人在铜器上刻字记功，按通行说法定为本义。",

],
"breakdown": "铭文＝铭（刻的字）＋文（文字）。",
"modern": "青铜器上的铭文记录了古代的大事。",
"classical": null,

},
"senses": [
{

"meaning": "深深地记在心里。",
"type": "比喻",
"why": "刻在铜器上的字不会掉，像把事情刻在心上。",
"words": [
"铭记",
"铭刻",
"刻骨铭心"
],
"breakdown": "刻骨铭心＝刻骨（刻在骨头上）铭心（刻在心上）。",
"modern": "老师的教导我会永远铭记。",

},
{

"meaning": "写来警示自己或记事的文章。",

"why": "刻在器物上的那类文字，后来成了一种文章体裁。",
"words": [
"座右铭",
"陋室铭",
"墓志铭"
],
"breakdown": "座右铭＝座右（座位右边）＋铭（警示的话）。",
"modern": "「坚持就是胜利」是我的座右铭。",
"classical": {
"text": "山不在高，有仙则名。水不在深，有龙则灵。",
"source": "刘禹锡《陋室铭》",

},

],

},

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const TYPE = {"引申":"var(--yin)","比喻":"var(--bi)","转喻":"var(--zhuan)","假借":"var(--jia)"};
const TYPEHEX = {"引申":"#2f7d6d","比喻":"#d07a2b","转喻":"#6a5acd","假借":"#b8475a"};
const CERT = {"确定":"c1","通行说法":"c2","待查":"c3"};
const EVO = {"甲":"甲骨文","金":"金文","篆":"小篆","隶":"隶书","楷":"楷书"};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = 0, sel = 'c', T = {k:1,x:0,y:0};

/* 顶部菜单 */
const top = $('#topnav');
D.menu.forEach((m,i)=>{
  const b = document.createElement('button');
  b.textContent = m; if(i===0) b.className='on';
  b.onclick = ()=>{ if(i!==0) toast('「'+m+'」模块即将上线，敬请期待'); };
  top.appendChild(b);
});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);}

/* 左侧二级菜单 */
const chars = $('#chars');
D.chars.forEach((c,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<b>'+c.char+'</b><small>'+esc(c.pinyin)+'</small>';
  b.onclick=()=>{cur=i;sel='c';render();};
  chars.appendChild(b);
});

function certTag(c){return '<span class="cert '+(CERT[c]||'c3')+'">'+esc(c||'待查')+'</span>';}
function typeTag(t){return '<span class="tag" style="background:'+TYPE[t]+'">'+esc(t)+'</span>';}

function render(){
  [...chars.children].forEach((b,i)=>b.classList.toggle('on',i===cur));
  const c = D.chars[cur];
  $('#hero').innerHTML =
    '<div class="big">'+c.char+'</div><div><h2>'+c.char+' <span class="py">'+esc(c.pinyin)+'</span> 本义：'+esc(c.center.label)+certTag(c.swCert||c.center.swCert)+'</h2>'+
    '<div class="sw"><em>《说文》</em>'+esc(c.center.shuowen)+'</div></div>';
  drawMap(c); renderSide(c); renderDetail(); fit();
}

/* ---------- 义项网 ---------- */
const svg = $('#map'), vp = $('#vp'), NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function wrap(s,n){const out=[];for(let i=0;i<s.length;i+=n)out.push(s.slice(i,i+n));return out;}

function drawMap(c){
  vp.innerHTML='';
  const defs=el('defs',{},vp);
  const g=el('filter',{id:'sh',x:'-20%',y:'-20%',width:'140%',height:'160%'},defs);
  el('feDropShadow',{dx:0,dy:3,stdDeviation:5,'flood-color':'#7a5a3a','flood-opacity':.15},g);
  const n=c.senses.length, R = n<=2?250:(n<=3?270:300);
  const pos=c.senses.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n+(n===2?Math.PI/2:0);return {x:Math.cos(a)*R,y:Math.sin(a)*R};});
  // 外圈装饰
  el('circle',{cx:0,cy:0,r:R,fill:'none',stroke:'#e6dac3','stroke-dasharray':'3 7'},vp);
  // 连线
  c.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPEHEX[s.type]||'#999';
    el('line',{x1:0,y1:0,x2:p.x,y2:p.y,class:'edge',stroke:col,'stroke-dasharray':s.certainty==='待查'?'6 5':'none',opacity:.85},vp);
  });
  // 连线标签
  c.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPEHEX[s.type]||'#999';
    const mx=p.x*.5, my=p.y*.5;
    const lines=wrap(s.why,12).slice(0,4);
    const w=12*13+16, h=24+lines.length*15+8;
    const lg=el('g',{transform:'translate('+mx+','+my+')',style:'cursor:pointer'},vp);
    lg.addEventListener('click',e=>{e.stopPropagation();sel=i;renderDetail();mark();});
    el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:10,fill:'#fffdf8',stroke:col,'stroke-opacity':.35},lg);
    el('rect',{x:-22,y:-h/2+6,width:44,height:18,rx:9,fill:col},lg);
    const tt=el('text',{x:0,y:-h/2+19,'text-anchor':'middle','font-size':11.5,'font-weight':700,fill:'#fff'},lg);tt.textContent=s.type;
    lines.forEach((ln,j)=>{const t=el('text',{x:-w/2+8,y:-h/2+40+j*15,'font-size':11.5,fill:'#5d544b'},lg);t.textContent=ln;});
  });
  // 中心节点
  const cg=el('g',{class:'node','data-i':'c'},vp);
  cg.addEventListener('click',e=>{e.stopPropagation();sel='c';renderDetail();mark();});
  el('circle',{cx:0,cy:0,r:92,fill:'#fbe9e1',opacity:.7},cg);
  el('rect',{class:'box',x:-74,y:-74,width:148,height:148,rx:74,fill:'#fff',stroke:'#c2503a','stroke-width':2.5,filter:'url(#sh)'},cg);
  const t1=el('text',{x:0,y:8,'text-anchor':'middle','font-size':68,'font-weight':700,'font-family':'var(--serif)',fill:'#c2503a'},cg);t1.textContent=c.char;
  const t2=el('text',{x:0,y:44,'text-anchor':'middle','font-size':13,fill:'#6b6158'},cg);t2.textContent='本义 · '+c.center.label;
  const t0=el('text',{x:0,y:-46,'text-anchor':'middle','font-size':12,fill:'#9a8f84'},cg);t0.textContent=c.pinyin;
  // 义项节点
  c.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPEHEX[s.type]||'#999';
    const ng=el('g',{class:'node','data-i':i,transform:'translate('+p.x+','+p.y+')'},vp);
    ng.addEventListener('click',e=>{e.stopPropagation();sel=i;renderDetail();mark();});
    const w=Math.max(132,s.label.length*17+44), h=62;
    el('rect',{class:'box',x:-w/2,y:-h/2,width:w,height:h,rx:16,fill:'#fff',stroke:col,'stroke-width':1.6,filter:'url(#sh)'},ng);
    el('rect',{x:-w/2,y:-h/2,width:8,height:h,rx:4,fill:col},ng);
    const a=el('text',{x:4,y:-4,'text-anchor':'middle','font-size':16,'font-weight':700,'font-family':'var(--serif)',fill:'#2b2622'},ng);a.textContent=s.label;
    const b=el('text',{x:4,y:17,'text-anchor':'middle','font-size':11,fill:'#8a8076'},ng);b.textContent=s.words.slice(0,2).join(' · ');
    const dc=s.certainty==='确定'?'#3d8b4f':(s.certainty==='待查'?'#b0a69b':'#3a6fb0');
    el('circle',{cx:w/2-10,cy:-h/2+10,r:4.5,fill:dc},ng);
  });
  mark();
}
function mark(){vp.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel',String(n.dataset.i)===String(sel)));}

/* 缩放平移 */
function apply(){vp.setAttribute('transform','translate('+T.x+','+T.y+') scale('+T.k+')');}
function fit(){const r=svg.getBoundingClientRect();const det=$('#detail').classList.contains('hide')?0:380;const w=r.width-det, h=r.height;const k=Math.min(w/820,h/760,1.15);T={k:Math.max(k,.35),x:w/2,y:h/2};apply();}
function zoomAt(f,cx,cy){const nk=Math.min(3,Math.max(.3,T.k*f));const s=nk/T.k;T.x=cx-(cx-T.x)*s;T.y=cy-(cy-T.y)*s;T.k=nk;apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y,moved:false};svg.classList.add('drag');});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;T.x=drag.tx+dx;T.y=drag.ty+dy;apply();});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('#zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$('#zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$('#zfit').onclick=fit;
window.addEventListener('resize',fit);

/* ---------- 义项详情 ---------- */
function classicalHTML(cl){
  if(!cl||!cl.text) return '<div class="pending">文言原句：待查（暂未找到可靠出处，不作编造）</div>';
  return '<div class="quote">'+esc(cl.text)+'<div class="src">—— '+esc(cl.source)+'</div><div class="tr">译文：'+esc(cl.trans)+'</div></div>';
}
function renderDetail(){
  const c=D.chars[cur], d=$('#detail'); d.classList.remove('hide');
  const isC = sel==='c'; const s = isC? c.center : c.senses[sel];
  let h='<button class="x" title="收起">×</button>';
  h+='<h3>'+(isC?'本义 · ':'')+esc(s.label)+(isC?'':typeTag(s.type))+certTag(s.certainty)+'</h3>';
  h+='<p class="mean">'+esc(s.meaning)+'</p>';
  if(isC){
    h+='<div class="blk"><h4>《说文解字》原文</h4><div class="quote">'+esc(s.shuowen)+'<div class="src">把握程度：'+esc(s.swCert)+'</div></div></div>';
    const st=[...c.evo];
    h+='<div class="blk"><h4>字形演变</h4><div class="evo">'+st.map(k=>k==='楷'?'<div class="k"><b>'+c.char+'</b><small>楷书</small></div>':'<div><b>〔 〕</b><small>'+EVO[k]+'·待补</small></div>').join('')+'</div>'+(st.length===1?'<p class="note">该字（或此写法）出现较晚，未见早期古文字字形。</p>':'<p class="note">字形图为占位，待配图。</p>')+'</div>';
    h+='<div class="blk"><h4>本义判定理由</h4><div class="path">'+esc(s.reason)+'</div></div>';
  }else{
    h+='<div class="blk"><h4>怎么变来的</h4><div class="path">本义「'+esc(c.center.label)+'」 → <b>'+esc(s.label)+'</b>　'+typeTag(s.type)+'<br>'+esc(s.why)+'</div></div>';
  }
  h+='<div class="blk"><h4>词族</h4><div class="words">'+s.words.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div>';
  h+='<div class="blk"><h4>构词拆解</h4><p>'+esc(s.breakdown)+'</p></div>';
  h+='<div class="blk"><h4>现代例句 <span class="tag demo">示例</span></h4><p>'+esc(s.modern)+'</p></div>';
  h+='<div class="blk"><h4>文言原句</h4>'+classicalHTML(s.classical)+'</div>';
  h+='<div class="blk"><h4>把握程度</h4><p>'+certTag(s.certainty)+' <span style="font-size:12px;color:var(--ink2);margin-left:6px">确定＝有可靠依据；通行说法＝多数工具书采用；待查＝尚需核实</span></p></div>';
  d.innerHTML=h;
  d.querySelector('.x').onclick=()=>{d.classList.add('hide');};
}

/* ---------- 右侧侧栏 ---------- */
function renderSide(c){
  const p=c.parts;
  $('#side').innerHTML=
   '<div class="card"><h5><i style="background:var(--yin)">拆</i>偏旁拆分</h5><div class="struct">'+esc(p.structure)+'</div>'+
   '<div class="split"><div class="p sem"><b>'+esc(p.sem)+'</b><small>表义部分</small><span>'+esc(p.semNote)+'</span></div>'+
   '<div class="p pho"><b>'+esc(p.pho)+'</b><small>表音部分</small><span>'+esc(p.phoNote)+'</span></div></div>'+
   '<p class="note">'+esc(p.note)+'</p></div>'+
   '<div class="card"><h5><i style="background:var(--brand)">诊</i>易错提醒</h5>'+
   '<div class="warn"><b class="r">易读错</b><span>'+esc(c.misread)+'</span></div>'+
   '<div class="warn"><b class="w">易写错</b><span>'+esc(c.miswrite)+'</span></div></div>'+
   '<div class="card"><h5><i style="background:var(--zhuan)">码</i>相关汉字密码</h5>'+
   c.codes.map(k=>'<div class="code"><b>🔑 '+esc(k.t)+'</b><p>'+esc(k.d)+'</p></div>').join('')+'</div>'+
   '<div class="card" style="background:var(--paper)"><h5><i style="background:var(--dai)">图</i>图例</h5>'+
   '<p class="note" style="margin:0">实线＝通行或确定的演变；虚线＝演变路径待查。<br>节点右上圆点：<span style="color:var(--ok)">●</span>确定 <span style="color:var(--tong)">●</span>通行说法 <span style="color:var(--dai)">●</span>待查</p></div>';
}

render();
})();
</script>
