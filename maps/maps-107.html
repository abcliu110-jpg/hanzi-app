<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>字义扩展图 · 第57组</title>
<style>
:root{
  --paper:#f7f2e8; --paper2:#fffdf8; --ink:#2a2733; --ink2:#5d5866; --line:#e4dccb;
  --red:#c4513a; --jade:#2f7d6d; --gold:#c99a2e; --indigo:#4a5aa8; --plum:#8a4f9e;
  --t-yin:#3f6fb5; --t-bi:#d07a2b; --t-zhuan:#2f8a5f; --t-jia:#8a4f9e;
  --ok:#2f7d4f; --mid:#b9822a; --todo:#a14b4b;
  --radius:16px; --shadow:0 6px 22px rgba(60,40,10,.08);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{display:flex;flex-direction:column;min-height:100vh}
/* 顶部一级菜单 */
.topbar{display:flex;align-items:center;gap:18px;padding:10px 22px;background:var(--paper2);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.03);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:20px;white-space:nowrap}
.brand .seal{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink2);padding:8px 13px;border-radius:999px;cursor:pointer;transition:.15s}
.nav button:hover{background:#f1e9d8;color:var(--ink)}
.nav button.active{background:var(--ink);color:#fff;font-weight:600}
.nav button .soon{font-size:10px;opacity:.55;margin-left:3px}
.grp{margin-left:auto;font-size:12.5px;color:var(--ink2);white-space:nowrap}
/* 主体布局 */
.layout{flex:1;display:grid;grid-template-columns:200px 1fr 360px;gap:16px;padding:16px;min-height:0}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* 左侧二级菜单 */
.side{padding:14px;display:flex;flex-direction:column;gap:10px;height:calc(100vh - 92px);position:sticky;top:76px}
.side h3{margin:0 2px 2px;font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:.08em}
.charlist{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;overflow:auto}
.charlist button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:11px;font-family:var(--serif);font-size:24px;cursor:pointer;color:var(--ink);position:relative;transition:.15s}
.charlist button:hover{border-color:var(--red);transform:translateY(-1px)}
.charlist button.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 12px rgba(196,81,58,.35)}
.charlist button small{position:absolute;top:2px;left:5px;font-family:var(--sans);font-size:9px;opacity:.5}
.legend{margin-top:auto;font-size:12px;color:var(--ink2);display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:22px;height:4px;border-radius:2px;display:inline-block}
.cdot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* 中间 */
.center{display:flex;flex-direction:column;gap:14px;min-width:0}
.origin{padding:16px 18px;display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:start}
.bigchar{width:92px;height:92px;border-radius:18px;background:linear-gradient(145deg,#fff,#f4ead6);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:62px;position:relative}
.bigchar::before,.bigchar::after{content:"";position:absolute;inset:12px;border:1px dashed rgba(196,81,58,.18)}
.bigchar::after{inset:0;border:0;background:linear-gradient(rgba(196,81,58,.12),rgba(196,81,58,.12)) center/1px 100% no-repeat,linear-gradient(rgba(196,81,58,.12),rgba(196,81,58,.12)) center/100% 1px no-repeat}
.otitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.otitle h2{margin:0;font-family:var(--serif);font-size:21px}
.py{color:var(--red);font-weight:600}
.shuowen{margin:8px 0 6px;font-family:var(--serif);font-size:15px;background:#fbf5e8;border-left:3px solid var(--gold);padding:7px 11px;border-radius:0 8px 8px 0}
.shuowen b{color:var(--gold);font-family:var(--sans);font-size:12px;margin-right:6px}
.forms{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.form{border:1px dashed #cfc2a6;border-radius:9px;padding:4px 8px;text-align:center;min-width:62px;background:#fff}
.form .g{font-family:var(--serif);font-size:13px;color:#a69a80;height:22px;line-height:22px}
.form .n{font-size:10.5px;color:var(--ink2)}
.arrow{color:#c5b896;font-size:12px}
.why{font-size:13.5px;color:var(--ink2);line-height:1.65}
.why b{color:var(--ink)}
.mapwrap{position:relative;flex:1;min-height:560px;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%),
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(150,120,70,.06) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(150,120,70,.06) 31px 32px),var(--paper2)}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;position:absolute;inset:0}
#map.drag{cursor:grabbing}
.zoombar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombar button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.zoombar button:hover{border-color:var(--red);color:var(--red)}
.maptip{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--ink2);background:rgba(255,255,255,.85);padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
svg text{font-family:var(--sans)}
.node{cursor:pointer}
.node rect,.node circle{transition:stroke-width .15s,filter .15s}
.node:hover rect,.node:hover circle{filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.node.sel rect,.node.sel circle{stroke-width:3.2}
/* 右侧 */
.rail{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 92px);position:sticky;top:76px;overflow:auto;padding-right:2px}
.panel{padding:15px 16px}
.panel h4{margin:0 0 10px;font-size:13px;letter-spacing:.06em;color:var(--ink2);display:flex;align-items:center;gap:8px}
.panel h4::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--red)}
.dtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dtitle .lab{font-family:var(--serif);font-size:19px;font-weight:700}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;color:#fff;font-weight:600;white-space:nowrap}
.conf{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid;font-weight:600;white-space:nowrap}
.conf.确定{color:var(--ok);border-color:var(--ok);background:#eef7f1}
.conf.通行说法{color:var(--mid);border-color:var(--mid);background:#fbf4e4}
.conf.待查{color:var(--todo);border-color:var(--todo);background:#f9eded}
.reason{font-size:13px;color:var(--ink2);background:#f8f4ea;border-radius:9px;padding:7px 10px;margin-bottom:10px;line-height:1.6}
.sec{margin-top:10px}
.sec .k{font-size:11.5px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-family:var(--serif);font-size:15px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;line-height:1.7}
.ex .badge{font-size:10.5px;background:var(--jade);color:#fff;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.classic .q{font-family:var(--serif);font-size:15px;color:var(--ink)}
.classic .src{font-size:12px;color:var(--gold);margin:3px 0;font-weight:600}
.classic .tr{font-size:13px;color:var(--ink2)}
.classic.none{color:var(--todo);background:#fbf3f3;border-style:dashed}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.half{border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.55}
.half .t{font-size:11px;font-weight:700;margin-bottom:3px;letter-spacing:.05em}
.half.yi{background:#eaf4f0;color:#1f5a4d}.half.yin{background:#eef0fa;color:#33418a}
.struct{font-size:12.5px;color:var(--ink2);margin-top:8px}
.err{display:grid;gap:8px}
.err div{font-size:13.2px;line-height:1.6;padding:8px 10px 8px 34px;border-radius:10px;position:relative;background:#fff;border:1px solid var(--line)}
.err div::before{position:absolute;left:9px;top:8px;width:18px;height:18px;border-radius:5px;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.err .r::before{content:"读";background:var(--indigo)}.err .w::before{content:"写";background:var(--red)}
.code{font-size:13.5px;line-height:1.7;background:linear-gradient(135deg,#fff8ea,#fff);border:1px solid #efdcb4;border-radius:10px;padding:10px 12px}
.code::before{content:"🔑 ";}
.hint{font-size:12px;color:var(--ink2);text-align:center;padding:16px 8px}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{font-size:11.5px;color:var(--ink2);text-align:center;padding:4px 0 14px}
@media (max-width:1180px){.layout{grid-template-columns:170px 1fr}.rail{grid-column:1/-1;height:auto;position:static}.charlist{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.layout{grid-template-columns:1fr}.side{height:auto;position:static}.charlist{grid-template-columns:repeat(10,1fr)}.charlist button{font-size:18px}.legend{display:none}.origin{grid-template-columns:1fr}}
</style>
</head>

const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
let cur = 0, sel = -1;

/* 顶部菜单 */
const nav = $('#nav');
DATA.menu.forEach((m,i)=>{
  const b=document.createElement('button');
  b.innerHTML = esc(m)+(i?'<span class="soon">·</span>':'');
  if(i===0) b.classList.add('active');
  b.onclick=()=>{ if(i) toast('「'+m+'」模块在其他页面中，本页仅展示字义扩展图'); };
  nav.appendChild(b);
});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

/* 左侧字表 */
const list = $('#charlist');
CH.forEach((c,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<small>'+(i+1)+'</small>'+c.c; b.title=c.c+' '+c.py;
  b.onclick=()=>show(i);
  list.appendChild(b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){ if(document.activeElement.tagName!=='INPUT'){show((cur+1)%CH.length);} }
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ show((cur-1+CH.length)%CH.length); }
});

function confTag(c){return '<span class="conf '+c+'">'+c+'</span>';}
function typeTag(t){return '<span class="tag" style="background:'+TYPE[t]+'">'+t+'</span>';}

function renderOrigin(c){
  const forms=["甲骨文","金文","小篆","隶书","楷书"];
  $('#origin').innerHTML =
   '<div class="bigchar">'+c.c+'</div><div>'+
   '<div class="otitle"><h2>本义：'+esc(c.o.m)+'</h2><span class="py">'+c.py+'</span>'+confTag(c.o.c)+'</div>'+
   '<div class="shuowen"><b>《说文》</b>'+esc(c.o.sw)+'</div>'+
   '<div class="forms">'+forms.map((f,i)=>'<div class="form"><div class="g">'+(i===4?c.c:'〔字形〕')+'</div><div class="n">'+f+'</div></div>'+(i<4?'<span class="arrow">→</span>':'')).join('')+'</div>'+
   '<div class="why"><b>为什么是本义：</b>'+esc(c.o.r)+'</div></div>';
}

/* 义项网 */
const svg = $('#map');
let vb = {x:-520,y:-380,w:1040,h:760};
const VB0 = {...vb};
function applyVB(){svg.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function wrap(s,n){const out=[];for(let i=0;i<s.length;i+=n)out.push(s.slice(i,i+n));return out;}

function renderMap(c){
  svg.innerHTML='';
  const defs=el('defs',{},svg);
  const f=el('filter',{id:'sh',x:'-20%',y:'-20%',width:'140%',height:'140%'},defs);
  el('feDropShadow',{dx:0,dy:3,stdDeviation:4,'flood-color':'#5a3a10','flood-opacity':.12},f);
  const g=el('g',{},svg);
  const n=c.s.length, R = n<=2?290:(n===3?280:300);
  const start=-90+180/n;
  // 装饰圆环
  el('circle',{cx:0,cy:0,r:R,fill:'none',stroke:'#e8dcc4','stroke-dasharray':'3 7'},g);
  el('circle',{cx:0,cy:0,r:R*0.55,fill:'none',stroke:'#efe5d1','stroke-dasharray':'2 6'},g);
  const pos=c.s.map((s,i)=>{const a=(start+i*360/n)*Math.PI/180;return {x:Math.cos(a)*R,y:Math.sin(a)*R,a};});
  // 连线
  c.s.forEach((s,i)=>{
    const p=pos[i], col=TYPEHEX[s.t];
    const line=el('line',{x1:0,y1:0,x2:p.x,y2:p.y,stroke:col,'stroke-width':3,'stroke-linecap':'round',opacity:.85},g);
    if(s.t==='假借') line.setAttribute('stroke-dasharray','9 7');
    const mx=p.x*0.5, my=p.y*0.5;
    const lg=el('g',{transform:'translate('+mx+','+my+')'},g);
    el('rect',{x:-30,y:-12,width:60,height:24,rx:12,fill:col},lg);
    const t=el('text',{x:0,y:5,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#fff'},lg);t.textContent=s.t;
    const lines=wrap(s.w,12).slice(0,4);
    const bg=el('rect',{x:-82,y:16,width:164,height:lines.length*16+10,rx:8,fill:'rgba(255,253,248,.93)',stroke:'#eadfca'},lg);
    lines.forEach((ln,j)=>{const tt=el('text',{x:0,y:31+j*16,'text-anchor':'middle','font-size':11.5,fill:'#5d5866'},lg);tt.textContent=ln;});
  });
  // 中心
  const cg=el('g',{class:'node'+(sel===-1?' sel':''),filter:'url(#sh)'},g);
  el('circle',{cx:0,cy:0,r:84,fill:'#fffaf0',stroke:'#c4513a','stroke-width':2.2},cg);
  el('circle',{cx:0,cy:0,r:74,fill:'none',stroke:'#e7c9b8','stroke-dasharray':'2 4'},cg);
  const big=el('text',{x:0,y:-2,'text-anchor':'middle','font-size':56,fill:'#2a2733','font-family':'var(--serif)'},cg);big.textContent=c.c;big.style.fontFamily='"Songti SC","STSong","Noto Serif SC",serif';
  const tg=el('g',{},cg);
  el('rect',{x:-24,y:12,width:48,height:20,rx:10,fill:'#c4513a'},tg);
  const tt=el('text',{x:0,y:26,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff'},tg);tt.textContent='本义';
  wrap(c.o.m,8).slice(0,2).forEach((ln,j)=>{const t=el('text',{x:0,y:50+j*15,'text-anchor':'middle','font-size':12.5,fill:'#5d5866'},cg);t.textContent=ln;});
  cg.addEventListener('click',e=>{e.stopPropagation();select(-1);});
  // 义项节点
  c.s.forEach((s,i)=>{
    const p=pos[i], col=TYPEHEX[s.t];
    const W=168, labLines=wrap(s.l,9).slice(0,2), H=46+labLines.length*20;
    const ng=el('g',{class:'node'+(sel===i?' sel':''),transform:'translate('+p.x+','+p.y+')',filter:'url(#sh)'},g);
    el('rect',{x:-W/2,y:-H/2,width:W,height:H,rx:14,fill:'#fff',stroke:col,'stroke-width':1.8},ng);
    el('rect',{x:-W/2,y:-H/2,width:6,height:H,rx:3,fill:col},ng);
    labLines.forEach((ln,j)=>{const t=el('text',{x:4,y:-H/2+26+j*20,'text-anchor':'middle','font-size':16,'font-weight':700,fill:'#2a2733'},ng);t.textContent=ln;});
    const fy=-H/2+26+labLines.length*20+2;
    const ft=el('text',{x:4,y:fy,'text-anchor':'middle','font-size':11.5,fill:'#8a8392'},ng);ft.textContent=s.f.join(' · ');
    el('circle',{cx:W/2-12,cy:-H/2+12,r:5,fill:CONFHEX[s.c]},ng);
    ng.addEventListener('click',e=>{e.stopPropagation();select(i);});
  });
}

function detailHTML(c,i){
  const s = i===-1 ? Object.assign({l:'本义：'+c.o.m,t:null,w:c.o.r},c.o) : c.s[i];
  const conf = s.c;
  let h='<h4>义项详情</h4><div class="dtitle"><span class="lab">'+esc(s.l)+'</span>'+(s.t?typeTag(s.t):'<span class="tag" style="background:var(--red)">本义</span>')+confTag(conf)+'</div>';
  if(s.t) h+='<div class="reason">'+esc(s.w)+'</div>';
  h+='<div class="sec"><div class="k">词族</div><div class="chips">'+s.f.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div></div>';
  h+='<div class="sec"><div class="k">构词拆解</div><div class="box">'+esc(s.d)+'</div></div>';
  h+='<div class="sec ex"><div class="k">现代例句</div><div class="box"><span class="badge">示例</span>'+esc(s.x)+'</div></div>';
  if(s.q) h+='<div class="sec"><div class="k">文言原句</div><div class="box classic"><div class="q">“'+esc(s.q.t)+'”</div><div class="src">—— '+esc(s.q.s)+'</div><div class="tr">译文：'+esc(s.q.r)+'</div></div></div>';
  else h+='<div class="sec"><div class="k">文言原句</div><div class="box classic none">待查——暂未找到能确认出处的文言原句，不作编造。</div></div>';
  h+='<div class="sec"><div class="k">把握程度</div><div>'+confTag(conf)+' <span style="font-size:12px;color:var(--ink2)">'+({"确定":"字书、经典用例明确","通行说法":"学界常见解释，仍有不同意见","待查":"出处或解释尚需核对"}[conf])+'</span></div></div>';
  return h;
}
function select(i){sel=i;$('#detail').innerHTML=detailHTML(CH[cur],i);
  svg.querySelectorAll('.node').forEach((n,k)=>n.classList.toggle('sel',(k===0&&i===-1)||(k-1===i)));}

function renderRail(c){
  $('#parts').innerHTML='<h4>偏旁拆分</h4><div class="split"><div class="half yi"><div class="t">表义部分</div>'+esc(c.p.yi)+'</div><div class="half yin"><div class="t">表音部分</div>'+esc(c.p.yin)+'</div></div><div class="struct">结构：'+esc(c.p.st)+'</div>';
  $('#errors').innerHTML='<h4>易读错 · 易写错</h4><div class="err"><div class="r">'+esc(c.e.r)+'</div><div class="w">'+esc(c.e.w)+'</div></div>';
  $('#code').innerHTML='<h4>相关汉字密码</h4><div class="code">'+esc(c.k)+'</div>';
}

function show(i){
  cur=i; sel=-1;
  list.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('active',k===i));
  const c=CH[i];
  renderOrigin(c); renderMap(c); renderRail(c); select(-1);
  vb={...VB0}; applyVB();
  document.title='字义扩展图 · '+c.c;
}

/* 缩放与平移 */
function zoom(f,cx,cy){
  const nw=Math.min(3000,Math.max(300,vb.w*f)), k=nw/vb.w, nh=vb.h*k;
  if(cx===undefined){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}
  vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:nh};applyVB();
}
function toWorld(e){const r=svg.getBoundingClientRect();const s=Math.max(vb.w/r.width,vb.h/r.height);
  const ox=(r.width*s-vb.w)/2, oy=(r.height*s-vb.h)/2;
  return {x:vb.x-ox+(e.clientX-r.left)*s,y:vb.y-oy+(e.clientY-r.top)*s,s};}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=toWorld(e);zoom(e.deltaY>0?1.12:1/1.12,p.x,p.y);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,s:toWorld(e).s};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;vb.x=drag.vx-(e.clientX-drag.x)*drag.s;vb.y=drag.vy-(e.clientY-drag.y)*drag.s;applyVB();});
['pointerup','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>{drag=null;svg.classList.remove('drag');}));
$('#zin').onclick=()=>zoom(1/1.2);$('#zout').onclick=()=>zoom(1.2);$('#zreset').onclick=()=>{vb={...VB0};applyVB();};

show(0);
})();
</script>
<script src="../xzq-back.js" data-home="../index.html"></script>
</body>
