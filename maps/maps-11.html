<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字小课堂 · 字义扩展图（20字）</title>
<style>
:root{
  --bg:#fbf6ec; --card:#ffffff; --ink:#2b2a27; --sub:#6d675c; --line:#ece3d2;
  --orange:#b85600; --orange-soft:#fff1e2; --green:#2e6b34; --green-soft:#e8f3e6;
  --blue:#1f5fa8; --blue-soft:#e6eefa; --purple:#7b2f9a; --purple-soft:#f3e8f8;
  --amber:#a15c00; --amber-soft:#fff4d6;
  --r:18px; --shadow:0 4px 18px rgba(80,60,20,.08);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --kai:"KaiTi","STKaiti","楷体","BiauKai",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6;display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* top bar */
header{background:var(--card);box-shadow:0 2px 10px rgba(80,60,20,.06);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:12px 20px 6px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--orange);color:#fff;font:700 28px/44px var(--kai);text-align:center}
.brand h1{font-size:22px;font-weight:700}
.brand small{color:var(--sub);font-size:14px;margin-left:6px}
nav.top{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
nav.top::-webkit-scrollbar{display:none}
nav.top button{flex:0 0 auto;min-height:48px;padding:0 18px;border-radius:999px;font-size:17px;font-weight:600;color:var(--sub);background:#f5efe3}
nav.top button.on{background:var(--orange);color:#fff}
nav.top button .soon{font-size:11px;margin-left:4px;opacity:.7}

/* layout */
main{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr) 380px;gap:16px;padding:16px;min-height:0}
aside.chars{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 10px;overflow-y:auto;max-height:calc(100vh - 150px);position:sticky;top:130px}
aside.chars h3{font-size:14px;color:var(--sub);text-align:center;margin-bottom:8px}
.charlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.charlist button{min-height:62px;border-radius:14px;background:#faf6ee;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}
.charlist button b{font:400 30px/1.1 var(--kai)}
.charlist button i{font-style:normal;font-size:12px;color:var(--sub)}
.charlist button.on{background:var(--orange-soft);border-color:var(--orange)}
.charlist button.on b{color:var(--orange)}

section.mapwrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:560px;overflow:hidden}
.maphead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.maphead .big{font:400 52px/1 var(--kai);color:var(--orange)}
.maphead .meta{display:flex;flex-direction:column}
.maphead .meta b{font-size:20px}
.maphead .meta span{font-size:14px;color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.t-引申{background:var(--green-soft);color:var(--green)}
.t-比喻{background:var(--orange-soft);color:var(--orange)}
.t-转喻{background:var(--blue-soft);color:var(--blue)}
.t-假借{background:var(--purple-soft);color:var(--purple)}
.k-确定{background:var(--green-soft);color:var(--green)}
.k-通行说法{background:var(--blue-soft);color:var(--blue)}
.k-待查{background:var(--amber-soft);color:var(--amber);border:1px dashed var(--amber)}
.ex-tag{background:#f1ede4;color:var(--sub)}
.mapbox{position:relative;flex:1;min-height:480px;background:
  radial-gradient(circle at 1px 1px,#efe6d4 1px,transparent 0) 0 0/26px 26px}
#map{width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:24px;font-weight:700;color:var(--orange)}
.hint{position:absolute;left:14px;bottom:14px;font-size:13px;color:var(--sub);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:10px}
.reasons-toggle{position:absolute;left:14px;top:14px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--green)}

/* svg node html */
.node{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:#fff;border:3px solid #e2d6bf;font-family:var(--font);text-align:center;padding:4px 8px;cursor:pointer;transition:transform .15s, box-shadow .15s;box-shadow:0 3px 10px rgba(80,60,20,.08)}
.node:hover{transform:translateY(-2px)}
.node b{font-size:19px;line-height:1.25}
.node span{font-size:12px;color:var(--sub)}
.node.on{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 0 0 5px rgba(184,86,0,.15)}
.node.dim{opacity:.35}
.root{width:100%;height:100%;border-radius:50%;background:var(--orange);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font);box-shadow:0 0 0 10px rgba(184,86,0,.12)}
.root b{font:400 72px/1 var(--kai)}
.root span{font-size:14px;margin-top:4px;padding:0 10px;text-align:center;line-height:1.3}
.root.on{box-shadow:0 0 0 10px rgba(184,86,0,.3)}
.elabel{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font);text-align:center}
.elabel p{font-size:12.5px;line-height:1.35;color:#4b463d;background:rgba(255,255,255,.92);border-radius:8px;padding:2px 6px}
.noreason .elabel p{display:none}

/* right column */
aside.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.card h2{font-size:22px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.card h4{font-size:15px;color:var(--sub);margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.card h4::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--orange)}
.from{font-size:15px;color:var(--sub);background:#faf6ee;border-radius:12px;padding:8px 12px;margin-top:6px}
.from b{color:var(--ink)}
.quote{font-family:var(--kai);font-size:20px;background:#fbf7ef;border-left:5px solid var(--orange);border-radius:10px;padding:10px 14px}
.evo{border:2px dashed #d8c9ad;border-radius:14px;padding:10px 14px;font-size:15px;color:var(--sub);background:repeating-linear-gradient(45deg,#fff,#fff 10px,#fbf7ef 10px,#fbf7ef 20px)}
.evo .slots{display:flex;gap:8px;margin-bottom:8px}
.evo .slots div{flex:1;aspect-ratio:1;border-radius:10px;border:2px dashed #d8c9ad;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff;text-align:center;line-height:1.2}
.evo .slots div.k{font:400 36px/1 var(--kai);color:var(--ink);border-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:14px;background:var(--green-soft);color:var(--green);font-size:20px;font-weight:600}
.build{font-size:18px;background:#faf6ee;border-radius:12px;padding:8px 12px}
.sent{font-size:19px}
.sent mark{background:none;color:var(--orange);font-weight:700}
.gw{font-family:var(--kai);font-size:20px}
.src{font-size:14px;color:var(--sub);margin-top:2px}
.tr{font-size:16px;margin-top:6px;padding:8px 12px;background:var(--blue-soft);border-radius:12px}
.tr::before{content:"译：";font-weight:700;color:var(--blue)}
.pending{font-size:15px;color:var(--amber)}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;align-items:center;gap:12px;background:#faf6ee;border-radius:14px;padding:8px 12px}
.part .pc{font:400 34px/1 var(--kai);width:48px;text-align:center}
.part .role{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.role.义{background:var(--green-soft);color:var(--green)}
.role.音{background:var(--blue-soft);color:var(--blue)}
.role.兼{background:var(--purple-soft);color:var(--purple)}
.role.无{background:#eee;color:#666}
.part p{font-size:15px;line-height:1.4}
ul.err{list-style:none;display:flex;flex-direction:column;gap:6px}
ul.err li{font-size:16px;padding:6px 10px 6px 34px;border-radius:12px;background:#fff6f0;position:relative}
ul.err li::before{content:"⚠";position:absolute;left:10px;top:6px;color:var(--orange)}
.code{font-size:16px;background:var(--purple-soft);border-radius:14px;padding:10px 14px;color:#4a1d5e}
.code::before{content:"🔑 ";}

footer{text-align:center;font-size:13px;color:var(--sub);padding:8px 16px 18px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);opacity:0;background:#2b2a27;color:#fff;padding:12px 22px;border-radius:14px;font-size:16px;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1180px){
  main{grid-template-columns:130px minmax(0,1fr)}
  aside.side{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;align-items:start}
}
@media (max-width:760px){
  main{grid-template-columns:1fr;padding:10px;gap:10px}
  aside.chars{position:static;max-height:none;padding:8px}
  aside.chars h3{display:none}
  .charlist{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none}
  .charlist button{flex:0 0 58px}
  aside.side{display:flex}
  .legend{margin-left:0}
  .mapbox{min-height:440px}
  .maphead .big{font-size:42px}
}
</style>
</head>

  {"id":"b","n":"果断","p":"0","t":"比喻","y":"果子熟了就落地，不拖泥带水（通行说法）。","w":["果断","果敢","果决"],"b":"果敢 = 果（坚决）+ 敢（勇敢）","e":"遇到危险，要果断求助。","g":"由也果，于从政乎何有？","s":"《论语·雍也》","r":"仲由做事果断，对于治理政事有什么困难呢？","k":"通行说法"},
  {"id":"c","n":"果然、真的","p":"a","t":"引申","y":"结果和预料的一样。","w":["果然","果真","如果"],"b":"果然 = 果（真的）+ 然（这样）","e":"天气预报说下雨，果然下雨了。","g":"待查","s":"","r":"","k":"确定"},
  {"id":"d","n":"吃饱","p":"0","t":"比喻","y":"肚子圆鼓鼓的，像个果子。","w":["果腹","食不果腹","果然（饱足貌）"],"b":"食不果腹 = 食（吃）+ 不果腹（填不饱肚子）","e":"古时穷人常常食不果腹。","g":"适莽苍者，三餐而反，腹犹果然。","s":"《庄子·逍遥游》","r":"到郊野去的人，带三餐饭就能回来，肚子还是饱饱的。","k":"通行说法"}
 ]},
{"c":"加","py":"jiā","ben":"说话夸大（言语上增加）","sw":"加，語相增加也。从力从口。","evo":"金文：从力从口 → 小篆 → 楷书「加」","why":"从“口”表示说话；《说文》解释为“语相增加”，即说话夸大其词。《左传》“弗敢加也”正是不敢虚夸。","k":"通行说法",
 "w":["添油加醋","加诬（文言）","增加"],"b":"添油加醋 = 添油 + 加醋（说话夸大）","e":"讲故事要实事求是，不要添油加醋。","g":"牺牲玉帛，弗敢加也，必以信。","s":"《左传·庄公十年》","r":"祭祀用的牲畜玉帛，不敢虚报夸大，一定要诚实。",
 "parts":[["力","义","力气、用力"],["口","义","嘴、说话"],["—","无","会意字，没有表音部分"]],
 "err":["左“力”右“口”，不要写反","“力”的撇要出头","不要和“如”“知”混"],
 "code":"会意字：两个部件合起来表一个意思：加、休、明、林。",
 "senses":[
  {"id":"a","n":"增加、更","p":"0","t":"引申","y":"说话往上“加” → 数量往上加。","w":["增加","加倍","加快"],"b":"加快 = 加（增加）+ 快","e":"听到铃声，我们加快了脚步。","g":"邻国之民不加少，寡人之民不加多，何也？","s":"《孟子·梁惠王上》","r":"邻国的百姓没有更少，我的百姓没有更多，这是为什么呢？","k":"确定"},
  {"id":"b","n":"施加、加在上面","p":"0","t":"引申","y":"把东西放到别人身上。","w":["强加","加冕","加入"],"b":"强加 = 强（硬）+ 加（施加）","e":"不要把自己的想法强加给别人。","g":"我不欲人之加诸我也，吾亦欲无加诸人。","s":"《论语·公冶长》","r":"我不愿意别人强加给我的，我也不想强加给别人。","k":"确定"},
  {"id":"c","n":"加法","p":"a","t":"引申","y":"把几个数合在一起，就是“加”。","w":["加法","加号","相加"],"b":"加号 = 加 + 号（符号）","e":"三加五等于八。","g":"（现代数学用语，无文言用例）","s":"","r":"","k":"确定"}
 ]}
]}
</script>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent).chars;
const MENU = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const TYPE_COLOR = {'引申':'#2e6b34','比喻':'#b85600','转喻':'#1f5fa8','假借':'#7b2f9a'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur = 0, sel = '0', showReasons = true;
let vb = {x:0,y:0,w:1000,h:800}, fitVB = null;

/* top menu */
$('topnav').innerHTML = MENU.map((m,i)=>`<button class="${i===0?'on':''}" data-i="${i}">${m}${i? '<span class="soon">待上线</span>':''}</button>`).join('');
$('topnav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(+b.dataset.i !== 0) toast('「'+MENU[+b.dataset.i]+'」将在后续版本上线');
});
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }

/* left list */
$('charlist').innerHTML = D.map((d,i)=>`<button data-i="${i}" class="${i===cur?'on':''}"><b>${d.c}</b><i>${d.py.split(' / ')[0]}</i></button>`).join('');
$('charlist').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  cur = +b.dataset.i; sel='0';
  [...$('charlist').children].forEach((x,i)=>x.classList.toggle('on', i===cur));
  renderAll(true);
});

/* layout */
function layout(d){
  const pos = {'0':{x:0,y:0,depth:0,ang:0}};
  const kids = p => d.senses.filter(s=>s.p===p);
  const lv1 = kids('0'); const n = lv1.length;
  const R1 = 330, STEP = 270;
  lv1.forEach((s,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    pos[s.id] = {x:R1*Math.cos(ang), y:R1*Math.sin(ang), depth:1, ang};
  });
  function place(pid){
    const pp = pos[pid]; const ch = kids(pid); const m = ch.length;
    ch.forEach((s,i)=>{
      const spread = 0.5/ pp.depth;
      const ang = pp.ang + (i-(m-1)/2)*spread;
      const r = R1 + STEP*pp.depth;
      pos[s.id] = {x:r*Math.cos(ang), y:r*Math.sin(ang), depth:pp.depth+1, ang};
      place(s.id);
    });
  }
  lv1.forEach(s=>place(s.id));
  return pos;
}

function chainTo(d,id){ const set=new Set(['0']); let s=d.senses.find(x=>x.id===id); while(s){ set.add(s.id); s=d.senses.find(x=>x.id===s.p);} return set; }

function renderMap(refit){
  const d = D[cur]; const pos = layout(d); const svg = $('map');
  const NW=180, NH=72, RR=95, LW=190, LH=78;
  const chain = sel==='0' ? null : chainTo(d, sel);
  let edges='', labels='', nodes='';
  d.senses.forEach(s=>{
    const a = pos[s.p], b = pos[s.id];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    const cx = mx - dy/L*40, cy = my + dx/L*40;
    const lx = (a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    const on = chain && chain.has(s.id) && chain.has(s.p);
    const col = TYPE_COLOR[s.t]||'#888';
    edges += `<path d="M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}" fill="none" stroke="${col}" stroke-width="${on?7:4}" stroke-linecap="round" opacity="${chain&&!on?0.25:0.85}" ${s.t==='假借'?'stroke-dasharray="10 9"':''}/>`;
    labels += `<foreignObject x="${lx-LW/2}" y="${ly-LH/2}" width="${LW}" height="${LH}" opacity="${chain&&!on?0.35:1}"><div xmlns="http://www.w3.org/1999/xhtml" class="elabel"><span class="tag t-${s.t}">${s.t}</span><p>${esc(s.y)}</p></div></foreignObject>`;
  });
  d.senses.forEach(s=>{
    const p = pos[s.id];
    const cls = 'node' + (sel===s.id?' on':'') + (chain && !chain.has(s.id)?' dim':'');
    nodes += `<foreignObject x="${p.x-NW/2}" y="${p.y-NH/2}" width="${NW}" height="${NH}"><div xmlns="http://www.w3.org/1999/xhtml" class="${cls}" data-id="${s.id}"><b>${esc(s.n)}</b><span>${confWord(s.k)}</span></div></foreignObject>`;
  });
  nodes += `<foreignObject x="${-RR}" y="${-RR}" width="${RR*2}" height="${RR*2}"><div xmlns="http://www.w3.org/1999/xhtml" class="root${sel==='0'?' on':''}" data-id="0"><b>${d.c}</b><span>本义：${esc(d.ben)}</span></div></foreignObject>`;
  svg.innerHTML = `<g>${edges}</g><g>${labels}</g><g>${nodes}</g>`;
  svg.classList.toggle('noreason', !showReasons);
  if(refit || !fitVB){
    let xs=[0],ys=[0]; Object.values(pos).forEach(p=>{xs.push(p.x);ys.push(p.y);});
    const pad=150, minx=Math.min(...xs)-pad, maxx=Math.max(...xs)+pad, miny=Math.min(...ys)-pad, maxy=Math.max(...ys)+pad;
    fitVB = {x:minx,y:miny,w:maxx-minx,h:maxy-miny}; vb={...fitVB};
  }
  applyVB();
}
function confWord(k){ return k==='确定'?'✓ 确定':(k==='待查'?'？ 待查':'≈ 通行说法'); }
function applyVB(){ $('map').setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); $('map').setAttribute('preserveAspectRatio','xMidYMid meet'); }

/* zoom & pan */
function zoom(f, cx, cy){
  if(cx==null){ cx=vb.x+vb.w/2; cy=vb.y+vb.h/2; }
  const nw = Math.min(Math.max(vb.w*f, fitVB.w*0.25), fitVB.w*3);
  const k = nw/vb.w;
  vb = {x:cx-(cx-vb.x)*k, y:cy-(cy-vb.y)*k, w:nw, h:vb.h*k}; applyVB();
}
function svgPoint(e){ const svg=$('map'); const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
$('zin').onclick=()=>zoom(0.8); $('zout').onclick=()=>zoom(1.25); $('zfit').onclick=()=>{vb={...fitVB};applyVB();};
$('map').addEventListener('wheel', e=>{ e.preventDefault(); const p=svgPoint(e); zoom(e.deltaY<0?0.88:1.14, p.x, p.y); }, {passive:false});
let drag=null, moved=false;
const pointers = new Map(); let pinch=null;
$('map').addEventListener('pointerdown', e=>{
  pointers.set(e.pointerId, e);
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}; drag=null; return; }
  drag={x:e.clientX,y:e.clientY,vb:{...vb}}; moved=false;
});
window.addEventListener('pointermove', e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, e);
  if(pinch && pointers.size===2){ const [a,b]=[...pointers.values()]; const nd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); zoom(pinch.d/nd); pinch.d=nd; moved=true; return; }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>5){ moved=true; $('map').classList.add('drag'); }
  if(!moved) return;
  const r=$('map').getBoundingClientRect(); const s=Math.max(vb.w/r.width, vb.h/r.height);
  vb.x=drag.vb.x-dx*s; vb.y=drag.vb.y-dy*s; applyVB();
});
window.addEventListener('pointerup', e=>{
  pointers.delete(e.pointerId); if(pointers.size<2) pinch=null;
  $('map').classList.remove('drag');
  if(drag && !moved){ const el=document.elementFromPoint(e.clientX,e.clientY); const n=el&&el.closest('[data-id]'); if(n){ sel=n.dataset.id; renderMap(false); renderDetail(); if(window.innerWidth<1180) $('detail').scrollIntoView({behavior:'smooth',block:'start'}); } }
  drag=null;
});
$('rtoggle').onclick=()=>{ showReasons=!showReasons; $('rtoggle').textContent = showReasons?'💬 隐藏连线原因':'💬 显示连线原因'; $('map').classList.toggle('noreason', !showReasons); };

/* header */
function renderHead(){
  const d=D[cur];
  const types=[...new Set(d.senses.map(s=>s.t))];
  $('maphead').innerHTML = `<div class="big">${d.c}</div><div class="meta"><b>${d.py}${d.fan?'　繁体 '+d.fan:''}</b><span>${d.senses.length} 个常用义项 · 点击义项看详情</span></div>
  <div class="legend">${['引申','比喻','转喻','假借'].map(t=>`<span class="tag t-${t}" style="opacity:${types.includes(t)?1:.4}">${t==='假借'?'┅ ':'— '}${t}</span>`).join('')}</div>`;
}

/* detail */
function kTag(k){ return `<span class="tag k-${k}">把握：${k}</span>`; }
function hl(sent, words, ch){ let out=esc(sent); const keys=[...words.map(w=>w.replace(/（.*?）/g,'')), ch].filter(Boolean).sort((a,b)=>b.length-a.length); for(const k of keys){ if(out.includes(k)){ return out.replace(k, `<mark>${k}</mark>`);} } return out; }
function gwBlock(o){
  if(!o.g || o.g==='待查') return `<p class="pending"><span class="tag k-待查">待查</span>　尚未找到可靠的文言原句，暂不填写。</p>`;
  if(o.g.startsWith('（')) return `<p class="src">${esc(o.g)}</p>`;
  return `<p class="gw">${esc(o.g)}</p><p class="src">—— ${esc(o.s)}</p>${o.r?`<p class="tr">${esc(o.r)}</p>`:''}`;
}
function renderDetail(){
  const d=D[cur];
  let html='';
  if(sel==='0'){
    const slots = ['甲骨文','金文','小篆'].map(x=>`<div>${x}<br>图待补</div>`).join('') + `<div class="k">${d.fan||d.c}</div><div class="k">${d.c}</div>`;
    html = `<h2>本义：${esc(d.ben)} ${kTag(d.k)}</h2>
      <h4>《说文解字》原文</h4><div class="quote">${esc(d.sw)}</div>
      <h4>字形演变</h4><div class="evo"><div class="slots">${slots}</div>${esc(d.evo)}</div>
      <h4>为什么说这是本义</h4><p style="font-size:16px">${esc(d.why)}</p>
      <h4>词族</h4><div class="chips">${d.w.map(w=>`<span>${esc(w)}</span>`).join('')}</div>
      <h4>构词拆解</h4><p class="build">${esc(d.b)}</p>
      <h4>现代例句 <span class="tag ex-tag">示例</span></h4><p class="sent">${hl(d.e,d.w,d.c)}</p>
      <h4>文言原句</h4>${gwBlock(d)}`;
  } else {
    const s=d.senses.find(x=>x.id===sel);
    const par = s.p==='0' ? '本义「'+d.ben+'」' : '「'+d.senses.find(x=>x.id===s.p).n+'」';
    html = `<h2>${esc(s.n)} ${kTag(s.k)}</h2>
      <div class="from">从 <b>${esc(par)}</b> 变来 <span class="tag t-${s.t}">${s.t}</span><br>${esc(s.y)}</div>
      <h4>词族</h4><div class="chips">${s.w.map(w=>`<span>${esc(w)}</span>`).join('')}</div>
      <h4>构词拆解</h4><p class="build">${esc(s.b)}</p>
      <h4>现代例句 <span class="tag ex-tag">示例</span></h4><p class="sent">${hl(s.e,s.w,d.c)}</p>
      <h4>文言原句</h4>${gwBlock(s)}`;
  }
  $('detail').innerHTML = html;
}

/* profile */
function renderProfile(){
  const d=D[cur];
  const roleName={'义':'表义','音':'表音','兼':'音义兼表','无':'—'};
  $('profile').innerHTML = `<h2>「${d.c}」字档案</h2>
    <h4>偏旁拆分</h4><div class="parts">${d.parts.map(p=>`<div class="part"><div class="pc">${esc(p[0])}</div><div><span class="role ${p[1]}">${roleName[p[1]]}</span><p>${esc(p[2])}</p></div></div>`).join('')}</div>
    <h4>易读错 · 易写错</h4><ul class="err">${d.err.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h4>汉字密码</h4><p class="code">${esc(d.code)}</p>`;
}

function renderAll(refit){ renderHead(); renderMap(refit); renderDetail(); renderProfile(); }
renderAll(true);
window.addEventListener('resize', ()=>applyVB());
})();
</script>
