<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#f6f1e7; --paper2:#fbf8f2; --card:#ffffff; --ink:#2a2723; --ink2:#5d574e; --ink3:#958c7f;
  --line:#e6dccb; --accent:#c4472d; --accent-soft:#f6e1d9; --jade:#2f7d6d;
  --t-yinshen:#2f7d6d; --t-biyu:#d9822b; --t-zhuanyu:#7b5ea7; --t-jiajie:#a0524f;
  --c-sure:#3f8f5a; --c-common:#c48a1d; --c-tbd:#8c8478;
  --kai:"KaiTi","STKaiti","Kaiti SC","楷体","BiauKai","AR PL UKai CN",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}

/* ---- top nav ---- */
.topbar{display:flex;align-items:center;gap:18px;padding:0 22px;height:60px;background:var(--paper2);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.brand .seal{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand small{display:block;font-weight:400;color:var(--ink3);font-size:11px;letter-spacing:0}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:9px 13px;border-radius:10px;color:var(--ink2);font-size:14px;white-space:nowrap;position:relative}
.nav button:hover{background:#f0e8da}
.nav button.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.nav button.off{color:var(--ink3)}
.nav button.off::after{content:"";position:absolute;right:5px;top:7px;width:5px;height:5px;border-radius:50%;background:#d8cdbb}

/* ---- layout ---- */
.main{flex:1;display:grid;grid-template-columns:150px 1fr 370px;min-height:0}
.left{border-right:1px solid var(--line);background:var(--paper2);overflow-y:auto;padding:14px 12px}
.left h3,.side h3{margin:0 0 10px;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:1px}
.charlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.charlist button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;transition:.15s}
.charlist button:hover{border-color:#d6c6ad;transform:translateY(-1px)}
.charlist .z{font-family:var(--kai);font-size:28px;line-height:1.15;color:var(--ink)}
.charlist .p{font-size:11px;color:var(--ink3)}
.charlist .n{font-size:9px;color:#c2b8a8;align-self:flex-start;margin:-3px 0 -6px 7px}
.charlist button.on{background:var(--accent);border-color:var(--accent)}
.charlist button.on .z,.charlist button.on .p,.charlist button.on .n{color:#fff}

.center{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{display:flex;align-items:center;gap:16px;padding:14px 20px 10px;flex:none}
.bigchar{width:62px;height:62px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-family:var(--kai);font-size:44px;position:relative}
.bigchar::before{content:"";position:absolute;inset:6px;border:1px dashed #e6c9bd;border-radius:6px;background:linear-gradient(transparent 49.5%,#f1e0d8 49.5%,#f1e0d8 50.5%,transparent 50.5%),linear-gradient(90deg,transparent 49.5%,#f1e0d8 49.5%,#f1e0d8 50.5%,transparent 50.5%);z-index:0}
.bigchar span{position:relative;z-index:1}
.ctitle .py{font-size:15px;color:var(--accent);font-weight:600}
.ctitle .meta{color:var(--ink3);font-size:12px;margin-top:3px}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:flex-end;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px;border-radius:2px}
.legend i.dash{border-top-style:dashed}
.stage{flex:1;position:relative;margin:0 16px 16px;border-radius:18px;background:
  radial-gradient(circle at 50% 50%,#fffdf8 0,#fbf6ec 60%,#f5eee1 100%);border:1px solid var(--line);overflow:hidden;min-height:0}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#e9dfcd 1px,transparent 1px);background-size:22px 22px;opacity:.55;pointer-events:none}
svg#net{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
svg#net.dragging{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:17px;color:var(--ink2)}
.zoom button:hover{color:var(--accent)}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--ink3);background:rgba(255,255,255,.7);padding:5px 10px;border-radius:8px;z-index:2}

/* svg styles */
.edge{fill:none;stroke-width:2.4;opacity:.85}
.edge.dim,.elabel.dim,.node.dim{opacity:.22}
.elabel text{font-size:11.5px;fill:var(--ink2)}
.elabel .pill{font-size:11px;font-weight:700;fill:#fff}
.node{cursor:pointer}
.node rect.box{fill:#fff;stroke:#e1d5c1;stroke-width:1.2;filter:drop-shadow(0 2px 4px rgba(80,50,20,.08))}
.node:hover rect.box{stroke:#c9b48f}
.node.sel rect.box{stroke:var(--accent);stroke-width:2.4}
.node text.lb{font-size:14px;fill:var(--ink);font-weight:600}
.node text.py{font-size:11px;fill:var(--accent)}
.center-node circle.halo{fill:var(--accent-soft)}
.center-node circle.core{fill:#fff;stroke:var(--accent);stroke-width:2.5}
.center-node.sel circle.core{stroke-width:4}
.center-node text.zi{font-family:var(--kai);font-size:58px;fill:var(--ink)}
.center-node text.tag{font-size:11px;fill:#fff;font-weight:700}
.center-node text.ol{font-size:12.5px;fill:var(--ink2);font-weight:600}

/* ---- side ---- */
.side{border-left:1px solid var(--line);background:var(--paper2);overflow-y:auto;padding:16px 16px 30px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid #efe6d6}
.dhead{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.dhead h2{margin:0;font-size:19px;flex:1;min-width:150px;line-height:1.35}
.dhead h2 .py{font-size:13px;color:var(--accent);font-weight:500;margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-确定{color:var(--c-sure);background:#e6f2ea}
.b-通行说法{color:var(--c-common);background:#f8eedb}
.b-待查{color:var(--c-tbd);background:#efebe5}
.tchip{display:inline-block;font-size:11.5px;color:#fff;padding:2px 9px;border-radius:6px;font-weight:700;margin-right:6px}
.from{margin:10px 0 0;font-size:13px;color:var(--ink2);line-height:1.6;background:#faf6ee;border-radius:10px;padding:8px 10px}
.sec{margin-top:14px}
.sec h4{margin:0 0 7px;font-size:12px;color:var(--ink3);letter-spacing:1px;font-weight:600;display:flex;align-items:center;gap:6px}
.sec h4::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--accent)}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--accent-soft);color:#9b3520;border-radius:8px;padding:4px 10px;font-size:14px;font-weight:600}
.txt{font-size:13.5px;line-height:1.7;color:var(--ink)}
.ex{font-size:14px;line-height:1.7}
.tag-ex{display:inline-block;font-size:10.5px;border:1px solid #d9b9ad;color:#a2533f;border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:1px}
.classic{border-left:3px solid #d8c4a3;padding:4px 0 4px 11px;background:linear-gradient(90deg,#faf5ea,transparent)}
.classic .q{font-family:var(--kai);font-size:17px;line-height:1.6}
.classic .s{font-size:12px;color:var(--ink3);margin:3px 0}
.classic .tr{font-size:13px;color:var(--ink2);line-height:1.6}
.tbd{font-size:13px;color:var(--c-tbd);background:#f3f0ea;border-radius:8px;padding:8px 10px}
.sw{font-family:var(--kai);font-size:17px;line-height:1.7;background:#fbf6ec;border-radius:10px;padding:10px 12px;border:1px solid #efe3cc}
.sw small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.6}
.evo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.evo div{border:1px dashed #d8c9b1;border-radius:10px;padding:8px 5px;text-align:center;background:#fffdf9;min-height:86px;display:flex;flex-direction:column;gap:4px}
.evo b{font-size:12px;color:var(--ink2)}
.evo .ph{flex:1;display:grid;place-items:center;font-size:10.5px;color:var(--ink3);line-height:1.45}
.evo .kai{font-family:var(--kai);font-size:22px;color:var(--ink)}
.parts{display:flex;flex-direction:column;gap:7px}
.part{display:flex;gap:10px;align-items:center;background:#fbf8f2;border-radius:10px;padding:8px 10px}
.part .g{font-family:var(--kai);font-size:21px;min-width:46px;text-align:center}
.part .role{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.role-义{background:#e3f0ec;color:var(--jade)} .role-音{background:#f8ead8;color:#b06a12} .role-记{background:#eeeae4;color:#7d766b}
.part .nt{font-size:12.5px;color:var(--ink2);line-height:1.5}
.struct{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:9px}
ul.pit{margin:0;padding-left:0;list-style:none}
ul.pit li{font-size:13px;line-height:1.6;padding:5px 0 5px 24px;position:relative;border-bottom:1px dashed #eee5d6}
ul.pit li:last-child{border-bottom:0}
ul.pit li::before{position:absolute;left:0;top:6px;width:17px;height:17px;border-radius:5px;font-size:10px;display:grid;place-items:center;font-weight:700}
ul.pit.r li::before{content:"读";background:#e8eef8;color:#3d62a8}
ul.pit.w li::before{content:"写";background:#f8e6e1;color:var(--accent)}
.code li::before{content:"密"!important;background:#efe8f7!important;color:var(--t-zhuanyu)!important}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.7;padding:2px 4px}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:.95;transform:translateX(-50%)}
@media (max-width:1100px){.main{grid-template-columns:120px 1fr 320px}.legend{display:none}}
@media (max-width:820px){
  body{overflow:auto}
  .main{grid-template-columns:1fr;grid-template-rows:auto 70vh auto}
  .left{border-right:0;border-bottom:1px solid var(--line)}
  .charlist{grid-template-columns:repeat(10,1fr)}
  .side{border-left:0}
}
</style>
</head>

  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>

      "note": "〔字形图占位〕"
     },
     {
      "stage": "小篆",
      "note": "〔字形图占位〕从网干声"
     },
     {
      "stage": "楷书",
      "note": "罕"
     }
    ],
    "reason": "字上部“冖”由“网”变来，《说文》释“网”，本义是捕鸟的网。",
    "c": "确定",
    "words": [
     "罕（网，古）",
     "罕车（待查）",
     "罕旗（待查）"
    ],
    "b": "罕＝网（上）＋干（音）。",
    "ex": "古人用长柄网捕鸟。",
    "cl": null,
    "cc": "待查"
   },
   "senses": [
    {
     "id": "s1",
     "l": "稀少",
     "p": "o",
     "t": "假借",
     "w": "借这个字的音表示“少”。",
     "words": [
      "罕见",
      "稀罕",
      "人迹罕至"
     ],
     "b": "人迹罕至＝很少有人的脚印到达。",
     "ex": "这是一种罕见的鸟。",
     "cl": {
      "q": "子罕言利与命与仁。",
      "s": "《论语·子罕》",
      "tr": "孔子很少谈论利益、命运和仁。"
     },
     "c": "确定"
    },
    {
     "id": "s2",
     "l": "觉得稀奇、珍惜",
     "p": "s1",
     "t": "引申",
     "w": "东西少，就觉得珍贵稀奇（口语）。",
     "words": [
      "稀罕",
      "不稀罕",
      "希罕"
     ],
     "b": "稀罕＝稀（少）＋罕（少），引申为珍惜。",
     "ex": "我才不稀罕那个玩具呢。",
     "cl": null,
     "c": "通行说法"
    }
   ],
   "structure": "形声字：冖（网）表义，干表音。",
   "parts": [
    {
     "g": "冖（网）",
     "role": "表义",
     "note": "网"
    },
    {
     "g": "干",
     "role": "表音",
     "note": "gān，古音与 hǎn 相近；汗、旱也用它"
    }
   ],
   "read": [
    "读 hǎn（三声），不读 hàn。"
   ],
   "write": [
    "上面是秃宝盖，里面有两点（八形），下面是“干”。",
    "下面是“干”，不要写成“千”或“于”。"
   ],
   "code": [
    "干族字：罕、汗、旱、杆、竿、岸，声旁“干”提示读音。",
    "网字头的变体：罕（冖）、罗（罒）、置（罒）。"
   ]
  }
 ]
}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const CH = DATA.chars;
const TYPES = DATA.types;
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = {i:0, sel:'o', v:{x:0,y:0,k:1}};

/* nav */
MENU.forEach((m,i)=>{
  const b=document.createElement('button'); b.textContent=m; b.className=i===0?'on':'off';
  b.onclick=()=>{ if(i!==0) toast('「'+m+'」模块即将上线，当前演示字义扩展图'); };
  $('nav').appendChild(b);
});
/* legend */
$('legend').innerHTML = Object.keys(TYPES).map(t=>`<span><i class="${t==='假借'?'dash':''}" style="border-color:${TYPES[t].color}"></i>${t}</span>`).join('');

/* char list */
CH.forEach((c,i)=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span><span class="z">${c.ch}</span><span class="p">${esc(c.origin.py.split(' / ')[0])}</span>`;
  b.onclick=()=>pick(i);
  $('charlist').appendChild(b);
});

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }

function wrap(s, n){ const out=[]; const a=[...s]; for(let i=0;i<a.length;i+=n) out.push(a.slice(i,i+n).join('')); return out; }
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* layout: subtree-weighted radial tree */
function layout(c){
  const byP={}; c.senses.forEach(s=>{(byP[s.p]=byP[s.p]||[]).push(s);});
  const size=id=>1+(byP[id]||[]).reduce((a,s)=>a+size(s.id),0);
  const R=[0,300,530,740];
  const pos={o:{x:0,y:0,a:-Math.PI/2,d:0}};
  let flip=1;
  function place(id,a0,a1,d){
    const kids=byP[id]||[]; if(!kids.length) return;
    if(d>=1){ const mid=(a0+a1)/2; const span=Math.min(a1-a0,2.4); a0=mid-span/2; a1=mid+span/2; }
    const tot=kids.reduce((a,s)=>a+size(s.id),0); let acc=a0;
    kids.forEach(s=>{
      const span=(a1-a0)*size(s.id)/tot; let a=acc+span/2;
      if(kids.length===1 && d>=1){ a=pos[id].a+0.34*flip; flip=-flip; }
      const r=R[Math.min(d+1,3)]; pos[s.id]={x:r*Math.cos(a),y:r*Math.sin(a),a,d:d+1};
      place(s.id,acc,acc+span,d+1); acc+=span;
    });
  }
  const first=(byP['o']||[]).length; const a0=-Math.PI/2-(first>1?Math.PI/ (size('o')-1):0);
  place('o',a0,a0+2*Math.PI,0);
  return pos;
}
function nodeDims(s){ const lines=wrap(s.l,8); const w=Math.max(...lines.map(l=>[...l].length))*15+30; const h=lines.length*19+(s.py?16:0)+18; return {lines,w,h}; }
function relax(labels, fixed){
  for(let it=0;it<120;it++){
    let moved=false;
    const push=(A,B,bothMove)=>{
      const ox=(A.w+B.w)/2+6-Math.abs(A.x-B.x), oy=(A.h+B.h)/2+6-Math.abs(A.y-B.y);
      if(ox<=0||oy<=0) return;
      moved=true;
      if(ox<oy){ const s=(A.x<B.x?-1:1)*ox; if(bothMove){A.x+=s/2;B.x-=s/2;} else A.x+=s; }
      else { const s=(A.y<B.y?-1:1)*oy; if(bothMove){A.y+=s/2;B.y-=s/2;} else A.y+=s; }
    };
    for(let i=0;i<labels.length;i++){
      for(let j=i+1;j<labels.length;j++) push(labels[i],labels[j],true);
      fixed.forEach(F=>push(labels[i],F,false));
    }
    if(!moved) break;
  }
}

let nodeEls={}, edgeEls=[];
function renderGraph(){
  const c=CH[state.i]; const vp=$('vp'); vp.innerHTML=''; nodeEls={}; edgeEls=[];
  const pos=layout(c);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  const dims={}; c.senses.forEach(s=>dims[s.id]=nodeDims(s));
  const fixed=[{x:0,y:0,w:212,h:212}].concat(c.senses.map(s=>({x:pos[s.id].x,y:pos[s.id].y,w:dims[s.id].w,h:dims[s.id].h})));
  const labels=c.senses.map(s=>{
    const A=pos[s.p], B=pos[s.id];
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    const nx=-(B.y-A.y), ny=(B.x-A.x); const L=Math.hypot(nx,ny)||1;
    const cx=mx+nx/L*16, cy=my+ny/L*16;
    const t=s.p==='o'?0.56:0.5;
    const lx=(1-t)*(1-t)*A.x+2*(1-t)*t*cx+t*t*B.x, ly=(1-t)*(1-t)*A.y+2*(1-t)*t*cy+t*t*B.y;
    const lines=wrap(s.w,10);
    return {s,A,B,cx,cy,lines,x:lx,y:ly,w:10*12+26,h:30+lines.length*15+10};
  });
  relax(labels,fixed);
  labels.forEach(lb=>{
    const {s,A,B,cx,cy,lines,w,h}=lb; const col=TYPES[s.t].color;
    const path=el('path',{d:`M${A.x},${A.y} Q${cx},${cy} ${B.x},${B.y}`,class:'edge',stroke:col},gE);
    if(s.t==='假借') path.setAttribute('stroke-dasharray','7 6');
    const g=el('g',{class:'elabel',transform:`translate(${lb.x},${lb.y})`},gL);
    el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:9,fill:'rgba(255,253,248,.95)',stroke:col,'stroke-opacity':.4},g);
    el('rect',{x:-21,y:-h/2+6,width:42,height:18,rx:6,fill:col},g);
    const tp=el('text',{class:'pill',x:0,y:-h/2+19,'text-anchor':'middle'},g); tp.textContent=s.t;
    lines.forEach((ln,k)=>{ const tx=el('text',{x:0,y:-h/2+42+k*15,'text-anchor':'middle'},g); tx.textContent=ln; });
    edgeEls.push({s,path,g});
  });
  c.senses.forEach(s=>{
    const P=pos[s.id]; const {lines,w,h}=dims[s.id]; const hasPy=!!s.py;
    const g=el('g',{class:'node',transform:`translate(${P.x},${P.y})`},gN);
    el('rect',{class:'box',x:-w/2,y:-h/2,width:w,height:h,rx:12},g);
    el('rect',{x:-w/2,y:-h/2+8,width:4,height:h-16,rx:2,fill:TYPES[s.t].color},g);
    el('circle',{cx:w/2-8,cy:-h/2+8,r:4,fill:DATA.cert[s.c].color},g);
    let y0=-h/2+9;
    if(hasPy){ const tp=el('text',{class:'py',x:0,y:y0+11,'text-anchor':'middle'},g); tp.textContent=s.py; y0+=15; }
    lines.forEach((ln,k)=>{ const t=el('text',{class:'lb',x:0,y:y0+15+k*19,'text-anchor':'middle'},g); t.textContent=ln; });
    g.addEventListener('click',e=>{e.stopPropagation(); select(s.id);});
    nodeEls[s.id]=g;
  });
  const g=el('g',{class:'node center-node'},gN);
  el('circle',{class:'halo',r:104},g);
  el('circle',{class:'core',r:86},g);
  el('rect',{x:-24,y:-70,width:48,height:19,rx:9,fill:'#c4472d'},g);
  const tg=el('text',{class:'tag',x:0,y:-56,'text-anchor':'middle'},g); tg.textContent='本义';
  const zi=el('text',{class:'zi',x:0,y:16,'text-anchor':'middle'},g); zi.textContent=c.ch;
  wrap(c.origin.label,8).slice(0,2).forEach((ln,k)=>{ const t=el('text',{class:'ol',x:0,y:42+k*16,'text-anchor':'middle'},g); t.textContent=ln; });
  g.addEventListener('click',e=>{e.stopPropagation(); select('o');});
  nodeEls['o']=g;
  highlight();
  requestAnimationFrame(fit);
}

function ancestors(id){ const c=CH[state.i]; const set=new Set([id]); let cur=c.senses.find(s=>s.id===id); while(cur){ set.add(cur.p); cur=c.senses.find(s=>s.id===cur.p);} return set; }
function highlight(){
  const sel=state.sel; const anc=ancestors(sel); const c=CH[state.i];
  const kids=new Set(c.senses.filter(s=>s.p===sel).map(s=>s.id));
  Object.entries(nodeEls).forEach(([id,g])=>{
    g.classList.toggle('sel',id===sel);
    g.classList.toggle('dim', sel!=='o' && !anc.has(id) && !kids.has(id));
  });
  edgeEls.forEach(({s,path,g})=>{
    const on = sel==='o' || (anc.has(s.id)&&anc.has(s.p)) || s.p===sel;
    path.classList.toggle('dim',!on); g.classList.toggle('dim',!on);
  });
}
function select(id){ state.sel=id; highlight(); renderSide(); }

/* pan & zoom */
const svg=$('net');
function apply(){ const v=state.v; $('vp').setAttribute('transform',`translate(${v.x},${v.y}) scale(${v.k})`); }
function fit(){
  const bb=$('vp').getBBox(); const r=svg.getBoundingClientRect(); if(!r.width) return;
  const pad=30; const k=Math.min((r.width-pad*2)/bb.width,(r.height-pad*2)/bb.height,1.15);
  state.v={k, x:r.width/2-(bb.x+bb.width/2)*k, y:r.height/2-(bb.y+bb.height/2)*k}; apply();
}
function zoomAt(f,px,py){ const v=state.v; const nk=Math.max(0.25,Math.min(3,v.k*f)); const s=nk/v.k; v.x=px-(px-v.x)*s; v.y=py-(py-v.y)*s; v.k=nk; apply(); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top); },{passive:false});
let drag=null; const pts=new Map();
svg.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1){ drag={x:e.clientX,y:e.clientY,vx:state.v.x,vy:state.v.y,moved:false}; } });
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; const r=svg.getBoundingClientRect();
    const others=[...pts.entries()].find(([id])=>id!==e.pointerId)[1];
    const d0=Math.hypot(prev.x-others.x,prev.y-others.y), d1=Math.hypot(a.x-b.x,a.y-b.y);
    if(d0>0) zoomAt(d1/d0,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); drag=null; return; }
  if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved && Math.hypot(dx,dy)>4){ drag.moved=true; svg.classList.add('dragging'); try{svg.setPointerCapture(e.pointerId);}catch(_){} }
  if(drag.moved){ state.v.x=drag.vx+dx; state.v.y=drag.vy+dy; apply(); }
});
function up(e){ pts.delete(e.pointerId); svg.classList.remove('dragging'); setTimeout(()=>{drag=null;},0); }
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{ if(drag&&drag.moved){e.stopPropagation();} },true);
$('zin').onclick=()=>{const r=svg.getBoundingClientRect(); zoomAt(1.25,r.width/2,r.height/2);};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect(); zoomAt(0.8,r.width/2,r.height/2);};
$('zfit').onclick=fit;
window.addEventListener('resize',()=>{clearTimeout(fit._t); fit._t=setTimeout(fit,120);});

/* side panel */
function badge(c){ return `<span class="badge b-${c}" title="${esc(DATA.cert[c].desc)}">${c}</span>`; }
function classicHTML(cl){
  if(!cl) return `<div class="tbd">待查：暂未核对到可靠的文言原句，宁缺勿编。</div>`;
  return `<div class="classic"><div class="q">${esc(cl.q)}</div><div class="s">—— ${esc(cl.s)}</div><div class="tr">译文：${esc(cl.tr)}</div></div>`;
}
function detailBlock(n){
  return `
  <div class="sec"><h4>词族</h4><div class="words">${n.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
  <div class="sec"><h4>构词拆解</h4><div class="txt">${esc(n.b)}</div></div>
  <div class="sec"><h4>现代例句</h4><div class="ex"><span class="tag-ex">示例</span>${esc(n.ex)}</div></div>
  <div class="sec"><h4>文言原句</h4>${classicHTML(n.cl)}</div>`;
}
function roleCls(r){ return r.indexOf('义')>=0?'role-义':(r.indexOf('音')>=0?'role-音':'role-记'); }
function renderSide(){
  const c=CH[state.i]; const o=c.origin; let top='';
  if(state.sel==='o'){
    top=`<div class="card">
      <div class="dhead"><h2>本义 · ${esc(o.label)}<span class="py">${esc(o.py)}</span></h2>${badge(o.c)}</div>
      <div class="sec"><h4>《说文解字》原文</h4><div class="sw">${esc(o.sw)}<small>${esc(o.swnote)}</small></div></div>
      <div class="sec"><h4>字形演变</h4><div class="evo">${o.evo.map((e,k)=>`<div><b>${e.stage}</b><span class="ph ${k===3?'kai':''}">${esc(e.note)}</span></div>`).join('')}</div></div>
      <div class="sec"><h4>本义判定理由</h4><div class="txt">${esc(o.reason)}</div></div>
      ${detailBlock(o)}
      <div class="sec"><h4>把握程度</h4><div class="txt">本义判定：${badge(o.c)}　本节点例证：${badge(o.cc)}</div></div>
    </div>`;
  } else {
    const s=c.senses.find(x=>x.id===state.sel);
    const par=s.p==='o'?('本义「'+o.label+'」'):('「'+c.senses.find(x=>x.id===s.p).l+'」');
    top=`<div class="card">
      <div class="dhead"><h2>${esc(s.l)}${s.py?`<span class="py">${esc(s.py)}</span>`:''}</h2>${badge(s.c)}</div>
      <div class="from"><span class="tchip" style="background:${TYPES[s.t].color}">${s.t}</span>由${esc(par)}而来：${esc(s.w)}</div>
      ${detailBlock(s)}
      <div class="sec"><h4>把握程度</h4><div class="txt">${badge(s.c)}　${esc(DATA.cert[s.c].desc)}</div></div>
    </div>`;
  }
  const side=`
  <div class="card">
    <h3>偏旁拆分</h3>
    <div class="struct">${esc(c.structure)}</div>
    <div class="parts">${c.parts.map(p=>`<div class="part"><span class="g">${esc(p.g)}</span><span class="role ${roleCls(p.role)}">${esc(p.role)}</span><span class="nt">${esc(p.note)}</span></div>`).join('')}</div>
  </div>
  <div class="card">
    <h3>易读错 · 易写错</h3>
    <ul class="pit r">${c.read.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <ul class="pit w">${c.write.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  </div>
  <div class="card">
    <h3>相关汉字密码</h3>
    <ul class="pit code">${c.code.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  </div>
  <div class="foot">把握程度：<b style="color:var(--c-sure)">确定</b>＝有字书或原典直接支持；<b style="color:var(--c-common)">通行说法</b>＝教材、辞书常见解释，学界或有异说；<b style="color:var(--c-tbd)">待查</b>＝暂未核实，不作结论。例句标“示例”者均为自编。字形图为占位，待替换为正式字形图片。</div>`;
  $('side').innerHTML=top+side; $('side').scrollTop=0;
}

function pick(i){
  state.i=(i+CH.length)%CH.length; state.sel='o';
  const c=CH[state.i];
  [...$('charlist').children].forEach((b,k)=>b.classList.toggle('on',k===state.i));
  $('hz').textContent=c.ch; $('hzpy').textContent=c.origin.py;
  const cnt={}; c.senses.forEach(s=>cnt[s.t]=(cnt[s.t]||0)+1);
  $('hzmeta').textContent=(c.origin.trad!==c.ch?'繁体 '+c.origin.trad+' · ':'')+c.senses.length+' 个扩展义项 · '+Object.entries(cnt).map(([t,n])=>t+n).join(' ');
  renderGraph(); renderSide();
}
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){e.preventDefault();pick(state.i+1);} if(e.key==='ArrowUp'){e.preventDefault();pick(state.i-1);} if(e.key==='Escape') select('o'); });
svg.addEventListener('click',()=>{ if(state.sel!=='o') select('o'); });
pick(0);
})();
</script>
