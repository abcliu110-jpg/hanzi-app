<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · maps-116</title>
<style>
:root{
  --bg:#f7f2e8; --paper:#fffdf8; --ink:#2b2622; --muted:#7a6f63; --line:#e6dccb;
  --brand:#c2412d; --brand-soft:#fbe9e4;
  --t-yin:#2f8f83; --t-bi:#e08a2b; --t-zhuan:#7a5bb5; --t-jia:#5a7896;
  --c-ok:#2f8f5b; --c-tong:#3b74b8; --c-dai:#b8862b;
  --shadow:0 6px 24px rgba(80,60,30,.08); --r:16px;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.kai{font-family:"STKaiti","KaiTi","Kaiti SC","楷体",serif}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.04);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo .seal{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit}
nav.top button:hover{background:#f3ece0;color:var(--ink)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600}
.batch{font-size:12px;color:var(--muted);white-space:nowrap}
/* layout */
main{flex:1;display:grid;grid-template-columns:200px 1fr 330px;min-height:0}
aside.left{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px}
.side-title{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:4px 6px 10px}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chars button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s;font-family:inherit}
.chars button b{font-size:26px;font-weight:500}
.chars button small{font-size:11px;color:var(--muted)}
.chars button:hover{border-color:var(--brand);transform:translateY(-1px)}
.chars button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chars button.on small{color:#ffe3dc}
/* center */
section.stage{position:relative;min-width:0;display:flex;flex-direction:column}
.stage-head{display:flex;align-items:flex-end;gap:16px;padding:16px 22px 8px}
.big{font-size:56px;line-height:1;color:var(--brand)}
.stage-head h1{font-size:20px}
.stage-head .sub{font-size:13px;color:var(--muted);margin-top:4px}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
.canvas{flex:1;margin:0 16px 16px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;
  background-image:radial-gradient(#eadfcd 1px,transparent 1px);background-size:22px 22px}
svg#map{width:100%;height:100%;cursor:grab;display:block;user-select:none}
svg#map.drag{cursor:grabbing}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--ink)}
.zoom button:hover{border-color:var(--brand);color:var(--brand)}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted)}
.node{cursor:pointer}
.node rect{transition:filter .15s}
.node:hover rect{filter:drop-shadow(0 4px 8px rgba(80,60,30,.18))}
.node.sel rect.box{stroke:var(--ink);stroke-width:2.5}
/* detail drawer */
.drawer{position:absolute;top:14px;left:14px;width:min(400px,calc(100% - 28px));max-height:calc(100% - 28px);overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(60,40,20,.18);border:1px solid var(--line);padding:18px 18px 16px;display:none}
.drawer.show{display:block;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.drawer .x{position:absolute;right:10px;top:10px;border:0;background:#f3ece0;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--muted)}
.drawer h2{font-size:19px;margin-bottom:4px;padding-right:30px}
.drawer h2 .py{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.blk{margin-top:14px}
.blk h3{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;color:#fff;font-weight:600}
.cert{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1.5px solid;font-weight:600}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words span{background:var(--brand-soft);color:var(--brand);padding:5px 12px;border-radius:10px;font-size:15px}
.quote{background:#faf5ec;border-left:4px solid var(--brand);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px;line-height:1.7}
.quote .src{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.quote .tr{display:block;font-size:13px;color:#4c443c;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.pending{color:var(--c-dai);background:#fbf3e2;border:1px dashed #e5c98f;padding:8px 12px;border-radius:10px;font-size:13px}
.tag-sample{font-size:11px;background:#eef3f8;color:var(--t-jia);padding:1px 7px;border-radius:6px;margin-right:6px;font-weight:600}
.p{font-size:14px;line-height:1.7}
.evo{display:flex;flex-direction:column;gap:5px}
.evo div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.evo div b{width:44px;height:44px;border:1.5px dashed #d8cbb5;border-radius:10px;display:grid;place-items:center;font-size:11px;color:#b4a68f;font-weight:400;flex:none}
/* right sidebar */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h4{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h4 em{font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#fff}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:10px;align-items:center}
.part .pz{min-width:56px;padding:6px 8px;border-radius:10px;background:#faf5ec;text-align:center;font-size:16px}
.part .pr{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.part .pn{font-size:12px;color:var(--muted)}
.r-yi{background:#e4f3f0;color:var(--t-yin)} .r-yin{background:#fdf0df;color:var(--t-bi)} .r-xing{background:#eef0f4;color:var(--t-jia)}
ul.li{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.li li{font-size:13px;line-height:1.6;padding-left:16px;position:relative}
ul.li li::before{content:"";position:absolute;left:3px;top:8px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4}
.sub-h{font-size:12px;color:var(--muted);margin:8px 0 5px;font-weight:600}
.sub-h:first-of-type{margin-top:0}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1}
@media (max-width:1100px){main{grid-template-columns:160px 1fr}aside.right{display:none}}
</style>
</head>

  // count leaves for angular share

    n.depth=d; const tot=n.children.reduce((a,b)=>a+leaves(b),0); let a=a0;
    n.children.forEach(ch=>{const span=(a1-a0)*leaves(ch)/tot; const mid=a+span/2;
      ch.angle=mid; const rr=R[Math.min(d+1,3)]; ch.x=Math.cos(mid)*rr*1.2; ch.y=Math.sin(mid)*rr*.8;
      place(ch,a,a+span,d+1); a+=span;});
  }
  place(nodes.root,-Math.PI*0.62,Math.PI*1.38,0);
  return nodes;
}

function render(){
  const c=DATA.chars[cur]; const N=layout(c); const vp=$('#vp'); let edges='',labels='',boxes='';
  c.senses.forEach(s=>{
    const n=N[s.id],p=N[s.parent],col=TYPE[s.type];
    const mx=(n.x+p.x)/2,my=(n.y+p.y)/2;
    const cx=mx+(p.y-n.y)*.08, cy=my-(p.x-n.x)*.08;
    edges+=`<path d="M${p.x},${p.y} Q${cx},${cy} ${n.x},${n.y}" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="${s.type==='假借'?'7 6':'none'}" opacity=".85"/>`;
    const lx=(p.x+2*cx+n.x)/4, ly=(p.y+2*cy+n.y)/4;
    const lines=wrap(s.why,13).slice(0,3); const w=Math.max(...lines.map(l=>measure(l,11)))+16, h=26+lines.length*14;
    labels+=`<g transform="translate(${lx},${ly})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="9" fill="#fffdf8" stroke="${col}" stroke-opacity=".35"/>
      <rect x="-20" y="${-h/2+5}" width="40" height="16" rx="8" fill="${col}"/><text x="0" y="${-h/2+17}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${s.type}</text>
      ${lines.map((l,i)=>`<text x="0" y="${-h/2+35+i*14}" font-size="11" fill="#5b5148" text-anchor="middle">${esc(l)}</text>`).join('')}</g>`;
  });
  c.senses.forEach(s=>{
    const n=N[s.id],col=TYPE[s.type],cc=CERT[s.cert]; const w=Math.max(measure(s.label,16),measure(s.words.slice(0,2).join('·'),11))+40;
    boxes+=`<g class="node${selId===s.id?' sel':''}" data-id="${s.id}" transform="translate(${n.x},${n.y})">
      <rect class="box" x="${-w/2}" y="-27" width="${w}" height="54" rx="14" fill="#fff" stroke="${col}" stroke-width="2"/>
      <rect x="${-w/2}" y="-27" width="7" height="54" rx="3" fill="${col}"/>
      <circle cx="${w/2-10}" cy="-17" r="4.5" fill="${cc}"><title>${s.cert}</title></circle>
      <text x="4" y="-3" font-size="16" font-weight="700" fill="#2b2622" text-anchor="middle">${esc(s.label)}</text>
      <text x="4" y="16" font-size="11" fill="#8a7e70" text-anchor="middle">${esc(s.py)} · ${esc(s.words.slice(0,2).join('、'))}</text></g>`;
  });
  const r=c.root, rl=wrap(r.label,9);
  boxes+=`<g class="node${selId==='root'?' sel':''}" data-id="root">
    <circle r="92" fill="#c2412d" opacity=".08"/><circle r="74" fill="#fff" stroke="#c2412d" stroke-width="3"/>
    <text y="-14" font-size="44" fill="#c2412d" text-anchor="middle" class="kai" style="font-family:STKaiti,KaiTi,serif">${c.ch}</text>
    <text y="10" font-size="11" fill="#8a7e70" text-anchor="middle">本义</text>
    ${rl.map((l,i)=>`<text y="${28+i*15}" font-size="13" font-weight="700" fill="#2b2622" text-anchor="middle">${esc(l)}</text>`).join('')}
    <circle cx="52" cy="-52" r="6" fill="${CERT[r.cert]}"><title>${r.cert}</title></circle></g>`;
  vp.innerHTML=edges+labels+boxes;
  apply();
}

function apply(){ $('#vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){ const s=$('#map').getBoundingClientRect(); view={x:s.width/2,y:s.height/2,k:Math.min(s.width/1500,s.height/1050,1.1)}; apply(); }

function show(i){
  cur=i; selId=null; const c=DATA.chars[i];
  document.querySelectorAll('#charlist button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('#bigch').textContent=c.ch; $('#title').textContent=`「${c.ch}」字义扩展图`;
  $('#subtitle').textContent=`${c.py}${c.trad!==c.ch?' · 繁体 '+c.trad:''} · 本义 1 项 · 常用义项 ${c.senses.length} 项`;
  $('#drawer').classList.remove('show'); render(); fit(); side(c);
}

const certTag = c => `<span class="cert" style="color:${CERT[c]};border-color:${CERT[c]}">${c}</span>`;

function detail(id){
  const c=DATA.chars[cur]; selId=id; render(); const d=$('#drawer'); let h='<button class="x" onclick="closeD()">✕</button>';
  if(id==='root'){
    const r=c.root;
    h+=`<h2>本义：${esc(r.label)}</h2><div style="margin-top:6px">${certTag(r.cert)}</div>
    <div class="blk"><h3>《说文》原文</h3><div class="quote kai">${esc(r.shuowen)}<span class="src">${esc(r.src)}</span></div></div>
    <div class="blk"><h3>字形演变</h3><div class="evo">${r.evo.map(e=>{const [a,b]=e.split('：');return `<div><b>${a}</b>${esc(b)}</div>`}).join('')}</div></div>
    <div class="blk"><h3>本义判定理由</h3><p class="p">${esc(r.reason)}</p>${r.note?`<p class="p" style="color:var(--muted);font-size:13px;margin-top:4px">注：${esc(r.note)}</p>`:''}</div>
    ${r.cl?`<div class="blk"><h3>文言原句</h3><div class="quote kai">${esc(r.cl.t)}<span class="src">${esc(r.cl.s)}</span><span class="tr">译文：${esc(r.cl.tr)}</span></div></div>`:''}`;
  } else {
    const s=c.senses.find(x=>x.id===id), p=s.parent==='root'?'本义':c.senses.find(x=>x.id===s.parent).label;
    h+=`<h2>${esc(s.label)}<span class="py">${esc(s.py)}</span></h2>
    <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap"><span class="chip" style="background:${TYPE[s.type]}">${s.type}</span><span style="font-size:12px;color:var(--muted)">由「${esc(p)}」而来</span></div>
    <p class="p" style="margin-top:8px">${esc(s.why)}</p>
    <div class="blk"><h3>词族</h3><div class="words">${s.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
    <div class="blk"><h3>构词拆解</h3><p class="p">${esc(s.build)}</p></div>
    <div class="blk"><h3>现代例句</h3><p class="p">${s.ex.sample?'<span class="tag-sample">示例</span>':''}${esc(s.ex.t)}</p></div>
    <div class="blk"><h3>文言原句</h3>${s.cl.pending?'<div class="pending">待查：暂未核实到可靠的文言用例与出处。</div>':`<div class="quote kai">${esc(s.cl.t)}<span class="src">${esc(s.cl.s)}</span><span class="tr">译文：${esc(s.cl.tr)}</span></div>`}</div>
    <div class="blk"><h3>把握程度</h3>${certTag(s.cert)}</div>`;
  }
  d.innerHTML=h; d.classList.add('show');
}
function closeD(){ $('#drawer').classList.remove('show'); selId=null; render(); }

function side(c){
  const roleCls=r=>r.startsWith('表义')?'r-yi':r.startsWith('表音')?'r-yin':'r-xing';
  $('#side').innerHTML=`
  <div class="card"><h4><em style="background:var(--t-yin)">拆</em>偏旁拆分</h4><div class="parts">
    ${c.parts.map(p=>`<div class="part"><div class="pz kai">${esc(p.p)}</div><div><span class="pr ${roleCls(p.role)}">${esc(p.role)}</span><div class="pn">${esc(p.note)}</div></div></div>`).join('')}</div></div>
  <div class="card"><h4><em style="background:var(--brand)">错</em>易读错 · 易写错</h4>
    <div class="sub-h">🔊 易读错</div><ul class="li" style="color:var(--brand)">${c.read.map(x=>`<li style="color:var(--ink)">${esc(x)}</li>`).join('')}</ul>
    <div class="sub-h">✏️ 易写错</div><ul class="li" style="color:var(--brand)">${c.write.map(x=>`<li style="color:var(--ink)">${esc(x)}</li>`).join('')}</ul></div>
  <div class="card"><h4><em style="background:var(--t-zhuan)">密</em>汉字密码</h4><ul class="li" style="color:var(--t-zhuan)">${c.code.map(x=>`<li style="color:var(--ink)">${esc(x)}</li>`).join('')}</ul></div>
  <div class="card" style="background:#faf5ec"><h4 style="margin-bottom:6px">图例说明</h4><p style="font-size:12px;line-height:1.7;color:var(--muted)">实线连线为意义相承（引申、比喻、转喻），虚线为假借（只借字形或读音）。义项右上角圆点表示把握程度：绿＝确定，蓝＝通行说法，金＝待查。</p></div>`;
}

// interactions
const svg=$('#map'); let drag=null, moved=false;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false;svg.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;apply();});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('drag');});
svg.addEventListener('click',e=>{if(moved)return;const g=e.target.closest('.node');if(g)detail(g.dataset.id);});
function zoomAt(f,cx,cy){const k=Math.max(.3,Math.min(3,view.k*f));view.x=cx-(cx-view.x)*k/view.k;view.y=cy-(cy-view.y)*k/view.k;view.k=k;apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
// touch
let tp=null;
svg.addEventListener('touchstart',e=>{if(e.touches.length===1){const t=e.touches[0];drag={x:t.clientX,y:t.clientY,vx:view.x,vy:view.y};moved=false;}else if(e.touches.length===2){drag=null;tp={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)};}},{passive:true});
svg.addEventListener('touchmove',e=>{e.preventDefault();if(drag&&e.touches.length===1){const t=e.touches[0];const dx=t.clientX-drag.x,dy=t.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;apply();}else if(tp&&e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const r=svg.getBoundingClientRect();zoomAt(d/tp.d,r.width/2,r.height/2);tp.d=d;}},{passive:false});
svg.addEventListener('touchend',()=>{drag=null;tp=null;});
$('#zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$('#zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$('#zreset').onclick=fit;
window.addEventListener('resize',fit);
show(0);
</script>
<script src="../xzq-back.js" data-home="../index.html"></script>
</body>
</html>
