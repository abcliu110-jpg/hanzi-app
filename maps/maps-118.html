<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 儿童汉字学习</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2a33; --ink2:#5d5a66; --mute:#9a95a3;
  --line:#e7dfcf; --brand:#c8553d; --brand-soft:#f6e1d9;
  --yin:#2a9d8f; --bi:#e9902f; --zhuan:#7b5ea7; --jia:#4a78b5;
  --ok:#2f9e63; --mid:#d39b1f; --tbd:#b0464a;
  --r:16px; --shadow:0 6px 20px rgba(80,60,30,.08);
  --serif:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{display:flex;flex-direction:column;overflow:hidden}
/* top nav */
.top{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo b{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:22px}
.logo small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.menu{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.menu button{border:0;background:none;padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.menu button:hover{background:#f3ece0}
.menu button.on{background:var(--brand);color:#fff;font-weight:600}
.menu button.off{opacity:.55}
/* layout */
.wrap{flex:1;display:grid;grid-template-columns:200px 1fr 360px;min-height:0}
.left{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.left h3{margin:14px 16px 8px;font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.08em}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 12px 16px;overflow:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;cursor:pointer;text-align:center;transition:.15s}
.chip:hover{border-color:var(--brand);transform:translateY(-1px)}
.chip .h{font-family:var(--serif);font-size:28px;line-height:1.1}
.chip .p{font-size:11px;color:var(--mute)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on .p{color:#ffe7df}
/* stage */
.stage{position:relative;min-width:0;min-height:0;background:
  radial-gradient(circle at 50% 50%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(200,180,140,.12) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(200,180,140,.12) 31px 32px)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.drag{cursor:grabbing}
.head{position:absolute;left:18px;top:14px;display:flex;align-items:center;gap:14px;pointer-events:none}
.head .big{font-family:var(--serif);font-size:54px;line-height:1;background:var(--paper);border:1px solid var(--line);border-radius:18px;width:78px;height:78px;display:grid;place-items:center;box-shadow:var(--shadow)}
.head .t1{font-size:20px;font-weight:700}
.head .t2{font-size:12px;color:var(--ink2);margin-top:3px}
.tools{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;gap:6px}
.tools button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:18px;cursor:pointer;color:var(--ink2);box-shadow:var(--shadow)}
.tools button:hover{color:var(--brand)}
.legend{position:absolute;left:18px;bottom:14px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;max-width:calc(100% - 36px)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend label{cursor:pointer;color:var(--ink2)}
.hint{position:absolute;right:16px;bottom:14px;font-size:11px;color:var(--mute)}
/* graph */
.edge{fill:none;stroke-width:2.6;stroke-linecap:round}
.elabel rect{rx:10}
.node{cursor:pointer}
.node rect{transition:filter .15s}
.node:hover rect{filter:drop-shadow(0 4px 8px rgba(80,60,30,.18))}
.node.sel rect.card{stroke-width:3}
.why{font-size:11.5px;fill:var(--ink2)}
.hideWhy .why{display:none}
/* right */
.right{background:var(--paper);border-left:1px solid var(--line);overflow:auto;min-height:0;padding:16px 16px 30px}
.card2{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card2 h4{margin:0 0 10px;font-size:13px;color:var(--mute);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.card2 h4:before{content:"";width:4px;height:13px;border-radius:2px;background:var(--brand)}
.sname{font-size:20px;font-weight:700;margin:0 0 4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600}
.tag.o{background:none;border:1px solid currentColor}
.row{margin:10px 0;font-size:14px;line-height:1.75}
.row .k{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--brand-soft);color:#8f3420;padding:3px 10px;border-radius:8px;font-size:14px}
.demo{font-size:11px;background:#eef1f6;color:#4a5a78;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.gw{font-family:var(--serif);font-size:17px;background:#fbf6ea;border-left:3px solid #d8b56a;padding:8px 10px;border-radius:0 8px 8px 0}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.tbd{color:var(--tbd);font-size:13px}
.sw{font-family:var(--serif);font-size:17px;line-height:1.7;background:#fbf6ea;border-radius:10px;padding:10px 12px}
.forms{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.forms .f{width:52px;text-align:center}
.forms .f div{height:46px;border:1.5px dashed #cdbf9f;border-radius:10px;display:grid;place-items:center;color:#b3a27c;font-size:11px;background:#fffaf0}
.forms .f span{font-size:11px;color:var(--mute)}
.forms .ar{color:#cdbf9f}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.part{flex:1 1 130px;border-radius:12px;padding:10px;border:1px solid var(--line)}
.part .pp{font-family:var(--serif);font-size:22px}
.part .rr{font-size:11px;font-weight:700;margin:2px 0}
.part .nn{font-size:12px;color:var(--ink2)}
.part.表义{background:#eaf6f3;border-color:#bfe3dc}.part.表义 .rr{color:var(--yin)}
.part.表音{background:#eef3fb;border-color:#c9d8ee}.part.表音 .rr{color:var(--jia)}
.part.表音兼表义{background:#f3eefa;border-color:#d8cbec}.part.表音兼表义 .rr{color:var(--zhuan)}
.part.其他{background:#f6f3ee}.part.其他 .rr{color:var(--mute)}
ul.l{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75}
ul.l li::marker{color:var(--brand)}
.sub{font-size:12px;font-weight:700;color:var(--ink2);margin:8px 0 2px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:1100px){.wrap{grid-template-columns:160px 1fr 300px}.chars{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><b>字</b><div>汉字小达人<small>儿童汉字学习</small></div></div>
  <nav class="menu" id="menu"></nav>
</header>
<div class="wrap">
  <aside class="left">
    <h3>本组 20 字</h3>
    <div class="chars" id="chars"></div>
  </aside>
  <main class="stage" id="stage">
    <svg id="svg"><defs id="defs"></defs><g id="vp"></g></svg>
    <div class="head"><div class="big" id="hChar"></div><div><div class="t1" id="hT1"></div><div class="t2" id="hT2"></div></div></div>
    <div class="tools">
      <button id="zin" title="放大">＋</button><button id="zout" title="缩小">－</button><button id="zfit" title="适应窗口">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="hint">滚轮缩放 · 拖动平移 · 点击义项看详情</div>
  </main>
  <aside class="right" id="right"></aside>
</div>
<div class="toast" id="toast"></div>

害怕）＋恐（恐惧）。","ex":"小鹿惊惶地跑进树林。","gw":"惶恐滩头说惶恐，零丁洋里叹零丁。","src":"文天祥《过零丁洋》","tr":"在惶恐滩说起兵败的惶恐，在零丁洋叹息自己的孤苦。"},"senses":[{"id":"a","from":"origin","name":"不知怎么办","type":"引申","why":"害怕得心里没主意","words":["惶惑","彷徨（近义）","惶然"],"build":"惶惑＝惶（害怕）＋惑（迷惑）。","ex":"他站在路口，显得很惶惑。","gw":"","src":"","tr":"","conf":"确定"}],"parts":[{"part":"忄","role":"表义","note":"心理"},{"part":"皇","role":"表音","note":"huáng，读音相同"}],"read":["读 huáng，后鼻音。"],"write":["右边“皇”：上“白”下“王”，不是“自”。"],"codes":["皇声字：惶、煌、蝗、凰、徨、篁——读 huang。","惶（忄，害怕）、煌（火，明亮）、蝗（虫，蝗虫）。"]},{"char":"狐","pinyin":"hú","structure":"形声字","origin":{"name":"狐狸","gloss":"尾巴蓬松、机灵的野兽","shuowen":"狐，䄏獸也。鬼所乘之。……从犬瓜聲。","shuowenNote":"见《说文·犬部》，中间描写狐有“三德”，此处省略。","reason":"形旁“犭”表示兽类，《说文》释为一种野兽，即狐狸。","conf":"确定","words":["狐狸","白狐","狐假虎威"],"build":"狐假虎威＝狐狸借老虎的威风。","ex":"狐狸有一条蓬松的大尾巴。","gw":"虎求百兽而食之，得狐。","src":"《战国策·楚策一》","tr":"老虎寻找各种野兽来吃，抓到了一只狐狸。"},"senses":[{"id":"a","from":"origin","name":"多疑","type":"比喻","why":"传说狐狸做事总是犹犹豫豫","words":["狐疑","满腹狐疑","狐疑不决"],"build":"狐疑＝像狐狸一样多疑。","ex":"他满腹狐疑地看着这个盒子。","gw":"","src":"","tr":"","conf":"通行说法"},{"id":"b","from":"origin","name":"狡猾、坏人","type":"比喻","why":"故事里狐狸常常很狡猾","words":["狐朋狗友","老狐狸","狐群狗党"],"build":"狐朋狗友＝比喻不正经的朋友。","ex":"不要结交狐朋狗友。","gw":"","src":"","tr":"","conf":"确定"}],"parts":[{"part":"犭","role":"表义","note":"兽类"},{"part":"瓜","role":"表音","note":"guā→hú"}],"read":["读 hú，第二声。"],"write":["右边是“瓜”，里面的点和竖提别丢，不要写成“爪”。"],"codes":["瓜声字：狐、孤、弧、呱——读音分化。","犭旁表示兽类：狐、猿、狼、猫。"]}]</script>
<script>
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const TYPE = {"引申":"#2a9d8f","比喻":"#e9902f","转喻":"#7b5ea7","假借":"#4a78b5"};
const CONF = {"确定":"#2f9e63","通行说法":"#d39b1f","待查":"#b0464a"};
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SVGNS = "http://www.w3.org/2000/svg";
let cur = 0, sel = "origin", T = {k:1,x:0,y:0};

/* ---- menus ---- */
$("#menu").innerHTML = MENU.map((m,i)=>`<button class="${i?'off':'on'}" data-i="${i}">${m}</button>`).join("");
$("#menu").onclick = e => { const b=e.target.closest("button"); if(!b||b.dataset.i==="0") return; toast(`「${b.textContent}」模块在其他页面实现，本页只做「字义扩展图」`); };
$("#chars").innerHTML = DATA.map((c,i)=>`<div class="chip" data-i="${i}"><div class="h">${c.char}</div><div class="p">${esc(c.pinyin)}</div></div>`).join("");
$("#chars").onclick = e => { const c=e.target.closest(".chip"); if(c) pick(+c.dataset.i); };
$("#legend").innerHTML = Object.entries(TYPE).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join("")
 + `<span style="color:var(--mute)">｜</span>` + Object.entries(CONF).map(([k,v])=>`<span style="color:${v};font-weight:600">● ${k}</span>`).join("")
 + `<label><input type="checkbox" id="showWhy" checked> 线上显示原因</label>`;
$("#showWhy").onchange = e => $("#svg").classList.toggle("hideWhy", !e.target.checked);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200);}

/* ---- layout ---- */
function layout(ch){
  const nodes = {origin:{id:"origin",x:0,y:0,depth:0,data:ch.origin}};
  const kids = id => ch.senses.filter(s=>s.from===id);
  const lv1 = kids("origin");
  const weight = s => 1 + kids(s.id).reduce((a,k)=>a+weight(k),0)*0.8;
  const total = lv1.reduce((a,s)=>a+weight(s),0);
  let acc = 0;
  lv1.forEach(s=>{
    const w = weight(s), ang = -Math.PI/2 + (acc + w/2)/total*Math.PI*2; acc += w;
    place(s, ang, 1, w/total*Math.PI*2);
  });
  function place(s, ang, depth, span){
    const R = depth===1 ? 270 : 270 + (depth-1)*235;
    nodes[s.id] = {id:s.id, x:Math.cos(ang)*R, y:Math.sin(ang)*R, depth, data:s, ang};
    const ks = kids(s.id); if(!ks.length) return;
    const step = Math.min(0.55, Math.max(0.32, span/ (ks.length+0.5)));
    ks.forEach((k,j)=> place(k, ang + (j-(ks.length-1)/2)*step, depth+1, step));
  }
  return nodes;
}
function el(tag, attrs={}, parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent&&parent.appendChild(e); return e; }
function wrap(text, n){ const out=[]; for(let i=0;i<text.length;i+=n) out.push(text.slice(i,i+n)); return out.slice(0,3); }

function render(){
  const ch = DATA[cur], vp = $("#vp"); vp.innerHTML = "";
  const N = layout(ch);
  const gE = el("g",{},vp), gL = el("g",{},vp), gN = el("g",{},vp);
  ch.senses.forEach(s=>{
    const a=N[s.from], b=N[s.id], col=TYPE[s.type]||"#999";
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const cx=mx - dy/len*28, cy=my + dx/len*28;
    el("path",{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,class:"edge",stroke:col,"stroke-dasharray":s.type==="假借"?"7 6":"",opacity:.85},gE);
    const lx=(a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    const g=el("g",{class:"elabel",transform:`translate(${lx},${ly})`},gL);
    el("rect",{x:-22,y:-11,width:44,height:22,fill:col},g);
    const t=el("text",{"text-anchor":"middle",y:4.5,fill:"#fff","font-size":12.5,"font-weight":700},g); t.textContent=s.type;
    const lines = wrap(s.why, 11);
    const bw = Math.max(...lines.map(l=>l.length))*12+14;
    const wg = el("g",{class:"why"},g);
    el("rect",{x:-bw/2,y:15,width:bw,height:lines.length*16+8,rx:7,fill:"rgba(255,253,248,.94)",stroke:col,"stroke-opacity":.35},wg);
    lines.forEach((l,i)=>{ const tt=el("text",{"text-anchor":"middle",y:31+i*16},wg); tt.textContent=l; });
  });
  // origin
  const o = el("g",{class:"node"+(sel==="origin"?" sel":""),"data-id":"origin"},gN);
  el("circle",{r:98,fill:"#fff",stroke:"#e7dfcf","stroke-width":2},o);
  el("circle",{r:86,fill:"#fff6ee",stroke:"#c8553d","stroke-width":sel==="origin"?4:2.5,class:"card"},o);
  let t=el("text",{"text-anchor":"middle",y:-14,"font-size":62,style:"font-family:var(--serif)",fill:"#2b2a33"},o); t.textContent=ch.char;
  const tag=el("g",{transform:"translate(0,22)"},o);
  el("rect",{x:-24,y:-10,width:48,height:20,rx:10,fill:"#c8553d"},tag);
  t=el("text",{"text-anchor":"middle",y:4.5,"font-size":12,fill:"#fff","font-weight":700},tag); t.textContent="本义";
  t=el("text",{"text-anchor":"middle",y:52,"font-size":15,"font-weight":700,fill:"#2b2a33"},o); t.textContent=ch.origin.name;
  const ob=el("circle",{cx:66,cy:-62,r:8,fill:CONF[ch.origin.conf]},o);
  // senses
  ch.senses.forEach(s=>{
    const n=N[s.id], col=TYPE[s.type];
    const w=Math.max(120, s.name.length*17+44), h=58;
    const g=el("g",{class:"node"+(sel===s.id?" sel":""),"data-id":s.id,transform:`translate(${n.x},${n.y})`},gN);
    el("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:16,fill:"#fff",stroke:col,"stroke-width":sel===s.id?3.5:1.6,class:"card"},g);
    el("rect",{x:-w/2,y:-h/2,width:8,height:h,rx:4,fill:col},g);
    let tt=el("text",{"text-anchor":"middle",y:-3,"font-size":16,"font-weight":700,fill:"#2b2a33"},g); tt.textContent=s.name;
    tt=el("text",{"text-anchor":"middle",y:17,"font-size":11.5,fill:"#9a95a3"},g); tt.textContent=s.words.slice(0,3).join(" · ");
    el("circle",{cx:w/2-10,cy:-h/2+10,r:5,fill:CONF[s.conf]},g);
  });
  gN.onclick = e => { const g=e.target.closest(".node"); if(g){ sel=g.dataset.id; render(); detail(); } };
  // header
  $("#hChar").textContent=ch.char; $("#hT1").textContent=`${ch.char}（${ch.pinyin}）的义项网`;
  $("#hT2").textContent=`${ch.structure} · 共 ${ch.senses.length+1} 个义项`;
  apply();
}

/* ---- zoom & pan ---- */
function apply(){ $("#vp").setAttribute("transform",`translate(${T.x},${T.y}) scale(${T.k})`); }
function fit(){
  const svg=$("#svg"), r=svg.getBoundingClientRect(), bb=$("#vp").getBBox();
  const pad=60, k=Math.min((r.width-pad*2)/bb.width,(r.height-pad*2-60)/bb.height,1.25);
  T.k=Math.max(.3,k); T.x=r.width/2-(bb.x+bb.width/2)*T.k; T.y=r.height/2+30-(bb.y+bb.height/2)*T.k; apply();
}
function zoomAt(f,px,py){ const k=Math.min(3,Math.max(.25,T.k*f)); f=k/T.k; T.x=px-(px-T.x)*f; T.y=py-(py-T.y)*f; T.k=k; apply(); }
const svg=$("#svg");
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{ if(e.target.closest(".node")) return; drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y}; svg.classList.add("drag"); svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove",e=>{ if(!drag) return; T.x=drag.tx+e.clientX-drag.x; T.y=drag.ty+e.clientY-drag.y; apply(); });
svg.addEventListener("pointerup",()=>{drag=null;svg.classList.remove("drag");});
const ctr=()=>{const r=svg.getBoundingClientRect();return [r.width/2,r.height/2];};
$("#zin").onclick=()=>zoomAt(1.2,...ctr()); $("#zout").onclick=()=>zoomAt(1/1.2,...ctr()); $("#zfit").onclick=fit;
window.addEventListener("resize",fit);

/* ---- right panel ---- */
function confTag(c){ return `<span class="tag" style="background:${CONF[c]}">把握：${esc(c)}</span>`; }
function guwen(s){
  return s.gw ? `<div class="gw">${esc(s.gw)}</div><div class="src">—— ${esc(s.src)}</div><div class="row" style="margin-top:6px"><span class="k">译文</span>${esc(s.tr)}</div>`
              : `<div class="tbd">待查：尚未核到可靠的文言原句，暂不列出。</div>`;
}
function senseBody(s){
  return `
  <div class="row"><span class="k">词族</span><div class="words">${s.words.map(w=>`<span>${esc(w)}</span>`).join("")}</div></div>
  <div class="row"><span class="k">构词拆解</span>${esc(s.build)}</div>
  <div class="row"><span class="k">现代例句<span class="demo">示例</span></span>${esc(s.ex)}</div>
  <div class="row"><span class="k">文言原句</span>${guwen(s)}</div>`;
}
function detail(){
  const ch=DATA[cur]; let h="";
  if(sel==="origin"){
    const o=ch.origin;
    h+=`<div class="card2"><h4>本义</h4><div class="sname">${esc(o.name)}</div><div style="color:var(--ink2);font-size:13px">${esc(o.gloss)}</div>
    <div class="tags">${confTag(o.conf)}</div>
    <div class="row"><span class="k">《说文解字》原文</span><div class="sw">${esc(o.shuowen)}</div><div class="src">${esc(o.shuowenNote)}</div></div>
    <div class="row"><span class="k">字形演变（图片占位）</span><div class="forms">${["甲骨文","金文","小篆","隶书","楷书"].map((f,i)=>`${i?'<span class="ar">›</span>':''}<div class="f"><div>${i===4?`<span style="font-family:var(--serif);font-size:26px;color:#2b2a33">${ch.char}</span>`:"待补"}</div><span>${f}</span></div>`).join("")}</div></div>
    <div class="row"><span class="k">本义判定理由</span>${esc(o.reason)}</div>
    ${senseBody(o)}</div>`;
  } else {
    const s=ch.senses.find(x=>x.id===sel);
    const from = s.from==="origin" ? `本义「${ch.origin.name}」` : `「${ch.senses.find(x=>x.id===s.from).name}」`;
    h+=`<div class="card2"><h4>义项</h4><div class="sname">${esc(s.name)}</div>
    <div class="tags"><span class="tag" style="background:${TYPE[s.type]}">${s.type}</span>${confTag(s.conf)}</div>
    <div class="row"><span class="k">从哪里来</span>由${esc(from)}${s.type}而来：${esc(s.why)}。</div>
    ${senseBody(s)}</div>`;
  }
  h+=`<div class="card2"><h4>偏旁拆分</h4><div style="font-size:12.5px;color:var(--ink2);margin-bottom:8px">${esc(ch.structure)}</div><div class="parts">${ch.parts.map(p=>`<div class="part ${esc(p.role)}"><div class="pp">${esc(p.part)}</div><div class="rr">${p.role==="其他"?"记号／变形":esc(p.role)}</div><div class="nn">${esc(p.note)}</div></div>`).join("")}</div></div>`;
  h+=`<div class="card2"><h4>易错提醒</h4><div class="sub">易读错</div><ul class="l">${ch.read.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="sub">易写错</div><ul class="l">${ch.write.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  h+=`<div class="card2"><h4>汉字密码</h4><ul class="l">${ch.codes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  $("#right").innerHTML=h;
}
function pick(i){
  cur=i; sel="origin";
  document.querySelectorAll(".chip").forEach((c,j)=>c.classList.toggle("on",j===i));
  render(); detail(); requestAnimationFrame(fit); $("#right").scrollTop=0;
}
document.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"||e.key==="ArrowRight") pick((cur+1)%DATA.length); if(e.key==="ArrowUp"||e.key==="ArrowLeft") pick((cur+DATA.length-1)%DATA.length); });
pick(0);
</script>
</body>
</html>
