<style>
:root{
  --paper:#FBF6EA;--card:#fff;--ink:#2B2A28;--muted:#7B7266;--line:#EADFCB;

  --r:22px;--sh:0 4px 0 rgba(60,40,10,.06),0 10px 24px rgba(60,40,10,.07)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;font-size:17px}
.kai{font-family:"KaiTi","STKaiti","Kaiti SC","楷体","AR PL UKai CN","Noto Serif CJK SC",serif}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;background:none}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#fffdf7,#FBF6EA);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:10px 18px 4px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--bamboo);color:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 var(--bamboo-d)}
.brand h1{margin:0;font-size:22px;letter-spacing:1px}
.brand small{color:var(--muted);font-size:14px;display:block}
.topnav{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav button{flex:none;font-size:17px;font-weight:700;padding:11px 16px;border-radius:14px;color:#5d554b;min-height:46px}
.topnav button:hover{background:#F2EAD9}
.topnav button.on{background:var(--bamboo);color:#fff;box-shadow:0 3px 0 var(--bamboo-d)}
.layout{display:grid;grid-template-columns:170px minmax(0,1fr) 320px;gap:16px;padding:16px;max-width:1520px;margin:0 auto}
@media (max-width:1180px){.layout{grid-template-columns:160px minmax(0,1fr)}.side{grid-column:1/-1;display:grid!important;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
@media (max-width:760px){.layout{grid-template-columns:1fr;padding:12px}.subnav{display:flex!important;flex-direction:row!important;overflow-x:auto;position:static!important}.subnav .cb{flex:none;min-width:64px}.subnav .lab{display:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.subnav{display:flex;flex-direction:column;gap:8px;padding:10px;align-self:start;position:sticky;top:118px}
.subnav{display:grid!important;grid-template-columns:1fr 1fr}.subnav .lab{grid-column:1/-1;font-size:14px;font-weight:800;color:var(--muted);padding:4px 6px}
.cb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:16px;min-height:60px;border:3px solid transparent}
.cb .c{font-size:38px;line-height:1;width:44px;text-align:center}
.cb .p{font-size:14px;color:var(--muted);font-weight:700}
.cb:hover{background:#F5EFE2}
.cb.on{background:var(--bamboo-l);border-color:var(--bamboo);color:var(--bamboo-d)}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px 20px;padding:16px 20px;align-items:start}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.bigchar{width:120px;height:120px;border-radius:26px;background:repeating-linear-gradient(0deg,transparent 0 58px,#e9dfc9 58px 60px),repeating-linear-gradient(90deg,transparent 0 58px,#e9dfc9 58px 60px),#FFFCF3;border:3px solid #E2D2B2;display:grid;place-items:center;font-size:92px;line-height:1;color:var(--bamboo-d);position:relative}
.bigchar sup{position:absolute;right:-12px;top:-12px;background:var(--orange);color:#fff;font-size:18px;border-radius:12px;padding:3px 8px;white-space:nowrap}
.meta .py{font-size:28px;font-weight:800}
.meta .sw{font-size:16px;color:var(--muted);margin-top:4px}
.meta .sw b{color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:10px}
.rbtn{width:52px;height:52px;border-radius:50%;background:#F5EFE2;font-size:22px;display:grid;place-items:center;flex:none}
.benyi{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
@media (max-width:860px){.benyi{grid-template-columns:1fr}}
.box{background:#FBF6EA;border-radius:16px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:15px;color:#6B6257;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw-text{font-size:22px;line-height:1.6}
.reasontxt{font-size:16.5px;line-height:1.65}
.evo{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.glyph{flex:1;min-width:66px;border-radius:14px;background:#FFFCF3;border:2px dashed #DCCBA8;text-align:center;padding:6px 4px}
.glyph .g{height:52px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#8A6A3A}
.glyph .g.ph{font-size:12.5px;line-height:1.3;color:#A08A66}
.glyph .n{font-size:13px;font-weight:800;color:#5d554b}
.glyph.k{border-style:solid}
.arr{align-self:center;color:#C9B48A;font-weight:900}
.mapcard{position:relative;overflow:hidden}
.maptool{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:3}
.maptool button{width:50px;height:50px;border-radius:15px;background:#fff;box-shadow:var(--sh);font-size:24px;font-weight:900}
.maptitle{position:absolute;left:16px;top:14px;z-index:3;font-size:17px;font-weight:800;background:rgba(255,255,255,.92);padding:6px 12px;border-radius:12px;max-width:calc(100% - 200px)}
#net{display:block;width:100%;height:clamp(440px,66vh,720px);touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 50%,#F4FAF2 0,#fff 62%)}
#net.drag{cursor:grabbing}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 16px 6px;border-top:2px dashed var(--line);font-size:15px;font-weight:700;color:#5d554b}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:30px;height:0;border-top:5px solid}
.legend b{display:inline-block;width:16px;height:16px;border-radius:50%}
.tip{font-size:14.5px;color:var(--muted);padding:2px 16px 12px}
.edge{fill:none;stroke-width:5;stroke-linecap:round}
.node{cursor:pointer}
.node circle.bg{stroke-width:4;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.node text{font-weight:800;fill:#2B2A28;pointer-events:none}
.node .lv{font-size:14px;font-weight:700;fill:#7B7266}
.node:hover circle.bg{stroke-width:7}
.node.sel circle.bg{stroke-width:9}
.elab{cursor:pointer}
.elab .pill{stroke:#fff;stroke-width:3}
.elab .t{font-size:15px;font-weight:800;fill:#fff}
.elab .why{font-size:13.5px;font-weight:600;fill:#4f483f}
.elab .whybg{fill:rgba(255,255,255,.93);stroke:#EFE6D4;stroke-width:1.5}
.wip{padding:60px 20px;text-align:center}
.wip .ic{font-size:70px}
.wip h2{margin:10px 0 6px;font-size:28px}
.wip p{color:var(--muted);font-size:18px}
.side{display:flex;flex-direction:column;gap:14px;align-self:start}
.side .card{padding:14px 16px}
.side h3{margin:0 0 10px;font-size:19px}
.split{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.part{text-align:center;border-radius:16px;padding:8px 10px;min-width:80px;max-width:120px}
.part .g{font-size:40px;line-height:1.2}
.part .n{font-size:13px;font-weight:800;line-height:1.35}
.op{font-size:26px;font-weight:900;color:#C9B48A}
.p-yi{background:var(--bamboo-l);color:var(--bamboo-d)}
.p-yin{background:#FFF0DE;color:#B85F10}
.p-all{background:#F5EFE2}
.note{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.55}
.warnlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.warnlist li{background:#FFF4F0;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:15px;font-weight:800;padding:7px 12px;border-radius:99px;background:#EEE8FB;color:#5A3FB0;text-align:left}
.mask{position:fixed;inset:0;background:rgba(40,30,15,.38);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.pop{width:min(620px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:up .22s ease}

.pophead h2{margin:0;font-size:28px}

.close{width:50px;height:50px;border-radius:50%;background:#F5EFE2;font-size:24px;flex:none}
.popbody{padding:6px 18px 22px}
.sec{margin-top:16px}

.reason{background:#FFF6D6;border-radius:16px;padding:12px 14px;font-size:19px;line-height:1.6}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{font-size:23px;font-weight:700;background:var(--bamboo-l);color:var(--bamboo-d);border-radius:14px;padding:6px 14px}
.form{font-size:20px;line-height:1.7;background:#F4F8FF;border-radius:16px;padding:10px 14px}
.form em{font-style:normal;color:var(--blue);font-weight:800}
.ex{font-size:20px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.ex .rbtn{width:46px;height:46px;font-size:20px}
.demo{font-size:13px;font-weight:800;background:#FFE08A;color:#7a5200;border-radius:99px;padding:2px 9px}
.wy{background:#FBF6EA;border-radius:16px;padding:12px 14px;border-left:6px solid #C9A86A}
.wy .o{font-size:22px;line-height:1.7}
.wy .s{font-size:15px;color:var(--muted);margin-top:2px}
.wy .tr{font-size:17px;line-height:1.6;margin-top:8px;color:#4c463e}
.wy.pending{border-left-color:#bbb;color:var(--muted);font-size:18px}
.sure{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:800;padding:5px 12px;border-radius:99px}
.s-1{background:#E2F5E7;color:#23733F}.s-2{background:#E6F0FC;color:#1E5FA3}.s-3{background:#F1EEE9;color:#6B6257}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:#2B2A28;color:#fff;font-size:17px;font-weight:700;padding:12px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

   "古今字：常→裳",
   "声旁“尚”家族",
   "假借：长久的“常”"
  ],
  "senses": [
   {
    "id": "ch0",
    "gloss": "下裙",
    "parent": null,
    "etype": null,
    "why": "",
    "words": [
     "衣裳",
     "霓裳",
     "裳（今字）"
    ],
    "form": "衣裳 = 衣[上衣] + 裳[下裙]",
    "example": "古人上身穿衣，下身穿裳。",
    "wenyan": null,
    "sure": "通行说法",
    "note": "本义有《说文》明文，“常”作下裙的文言用例待查。"
   },
   {
    "id": "ch1",
    "gloss": "长久不变",
    "parent": "ch0",
    "etype": "假借",
    "why": "借读音，表示长久",
    "words": [
     "常年",
     "常规",
     "常态"
    ],
    "form": "常年 = 常[长久] + 年",
    "example": "山顶常年积雪。",
    "wenyan": null,
    "sure": "通行说法"
   },
   {
    "id": "ch2",
    "gloss": "经常",
    "parent": "ch1",
    "etype": "引申",
    "why": "长久地做，就是经常",
    "words": [
     "经常",
     "常常",
     "时常"
    ],
    "form": "常常 = 常[经常] 叠用",
    "example": "我常常帮妈妈做家务。",
    "wenyan": null,
    "sure": "通行说法"
   },
   {
    "id": "ch3",
    "gloss": "平常、普通",
    "parent": "ch1",
    "etype": "引申",
    "why": "一直这样的，就很普通",
    "words": [
     "平常",
     "正常",
     "寻常"
    ],
    "form": "寻常 = 寻[古代长度] + 常（合指普通）",
    "example": "今天是个平常的日子。",
    "wenyan": {
     "text": "旧时王谢堂前燕，飞入寻常百姓家。",
     "src": "刘禹锡《乌衣巷》",
     "tr": "从前王家谢家堂前的燕子，如今飞进了普通百姓家。"
    },
    "sure": "确定"
   }
  ]
 }
]</script>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ETYPE = {
  '引申':{c:'#2F86D6',dash:'',style:'solid'},
  '比喻':{c:'#2FA35A',dash:'12 8',style:'dashed'},
  '转喻':{c:'#F08A2C',dash:'3 9',style:'dotted'},
  '假借':{c:'#9A9187',dash:'2 6 14 6',style:'dashed'}
};
const RING = [{fill:'#FFE27A',stroke:'#D6A400',name:'本义'},{fill:'#E3EEFB',stroke:'#2F86D6',name:'第一层'},{fill:'#ECE5FB',stroke:'#7F5AD6',name:'第二层'}];
const JJ = {fill:'#EFEDEA',stroke:'#9A9187',name:'假借'};
const SURE = {'确定':['s-1','✅'],'通行说法':['s-2','📘'],'待查':['s-3','🔎']};
const TOP = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmtForm = s => esc(s).replace(/\[(.+?)\]/g,'<em>[$1]</em>');
let topOn=0, ci=0;

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }
function say(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.85; speechSynthesis.speak(u);}catch(e){ toast('这台设备暂不支持朗读'); } }

/* ---------- 菜单 ---------- */
function renderTop(){ $('#topnav').innerHTML = TOP.map((t,i)=>`<button class="${i===topOn?'on':''}" data-i="${i}">${t}</button>`).join(''); }
$('#topnav').onclick = e => { const b=e.target.closest('button'); if(!b) return; topOn=+b.dataset.i; renderTop(); render(); };
function renderSub(){
  $('#subnav').innerHTML = `<div class="lab">选一个字</div>` + DATA.map((d,i)=>`<button class="cb ${i===ci?'on':''}" data-i="${i}" aria-label="${d.char}"><span class="c kai">${d.char}</span><span class="p">${esc(d.pinyin.split('（')[0])}</span></button>`).join('');
}
$('#subnav').onclick = e => { const b=e.target.closest('.cb'); if(!b) return; ci=+b.dataset.i; topOn=0; renderTop(); renderSub(); render(); };

/* ---------- 主区 ---------- */
function render(){
  if(topOn!==0){
    $('#main').innerHTML=`<section class="card wip"><div class="ic">🚧</div><h2>「${TOP[topOn]}」建设中</h2><p>这个栏目正在搭建，先去「字义扩展图」看看吧！</p></section>`;
    $('#side').style.display='none'; return;
  }
  $('#side').style.display='';
  const d=DATA[ci], root=d.senses.find(s=>!s.parent), sw=d.shuowen, [scls,sic]=SURE[sw.sure]||SURE['待查'];
  const evo = d.glyphs.map((g,i)=>`${i?'<div class="arr">→</div>':''}<div class="glyph ${i===d.glyphs.length-1?'k':''}"><div class="g ${i===d.glyphs.length-1?'kai':'ph'}">${g.text?esc(g.text):'字形待补图<br>（示意）'}</div><div class="n">${esc(g.stage)}</div></div>`).join('');
  $('#main').innerHTML = `
  <section class="card hero">
    <div class="bigchar kai">${d.char}${d.trad!==d.char?`<sup class="kai">${esc(d.trad)}</sup>`:''}</div>
    <div class="meta">
      <div class="py">${esc(d.pinyin)}</div>
      <div class="sw">部首 <b>${esc(d.radical)}</b> · <b>${esc(d.structure)}</b></div>
      <div class="sw">本义：<b>${esc(root.gloss)}</b> · 共 <b>${d.senses.length}</b> 个义项</div>
      <div class="acts"><button class="rbtn" id="speak" aria-label="读一读">🔊</button><button class="rbtn" id="openRoot" aria-label="本义详情">⭐</button></div>
    </div>
    <div class="benyi">
      <div class="box"><h4>📖 《说文解字》 <span class="sure ${scls}">${sic} ${esc(sw.sure)}</span></h4><div class="sw-text kai">${esc(sw.text)}</div></div>
      <div class="box"><h4>🪶 字形演变 <span class="note" style="margin:0">古文字为示意，待补正式字形图</span></h4><div class="evo">${evo}</div></div>
      <div class="box" style="grid-column:1/-1"><h4>🎯 本义判定理由</h4><div class="reasontxt">${esc(d.benyi_reason)}</div></div>
    </div>
  </section>
  <section class="card mapcard">
    <div class="maptitle">🌳 「${d.char}」的义项网：从本义长出去</div>
    <div class="maptool"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="缩小">－</button><button id="zreset" aria-label="复位" style="font-size:20px">⟲</button></div>
    <svg id="net" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${d.char}的义项网"></svg>
    <div class="legend">${Object.entries(ETYPE).map(([k,v])=>`<span><i style="border-top-color:${v.c};border-top-style:${v.style}"></i>${k}</span>`).join('')}${RING.map(r=>`<span><b style="background:${r.fill};border:3px solid ${r.stroke}"></b>${r.name}</span>`).join('')}<span><b style="background:${JJ.fill};border:3px dashed ${JJ.stroke}"></b>假借义</span></div>
    <div class="tip">👆 点圆圈或连线上的标签看详情 · 拖动移动 · 滚轮/双指/＋－缩放</div>
  </section>`;
  $('#speak').onclick=()=>say(d.char+'。'+d.senses.slice(0,3).map(s=>s.words[0]).join('，'));
  $('#openRoot').onclick=()=>openPop(root.id);
  renderSide(d); initNet(d);
}
function renderSide(d){
  const s=d.split;
  $('#side').innerHTML = `
   <div class="card"><h3>🧩 偏旁拆分</h3>
     <div class="split"><div class="part p-yi"><div class="g kai">${esc(s.yi.part)}</div><div class="n">${esc(s.yi.note)}</div></div><div class="op">＋</div>
     <div class="part p-yin"><div class="g kai">${esc(s.yin.part)}</div><div class="n">${esc(s.yin.note)}</div></div><div class="op">＝</div>
     <div class="part p-all"><div class="g kai">${esc(s.whole)}</div><div class="n">${esc(d.char)}</div></div></div>
     <div class="note">${esc(s.note)}</div></div>
   <div class="card"><h3>🩺 易读错 · 易写错</h3><ul class="warnlist">${d.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
   <div class="card"><h3>🔐 汉字密码</h3><div class="tags">${d.codes.map(c=>`<button class="tag">#${esc(c)}</button>`).join('')}</div><div class="note">点标签可跳到「汉字密码」栏目（建设中）。</div></div>`;
  $('#side').querySelectorAll('.tag').forEach(b=>b.onclick=()=>toast('「汉字密码」栏目建设中'));
}

/* ---------- 义项网：自动放射布局 ---------- */
const R1=280, R2=500, RC=86, RN=64, HALF=600;
let VB0={x:-HALF,y:-HALF*0.78,w:HALF*2,h:HALF*1.56}, vb={...VB0};
function layout(d){
  const S=d.senses, kids=id=>S.filter(s=>s.parent===id), root=S.find(s=>!s.parent);
  const leaves=s=>{const k=kids(s.id);return k.length?k.reduce((a,c)=>a+leaves(c),0):1;};
  const pos={[root.id]:{x:0,y:0,depth:0}}, r1=kids(root.id), L=r1.reduce((a,c)=>a+leaves(c),0);
  let st=-90-(leaves(r1[0])/L*360)/2;
  r1.forEach(c=>{
    const span=leaves(c)/L*360, ang=st+span/2; st+=span; const ra=ang*Math.PI/180;
    pos[c.id]={x:Math.cos(ra)*R1,y:Math.sin(ra)*R1,depth:1};
    const g=kids(c.id); if(!g.length) return;
    const gs=Math.min(span,g.length*44); let s2=ang-gs/2;
    g.forEach(gc=>{ const a=s2+gs/g.length/2; s2+=gs/g.length; const rr=a*Math.PI/180; pos[gc.id]={x:Math.cos(rr)*R2,y:Math.sin(rr)*R2,depth:2}; });
  });
  return {S,root,pos};
}
const wrap = (s,n) => { if(s.length<=n) return [s]; const h=Math.ceil(s.length/2); return [s.slice(0,h),s.slice(h)]; };
function drawNet(d){
  const {S,root,pos}=layout(d); let defs='<defs>', edges='', labels='', nodes='';
  Object.entries(ETYPE).forEach(([k,v],i)=>defs+=`<marker id="ar${i}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${v.c}"/></marker>`);
  defs+='</defs>';
  // 年轮装饰
  let deco=`<circle cx="0" cy="0" r="${R1}" fill="none" stroke="#E7F0E3" stroke-width="2" stroke-dasharray="4 10"/><circle cx="0" cy="0" r="${R2}" fill="none" stroke="#EFE9F8" stroke-width="2" stroke-dasharray="4 10"/>`;
  S.forEach(s=>{
    if(!s.parent) return; const p=pos[s.parent], c=pos[s.id], t=ETYPE[s.etype]||ETYPE['引申'], ti=Object.keys(ETYPE).indexOf(s.etype);
    const rp=s.parent===root.id?RC:RN, dx=c.x-p.x, dy=c.y-p.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    const x1=p.x+ux*(rp+4), y1=p.y+uy*(rp+4), x2=c.x-ux*(RN+8), y2=c.y-uy*(RN+8);
    edges+=`<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${t.c}" stroke-dasharray="${t.dash}" marker-end="url(#ar${ti})"/>`;
    const mx=(x1+x2)/2, my=(y1+y2)/2, why=wrap(s.why,10), ww=Math.max(...why.map(l=>l.length))*14+16, wh=why.length*18+8;
    const by = (my<0 && uy<0.2) ? my-17-4-wh : my+11;
    labels+=`<g class="elab" data-id="${s.id}"><rect class="whybg" x="${mx-ww/2}" y="${by}" width="${ww}" height="${wh}" rx="9"/>`+
      why.map((l,i)=>`<text class="why" x="${mx}" y="${by+18+i*18}" text-anchor="middle">${esc(l)}</text>`).join('')+
      `<rect class="pill" x="${mx-27}" y="${my-17}" width="54" height="30" rx="15" fill="${t.c}"/><text class="t" x="${mx}" y="${my+4}" text-anchor="middle">${esc(s.etype)}</text></g>`;
  });
  S.forEach(s=>{
    const p=pos[s.id], isR=!s.parent, ring=s.etype==='假借'?JJ:RING[p.depth], r=isR?RC:RN, lines=wrap(s.gloss.replace(/（.*?）/,''),4), fs=isR?(lines[0].length>3?28:34):(lines[0].length>3?21:23);
    const y0=p.y-(lines.length-1)*fs*.6+fs*.36+(isR?10:6);
    nodes+=`<g class="node" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(s.gloss)}"><circle class="bg" cx="${p.x}" cy="${p.y}" r="${r}" fill="${ring.fill}" stroke="${ring.stroke}" ${s.etype==='假借'?'stroke-dasharray="8 6"':''}/>`+
      `<text class="lv" x="${p.x}" y="${p.y-r*.5}" text-anchor="middle">${isR?'本义':(SURE[s.sure]||['',''])[1]}</text>`+
      lines.map((l,i)=>`<text class="${isR?'kai':''}" x="${p.x}" y="${y0+i*fs*1.2}" text-anchor="middle" style="font-size:${fs}px">${esc(l)}</text>`).join('')+`</g>`;
  });
  $('#net').innerHTML=defs+deco+edges+nodes+labels;
}
function setVB(){ $('#net').setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fitVB(d){
  const {pos}=layout(d); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  Object.values(pos).forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  const m=RC+40; VB0={x:x0-m,y:y0-m,w:x1-x0+2*m,h:y1-y0+2*m}; vb={...VB0}; setVB();
}
function zoomAt(f,cx,cy){
  const nw=Math.min(VB0.w*2.5,Math.max(VB0.w*.3,vb.w*f)), k=nw/vb.w;
  if(cx===undefined){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}
  vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:vb.h*k}; setVB();
}
function toSvg(e){ const r=$('#net').getBoundingClientRect(), sc=Math.max(vb.w/r.width,vb.h/r.height), ox=(r.width*sc-vb.w)/2, oy=(r.height*sc-vb.h)/2;
  return {x:vb.x+(e.clientX-r.left)*sc-ox,y:vb.y+(e.clientY-r.top)*sc-oy,sc}; }
function initNet(d){
  const svg=$('#net'); drawNet(d); fitVB(d);
  const pts=new Map(); let start=null, moved=false, pinch0=null;
  svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
    if(pts.size===1) start={x:e.clientX,y:e.clientY,vb:{...vb}};
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w}; } });
  svg.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch0){ const [a,b]=[...pts.values()], dd=Math.hypot(a.x-b.x,a.y-b.y), m=toSvg({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2});
      zoomAt((pinch0.w*pinch0.d/dd)/vb.w,m.x,m.y); moved=true; return; }
    if(start){ const dx=e.clientX-start.x, dy=e.clientY-start.y; if(Math.hypot(dx,dy)>6){moved=true;svg.classList.add('drag');}
      if(moved){ const sc=toSvg(e).sc; vb={...vb,x:start.vb.x-dx*sc,y:start.vb.y-dy*sc}; setVB(); } } });
  const up=e=>{ pts.delete(e.pointerId); svg.classList.remove('drag'); if(pts.size<2) pinch0=null;
    if(pts.size===0){ if(!moved){ const el=document.elementFromPoint(e.clientX,e.clientY), n=el&&el.closest('.node,.elab'); if(n) openPop(n.dataset.id); } start=null; }
    else { const p=[...pts.values()][0]; start={x:p.x,y:p.y,vb:{...vb}}; } };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{ e.preventDefault(); const p=toSvg(e); zoomAt(e.deltaY>0?1.12:1/1.12,p.x,p.y); },{passive:false});
  svg.addEventListener('keydown',e=>{ const n=e.target.closest&&e.target.closest('.node'); if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openPop(n.dataset.id);} });
  $('#zin').onclick=()=>zoomAt(1/1.25); $('#zout').onclick=()=>zoomAt(1.25); $('#zreset').onclick=()=>{vb={...VB0};setVB();};
}

/* ---------- 弹窗 ---------- */
function openPop(id){
  const d=DATA[ci], s=d.senses.find(x=>x.id===id), p=d.senses.find(x=>x.id===s.parent), isR=!s.parent, [scls,sic]=SURE[s.sure]||SURE['待查'];
  document.querySelectorAll('#net .node').forEach(n=>n.classList.toggle('sel',n.dataset.id===id));
  const how = isR
    ? `<div class="sec"><h4>📖 《说文》</h4><div class="reason kai" style="font-size:22px">${esc(d.shuowen.text)}</div></div><div class="sec"><h4>🎯 为什么它是本义</h4><div class="reason">${esc(d.benyi_reason)}</div></div>`
    : `<div class="sec"><h4>🔀 怎么变来的</h4><div class="reason">从「${esc(p.gloss)}」<b style="color:${ETYPE[s.etype].c}">${esc(s.etype)}</b>而来：${esc(s.why)}。${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div></div>`;
  const wy = s.wenyan
    ? `<div class="wy"><div class="o kai">“${esc(s.wenyan.text)}”</div><div class="s">—— ${esc(s.wenyan.src)}</div><div class="tr">译文：${esc(s.wenyan.tr)}</div></div>`
    : `<div class="wy pending">📜 文言原句：<b>待查</b>（没有可靠出处前不写，绝不编造）</div>`;
  $('#pop').innerHTML=`
   <div class="pophead"><div class="ttl"><h2>${esc(d.char)} · ${esc(s.gloss)}</h2><div class="sub">
     ${isR?'<span class="badge" style="background:#D6A400">本义</span>':`<span class="badge" style="background:${ETYPE[s.etype].c}">${esc(s.etype)}</span>`}
     <span class="sure ${scls}" style="font-size:14px;padding:3px 10px">${sic} ${esc(s.sure)}</span></div></div>
     <button class="close" aria-label="关闭">✕</button></div>
   <div class="popbody">
     ${how}
     <div class="sec"><h4>🧺 词族</h4><div class="words">${s.words.map(w=>`<span class="word kai">${esc(w)}</span>`).join('')}</div></div>
     <div class="sec"><h4>🔧 构词拆解</h4><div class="form">${fmtForm(s.form)}</div></div>
     <div class="sec"><h4>✏️ 现代例句 <span class="demo">示例</span></h4><div class="ex"><button class="rbtn" aria-label="朗读">🔊</button><span>${esc(s.example)}</span></div></div>
     <div class="sec"><h4>📜 文言原句</h4>${wy}</div>
     <div class="sec"><h4>🎯 把握程度</h4><span class="sure ${scls}">${sic} ${esc(s.sure)}</span><div class="note">确定＝有可靠出处；通行说法＝常见解释，学界大体认可；待查＝还需核对，不下结论。</div></div>
   </div>`;
  $('#pop .close').onclick=closePop; $('#pop .ex .rbtn').onclick=()=>say(s.example);
  $('#mask').classList.add('show'); $('#pop .close').focus();
}
function closePop(){ $('#mask').classList.remove('show'); }
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask') closePop(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePop(); });

renderTop(); renderSub(); render();
</script>
<script src="../xzq-back.js" data-home="../index.html"></script>
