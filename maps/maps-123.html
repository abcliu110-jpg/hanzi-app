<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 儿童汉字学习</title>
<style>
:root{
  --bg:#f7f2e8; --paper:#fffdf8; --ink:#2d2a26; --sub:#7a7166; --line:#e7dfd0;
  --brand:#c8553d; --brand-soft:#fbe9e3;
  --t-yin:#2a9d8f; --t-bi:#e9894a; --t-zhuan:#7b5ea7; --t-jia:#d14d72;
  --k-ok:#3c9a5f; --k-mid:#d39b2a; --k-q:#9a8f84;
  --r:16px; --shadow:0 6px 20px rgba(80,60,30,.08);
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","BiauKai",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#e9e0cf 1px,transparent 1px);background-size:22px 22px;}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.05);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo .seal{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:24px}
.logo small{display:block;font-weight:400;color:var(--sub);font-size:12px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{border:0;background:transparent;padding:9px 14px;border-radius:999px;color:var(--sub);white-space:nowrap;font-size:14px;position:relative}
nav.top button:hover{background:#f3ece0;color:var(--ink)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(200,85,61,.3)}
nav.top button.off::after{content:"未开放";font-size:10px;margin-left:4px;color:#b8ad9f}
/* layout */
.main{display:grid;grid-template-columns:184px 1fr 320px;gap:16px;padding:16px;min-height:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
aside.left{display:flex;flex-direction:column;min-height:0;padding:12px}
aside.left h3,.side h3{margin:2px 4px 10px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.08em}
.search{border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:10px;background:#fff;font:inherit;width:100%}
.clist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto;padding:2px}
.clist button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;transition:.15s}
.clist button b{font-family:var(--kai);font-size:30px;font-weight:400;line-height:1.1}
.clist button span{font-size:11px;color:var(--sub)}
.clist button:hover{border-color:var(--brand);transform:translateY(-1px)}
.clist button.on{background:var(--brand-soft);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.clist button.on b{color:var(--brand)}
/* center column */
.center{display:grid;grid-template-rows:540px auto;gap:16px;min-height:0;overflow:auto}
.stage{position:relative;overflow:hidden;min-height:360px}
.stage svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.stage svg.drag{cursor:grabbing}
.stage .title{position:absolute;left:16px;top:12px;display:flex;align-items:baseline;gap:10px;pointer-events:none}
.stage .title b{font-family:var(--kai);font-size:40px;font-weight:400;color:var(--brand)}
.stage .title span{color:var(--sub);font-size:13px}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--ink)}
.zoom button:hover{border-color:var(--brand);color:var(--brand)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);background:rgba(255,253,248,.9);padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:#b0a698}
.node{cursor:pointer}
.node rect{transition:filter .15s}
.node:hover rect{filter:drop-shadow(0 4px 8px rgba(80,60,30,.18))}
.node.sel rect.box{stroke:var(--brand);stroke-width:3}
.elabel{pointer-events:none}
/* detail */
.detail{padding:18px 20px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dhead h2{margin:0;font-size:20px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;color:#fff;font-weight:600}
.kbadge{font-size:12px;padding:3px 10px;border-radius:999px;border:1.5px solid;font-weight:600;background:#fff}
.reason{background:#faf6ee;border-left:4px solid var(--brand);padding:8px 12px;border-radius:8px;margin-bottom:14px;color:#5b5348;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.blk h4{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:#f3ece0;padding:5px 12px;border-radius:999px;font-size:15px}
.chips span em{font-style:normal;color:var(--brand);font-weight:700}
.quote{font-family:var(--kai);font-size:18px;line-height:1.7}
.src{font-size:12px;color:var(--sub);margin-top:4px}
.trans{font-size:13px;color:#5b5348;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.ex{font-size:15px;line-height:1.7}
.ex .mk{font-size:11px;background:#eef3f7;color:#4d6b85;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:2px}
.pending{color:var(--k-q);font-size:14px}
.full{grid-column:1/-1}
.shuowen{font-family:var(--kai);font-size:19px}
.evo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.evo span{border:1px dashed #cdbfa8;border-radius:10px;padding:6px 10px;background:#fffaf0}
/* right */
aside.side{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.side section{padding:14px 16px}
.split{display:flex;align-items:stretch;gap:10px}
.part{flex:1;border-radius:12px;padding:10px;text-align:center}
.part b{display:block;font-family:var(--kai);font-size:30px;font-weight:400}
.part .rl{font-size:12px;font-weight:700;letter-spacing:.1em}
.part p{margin:6px 0 0;font-size:12px;color:#5b5348;text-align:left;line-height:1.5}
.part.yi{background:#e8f5f2}.part.yi .rl{color:var(--t-yin)}
.part.yin{background:#fdf0e6}.part.yin .rl{color:var(--t-bi)}
.plus{align-self:center;color:#c9bca8;font-size:20px}
.meta{font-size:12px;color:var(--sub);margin-top:10px}
.warn{display:flex;gap:10px;margin-bottom:10px;font-size:13.5px;line-height:1.6}
.warn .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.mima{border-radius:12px;background:#f6f1fb;padding:10px 12px;margin-bottom:8px}
.mima b{font-size:13px;color:var(--t-zhuan)}
.mima p{margin:4px 0 0;font-size:13px;line-height:1.6}
.klegend{font-size:12px;color:var(--sub);line-height:1.8}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:#2d2a26;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){.main{grid-template-columns:150px 1fr}.side{grid-column:1/-1}}
@media (max-width:720px){.main{grid-template-columns:1fr}.clist{grid-template-columns:repeat(5,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>

<div class="app">

    <div class="logo"><div class="seal">字</div><div>汉字小探险<small>义项网 · 第123组 · 20字</small></div></div>
    <nav class="top" id="topnav"></nav>
  </header>
  <div class="main">

        <div class="zoom"><button id="zin" title="放大">＋</button><button id="zout" title="缩小">－</button><button id="zreset" title="复位">⟲</button></div>
        <div class="legend" id="legend"></div>
        <div class="hint">滚轮缩放 · 拖动平移 · 点击义项看详情</div>
      </div>
      <div class="detail card" id="detail"></div>
    </div>
    <aside class="side">
      <section class="card"><h3>偏旁拆分</h3><div id="split"></div></section>
      <section class="card"><h3>易读错 · 易写错</h3><div id="warn"></div></section>
      <section class="card"><h3>汉字密码</h3><div id="mima"></div></section>
      <section class="card"><h3>把握程度说明</h3><div class="klegend">
        <span style="color:var(--k-ok)">● 确定</span>：字书和常用工具书说法一致。<br>
        <span style="color:var(--k-mid)">● 通行说法</span>：多数人这样讲，但学界仍有讨论。<br>
        <span style="color:var(--k-q)">● 待查</span>：证据不足或原文未核，暂不下结论。<br>
        现代例句均为自编，标「示例」；未能核实出处的文言原句一律不列，标「待查」。</div></section>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const MENU = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const TYPE = {'引申':'#2a9d8f','比喻':'#e9894a','转喻':'#7b5ea7','假借':'#d14d72'};
const TYPE_TIP = {'引申':'从本来的意思慢慢延伸出来','比喻':'因为样子或特点相像','转喻':'用相关的东西来代替','假借':'只借字的读音，意思没关系'};
const KC = {'确定':'var(--k-ok)','通行说法':'var(--k-mid)','待查':'var(--k-q)'};
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let cur = 0, sel = 'root';

/* top nav */
MENU.forEach((m,i)=>{
  const b=document.createElement('button'); b.textContent=m;
  b.className = i===0?'on':'off';
  b.onclick=()=>{ if(i) toast('「'+m+'」模块即将开放，本页只实现字义扩展图'); };
  $('topnav').appendChild(b);
});
/* legend */
$('legend').innerHTML = Object.keys(TYPE).map(t=>`<span title="${TYPE_TIP[t]}"><i style="background:${TYPE[t]}"></i>${t}</span>`).join('');

/* char list */
function renderList(filter){
  const box=$('clist'); box.innerHTML='';
  DATA.forEach((d,i)=>{
    if(filter && !(d.c.includes(filter)||d.py.includes(filter))) return;
    const b=document.createElement('button');
    b.className = i===cur?'on':'';
    b.innerHTML=`<b>${d.c}</b><span>${d.py}</span>`;
    b.onclick=()=>{cur=i;sel='root';renderList($('search').value.trim());renderAll();resetView();};
    box.appendChild(b);
  });
}
$('search').oninput=e=>renderList(e.target.value.trim());

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function wrap(s,n){const out=[];let line='';for(const ch of s){line+=ch;if(line.length>=n){out.push(line);line='';}}if(line)out.push(line);return out;}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

/* graph */
function renderGraph(){
  const d=DATA[cur], vp=$('vp'); vp.innerHTML='';
  $('tChar').textContent=d.c; $('tPy').textContent=d.py+' · '+d.struct;
  const n=d.senses.length;
  const R = n<=2?250:n<=4?270:290;
  const start = n===1?0:(n===2?-Math.PI/2+0.35:-Math.PI/2);
  const pos = d.senses.map((s,i)=>{
    const a = n===1? 0 : start + i*2*Math.PI/n + (n===2?0:0.0);
    return {x:Math.cos(a)*R*1.25, y:Math.sin(a)*R*0.82, a};
  });
  const gE=el('g',{},vp), gN=el('g',{},vp), gL=el('g',{},vp);
  // edges
  d.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPE[s.t]||'#999';
    const mx=p.x*0.5, my=p.y*0.5;
    const nx=-p.y, ny=p.x, L=Math.hypot(nx,ny)||1;
    const cx=mx+nx/L*28, cy=my+ny/L*28;
    el('path',{d:`M0,0 Q${cx},${cy} ${p.x},${p.y}`,fill:'none',stroke:col,'stroke-width':3,'stroke-dasharray':s.t==='假借'?'8 6':'', 'stroke-linecap':'round',opacity:.85},gE);
    // label at curve midpoint
    const lx=0.48*cx+0.36*p.x, ly=0.48*cy+0.36*p.y;
    const g=el('g',{class:'elabel',transform:`translate(${lx},${ly})`},gL);
    el('rect',{x:-26,y:-13,width:52,height:24,rx:12,fill:col},g);
    const t=el('text',{x:0,y:4,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#fff'},g);t.textContent=s.t;
    const lines=wrap(s.r,12).slice(0,3);
    const tb=el('text',{x:0,y:28,'text-anchor':'middle','font-size':12,fill:'#5b5348',stroke:'#fffdf8','stroke-width':4,'paint-order':'stroke','stroke-linejoin':'round'},g);
    lines.forEach((ln,j)=>{const ts=el('tspan',{x:0,dy:j?16:0},tb);ts.textContent=(j===2&&wrap(s.r,12).length>3)?ln.slice(0,-1)+'…':ln;});
  });
  // center node
  const cg=el('g',{class:'node'+(sel==='root'?' sel':''),transform:'translate(0,0)'},gN);
  el('circle',{r:92,fill:'#fbe9e3'},cg);
  el('rect',{class:'box',x:-78,y:-78,width:156,height:156,rx:40,fill:'#fff',stroke:'#c8553d','stroke-width':2},cg);
  const ct=el('text',{x:0,y:-12,'text-anchor':'middle','font-size':58,fill:'#c8553d','font-family':'Kaiti SC,STKaiti,KaiTi,serif'},cg);ct.textContent=d.c;
  el('rect',{x:-30,y:6,width:60,height:20,rx:10,fill:'#c8553d'},cg);
  const bt=el('text',{x:0,y:20,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff'},cg);bt.textContent='本义';
  const rl=wrap(d.root.n,9).slice(0,2);
  const rt=el('text',{x:0,y:46,'text-anchor':'middle','font-size':13,fill:'#2d2a26'},cg);
  rl.forEach((ln,j)=>{const ts=el('tspan',{x:0,dy:j?16:0},rt);ts.textContent=ln;});
  cg.onclick=e=>{e.stopPropagation();sel='root';renderAll();};
  // sense nodes
  d.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPE[s.t];
    const lines=wrap(s.n.replace(/（[^）]*）/g,''),8).slice(0,3);
    const w=150, h=34+lines.length*18;
    const g=el('g',{class:'node'+(sel===i?' sel':''),transform:`translate(${p.x},${p.y})`},gN);
    el('rect',{class:'box',x:-w/2,y:-h/2,width:w,height:h,rx:16,fill:'#fff',stroke:col,'stroke-width':2},g);
    el('rect',{x:-w/2,y:-h/2,width:8,height:h,rx:4,fill:col},g);
    el('circle',{cx:w/2-14,cy:-h/2+14,r:5,fill:KC[s.k].replace('var(--k-ok)','#3c9a5f').replace('var(--k-mid)','#d39b2a').replace('var(--k-q)','#9a8f84')},g);
    const tt=el('text',{x:4,y:-h/2+28,'text-anchor':'middle','font-size':15,'font-weight':600,fill:'#2d2a26'},g);
    lines.forEach((ln,j)=>{const ts=el('tspan',{x:4,dy:j?18:0},tt);ts.textContent=ln;});
    const st=el('text',{x:4,y:h/2-10,'text-anchor':'middle','font-size':11,fill:'#7a7166'},g);
    st.textContent=s.f.slice(0,2).join(' · ');
    g.onclick=e=>{e.stopPropagation();sel=i;renderAll();};
  });
}

/* pan & zoom */
let view={x:0,y:0,k:1};
function applyView(){$('vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function resetView(){view={x:0,y:0,k:1};applyView();}
function zoomAt(f,px,py){const k2=Math.min(3,Math.max(.4,view.k*f));const r=k2/view.k;view.x=px-(px-view.x)*r;view.y=py-(py-view.y)*r;view.k=k2;applyView();}
const svg=$('svg');
function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e);zoomAt(e.deltaY<0?1.12:1/1.12,p.x,p.y);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;const p=toSvg(e);drag={x:p.x-view.x,y:p.y-view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=toSvg(e);view.x=p.x-drag.x;view.y=p.y-drag.y;applyView();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('zin').onclick=()=>zoomAt(1.2,0,0);$('zout').onclick=()=>zoomAt(1/1.2,0,0);$('zreset').onclick=resetView;

/* detail */
function kbadge(k){return `<span class="kbadge" style="color:${KC[k]};border-color:${KC[k]}">把握程度：${k}</span>`;}
function familyHTML(f,c){return f.map(w=>`<span>${esc(w).split(c).join('<em>'+c+'</em>')}</span>`).join('');}
function classicHTML(c){
  if(!c) return `<div class="pending">待查 —— 暂未核实到可靠的文言原句，宁缺毋编。</div>`;
  return `<div class="quote">${esc(c.q)}</div><div class="src">—— ${esc(c.s)}</div><div class="trans">译文：${esc(c.y)}</div>`;
}
function renderDetail(){
  const d=DATA[cur], box=$('detail');
  if(sel==='root'){
    const r=d.root;
    box.innerHTML=`
    <div class="dhead"><span class="tag" style="background:var(--brand)">本义</span><h2>${esc(d.c)}：${esc(r.n)}</h2>${kbadge(r.k)}</div>
    <div class="grid2">
      <div class="blk full"><h4>《说文解字》原文 <span style="font-weight:400;color:${KC[r.swk]}">（${r.swk}）</span></h4><div class="shuowen">${esc(r.sw)}</div></div>
      <div class="blk full"><h4>字形演变（文字占位，字形图待补）</h4><div class="evo">${r.xing.split('→').map(x=>`<span>${esc(x.trim())}</span>`).join('<b style="color:#c9bca8">→</b>')}</div></div>
      <div class="blk full"><h4>为什么说这是本义</h4><div class="ex">${esc(r.why)}</div></div>
      ${commonBlocks(r,d.c)}
    </div>`;
  } else {
    const s=d.senses[sel];
    box.innerHTML=`
    <div class="dhead"><span class="tag" style="background:${TYPE[s.t]}" title="${TYPE_TIP[s.t]}">${s.t}</span><h2>${esc(s.n)}</h2>${s.py?`<span class="kbadge" style="color:#555;border-color:#ccc">${s.py}</span>`:''}${kbadge(s.k)}</div>
    <div class="reason">从本义「${esc(d.root.n)}」到这里：${esc(s.r)}。<span style="color:#9a8f84">（${s.t}：${TYPE_TIP[s.t]}）</span></div>
    <div class="grid2">${commonBlocks(s,d.c)}</div>`;
  }
}
function commonBlocks(s,c){
  return `
    <div class="blk"><h4>词族 · 3个</h4><div class="chips">${familyHTML(s.f,c)}</div></div>
    <div class="blk"><h4>构词拆解</h4><div class="ex">${esc(s.g)}</div></div>
    <div class="blk"><h4>现代例句</h4><div class="ex"><span class="mk">示例</span>${esc(s.e)}</div></div>
    <div class="blk"><h4>文言原句</h4>${classicHTML(s.c)}</div>`;
}

/* sidebar */
function renderSide(){
  const d=DATA[cur];
  const parts=d.parts.map(p=>`<div class="part ${p.role==='表义'?'yi':'yin'}"><span class="rl">${p.role}</span><b>${esc(p.p.split('（')[0])}</b><p>${p.p.includes('（')?'<strong>'+esc(p.p.slice(p.p.indexOf('（')))+'</strong> ':''}${esc(p.note)}</p></div>`).join('<div class="plus">＋</div>');
  $('split').innerHTML=`<div class="split">${parts}</div><div class="meta">${esc(d.c)}（${d.py}） · ${esc(d.struct)} · 繁体／古字：${esc(d.trad)}</div>`;
  $('warn').innerHTML=`<div class="warn"><div class="ic" style="background:#e9894a">读</div><div>${esc(d.du)}</div></div><div class="warn"><div class="ic" style="background:#d14d72">写</div><div>${esc(d.xie)}</div></div>`;
  $('mima').innerHTML=d.mima.map(m=>`<div class="mima"><b>🔑 ${esc(m.t)}</b><p>${esc(m.d)}</p></div>`).join('');
}
function renderAll(){renderGraph();renderDetail();renderSide();}
svg.addEventListener('click',e=>{ if(!e.target.closest('.node') && !drag){} });
renderList('');renderAll();applyView();
})();
</script>
</body>
</html>
