<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 第128组 | 汉字学习</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2a33; --ink2:#5d5a66; --ink3:#97929e;
  --line:#e6dccb; --accent:#c4472f; --accent-soft:#fbe9e2; --gold:#d8a23a;
  --yin:#3f7cc4; --bi:#e0832b; --zhuan:#2f9a6a; --jia:#8a57c8;
  --ok:#2f9a6a; --tong:#d8a23a; --cha:#b94a4a;
  --radius:16px; --shadow:0 6px 24px rgba(80,60,30,.08);
  --kai:"STKaiti","KaiTi","楷体","Kaiti SC","BiauKai",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font-family:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* ---------- 顶部 ---------- */
header{display:flex;align-items:center;gap:20px;padding:10px 22px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.04)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .seal{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;font-family:var(--kai);font-size:24px;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.brand b{font-size:16px;letter-spacing:1px}
.brand small{display:block;color:var(--ink3);font-size:11px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{border:0;background:transparent;padding:9px 14px;border-radius:999px;color:var(--ink2);font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
nav.top button:hover{background:#f3ece0}
nav.top button.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(196,71,47,.3)}
nav.top button .soon{font-size:10px;opacity:.6;margin-left:3px}
.group-tag{font-size:12px;color:var(--ink3);white-space:nowrap}
/* ---------- 主体 ---------- */
main{display:grid;grid-template-columns:210px 1fr 390px;min-height:0}
aside.left{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.left h3{margin:16px 16px 8px;font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:1px}
.charlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 16px;overflow-y:auto}
.charlist button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center}
.charlist button .c{font-family:var(--kai);font-size:28px;line-height:1.1}
.charlist button .p{font-size:11px;color:var(--ink3)}
.charlist button:hover{border-color:var(--gold);transform:translateY(-1px)}
.charlist button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.charlist button.on .p{color:#ffe3da}
.left .tip{margin:auto 14px 14px;font-size:11.5px;color:var(--ink3);line-height:1.6;background:#faf5ea;border-radius:10px;padding:10px}
/* ---------- 画布 ---------- */
section.stage{position:relative;min-height:0;display:flex;flex-direction:column}
.stage-head{display:flex;align-items:center;gap:14px;padding:14px 20px 6px}
.stage-head .big{font-family:var(--kai);font-size:44px;line-height:1;color:var(--accent)}
.stage-head .meta b{font-size:16px}
.stage-head .meta div{color:var(--ink2);font-size:12.5px;margin-top:3px}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
.canvas{position:relative;flex:1;margin:6px 16px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,#efe6d6 1px,transparent 0);background-size:22px 22px}
svg#graph{width:100%;height:100%;cursor:grab;user-select:none;touch-action:none}
svg#graph.drag{cursor:grabbing}
.zoombar{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--ink2);box-shadow:var(--shadow)}
.zoombar button:hover{color:var(--accent);border-color:var(--accent)}
.hint{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:var(--ink3);background:rgba(255,253,248,.85);padding:4px 10px;border-radius:999px}
.node{cursor:pointer}
.node rect.box{transition:filter .15s}
.node:hover rect.box{filter:drop-shadow(0 4px 8px rgba(80,60,30,.18))}
.node.sel rect.box{stroke-width:3}
.edge-label text{pointer-events:none}
/* ---------- 右侧 ---------- */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:14px}
.card h4{margin:0 0 10px;font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.card h4::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--accent)}
.sense-title{font-size:18px;font-weight:700;margin:0 0 8px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.t-引申{color:var(--yin);border-color:var(--yin);background:#eaf2fb}
.t-比喻{color:var(--bi);border-color:var(--bi);background:#fdf0e3}
.t-转喻{color:var(--zhuan);border-color:var(--zhuan);background:#e6f5ee}
.t-假借{color:var(--jia);border-color:var(--jia);background:#f2ebfa}
.t-本义{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.c-确定{color:#fff;background:var(--ok);border-color:var(--ok)}
.c-通行说法{color:#fff;background:var(--tong);border-color:var(--tong)}
.c-待查{color:#fff;background:var(--cha);border-color:var(--cha)}
.tag.self{color:var(--ink2);border-color:var(--ink3);background:#f4f2f6}
.sec{margin-top:12px}
.sec .lab{font-size:12px;color:var(--ink3);margin-bottom:5px}
.why{background:#faf6ee;border-radius:10px;padding:9px 11px;line-height:1.7;font-size:13.5px}
.why .arrow{color:var(--ink3);font-size:12px;margin-bottom:3px}
.shuowen{font-family:var(--kai);font-size:17px;line-height:1.7;background:#fbf3e3;border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 10px 10px 0}
.evo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.evo span{border:1px dashed var(--ink3);color:var(--ink2);border-radius:8px;padding:6px 8px;font-size:12px;background:#fdfcf9}
.evo em{font-style:normal;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:600}
.ex{line-height:1.7;font-size:14px}
.classic .q{font-family:var(--kai);font-size:16.5px;line-height:1.7}
.classic .src{font-size:12px;color:var(--ink2);margin:2px 0 4px}
.classic .tr{font-size:13px;color:var(--ink2);line-height:1.6}
.pending{color:var(--cha);font-size:13px;background:#fbeeee;border-radius:8px;padding:7px 10px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.part{border-radius:12px;padding:10px;text-align:center}
.part.sem{background:#eaf2fb}
.part.pho{background:#fdf0e3}
.part .k{font-size:11px;color:var(--ink3)}
.part .g{font-family:var(--kai);font-size:30px;line-height:1.3}
.part .d{font-size:12px;color:var(--ink2);line-height:1.5}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.6}
.err{display:flex;gap:8px;margin-bottom:8px;line-height:1.6;font-size:13px}
.err b{flex:none;font-size:11.5px;padding:1px 8px;border-radius:6px;height:fit-content;margin-top:2px}
.err .r{background:#fdeee9;color:var(--accent)}
.err .w{background:#eef0fb;color:#4b5bb8}
.code{background:linear-gradient(135deg,#fff6e3,#fdeedd);border-radius:12px;padding:11px 12px;line-height:1.7;font-size:13.5px}
.code .ttl{font-weight:700;color:#9a6512;margin-bottom:3px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:.92;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){main{grid-template-columns:170px 1fr 330px}}
</style>
</head>

        <span><i style="background:var(--jia)"></i>假借</span>
      </div>
    </div>
    <div class="canvas">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="zoombar">
        <button id="zin" title="放大">＋</button>
        <button id="zout" title="缩小">－</button>

    </div>
  </section>
  <aside class="right" id="right"></aside>
</main>
</div>
<div class="toast" id="toast"></div>

 "code":{"title":"台声字读 yi","text":"“台”做声旁：怡、贻、饴、诒都读 yí；心旁怡是快乐，食旁饴是糖。"}},

{"char":"渗","pinyin":"shèn","trad":"滲",
 "origin":{"meaning":"液体慢慢往下漏、透","shuowen":"滲，下漉也。从水，參聲。","shuowenCert":"确定",
  "evo":["小篆〔占位〕","隶书〔占位〕","楷书 滲 → 渗"],
  "reason":"《说文》说“下漉也”，就是液体往下慢慢滤过；三点水表示液体，“参”表音。","cert":"确定",
  "words":["渗水","渗漏","下渗"],"parse":"渗漏 ＝ 渗（慢慢透过）＋ 漏（漏出）","example":"雨水慢慢渗进了泥土里。","classic":null},
 "senses":[
  {"id":"a","meaning":"从细小缝隙里冒出来","type":"引申","why":"液体透过去以后，会从另一边一点点冒出来。","words":["渗出","渗血","汗渗"],"parse":"渗出 ＝ 渗（慢慢透）＋ 出（出来）","example":"跑完步，额头渗出了汗珠。","classic":null,"cert":"确定"},
  {"id":"b","meaning":"（思想、力量）慢慢进入","type":"比喻","why":"像水慢慢透进土里，比喻别的东西悄悄地进入。","words":["渗透","渗入","相互渗透"],"parse":"渗透 ＝ 渗（慢慢进入）＋ 透（透过）","example":"妈妈说，好习惯要渗透在每天的小事里。","classic":null,"cert":"确定"},
  {"id":"c","meaning":"让人害怕（口语写作“渗人”）","type":"假借","why":"口语里的“瘆人”常被写成同音的“渗人”。","words":["渗人","瘆人","渗得慌"],"parse":"瘆人 ＝ 瘆（害怕）＋ 人 → 让人害怕","example":"夜里猫头鹰的叫声有点渗人。","classic":null,"cert":"通行说法"}
 ],
 "parts":{"sem":{"g":"氵","d":"三点水：液体"},"pho":{"g":"参","d":"参 shēn 表音（人参的“参”）"},"note":"“参”是多音字：参加 cān、人参 shēn、参差 cēn。"},
 "errors":{"read":"读 shèn，不读 cān 或 shēn。","write":"右边是“参”，下面是三撇，不要写成两撇。"},
 "code":{"title":"参声字读音多变","text":"“参”做声旁：渗（shèn）、惨（cǎn）、掺（chān）、碜（chěn），读音各不相同，要结合词语记。"}},

{"char":"秃","pinyin":"tū","trad":"禿",
 "origin":{"meaning":"没有头发","shuowen":"禿，無髮也。从人，上象禾粟之形，取其聲。","shuowenCert":"确定",
  "evo":["小篆〔占位〕","隶书〔占位〕","楷书 禿 → 秃"],
  "reason":"《说文》说“无发也”；下部是人，上部“禾”取它的读音。","cert":"确定",
  "words":["秃头","秃顶","秃子"],"parse":"秃顶 ＝ 秃（没头发）＋ 顶（头顶）","example":"爷爷头顶有点秃，冬天要戴帽子。","classic":null},
 "senses":[
  {"id":"a","meaning":"鸟兽没毛、树没叶、山没草木","type":"引申","why":"人没头发是秃，其他东西表面光光的也叫秃。","words":["秃山","秃树","光秃秃"],"parse":"光秃秃 ＝ 光（光滑）＋ 秃秃（叠用加强）","example":"冬天，树枝变得光秃秃的。","classic":null,"cert":"确定"},
  {"id":"b","meaning":"东西的尖头磨没了","type":"比喻","why":"尖儿没了，就像头上没有毛一样。","words":["秃笔","写秃了","秃尖"],"parse":"秃笔 ＝ 秃（尖磨没了）＋ 笔","example":"毛笔写秃了，笔画就不好看了。","classic":null,"cert":"确定"},
  {"id":"c","meaning":"（文章）结尾不完整","type":"比喻","why":"结尾缺了一截，像东西被削秃了一样。","words":["秃尾巴","结尾太秃","写得太秃"],"parse":"秃尾巴 ＝ 秃（缺了）＋ 尾巴（结尾）","example":"老师说我的作文结尾太秃，要再写两句。","classic":null,"cert":"通行说法"}
 ],
 "parts":{"sem":{"g":"几","d":"下部：人（今写作“几”）"},"pho":{"g":"禾","d":"上部“禾”表音（据《说文》）"},"note":"“秃”和“秀”上面都是禾，下面不同。"},
 "errors":{"read":"读一声 tū，不读 tú。","write":"下面是“几”，不要写成“九”或“乃”（“乃”是“秀”的下半）。"},
 "code":{"title":"秃与秀，下面不同","text":"秀＝禾＋乃，秃＝禾＋几。一个是禾苗抽穗很漂亮，一个是光秃秃没有毛。"}}
]
}
</script>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const CH = DATA.chars;
const COLORS = {"引申":"#3f7cc4","比喻":"#e0832b","转喻":"#2f9a6a","假借":"#8a57c8"};
const CERTC = {"确定":"#2f9a6a","通行说法":"#d8a23a","待查":"#b94a4a"};
const NS = "http://www.w3.org/2000/svg";
let cur = 0, sel = "o", view = null, fitView = null;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 顶部菜单 */
const top = $('topnav');
DATA.menu.forEach((m,i)=>{
  const b=document.createElement('button');
  b.innerHTML = esc(m) + (i? '<span class="soon">·其他模块</span>':'');
  if(i===0) b.className='on';
  b.onclick=()=>{ if(i) toast('「'+m+'」在独立模块文件中，本页只展示「字义扩展图」'); };
  top.appendChild(b);
});
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

/* 左侧字表 */
const list=$('charlist');
CH.forEach((c,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<span class="c">'+c.char+'</span><span class="p">'+esc(c.pinyin.split(' / ')[0])+'</span>';
  b.onclick=()=>select(i);
  list.appendChild(b);
});

function wrap(text, n){const out=[];let s=String(text);while(s.length>n){out.push(s.slice(0,n));s=s.slice(n);}if(s)out.push(s);return out;}
function el(tag, attrs, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

function layout(c){
  const nodes={o:{id:"o",x:0,y:0,depth:0,data:c.origin,isOrigin:true}};
  const kids={};
  c.senses.forEach(s=>{const p=s.from||"o";(kids[p]=kids[p]||[]).push(s);});
  const l1=kids.o||[];const n=l1.length;
  const start = n===1?0 : n===2? -Math.PI/2 : -Math.PI/2;
  function place(pid, list, baseAng, spread, depth){
    list.forEach((s,i)=>{
      let ang;
      if(pid==="o") ang = start + i*(2*Math.PI/Math.max(n,1));
      else ang = baseAng + (i-(list.length-1)/2)*spread;
      const r = depth===1?290:290+(depth-1)*250;
      nodes[s.id]={id:s.id,x:Math.cos(ang)*r,y:Math.sin(ang)*r,ang,depth,data:s,parent:pid};
      if(kids[s.id]) place(s.id,kids[s.id],ang,0.55/depth,depth+1);
    });
  }
  if(n===2){ // 左右布局更适合宽屏
    l1.forEach((s,i)=>{});
  }
  place("o",l1,0,0,1);
  if(n===2){ // 旋转到左右
    Object.values(nodes).forEach(nd=>{if(nd.id!=="o"){const x=nd.x,y=nd.y;nd.x=-y;nd.y=x;}});
  }
  return nodes;
}

function renderGraph(){
  const c=CH[cur], svg=$('graph');
  svg.innerHTML="";
  const defs=el('defs',{},svg);
  const g=el('g',{},svg);
  const nodes=layout(c);
  const gE=el('g',{},g), gL=el('g',{},g), gN=el('g',{},g);
  // 连线
  Object.values(nodes).forEach(nd=>{
    if(nd.id==="o")return;
    const p=nodes[nd.parent], col=COLORS[nd.data.type]||"#999";
    const mx=(p.x+nd.x)/2, my=(p.y+nd.y)/2;
    const dx=nd.x-p.x, dy=nd.y-p.y, len=Math.hypot(dx,dy)||1;
    const cx=mx - dy/len*24, cy=my + dx/len*24;
    el('path',{d:`M${p.x},${p.y} Q${cx},${cy} ${nd.x},${nd.y}`,fill:"none",stroke:col,"stroke-width":3,"stroke-linecap":"round",opacity:.75,"stroke-dasharray":nd.data.type==="假借"?"7 6":""},gE);
    // 标签
    const lx=(p.x+2*cx+nd.x)/4, ly=(p.y+2*cy+nd.y)/4;
    const lg=el('g',{class:"edge-label",transform:`translate(${lx},${ly})`},gL);
    const lines=wrap(nd.data.why,13).slice(0,3);
    if(wrap(nd.data.why,13).length>3) lines[2]=lines[2].slice(0,12)+"…";
    const w=13*12+16, h=26+lines.length*15;
    el('rect',{x:-w/2,y:-12,width:w,height:h,rx:10,fill:"#fffdf8",stroke:col,"stroke-opacity":.35},lg);
    el('rect',{x:-24,y:-21,width:48,height:20,rx:10,fill:col},lg);
    const tt=el('text',{x:0,y:-7,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"#fff"},lg);tt.textContent=nd.data.type;
    lines.forEach((ln,i)=>{const t=el('text',{x:0,y:10+i*15,"text-anchor":"middle","font-size":11.5,fill:"#5d5a66"},lg);t.textContent=ln;});
    const title=el('title',{},lg);title.textContent=nd.data.type+"："+nd.data.why;
  });
  // 节点
  Object.values(nodes).forEach(nd=>{
    const ng=el('g',{class:"node"+(nd.id===sel?" sel":""),transform:`translate(${nd.x},${nd.y})`},gN);
    ng.addEventListener('click',e=>{e.stopPropagation();sel=nd.id;renderDetail();highlight();});
    ng.dataset.id=nd.id;
    if(nd.isOrigin){
      el('circle',{r:86,fill:"#fbe9e2",opacity:.6},ng);
      el('rect',{class:"box",x:-72,y:-72,width:144,height:144,rx:72,fill:"#c4472f",stroke:"#8e2f1d","stroke-width":nd.id===sel?3:0},ng);
      const t=el('text',{x:0,y:8,"text-anchor":"middle","font-size":64,fill:"#fff","font-family":"STKaiti,KaiTi,楷体,serif"},ng);t.textContent=c.char;
      const b=el('text',{x:0,y:-38,"text-anchor":"middle","font-size":12,fill:"#ffe3da","letter-spacing":2},ng);b.textContent="本 义";
      const ls=wrap(c.origin.meaning,9).slice(0,2);
      ls.forEach((ln,i)=>{const tx=el('text',{x:0,y:32+i*15,"text-anchor":"middle","font-size":12,fill:"#fff"},ng);tx.textContent=ln;});
    }else{
      const col=COLORS[nd.data.type]||"#999";
      const ls=wrap(nd.data.meaning,9).slice(0,3);
      const w=160,h=30+ls.length*18;
      el('rect',{class:"box",x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:"#fff",stroke:col,"stroke-width":nd.id===sel?3:1.6},ng);
      el('rect',{x:-w/2,y:-h/2,width:6,height:h,rx:3,fill:col},ng);
      ls.forEach((ln,i)=>{const t=el('text',{x:4,y:-h/2+22+i*18,"text-anchor":"middle","font-size":14,"font-weight":600,fill:"#2b2a33"},ng);t.textContent=ln;});
      const cc=CERTC[nd.data.cert]||"#999";
      el('circle',{cx:w/2-10,cy:-h/2+10,r:5,fill:cc},ng);
      const ct=el('text',{x:4,y:h/2-7,"text-anchor":"middle","font-size":10.5,fill:"#97929e"},ng);ct.textContent=nd.data.words.filter(x=>x!=="—").slice(0,2).join(" · ");
    }
  });
  // 适配视窗
  const xs=Object.values(nodes).map(n=>n.x), ys=Object.values(nodes).map(n=>n.y);
  const pad=150;
  const minx=Math.min(...xs)-pad, maxx=Math.max(...xs)+pad, miny=Math.min(...ys)-pad, maxy=Math.max(...ys)+pad;
  const box=svg.getBoundingClientRect();
  let w=maxx-minx, h=maxy-miny;
  const ar=(box.width||800)/(box.height||600);
  if(w/h<ar){const nw=h*ar;const cx=(minx+maxx)/2;fitView={x:cx-nw/2,y:miny,w:nw,h};}
  else{const nh=w/ar;const cy=(miny+maxy)/2;fitView={x:minx,y:cy-nh/2,w,h:nh};}
  view={...fitView};applyView();
}
function highlight(){document.querySelectorAll('.node').forEach(n=>{const on=n.dataset.id===sel;n.classList.toggle('sel',on);const r=n.querySelector('rect.box');if(r)r.setAttribute('stroke-width',on?3:(n.dataset.id==="o"?0:1.6));});}
function applyView(){$('graph').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);}

/* 缩放与平移 */
const svg=$('graph');
function zoom(f,cx,cy){
  const nw=view.w*f;
  if(nw<300||nw>fitView.w*4)return;
  if(cx==null){cx=view.x+view.w/2;cy=view.y+view.h/2;}
  view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.w*=f;view.h*=f;applyView();
}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();const cx=view.x+(e.clientX-r.left)/r.width*view.w;const cy=view.y+(e.clientY-r.top)/r.height*view.h;zoom(e.deltaY>0?1.12:1/1.12,cx,cy);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();view.x=drag.vx-(e.clientX-drag.x)/r.width*view.w;view.y=drag.vy-(e.clientY-drag.y)/r.height*view.h;applyView();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('zin').onclick=()=>zoom(1/1.25);$('zout').onclick=()=>zoom(1.25);$('zfit').onclick=()=>{view={...fitView};applyView();};
window.addEventListener('resize',()=>renderGraph());
document.addEventListener('keydown',e=>{if(e.key==="ArrowDown"){e.preventDefault();select((cur+1)%CH.length);}if(e.key==="ArrowUp"){e.preventDefault();select((cur-1+CH.length)%CH.length);}});

/* 右侧 */
function certTag(c){return `<span class="tag c-${esc(c)}">把握：${esc(c)}</span>`;}
function classicHTML(cl){
  if(!cl) return `<div class="pending">待查：暂未找到可靠的文言原句，不编造出处。</div>`;
  return `<div class="classic"><div class="q">${esc(cl.text)}</div><div class="src">—— ${esc(cl.src)}</div><div class="tr">译文：${esc(cl.trans)}</div></div>`;
}
function renderDetail(){
  const c=CH[cur];
  let h="";
  if(sel==="o"){
    const o=c.origin;
    h+=`<div class="card"><h4>本义 · 中心</h4>
      <div class="sense-title">${esc(o.meaning)}</div>
      <div class="tags"><span class="tag t-本义">本义</span>${certTag(o.cert)}</div>
      <div class="sec"><div class="lab">《说文》原文 <span class="tag c-${esc(o.shuowenCert)}" style="margin-left:4px">${esc(o.shuowenCert)}</span></div><div class="shuowen">${esc(o.shuowen)}</div></div>
      <div class="sec"><div class="lab">字形演变（文字占位）</div><div class="evo">${o.evo.map(esc).map(s=>`<span>${s}</span>`).join('<em>→</em>')}</div></div>
      <div class="sec"><div class="lab">本义判定理由</div><div class="why">${esc(o.reason)}</div></div>
      ${commonHTML(o)}</div>`;
  }else{
    const s=c.senses.find(x=>x.id===sel);
    const parent=s.from? c.senses.find(x=>x.id===s.from).meaning : c.origin.meaning;
    h+=`<div class="card"><h4>义项详情</h4>
      <div class="sense-title">${esc(s.meaning)}</div>
      <div class="tags"><span class="tag t-${esc(s.type)}">${esc(s.type)}</span>${certTag(s.cert)}</div>
      <div class="sec"><div class="why"><div class="arrow">从「${esc(parent)}」→ 这里</div>${esc(s.why)}</div></div>
      ${commonHTML(s)}</div>`;
  }
  // 侧栏固定信息
  const p=c.parts;
  h+=`<div class="card"><h4>偏旁拆分</h4><div class="parts">
      <div class="part sem"><div class="k">表义部分</div><div class="g">${esc(p.sem.g)}</div><div class="d">${esc(p.sem.d)}</div></div>
      <div class="part pho"><div class="k">表音部分</div><div class="g">${esc(p.pho.g)}</div><div class="d">${esc(p.pho.d)}</div></div>
    </div><div class="note">${esc(p.note)}</div></div>`;
  h+=`<div class="card"><h4>易读错 · 易写错</h4>
      <div class="err"><b class="r">读</b><div>${esc(c.errors.read)}</div></div>
      <div class="err"><b class="w">写</b><div>${esc(c.errors.write)}</div></div></div>`;
  h+=`<div class="card"><h4>汉字密码</h4><div class="code"><div class="ttl">🔑 ${esc(c.code.title)}</div>${esc(c.code.text)}</div></div>`;
  $('right').innerHTML=h;
}
function commonHTML(s){
  const words=s.words.filter(w=>w!=="—");
  return `<div class="sec"><div class="lab">词族</div>${words.length?`<div class="chips">${words.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`:`<div class="pending">待查</div>`}</div>
    <div class="sec"><div class="lab">构词拆解</div><div class="ex">${esc(s.parse)}</div></div>
    <div class="sec"><div class="lab">现代例句 <span class="tag self">示例</span></div><div class="ex">${esc(s.example)}</div></div>
    <div class="sec"><div class="lab">文言原句</div>${classicHTML(s.classic)}</div>
    <div class="sec"><div class="lab">把握程度</div>${certTag(s.cert)}</div>`;
}

function select(i){
  cur=i;sel="o";
  document.querySelectorAll('.charlist button').forEach((b,j)=>b.classList.toggle('on',j===i));
  const c=CH[i];
  $('bigChar').textContent=c.char;
  $('headTitle').textContent=c.char+"（"+c.pinyin+"）"+(c.trad!==c.char?" · 繁体 "+c.trad:"");
  $('headSub').textContent="本义："+c.origin.meaning+" · 共 "+c.senses.length+" 个扩展义项";
  renderGraph();renderDetail();
}
select(0);
})();
</script>
</body>
