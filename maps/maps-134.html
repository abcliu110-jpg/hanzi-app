<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#faf6ee; --paper2:#f3ecdf; --card:#fffdf8; --ink:#2d2a26; --ink2:#6b645a; --line:#e4dac8;
  --brand:#b5442e; --brand-soft:#f6e3dc;
  --t-ben:#b5442e; --t-yin:#2f8f83; --t-bi:#d9822b; --t-zhuan:#7a5bb5; --t-jia:#5a7896;
  --c-ok:#3f8f4f; --c-common:#3c6fb0; --c-tbd:#c28a12;
  --radius:16px; --shadow:0 2px 10px rgba(80,60,30,.08),0 1px 2px rgba(80,60,30,.06);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --kai:"STKaiti","KaiTi","Kaiti SC","楷体","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
/* 顶部 */
header{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;height:62px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo .seal{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:22px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top::-webkit-scrollbar{display:none}
nav.top button{border:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink2);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
nav.top button:hover{background:var(--paper2);color:var(--ink)}
nav.top button.active{background:var(--brand);color:#fff;font-weight:600}
nav.top .sep{color:var(--line);align-self:center}
/* 主体 */
.main{flex:1;display:grid;grid-template-columns:132px 1fr 380px;min-height:0}
aside.chars{background:var(--paper2);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px}
aside.chars h3{font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:1px;padding:4px 6px 10px}
.charlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.charbtn{border:1px solid transparent;background:var(--card);border-radius:12px;cursor:pointer;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);transition:.15s;font:inherit}
.charbtn .c{font-family:var(--kai);font-size:28px;line-height:1.1}
.charbtn .p{font-size:11px;color:var(--ink2)}
.charbtn:hover{transform:translateY(-1px);border-color:var(--line)}
.charbtn.active{background:var(--brand);border-color:var(--brand)}
.charbtn.active .c,.charbtn.active .p{color:#fff}
/* 画布 */
section.stage{position:relative;min-width:0;background:
  radial-gradient(circle at 1px 1px,#e9dfcd 1px,transparent 1.2px) 0 0/22px 22px, var(--paper)}
#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#graph.dragging{cursor:grabbing}
.stage-head{position:absolute;left:18px;top:14px;display:flex;align-items:baseline;gap:12px;pointer-events:none}
.stage-head .big{font-family:var(--kai);font-size:44px;color:var(--brand);line-height:1}
.stage-head .py{font-size:16px;color:var(--ink2)}
.stage-head .hint{font-size:12px;color:var(--ink2);background:rgba(255,253,248,.85);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.zoombar{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.zoombar button:hover{background:var(--paper2)}
.legend{position:absolute;left:18px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
/* SVG 元素 */
.edge{fill:none;stroke-width:2.4}
.edge.dash{stroke-dasharray:7 5}
.node{cursor:pointer}
.node rect{fill:var(--card);stroke-width:2;transition:.15s}
.node:hover rect{filter:drop-shadow(0 3px 6px rgba(80,60,30,.18))}
.node.sel rect{stroke-width:3.5}
.node text{font-size:15px;fill:var(--ink);font-weight:600;dominant-baseline:middle;text-anchor:middle;pointer-events:none}
.node .confdot{stroke:#fff;stroke-width:1.5}
.core circle.ring{fill:#fff;stroke:var(--t-ben);stroke-width:3}
.core circle.fillc{fill:var(--brand-soft)}
.core text.ch{font-family:var(--kai);font-size:62px;fill:var(--brand);font-weight:400}
.core text.mean{font-size:14px;fill:var(--ink);font-weight:600}
.core.sel circle.ring{stroke-width:5}
.elabel rect{stroke-width:1.5}
.elabel text.tp{font-size:12.5px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
.elabel text.why{font-size:11.5px;fill:var(--ink2);text-anchor:middle}
.elabel .whybg{fill:rgba(250,246,238,.92)}
/* 右栏 */
aside.panel{background:var(--card);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card h4{font-size:12.5px;color:var(--ink2);font-weight:600;margin:12px 0 6px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.card h4::before{content:"";width:4px;height:12px;border-radius:2px;background:var(--brand)}
.card p,.card li{font-size:14px;line-height:1.75}
.sectitle{font-size:12px;letter-spacing:2px;color:var(--ink2);margin:6px 2px 10px;font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;line-height:1.6;white-space:nowrap}
.tag.o{background:transparent;border:1px solid currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper2);border-radius:10px;padding:4px 11px;font-size:14px}
.chip b{color:var(--brand);font-weight:700}
.quote{font-family:var(--kai);font-size:16.5px;background:var(--paper);border-left:3px solid var(--brand);padding:8px 12px;border-radius:0 10px 10px 0;line-height:1.7}
.src{font-size:12.5px;color:var(--ink2);margin-top:4px}
.tr{font-size:13.5px;color:var(--ink);margin-top:4px;line-height:1.7}
.tr::before{content:"译文：";color:var(--ink2)}
.sample{font-size:14px;line-height:1.75}
.sample .tag{margin-right:6px;background:var(--t-jia)}
.tbd{font-size:13px;color:var(--c-tbd);background:#fbf3df;border-radius:10px;padding:7px 11px}
.evo{display:flex;flex-direction:column;gap:5px}
.evo div{font-size:13px;background:var(--paper);border-radius:8px;padding:5px 10px;color:var(--ink2)}
.evo div:last-child{color:var(--ink);font-weight:600}
.why-box{font-size:13.5px;background:var(--paper);border-radius:10px;padding:8px 12px;line-height:1.7}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.part{border-radius:12px;padding:10px;font-size:13px;line-height:1.6}
.part .lb{font-size:11.5px;font-weight:700;letter-spacing:1px;margin-bottom:3px}
.part.m{background:#e8f3f1}.part.m .lb{color:var(--t-yin)}
.part.s{background:#fbeee0}.part.s .lb{color:var(--t-bi)}
.formula{grid-column:1/3;text-align:center;font-size:13px;color:var(--ink2);background:var(--paper);border-radius:10px;padding:6px}
.pit{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.65;margin-bottom:8px}
.pit .ic{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.code li{list-style:none;position:relative;padding-left:18px;font-size:13.5px;margin-bottom:6px}
.code li::before{content:"◆";position:absolute;left:0;color:var(--t-zhuan);font-size:10px;top:5px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;font-size:14px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:11.5px;color:var(--ink2);line-height:1.6;padding:4px 4px 0}
@media (max-width:1100px){.main{grid-template-columns:110px 1fr 320px}}
@media (max-width:820px){
  body{overflow:auto}
  .main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}
  aside.chars{border-right:0;border-bottom:1px solid var(--line)}
  .charlist{grid-template-columns:repeat(10,1fr)}
  aside.panel{border-left:0}
}
</style>
</head>

   "form": "左右结构：扌 + 困"
  },
  "pitfalls": {
   "read": "读 kǔn（三声），不读 kùn。",
   "write": "右边“困”里面是“木”，别写成“禾”或“米”。"
  },
  "code": [
   "扌旁的字多是手的动作：捆、绑、拂、扎。",
   "“困”做声旁：捆、悃、阃，读音 kǔn / kùn。"
  ]
 },
 {
  "char": "铅",
  "pinyin": "qiān",
  "shuowen": "鉛，青金也。从金，㕣聲。",

    "type": "转喻",
    "why": "笔芯其实是石墨，但颜色像铅，名字就一直沿用下来。",
    "family": [
     "铅笔",
     "铅芯",
     "自动铅笔"
    ],
    "parse": "铅笔 = 铅（笔芯）+ 笔",
    "modern": "我的铅笔芯又断了。",

   {

    ],

    "modern": "以前的报纸是用铅字一个个排出来的。",

    "conf": "确定"

  ],
  "parts": {

   "sound": "㕣（yǎn）：表示读音（古今读音变化大）",

  },
  "pitfalls": {
   "read": "读 qiān；江西地名“铅山”读 yán。",
   "write": "右边是“几”下加“口”，和“船”“沿”的右边一样。"
  },
  "code": [
   "金字旁表示金属：铅、铜、铁、银。",

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const TYPE_COLOR = {"本义":"var(--t-ben)","引申":"var(--t-yin)","比喻":"var(--t-bi)","转喻":"var(--t-zhuan)","假借":"var(--t-jia)"};
const TYPE_HEX = {"本义":"#b5442e","引申":"#2f8f83","比喻":"#d9822b","转喻":"#7a5bb5","假借":"#5a7896"};
const TYPE_DESC = {"引申":"从原来的意思自然延伸","比喻":"像……一样，借相似点","转喻":"借相关的事物来指代","假借":"借字形记录读音相近的词"};
const CONF_COLOR = {"确定":"#3f8f4f","通行说法":"#3c6fb0","待查":"#c28a12"};
const MENUS = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = 0, selId = "core";
const view = {k:1,x:0,y:0};

/* 顶部菜单 */
const nav = $('topnav');
MENUS.forEach((m,i)=>{
  if(i) { const s=document.createElement('span'); s.className='sep'; s.textContent='｜'; nav.appendChild(s); }
  const b=document.createElement('button'); b.textContent=m; if(i===0) b.className='active';
  b.onclick=()=>{ if(i!==0) toast('「'+m+'」模块即将上线，敬请期待'); };
  nav.appendChild(b);
});
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }

/* 图例 */
$('legend').innerHTML = Object.keys(TYPE_HEX).map(t=>`<span><i style="background:${TYPE_HEX[t]}"></i>${t}</span>`).join('') +
  `<span style="margin-left:6px;color:var(--ink2)">把握：</span>` + Object.keys(CONF_COLOR).map(c=>`<span><i style="width:9px;height:9px;border-radius:50%;background:${CONF_COLOR[c]}"></i>${c}</span>`).join('');

/* 左侧字表 */
const list = $('charlist');
DATA.forEach((d,i)=>{
  const b=document.createElement('button'); b.className='charbtn';
  b.innerHTML=`<span class="c">${esc(d.char)}</span><span class="p">${esc(d.pinyin)}</span>`;
  b.onclick=()=>select(i); list.appendChild(b);
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){ select((cur+1)%DATA.length); e.preventDefault(); }
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ select((cur-1+DATA.length)%DATA.length); e.preventDefault(); }
});

function select(i){
  cur=i; selId="core";
  [...list.children].forEach((b,j)=>b.classList.toggle('active',j===i));
  list.children[i].scrollIntoView({block:'nearest'});
  const d=DATA[i];
  $('bigChar').textContent=d.char; $('bigPy').textContent=d.pinyin;
  drawGraph(d); renderPanel(d); fit();
}

/* ---------- 布局 ---------- */
function layout(d){
  const byId={}; d.senses.forEach(s=>byId[s.id]={...s,children:[]});
  const root=byId.core;
  d.senses.forEach(s=>{ if(s.from && byId[s.from]) byId[s.from].children.push(byId[s.id]); });
  // 叶子数决定扇区大小
  function leaves(n){ return n.children.length? n.children.reduce((a,c)=>a+leaves(c),0):1; }
  const total=leaves(root); const R=[0,310,540,750];
  function place(n,a0,a1,depth){
    n.depth=depth; const mid=(a0+a1)/2;
    if(depth===0){n.x=0;n.y=0;} else { n.x=Math.cos(mid)*R[depth]; n.y=Math.sin(mid)*R[depth]; n.angle=mid; }
    let a=a0;
    n.children.forEach(c=>{ const span=(a1-a0)*leaves(c)/leaves(n); place(c,a,a+span,depth+1); a+=span; });
  }
  const start=-Math.PI/2 - Math.PI/Math.max(total,2);
  place(root,start,start+Math.PI*2,0);
  return Object.values(byId);
}
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function wrap(text,n){ const out=[]; let s=String(text); while(s.length>n){ out.push(s.slice(0,n)); s=s.slice(n);} if(s) out.push(s); return out; }

function drawGraph(d){
  const vp=$('viewport'); vp.innerHTML='';
  const nodes=layout(d); const map={}; nodes.forEach(n=>map[n.id]=n);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  const CORE_R=78;
  nodes.forEach(n=>{
    if(!n.from) return; const p=map[n.from]; if(!p) return;
    const col=TYPE_HEX[n.type]||'#999';
    // 弧线
    const mx=(p.x+n.x)/2, my=(p.y+n.y)/2, dx=n.x-p.x, dy=n.y-p.y, len=Math.hypot(dx,dy)||1;
    const bend=p.depth===0?0:22; const cx=mx-dy/len*bend, cy=my+dx/len*bend;
    el('path',{d:`M${p.x},${p.y} Q${cx},${cy} ${n.x},${n.y}`,class:'edge'+(n.type==='假借'?' dash':''),stroke:col,opacity:.85},gE);
    // 箭头点
        // 标签
    const t=p.depth===0?0.56:0.5, lx=(1-t)*(1-t)*p.x+2*(1-t)*t*cx+t*t*n.x, ly=(1-t)*(1-t)*p.y+2*(1-t)*t*cy+t*t*n.y;
    const g=el('g',{class:'elabel',transform:`translate(${lx},${ly})`},gL);
    const lines=wrap(n.why,11);
    const bh=lines.length*15+8, bw=Math.max(...lines.map(l=>l.length))*12+14;
    const vertical=Math.abs(dx)<Math.abs(dy)*0.8;
    // 竖向连线：原因放在药丸右侧；横向/斜向：放在下方
    const side=vertical?(dx>=0?1:1):0;
    const bx=vertical? 30 : -bw/2, by=vertical? -bh/2 : 14;
    el('rect',{x:bx,y:by,width:bw,height:bh,rx:7,class:'whybg'},g);
    lines.forEach((l,i)=>{ const tx=el('text',{x:bx+bw/2,y:by+15+i*15,class:'why'},g); tx.textContent=l; });
    el('rect',{x:-24,y:-11,width:48,height:22,rx:11,fill:col,stroke:'#fff'},g);
    const tt=el('text',{x:0,y:1,class:'tp'},g); tt.textContent=n.type;
    const title=el('title',{},g); title.textContent=n.type+'：'+(TYPE_DESC[n.type]||'')+'\n'+n.why;
  });
  nodes.forEach(n=>{
    if(!n.from){
      const g=el('g',{class:'node core'+(selId==='core'?' sel':''),transform:'translate(0,0)'},gN);
      el('circle',{r:CORE_R+10,class:'fillc'},g);
      el('circle',{r:CORE_R,class:'ring'},g);
      const c=el('text',{y:-10,class:'ch','text-anchor':'middle','dominant-baseline':'middle'},g); c.textContent=d.char;
      const mean=n.name.length>6? n.name.slice(0,5)+'…':n.name;
      const m=el('text',{y:44,class:'mean'},g); m.textContent='本义 · '+mean;
      el('circle',{cx:CORE_R*0.7,cy:-CORE_R*0.7,r:7,fill:CONF_COLOR[n.conf],class:'confdot'},g);
      g.onclick=ev=>{ev.stopPropagation(); choose('core');};
      return;
    }
    const col=TYPE_HEX[n.type];
    const lines=wrap(n.name,11); const w=Math.max(...lines.map(l=>l.length))*15.5+30, h=lines.length*20+20;
    const g=el('g',{class:'node'+(selId===n.id?' sel':''),transform:`translate(${n.x},${n.y})`,'data-id':n.id},gN);
    el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:12,stroke:col},g);
    el('rect',{x:-w/2,y:-h/2,width:6,height:h,rx:3,fill:col,stroke:'none'},g);
    lines.forEach((l,i)=>{ const tx=el('text',{x:3,y:-((lines.length-1)*10)+i*20},g); tx.textContent=l; });
    el('circle',{cx:w/2-2,cy:-h/2+2,r:6,fill:CONF_COLOR[n.conf],class:'confdot'},g);
    g.onclick=ev=>{ev.stopPropagation(); choose(n.id);};
  });
}
function choose(id){
  selId=id; const d=DATA[cur];
  document.querySelectorAll('#viewport .node').forEach(g=>{
    const gid=g.classList.contains('core')?'core':g.getAttribute('data-id'); g.classList.toggle('sel',gid===id);
  });
  renderPanel(d);
  $('panel').scrollTop=0;
}

/* ---------- 缩放平移 ---------- */
const svg=$('graph');
function apply(){ $('viewport').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){
  const bb=$('viewport').getBBox(); const W=svg.clientWidth, H=svg.clientHeight; if(!W||!H||!bb.width) return;
  const pad=70; const k=Math.min((W-pad*2)/bb.width,(H-pad*2-40)/bb.height,1.25);
  view.k=Math.max(k,0.3); view.x=W/2-(bb.x+bb.width/2)*view.k; view.y=H/2+20-(bb.y+bb.height/2)*view.k; apply();
}
function zoomAt(f,px,py){
  const nk=Math.min(3,Math.max(0.25,view.k*f)); const r=nk/view.k;
  view.x=px-(px-view.x)*r; view.y=py-(py-view.y)*r; view.k=nk; apply();
}
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
let drag=null; const pts=new Map();
svg.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1){ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; } });
window.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; const pa=e.pointerId===[...pts.keys()][0]?prev:a; 
    const d1=Math.hypot(a.x-b.x,a.y-b.y); const other=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y); if(d0>0){ const r=svg.getBoundingClientRect(); zoomAt(d1/d0,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);} return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3){ drag.moved=true; svg.classList.add('dragging'); }
    if(drag.moved){ view.x=drag.vx+dx; view.y=drag.vy+dy; apply(); } }
});
window.addEventListener('pointerup',e=>{ pts.delete(e.pointerId); if(pts.size===0){ drag=null; svg.classList.remove('dragging'); } });
svg.addEventListener('click',e=>{ /* 空白点击不做事 */ },true);
$('zin').onclick=()=>zoomAt(1.2,svg.clientWidth/2,svg.clientHeight/2);
$('zout').onclick=()=>zoomAt(1/1.2,svg.clientWidth/2,svg.clientHeight/2);
$('zfit').onclick=fit;
window.addEventListener('resize',fit);

/* ---------- 右栏 ---------- */
function typeTag(t){ return `<span class="tag" style="background:${TYPE_HEX[t]}">${esc(t)}</span>`; }
function confTag(c){ return `<span class="tag" style="background:${CONF_COLOR[c]||'#999'}" title="把握程度">${esc(c)}</span>`; }
const MODERN_ONLY=["垃","烤","氢","圾"];
function senseCard(d,s){
  const isCore=s.id==='core';
  let h=`<div class="card"><h2>${isCore?'本义：':''}${esc(s.name)} ${typeTag(s.type)} ${confTag(s.conf)}</h2>`;
  if(!isCore){
    const parent=d.senses.find(x=>x.id===s.from);
    h+=`<div class="why-box"><b style="color:${TYPE_HEX[s.type]}">${esc(s.type)}</b>（${esc(TYPE_DESC[s.type])}）：从「${esc(parent?parent.name:'')}」来——${esc(s.why)}</div>`;
  }
  if(isCore){
    h+=`<h4>《说文解字》</h4><div class="quote">${esc(d.shuowen)}</div><div class="src">把握：${confTag(d.shuowenConf)}</div>`;
    h+=`<h4>字形演变（图片占位）</h4><div class="evo">${d.evolution.map(e=>`<div>${esc(e)}</div>`).join('')}</div>`;
    h+=`<h4>为什么这是本义</h4><div class="why-box">${esc(d.judge)}</div>`;
  }
  h+=`<h4>词族</h4><div class="chips">${s.family.map(w=>`<span class="chip">${esc(w).replace(esc(d.char),'<b>'+esc(d.char)+'</b>')}</span>`).join('')}</div>`;
  h+=`<h4>构词拆解</h4><div class="why-box">${esc(s.parse)}</div>`;
  h+=`<h4>现代例句</h4><div class="sample"><span class="tag">示例</span>${esc(s.modern)}</div>`;
  h+=`<h4>文言原句</h4>`;
  if(s.classic){ h+=`<div class="quote">${esc(s.classic.text)}</div><div class="src">—— ${esc(s.classic.src)}</div><div class="tr">${esc(s.classic.tr)}</div>`; }
  else if(MODERN_ONLY.includes(d.char)){ h+=`<div class="tbd">近现代才通行的字或用法，古书中暂无可靠用例。</div>`; }
  else { h+=`<div class="tbd">待查：暂未核实到可靠出处，宁缺不编。</div>`; }
  h+=`<h4>把握程度</h4><div style="font-size:13px;color:var(--ink2)">${confTag(s.conf)}&nbsp; 确定＝辞书与古籍明确；通行说法＝多数教材采用、学界有讨论；待查＝需进一步核对</div>`;
  return h+`</div>`;
}
function renderPanel(d){
  const s=d.senses.find(x=>x.id===selId)||d.senses[0];
  let h=`<div class="sectitle">义项详情</div>`+senseCard(d,s);
  h+=`<div class="sectitle">「${esc(d.char)}」字档案</div>`;
  h+=`<div class="card"><h2>偏旁拆分</h2><div class="parts">
      <div class="part m"><div class="lb">表义部分</div>${esc(d.parts.meaning)}</div>
      <div class="part s"><div class="lb">表音部分</div>${esc(d.parts.sound)}</div>
      <div class="formula">${esc(d.parts.form)}</div></div></div>`;
  h+=`<div class="card"><h2>易错提醒</h2>
      <div class="pit"><span class="ic" style="background:var(--t-bi)">读</span><span>${esc(d.pitfalls.read)}</span></div>
      <div class="pit"><span class="ic" style="background:var(--brand)">写</span><span>${esc(d.pitfalls.write)}</span></div></div>`;
  h+=`<div class="card"><h2>汉字密码 <span class="tag o" style="color:var(--t-zhuan)">规律</span></h2><ul class="code">${d.code.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  h+=`<div class="card"><h2>义项一览</h2><div class="chips">${d.senses.map(x=>`<span class="chip" style="cursor:pointer;border:1.5px solid ${x.id===selId?TYPE_HEX[x.type]:'transparent'}" data-sid="${x.id}">${esc(x.name)}</span>`).join('')}</div></div>`;
  h+=`<div class="foot">说明：现代例句均为自编，标“示例”；古文引文只收常见出处，拿不准的标“待查”。字形演变为文字占位，后续替换为字形图。</div>`;
  $('panel').innerHTML=h;
  $('panel').querySelectorAll('[data-sid]').forEach(c=>c.onclick=()=>choose(c.dataset.sid));
}

select(0);
})();
</script>
