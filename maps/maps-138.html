<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 儿童汉字学习</title>
<style>
:root{
  --paper:#fbf7ef; --paper2:#f4ecdc; --ink:#2b2622; --ink2:#6b6157; --line:#e4d8c3;
  --seal:#c0392b; --seal-soft:#f6e1dc;
  --yin:#2e8b7a; --bi:#e08a1e; --zhuan:#7b5ea7; --jia:#7d8590;
  --ok:#2e8b57; --mid:#d4a017; --todo:#b8463a;
  --card:#fffdf8; --shadow:0 6px 24px rgba(80,60,30,.10);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.kai{font-family:"STKaiti","KaiTi","楷体","Kaiti SC","BiauKai",serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:18px;padding:10px 22px;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.05);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.seal{width:34px;height:34px;border-radius:9px;background:var(--seal);color:#fff;display:grid;place-items:center;font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--ink2);
  cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
nav.top button:hover{background:var(--paper2);color:var(--ink)}
nav.top button.on{background:var(--seal);color:#fff;font-weight:600}
.main{display:grid;grid-template-columns:200px 1fr 360px;min-height:0}
aside.left{border-right:1px solid var(--line);background:var(--paper2);padding:16px 12px;overflow-y:auto}
.ltitle{font-size:12px;color:var(--ink2);letter-spacing:2px;margin:0 6px 10px}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chars button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;transition:.15s}
.chars button b{font-size:26px;font-weight:500;line-height:1.1}
.chars button span{font-size:11px;color:var(--ink2)}
.chars button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.chars button.on{background:var(--seal);border-color:var(--seal);color:#fff}
.chars button.on span{color:#fde}
.legend{margin-top:18px;padding:10px;background:var(--card);border-radius:12px;font-size:12px;line-height:2}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
section.stage{position:relative;min-width:0;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,#fffaf0 0,#fbf5e8 60%,#f5ecd9 100%)}
.stage-head{position:absolute;left:18px;top:14px;z-index:2;display:flex;align-items:flex-end;gap:12px;pointer-events:none}
.stage-head .big{font-size:52px;line-height:1}
.stage-head .meta{font-size:13px;color:var(--ink2);padding-bottom:6px}
.zoom{position:absolute;right:16px;top:14px;z-index:2;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;
  font-size:18px;color:var(--ink);box-shadow:var(--shadow)}
.hint{position:absolute;left:18px;bottom:12px;font-size:12px;color:var(--ink2);z-index:2}
svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg.drag{cursor:grabbing}
.node{cursor:pointer}
.node rect,.node circle{transition:filter .15s}
.node:hover rect,.node:hover circle{filter:drop-shadow(0 4px 8px rgba(80,60,30,.25))}
aside.right{border-left:1px solid var(--line);background:var(--paper);overflow-y:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:6px;height:16px;border-radius:3px;background:var(--seal)}
.card h4{margin:12px 0 6px;font-size:12px;color:var(--ink2);letter-spacing:1px;font-weight:600}
.sense-name{font-size:20px;font-weight:700;margin:2px 0 6px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;margin-right:6px;vertical-align:2px}
.cert{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--paper2);border-radius:8px;padding:4px 10px;font-size:14px}
.p{font-size:14px;line-height:1.75;margin:0}
.quote{border-left:3px solid var(--seal);background:var(--seal-soft);padding:8px 10px;border-radius:0 10px 10px 0;font-size:15px;line-height:1.7}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.tag-sample{font-size:11px;background:#fff1c9;color:#8a6200;border-radius:6px;padding:1px 6px;margin-left:6px}
.tbd{color:var(--todo);font-weight:600}
.parts{display:flex;gap:10px;align-items:stretch}
.part{flex:1;border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center}
.part b{display:block;font-size:30px;font-weight:500}
.part small{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;color:#fff;margin:4px 0}
.part p{margin:0;font-size:12px;color:var(--ink2);line-height:1.5}
.plus{align-self:center;color:var(--ink2);font-size:18px}
ul.codes{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8}
.evo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.evo div{flex:1;min-width:52px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--ink2);background:var(--paper)}
.evo div b{display:block;font-size:12px;color:var(--ink);margin-bottom:3px}
.placeholder{display:grid;place-items:center;height:100%;color:var(--ink2);text-align:center;padding:40px}
.placeholder .seal{width:64px;height:64px;font-size:34px;margin:0 auto 14px;border-radius:16px;opacity:.85}
@media (max-width:1100px){.main{grid-template-columns:170px 1fr 300px}}
</style>
</head>

<header>
  <div class="brand"><div class="seal kai">字</div>汉字小园丁</div>
  <nav class="top" id="topnav"></nav>
</header>
<div class="main" id="main">
  <aside class="left">
    <div class="ltitle">本组 20 字</div>

      <div><i style="background:var(--yin)"></i>引申：意思顺着走远</div>
      <div><i style="background:var(--bi)"></i>比喻：像……一样</div>
      <div><i style="background:var(--zhuan)"></i>转喻：用相关的东西代指</div>
      <div><i style="background:var(--jia)"></i>假借：借音不借义</div>
      <div style="margin-top:6px"><b>把握程度</b></div>
      <div><i style="background:var(--ok);border-radius:50%"></i>确定</div>
      <div><i style="background:var(--mid);border-radius:50%"></i>通行说法</div>
      <div><i style="background:var(--todo);border-radius:50%"></i>待查</div>
    </div>
  </aside>
  <section class="stage" id="stage">
    <div class="stage-head"><div class="big kai" id="bigChar"></div><div class="meta" id="bigMeta"></div></div>
    <div class="zoom">
      <button id="zin" title="放大">＋</button>
      <button id="zout" title="缩小">－</button>
      <button id="zreset" title="复位">⟲</button>
    </div>
    <svg id="svg"><defs>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#503c1e" flood-opacity=".12"/></filter>
    </defs><g id="world"></g></svg>
    <div class="hint">滚轮缩放 · 拖动平移 · 点击义项查看详情</div>
  </section>
  <aside class="right" id="right"></aside>
</div>
</div>

<script>
(function(){

const CERT_COLOR = {"确定":"#2e8b57","通行说法":"#d4a017","待查":"#b8463a"};
const MODULES = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
let cur = 0, sel = "r", mod = 0;
let view = {x:0,y:0,k:1};
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* top nav */
MODULES.forEach((m,i)=>{
  const b=document.createElement('button'); b.textContent=m; if(i===0)b.className='on';
  b.onclick=()=>{mod=i;[...$('topnav').children].forEach((x,j)=>x.classList.toggle('on',j===i));renderModule();};
  $('topnav').appendChild(b);
});
let mainHTML=null;
function renderModule(){
  const main=$('main');
  if(mod===0){ if(mainHTML){main.innerHTML=mainHTML;mainHTML=null;bind();renderAll();} return; }
  if(!mainHTML) mainHTML=main.innerHTML;
  main.innerHTML='<div class="placeholder" style="grid-column:1/-1"><div><div class="seal kai">'+esc(MODULES[mod][0])+'</div><h2 style="margin:0 0 6px">'+esc(MODULES[mod])+'</h2><p>本文件只实现了「字义扩展图」，此模块待开发。</p></div></div>';
}

function buildList(){
  const box=$('charlist'); box.innerHTML='';
  D.chars.forEach((c,i)=>{
    const b=document.createElement('button');
    b.innerHTML='<b class="kai">'+c.c+'</b><span>'+c.py+'</span>';
    if(i===cur)b.className='on';
    b.onclick=()=>{cur=i;sel='r';view={x:0,y:0,k:1};renderAll();};
    box.appendChild(b);
  });
}

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function wrap(s,n){const out=[];for(let i=0;i<s.length;i+=n)out.push(s.slice(i,i+n));return out;}

function layout(ch){
  const pos={}; const kids={};
  ch.senses.forEach(s=>{ if(s.from){(kids[s.from]=kids[s.from]||[]).push(s);} });
  pos.r={x:0,y:0,a:0};
  const L1=kids.r||[]; const n=L1.length;
  const R1 = n<=2?250:240;
  L1.forEach((s,i)=>{
    const a = n<=2 ? Math.PI + i*Math.PI : -Math.PI/2 + i*2*Math.PI/n;
    pos[s.id]={x:Math.cos(a)*R1*1.25,y:Math.sin(a)*R1,a:a};
  });
  // level 2+
  function place(pid,depth){
    const ks=kids[pid]; if(!ks)return;
    ks.forEach((s,i)=>{
      const pa=pos[pid].a; const spread=0.55;
      const a = pa + (ks.length===1?0:(i-(ks.length-1)/2)*spread);
      const R = R1+190*(depth-1);
      pos[s.id]={x:Math.cos(a)*R*1.25,y:Math.sin(a)*R,a:a};
      place(s.id,depth+1);
    });
  }
  L1.forEach(s=>place(s.id,2));
  return pos;
}

function renderMap(){
  const ch=D.chars[cur]; const svg=$('svg'); const W=svg.clientWidth, H=svg.clientHeight;
  const world=$('world'); world.innerHTML='';
  world.setAttribute('transform',`translate(${W/2+view.x},${H/2+view.y+20}) scale(${view.k})`);
  const pos=layout(ch);
  // rings
  [240,430].forEach(r=>el('ellipse',{cx:0,cy:0,rx:r*1.25,ry:r,fill:'none',stroke:'#e9dcc4','stroke-dasharray':'4 8'},world));
  // edges
  const gE=el('g',{},world), gL=el('g',{},world), gN=el('g',{},world);
  ch.senses.forEach(s=>{
    if(!s.from)return;
    const p=pos[s.from], q=pos[s.id]; const col=TYPE_COLOR[s.type]||'#999';
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2; const dx=q.x-p.x, dy=q.y-p.y;
    const cx=mx-dy*0.12, cy=my+dx*0.12;
    el('path',{d:`M${p.x},${p.y} Q${cx},${cy} ${q.x},${q.y}`,fill:'none',stroke:col,'stroke-width':sel===s.id?3.5:2.2,'stroke-dasharray':s.type==='假借'?'6 5':'',opacity:.85},gE);
    // label at curve midpoint
    const lx=0.25*p.x+0.5*cx+0.25*q.x, ly=0.25*p.y+0.5*cy+0.25*q.y;
    const g=el('g',{transform:`translate(${lx},${ly})`},gL);
    const lines=wrap(s.why,10); const bw=Math.max(...lines.map(l=>l.length))*11+16, bh=24+lines.length*14;
    el('rect',{x:-bw/2,y:-12,width:bw,height:bh,rx:9,fill:'#fffdf8',stroke:col,'stroke-width':1,opacity:.96},g);
    const t=el('text',{x:0,y:3,'text-anchor':'middle','font-size':12,'font-weight':700,fill:col},g); t.textContent=s.type;
    lines.forEach((l,i)=>{const tt=el('text',{x:0,y:18+i*14,'text-anchor':'middle','font-size':11,fill:'#6b6157'},g);tt.textContent=l;});
  });
  // nodes
  ch.senses.forEach(s=>{
    const p=pos[s.id]; const g=el('g',{class:'node',transform:`translate(${p.x},${p.y})`},gN);
    g.addEventListener('click',e=>{e.stopPropagation();sel=s.id;renderMap();renderRight();});
    const cc=CERT_COLOR[s.cert]||'#999';
    if(!s.from){
      el('circle',{r:78,fill:'#c0392b',filter:'url(#soft)'},g);
      el('circle',{r:70,fill:'none',stroke:'#fff',opacity:.5,'stroke-width':sel==='r'?3:1},g);
      const t=el('text',{y:4,'text-anchor':'middle','font-size':58,fill:'#fff',class:'kai'},g);t.textContent=ch.c;
      const t2=el('text',{y:40,'text-anchor':'middle','font-size':13,fill:'#fde',}, g);t2.textContent='本义 · '+s.name;
      el('circle',{cx:56,cy:-56,r:7,fill:cc,stroke:'#fff','stroke-width':2},g);
    }else{
      const w=Math.max(96,s.name.length*16+36), h=46; const col=TYPE_COLOR[s.type];
      el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:sel===s.id?col:'#fffdf8',stroke:col,'stroke-width':2,filter:'url(#soft)'},g);
      const t=el('text',{y:6,'text-anchor':'middle','font-size':15,'font-weight':600,fill:sel===s.id?'#fff':'#2b2622'},g);t.textContent=s.name;
      el('circle',{cx:w/2-6,cy:-h/2+6,r:6,fill:cc,stroke:'#fff','stroke-width':2},g);
    }
  });
}

function certBadge(c){const col=CERT_COLOR[c]||'#999';return `<span class="cert" style="color:${col};border-color:${col}"><span style="width:7px;height:7px;border-radius:50%;background:${col};display:inline-block"></span>${esc(c)}</span>`;}

function renderRight(){
  const ch=D.chars[cur]; const s=ch.senses.find(x=>x.id===sel)||ch.senses[0]; const isRoot=!s.from;
  const parent=s.from?ch.senses.find(x=>x.id===s.from):null;
  let h='';

  h+=`<div class="card"><h3><span class="dot"></span>义项卡</h3>`;
  h+=`<div>${isRoot?'<span class="chip" style="background:var(--seal)">本义</span>':`<span class="chip" style="background:${TYPE_COLOR[s.type]}">${esc(s.type)}</span><span style="font-size:12px;color:var(--ink2)">由「${esc(parent.name)}」而来</span>`}</div>`;

  h+=`<h4>现代例句<span class="tag-sample">示例</span></h4><p class="p">${esc(s.ex)}</p>`;
  h+=`<h4>文言原句</h4>`;
  if(s.gu){h+=`<div class="quote kai">${esc(s.gu.t)}</div><div class="src">出处：${esc(s.gu.src)}</div><p class="p" style="margin-top:6px;font-size:13px">译文：${esc(s.gu.tr)}</p>`;}
  else h+=`<p class="p"><span class="tbd">待查</span> <span style="color:var(--ink2);font-size:13px">未找到可核对的文言用例，暂不列出。</span></p>`;
  h+=`<h4>把握程度</h4>${certBadge(s.cert)}</div>`;
  // origin card
  h+=`<div class="card"><h3><span class="dot"></span>本义溯源</h3>`;
  h+=`<h4>《说文》原文</h4><div class="quote kai">${esc(ch.sw.text)}</div><div style="margin-top:6px">${certBadge(ch.sw.cert)}</div>`;
  h+=`<h4>字形演变（文字占位）</h4><div class="evo">${ch.evo.map(e=>{const [a,b]=e.split('：');return `<div><b>${esc(a)}</b>${esc(b||'')}</div>`;}).join('')}</div>`;
  h+=`<h4>本义判定理由</h4><p class="p">${esc(ch.reason)}</p></div>`;
  // parts
  h+=`<div class="card"><h3><span class="dot"></span>偏旁拆分</h3><div class="parts">`;
  ch.parts.forEach((p,i)=>{
    const col=p.role.indexOf('表音')===0?'#2e8b7a':(p.role.indexOf('兼')>0?'#7b5ea7':'#c0392b');
    if(i)h+='<div class="plus">＋</div>';
    h+=`<div class="part"><b class="kai">${esc(p.p)}</b><small style="background:${col}">${esc(p.role)}</small><p>${esc(p.note)}</p></div>`;
  });
  h+=`</div><p class="p" style="margin-top:8px;font-size:12px;color:var(--ink2)">${esc(ch.struct)}${ch.trad?' · 繁体：'+esc(ch.trad):''}</p></div>`;
  // errors
  h+=`<div class="card"><h3><span class="dot" style="background:#e08a1e"></span>易读错 · 易写错</h3>`;
  h+=`<h4>🔊 读音</h4><p class="p">${esc(ch.err.read)}</p><h4>✏️ 字形</h4><p class="p">${esc(ch.err.write)}</p></div>`;
  // codes
  h+=`<div class="card"><h3><span class="dot" style="background:#7b5ea7"></span>汉字密码</h3><ul class="codes">${ch.codes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  h+=`<p style="font-size:11px;color:var(--ink2);line-height:1.6;padding:0 4px">${esc(D.meta.note)}</p>`;
  $('right').innerHTML=h;
}

function renderHead(){const ch=D.chars[cur];$('bigChar').textContent=ch.c;$('bigMeta').innerHTML=`${ch.py} · ${ch.struct} · ${ch.senses.length} 个义项`;}
function renderAll(){buildList();renderHead();renderMap();renderRight();}

function bind(){
  const svg=$('svg'); let drag=null;
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();
    const mx=e.clientX-r.left-r.width/2-view.x, my=e.clientY-r.top-r.height/2-20-view.y;
    const f=e.deltaY<0?1.12:1/1.12; const nk=Math.min(3,Math.max(.35,view.k*f)); const ff=nk/view.k;
    view.x-=mx*(ff-1); view.y-=my*(ff-1); view.k=nk; renderMap();},{passive:false});
  svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');});
  window.addEventListener('mousemove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;renderMap();});
  window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('drag');});
  $('zin').onclick=()=>{view.k=Math.min(3,view.k*1.2);renderMap();};
  $('zout').onclick=()=>{view.k=Math.max(.35,view.k/1.2);renderMap();};
  $('zreset').onclick=()=>{view={x:0,y:0,k:1};renderMap();};
}
window.addEventListener('resize',()=>{if(mod===0)renderMap();});
bind(); renderAll();
})();
</script>
