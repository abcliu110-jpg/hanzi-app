<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字义扩展图 · 儿童汉字学习</title>
<style>
:root{
  --bg:#f6f1e7;--paper:#fffdf8;--ink:#2f2a24;--ink2:#6b6257;--line:#e6dccb;
  --brand:#c2553b;--brand2:#f3d9c9;--shadow:0 6px 24px rgba(80,60,30,.10);
  --yin:#3d7ab8;--bi:#e08a2c;--zhuan:#3f9a6b;--jia:#8b5cc4;--ben:#c2553b;
  --ok:#3f9a6b;--mid:#c98a1a;--tbd:#b0473b;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
button{font-family:inherit;cursor:pointer}
/* top bar */
header{display:flex;align-items:center;gap:18px;padding:0 20px;height:60px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo b{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:22px}
.logo span{font-size:15px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;position:relative}
nav.top button:hover{background:#f3ece0;color:var(--ink)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(194,85,59,.3)}
nav.top button .soon{font-size:10px;margin-left:4px;opacity:.6}
/* layout */
.wrap{flex:1;display:grid;grid-template-columns:172px 1fr 320px;min-height:0}
aside.left{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside.left h3{font-size:12px;color:var(--ink2);font-weight:600;padding:16px 16px 8px;letter-spacing:.1em}
.charlist{overflow-y:auto;padding:0 10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.charlist button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;transition:.15s}
.charlist button .c{font-family:var(--kai);font-size:28px;line-height:1.1}
.charlist button .p{font-size:11px;color:var(--ink2);margin-top:2px}
.charlist button .n{font-size:10px;color:#b3a894}
.charlist button:hover{border-color:var(--brand);transform:translateY(-1px)}
.charlist button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(194,85,59,.28)}
.charlist button.on .p,.charlist button.on .n{color:#ffe9df}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.mhead{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.7);flex-wrap:wrap}
.bigc{font-family:var(--kai);font-size:44px;line-height:1;width:60px;height:60px;display:grid;place-items:center;background:#fff;border:2px solid var(--brand2);border-radius:14px;position:relative}
.bigc::before,.bigc::after{content:"";position:absolute;background:repeating-linear-gradient(90deg,#f0c9b8 0 4px,transparent 4px 8px)}
.bigc::before{left:4px;right:4px;top:50%;height:1px}
.bigc::after{top:4px;bottom:4px;left:50%;width:1px;background:repeating-linear-gradient(0deg,#f0c9b8 0 4px,transparent 4px 8px)}
.bigc span{position:relative;z-index:1}
.minfo .py{font-size:18px;font-weight:600;color:var(--brand)}
.minfo .tr{font-size:12px;color:var(--ink2);margin-top:2px}
.legend{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
.stage{flex:1;position:relative;min-height:0;overflow:hidden;
  background-color:#fbf7ef;background-image:radial-gradient(#e7dccb 1px,transparent 1px);background-size:22px 22px}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.zoombar{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoombar button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink);box-shadow:var(--shadow)}
.zoombar button:hover{color:var(--brand);border-color:var(--brand)}
.hint{position:absolute;left:62px;bottom:20px;font-size:12px;color:#a59a86;z-index:3}
/* nodes */
.node{cursor:pointer}
.node rect{fill:#fff;stroke-width:2;transition:filter .15s}
.node:hover rect{filter:drop-shadow(0 4px 10px rgba(80,60,30,.2))}
.node.sel rect{stroke-width:3.5}
.node text{font-family:var(--sans);pointer-events:none}
.root circle.halo{fill:none;stroke:var(--brand2);stroke-width:10}
.root.sel circle.core{stroke-width:5}
.elabel text{font-family:var(--sans);pointer-events:none}
/* detail card */
.detail{position:absolute;top:14px;right:14px;width:380px;max-height:calc(100% - 28px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 36px rgba(80,60,30,.16);z-index:4;padding:18px 18px 16px}
.detail.hide{display:none}
.detail .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:20px;color:var(--ink2)}
.dtitle{font-size:18px;font-weight:700;margin-right:24px;line-height:1.4}
.badges{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600}
.cert{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;font-weight:600;background:#fff}
.cert.c1{color:var(--ok)}.cert.c2{color:var(--mid)}.cert.c3{color:var(--tbd)}
.sec{margin-top:14px}
.sec h4{font-size:12px;color:var(--ink2);letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sec h4::before{content:"";width:4px;height:12px;border-radius:2px;background:var(--brand)}
.why{background:#fff6ec;border-radius:12px;padding:10px 12px;line-height:1.7;font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13.5px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.75;font-size:13.5px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;background:#efe7da;color:var(--ink2);margin-left:6px;vertical-align:1px}
.cls{font-family:var(--kai);font-size:17px;line-height:1.7}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.trn{font-size:13px;color:var(--ink);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.tbd{color:var(--tbd);font-size:13px;line-height:1.6}
.sw{font-family:var(--kai);font-size:17px;line-height:1.75;background:#fff;border-left:4px solid var(--brand);border-radius:0 12px 12px 0;padding:10px 12px}
.evo{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.evo .st{display:flex;flex-direction:column;align-items:center;gap:3px}
.evo .gl{width:52px;height:52px;border:1.5px dashed #d9c9b0;border-radius:10px;display:grid;place-items:center;font-size:10px;color:#a8997f;text-align:center;line-height:1.2;background:#fff}
.evo .gl.k{border-style:solid;border-color:var(--brand);font-family:var(--kai);font-size:30px;color:var(--ink)}
.evo .lb{font-size:11px;color:var(--ink2)}
.evo .ar{color:#c9b89c;font-size:14px;margin-bottom:16px}
/* right */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 em{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px}
.split{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 12px}
.split .whole{font-family:var(--kai);font-size:40px}
.split .eq{color:#bbae98;font-size:18px}
.split .pc{display:flex;flex-direction:column;align-items:center;min-width:52px}
.split .pc b{font-family:var(--kai);font-size:28px;font-weight:400;width:52px;height:52px;display:grid;place-items:center;border-radius:12px}
.split .pc small{font-size:11px;margin-top:4px;font-weight:600}
.pc.s b{background:#e8f1fa;color:var(--yin)}.pc.s small{color:var(--yin)}
.pc.h b{background:#fdf0e1;color:var(--bi)}.pc.h small{color:var(--bi)}
.prow{font-size:13px;line-height:1.6;padding:6px 0;border-top:1px dashed var(--line);display:flex;gap:8px}
.prow .k{flex-shrink:0;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;height:fit-content;margin-top:2px}
.prow .k.s{background:#e8f1fa;color:var(--yin)}.prow .k.h{background:#fdf0e1;color:var(--bi)}
ul.err{list-style:none}
ul.err li{font-size:13px;line-height:1.6;padding:6px 0 6px 22px;position:relative;border-top:1px dashed var(--line)}
ul.err li:first-child{border-top:0}
ul.err li::before{position:absolute;left:0;top:6px;font-size:12px}
ul.err.r li::before{content:"🔊"}ul.err.w li::before{content:"✏️"}
.errh{font-size:12px;font-weight:600;color:var(--ink2);margin:8px 0 2px}
.code{background:linear-gradient(135deg,#f7f0ff,#fff);border:1px solid #e6dcf6;border-radius:12px;padding:10px 12px;margin-top:8px}
.code .r{font-weight:600;font-size:13px;color:var(--jia)}
.code .e{font-size:13px;margin-top:4px;line-height:1.6;font-family:var(--sans)}
.note{font-size:11.5px;color:#a3977f;line-height:1.6;margin-top:4px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:.92}
@media (max-width:1100px){.wrap{grid-template-columns:150px 1fr}aside.right{display:none}.detail{width:320px}}
</style>
</head>

<script>

  L1.forEach((s,i)=>{const a=(start+i*360/n)*Math.PI/180;pos[s.id]={x:Math.cos(a)*R1,y:Math.sin(a)*R1,a};});
  function sub(pid,depth){(kids[pid]||[]).forEach((s,j,arr)=>{const pa=pos[pid].a;const a=pa+(j-(arr.length-1)/2)*0.42;const R=R1+(R2-R1)*depth;
    pos[s.id]={x:Math.cos(a)*R,y:Math.sin(a)*R,a};sub(s.id,depth+1);});}
  L1.forEach(s=>sub(s.id,1));return pos;}

function drawMap(d){const vp=$('vp');vp.innerHTML='';const pos=layout(d);
  const gE=el('g',{},vp),gL=el('g',{},vp),gN=el('g',{},vp);
  const NW=168;
  d.senses.forEach(s=>{if(!s.p)return;const a=pos[s.p],b=pos[s.id];const col=TYPE[s.type]||'#999';
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=b.x-a.x,dy=b.y-a.y;const len=Math.hypot(dx,dy);
    const cx=mx-dy/len*28,cy=my+dx/len*28;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':s.type==='假借'?2.5:3,'stroke-dasharray':s.type==='假借'?'8 6':(s.type==='转喻'?'2 6':''),'stroke-linecap':'round',opacity:.85},gE);
    // label at curve midpoint
    const lx=0.25*a.x+0.5*cx+0.25*b.x, ly=0.25*a.y+0.5*cy+0.25*b.y;
    const lines=wrap(s.why,12).slice(0,4);const W=12*12+16, H=26+lines.length*15+6;
    const g=el('g',{class:'elabel',transform:`translate(${lx-W/2},${ly-H/2})`},gL);
    el('rect',{width:W,height:H,rx:10,fill:'rgba(255,253,248,.94)',stroke:col,'stroke-opacity':.35},g);
    el('rect',{x:W/2-24,y:6,width:48,height:18,rx:9,fill:col},g);
    const t=el('text',{x:W/2,y:19,'text-anchor':'middle','font-size':11.5,'font-weight':700,fill:'#fff'},g);t.textContent=s.type;
    lines.forEach((ln,k)=>{const tt=el('text',{x:W/2,y:40+k*15,'text-anchor':'middle','font-size':11,fill:'#5d5448'},g);tt.textContent=ln;});
    g.style.cursor='pointer';g.style.pointerEvents='all';g.addEventListener('click',e=>{e.stopPropagation();select(s.id);});
  });
  d.senses.forEach((s,i)=>{const p=pos[s.id];
    if(!s.p){const g=el('g',{class:'node root'+(sel===s.id?' sel':''),'data-id':s.id,transform:`translate(${p.x},${p.y})`},gN);
      el('circle',{class:'halo',r:96},g);
      el('circle',{class:'core',r:86,fill:'#fff',stroke:TYPE['本义'],'stroke-width':3},g);
      el('text',{y:-30,'text-anchor':'middle','font-size':11,fill:TYPE['本义'],'font-weight':700,'letter-spacing':'2'},g).textContent='本 义';
      const c=el('text',{y:22,'text-anchor':'middle','font-size':58,fill:'#2f2a24'},g);c.style.fontFamily='var(--kai)';c.textContent=d.char;
      wrap(d.origin.label,8).slice(0,2).forEach((ln,k)=>{el('text',{y:46+k*14,'text-anchor':'middle','font-size':11.5,fill:'#6b6257'},g).textContent=ln;});
      const sw=d.origin.shuowen?'《说文》有载':'《说文》未收／待查';
      el('text',{y:118,'text-anchor':'middle','font-size':11,fill:'#a3977f'},g).textContent=sw;
      g.addEventListener('click',e=>{e.stopPropagation();select(s.id);});return;}
    const col=TYPE[s.type];const lines=wrap(s.label,9).slice(0,3);const H=34+lines.length*18;
    const g=el('g',{class:'node'+(sel===s.id?' sel':''),'data-id':s.id,transform:`translate(${p.x-NW/2},${p.y-H/2})`},gN);
    el('rect',{width:NW,height:H,rx:14,stroke:col},g);
    el('rect',{width:NW,height:6,rx:3,fill:col,opacity:.9},g);
    el('text',{x:12,y:24,'font-size':10.5,fill:col,'font-weight':700},g).textContent='义项 '+i;
    const cc=CERT[s.cert];const ccol=cc==='c1'?'#3f9a6b':cc==='c2'?'#c98a1a':'#b0473b';
    el('circle',{cx:NW-14,cy:20,r:4.5,fill:ccol},g);
    lines.forEach((ln,k)=>{el('text',{x:NW/2,y:46+k*18,'text-anchor':'middle','font-size':15,'font-weight':600,fill:'#2f2a24'},g).textContent=ln;});
    g.addEventListener('click',e=>{e.stopPropagation();select(s.id);});
  });
  applyView();}

function select(id){sel=id;document.querySelectorAll('#vp .node').forEach(n=>n.classList.toggle('sel',n.dataset.id===id));renderDetail(DATA[cur],id);}

/* zoom & pan */
const svg=$('map');
function applyView(){$('vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function fit(){const vp=$('vp');const bb=vp.getBBox();const r=svg.getBoundingClientRect();
  const det=$('detail').classList.contains('hide')?0:Math.min(394,r.width*0.45);
  const W=r.width-det-40,H=r.height-40;const k=Math.max(.3,Math.min(1.2,Math.min(W/bb.width,H/bb.height)));
  view.k=k;view.x=20+(W-bb.width*k)/2-bb.x*k;view.y=20+(H-bb.height*k)/2-bb.y*k;applyView();}
function zoomAt(f,cx,cy){const nk=Math.max(.25,Math.min(3.5,view.k*f));f=nk/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=nk;applyView();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.elabel'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyView();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$('zfit').onclick=fit;
window.addEventListener('resize',fit);
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){load((cur+1)%DATA.length);}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){load((cur-1+DATA.length)%DATA.length);}});

/* ---------- detail ---------- */
function certTag(c){return `<span class="cert ${CERT[c]||'c3'}">把握：${esc(c)}</span>`;}
function renderDetail(d,id){const s=d.senses.find(x=>x.id===id);const box=$('detail');box.classList.remove('hide');const o=d.origin;let h='<button class="x" title="收起">×</button>';
  const parent=s.p?d.senses.find(x=>x.id===s.p):null;
  h+=`<div class="dtitle">${esc(d.char)} · ${esc(s.label)}</div><div class="badges"><span class="badge" style="background:${TYPE[s.type]}">${esc(s.type)}</span>${certTag(s.cert)}</div>`;
  if(!s.p){
    h+=`<div class="sec"><h4>《说文解字》原文</h4>`+(o.shuowen?`<div class="sw">${esc(o.shuowen)}</div>`:`<div class="tbd">《说文》无此字条或暂不引用。</div>`)+
      (o.swNote?`<div class="note">${esc(o.swNote)}</div>`:'')+`<div style="margin-top:6px">${certTag(o.swCert)}</div></div>`;
    const st=d.inSW?['甲骨文','金文','小篆','隶书']:['早期字形'];
    h+=`<div class="sec"><h4>字形演变</h4><div class="evo">`+st.map(x=>`<div class="st"><div class="gl">字形<br>占位</div><div class="lb">${x}</div></div><span class="ar">→</span>`).join('')+
      `<div class="st"><div class="gl k">${esc(d.char)}</div><div class="lb">楷书</div></div></div><div class="note">字形图片为占位，各阶段是否有此字形待查${d.inSW?'':'（本字为后起字）'}。</div></div>`;
    h+=`<div class="sec"><h4>为什么说这是本义</h4><div class="why">${esc(o.reason)}</div></div>`;
  } else {
    h+=`<div class="sec"><h4>从「${esc(parent.label)}」到「${esc(s.label)}」</h4><div class="why"><b style="color:${TYPE[s.type]}">${esc(s.type)}</b>（${TDESC[s.type]}）：${esc(s.why)}</div></div>`;
  }
  h+=`<div class="sec"><h4>词族</h4><div class="chips">${s.fam.map(f=>`<span>${esc(f)}</span>`).join('')}</div></div>`;
  h+=`<div class="sec"><h4>构词拆解</h4><div class="box">${esc(s.struct)}</div></div>`;
  h+=`<div class="sec"><h4>现代例句</h4><div class="box">${esc(s.modern)}<span class="tag">示例</span></div></div>`;
  h+=`<div class="sec"><h4>文言原句</h4>`+(s.cls?`<div class="box"><div class="cls">${esc(s.cls.t)}</div><div class="src">—— ${esc(s.cls.src)}</div><div class="trn">译文：${esc(s.cls.tr)}</div></div>`:
     `<div class="box tbd">待查：暂不提供文言原句，以免出处不准。${s.clsNote?'<br><span style="color:var(--ink2)">'+esc(s.clsNote)+'</span>':''}</div>`)+`</div>`;
  h+=`<div class="sec"><h4>把握程度</h4><div>${certTag(s.cert)}</div><div class="note">确定＝有可靠出处；通行说法＝辞书常见解释，学界或有不同意见；待查＝尚未核实。</div></div>`;
  box.innerHTML=h;box.querySelector('.x').onclick=()=>{box.classList.add('hide');};box.scrollTop=0;}

/* ---------- right sidebar ---------- */
function renderRight(d){const P=d.parts;const s0=P.sem.map(x=>x.p),p0=P.pho.filter(x=>x.p!=='—').map(x=>x.p);
  let h=`<div class="card"><h3><em style="background:var(--yin)">拆</em>偏旁拆分</h3><div class="split"><span class="whole">${esc(d.char)}</span><span class="eq">＝</span>`+
    s0.map(p=>`<div class="pc s"><b>${esc(p)}</b><small>表义</small></div>`).join('<span class="eq">＋</span>')+
    (p0.filter(p=>!s0.includes(p)).length?'<span class="eq">＋</span>'+p0.filter(p=>!s0.includes(p)).map(p=>`<div class="pc h"><b>${esc(p)}</b><small>表音</small></div>`).join(''):'')+`</div>`;
  P.sem.forEach(x=>h+=`<div class="prow"><span class="k s">表义</span><span><b>${esc(x.p)}</b>　${esc(x.n)}</span></div>`);
  P.pho.forEach(x=>h+=`<div class="prow"><span class="k h">表音</span><span><b>${esc(x.p)}</b>　${esc(x.n)}</span></div>`);
  h+=`</div><div class="card"><h3><em style="background:var(--tbd)">错</em>易读错 · 易写错</h3><div class="errh">易读错</div><ul class="err r">${d.read.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`+
    `<div class="errh">易写错</div><ul class="err w">${d.write.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h+=`<div class="card"><h3><em style="background:var(--jia)">密</em>相关汉字密码</h3>${d.code.map(c=>`<div class="code"><div class="r">🔑 ${esc(c.rule)}</div><div class="e">${esc(c.ex)}</div></div>`).join('')}</div>`;
  h+=`<div class="card"><h3><em style="background:var(--zhuan)">图</em>连线怎么看</h3>`+Object.keys(TDESC).map(k=>`<div class="prow"><span class="k" style="background:${TYPE[k]};color:#fff">${k}</span><span>${TDESC[k]}</span></div>`).join('')+`</div>`;
  $('right').innerHTML=h;}

load(0);
})();
</script>
