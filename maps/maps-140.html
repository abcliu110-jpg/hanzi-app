<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#f7f2e8; --paper:#fffdf8; --ink:#2b2a33; --ink2:#5b5866; --muted:#9a95a3; --line:#e7dfcf;
  --brand:#c2462f; --brand-soft:#fbe9e3; --gold:#d9a441;
  --t-yin:#3b7bd8;  --t-yin-s:#e6efff;   /* 引申 */
  --t-bi:#e07b24;   --t-bi-s:#fff0e1;    /* 比喻 */
  --t-zhuan:#2f9a6b;--t-zhuan-s:#e2f5ec; /* 转喻 */
  --t-jia:#8a55c9;  --t-jia-s:#f1e8fb;   /* 假借 */
  --ok:#2f9a6b; --mid:#d9a441; --tbd:#b0465f;
  --radius:16px; --shadow:0 6px 24px rgba(80,60,30,.08);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --kai:"KaiTi","STKaiti","Kaiti SC","BiauKai","Noto Serif SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 20% 0%,#fff8ea 0,transparent 40%),radial-gradient(circle at 100% 100%,#f3e7d6 0,transparent 45%);}
button{font-family:inherit;cursor:pointer}
/* ---------- 顶部一级菜单 ---------- */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 22px;
  background:rgba(255,253,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo .seal{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-family:var(--kai);font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.logo small{display:block;font-weight:400;color:var(--muted);font-size:11px}
nav.l1{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.l1::-webkit-scrollbar{display:none}
nav.l1 button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;position:relative}
nav.l1 button:hover{background:#f3ece0}
nav.l1 button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(194,70,47,.25)}
nav.l1 button .soon{font-size:10px;color:var(--muted);margin-left:3px}
/* ---------- 主体 ---------- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:16px;padding:16px 22px 22px;height:calc(100vh - 58px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* 左侧二级菜单 */
aside.l2{padding:14px;overflow:auto}
.sec-title{font-size:12px;color:var(--muted);letter-spacing:.12em;margin:2px 4px 10px}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chars button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;transition:.15s}
.chars button b{font-family:var(--kai);font-size:28px;font-weight:400;line-height:1.1}
.chars button span{font-size:11px;color:var(--muted)}
.chars button:hover{border-color:var(--gold);transform:translateY(-1px)}
.chars button.on{background:var(--brand-soft);border-color:var(--brand);box-shadow:0 0 0 2px rgba(194,70,47,.15)}
.chars button.on b{color:var(--brand)}
.legend{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2)}
.legend div{display:flex;align-items:center;gap:8px;margin:6px 4px}
.sw{width:22px;height:4px;border-radius:2px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* 中间 */
main{display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto}
.mapwrap{position:relative;flex:1 0 470px;overflow:hidden}
.maphead{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
.maphead>*{pointer-events:auto}
.title-big{display:flex;align-items:baseline;gap:10px}
.title-big h1{margin:0;font-family:var(--kai);font-size:30px;font-weight:400}
.title-big .py{color:var(--brand);font-size:16px}
.title-big .st{font-size:12px;color:var(--muted)}
.zoom{display:flex;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--ink2)}
.zoom button:hover{border-color:var(--gold)}
.zoom button.w{width:auto;padding:0 10px;font-size:12px}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
svg#map.drag{cursor:grabbing}
.root-card{position:absolute;left:16px;bottom:14px;width:min(360px,46%);padding:12px 14px;z-index:3;font-size:13px;line-height:1.6;
  background:rgba(255,253,248,.96)}
.root-card h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.root-card .sw-text{font-family:var(--serif);background:#faf5ea;border-left:3px solid var(--gold);padding:6px 9px;border-radius:6px;margin:4px 0 8px}
.evo{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.evo span{font-size:11px;background:#f3eee4;border:1px dashed #d9cfbb;border-radius:6px;padding:2px 6px;color:var(--ink2)}
.root-card .why{color:var(--ink2);font-size:12.5px}
.root-card .toggle{border:0;background:none;color:var(--muted);font-size:12px}
.root-card.min .body{display:none}
.hint{position:absolute;right:16px;bottom:12px;font-size:11px;color:var(--muted);z-index:3}
/* 节点 */
.node{cursor:pointer}
.node rect,.node circle{transition:filter .15s}
.node:hover rect,.node:hover circle{filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.node.sel rect{stroke-width:3}
.node.sel circle.core{stroke-width:5}
.elabel text{pointer-events:none}
/* 详情 */
.detail{padding:18px 20px;flex:0 0 auto}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.dhead h2{margin:0;font-size:20px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.blk{background:#fcf9f2;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.blk h5{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:600}
.fam{display:flex;gap:8px;flex-wrap:wrap}
.fam span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-family:var(--kai);font-size:18px}
.parse{font-size:14px;line-height:1.7}
.sent{font-size:15px;line-height:1.8}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#eef0f4;color:#58606e;margin-left:6px;vertical-align:2px}
.classic .orig{font-family:var(--serif);font-size:16px;line-height:1.8}
.classic .src{font-size:12px;color:var(--brand);margin:2px 0 6px}
.classic .tr{font-size:13px;color:var(--ink2);line-height:1.7}
.tbd{color:var(--tbd);font-size:13px}
.why-line{font-size:13.5px;color:var(--ink2);margin:-4px 0 12px;padding:8px 12px;border-radius:10px;background:#f7f3ea}
/* 右侧 */
aside.side{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.side h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.side h3 i{width:6px;height:16px;border-radius:3px;background:var(--brand);display:inline-block}
.split{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0 12px}
.split .big{font-family:var(--kai);font-size:54px;line-height:1;color:var(--ink)}
.split .eq{color:var(--muted)}
.part{border-radius:12px;padding:9px 11px;margin-bottom:8px;font-size:13px;line-height:1.55}
.part b{font-family:var(--kai);font-size:20px;font-weight:400;margin-right:6px}
.part .role{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:6px}
.part.yi{background:#eef6f1}.part.yi .role{background:var(--ok);color:#fff}
.part.yin{background:#eef2fb}.part.yin .role{background:var(--t-yin);color:#fff}
.warn li{margin:0 0 7px;font-size:13px;line-height:1.55}
.warn{padding-left:18px;margin:0}
.warn.read li::marker{content:"🔊 "}
.warn.write li::marker{content:"✏️ "}
.code{background:linear-gradient(135deg,#fff8e6,#fdf0f0);border:1px solid #f0dcc0;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.code b{font-size:13px;color:var(--brand)}
.code p{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){
  .app{grid-template-columns:170px 1fr;height:auto}
  aside.side{grid-column:1 / -1}
  .mapwrap{flex-basis:520px}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr;padding:12px}
  .chars{grid-template-columns:repeat(5,1fr)}
  .grid2{grid-template-columns:1fr}
  .root-card{width:calc(100% - 32px)}
}
</style>
</head>

</div>

<script>
(function(){

let cur = 0, curSense = 'r';

/* 顶部菜单 */

MENU.forEach((m,i)=>{
  const b=document.createElement('button');
  b.innerHTML = esc(m) + (i? '<span class="soon">·即将上线</span>':'');
  if(i===0) b.className='on';
  b.onclick=()=>{ if(i) toast('「'+m+'」模块即将上线，现在先玩字义扩展图吧！'); };
  l1.appendChild(b);
});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2000);}

/* 左侧二级菜单 */
const chars=$('#chars');
DATA.forEach((d,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<b>'+esc(d.c)+'</b><span>'+esc(d.py)+'</span>';
  b.onclick=()=>select(i);
  chars.appendChild(b);
});

/* ---------- 义项网 ---------- */
const svg=$('#map'); const NS='http://www.w3.org/2000/svg';
let vb={x:-500,y:-330,w:1000,h:660}, base=null;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function setVB(){svg.setAttribute('viewBox',[vb.x,vb.y,vb.w,vb.h].join(' '));}
function wrap(t,n){const out=[];let s=String(t);while(s.length>n){out.push(s.slice(0,n));s=s.slice(n);}if(s)out.push(s);return out;}

function layout(d){
  const pos={r:{x:0,y:0,a:0,depth:0}};
  const kids={};
  d.senses.forEach(s=>{if(s.from){(kids[s.from]=kids[s.from]||[]).push(s);}});
  const first=kids.r||[]; const n=first.length;
  const start=-Math.PI/2 + (n===2? -Math.PI/2 : 0);
  first.forEach((s,i)=>{const a=start+i*2*Math.PI/n; const R=255; pos[s.id]={x:Math.cos(a)*R*1.25,y:Math.sin(a)*R,a,depth:1};});
  const place=(pid,depth)=>{(kids[pid]||[]).forEach((s,i,arr)=>{
    if(pos[s.id])return;
    const p=pos[pid]; const off=(i-(arr.length-1)/2)*0.5; const a=p.a+off; const R=255+depth*0+ 200;
    pos[s.id]={x:p.x+Math.cos(a)*230,y:p.y+Math.sin(a)*170,a,depth:p.depth+1};
    place(s.id,depth+1);
  });};
  first.forEach(s=>place(s.id,1));
  return pos;
}

function draw(){
  const d=DATA[cur]; svg.innerHTML='';
  const defs=el('defs',{},svg);
  const f=el('filter',{id:'sh',x:'-20%',y:'-20%',width:'140%',height:'160%'},defs);
  el('feDropShadow',{dx:0,dy:3,stdDeviation:4,'flood-color':'#7a5a2a','flood-opacity':.13},f);
  const g=el('radialGradient',{id:'core'},defs);
  el('stop',{offset:'0%','stop-color':'#fff5ef'},g); el('stop',{offset:'100%','stop-color':'#fbe1d6'},g);

  [150,255,420].forEach(r=>el('ellipse',{cx:0,cy:0,rx:r*1.25,ry:r,fill:'none',stroke:'#eadfca','stroke-dasharray':'3 7'},bg));

  const gE=el('g',{},svg), gL=el('g',{},svg), gN=el('g',{},svg);

    const cx=mx+nx/L*28, cy=my+ny/L*28;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:t.hex,'stroke-width':3,'stroke-linecap':'round','stroke-dasharray':s.type==='假借'?'8 7':'none',opacity:.85},gE);

    const lines=wrap(s.why,11); const w=Math.max(56, Math.max(...lines.map(x=>x.length))*12.5+18); const h=26+lines.length*15+6;
    const lg=el('g',{class:'elabel',transform:`translate(${lx},${ly})`},gL);
    el('rect',{x:-w/2,y:-14,width:w,height:h,rx:10,fill:'#fffdf8',stroke:t.hex,'stroke-opacity':.35,filter:'url(#sh)'},lg);
    el('rect',{x:-24,y:-10,width:48,height:18,rx:9,fill:t.hex},lg);
    const tt=el('text',{x:0,y:3.5,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff'},lg); tt.textContent=s.type;
    lines.forEach((ln,i)=>{const tx=el('text',{x:0,y:24+i*15,'text-anchor':'middle','font-size':11.5,fill:'#5b5866'},lg);tx.textContent=ln;});
    minx=Math.min(minx,lx-w/2);maxx=Math.max(maxx,lx+w/2);maxy=Math.max(maxy,ly+h);
  });
  d.senses.forEach(s=>{
    const p=pos[s.id]; const t=TYPE[s.type]||TYPE['引申'];
    const ng=el('g',{class:'node'+(s.id===curSense?' sel':''),transform:`translate(${p.x},${p.y})`},gN);
    ng.dataset.id=s.id;
    if(!s.from){
      el('circle',{r:92,fill:'none',stroke:'#c2462f','stroke-opacity':.18,'stroke-width':10},ng);
      el('circle',{class:'core',r:78,fill:'url(#core)',stroke:'#c2462f','stroke-width':3,filter:'url(#sh)'},ng);
      const c=el('text',{y:6,'text-anchor':'middle','font-size':62,'font-family':'KaiTi,STKaiti,serif',fill:'#2b2a33'},ng); c.textContent=d.c;
      el('rect',{x:-30,y:-62,width:60,height:20,rx:10,fill:'#c2462f'},ng);
      const tb=el('text',{y:-48,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff'},ng); tb.textContent='本义';
      const lb=wrap(s.label,8);
      lb.forEach((ln,i)=>{const tx=el('text',{y:34+i*15,'text-anchor':'middle','font-size':13,'font-weight':600,fill:'#c2462f'},ng);tx.textContent=ln;});
      el('circle',{cx:56,cy:-50,r:7,fill:SURE[s.sure]||'#999',stroke:'#fff','stroke-width':2},ng);
    } else {
      const lines=wrap(s.label,9); const w=Math.max(120,Math.max(...lines.map(x=>x.length))*16+40), h=26+lines.length*19;
      el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:'#fff',stroke:t.hex,'stroke-width':2,filter:'url(#sh)'},ng);
      el('rect',{x:-w/2,y:-h/2,width:8,height:h,rx:4,fill:t.hex},ng);
      lines.forEach((ln,i)=>{const tx=el('text',{x:4,y:-h/2+24+i*19,'text-anchor':'middle','font-size':15,'font-weight':600,fill:'#2b2a33'},ng);tx.textContent=ln;});
      el('circle',{cx:w/2-10,cy:-h/2+10,r:5.5,fill:SURE[s.sure]||'#999'},ng);
      minx=Math.min(minx,p.x-w/2);maxx=Math.max(maxx,p.x+w/2);miny=Math.min(miny,p.y-h/2);maxy=Math.max(maxy,p.y+h/2);
    }
    ng.addEventListener('click',e=>{ if(moved) return; curSense=s.id; draw(); renderDetail(); });
  });
  // 适配视图
  if(!base || base.char!==cur){
    const pad=70; const W=maxx-minx+pad*2, H=maxy-miny+pad*2+90;
    const r=svg.clientWidth/svg.clientHeight||1.5; let w=W,h=H; if(w/h<r)w=h*r; else h=w/r;
    vb={x:(minx+maxx)/2-w/2,y:(miny+maxy)/2-h/2-30,w,h}; base={...vb,char:cur};
  }
  setVB();
}

/* 缩放与平移 */
let dragging=false,moved=false,last=null;
function zoomAt(f,cx,cy){
  if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}
  const nw=Math.min(Math.max(vb.w*f,base.w*.3),base.w*3); const k=nw/vb.w;
  vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:vb.h*k}; setVB();
}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();
  const cx=vb.x+(e.clientX-r.left)/r.width*vb.w, cy=vb.y+(e.clientY-r.top)/r.height*vb.h;
  zoomAt(e.deltaY>0?1.12:1/1.12,cx,cy);},{passive:false});
svg.addEventListener('pointerdown',e=>{dragging=true;moved=false;last=[e.clientX,e.clientY];});
window.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];
  if(Math.abs(dx)+Math.abs(dy)>3){moved=true;svg.classList.add('drag');}
  if(!moved)return;
  const r=svg.getBoundingClientRect();vb.x-=dx/r.width*vb.w;vb.y-=dy/r.height*vb.h;last=[e.clientX,e.clientY];setVB();});
window.addEventListener('pointerup',()=>{dragging=false;svg.classList.remove('drag');setTimeout(()=>moved=false,0);});
$('#zin').onclick=()=>zoomAt(1/1.25);
$('#zout').onclick=()=>zoomAt(1.25);
$('#zreset').onclick=()=>{vb={x:base.x,y:base.y,w:base.w,h:base.h};setVB();};
window.addEventListener('resize',()=>{base=null;draw();});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')select((cur+1)%DATA.length);
  if(e.key==='ArrowLeft')select((cur-1+DATA.length)%DATA.length);
});

/* 本义卡 */
function renderRoot(){
  const d=DATA[cur]; const rc=$('#rootcard'); const st=d.shuowen.status;
  rc.innerHTML=`<h4><span>📜 本义卡 · 《说文》与字形</span><button class="toggle" id="rtg">${rc.classList.contains('min')?'展开':'收起'}</button></h4>
  <div class="body">
    <div class="sw-text">${esc(d.shuowen.text)} <span class="pill" style="background:#fff;color:${SURE[st]};border:1px solid currentColor;padding:0 7px;font-size:11px">${esc(st)}</span></div>
    <div style="font-size:12px;color:var(--muted)">字形演变（文字占位）</div>
    <div class="evo">${d.evo.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    <div class="why"><b style="color:var(--brand)">本义判定：</b>${esc(d.rootReason)}</div>
  </div>`;
  $('#rtg').onclick=()=>{rc.classList.toggle('min');renderRoot();};
}

/* 义项详情 */
function renderDetail(){
  const d=DATA[cur]; const s=d.senses.find(x=>x.id===curSense)||d.senses[0]; const t=TYPE[s.type]||TYPE['引申'];
  const parent=s.from? d.senses.find(x=>x.id===s.from):null;
  const cl=s.classic;
  $('#detail').innerHTML=`
  <div class="dhead">
    <span style="font-family:var(--kai);font-size:34px;line-height:1">${esc(d.c)}</span>
    <h2>${esc(s.label)}</h2>
    <span class="pill" style="background:${t.s};color:${t.c}">${esc(s.type)}</span>
    <span class="pill" style="background:#fff;border:1px solid ${SURE[s.sure]};color:${SURE[s.sure]}"><span class="dot" style="background:${SURE[s.sure]}"></span>把握：${esc(s.sure)}</span>
  </div>
  ${parent?`<div class="why-line">从「${esc(parent.label)}」到「${esc(s.label)}」：<b style="color:${t.c}">${esc(s.type)}</b>——${esc(s.why)}</div>`:`<div class="why-line">这是「${esc(d.c)}」最早的意思（本义），其他义项都从这里长出来。</div>`}
  <div class="grid2">
    <div class="blk"><h5>词族 · 3个</h5><div class="fam">${s.family.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
    <div class="blk"><h5>构词拆解</h5><div class="parse">${esc(s.parse)}</div></div>
    <div class="blk"><h5>现代例句</h5><div class="sent">${esc(s.modern)}${s.sample?'<span class="tag">示例</span>':''}</div></div>
    <div class="blk classic"><h5>文言原句 · 出处 · 译文</h5>${cl?`<div class="orig">「${esc(cl.text)}」</div><div class="src">—— ${esc(cl.src)}</div><div class="tr">译：${esc(cl.tr)}</div>`:`<div class="tbd">此义项的可靠文言原句待查（宁缺毋编）。</div>`}</div>
  </div>`;
}

/* 右侧栏 */
function renderSide(){
  const d=DATA[cur];
  $('#side').innerHTML=`
  <div><h3><i></i>偏旁拆分</h3>
    <div class="split"><span class="big">${esc(d.c)}</span><span class="eq">＝</span>${d.parts.map(p=>`<span class="big" style="font-size:30px;color:${p.role.startsWith('表义')?'var(--ok)':'var(--t-yin)'}">${esc(p.p.replace(/（.*?）/g,''))}</span>`).join('<span class="eq">＋</span>')}</div>
    <div style="font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 10px">${esc(d.struct)}</div>
    ${d.parts.map(p=>`<div class="part ${p.role.startsWith('表义')?'yi':'yin'}"><span class="role">${esc(p.role)}</span><b>${esc(p.p)}</b>${esc(p.note)}</div>`).join('')}
  </div>
  <div><h3><i style="background:var(--t-bi)"></i>易读错</h3><ul class="warn read">${d.read.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div><h3><i style="background:var(--t-jia)"></i>易写错</h3><ul class="warn write">${d.write.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div><h3><i style="background:var(--gold)"></i>汉字密码</h3>${d.code.map(c=>`<div class="code"><b>🔑 ${esc(c.t)}</b><p>${esc(c.d)}</p></div>`).join('')}</div>`;
}

function select(i){
  cur=i; curSense='r'; base=null;
  [...chars.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  const d=DATA[i];
  $('#t-char').textContent=d.c; $('#t-py').textContent=d.py; $('#t-st').textContent=d.struct+' · '+(d.senses.length)+'个义项';
  draw(); renderRoot(); renderDetail(); renderSide();
}
select(0);
})();
</script>
