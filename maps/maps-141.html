<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#f5efe3; --paper:#fffdf8; --ink:#2c2a33; --sub:#6f6a62; --line:#e4d9c6;
  --red:#c4513b; --red-soft:#f6e3dc; --gold:#b98a3e;
  --t-yin:#2a9d8f; --t-bi:#e07a4f; --t-zhuan:#7b5ea7; --t-jia:#a8662a; --t-tbd:#9a958c;
  --ok:#3f8f5a; --common:#3f6fb0; --tbd:#c58a19;
  --kai:"STKaiti","KaiTi","Kaiti SC","楷体","AR PL UKai CN",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{display:flex;flex-direction:column;overflow:hidden}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:0 22px;height:60px;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.logo b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;font-family:var(--kai);font-size:22px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{border:0;background:none;padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap}
nav.top button:hover{background:#f3ebdd;color:var(--ink)}
nav.top button.on{background:var(--red);color:#fff;font-weight:600}
/* layout */
.main{flex:1;display:grid;grid-template-columns:200px 1fr 370px;min-height:0}
aside.left{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px}
.sec-title{font-size:12px;color:var(--sub);letter-spacing:2px;margin:4px 6px 10px}
.charlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.charlist button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.charlist button .z{font-family:var(--kai);font-size:26px;line-height:1.1;color:var(--ink)}
.charlist button .p{font-size:11px;color:var(--sub)}
.charlist button:hover{border-color:var(--red);transform:translateY(-1px)}
.charlist button.on{background:var(--red);border-color:var(--red)}
.charlist button.on .z,.charlist button.on .p{color:#fff}
/* center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.hero{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fffaf0,transparent)}
.hero .big{font-family:var(--kai);font-size:58px;line-height:1;width:76px;height:76px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;position:relative;
  background-image:linear-gradient(var(--red-soft) 1px,transparent 1px),linear-gradient(90deg,var(--red-soft) 1px,transparent 1px);background-size:38px 38px;background-position:-1px -1px}
.hero .meta .py{font-size:18px;color:var(--red);font-weight:600}
.hero .meta .gl{font-size:14px;color:var(--sub);margin-top:4px}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);max-width:330px;justify-content:flex-end}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.stage{flex:1;position:relative;min-height:0;overflow:hidden;
  background-color:#faf6ee;background-image:radial-gradient(#e8dcc8 1px,transparent 1px);background-size:22px 22px}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.zoombar{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 4px 14px rgba(80,60,30,.08)}
.zoombar button{width:34px;height:34px;border:0;border-radius:8px;background:#f6efe2;font-size:17px;cursor:pointer;color:var(--ink)}
.zoombar button:hover{background:var(--red-soft)}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--sub);background:rgba(255,253,248,.85);padding:5px 10px;border-radius:8px}
.node{cursor:pointer}
.node rect{transition:filter .15s}
.node:hover rect,.node.sel rect{filter:drop-shadow(0 4px 8px rgba(196,81,59,.25))}
.node.sel rect{stroke:var(--red);stroke-width:2.5}
/* right */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 30px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:#fff}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:2px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--red)}
.d-title{font-size:19px;font-weight:700;margin:2px 0 8px;line-height:1.4}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;color:#fff;margin-right:6px;vertical-align:middle}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid;vertical-align:middle}
.b-确定{color:var(--ok);border-color:var(--ok);background:#eef7f0}
.b-通行说法{color:var(--common);border-color:var(--common);background:#eef3fa}
.b-待查{color:var(--tbd);border-color:var(--tbd);background:#fdf5e4}
.why{font-size:14px;color:var(--ink);background:#faf6ee;border-radius:10px;padding:8px 10px;margin:8px 0 4px;line-height:1.6}
.blk{margin-top:12px}
.blk .lb{font-size:12px;color:var(--sub);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--red-soft);color:#8c3424;border-radius:8px;padding:4px 10px;font-size:14px}
.txt{font-size:14px;line-height:1.7}
.tag{font-size:11px;background:#eee6d6;color:var(--sub);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.classic{font-family:var(--kai);font-size:17px;line-height:1.7;border-left:3px solid var(--gold);padding:2px 0 2px 10px}
.src{font-size:12px;color:var(--sub);margin:4px 0 2px 13px}
.trans{font-size:13px;color:var(--ink);margin-left:13px;line-height:1.6}
.empty{font-size:13px;color:var(--tbd);background:#fdf5e4;border:1px dashed #e5c47e;border-radius:8px;padding:6px 10px}
.sw{font-family:var(--kai);font-size:17px;line-height:1.7;background:#fbf4e6;border-radius:10px;padding:8px 12px}
.swnote{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.evo{display:flex;gap:6px;flex-wrap:wrap}
.evo div{flex:1;min-width:56px;border:1px dashed #d8c9ae;border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--sub);background:#fffcf5}
.evo div b{display:block;font-family:var(--kai);font-size:22px;color:#bfb29a;font-weight:400;margin-bottom:2px}
.evo div.now b{color:var(--ink)}
.rad{display:flex;align-items:stretch;gap:8px}
.rad .part{flex:1;border-radius:12px;padding:10px;text-align:center}
.rad .part.f{background:#eef7f4;border:1px solid #cfe7df}
.rad .part.s{background:#f3eefa;border:1px solid #ded3ef}
.rad .part .k{font-size:11px;color:var(--sub)}
.rad .part .v{font-family:var(--kai);font-size:22px;margin:4px 0}
.rad .part .n{font-size:12px;line-height:1.5;color:var(--ink)}
.rad .plus{align-self:center;color:var(--sub)}
ul.errs{margin:0;padding-left:18px;font-size:14px;line-height:1.75}
ul.errs li::marker{color:var(--red)}
.code{background:linear-gradient(135deg,#fff7e8,#fdf0f0);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.code b{color:var(--red)}
.note{font-size:12px;color:var(--sub);margin-top:10px;background:#f6f1e8;border-radius:8px;padding:6px 9px}
.placeholder{flex:1;display:grid;place-items:center;text-align:center;color:var(--sub)}
.placeholder .big{font-family:var(--kai);font-size:64px;color:#d9ccb4}
@media (max-width:1100px){.main{grid-template-columns:170px 1fr 320px}}
</style>
</head>

</div>

"classic": {
"text": "樱桃樊素口，杨柳小蛮腰。",
"src": "传为白居易句，见孟棨《本事诗》",
"trans": "樊素的嘴像樱桃一样红润小巧，小蛮的腰像柳枝一样纤细。",
"conf": "通行说法"
},
"conf": "确定"
}
]
}
]
</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('char-data').textContent);
const MENUS = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const TYPE_COLOR = {'引申':'#2a9d8f','比喻':'#e07a4f','转喻':'#7b5ea7','假借':'#a8662a','待查':'#9a958c'};
const CONF_COLOR = {'确定':'#3f8f5a','通行说法':'#3f6fb0','待查':'#c58a19'};
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, selId='core', view={x:0,y:0,k:1};

/* top menu */
MENUS.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;if(i===0)b.className='on';
  b.onclick=()=>{[...$('topnav').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const on=i===0;$('center').style.display=on?'flex':'none';$('ph').style.display=on?'none':'grid';
    document.querySelector('.left').style.visibility=on?'visible':'hidden';$('right').style.visibility=on?'visible':'hidden';
    $('phIcon').textContent=m[0];$('phText').textContent='「'+m+'」模块正在建设中，本页先实现「字义扩展图」。';};
  $('topnav').appendChild(b);});

/* legend */
$('legend').innerHTML=Object.entries(TYPE_COLOR).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')+
  Object.entries(CONF_COLOR).map(([k,c])=>`<span><i style="background:${c};width:8px;height:8px;border-radius:50%"></i>${k}</span>`).join('');

/* char list */
DATA.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="z">${d.c}</span><span class="p">${d.py}</span>`;
  b.onclick=()=>select(i);$('charlist').appendChild(b);});

function wrap(s,n){const a=[...s],out=[];for(let i=0;i<a.length;i+=n)out.push(a.slice(i,i+n).join(''));return out;}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

function layout(d){
  const pos={core:{x:0,y:0}};
  const firsts=d.senses.filter(s=>!s.parent), n=firsts.length, R1=330, R2=600;
  const start = n===1? -Math.PI/6 : -Math.PI/2 - (n===2? Math.PI/4:0);
  firsts.forEach((s,i)=>{const a=start+i*2*Math.PI/Math.max(n,1);s._a=a;pos[s.id]={x:R1*Math.cos(a),y:R1*Math.sin(a)};});
  firsts.forEach(f=>{const kids=d.senses.filter(s=>s.parent===f.id);kids.forEach((k,j)=>{
    const a=f._a+(j-(kids.length-1)/2)*0.42;k._a=a;pos[k.id]={x:R2*Math.cos(a),y:R2*Math.sin(a)};});});
  return pos;
}

function render(){
  const d=DATA[cur], vp=$('vp'); vp.innerHTML='';
  const pos=layout(d);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  const NW=176, sizes={core:{r:74}};
  d.senses.forEach(s=>{const lines=wrap(s.gloss,9);sizes[s.id]={w:NW,h:44+lines.length*21,lines};});
  const edgePt=(id,toward)=>{const p=pos[id],q=pos[toward],dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1;
    if(id==='core')return{x:p.x+dx/L*74,y:p.y+dy/L*74};
    const sz=sizes[id],t=Math.min((sz.w/2)/Math.abs(dx||1e-6),(sz.h/2)/Math.abs(dy||1e-6));return{x:p.x+dx*t,y:p.y+dy*t};};
  d.senses.forEach(s=>{
    const from=s.parent||'core', a=edgePt(from,s.id), b=edgePt(s.id,from), col=TYPE_COLOR[s.type]||'#999';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, nx=-(b.y-a.y), ny=(b.x-a.x), nl=Math.hypot(nx,ny)||1, bend=18;
    const cx=mx+nx/nl*bend, cy=my+ny/nl*bend;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':3,'stroke-linecap':'round','stroke-dasharray':s.type==='待查'?'6 6':(s.type==='假借'?'2 7':'none'),opacity:.85},gE);
    // arrow
    const ang=Math.atan2(b.y-cy,b.x-cx);
    el('path',{d:`M${b.x},${b.y} l${-11*Math.cos(ang-0.4)},${-11*Math.sin(ang-0.4)} M${b.x},${b.y} l${-11*Math.cos(ang+0.4)},${-11*Math.sin(ang+0.4)}`,stroke:col,'stroke-width':3,'stroke-linecap':'round',fill:'none'},gE);
    // label
    const lx=(a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    const why=wrap(s.why,10).slice(0,4), lh=15, bw=10*12+16, bh=26+why.length*lh+8;
    const g=el('g',{transform:`translate(${lx},${ly})`},gL);
    el('rect',{x:-bw/2,y:-bh/2,width:bw,height:bh,rx:10,fill:'#fffdf8',stroke:col,'stroke-opacity':.45},g);
    el('rect',{x:-24,y:-bh/2+6,width:48,height:19,rx:9.5,fill:col},g);
    const tt=el('text',{x:0,y:-bh/2+19.5,'text-anchor':'middle','font-size':12,fill:'#fff','font-weight':600},g);tt.textContent=s.type;
    why.forEach((ln,i)=>{const t=el('text',{x:0,y:-bh/2+40+i*lh,'text-anchor':'middle','font-size':12,fill:'#5c564d'},g);t.textContent=(i===3&&wrap(s.why,10).length>4)?ln.slice(0,9)+'…':ln;});
  });
  // core
  const cg=el('g',{class:'node'+(selId==='core'?' sel':''),'data-id':'core'},gN);
  el('circle',{r:80,fill:'#f6e3dc',opacity:.6},cg);
  const cr=el('rect',{x:-74,y:-74,width:148,height:148,rx:74,fill:'#c4513b'},cg);
  const ct=el('text',{y:6,'text-anchor':'middle','font-size':64,fill:'#fff','font-family':'STKaiti,KaiTi,Kaiti SC,serif'},cg);ct.textContent=d.c;
  const cl=wrap(d.core.gloss,7);
  cl.slice(0,2).forEach((ln,i)=>{const t=el('text',{y:34+i*16,'text-anchor':'middle','font-size':13,fill:'#ffe9e1'},cg);t.textContent=ln;});
  const bt=el('text',{y:-48,'text-anchor':'middle','font-size':12,fill:'#ffd9cc','letter-spacing':2},cg);bt.textContent='本义';
  // senses
  d.senses.forEach(s=>{
    const p=pos[s.id], sz=sizes[s.id], g=el('g',{class:'node'+(selId===s.id?' sel':''),'data-id':s.id,transform:`translate(${p.x},${p.y})`},gN);
    el('rect',{x:-sz.w/2,y:-sz.h/2,width:sz.w,height:sz.h,rx:14,fill:'#fff',stroke:TYPE_COLOR[s.type]||'#999','stroke-width':1.5},g);
    el('rect',{x:-sz.w/2,y:-sz.h/2,width:6,height:sz.h,rx:3,fill:TYPE_COLOR[s.type]||'#999'},g);
    el('circle',{cx:sz.w/2-14,cy:-sz.h/2+14,r:5,fill:CONF_COLOR[s.conf]},g);
    const lab=el('text',{x:-sz.w/2+16,y:-sz.h/2+20,'font-size':11,fill:'#8a8378'},g);lab.textContent=(s.parent?'二级义项':'义项')+' · '+s.conf;
    sz.lines.forEach((ln,i)=>{const t=el('text',{x:0,y:-sz.h/2+44+i*21,'text-anchor':'middle','font-size':15,fill:'#2c2a33','font-weight':600},g);t.textContent=ln;});
  });
  gN.querySelectorAll('.node').forEach(n=>{n.addEventListener('pointerup',e=>{if(moved)return;selId=n.dataset.id;
    gN.querySelectorAll('.node').forEach(x=>x.classList.toggle('sel',x.dataset.id===selId));showDetail();});});
}

function confBadge(c){return `<span class="badge b-${esc(c)}">${esc(c)}</span>`;}
function classicHTML(cl){
  if(!cl)return `<div class="empty">文言原句：待查（未找到可靠出处，暂不编写）</div>`;
  return `<div class="classic">${esc(cl.text)}</div><div class="src">—— ${esc(cl.src)} ${confBadge(cl.conf)}</div><div class="trans">译文：${esc(cl.trans)}</div>`;
}
function showDetail(){
  const d=DATA[cur], isCore=selId==='core', it=isCore?d.core:d.senses.find(s=>s.id===selId);
  let h=`<h3>${isCore?'本义（中心）':'义项详情'}</h3>`;
  h+=`<div class="d-title">${isCore?`<span class="pill" style="background:var(--red)">本义</span>`:`<span class="pill" style="background:${TYPE_COLOR[it.type]}">${esc(it.type)}</span>`}${esc(it.gloss)}</div>`;
  if(!isCore){const par=it.parent?d.senses.find(s=>s.id===it.parent).gloss:'本义：'+d.core.gloss;
    h+=`<div class="txt" style="color:var(--sub);font-size:12px">由「${esc(par)}」而来</div><div class="why">💡 ${esc(it.why)}</div>`;}
  if(isCore){
    const c=d.core, evoN=c.evoNote?`（${esc(c.evoNote)}）`:'';
    h+=`<div class="blk"><div class="lb">《说文解字》原文 ${confBadge(c.swConf)}</div><div class="sw">${c.sw==='待查'?'待查':esc(c.sw)}</div>${c.swNote?`<div class="swnote">注：${esc(c.swNote)}</div>`:''}</div>`;
    h+=`<div class="blk"><div class="lb">字形演变（图形占位）${evoN}</div><div class="evo">${['甲骨文','金文','小篆','隶书'].map(x=>`<div><b>□</b>${x}</div>`).join('')}<div class="now"><b>${d.c}</b>楷书</div></div></div>`;
    h+=`<div class="blk"><div class="lb">本义判定理由</div><div class="why" style="margin-top:0">${esc(c.reason)}</div></div>`;
  }
  h+=`<div class="blk"><div class="lb">词族</div><div class="chips">${it.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>`;
  h+=`<div class="blk"><div class="lb">构词拆解</div><div class="txt">${esc(it.build)}</div></div>`;
  h+=`<div class="blk"><div class="lb">现代例句<span class="tag">示例</span></div><div class="txt">${esc(it.modern)}</div></div>`;
  h+=`<div class="blk"><div class="lb">文言原句</div>${classicHTML(it.classic)}</div>`;
  h+=`<div class="blk"><div class="lb">把握程度</div>${confBadge(it.conf)}</div>`;
  if(it.note)h+=`<div class="note">${esc(it.note)}</div>`;
  $('detail').innerHTML=h;
}
function side(){
  const d=DATA[cur], r=d.rad;
  let h=`<div class="txt" style="font-size:12px;color:var(--sub);margin-bottom:8px">结构：${esc(r.kind)}</div><div class="rad">`;
  h+=`<div class="part f"><div class="k">${r.sound?'表义部分':'部件'}</div><div class="v">${esc(r.form.part)}</div><div class="n">${esc(r.form.note)}</div></div>`;
  h+= r.sound?`<div class="plus">＋</div><div class="part s"><div class="k">表音部分</div><div class="v">${esc(r.sound.part)}</div><div class="n">${esc(r.sound.note)}</div></div>`
             :`<div class="plus">＋</div><div class="part s"><div class="k">表音部分</div><div class="v">无</div><div class="n">不是形声字，没有声旁</div></div>`;
  $('radBox').innerHTML=h+'</div>';
  $('errBox').innerHTML=d.errs.map(e=>`<li>${esc(e)}</li>`).join('');
  $('codeBox').innerHTML=`<b>${esc(d.code.title)}</b><br>${esc(d.code.text)}`;
}
function select(i){
  cur=i; selId='core';
  [...$('charlist').children].forEach((b,j)=>b.classList.toggle('on',j===i));
  const d=DATA[i]; $('heroChar').textContent=d.c; $('heroPy').textContent=d.py;
  $('heroGl').textContent='本义：'+d.core.gloss+' · 义项 '+d.senses.length+' 个';
  render(); fit(); showDetail(); side();
}

/* pan & zoom */
const svg=$('map');
function apply(){$('vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function fit(){const r=svg.getBoundingClientRect(),bb=$('vp').getBBox();
  const k=Math.min(r.width/(bb.width+80),r.height/(bb.height+80),1.2);
  view.k=k;view.x=r.width/2-(bb.x+bb.width/2)*k;view.y=r.height/2-(bb.y+bb.height/2)*k;apply();}
function zoomAt(f,cx,cy){const nk=Math.max(.25,Math.min(3,view.k*f));f=nk/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=nk;apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null, moved=false;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false;svg.classList.add('drag');});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;apply();});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');setTimeout(()=>moved=false,0);});
const mid=()=>{const r=svg.getBoundingClientRect();return[r.width/2,r.height/2];};
$('zin').onclick=()=>zoomAt(1.2,...mid());$('zout').onclick=()=>zoomAt(1/1.2,...mid());$('zfit').onclick=fit;
window.addEventListener('resize',fit);
window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){select((cur+1)%DATA.length);e.preventDefault();}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){select((cur+DATA.length-1)%DATA.length);e.preventDefault();}});
select(0);
})();
</script>
</body>
</html>
