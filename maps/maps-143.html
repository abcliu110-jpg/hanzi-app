<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · maps-143</title>
<style>
:root{
  --paper:#fbf7ef; --card:#ffffff; --ink:#2b2622; --ink2:#6b6058; --line:#e8dfd0;
  --accent:#b8432f; --accent-soft:#f6e3dc; --gold:#c9a25b;
  --t-yin:#3a7d5c; --t-bi:#c2703d; --t-zhuan:#3d6fb0; --t-jia:#8e4fb0;
  --c-ok:#3a7d5c; --c-mid:#b7862a; --c-tbd:#a3605a;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Noto Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);}
body{display:flex;flex-direction:column;overflow:hidden}
/* ---------- top nav ---------- */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:#fffdf8;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:22px;font-weight:700;white-space:nowrap}
.brand .seal{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-family:var(--sans)}
nav.top button:hover{background:#f3ece0;color:var(--ink)}
nav.top button.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(184,67,47,.25)}
nav.top button .soon{font-size:10px;opacity:.6;margin-left:3px}
/* ---------- layout ---------- */
main{flex:1;display:grid;grid-template-columns:118px 1fr 360px;gap:14px;padding:14px;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(80,60,30,.05);min-height:0}
/* left list */
aside.left{display:flex;flex-direction:column;overflow:hidden}
aside.left h3{margin:0;padding:12px 14px 8px;font-size:12px;color:var(--ink2);letter-spacing:.1em;font-weight:600}
.charlist{overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:4px}
.charlist button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:11px;padding:6px 8px;cursor:pointer;text-align:left;color:var(--ink)}
.charlist button .z{font-family:var(--kai);font-size:26px;line-height:1;width:30px;text-align:center}
.charlist button .p{font-size:12px;color:var(--ink2)}
.charlist button:hover{background:#faf4ea}
.charlist button.on{background:var(--accent-soft);border-color:#ecc4b8}
.charlist button.on .z{color:var(--accent)}
/* center map */
section.map{position:relative;display:flex;flex-direction:column;overflow:hidden}
.maphead{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.maphead .big{font-family:var(--kai);font-size:40px;line-height:1;color:var(--accent)}
.maphead .meta{display:flex;flex-direction:column;gap:2px}
.maphead .meta b{font-size:16px}
.maphead .meta span{font-size:12px;color:var(--ink2)}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.svgwrap{flex:1;position:relative;min-height:0;background:
  radial-gradient(circle at 50% 50%,#fffaf1 0,#fbf5ea 60%,#f6efe2 100%);}
.svgwrap::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#e9dfcd 1px,transparent 1px);background-size:22px 22px;opacity:.6;pointer-events:none}
svg#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;user-select:none}
svg#map.drag{cursor:grabbing}
.tools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tools button:hover{background:#faf4ea}
.toggle{position:absolute;left:12px;bottom:12px;z-index:2;font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.hint{position:absolute;left:12px;top:10px;font-size:11px;color:#a59886;z-index:2}
/* svg nodes */
.node{cursor:pointer}
.node rect,.node circle{transition:filter .15s}
.node:hover rect,.node:hover circle.core{filter:drop-shadow(0 3px 6px rgba(120,80,30,.22))}
.node.sel rect{stroke-width:3}
.node.sel circle.core{stroke-width:5}
.edge{fill:none;stroke-width:2.4}
/* right */
aside.right{overflow-y:auto;padding:0;border:0;background:transparent;box-shadow:none;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(80,60,30,.05)}
.card h4{margin:0 0 10px;font-size:13px;color:var(--ink2);letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.card h4::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
.dtitle{font-family:var(--serif);font-size:19px;font-weight:700;margin:0 0 6px;line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.b-ok{background:#e3f1e9;color:var(--c-ok)} .b-mid{background:#f8eed8;color:var(--c-mid)} .b-tbd{background:#f5e4e2;color:var(--c-tbd)}
.tb{color:#fff}
.sub{font-size:12px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--serif);font-size:15px;padding:4px 10px;border-radius:9px;background:#faf4ea;border:1px solid #efe4d1}
.box{background:#fcfaf6;border:1px solid #f0e8da;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.7}
.quote{font-family:var(--kai);font-size:16px;line-height:1.8}
.src{font-size:12px;color:var(--ink2);margin-top:2px}
.tr{font-size:13px;color:#4f463f;margin-top:4px;border-top:1px dashed #e8dfd0;padding-top:4px}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:#efe7da;color:#7a6d60;margin-right:4px;vertical-align:1px}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo div{border:1px dashed #d9ccb6;border-radius:10px;text-align:center;padding:6px 2px;background:#fffdf9}
.evo .g{font-family:var(--kai);font-size:22px;height:30px;line-height:30px;color:#b3a48e}
.evo .g.real{color:var(--ink)}
.evo .n{font-size:11px;color:var(--ink2)}
.evo .s{font-size:10px;color:#ad9f8b}
.split{display:flex;gap:8px}
.split .part{flex:1;border-radius:12px;padding:10px;text-align:center;border:1px solid}
.part.m{background:#eef6f1;border-color:#cfe5d8}
.part.s{background:#eef2fa;border-color:#d2ddf0}
.part.none{background:#f7f3ec;border-color:#e8dfd0}
.part .pz{font-family:var(--kai);font-size:30px;line-height:1.1}
.part .pl{font-size:11px;font-weight:700;margin:2px 0}
.part.m .pl{color:var(--t-yin)} .part.s .pl{color:var(--t-zhuan)}
.part .pn{font-size:12px;color:#4f463f;line-height:1.5}
ul.err{margin:0;padding-left:0;list-style:none;font-size:13px;line-height:1.7}
ul.err li{padding:4px 0 4px 26px;position:relative}
ul.err li::before{position:absolute;left:0;top:5px;font-size:11px;padding:0 5px;border-radius:5px;color:#fff;line-height:18px}
ul.err li.r::before{content:"读";background:var(--t-zhuan)}
ul.err li.w::before{content:"写";background:var(--accent)}
.code{font-size:13px;line-height:1.7;padding:8px 10px;border-radius:10px;background:linear-gradient(135deg,#fff8ea,#fdf1e6);border:1px solid #f0dfc4;margin-bottom:6px}
.code b{color:var(--accent)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:.92}
footer{font-size:11px;color:#a59886;text-align:center;padding:0 0 8px;flex-shrink:0}
@media (max-width:1100px){main{grid-template-columns:96px 1fr 300px}}
</style>
</head>

  const place=(pid,R,depth)=>{
    const ks=kids(pid); const pa=pos[pid].ang;
    ks.forEach((s,i)=>{
      const off = ks.length===1?0:(i-(ks.length-1)/2)*0.5;
      const ang = pa+off;
      pos[s.id]={x:Math.cos(ang)*R*1.25,y:Math.sin(ang)*R*0.85,ang:ang,depth:depth};
      place(s.id,R+220,depth+1);
    });
  };
  first.forEach(s=>place(s.id,R2,2));
  return pos;
}

function draw(){
  const ch = DATA.chars[cur], vp=$('vp');
  vp.innerHTML='';
  const pos = layout(ch);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  const NW=200, NH=74;
  // edges
  ch.senses.forEach(s=>{
    if(!s.p) return;
    const a=pos[s.p], b=pos[s.id], col=TYPE_COLOR[s.t]||'#999';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const cx=mx - dy/len*30, cy=my + dx/len*30;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,class:'edge',stroke:col,'stroke-dasharray':s.t==='假借'?'7 6':'none',opacity:.85},gE);
    // label at curve midpoint
    const lx=0.25*a.x+0.5*cx+0.25*b.x, ly=0.25*a.y+0.5*cy+0.25*b.y;
    const lg=el('g',{transform:`translate(${lx},${ly})`},gL);
    el('rect',{x:-24,y:-12,width:48,height:24,rx:12,fill:col},lg);
    const t=el('text',{x:0,y:5,'text-anchor':'middle','font-size':13,fill:'#fff','font-weight':700},lg); t.textContent=s.t;
    if(showWhy){
      const lines=wrap(s.why,13);
      const h=lines.length*16+10;
      el('rect',{x:-104,y:16,width:208,height:h,rx:8,fill:'#fffdf8',stroke:col,'stroke-opacity':.35},lg);
      textLines(lg,lines,0,33,16,{'font-size':12,fill:'#5b5048'});
    }
  });
  // nodes
  ch.senses.forEach(s=>{
    const p=pos[s.id];
    const g=el('g',{class:'node'+(s.id===selId?' sel':''),transform:`translate(${p.x},${p.y})`},gN);
    g.addEventListener('click',e=>{e.stopPropagation();selId=s.id;draw();renderDetail();});
    g.addEventListener('pointerdown',e=>e.stopPropagation());
    if(s.id==='o'){
      el('circle',{r:104,fill:'#fff3ec',stroke:'#ecc4b8','stroke-width':1.5,'stroke-dasharray':'4 5'},g);
      el('circle',{class:'core',r:88,fill:'#fff',stroke:'#b8432f','stroke-width':3},g);
      const z=el('text',{x:0,y:-8,'text-anchor':'middle','font-size':58,'font-family':'Kaiti SC,STKaiti,KaiTi,serif',fill:'#b8432f'},g); z.textContent=ch.c;
      el('rect',{x:-26,y:14,width:52,height:20,rx:10,fill:'#b8432f'},g);
      const bt=el('text',{x:0,y:28,'text-anchor':'middle','font-size':12,fill:'#fff','font-weight':700},g); bt.textContent='本义';
      textLines(g,wrap(s.g,9).slice(0,2),0,52,16,{'font-size':13,fill:'#4f463f'});
    }else{
      const col=TYPE_COLOR[s.t]||'#999';
      const lines=wrap(s.g,11).slice(0,3);
      const h=Math.max(NH,lines.length*19+30);
      el('rect',{x:-NW/2,y:-h/2,width:NW,height:h,rx:16,fill:'#fff',stroke:col,'stroke-width':s.id===selId?3:1.6},g);
      el('rect',{x:-NW/2,y:-h/2,width:8,height:h,rx:4,fill:col},g);
      textLines(g,lines,4,-h/2+26,19,{'font-size':15,fill:'#2b2622','font-family':'Songti SC,STSong,Noto Serif SC,serif','font-weight':700});
      const cc={"确定":"#3a7d5c","通行说法":"#b7862a","待查":"#a3605a"}[s.conf];
      el('circle',{cx:NW/2-14,cy:-h/2+14,r:5,fill:cc},g);
      const ct=el('text',{x:4,y:h/2-10,'text-anchor':'middle','font-size':11,fill:'#9a8d7e'},g); ct.textContent=s.conf;
    }
  });
  applyView();
}

/* pan & zoom */
const svg=$('map');
function applyView(){
  const r=svg.getBoundingClientRect();
  $('vp').setAttribute('transform',`translate(${r.width/2+view.x},${r.height/2+view.y}) scale(${view.k})`);
}
function fit(){
  const r=svg.getBoundingClientRect();
  const bb=$('vp').getBBox();
  const k=Math.min(r.width/(bb.width+80), r.height/(bb.height+80), 1.15);
  view.k=Math.max(0.25,k);
  view.x=-(bb.x+bb.width/2)*view.k; view.y=-(bb.y+bb.height/2)*view.k;
  applyView();
}
function zoomAt(f,px,py){
  const r=svg.getBoundingClientRect();
  const nk=Math.min(3,Math.max(0.25,view.k*f)); f=nk/view.k;
  const cx=(px==null?r.width/2:px)-r.width/2, cy=(py==null?r.height/2:py)-r.height/2;
  view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.k=nk; applyView();
}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyView();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('zin').onclick=()=>zoomAt(1.2); $('zout').onclick=()=>zoomAt(1/1.2); $('zfit').onclick=fit;
$('whyToggle').onclick=()=>{showWhy=!showWhy;$('whyToggle').textContent=showWhy?'隐藏连线原因':'显示连线原因';draw();};
window.addEventListener('resize',applyView);

/* right side */
const badge=c=>`<span class="badge ${CONF_CLASS[c]||'b-tbd'}">${esc(c)}</span>`;
function renderDetail(){
  const ch=DATA.chars[cur], s=ch.senses.find(x=>x.id===selId)||ch.senses[0];
  let h='';
  if(s.id==='o'){
    h+=`<h4>本义 · 字源</h4><div class="dtitle">${esc(s.g)}</div>`;
    h+=`<div class="sub">《说文解字》原文 ${badge(ch.sw.conf)}</div><div class="box quote">${esc(ch.sw.t)}</div>`;
    if(ch.sw.note) h+=`<div class="src">注：${esc(ch.sw.note)}</div>`;
    const later=ch.evo==='后起';
    const st=[["甲骨文"],["金文"],["小篆"],["隶书"],["楷书"]];
    h+=`<div class="sub">字形演变（字形图占位）</div><div class="evo">`+st.map((x,i)=>{
      const real=i===4;
      let note = real?'今字':(later&&i<2?'未见·待查':'待补字形');
      return `<div><div class="g ${real?'real':''}">${real?esc(ch.c):'□'}</div><div class="n">${x[0]}</div><div class="s">${note}</div></div>`;}).join('')+`</div>`;
    h+=`<div class="sub">本义判定理由</div><div class="box">${esc(ch.reason)}</div>`;
  }else{
    const par=ch.senses.find(x=>x.id===s.p);
    h+=`<h4>义项详情</h4><div class="dtitle">${esc(s.g)}</div>`;
    h+=`<div class="row"><span class="badge tb" style="background:${TYPE_COLOR[s.t]}">${esc(s.t)}</span><span style="font-size:12px;color:#6b6058">来自：${esc(par?par.g:'')}</span></div>`;
    h+=`<div class="box">${esc(s.why)}</div>`;
  }
  h+=`<div class="sub">词族</div><div class="chips">${s.w.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`;
  h+=`<div class="sub">构词拆解</div><div class="box">${esc(s.b)}</div>`;
  h+=`<div class="sub">现代例句</div><div class="box"><span class="tag">示例</span>${esc(s.ex)}</div>`;
  h+=`<div class="sub">文言原句</div>`;
  if(s.cl){h+=`<div class="box"><div class="quote">${esc(s.cl.t)}</div><div class="src">—— ${esc(s.cl.s)}</div><div class="tr">译文：${esc(s.cl.tr)}</div></div>`;}
  else{h+=`<div class="box" style="color:#8a7d70">${badge('待查')} 暂未找到可靠的文言例句，不随意编造出处。</div>`;}
  h+=`<div class="sub">把握程度</div><div class="row">${badge(s.conf)}<span style="font-size:12px;color:#6b6058">${{"确定":"有可靠文献和工具书依据","通行说法":"工具书常见解释，细节可能有分歧","待查":"尚未核实，仅供参考"}[s.conf]||''}</span></div>`;
  $('detail').innerHTML=h;
}
function renderSide(){
  const ch=DATA.chars[cur], r=ch.rad;
  let h=`<div class="split"><div class="part m"><div class="pz">${esc(r.m[0])}</div><div class="pl">表义部分</div><div class="pn">${esc(r.m[1])}${r.m[2]?'<br>'+esc(r.m[2]):''}</div></div>`;
  if(r.s) h+=`<div class="part s"><div class="pz">${esc(r.s[0])}</div><div class="pl">表音部分 · ${esc(r.s[1])}</div><div class="pn">${esc(r.s[2])}</div></div>`;
  else h+=`<div class="part none"><div class="pz">—</div><div class="pl" style="color:#8a7d70">无表音部分</div><div class="pn">${esc(ch.kind)}，字形直接表义</div></div>`;
  h+=`</div>`;
  $('split').innerHTML=h;
  $('err').innerHTML=ch.err.r.map(x=>`<li class="r">${esc(x)}</li>`).join('')+ch.err.w.map(x=>`<li class="w">${esc(x)}</li>`).join('');
  $('code').innerHTML=ch.code.map(x=>`<div class="code">${x}</div>`).join('');
}

function select(i){
  cur=i; selId='o';
  [...$('charlist').children].forEach((b,j)=>b.classList.toggle('on',j===i));
  $('charlist').children[i].scrollIntoView({block:'nearest'});
  const ch=DATA.chars[i];
  $('hChar').textContent=ch.c; $('hPy').textContent=ch.py;
  $('hType').textContent=ch.kind+' · '+(ch.senses.length-1)+' 条扩展义项';
  draw(); renderDetail(); renderSide(); requestAnimationFrame(fit);
}
select(0);
})();
</script>
