<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2f2a24; --sub:#7a7062; --line:#e6dccb;
  --accent:#c2553a; --accent2:#2f7d74; --shadow:0 6px 24px rgba(80,60,30,.08);
  --yin:#2f7d74; --bi:#d98a1e; --zhuan:#7a5cc2; --jia:#c2553a;
  --ok:#3c8d4f; --tong:#3a6fb0; --dai:#b07a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif}
/* 顶部一级菜单 */
header{height:60px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.04)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo b{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto}
nav.top button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;font-family:inherit}
nav.top button:hover{background:#f1e8d8;color:var(--ink)}
nav.top button.on{background:var(--ink);color:#fff}
nav.top button.off{opacity:.55}
/* 主体 */
main{display:grid;grid-template-columns:112px 1fr 360px;height:calc(100% - 60px)}
aside.chars{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px}
aside.chars h4{font-size:12px;color:var(--sub);font-weight:500;margin:4px 4px 10px}
.charbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:6px 8px;margin-bottom:4px;cursor:pointer;font-family:inherit;color:var(--ink)}
.charbtn .c{font-size:24px;line-height:1}
.charbtn .p{font-size:11px;color:var(--sub)}
.charbtn:hover{background:#f6efe2}
.charbtn.on{background:#fbe9e2;border-color:#efc7b9}
.charbtn.on .c{color:var(--accent)}
/* 中间 */
section.center{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.origin{margin:14px 14px 0;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:auto 1fr 1fr;gap:16px;align-items:start}
.bigch{width:86px;height:86px;border-radius:18px;background:repeating-linear-gradient(0deg,transparent 0 42px,#f0d9cf 42px 43px),repeating-linear-gradient(90deg,transparent 0 42px,#f0d9cf 42px 43px),#fff7f2;border:2px solid #e9b9a8;display:grid;place-items:center;font-size:60px;color:var(--accent)}
.bigpy{text-align:center;color:var(--sub);margin-top:4px;font-size:13px}
.blk h5{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px;letter-spacing:.05em}
.sw{font-size:16px;line-height:1.6}
.sw.none{font-size:13px;color:var(--sub)}
.forms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.forms span{font-size:11px;padding:4px 8px;border:1px dashed #d8c9b0;border-radius:8px;color:var(--sub);background:#fcf8f0}
.reason{font-size:13px;line-height:1.7}
.mapwrap{flex:1;position:relative;margin:12px 14px 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.mapwrap svg{width:100%;height:100%;cursor:grab;display:block;background-image:radial-gradient(#eadfcb 1px,transparent 1px);background-size:22px 22px}
.mapwrap svg.drag{cursor:grabbing}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;color:var(--ink)}
.tools button:hover{background:#f6efe2}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);background:rgba(255,253,248,.9);padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.hint{position:absolute;left:12px;top:10px;font-size:12px;color:var(--sub)}
.node{cursor:pointer}
.node:hover .nb{filter:brightness(.97)}
.node.sel .nb{stroke:var(--accent);stroke-width:3}
/* 右侧栏 */
aside.side{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#fff}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{font-size:12px;color:var(--sub);font-weight:600;margin:10px 0 4px}
.card p{line-height:1.7;font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;font-weight:500}
.lv{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;font-weight:500}
.lv.确定{color:var(--ok);border-color:var(--ok);background:#eef7f0}
.lv.通行说法{color:var(--tong);border-color:var(--tong);background:#eef3fa}
.lv.待查{color:var(--dai);border-color:var(--dai);background:#fbf3e6}
.fam{display:flex;gap:6px;flex-wrap:wrap}
.fam span{background:#f6efe2;border-radius:8px;padding:3px 10px;font-size:13px}
.ex{background:#fbf7ee;border-left:3px solid var(--accent2);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.7}
.ex small{color:var(--sub);margin-left:4px}
.ex.cl{border-left-color:var(--accent)}
.muted{color:var(--sub);font-size:12px}
.parts{display:flex;gap:8px;margin:4px 0 8px}
.part{flex:1;border-radius:12px;padding:8px;text-align:center}
.part b{display:block;font-size:26px;font-weight:500}
.part span{font-size:11px}
.part.m{background:#e8f3f1;color:var(--accent2)}
.part.s{background:#fbe9e2;color:var(--accent)}
.part.x{background:#f1ede5;color:var(--sub)}
.side .sec{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.08em;margin:6px 2px 8px}
.stub{display:grid;place-items:center;height:100%;color:var(--sub);text-align:center;line-height:2}
.stub b{font-size:42px;color:#d8c9b0;display:block}
@media(max-width:1100px){main{grid-template-columns:100px 1fr 300px}.origin{grid-template-columns:auto 1fr}.origin .blk:last-child{grid-column:1/-1}}
</style>
</head>

{"ch":"熄","py":"xī","sw":"熄，畜火也。从火，息声。亦曰灭火。","swLv":"通行说法","why":"《说文》训“畜火”，就是把火种压住保存起来，又说“亦曰灭火”。从“火”，“息”有停止义（通行说法）。按《说文》以“畜火”为本义，“熄灭”是后来通用的意思。",
 "parts":{"m":"火","mNote":"和火有关","s":"息","sNote":"xī，兼表“停止”（通行说法）","type":"形声（声兼义）"},
 "err":{"read":"读 xī。","write":"别和“息”“媳”混：熄有火字旁。"},
 "code":"声旁也会“带意思”：息表示停下来，加火就是火停下来——熄。",
 "senses":[
  {"id":"s0","n":"压住火种保存（畜火）","from":null,"fam":["火种（相关）","封火（相关）","畜火（同义）"],"build":"畜火=畜（积存）+火","ex":"古人晚上把火压小，留着火种，叫作“熄”。","exSelf":true,"cl":null,"clNote":"本义文言单句待查。","lv":"通行说法"},
  {"id":"s1","n":"火灭了、使火灭","from":"s0","t":"引申","r":"把火压住，火就不再燃烧，于是变成“熄灭”。","fam":["熄灭","熄火","熄灯"],"build":"熄灭=熄+灭，两个近义字合成","ex":"到点熄灯，同学们都睡了。","exSelf":true,"cl":null,"clNote":"文言用例待查。","lv":"确定"},
  {"id":"s2","n":"停止、消失","from":"s1","t":"比喻","r":"像火灭了一样，事情也会停下、消失。","fam":["止息（近义）","平息（近义）","熄（希望熄灭）"],"build":"王者之迹熄=王者的事迹+熄（消失）","ex":"他心中的希望没有熄灭。","exSelf":true,"cl":{"t":"王者之迹熄而诗亡。","s":"《孟子·离娄下》","y":"圣王的事迹消失了，采诗的传统也就没有了。"},"lv":"确定"}
 ]},
{"ch":"兀","py":"wù","sw":"兀，高而上平也。从一在人上。","swLv":"确定","why":"《说文》说是“高而顶上平”，字形是“一”在“人（儿）”的上面，像人头顶平平的。字形和解释一致，定为本义。",
 "parts":{"m":"一 + 儿（人）","mNote":"“一”在人的上面，表头顶平","s":"无","sNote":"会意 / 指事","type":"会意（按《说文》）"},
 "err":{"read":"读 wù，不读 yuán。","write":"上面只有一横，不要写成“元”（元上面是两横）。"},
 "code":"一横之差：兀（一横）、元（两横）。看横的数量来分辨。",
 "senses":[
  {"id":"s0","n":"高而顶上平","from":null,"fam":["突兀","兀立","兀然"],"build":"兀立=兀（高高地）+立（站着）","ex":"一块巨石兀立在山顶。","exSelf":true,"cl":{"t":"呜呼！何时眼前突兀见此屋。","s":"杜甫《茅屋为秋风所破歌》","y":"唉！什么时候眼前能高高耸立起这样的房屋。"},"lv":"确定"},
  {"id":"s1","n":"光秃","from":"s0","t":"引申","r":"顶上平平、什么都没有，就成了“光秃秃”。","fam":["兀鹫","兀秃","兀顶"],"build":"兀鹫=兀（头顶光秃）+鹫（大型猛禽）","ex":"兀鹫的头上几乎没有羽毛。","exSelf":true,"cl":null,"clNote":"文言用例待查。","lv":"通行说法"},
  {"id":"s2","n":"被砍去脚的人","from":"s0","t":"假借","r":"古书里用“兀”指断了脚的人，和本义的关系还没有定论。","fam":["兀者","刖（相关）","兀足"],"build":"兀者=兀（断足）+者（……的人）","ex":"《庄子》里写了一位兀者，却很受人尊敬。","exSelf":true,"cl":{"t":"鲁有兀者王骀。","s":"《庄子·德充符》","y":"鲁国有个被砍去一只脚的人，名叫王骀。"},"lv":"待查","lvNote":"文言句确定；变化类型待查。"},
  {"id":"s3","n":"兀自：仍然、还是","from":"s0","t":"假借","r":"早期白话借“兀”的音做虚词。","fam":["兀自","兀的","兀那"],"build":"兀自=兀（虚词）+自","ex":"雨停了，屋檐兀自滴着水。","exSelf":true,"cl":null,"clNote":"元曲、话本用例的具体出处待查。","lv":"通行说法"}
 ]},
{"ch":"喔","py":"wō / ō","sw":"喔，鸡声也。从口，屋声。","swLv":"通行说法","why":"按《说文》，“喔”是鸡叫声；字从“口”表声音，“屋”表音，形义一致，定为本义。",
 "parts":{"m":"口","mNote":"和声音有关","s":"屋","sNote":"wū → wō","type":"形声"},
 "err":{"read":"鸡叫读 wō；表示明白的叹词读 ō。不读 wū。","write":"右边是“屋”，尸字头里是“至”，别写成“室”。"},
 "code":"动物叫声字常加口旁：喔（鸡）、哞（牛）、喵（猫）、嘎（鸭）。",
 "senses":[
  {"id":"s0","n":"（wō）鸡叫声","from":null,"fam":["喔喔","喔喔啼","鸡鸣（同义）"],"build":"喔喔=叠字，模仿公鸡的叫声","ex":"天亮了，公鸡喔喔地叫。","exSelf":true,"cl":null,"clNote":"文言用例待查。","lv":"通行说法"},
  {"id":"s1","n":"（ō）表示明白了","from":"s0","t":"假借","r":"借这个声音来表示“原来如此”的语气。","fam":["喔","喔唷","噢（近义）"],"build":"叹词单用，放在句首","ex":"喔，原来是这样！","exSelf":true,"cl":null,"clNote":"口语叹词，无文言用例。","lv":"通行说法"}
 ]},
{"ch":"裳","py":"cháng / shang","sw":"常，下帬也。从巾，尚声。裳，常或从衣。","swLv":"确定","why":"《说文》把“裳”列为“常”的另一种写法，训“下帬”，即下身穿的裙。古人“上衣下裳”，字从“衣”，形义一致。",
 "parts":{"m":"衣","mNote":"和衣服有关（在下方）","s":"尚","sNote":"shàng → cháng","type":"形声"},
 "err":{"read":"“衣裳”的裳读轻声 shang；古义“下裙”读 cháng。","write":"下面是“衣”，不要写成“巾”（那是“常”）或“土”（那是“堂”）。"},
 "code":"尚家族：常、裳、堂、赏、掌、党。“常”本来也是裙子，被借作“经常”后，就用“裳”表示裙子。",
 "senses":[
  {"id":"s0","n":"（cháng）下身穿的裙","from":null,"fam":["上衣下裳","霓裳","衣裳（古义）"],"build":"上衣下裳：衣在上身，裳在下身","ex":"古人上身穿衣，下身穿裳。","exSelf":true,"cl":{"t":"绿兮衣兮，绿衣黄裳。","s":"《诗经·邶风·绿衣》","y":"绿色的上衣啊，绿色上衣配黄色下裙。"},"lv":"确定"},
  {"id":"s1","n":"（shang）衣服的统称","from":"s0","t":"转喻","r":"用“裳”这一部分，加上“衣”，代指全身的衣服。","fam":["衣裳","新衣裳","花衣裳"],"build":"衣裳=衣（上衣）+裳（下裙），合指衣服","ex":"过年了，我穿上了新衣裳。","exSelf":true,"cl":null,"clNote":"文言用例待查。","lv":"通行说法"},
  {"id":"s2","n":"霓裳：彩虹般的衣裙","from":"s0","t":"比喻","r":"把衣裙比作彩虹，形容又轻又美。","fam":["霓裳","霓裳羽衣曲","羽衣（相关）"],"build":"霓裳=霓（彩虹）+裳（衣裙）","ex":"舞台上的演员像穿着霓裳。","exSelf":true,"cl":{"t":"渔阳鼙鼓动地来，惊破霓裳羽衣曲。","s":"白居易《长恨歌》","y":"渔阳的战鼓震天而来，打断了宫中的《霓裳羽衣曲》。"},"lv":"确定"}
 ]}
]}
</script>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const TC = {"引申":"var(--yin)","比喻":"var(--bi)","转喻":"var(--zhuan)","假借":"var(--jia)"};
const TH = {"引申":"#2f7d74","比喻":"#d98a1e","转喻":"#7a5cc2","假借":"#c2553a"};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur = 0, selId = 's0';

// 顶部菜单
const nav = $('#topnav');
D.menu.forEach((m,i)=>{
  const b = document.createElement('button');
  b.textContent = m; b.className = i===0?'on':'off';
  b.onclick = ()=>{
    nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(i===0){ $('#centerSec').style.display=''; $('#side').style.display=''; $('#stub')&&$('#stub').remove(); render(); }
    else{
      $('#centerSec').style.display='none'; $('#side').style.display='none';
      let st = $('#stub'); if(!st){ st=document.createElement('section'); st.id='stub'; st.className='stub'; st.style.gridColumn='2 / 4'; $('#main').appendChild(st); }
      st.innerHTML = '<div><b class="kai">'+esc(m.slice(0,1))+'</b>「'+esc(m)+'」模块建设中<br><span class="muted">本文件只实现「字义扩展图」</span></div>';
    }
  };
  nav.appendChild(b);
});

// 左侧字表
const list = $('#charlist');
D.chars.forEach((c,i)=>{
  const b = document.createElement('button');
  b.className = 'charbtn';
  b.innerHTML = '<span class="c kai">'+esc(c.ch)+'</span><span class="p">'+esc(c.py)+'</span>';
  b.onclick = ()=>{ cur=i; selId='s0'; render(); fit(); };
  list.appendChild(b);
});

function lvTag(lv){ return '<span class="lv '+esc(lv)+'">'+esc(lv)+'</span>'; }

function renderOrigin(c){
  const forms = c.forms ? '<span>'+esc(c.forms)+'</span>' :
    ['甲骨文','金文','小篆','隶书'].map(f=>'<span>'+f+' 〔字形占位〕</span>').join('') + '<span>楷书 '+esc(c.ch)+'</span>';
  const sw = c.sw ? '<div class="sw kai">'+esc(c.sw)+'</div>' : '<div class="sw none">'+esc(c.swNote)+'</div>';
  const s0 = c.senses.find(s=>s.from===null);
  $('#origin').innerHTML =
    '<div><div class="bigch kai">'+esc(c.ch)+'</div><div class="bigpy">'+esc(c.py)+'</div></div>'+
    '<div class="blk"><h5>《说文解字》 '+lvTag(c.swLv)+'</h5>'+sw+'<h5 style="margin-top:10px">字形演变</h5><div class="forms">'+forms+'</div></div>'+
    '<div class="blk"><h5>本义：'+esc(s0.n)+'</h5><div class="reason">'+esc(c.why)+'</div></div>';
}

// 义项网布局
const svg = $('#map'), vp = $('#vp');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function wrap(t, n){ const out=[]; for(let i=0;i<t.length;i+=n) out.push(t.slice(i,i+n)); return out; }

function layout(c){
  const pos = {};
  const root = c.senses.find(s=>s.from===null);
  pos[root.id] = {x:0,y:0,a:0};
  const kids = id => c.senses.filter(s=>s.from===id);
  const first = kids(root.id);
  const n = first.length;
  first.forEach((s,i)=>{
    const a = -Math.PI/2 + (2*Math.PI*i)/n + (n===2?Math.PI/2:0);
    pos[s.id] = {x:Math.cos(a)*300, y:Math.sin(a)*240, a};
  });
  // 二级
  first.forEach(p=>{
    const ks = kids(p.id);
    ks.forEach((s,j)=>{
      const a = pos[p.id].a + (j-(ks.length-1)/2)*0.5;
      pos[s.id] = {x:pos[p.id].x+Math.cos(a)*300, y:pos[p.id].y+Math.sin(a)*220, a};
    });
  });
  return pos;
}

function renderMap(c){
  vp.innerHTML='';
  const pos = layout(c);
  const gE = el('g',{},vp), gL = el('g',{},vp), gN = el('g',{},vp);
  c.senses.forEach(s=>{
    if(!s.from) return;
    const a = pos[s.from], b = pos[s.id], col = TH[s.t]||'#999';
    el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:col,'stroke-width':2.5,'stroke-dasharray':s.t==='假借'?'7 6':'', 'stroke-linecap':'round',opacity:.85},gE);
    const mx = a.x+(b.x-a.x)*0.5, my = a.y+(b.y-a.y)*0.5;
    const g = el('g',{transform:'translate('+mx+','+my+')'},gL);
    const lines = wrap(s.r, 13).slice(0,3);
    const w = 13*13+16, h = 24 + lines.length*16 + 6;
    el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:10,fill:'#fffdf8',stroke:col,'stroke-width':1.2,opacity:.96},g);
    const pill = el('rect',{x:-22,y:-h/2+5,width:44,height:18,rx:9,fill:col},g);
    const tt = el('text',{x:0,y:-h/2+18,'text-anchor':'middle','font-size':11,fill:'#fff','font-weight':600},g); tt.textContent = s.t;
    lines.forEach((ln,i)=>{ const t=el('text',{x:0,y:-h/2+38+i*16,'text-anchor':'middle','font-size':11.5,fill:'#5c5245'},g); t.textContent=ln; });
  });
  c.senses.forEach(s=>{
    const p = pos[s.id];
    const g = el('g',{class:'node'+(s.id===selId?' sel':''),transform:'translate('+p.x+','+p.y+')'},gN);
    g.addEventListener('click',e=>{ e.stopPropagation(); selId=s.id; renderMap(c); renderSide(c); });
    if(!s.from){
      el('circle',{r:78,fill:'#fff3ee',class:'nb',stroke:'#e9b9a8','stroke-width':2},g);
      const t1=el('text',{y:-14,'text-anchor':'middle','font-size':44,fill:'#c2553a',class:'kai'},g); t1.textContent=c.ch;
      const t0=el('text',{y:-56,'text-anchor':'middle','font-size':11,fill:'#a0715f','font-weight':600},g); t0.textContent='本义';
      wrap(s.n,8).slice(0,2).forEach((ln,i)=>{ const t=el('text',{y:20+i*17,'text-anchor':'middle','font-size':14,fill:'#2f2a24','font-weight':600},g); t.textContent=ln; });
    } else {
      const col = TH[s.t]||'#999';
      const lines = wrap(s.n,9).slice(0,2);
      const w=170, h=34+lines.length*18;
      el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:'#fff',class:'nb',stroke:col,'stroke-width':1.6},g);
      el('rect',{x:-w/2,y:-h/2,width:6,height:h,rx:3,fill:col},g);
      lines.forEach((ln,i)=>{ const t=el('text',{x:4,y:-h/2+24+i*18,'text-anchor':'middle','font-size':14,fill:'#2f2a24','font-weight':600},g); t.textContent=ln; });
      const lc = {"确定":"#3c8d4f","通行说法":"#3a6fb0","待查":"#b07a2a"}[s.lv];
      const tl=el('text',{x:4,y:h/2-9,'text-anchor':'middle','font-size':10.5,fill:lc},g); tl.textContent='● '+s.lv;
    }
  });
}

function renderSide(c){
  const s = c.senses.find(x=>x.id===selId) || c.senses[0];
  const head = s.from ? '<span class="tag" style="background:'+TC[s.t]+'">'+esc(s.t)+'</span>' : '<span class="tag" style="background:#a0715f">本义</span>';
  const why = s.from ? '<h4>为什么会这样变？</h4><p>'+esc(s.r)+'</p>' : '';
  const cl = s.cl ? '<div class="ex cl"><span class="kai" style="font-size:15px">'+esc(s.cl.t)+'</span><br><small>——'+esc(s.cl.s)+'</small><br><span class="muted">译文：'+esc(s.cl.y)+'</span></div>'
                  : '<div class="ex cl muted">'+esc(s.clNote||'待查')+' '+lvTag('待查')+'</div>';
  const P = c.parts;
  const sPart = (P.s && P.s!=='无' && P.s!=='无单独声旁') ? '<div class="part s"><b class="kai">'+esc(P.s.split('（')[0])+'</b><span>表音 · '+esc(P.sNote)+'</span></div>'
             : '<div class="part x"><b>—</b><span>'+esc(P.sNote||'无声旁')+'</span></div>';
  $('#side').innerHTML =
    '<div class="sec">义项详情</div>'+
    '<div class="card"><h3>'+head+esc(s.n)+' '+lvTag(s.lv)+'</h3>'+why+
      (s.lvNote?'<p class="muted">把握说明：'+esc(s.lvNote)+'</p>':'')+
      '<h4>词族</h4><div class="fam">'+s.fam.map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
      '<h4>构词拆解</h4><p>'+esc(s.build)+'</p>'+
      '<h4>现代例句</h4><div class="ex">'+esc(s.ex)+(s.exSelf?'<small>（示例）</small>':'')+'</div>'+
      '<h4>文言原句</h4>'+cl+
    '</div>'+
    '<div class="sec">字的档案</div>'+
    '<div class="card"><h3>偏旁拆分 <span class="muted" style="font-weight:400">'+esc(P.type)+'</span></h3>'+
      '<div class="parts"><div class="part m"><b class="kai">'+esc(P.m)+'</b><span>表义 · '+esc(P.mNote)+'</span></div>'+sPart+'</div></div>'+
    '<div class="card"><h3>易读错 · 易写错</h3><h4>读音</h4><p>'+esc(c.err.read)+'</p><h4>字形</h4><p>'+esc(c.err.write)+'</p></div>'+
    '<div class="card" style="background:#fbf7ee"><h3>🔑 汉字密码</h3><p>'+esc(c.code)+'</p></div>';
}

function render(){
  const c = D.chars[cur];
  list.querySelectorAll('.charbtn').forEach((b,i)=>b.classList.toggle('on',i===cur));
  renderOrigin(c); renderMap(c); renderSide(c);
}

// 缩放平移
let T = {k:1,x:0,y:0};
function apply(){ vp.setAttribute('transform','translate('+T.x+','+T.y+') scale('+T.k+')'); }
function fit(){
  const r = svg.getBoundingClientRect();
  const bb = vp.getBBox();
  const k = Math.min(1.1, Math.min(r.width/(bb.width+60), r.height/(bb.height+90)));
  T.k = k; T.x = r.width/2 - (bb.x+bb.width/2)*k; T.y = r.height/2 - (bb.y+bb.height/2)*k - 10; apply();
}
function zoomAt(f, px, py){
  const nk = Math.max(.3, Math.min(3, T.k*f)); f = nk/T.k;
  T.x = px-(px-T.x)*f; T.y = py-(py-T.y)*f; T.k = nk; apply();
}
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top); },{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{ if(e.target.closest('.node')) return; drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y}; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag) return; T.x=drag.tx+e.clientX-drag.x; T.y=drag.ty+e.clientY-drag.y; apply(); });
svg.addEventListener('pointerup',()=>{ drag=null; svg.classList.remove('drag'); });
const mid = ()=>{ const r=svg.getBoundingClientRect(); return [r.width/2,r.height/2]; };
$('#zin').onclick=()=>zoomAt(1.2,...mid());
$('#zout').onclick=()=>zoomAt(1/1.2,...mid());
$('#zfit').onclick=fit;
window.addEventListener('resize',fit);

render(); requestAnimationFrame(fit);
})();
</script>
</body>
</html>
