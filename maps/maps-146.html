<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字义扩展图 · 儿童汉字学习</title>
<style>
:root{
  --paper:#fbf7ef;--card:#fffdf8;--ink:#2b2622;--ink2:#6b625a;--line:#e8dfd0;
  --accent:#c2412d;--accent-soft:#fbe7e1;
  --yin:#2a8c82;--bi:#e08a1e;--zhuan:#7b5bc4;--jia:#4f7cac;
  --ok:#2e8b57;--mid:#d08c1a;--todo:#b0463a;
  --r:16px;--shadow:0 6px 22px rgba(80,60,30,.08);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{display:flex;flex-direction:column;overflow:hidden}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.04);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{border:0;background:none;padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav.top button:hover{background:#f4ede1}
nav.top button.on{background:var(--accent);color:#fff;font-weight:600}
nav.top button.off{opacity:.55}
/* layout */
main{flex:1;display:grid;grid-template-columns:200px 1fr 360px;min-height:0}
aside.left{border-right:1px solid var(--line);background:var(--card);overflow:auto;padding:14px}
aside.left h3,aside.right h3{margin:4px 4px 10px;font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:.08em}
.charlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.charlist button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.charlist button b{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.charlist button small{font-size:11px;color:var(--ink2)}
.charlist button:hover{border-color:var(--accent);transform:translateY(-1px)}
.charlist button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.charlist button.on small{color:#ffe9e2}
/* stage */
section.stage{position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,#fffaf1 0,#f8f1e4 70%),var(--paper)}
section.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#e7dcc8 1px,transparent 1px);background-size:22px 22px;opacity:.5;pointer-events:none}
svg#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.toolbar{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;z-index:2}
.toolbar button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:18px;cursor:pointer;color:var(--ink)}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.legend{position:absolute;left:16px;bottom:16px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;z-index:2;box-shadow:var(--shadow)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.stagehead{position:absolute;left:16px;top:14px;z-index:2;display:flex;align-items:baseline;gap:10px}
.stagehead .big{font-family:var(--serif);font-size:30px;font-weight:700}
.stagehead .tip{font-size:12px;color:var(--ink2)}
/* svg nodes */
.node{cursor:pointer}
.node rect,.node circle{transition:.15s}
.node:hover rect{filter:drop-shadow(0 4px 10px rgba(80,60,30,.18))}
.node.sel rect.box{stroke:var(--accent);stroke-width:3}
.edge-label{font-size:11px}
/* right */
aside.right{border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:14px 16px 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.card h4 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sense-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sense-title .name{font-family:var(--serif);font-size:20px;font-weight:700}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;font-weight:600}
.conf{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;font-weight:600}
.conf.c1{color:var(--ok);border-color:var(--ok);background:#ebf6ef}
.conf.c2{color:var(--mid);border-color:var(--mid);background:#fdf3e1}
.conf.c3{color:var(--todo);border-color:var(--todo);background:#fbeceb}
.why{font-size:13px;color:var(--ink2);background:#faf5ec;border-radius:10px;padding:8px 10px;margin:6px 0 4px}
.row{margin:10px 0 0}
.row .k{font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--accent-soft);color:#8f2c1d;border-radius:8px;padding:4px 10px;font-size:14px;font-family:var(--serif)}
.quote{font-family:var(--serif);font-size:15px;line-height:1.7;border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.src{font-size:12px;color:var(--ink2);margin-top:2px}
.tr{font-size:13px;color:#4c4540;margin-top:4px}
.tag{font-size:10px;padding:1px 6px;border-radius:6px;background:#eef3f8;color:var(--jia);margin-left:4px;font-weight:600;vertical-align:middle}
.tag.todo{background:#fbeceb;color:var(--todo)}
.sw{font-family:var(--serif);font-size:15px;line-height:1.7;background:#fbf6ec;border-radius:10px;padding:8px 10px}
.evo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.evo span{border:1px dashed #cdbfa8;border-radius:8px;padding:4px 8px;background:#fffdf8}
.evo em{color:#bba98e;font-style:normal}
.parts{display:flex;gap:8px}
.parts div{flex:1;border-radius:12px;padding:10px;text-align:center}
.parts .yi{background:#e7f4f2}.parts .yin{background:#eef1fa}
.parts b{display:block;font-family:var(--serif);font-size:26px}
.parts small{font-size:12px;color:var(--ink2)}
ul.err{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.7}
ul.err li::marker{color:var(--accent)}
.code{font-size:13px;line-height:1.7;background:linear-gradient(135deg,#fff7e6,#fdf0f6);border-radius:12px;padding:10px 12px;margin-top:6px}
.code b{color:#8f2c1d}
.small{font-size:12px;color:var(--ink2)}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--ink2)}
.placeholder .big{font-family:var(--serif);font-size:60px;color:#d8cbb6}
@media (max-width:1100px){main{grid-template-columns:150px 1fr 300px}.charlist{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  body{overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}
  aside.left{border-right:0;border-bottom:1px solid var(--line)}
  .charlist{grid-template-columns:repeat(10,1fr)}
  .charlist button small{display:none}
}
</style>
</head>

  <aside class="right" id="right"></aside>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const TYPES = DATA.types;
const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
let cur = 0, sel = 'c';
let view = {x:0,y:0,k:1};

/* ---------- top nav ---------- */
const topnav = $('#topnav');
DATA.menus.forEach((m,i)=>{
  const b = document.createElement('button');
  b.textContent = m;
  b.className = i===0 ? 'on' : 'off';
  b.title = i===0 ? '' : '本示例只实现「字义扩展图」';
  b.onclick = () => { if(i!==0){ flash(m); } };
  topnav.appendChild(b);
});
function flash(m){
  const r = $('#right');
  r.scrollTop = 0;
  const tip = document.createElement('div');
  tip.className='card'; tip.innerHTML = `<h4><span class="dot"></span>「${m}」</h4><div class="small">该模块尚未开放，本页只实现「字义扩展图」。</div>`;
  r.prepend(tip); setTimeout(()=>tip.remove(),2200);
}

/* ---------- left list ---------- */
const list = $('#charlist');
DATA.chars.forEach((c,i)=>{
  const b = document.createElement('button');
  b.innerHTML = `<b>${c.ch}</b><small>${c.py}</small>`;
  b.onclick = ()=>{ cur=i; sel='c'; render(); };
  list.appendChild(b);
});

/* ---------- legend ---------- */
$('#legend').innerHTML = Object.entries(TYPES).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('')
 + `<span style="color:var(--ink2)">｜把握：<b style="color:var(--ok)">●</b>确定 <b style="color:var(--mid)">●</b>通行说法 <b style="color:var(--todo)">●</b>待查</span>`;

/* ---------- helpers ---------- */
function el(tag, attrs, parent){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function wrap(str, n){ const out=[]; for(let i=0;i<str.length;i+=n) out.push(str.slice(i,i+n)); return out; }
function confClass(c){ return c==='确定'?'c1':(c==='通行说法'?'c2':'c3'); }
function confColor(c){ return c==='确定'?'#2e8b57':(c==='通行说法'?'#d08c1a':'#b0463a'); }
function esc(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ---------- layout ---------- */
function layout(nodes){
  const pos = {c:{x:0,y:0,a:0,lvl:0}};
  const lvl1 = nodes.filter(n=>n.from==='c');
  const n1 = lvl1.length;
  const R1 = 260, R2 = 470;
  lvl1.forEach((n,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n1 + (n1===2? Math.PI/2 : 0);
    pos[n.id] = {x:Math.cos(a)*R1*1.25, y:Math.sin(a)*R1, a, lvl:1};
  });
  // deeper levels
  let changed = true, guard = 0;
  while(changed && guard++<5){
    changed=false;
    const parents = {};
    nodes.forEach(n=>{ if(n.from && n.from!=='c' && pos[n.from] && !pos[n.id]){ (parents[n.from]=parents[n.from]||[]).push(n); }});
    for(const pid in parents){
      const kids = parents[pid], p = pos[pid];
      const spread = 0.42;
      kids.forEach((k,j)=>{
        const a = p.a + (j-(kids.length-1)/2)*spread;
        const R = (p.lvl===1?R2:R2+180);
        pos[k.id] = {x:Math.cos(a)*R*1.2, y:Math.sin(a)*R, a, lvl:p.lvl+1};
        changed = true;
      });
    }
  }
  return pos;
}

/* ---------- map ---------- */
const svg = $('#map'), vp = $('#viewport');
function applyView(){ vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function resetView(){
  const r = svg.getBoundingClientRect();
  const k = Math.min(r.width/1300, r.height/1050, 1.1);
  view = {x:r.width/2, y:r.height/2+10, k:Math.max(k,.38)};
  applyView();
}

function drawMap(){
  const C = DATA.chars[cur];
  vp.innerHTML='';
  const pos = layout(C.nodes);
  const gE = el('g',{},vp), gL = el('g',{},vp), gN = el('g',{},vp);
  // edges
  C.nodes.forEach(n=>{
    if(!n.from) return;
    const a = pos[n.from], b = pos[n.id]; if(!a||!b) return;
    const col = TYPES[n.type]||'#999';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
    const cx = mx - dy/len*30, cy = my + dx/len*30;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':3,'stroke-linecap':'round',opacity:.85,'stroke-dasharray':n.type==='假借'?'8 6':''},gE);
    // label at curve midpoint
    const lx = .25*a.x+.5*cx+.25*b.x, ly = .25*a.y+.5*cy+.25*b.y;
    const g = el('g',{transform:`translate(${lx},${ly})`,class:'edge-label'},gL);
    const lines = wrap(n.why, 11);
    const w = 11*12+20, h = 26 + lines.length*15;
    el('rect',{x:-w/2,y:-13,width:w,height:h,rx:10,fill:'#fffdf8',stroke:col,'stroke-width':1.2,opacity:.96},g);
    const pw = 40;
    el('rect',{x:-pw/2,y:-9,width:pw,height:18,rx:9,fill:col},g);
    const t = el('text',{x:0,y:4,'text-anchor':'middle',fill:'#fff','font-size':11,'font-weight':700},g); t.textContent=n.type;
    lines.forEach((ln,i)=>{ const tt=el('text',{x:0,y:24+i*15,'text-anchor':'middle',fill:'#5a524a','font-size':11.5},g); tt.textContent=ln; });
  });
  // nodes
  C.nodes.forEach(n=>{
    const p = pos[n.id]; if(!p) return;
    const g = el('g',{class:'node'+(sel===n.id?' sel':''),transform:`translate(${p.x},${p.y})`},gN);
    g.addEventListener('click',e=>{ e.stopPropagation(); sel=n.id; drawMap(); drawRight(); });
    if(n.id==='c'){
      el('circle',{r:118,fill:'#fbe7e1',opacity:.6},g);
      const box = el('rect',{class:'box',x:-96,y:-96,width:192,height:192,rx:40,fill:'#fff',stroke:'#c2412d','stroke-width':2.5},g);
      const tag = el('rect',{x:-30,y:-86,width:60,height:22,rx:11,fill:'#c2412d'},g);
      const tt=el('text',{x:0,y:-70,'text-anchor':'middle',fill:'#fff','font-size':13,'font-weight':700},g); tt.textContent='本义';
      const ch=el('text',{x:0,y:18,'text-anchor':'middle','font-size':78,'font-family':'Songti SC,STSong,Noto Serif SC,serif','font-weight':700,fill:'#2b2622'},g); ch.textContent=C.ch;
      const py=el('text',{x:0,y:44,'text-anchor':'middle','font-size':14,fill:'#8a7f74'},g); py.textContent=n.py||C.py;
      const lb=el('text',{x:0,y:72,'text-anchor':'middle','font-size':16,'font-weight':700,fill:'#c2412d'},g); lb.textContent=n.label;
      el('circle',{cx:78,cy:-78,r:7,fill:confColor(n.conf)},g);
    } else {
      const label = n.label, w = Math.max(120, label.length*19+40), h = n.py?66:56;
      const col = TYPES[n.type]||'#999';
      el('rect',{class:'box',x:-w/2,y:-h/2,width:w,height:h,rx:18,fill:'#fff',stroke:col,'stroke-width':2},g);
      el('rect',{x:-w/2,y:-h/2,width:8,height:h,rx:4,fill:col},g);
      const t=el('text',{x:4,y:n.py?-4:6,'text-anchor':'middle','font-size':17,'font-weight':700,fill:'#2b2622'},g); t.textContent=label;
      if(n.py){ const s=el('text',{x:4,y:18,'text-anchor':'middle','font-size':12,fill:'#8a7f74'},g); s.textContent=n.py; }
      el('circle',{cx:w/2-12,cy:-h/2+12,r:5,fill:confColor(n.conf)},g);
    }
  });
}

/* pan & zoom */
let drag=null;
svg.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag) return; view.x=drag.vx+e.clientX-drag.x; view.y=drag.vy+e.clientY-drag.y; applyView(); });
svg.addEventListener('pointerup',()=>{ drag=null; svg.classList.remove('drag'); });
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top, e.deltaY<0?1.12:1/1.12); },{passive:false});
function zoomAt(px,py,f){ const nk=Math.min(3,Math.max(.25,view.k*f)); f=nk/view.k; view.x=px-(px-view.x)*f; view.y=py-(py-view.y)*f; view.k=nk; applyView(); }
function zoomCenter(f){ const r=svg.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,f); }
$('#zin').onclick=()=>zoomCenter(1.2); $('#zout').onclick=()=>zoomCenter(1/1.2); $('#zreset').onclick=resetView;
window.addEventListener('resize',resetView);

/* ---------- right panel ---------- */
function drawRight(){
  const C = DATA.chars[cur];
  const n = C.nodes.find(x=>x.id===sel) || C.nodes[0];
  const isC = n.id==='c';
  const col = isC ? '#c2412d' : (TYPES[n.type]||'#999');
  let h = '';
  // sense detail
  h += `<div class="card">
    <div class="sense-title"><span class="name">${C.ch} · ${esc(n.label)}</span>
      <span class="pill" style="background:${col}">${isC?'本义':esc(n.type)}</span>
      <span class="conf ${confClass(n.conf)}">${esc(n.conf)}</span></div>
    <div class="small">${n.py?('读音：'+n.py+'　'):''}${esc(n.gloss||'')}</div>
    ${!isC?`<div class="why">💡 为什么这样变：${esc(n.why)}</div>`:''}
    <div class="row"><div class="k">词族</div><div class="words">${n.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
    <div class="row"><div class="k">构词拆解</div><div style="font-size:14px">${esc(n.parse)}</div></div>
    <div class="row"><div class="k">现代例句 <span class="tag">示例</span></div><div style="font-size:14px">${esc(n.ex)}</div></div>
    <div class="row"><div class="k">文言原句</div>${
      n.wy ? `<div class="quote">${esc(n.wy.t)}</div><div class="src">—— ${esc(n.wy.s)}</div><div class="tr">译文：${esc(n.wy.y)}</div>`
           : `<div class="small">暂无可靠出处 <span class="tag todo">待查</span></div>`}</div>
  </div>`;
  // origin (center info)
  h += `<div class="card"><h4><span class="dot"></span>本义溯源</h4>
    <div class="row" style="margin-top:0"><div class="k">《说文》原文 <span class="conf ${confClass(C.swConf)}" style="margin-left:4px">${C.swConf}</span></div><div class="sw">${esc(C.sw)}</div></div>
    <div class="row"><div class="k">字形演变 <span class="tag">字形图占位</span></div><div class="evo">${C.evo.map(e=>`<span>${esc(e)}</span>`).join('<em>→</em>')}</div></div>
    <div class="row"><div class="k">本义判定理由</div><div style="font-size:13px;line-height:1.7">${esc(C.reason)}</div></div>
  </div>`;
  // parts
  h += `<div class="card"><h4><span class="dot" style="background:var(--yin)"></span>偏旁拆分 <span class="small" style="font-weight:400">${esc(C.parts.type)}</span></h4>
    <div class="parts"><div class="yi"><small>表义</small><b>${esc(C.parts.yi)}</b><small>${esc(C.parts.yiNote)}</small></div>
    <div class="yin"><small>表音</small><b>${esc(C.parts.yin)}</b><small>${esc(C.parts.yinNote)}</small></div></div></div>`;
  // errors
  h += `<div class="card"><h4><span class="dot" style="background:var(--bi)"></span>易读错 · 易写错</h4>
    <div class="k small" style="font-weight:600">读音</div><ul class="err">${C.err.read.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="k small" style="font-weight:600;margin-top:6px">字形</div><ul class="err">${C.err.write.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  // code
  h += `<div class="card"><h4><span class="dot" style="background:var(--zhuan)"></span>相关汉字密码</h4>${C.code.map(x=>`<div class="code">${x}</div>`).join('')}</div>`;
  h += `<div class="small" style="text-align:center;margin-top:6px">把握程度：确定＝字书与文献一致；通行说法＝多数教材采用；待查＝尚需核对原典</div>`;
  $('#right').innerHTML = h;
}

function render(){
  [...list.children].forEach((b,i)=>b.classList.toggle('on',i===cur));
  const C = DATA.chars[cur];
  $('#headChar').textContent = C.ch + ' · ' + C.py;
  drawMap(); drawRight(); resetView();
}
render();
})();
</script>
