<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 第149组</title>
<style>
:root{
  --bg:#f7f3ea; --paper:#fffdf8; --ink:#2f2a24; --ink2:#6b6257; --line:#e6ddcc;
  --brand:#c8553d; --brand2:#f2c14e; --soft:#fbf6ec;
  --yin:#2a9d8f; --bi:#e76f51; --zhuan:#7b61ff; --jia:#4f7cac;
  --ok:#3a9a5b; --tong:#d9962b; --dai:#c8553d;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font-family:inherit;cursor:pointer}
/* 顶部 */
header{height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.05);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#e98a5c);color:#fff;display:grid;place-items:center;font-style:normal;font-family:var(--serif);font-size:22px;box-shadow:0 3px 8px rgba(200,85,61,.3)}
.logo small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
nav.top button:hover{background:var(--soft);color:var(--ink)}
nav.top button.on{background:var(--ink);color:#fff;box-shadow:0 3px 10px rgba(47,42,36,.25)}
.group-tag{font-size:12px;color:var(--ink2);background:var(--soft);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}
/* 主体 */
.app{display:grid;grid-template-columns:200px 1fr 380px;height:calc(100% - 64px)}
aside.left{background:var(--paper);border-right:1px solid var(--line);padding:14px 12px;overflow-y:auto}
aside.left h3{font-size:12px;letter-spacing:2px;color:var(--ink2);margin:4px 6px 10px;font-weight:600}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chars button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;transition:.18s}
.chars button b{font-family:var(--serif);font-size:28px;line-height:1.1;font-weight:600}
.chars button span{font-size:11px;color:var(--ink2)}
.chars button:hover{border-color:var(--brand2);transform:translateY(-1px)}
.chars button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chars button.on span{color:#e8dfcf}
.tip{font-size:11px;color:var(--ink2);margin:14px 6px 0;line-height:1.6}
/* 画布 */
main{position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,rgba(120,100,70,.13) 1px,transparent 0) 0 0/22px 22px,var(--bg)}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.node{cursor:pointer}
.node rect{transition:filter .2s}
.node:hover rect{filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.zoombar{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:18px;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.zoombar button:hover{background:#fff}
.legend{position:absolute;left:14px;bottom:14px;background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 90px)}
.legend span{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.legend i{width:22px;height:4px;border-radius:2px;display:inline-block}
.origin-card{position:absolute;left:14px;top:14px;width:300px;background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(80,60,30,.08);overflow:hidden}
.origin-card .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(90deg,#fff3dc,#fffaf0);border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.origin-card .hd button{border:0;background:transparent;color:var(--ink2);font-size:12px}
.origin-card .bd{padding:10px 14px 12px;font-size:13px;line-height:1.7;max-height:46vh;overflow-y:auto}
.origin-card.min .bd{display:none}
.sw{font-family:var(--serif);background:var(--soft);border-left:3px solid var(--brand);padding:6px 10px;border-radius:0 8px 8px 0;margin:4px 0 8px}
.evo{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.evo div{flex:1 1 60px;min-width:60px;border:1px dashed #cdbfa6;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;color:var(--ink2);background:#fff}
.evo div b{display:block;font-family:var(--serif);font-size:13px;color:var(--ink);margin-bottom:2px}
.lbl{font-size:11px;color:var(--ink2);letter-spacing:1px;margin-top:6px;font-weight:600}
/* 右栏 */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(80,60,30,.04)}
.card h4{margin:0 0 10px;font-size:13px;color:var(--ink2);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.card h4::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--brand2)}
.sense-title{font-family:var(--serif);font-size:22px;font-weight:700;margin:2px 0 8px;line-height:1.35}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;color:#fff;font-weight:600;margin-right:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;border:1.5px solid;font-weight:600}
.why{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.7;margin:10px 0}
.sec{margin-top:12px}
.sec .t{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words span{font-family:var(--serif);font-size:16px;background:#fff7e6;border:1px solid #f1dfb5;border-radius:10px;padding:4px 10px}
.build{font-size:14px;line-height:1.7}
.ex{font-size:15px;line-height:1.7;font-family:var(--serif)}
.ex em{font-style:normal;font-family:var(--sans);font-size:11px;background:#eef3f8;color:var(--jia);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--ink);background:#faf7f0;border-radius:0 10px 10px 0;font-family:var(--serif);font-size:15px;line-height:1.7}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.trans{font-size:13px;margin-top:6px;line-height:1.6}
.pending{color:var(--dai);font-size:13px;background:#fdf0ec;border-radius:10px;padding:8px 12px}
.split{display:flex;align-items:stretch;gap:8px;margin:4px 0 8px}
.split .big{font-family:var(--serif);font-size:52px;line-height:1;width:72px;display:grid;place-items:center;background:var(--soft);border-radius:14px}
.split .eq{display:grid;place-items:center;color:var(--ink2);font-size:18px}
.part{flex:1;border-radius:14px;padding:8px 10px;border:1.5px solid}
.part b{font-family:var(--serif);font-size:26px;display:block;line-height:1.2}
.part small{font-size:11px;font-weight:700;display:block;margin-bottom:2px}
.part p{margin:2px 0 0;font-size:12px;line-height:1.5;color:var(--ink2)}
.part.sem{border-color:#9fd3c7;background:#effaf7}.part.sem small{color:var(--yin)}
.part.pho{border-color:#b9c9e6;background:#f1f5fc}.part.pho small{color:var(--jia)}
.kind{font-size:12px;color:var(--ink2);line-height:1.6}
.warn{display:flex;gap:10px;margin-bottom:8px;font-size:13px;line-height:1.6}
.warn i{flex:none;font-style:normal;width:46px;text-align:center;font-size:11px;font-weight:700;border-radius:8px;padding:3px 0;height:fit-content}
.warn .r{background:#fdeee9;color:var(--dai)}.warn .w{background:#eef3fb;color:var(--jia)}
ul.code{margin:0;padding-left:0;list-style:none}
ul.code li{font-size:13px;line-height:1.6;padding:7px 10px 7px 30px;position:relative;background:#fbf8f1;border-radius:10px;margin-bottom:6px}
ul.code li::before{content:"🔑";position:absolute;left:8px;top:7px;font-size:12px}
.sure-legend{font-size:11px;color:var(--ink2);margin-top:10px;line-height:1.7}
.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){.app{grid-template-columns:150px 1fr 320px}.origin-card{width:250px}}
</style>
</head>

 + '<span style="margin-left:6px">把握：</span>' + Object.entries(D.sure).map(([k,v])=>'<span><i style="background:'+v+';width:10px;height:10px;border-radius:50%"></i>'+k+'</span>').join('');

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function wrap(s,n){const out=[];for(let i=0;i<s.length;i+=n)out.push(s.slice(i,i+n));return out;}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

/* 布局 */
function layout(senses){
  const pos={}, kids={};
  senses.forEach(s=>{ if(s.from){(kids[s.from]=kids[s.from]||[]).push(s);} });
  const root = senses.find(s=>!s.from);
  pos[root.id]={x:0,y:0,depth:0,ang:0};
  const R=[0,350,620,860];
  const first = kids[root.id]||[];
  first.forEach((s,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/first.length + (first.length===2?Math.PI/2:0);
    place(s,a,1);
  });
  function place(s,a,d){
    pos[s.id]={x:Math.cos(a)*R[d],y:Math.sin(a)*R[d],depth:d,ang:a};
    const ks=kids[s.id]||[];
    ks.forEach((k,i)=>{ place(k, a + (i-(ks.length-1)/2)*0.42, d+1); });
  }
  return {pos,root};
}

/* 绘制 */
function drawMap(){
  const c = D.chars[cur], vp=$('#vp'); vp.innerHTML='';
  const {pos,root} = layout(c.senses);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  const byId={}; c.senses.forEach(s=>byId[s.id]=s);
  c.senses.forEach(s=>{
    if(!s.from) return;
    const a=pos[s.from], b=pos[s.id], col=D.types[s.type]||'#999';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const nx=-(b.y-a.y), ny=(b.x-a.x), L=Math.hypot(nx,ny)||1;
    const cx=mx+nx/L*30, cy=my+ny/L*30;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':3,'stroke-linecap':'round','stroke-dasharray':s.type==='假借'?'8 7':'none',opacity:.85},gE);
    // 连线标签
    const lx=(a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    const lines=wrap(s.why,12), w=12*12.5+20, h=26+lines.length*16+6;
    const g=el('g',{transform:`translate(${lx-w/2},${ly-h/2})`,class:'node'},gL);
    el('rect',{width:w,height:h,rx:12,fill:'#fffdf8',stroke:col,'stroke-width':1.5,filter:'url(#sh)'},g);
    el('rect',{x:10,y:7,width:44,height:18,rx:9,fill:col},g);
    const t0=el('text',{x:32,y:20,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff'},g); t0.textContent=s.type;
    lines.forEach((ln,i)=>{const t=el('text',{x:10,y:42+i*16,'font-size':12,fill:'#4a4238'},g);t.textContent=ln;});
    g.addEventListener('click',e=>{if(!moved){sel=s.id;refresh();}});
  });
  c.senses.forEach(s=>{
    const p=pos[s.id];
    if(!s.from){
      const g=el('g',{class:'node',transform:`translate(${p.x},${p.y})`},gN);
      el('circle',{r:96,fill:'url(#rootg)',stroke:sel===s.id?'#c8553d':'#e2b866','stroke-width':sel===s.id?5:3,filter:'url(#sh)'},g);
      el('circle',{r:86,fill:'none',stroke:'#e9cf9a','stroke-dasharray':'3 5'},g);
      const t1=el('text',{y:-32,'text-anchor':'middle','font-size':12,fill:'#8a6d3b','font-weight':700,'letter-spacing':2},g);t1.textContent='本 义';
      const t2=el('text',{y:20,'text-anchor':'middle','font-size':60,'font-family':'var(--serif)','font-weight':700,fill:'#2f2a24'},g);t2.textContent=c.char;
      const lab=c.origin.m.length>9?c.origin.m.slice(0,9)+'…':c.origin.m;
      const t3=el('text',{y:48,'text-anchor':'middle','font-size':12.5,fill:'#5a4a33'},g);t3.textContent=lab;
      const sc=D.sure[s.sure];
      el('circle',{cx:66,cy:-66,r:9,fill:sc,stroke:'#fff','stroke-width':2},g);
      g.addEventListener('click',()=>{if(!moved){sel=s.id;refresh();}});
      return;
    }
    const col=D.types[s.type], lab=s.label, w=Math.max(150,lab.length*15+40), h=62;
    const g=el('g',{class:'node',transform:`translate(${p.x-w/2},${p.y-h/2})`},gN);
    el('rect',{width:w,height:h,rx:16,fill:'#fff',stroke:sel===s.id?'#2f2a24':col,'stroke-width':sel===s.id?3.5:2,filter:'url(#sh)'},g);
    el('rect',{width:8,height:h-20,x:0,y:10,rx:4,fill:col},g);
    const t=el('text',{x:w/2+3,y:27,'text-anchor':'middle','font-size':15,'font-weight':700,fill:'#2f2a24','font-family':'var(--serif)'},g);t.textContent=lab;
    const ws=s.words.filter(x=>x!=='待查').slice(0,3).join(' · ');
    const t2=el('text',{x:w/2+3,y:47,'text-anchor':'middle','font-size':11.5,fill:'#8a7f70'},g);t2.textContent=ws.length>16?ws.slice(0,16)+'…':ws;
    el('circle',{cx:w-10,cy:10,r:6,fill:D.sure[s.sure],stroke:'#fff','stroke-width':2},g);
    g.addEventListener('click',()=>{if(!moved){sel=s.id;refresh();}});
  });
  mapBox = {pos};
}
let mapBox=null;

/* 视图 */
const svg=$('#map');
function apply(){$('#vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function fit(){
  const r=svg.getBoundingClientRect(); const ps=Object.values(mapBox.pos);
  let x0=Math.min(...ps.map(p=>p.x))-130,x1=Math.max(...ps.map(p=>p.x))+130,y0=Math.min(...ps.map(p=>p.y))-110,y1=Math.max(...ps.map(p=>p.y))+110;
  const padL = r.width>900?320:40;
  const W=r.width-padL-30, H=r.height-90;
  const k=Math.min(1.15,Math.max(.3,Math.min(W/(x1-x0),H/(y1-y0))));
  view.k=k; view.x=padL+W/2-(x0+x1)/2*k; view.y=20+H/2-(y0+y1)/2*k; apply();
}
function zoomAt(f,cx,cy){const nk=Math.min(3,Math.max(.25,view.k*f));f=nk/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=nk;apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null, moved=false;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false;});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){moved=true;svg.classList.add('drag');}if(moved){view.x=drag.vx+dx;view.y=drag.vy+dy;apply();}});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');setTimeout(()=>moved=false,0);});
$('#zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$('#zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$('#zfit').onclick=fit;
window.addEventListener('resize',fit);

/* 本义档案 */
function drawOrigin(){
  const c=D.chars[cur], sw=c.shuowen;
  const o=$('#origin'); o.className='origin-card'+(originMin?' min':'');
  o.innerHTML=`<div class="hd"><span>📜 本义档案 · ${c.char}</span><button id="omin">${originMin?'展开':'收起'}</button></div>
  <div class="bd">
    <div class="lbl">《说文解字》原文 <span class="badge" style="color:${D.sure[sw.sure]};border-color:${D.sure[sw.sure]};font-size:10px;padding:0 6px">${sw.sure}</span></div>
    <div class="sw">${esc(sw.text)}</div>${sw.note?`<div style="font-size:11px;color:#8a7f70;margin:-4px 0 6px">注：${esc(sw.note)}</div>`:''}
    <div class="lbl">字形演变（字形图为占位）</div>
    <div class="evo">${c.evo.map(e=>`<div><b>${e[0]}</b>${esc(e[1])}</div>`).join('')}</div>
    <div class="lbl">本义</div><div style="font-family:var(--serif);font-size:15px;font-weight:700">${esc(c.origin.m)}</div>
    <div class="lbl">为什么这是本义</div><div>${esc(c.origin.why)}</div>
  </div>`;
  $('#omin').onclick=()=>{originMin=!originMin;drawOrigin();};
}

/* 右栏 */
function sureBadge(s){const c=D.sure[s];return `<span class="badge" style="color:${c};border-color:${c}">● ${s}</span>`;}
function drawSide(){
  const c=D.chars[cur], s=c.senses.find(x=>x.id===sel)||c.senses[0];
  const isRoot=!s.from, parent=s.from?c.senses.find(x=>x.id===s.from):null;
  let h=`<div class="card"><h4>义项详情</h4>
   <div>${isRoot?'<span class="chip" style="background:#c8553d">本义</span>':`<span class="chip" style="background:${D.types[s.type]}">${s.type}</span>`}${sureBadge(s.sure)}</div>
   <div class="sense-title">${c.char}：${esc(s.label)}</div>
   ${isRoot?`<div class="why">📌 ${esc(c.origin.why)}</div>`:`<div class="why">🔗 由「${esc(parent.label)}」${s.type}而来：${esc(s.why)}</div>`}
   <div class="sec"><div class="t">词族（3个）</div><div class="words">${s.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
   <div class="sec"><div class="t">构词拆解</div><div class="build">${esc(s.build)}</div></div>
   <div class="sec"><div class="t">现代例句</div><div class="ex"><em>示例</em>${esc(s.modern)}</div></div>
   <div class="sec"><div class="t">文言原句</div>${s.classic?`<blockquote>${esc(s.classic.text)}</blockquote><div class="src">—— ${esc(s.classic.src)}</div><div class="trans"><b>译文：</b>${esc(s.classic.trans)}</div>`:`<div class="pending">待查：暂未找到可靠的文言原句，宁缺勿编。</div>`}</div>
   <div class="sec"><div class="t">把握程度</div>${sureBadge(s.sure)}
   <div class="sure-legend">确定＝字书与古书用例可互证；通行说法＝多数工具书采用，但细节有分歧；待查＝来源未核实。</div></div>
  </div>`;
  const p=c.parts;
  const partsHtml=[...p.sem.map(x=>`<div class="part sem"><small>表义部分</small><b>${x[0]}</b><p>${esc(x[1])}</p></div>`),...p.pho.map(x=>`<div class="part pho"><small>表音部分</small><b>${x[0]}</b><p>${esc(x[1])}</p></div>`)].join('<div class="eq">＋</div>');
  h+=`<div class="card"><h4>偏旁拆分</h4>
    <div class="split"><div class="big">${c.char}</div><div class="eq">＝</div>${partsHtml||'<div class="part sem" style="display:grid;place-items:center"><p>独体字，不能再拆</p></div>'}</div>
    <div class="kind">结构：${esc(p.kind)}${p.note?'。'+esc(p.note):''}</div></div>`;
  h+=`<div class="card"><h4>易错提醒</h4>
    <div class="warn"><i class="r">易读错</i><div>${esc(c.misread)}</div></div>
    <div class="warn"><i class="w">易写错</i><div>${esc(c.miswrite)}</div></div></div>`;
  h+=`<div class="card"><h4>相关汉字密码</h4><ul class="code">${c.codes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  $('#side').innerHTML=h; $('#side').scrollTop=0;
}

function refresh(){drawMap();drawSide();}
function go(i){
  cur=i; sel='s0';
  [...list.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  drawMap(); drawOrigin(); drawSide(); fit();
  list.children[i].scrollIntoView({block:'nearest'});
}
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();go((cur+1)%D.chars.length);}
  if(e.key==='ArrowUp'){e.preventDefault();go((cur-1+D.chars.length)%D.chars.length);}
});
go(0);
})();
</script>
