<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字义扩展图（第15组·20字）· 汉字学堂</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f6f1ff;--ink:#2a2547;--sub:#6e678f;--line:#e6defa;--yin:#4f8cff;--bi:#ff7a59;--zhuan:#22b07d;--jia:#b05cff}
html{font-size:clamp(15px,1vw + 10px,19px)}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:radial-gradient(circle at 10% 0%,#fff3e6 0,transparent 40%),radial-gradient(circle at 100% 20%,#e7f0ff 0,transparent 40%),var(--bg);color:var(--ink);min-height:100vh}
.kai{font-family:"KaiTi","STKaiti","楷体","Kaiti SC",serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem .2rem;max-width:1440px;margin:0 auto}
.logo{width:2.4rem;height:2.4rem;border-radius:.8rem;background:linear-gradient(135deg,#ff9a62,#b05cff);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:900}
.brand h1{font-size:1.25rem}.brand small{color:var(--sub);font-weight:400;font-size:.85rem;margin-left:.4rem}
nav.topnav{display:flex;gap:.4rem;overflow-x:auto;padding:.4rem 1rem .6rem;max-width:1440px;margin:0 auto;scrollbar-width:none}
nav.topnav::-webkit-scrollbar{display:none}
.tn{flex:none;border:none;background:#f1ecff;color:var(--ink);border-radius:1.2rem;padding:.55rem 1rem;font-size:1rem;cursor:pointer;white-space:nowrap;font-weight:700}
.tn.on{background:linear-gradient(135deg,#ff8a5c,#b05cff);color:#fff;box-shadow:0 .25rem .8rem rgba(176,92,255,.35)}
.tn .soon{font-size:.7rem;opacity:.6;margin-left:.2rem}
.wrap{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:9.6rem minmax(0,1fr) 19rem;gap:1rem;padding:1rem}
.box{background:#fff;border-radius:1.4rem;box-shadow:0 .4rem 1.4rem rgba(80,60,160,.08)}
/* 左侧字表 */
.charnav{position:sticky;top:7.2rem;align-self:start;padding:.6rem;display:grid;grid-template-columns:1fr 1fr;gap:.4rem;max-height:calc(100vh - 8rem);overflow:auto}
.charnav .lab{grid-column:1/-1;font-size:.8rem;color:var(--sub);text-align:center;font-weight:800;margin:.2rem 0}
.cb{border:2px solid transparent;background:#faf8ff;border-radius:1rem;padding:.35rem .2rem;cursor:pointer;color:var(--ink);text-align:center}
.cb b{display:block;font-size:1.7rem;line-height:1.15}
.cb span{font-size:.8rem;color:var(--sub)}
.cb:hover{border-color:var(--line)}
.cb.on{background:linear-gradient(135deg,#ff8a5c,#b05cff);color:#fff}
.cb.on span{color:#fff}
/* 主区 */
.hero{border-radius:1.6rem;padding:1rem 1.3rem;color:#fff;background:linear-gradient(135deg,#5aa8ff,#7b6cff);display:flex;align-items:center;gap:1rem;margin-bottom:.9rem}
.hero .big{font-size:4rem;line-height:1;background:rgba(255,255,255,.2);border-radius:1.2rem;width:5.4rem;height:5.4rem;display:grid;place-items:center}
.hero h2{font-size:1.5rem}.hero p{opacity:.95;font-size:.95rem;margin-top:.2rem}
.mapbox{position:relative;overflow:hidden}
#map{width:100%;height:min(72vh,640px);display:block;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 50%,#fffaf2 0,#fff 60%)}
#map.drag{cursor:grabbing}
.zoom{position:absolute;right:.7rem;top:.7rem;display:flex;flex-direction:column;gap:.35rem}
.zoom button{width:2.6rem;height:2.6rem;border-radius:.9rem;border:none;background:#fff;box-shadow:0 .2rem .6rem rgba(80,60,160,.18);font-size:1.3rem;cursor:pointer;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem .8rem;border-top:1px solid var(--line);font-size:.85rem;align-items:center}
.legend .pill{color:#fff;border-radius:1rem;padding:.12rem .6rem;font-weight:700}
.legend .hint{color:var(--sub);margin-left:auto}
.node{cursor:pointer}
.node.sel rect{stroke-width:4}
/* 详情 */
.detail{margin-top:.9rem;padding:1.1rem 1.2rem}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.dhead h3{font-size:1.5rem}
.badge{border-radius:.7rem;padding:.12rem .55rem;font-size:.85rem;color:#fff;font-weight:700}
.cert{border-radius:.7rem;padding:.12rem .55rem;font-size:.85rem;font-weight:700}
.cert.c1{background:#e3f8ee;color:#138a5e}.cert.c2{background:#fff3cf;color:#8a6100}.cert.c3{background:#ffe3e3;color:#c0392b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem}
.blk{background:#faf8ff;border-radius:1rem;padding:.7rem .85rem}
.blk.full{grid-column:1/-1}
.blk h4{font-size:.85rem;color:var(--sub);margin-bottom:.35rem;letter-spacing:.04em}
.why{font-size:1.05rem;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips span{background:#fff;border:1.5px solid var(--line);border-radius:.8rem;padding:.2rem .65rem;font-size:1.15rem}
.parse{font-size:1.05rem}
.ex{font-size:1.1rem;line-height:1.6}
.tag{display:inline-block;background:#eef1ff;color:#4b5bd6;border-radius:.5rem;padding:0 .4rem;font-size:.75rem;margin-left:.35rem;vertical-align:middle}
.tag.q{background:#ffe0e0;color:#c0392b}
.classic .t{font-size:1.25rem;line-height:1.6}
.classic .s{color:var(--sub);font-size:.9rem;margin:.2rem 0}
.classic .tr{font-size:1rem;line-height:1.6;border-left:3px solid #ffd27a;padding-left:.6rem}
.evo{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.evo div{width:4.6rem;height:5.2rem;border:2px dashed #d8cdf5;border-radius:.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;color:var(--sub);background:#fff;text-align:center;line-height:1.3}
.evo div b{font-size:1.9rem;color:var(--ink);font-weight:400}
.evo i{font-style:normal;color:#b9aee0}
.sw{font-size:1.25rem;line-height:1.6}
/* 右侧栏 */
.side{display:flex;flex-direction:column;gap:.9rem;align-self:start;position:sticky;top:7.2rem}
.side .box{padding:.9rem 1rem}
.side h3{font-size:1.05rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.part{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.part:last-child{border:none}
.role{flex:none;border-radius:.6rem;padding:.1rem .45rem;font-size:.78rem;font-weight:800;color:#fff;margin-top:.15rem}
.role.r1{background:#4f8cff}.role.r2{background:#ff7a59}.role.r3{background:#9aa0b8}
.part b{font-size:1.05rem}.part p{font-size:.85rem;color:var(--sub);line-height:1.45}
.warn li{list-style:none;font-size:.95rem;line-height:1.5;padding:.25rem 0 .25rem 1.4rem;position:relative}
.warn li::before{position:absolute;left:0}
.warn .rd li::before{content:"🔊"}.warn .wr li::before{content:"✏️"}
.warn h4{font-size:.85rem;color:var(--sub);margin:.3rem 0 .1rem}
.rule{display:block;background:#f4efff;border-radius:.8rem;padding:.45rem .7rem;margin-bottom:.4rem;font-size:.95rem;color:var(--ink);text-decoration:none}
.rule::before{content:"🔐 "}
.soonbox{padding:3rem 1.5rem;text-align:center;grid-column:1/-1}
.soonbox .em{font-size:4rem}.soonbox h2{margin:.6rem 0}
.soonbox button{margin-top:1rem;border:none;background:linear-gradient(135deg,#ff8a5c,#b05cff);color:#fff;border-radius:1.2rem;padding:.8rem 1.4rem;font-size:1.05rem;cursor:pointer;font-weight:700}
@media(max-width:1180px){.wrap{grid-template-columns:9.2rem minmax(0,1fr)}.side{grid-column:1/-1;position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}}
@media(max-width:760px){
 .wrap{grid-template-columns:1fr;padding:.6rem}
 .charnav{position:static;display:flex;flex-direction:row;overflow-x:auto;max-height:none}
 .charnav .lab{display:none}
 .cb{flex:none;width:4.2rem}
 .grid2{grid-template-columns:1fr}
 #map{height:62vh}
 .hero .big{font-size:3rem;width:4.2rem;height:4.2rem}
}
</style>
</head>

 <div class="brand"><div class="logo kai">字</div><h1>汉字学堂<small>8–14岁 · 汉字的秘密</small></h1></div>
 <nav class="topnav" id="topnav"></nav>
</header>
<div class="wrap" id="wrap"></div>

 = 假（放假）+ 期（时间）", "example": {"text": "暑假期间我去了海边。", "tag": "示例"}, "classic": null, "cert": "确定"}, {"id": "2", "gloss": "期限", "parent": "1", "rel": "引申", "reason": "规定好到哪天为止的时间。", "family": ["期限", "过期", "到期"], "parse": "过期 = 过（超过）+ 期（期限）", "example": {"text": "这瓶牛奶过期了。", "tag": "示例"}, "classic": null, "cert": "确定"}, {"id": "3", "gloss": "一期（量词）", "parent": "1", "rel": "引申", "reason": "按时间分成的一段一段。", "family": ["第一期", "学期", "期刊"], "parse": "学期 = 学 + 期（一段时间）", "example": {"text": "新学期开始了。", "tag": "示例"}, "classic": null, "cert": "确定"}, {"id": "4", "gloss": "盼望、希望", "parent": "0", "rel": "引申", "reason": "约好了，就会盼着那一天到来。", "family": ["期待", "期望", "期盼"], "parse": "期待 = 期（盼望）+ 待（等）", "example": {"text": "我期待着运动会。", "tag": "示例"}, "classic": null, "cert": "通行说法"}]}]</script>
<script>
const DATA=JSON.parse(document.getElementById("zi-data").textContent);
const TOP=["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const REL={"引申":"#4f8cff","比喻":"#ff7a59","转喻":"#22b07d","假借":"#b05cff"};
const CERT={"确定":"c1","通行说法":"c2","待查":"c3"};
let top_=0,cur=0,sel="0";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderTop(){$("topnav").innerHTML=TOP.map((t,i)=>`<button class="tn ${i===top_?"on":""}" onclick="pickTop(${i})">${t}${i===0?"":'<span class="soon">· 待开放</span>'}</button>`).join("")}
function pickTop(i){top_=i;renderTop();renderAll()}
function pickChar(i){cur=i;sel="0";resetView();renderAll();window.scrollTo({top:0,behavior:"smooth"})}

/* ---------- 布局 ---------- */
const W=900,CX=450,R1=235,R2=375,FS=18,NH=44;
const nodeW=t=>Math.max(t.length*FS+30,80);
function layout(d){
 const pos={},kids=p=>d.senses.filter(s=>s.parent===p);
 pos["0"]={x:CX,y:CX};
 const l1=kids("0");
 l1.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/l1.length;pos[s.id]={x:CX+R1*Math.cos(a),y:CX+R1*Math.sin(a)};
  const k2=kids(s.id);k2.forEach((t,j)=>{const b=a+(j-(k2.length-1)/2)*0.5;pos[t.id]={x:CX+R2*Math.cos(b),y:CX+R2*Math.sin(b)}})});
 return pos;
}
function wrapText(s,n){const out=[];for(let i=0;i<s.length;i+=n)out.push(s.slice(i,i+n));return out}

function drawMap(){
 const d=DATA[cur],pos=layout(d);let E="",L="",N="",R="";
 const ex=(ux,uy,hw,hh)=>Math.min(hw/Math.max(Math.abs(ux),1e-6),hh/Math.max(Math.abs(uy),1e-6));
 d.senses.forEach(s=>{if(!s.parent)return;const p=pos[s.parent],q=pos[s.id],col=REL[s.rel];
  const on=sel===s.id;
  E+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${col}" stroke-width="${on?6:3.5}" stroke-linecap="round" opacity="${on?1:.75}" ${s.rel==="假借"?'stroke-dasharray="8 7"':""}/>`;
  const L0=Math.hypot(q.x-p.x,q.y-p.y),ux=(q.x-p.x)/L0,uy=(q.y-p.y)/L0;
  const pd=s.parent==="0"?78:ex(ux,uy,nodeW(d.senses.find(z=>z.id===s.parent).gloss)/2,NH/2);
  const qd=L0-ex(ux,uy,nodeW(s.gloss)/2,NH/2),md=(pd+qd)/2,mx=p.x+ux*md,my=p.y+uy*md;
  L+=`<g onclick="choose('${s.id}')" style="cursor:pointer"><title>${esc(s.rel+"："+s.reason)}</title><rect x="${mx-24}" y="${my-13}" width="48" height="26" rx="13" fill="${col}" stroke="#fff" stroke-width="2"/><text x="${mx}" y="${my+5}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${s.rel}</text></g>`;
  if(on){const lines=wrapText(s.reason,13),bw=13*15+20,bh=lines.length*20+14;let bx=mx-bw/2,by=my+18;
   R+=`<g pointer-events="none"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="10" fill="#2a2547" opacity=".92"/>${lines.map((t,i)=>`<text x="${bx+10}" y="${by+24+i*20}" font-size="15" fill="#fff">${esc(t)}</text>`).join("")}</g>`}
 });
 d.senses.forEach(s=>{const q=pos[s.id];
  if(s.id==="0"){N+=`<g class="node ${sel==="0"?"sel":""}" onclick="choose('0')"><circle cx="${q.x}" cy="${q.y}" r="${sel==="0"?80:76}" fill="#fff1d6" stroke="#ff9f43" stroke-width="${sel==="0"?6:4}"/>
   <text x="${q.x}" y="${q.y+14}" text-anchor="middle" font-size="76" class="kai" fill="#7a4b12">${d.char}</text>
   <text x="${q.x}" y="${q.y+50}" text-anchor="middle" font-size="15" font-weight="800" fill="#c0392b">本义</text></g>`;return}
  const w=nodeW(s.gloss),x=q.x-w/2,y=q.y-NH/2,col=REL[s.rel];
  N+=`<g class="node ${sel===s.id?"sel":""}" onclick="choose('${s.id}')"><rect x="${x}" y="${y}" width="${w}" height="${NH}" rx="16" fill="${sel===s.id?"#fff8e8":"#fff"}" stroke="${col}" stroke-width="2.5"/>
   <text x="${q.x}" y="${q.y+6}" text-anchor="middle" font-size="${FS}" font-weight="700" fill="#2a2547">${esc(s.gloss)}</text>
   ${s.cert==="待查"?`<circle cx="${x+w-3}" cy="${y+3}" r="9" fill="#e45b5b"/><text x="${x+w-3}" y="${y+7.5}" text-anchor="middle" font-size="12" fill="#fff" font-weight="800">?</text>`:""}</g>`;
 });
 $("svgroot").innerHTML=E+L+N+R;
 applyView();
}
function choose(id){if(moved)return;sel=id;drawMap();renderDetail()}

/* ---------- 缩放与拖动 ---------- */
let vb={x:0,y:0,w:W,h:W},moved=false;
function resetView(){vb={x:0,y:0,w:W,h:W}}
function applyView(){const s=$("map");if(s)s.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function zoomAt(f,cx,cy){const nw=Math.min(Math.max(vb.w*f,250),2000);const k=nw/vb.w;vb.x=cx-(cx-vb.x)*k;vb.y=cy-(cy-vb.y)*k;vb.w=vb.h=nw;applyView()}
function zoomBtn(f){zoomAt(f,vb.x+vb.w/2,vb.y+vb.h/2)}
function toSvg(svg,cx,cy){const r=svg.getBoundingClientRect(),sc=Math.max(vb.w/r.width,vb.h/r.height),ox=(r.width*sc-vb.w)/2,oy=(r.height*sc-vb.h)/2;return{x:vb.x-ox+(cx-r.left)*sc,y:vb.y-oy+(cy-r.top)*sc,sc}}
function bindZoom(){
 const svg=$("map"),pts=new Map();let start=null,pinch=null;
 svg.addEventListener("wheel",e=>{e.preventDefault();const p=toSvg(svg,e.clientX,e.clientY);zoomAt(e.deltaY>0?1.12:1/1.12,p.x,p.y)},{passive:false});
 svg.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(pts.size===1){start={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,sc:toSvg(svg,0,0).sc}}
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w}}});
 svg.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()],dd=Math.hypot(a.x-b.x,a.y-b.y);const c=toSvg(svg,(a.x+b.x)/2,(a.y+b.y)/2);zoomAt((pinch.w*pinch.d/dd)/vb.w,c.x,c.y);moved=true;return}
  if(start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>6){moved=true;svg.classList.add("drag");try{svg.setPointerCapture(e.pointerId)}catch(_){}}
   if(moved){vb.x=start.vx-dx*start.sc;vb.y=start.vy-dy*start.sc;applyView()}}});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0){start=null;svg.classList.remove("drag");setTimeout(()=>moved=false,0)}};
 svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
}

/* ---------- 详情 ---------- */
function certTag(c){return`<span class="cert ${CERT[c]||"c3"}">把握：${c}</span>`}
function renderDetail(){
 const d=DATA[cur],s=d.senses.find(x=>x.id===sel),isRoot=s.id==="0";
 const parent=d.senses.find(x=>x.id===s.parent);
 const py=s.pinyin||d.pinyin;
 let h=`<div class="dhead"><h3><span class="kai">${d.char}</span>（${py}）：${esc(isRoot?d.benyi.gloss:s.gloss)}</h3>
  ${isRoot?'<span class="badge" style="background:#c0392b">本义</span>':`<span class="badge" style="background:${REL[s.rel]}">${s.rel}</span>`}
  ${certTag(isRoot?d.benyi.cert:s.cert)}</div>`;
 h+=`<div class="grid2">`;
 if(isRoot){
  h+=`<div class="blk full"><h4>📜 《说文解字》原文</h4><div class="sw kai">${esc(d.shuowen.text)}<span class="tag">请老师核对</span></div></div>
  <div class="blk"><h4>🔍 本义判定理由</h4><div class="why">${esc(d.benyi.reason)}</div></div>
  <div class="blk"><h4>🧬 字形演变</h4><div class="evo"><div>甲骨文<br>字形待补</div><i>→</i><div>金文<br>字形待补</div><i>→</i><div>小篆<br>字形待补</div><i>→</i><div>楷书<b class="kai">${d.char}</b></div></div></div>`;
 }else{
  h+=`<div class="blk full"><h4>🤔 为什么这样变？${parent?`（从“${esc(parent.id==="0"?d.benyi.gloss:parent.gloss)}”变来）`:""}</h4><div class="why">${esc(s.reason)}</div></div>`;
 }
 h+=`<div class="blk"><h4>👪 词族</h4>${s.family.length?`<div class="chips kai">${s.family.map(w=>`<span>${esc(w)}</span>`).join("")}</div>`:`<div class="why" style="font-size:.95rem;color:var(--sub)">${esc(s.parse)}</div>`}</div>
  <div class="blk"><h4>🧩 构词拆解</h4><div class="parse">${s.family.length?esc(s.parse):"—"}</div></div>
  <div class="blk"><h4>💬 现代例句</h4><div class="ex">${esc(s.example.text)}<span class="tag">${s.example.tag}</span></div></div>
  <div class="blk classic"><h4>🏮 文言原句</h4>${s.classic?`<div class="t kai">${esc(s.classic.text)}</div><div class="s">—— ${esc(s.classic.source)}<span class="tag">出处请核对</span></div><div class="tr">译：${esc(s.classic.trans)}</div>`:`<div class="why" style="color:var(--sub)">待查<span class="tag q">待查</span></div>`}</div>
 </div>`;
 $("detail").innerHTML=h;
}
function renderSide(){
 const d=DATA[cur],rc={"表义":"r1","表音":"r2"};
 $("side").innerHTML=`
 <div class="box"><h3>🧱 偏旁拆分 <span style="font-size:.8rem;color:var(--sub);font-weight:400">${esc(d.structure)}</span></h3>
  ${d.parts.map(p=>`<div class="part"><span class="role ${rc[p.role]||"r3"}">${p.role}</span><div><b class="kai">${esc(p.part)}</b><p>${esc(p.note)}</p></div></div>`).join("")}</div>
 <div class="box warn"><h3>⚠️ 易读错 · 易写错</h3><h4>读音</h4><ul class="rd">${d.pitfalls.read.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
  <h4>书写</h4><ul class="wr">${d.pitfalls.write.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
 <div class="box"><h3>🔐 相关汉字密码</h3>${d.rules.map(r=>`<a class="rule" href="javascript:void(0)" onclick="pickTop(4)">${esc(r)}</a>`).join("")}</div>`;
}

function renderAll(){
 const w=$("wrap");
 if(top_!==0){w.style.gridTemplateColumns="1fr";w.innerHTML=`<div class="box soonbox"><div class="em">🚧</div><h2>「${TOP[top_]}」在另一个页面</h2><p style="color:var(--sub)">本页只实现「字义扩展图」。</p><button onclick="pickTop(0)">回到字义扩展图 →</button></div>`;return}
 w.style.gridTemplateColumns="";
 const d=DATA[cur],rels=[...new Set(d.senses.filter(s=>s.rel).map(s=>s.rel))];
 w.innerHTML=`<nav class="box charnav"><div class="lab">选一个字 · 共${DATA.length}个</div>${DATA.map((x,i)=>`<button class="cb ${i===cur?"on":""}" onclick="pickChar(${i})"><b class="kai">${x.char}</b><span>${x.pinyin}</span></button>`).join("")}</nav>
 <main>
  <div class="hero"><div class="big kai">${d.char}</div><div><h2>${d.char} · ${d.pinyin}</h2><p>本义：${esc(d.benyi.gloss)}　·　共 ${d.senses.length-1} 个扩展义项　·　点圆框看详情，拖动或双指缩放</p></div></div>
  <div class="box mapbox"><svg id="map" viewBox="0 0 ${W} ${W}" preserveAspectRatio="xMidYMid meet"><g id="svgroot"></g></svg>
   <div class="zoom"><button onclick="zoomBtn(1/1.25)" aria-label="放大">＋</button><button onclick="zoomBtn(1.25)" aria-label="缩小">－</button><button onclick="resetView();applyView()" aria-label="复位">⟲</button></div>
   <div class="legend">${Object.entries(REL).map(([k,c])=>`<span class="pill" style="background:${c}">${k}</span>`).join("")}<span class="pill" style="background:#e45b5b">? 待查</span><span class="hint">点连线上的标签也能看原因</span></div></div>
  <div class="box detail" id="detail"></div>
 </main>
 <aside class="side" id="side"></aside>`;
 bindZoom();drawMap();renderDetail();renderSide();
}
renderTop();renderAll();
</script>
<script src="../xzq-back.js" data-home="../index.html"></script>
</body>
</html>
