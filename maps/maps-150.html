<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#f7f2e8; --paper:#fffdf8; --ink:#2b2622; --ink2:#6b625a; --line:#e6dccb;
  --accent:#c2412d; --accent-soft:#f6e1da;
  --yin:#2f6fb3; --bi:#d9822b; --zhuan:#3f8f5a; --jia:#8a5bb8;
  --sure:#3f8f5a; --common:#2f6fb3; --tbd:#b5862a;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --r:14px; --shadow:0 2px 10px rgba(80,60,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .seal{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:20px}
nav.top{display:flex;gap:4px;flex-wrap:wrap}
nav.top button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font:inherit;color:var(--ink2);cursor:pointer;position:relative}
nav.top button:hover{background:#f1e9db;color:var(--ink)}
nav.top button.active{background:var(--accent);color:#fff;font-weight:600}
nav.top button .soon{font-size:10px;margin-left:3px;opacity:.6}
/* main */
main{display:grid;grid-template-columns:92px 1fr 390px;min-height:0}
aside.chars{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
aside.chars .ttl{font-size:11px;color:var(--ink2);text-align:center;margin:2px 0 8px;letter-spacing:2px}
.charbtn{display:flex;flex-direction:column;align-items:center;width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:6px 0 5px;margin-bottom:4px;cursor:pointer;font:inherit;color:var(--ink)}
.charbtn .c{font-family:var(--serif);font-size:26px;line-height:1.1}
.charbtn .p{font-size:11px;color:var(--ink2)}
.charbtn:hover{background:#f6efe2}
.charbtn.active{background:var(--accent-soft);border-color:#e9b9ab}
.charbtn.active .c{color:var(--accent)}
/* map */
section.map{position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#e8decb 1px,transparent 1.3px) 0 0/22px 22px, var(--bg)}
#svg{width:100%;height:100%;cursor:grab;display:block;user-select:none}
#svg.drag{cursor:grabbing}
.maphead{position:absolute;left:18px;top:14px;display:flex;align-items:baseline;gap:12px;pointer-events:none}
.maphead .big{font-family:var(--serif);font-size:40px;color:var(--accent)}
.maphead .meta{color:var(--ink2);font-size:13px}
.zoom{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:17px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.zoom button:hover{background:#f3ebdd}
.legend{position:absolute;left:18px;bottom:14px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.hint{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--ink2)}
/* svg styles */
.edge{fill:none;stroke-width:2.4}
.node{cursor:pointer}
.node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.5;filter:drop-shadow(0 2px 4px rgba(80,60,30,.10))}
.node:hover rect{stroke:#c9b79a}
.node.sel rect{stroke:var(--accent);stroke-width:2.5}
.node .nm{font-size:15px;font-weight:600;fill:var(--ink)}
.node .sub{font-size:11px;fill:var(--ink2)}
.center circle.o{fill:var(--accent)}
.center circle.ring{fill:none;stroke:var(--accent);stroke-opacity:.25;stroke-width:10}
.center.sel circle.ring{stroke-opacity:.5}
.center text{fill:#fff}
.elab rect{stroke-width:1.2}
.elab .t{font-size:11px;font-weight:700}
.elab .w{font-size:11px;fill:var(--ink2)}
/* right panel */
aside.side{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:14px;background:#fff}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.kv{margin:8px 0}
.kv .k{font-size:12px;color:var(--ink2);margin-bottom:3px}
.sw{font-family:var(--serif);font-size:15px;background:#fbf6ec;border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;line-height:1.7}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo div{border:1px dashed #d8c9ae;border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;color:var(--ink2);background:#fdfaf3}
.evo b{display:block;font-family:var(--serif);font-size:20px;color:#b9a888;font-weight:400;margin-bottom:2px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;vertical-align:middle}
.t-yin{background:#e3edf8;color:var(--yin)} .t-bi{background:#fbeedd;color:#b0661c}
.t-zhuan{background:#e2f1e7;color:var(--zhuan)} .t-jia{background:#efe6f7;color:var(--jia)}
.c-确定{background:#e2f1e7;color:var(--sure)} .c-通行说法{background:#e3edf8;color:var(--common)} .c-待查{background:#f8eed6;color:#94691a}
.c-示例{background:#f1ebe0;color:#7a6c5c}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:#fdfaf3;font-family:var(--serif);font-size:14px}
.gw{font-family:var(--serif);font-size:15px;line-height:1.7}
.tr{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.6}
.muted{color:var(--ink2);font-size:13px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.title-row .nm{font-size:18px;font-weight:700;font-family:var(--serif)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split .box{border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.5}
.split .yi{background:#fdf0ea;border:1px solid #f0cfc3}
.split .yinb{background:#eaf2fb;border:1px solid #c9dcf1}
.split .lb{font-size:11px;font-weight:700;margin-bottom:3px}
.split .yi .lb{color:var(--accent)} .split .yinb .lb{color:var(--yin)}
.err{display:flex;gap:8px;margin:6px 0;font-size:13px;line-height:1.55}
.err .ic{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.reason{background:#fbf6ec;border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.55}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:.92}
@media (max-width:1100px){main{grid-template-columns:76px 1fr 330px}}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="seal">字</div>汉字学习</div>
  <nav class="top" id="topnav"></nav>

<main>
  <aside class="chars"><div class="ttl">本组 20 字</div><div id="charlist"></div></aside>

      <span><i style="background:var(--bi)"></i>比喻</span>
      <span><i style="background:var(--zhuan)"></i>转喻</span>
      <span><i style="background:var(--jia);background-image:repeating-linear-gradient(90deg,var(--jia) 0 5px,transparent 5px 8px)"></i>假借</span>
    </div>
    <div class="hint">滚轮缩放 · 拖动平移 · 点击义项看详情</div>
  </section>
  <aside class="side" id="side"></aside>
</main>
</div>

const TYPE = {'引申':{c:'var(--yin)',hex:'#2f6fb3',bg:'#e3edf8',cls:'t-yin'},'比喻':{c:'var(--bi)',hex:'#d9822b',bg:'#fbeedd',cls:'t-bi'},'转喻':{c:'var(--zhuan)',hex:'#3f8f5a',bg:'#e2f1e7',cls:'t-zhuan'},'假借':{c:'var(--jia)',hex:'#8a5bb8',bg:'#efe6f7',cls:'t-jia'}};
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let cur=0, sel='o';

// top nav
const tn=$('topnav');
MENUS.forEach((m,i)=>{const b=document.createElement('button');b.innerHTML=esc(m)+(i?'<span class="soon">·待开放</span>':'');if(!i)b.className='active';b.onclick=()=>{if(i)toast('「'+m+'」模块即将开放，当前仅提供字义扩展图');};tn.appendChild(b);});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);}

// char list
const cl=$('charlist');
DATA.forEach((d,i)=>{const b=document.createElement('button');b.className='charbtn';b.innerHTML='<span class="c">'+esc(d.char)+'</span><span class="p">'+esc(d.py.split(' · ')[0])+'</span>';b.onclick=()=>{cur=i;sel='o';render();};cl.appendChild(b);});

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function tw(s,size){let w=0;for(const ch of s)w+=(/[\x00-\xff]/.test(ch)?0.58:1)*size;return w;}
function wrap(s,n){const out=[];let line='',len=0;for(const ch of s){const l=/[\x00-\xff]/.test(ch)?.55:1;if(len+l>n){out.push(line);line='';len=0;}line+=ch;len+=l;}if(line)out.push(line);return out;}

// view transform
let view={x:0,y:0,k:1};
const svg=$('svg'), vp=$('vp');
function apply(){vp.setAttribute('transform','translate('+view.x+','+view.y+') scale('+view.k+')');}
function fit(){const r=svg.getBoundingClientRect();const k=Math.min(r.width/1180,r.height/1000);view={k:Math.max(.35,Math.min(1.2,k)),x:r.width/2,y:r.height/2+10};apply();}
function zoomAt(f,cx,cy){const r=svg.getBoundingClientRect();if(cx==null){cx=r.width/2;cy=r.height/2;}const nk=Math.max(.25,Math.min(3,view.k*f));view.x=cx-(cx-view.x)*nk/view.k;view.y=cy-(cy-view.y)*nk/view.k;view.k=nk;apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;apply();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('zin').onclick=()=>zoomAt(1.2);$('zout').onclick=()=>zoomAt(1/1.2);$('zfit').onclick=fit;
window.addEventListener('resize',fit);

function layout(d){
  const pos={o:{x:0,y:0}};
  const top=d.senses.filter(s=>s.parent==='o');
  const n=top.length, R1=270, R2=480;
  const ang={};
  top.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n+(n===2?Math.PI/2:0)+(n===3?0:0);ang[s.id]=a;pos[s.id]={x:R1*Math.cos(a),y:R1*Math.sin(a)};});
  const kids={};d.senses.filter(s=>s.parent!=='o').forEach(s=>{(kids[s.parent]=kids[s.parent]||[]).push(s);});
  Object.keys(kids).forEach(p=>{const ks=kids[p];ks.forEach((s,j)=>{const a=ang[p]+(j-(ks.length-1)/2)*0.45;ang[s.id]=a;pos[s.id]={x:R2*Math.cos(a),y:R2*Math.sin(a)};});});
  return pos;
}

function drawMap(d){
  vp.innerHTML='';
  const pos=layout(d);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  const size={o:{w:150,h:150}};
  d.senses.forEach(s=>{size[s.id]={w:Math.max(130,tw(s.name,15)+36),h:58};});
  d.senses.forEach(s=>{
    const a=pos[s.parent], b=pos[s.id], t=TYPE[s.type];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
    const cx=mx-dy/L*28, cy=my+dx/L*28;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,class:'edge',stroke:t.hex,'stroke-dasharray':s.type==='假借'?'7 6':'none','stroke-opacity':.85},gE);
    // label
    const lx=(a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    const lines=wrap(s.why,11);
    const w=Math.max(70,Math.max(...lines.map(l=>tw(l,11)))+16), h=22+lines.length*14;
    const g=el('g',{class:'elab',transform:`translate(${lx-w/2},${ly-h/2})`},gL);
    el('rect',{width:w,height:h,rx:9,fill:'#fffdf8',stroke:t.hex,'stroke-opacity':.5},g);
    el('rect',{x:w/2-20,y:4,width:40,height:16,rx:8,fill:t.bg},g);
    const tt=el('text',{x:w/2,y:16,'text-anchor':'middle',class:'t',fill:t.hex},g);tt.textContent=s.type;
    lines.forEach((l,i)=>{const e=el('text',{x:w/2,y:34+i*14,'text-anchor':'middle',class:'w'},g);e.textContent=l;});
  });
  // center
  const c=el('g',{class:'node center'+(sel==='o'?' sel':''),transform:'translate(0,0)'},gN);
  el('circle',{r:84,class:'ring'},c);el('circle',{r:74,class:'o'},c);
  const t1=el('text',{y:-14,'text-anchor':'middle',style:'font-family:var(--serif)','font-size':52},c);t1.textContent=d.char;
  const t2=el('text',{y:22,'text-anchor':'middle','font-size':12,opacity:.85},c);t2.textContent='本义';
  const t3=el('text',{y:42,'text-anchor':'middle','font-size':14,'font-weight':600},c);t3.textContent=d.origin.name.length>9?d.origin.name.slice(0,9)+'…':d.origin.name;
  c.onclick=()=>{sel='o';render(false);};
  d.senses.forEach(s=>{
    const p=pos[s.id], sz=size[s.id], t=TYPE[s.type];
    const g=el('g',{class:'node'+(sel===s.id?' sel':''),transform:`translate(${p.x-sz.w/2},${p.y-sz.h/2})`},gN);
    el('rect',{width:sz.w,height:sz.h,rx:14},g);
    el('rect',{width:5,height:sz.h-20,x:8,y:10,rx:2.5,fill:t.hex},g);
    const n1=el('text',{x:sz.w/2+4,y:26,'text-anchor':'middle',class:'nm'},g);n1.textContent=s.name;
    const n2=el('text',{x:sz.w/2+4,y:44,'text-anchor':'middle',class:'sub'},g);n2.textContent=s.words.slice(0,2).join(' · ')+' · '+s.conf;
    g.onclick=()=>{sel=s.id;render(false);};
  });
}

function confTag(c){return '<span class="tag c-'+esc(c)+'">'+esc(c)+'</span>';}
function gwBlock(gw){
  if(!gw)return '<div class="muted">文言原句：'+confTag('待查')+' 暂未核实到合适的可靠出处，宁缺毋滥。</div>';
  return '<div class="gw">'+esc(gw.t)+'</div><div class="src">—— '+esc(gw.src)+'</div><div class="tr">译文：'+esc(gw.tr)+'</div>';
}
function detail(d){
  const o=d.origin;
  if(sel==='o'){
    const sw=d.sw.indexOf('新附')>=0, none=!o.sw;
    const stages=[['甲骨文','待查'],['金文','待查'],['小篆',none?'未收·待查':(sw?'新附·待查':'见《说文》')],['隶书','占位'],['楷书',d.trad!==d.char?'繁 '+d.trad:'今字']];
    return `<div class="card"><div class="title-row"><span class="nm">本义 · ${esc(o.name)}</span>${confTag(o.conf)}</div>
    <div class="muted">${esc(o.gloss)}</div>
    <div class="kv"><div class="k">《说文》原文 ${confTag(o.swConf)}</div>${none?`<div class="sw" style="color:var(--ink2)">《说文》未收此字</div><div class="src">${esc(o.swNote||'')}</div>`:`<div class="sw">${esc(o.sw)}</div><div class="src">—— ${esc(o.swSrc)}</div>`}</div>
    <div class="kv"><div class="k">字形演变（字形图占位）</div><div class="evo">${stages.map(s=>`<div><b>${esc(s[0]==='楷书'?d.char:'▢')}</b>${esc(s[0])}<br>${esc(s[1])}</div>`).join('')}</div></div>
    <div class="kv"><div class="k">本义判定理由</div><div class="reason">${esc(o.why)}</div></div></div>
    ${senseCard({name:o.name,words:o.words,gc:o.gc,ex:o.ex,gw:o.gw,conf:o.conf},true)}`;
  }
  const s=d.senses.find(x=>x.id===sel);const t=TYPE[s.type];
  const par=s.parent==='o'?'本义「'+o.name+'」':'「'+d.senses.find(x=>x.id===s.parent).name+'」';
  return `<div class="card"><div class="title-row"><span class="nm">${esc(s.name)}</span>${confTag(s.conf)}</div>
  <div class="kv"><div class="k">从哪里来</div><div class="reason">由${esc(par)} <span class="tag ${t.cls}">${esc(s.type)}</span> 而来：${esc(s.why)}。</div></div></div>`+senseCard(s,false);
}
function senseCard(s,isO){
  return `<div class="card"><h3><span class="dot"></span>${isO?'本义用例':'义项用例'}</h3>
  <div class="kv"><div class="k">词族（3个）</div><div class="words">${s.words.map(w=>'<span>'+esc(w)+'</span>').join('')}</div></div>
  <div class="kv"><div class="k">构词拆解</div><div class="reason">${esc(s.gc)}</div></div>
  <div class="kv"><div class="k">现代例句 <span class="tag c-示例">示例</span></div><div class="gw" style="font-size:14px">${esc(s.ex)}</div></div>
  <div class="kv"><div class="k">文言原句</div>${gwBlock(s.gw)}</div>
  <div class="kv"><div class="k">把握程度</div>${confTag(s.conf)} <span class="muted" style="font-size:12px">确定＝辞书与原典一致；通行说法＝主流解释但有分歧；待查＝尚需核对</span></div></div>`;
}
function sidebar(d){
  return `<div class="card"><h3><span class="dot"></span>偏旁拆分 <span class="muted" style="font-weight:400">${esc(d.struct)}</span></h3>
  <div class="split"><div class="box yi"><div class="lb">表义部分</div>${esc(d.parts.yi)}</div><div class="box yinb"><div class="lb">表音部分</div>${esc(d.parts.yin)}</div></div></div>
  <div class="card"><h3><span class="dot"></span>易错提醒</h3>
  <div class="err"><span class="ic" style="background:var(--yin)">读</span><div>${esc(d.misRead)}</div></div>
  <div class="err"><span class="ic" style="background:var(--accent)">写</span><div>${esc(d.misWrite)}</div></div></div>
  <div class="card"><h3><span class="dot"></span>汉字密码 · ${esc(d.code.title)} ${confTag(d.code.conf)}</h3><div style="line-height:1.65;font-size:13px">${esc(d.code.body)}</div></div>`;
}

function render(refit=true){
  const d=DATA[cur];
  document.querySelectorAll('.charbtn').forEach((b,i)=>b.classList.toggle('active',i===cur));
  $('hChar').textContent=d.char;
  $('hMeta').textContent=d.py+' · '+(d.trad!==d.char?'繁体 '+d.trad+' · ':'')+d.senses.length+' 个常用义项';
  drawMap(d);
  if(refit)fit();
  $('side').innerHTML=detail(d)+sidebar(d);
  $('side').scrollTop=0;
}
render();
})();
</script>
<script src="../xzq-back.js" data-home="../index.html"></script>
