<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#f6f1e7;--paper:#fffdf8;--ink:#2b2622;--ink2:#6b6259;--line:#e6dccb;
  --red:#c2452d;--red-soft:#f7e3dc;--gold:#b8892f;
  --yinshen:#2f6fb0;--biyu:#d9822b;--zhuanyu:#7b4fb3;--jiajie:#3f8f7a;
  --ok:#2e8b57;--mid:#c48a12;--chk:#c2452d;
  --shadow:0 6px 24px rgba(80,60,30,.10);
  --kai:"STKaiti","KaiTi","Kaiti SC","楷体","AR PL UKai CN",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;
  background-image:radial-gradient(circle at 20% 10%,rgba(194,69,45,.05),transparent 40%),radial-gradient(circle at 90% 90%,rgba(184,137,47,.07),transparent 40%)}
/* 顶部一级菜单 */
header{height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.05);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.seal{width:38px;height:38px;border-radius:9px;background:var(--red);color:#fff;font-family:var(--kai);font-size:24px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.brand b{font-size:16px;letter-spacing:2px}
.brand small{display:block;font-size:11px;color:var(--ink2);letter-spacing:1px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{border:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink2);padding:9px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:.2s}
nav.top button:hover{background:#f1e9da;color:var(--ink)}
nav.top button.on{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(194,69,45,.3)}
/* 主体三栏 */
main{display:grid;grid-template-columns:200px 1fr 360px;height:calc(100% - 64px)}
aside.left{background:var(--paper);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto}
.sec-title{font-size:12px;color:var(--ink2);letter-spacing:2px;margin:2px 6px 10px}
.charlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.charlist button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;align-items:center}
.charlist button .z{font-family:var(--kai);font-size:30px;line-height:1.1}
.charlist button .p{font-size:11px;color:var(--ink2)}
.charlist button:hover{border-color:var(--gold);transform:translateY(-1px)}
.charlist button.on{background:var(--red-soft);border-color:var(--red);box-shadow:0 3px 10px rgba(194,69,45,.18)}
.charlist button.on .z{color:var(--red)}
/* 画布 */
section.stage{position:relative;overflow:hidden}
.stage-head{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:2}
.title-card{pointer-events:auto;background:rgba(255,253,248,.92);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:16px;padding:10px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.title-card .big{font-family:var(--kai);font-size:46px;color:var(--red);line-height:1}
.title-card .py{font-size:15px;color:var(--ink2)}
.title-card .kind{font-size:12px;background:#f1e9da;border-radius:10px;padding:2px 8px;margin-top:4px;display:inline-block}
.legend{pointer-events:auto;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:12px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:22px;height:4px;border-radius:2px;display:inline-block}
svg#map{width:100%;height:100%;cursor:grab;display:block}
svg#map:active{cursor:grabbing}
.zoombar{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombar button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.zoombar button:hover{border-color:var(--red);color:var(--red)}
.hint{position:absolute;left:20px;bottom:18px;font-size:12px;color:var(--ink2);background:rgba(255,253,248,.85);padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
/* 节点 */
.node{cursor:pointer}
.node rect{transition:.15s}
.node:hover rect{filter:brightness(.97)}
.node.sel rect.box{stroke:var(--red);stroke-width:3}
.edge-why{font-size:11px;fill:#5b534b}
/* 右侧栏 */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(80,60,30,.04)}
.card h3{font-size:14px;letter-spacing:1px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--red)}
.card h4{font-size:12.5px;color:var(--ink2);margin:12px 0 5px;font-weight:600}
.card p,.card li{font-size:13.5px;line-height:1.75}
.sense-title{font-family:var(--kai);font-size:22px;margin-bottom:6px}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:10px;color:#fff;margin-right:6px;vertical-align:middle}
.cert{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid;vertical-align:middle}
.cert.确定{color:var(--ok);border-color:var(--ok);background:#eaf6ef}
.cert.通行说法{color:var(--mid);border-color:var(--mid);background:#fbf3e0}
.cert.待查{color:var(--chk);border-color:var(--chk);background:#fbe9e4}
.fam{display:flex;gap:6px;flex-wrap:wrap}
.fam span{background:#f6efe2;border-radius:9px;padding:3px 10px;font-size:13px}
.quote{border-left:3px solid var(--gold);background:#fbf6ec;padding:8px 10px;border-radius:0 10px 10px 0;font-family:var(--kai);font-size:15.5px;line-height:1.7}
.quote .src{font-family:var(--sans);font-size:12px;color:var(--ink2);margin-top:3px}
.quote .tr{font-family:var(--sans);font-size:13px;color:var(--ink);margin-top:5px}
.tag-sample{font-size:11px;background:#e9eef7;color:var(--yinshen);border-radius:6px;padding:1px 6px;margin-right:4px}
.evo{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.evo div{border:1px dashed #d8c9ae;border-radius:10px;padding:6px 8px;font-size:12px;color:var(--ink2);background:#fffaf0}
.parts{display:flex;gap:8px}
.parts div{flex:1;border-radius:12px;padding:10px;text-align:center}
.parts .sem{background:#e9f1fa}
.parts .phon{background:#fbeee0}
.parts b{display:block;font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:4px}
.parts span{font-size:13.5px}
.err-row{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.err-row em{font-style:normal;font-size:11.5px;color:#fff;background:var(--chk);border-radius:8px;padding:2px 7px;flex-shrink:0;margin-top:3px}
.err-row em.w{background:var(--gold)}
.code{background:linear-gradient(135deg,#2b2622,#4a3b2e);color:#f6ead2;border:0}
.code h3{color:#f6ead2}
.code h3::before{background:var(--gold)}
.code p{color:#f1e4c8}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){main{grid-template-columns:150px 1fr 300px}.charlist{grid-template-columns:1fr 1fr}}
</style>
</head>

</main>

<script>
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const TYPE_COLOR = {"引申":"var(--yinshen)","比喻":"var(--biyu)","转喻":"var(--zhuanyu)","假借":"var(--jiajie)"};
const TYPE_HEX = {"引申":"#2f6fb0","比喻":"#d9822b","转喻":"#7b4fb3","假借":"#3f8f7a"};
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
let cur = 0, selId = "o";
let view = {x:0,y:0,k:1};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs={}, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

/* 一级菜单 */
MENU.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;if(i===0)b.className='on';
  b.onclick=()=>{if(i!==0)toast(`「${m}」模块在本页暂未开放，这里只演示字义扩展图`);};$('#topnav').appendChild(b);});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}

/* 图例 */
$('#legend').innerHTML = Object.keys(TYPE_HEX).map(t=>`<span><i style="background:${TYPE_HEX[t]}"></i>${t}</span>`).join('');

/* 二级菜单 */
DATA.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="z">${d.c}</span><span class="p">${esc(d.py)}</span>`;
  b.onclick=()=>select(i);$('#charlist').appendChild(b);});

function wrap(text, n){const out=[];let s=text;while(s.length>n){out.push(s.slice(0,n));s=s.slice(n);}if(s)out.push(s);return out;}

function layout(d){
  const nodes = {o:{x:0,y:0,lv:0,label:d.o.label}};
  const lv1 = d.s.filter(s=>s.p==='o');
  const R1 = 290, R2 = 520;
  const start = -Math.PI/2 + (lv1.length===2? -Math.PI/2 : 0);
  lv1.forEach((s,i)=>{const a = start + i*2*Math.PI/lv1.length;nodes[s.id]={x:R1*Math.cos(a),y:R1*Math.sin(a),a,lv:1};});
  const kids = {};
  d.s.filter(s=>s.p!=='o').forEach(s=>{(kids[s.p]=kids[s.p]||[]).push(s);});
  for(const pid in kids){const pa = nodes[pid].a; const ks=kids[pid];
    ks.forEach((s,j)=>{const a = pa + (j-(ks.length-1)/2)*0.42; nodes[s.id]={x:R2*Math.cos(a),y:R2*Math.sin(a),a,lv:2};});}
  return nodes;
}

function drawMap(){
  const d = DATA[cur]; const g = $('#viewport'); g.innerHTML='';
  const pos = layout(d);
  const gE = el('g',{},g), gN = el('g',{},g);
  // 连线
  d.s.forEach(s=>{
    const a=pos[s.p], b=pos[s.id], col=TYPE_HEX[s.type]||'#888';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const nx=-(b.y-a.y), ny=(b.x-a.x), len=Math.hypot(nx,ny)||1, bend=26;
    const cx=mx+nx/len*bend, cy=my+ny/len*bend;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':3,'stroke-linecap':'round',opacity:.85,'stroke-dasharray':s.type==='假借'?'8 6':'none'},gE);
    // 标签：类型 + 原因
    const lx=(a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    const lines = wrap(s.why, 13);
    const w = 13*11.5+20, h = 30 + lines.length*15;
    const lg = el('g',{transform:`translate(${lx-w/2},${ly-h/2})`},gE);
    el('rect',{width:w,height:h,rx:10,fill:'#fffdf8',stroke:col,'stroke-width':1.2,opacity:.97},lg);
    el('rect',{x:w/2-24,y:-9,width:48,height:20,rx:10,fill:col},lg);
    const t=el('text',{x:w/2,y:5,'text-anchor':'middle','font-size':12,fill:'#fff','font-weight':600},lg);t.textContent=s.type;
    lines.forEach((ln,k)=>{const tt=el('text',{x:10,y:27+k*15,class:'edge-why'},lg);tt.textContent=ln;});
  });
  // 节点
  const all = [{id:'o',label:d.o.label,cert:d.o.cert}].concat(d.s.map(s=>({id:s.id,label:s.label,cert:s.cert,type:s.type})));
  all.forEach(n=>{
    const p=pos[n.id]; const isO=n.id==='o';
    const gg = el('g',{class:'node'+(n.id===selId?' sel':''),transform:`translate(${p.x},${p.y})`},gN);
    gg.addEventListener('click',e=>{e.stopPropagation();selId=n.id;drawMap();drawSide();});
    if(isO){
      el('circle',{r:96,fill:'#fff6f2',stroke:'#c2452d','stroke-width':n.id===selId?4:2},gg);
      el('circle',{r:86,fill:'none',stroke:'#e9b8a8','stroke-width':1,'stroke-dasharray':'3 4'},gg);
      const z=el('text',{y:-14,'text-anchor':'middle','font-size':64,fill:'#c2452d','font-family':'STKaiti,KaiTi,Kaiti SC,楷体,serif'},gg);z.textContent=d.c;
      const tag=el('text',{y:20,'text-anchor':'middle','font-size':11,fill:'#b8892f','letter-spacing':2},gg);tag.textContent='本 义';
      wrap(n.label,8).slice(0,2).forEach((ln,k)=>{const t=el('text',{y:42+k*17,'text-anchor':'middle','font-size':14.5,fill:'#2b2622','font-weight':600},gg);t.textContent=ln;});
    }else{
      const lines = wrap(n.label,9);
      const w = Math.max(...lines.map(l=>l.length))*16+34, h = 22+lines.length*19;
      const col = TYPE_HEX[n.type];
      el('rect',{class:'box',x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:'#fff',stroke:col,'stroke-width':2},gg);
      el('rect',{x:-w/2,y:-h/2,width:7,height:h,rx:3,fill:col},gg);
      lines.forEach((ln,k)=>{const t=el('text',{x:4,y:-h/2+24+k*19,'text-anchor':'middle','font-size':15,fill:'#2b2622','font-weight':600},gg);t.textContent=ln;});
      const cc = {"确定":"#2e8b57","通行说法":"#c48a12","待查":"#c2452d"}[n.cert];
      el('circle',{cx:w/2-8,cy:-h/2+8,r:5,fill:cc},gg);
    }
  });
  applyView();
}

function applyView(){ $('#viewport').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){const r=$('#map').getBoundingClientRect();view.k=Math.min(r.width,r.height)/1250;view.k=Math.max(.42,Math.min(view.k,1));view.x=r.width/2;view.y=r.height/2+40;applyView();}
function zoomAt(f,cx,cy){const k2=Math.max(.25,Math.min(3,view.k*f));view.x=cx-(cx-view.x)*k2/view.k;view.y=cy-(cy-view.y)*k2/view.k;view.k=k2;applyView();}
const svg=$('#map');
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyView();});
svg.addEventListener('pointerup',()=>drag=null);
$('#zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$('#zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$('#zfit').onclick=fit;
window.addEventListener('resize',fit);

function certTag(c){return `<span class="cert ${c}">把握：${c}</span>`;}
function classicBlock(cl){
  if(!cl) return `<div class="quote" style="border-color:#c2452d">待查<div class="src">暂无核实过的文言书证，不随意引用</div></div>`;
  return `<div class="quote">${esc(cl.t)}<div class="src">——${esc(cl.src)}</div><div class="tr">译文：${esc(cl.tr)}</div></div>`;
}
function senseCard(d){
  const isO = selId==='o'; const s = isO ? d.o : d.s.find(x=>x.id===selId);
  let head = isO
    ? `<span class="chip" style="background:var(--red)">本义</span>${certTag(s.cert)}`
    : `<span class="chip" style="background:${TYPE_HEX[s.type]}">${s.type}</span>${certTag(s.cert)}`;
  let extra = '';
  if(isO){
    extra = `<h4>《说文解字》</h4><div class="quote">${esc(d.sw.t)}<div class="src">把握：${d.sw.cert}</div></div>
      <h4>字形演变（占位）</h4><div class="evo">${d.evo.map(e=>`<div>${esc(e)}</div>`).join('')}</div>
      <h4>本义判定理由</h4><p>${esc(s.reason)}</p>`;
  }else{
    const parent = s.p==='o' ? '本义「'+d.o.label+'」' : '「'+d.s.find(x=>x.id===s.p).label+'」';
    extra = `<h4>从哪里来</h4><p>由${esc(parent)}经<b style="color:${TYPE_HEX[s.type]}">${s.type}</b>而来：${esc(s.why)}</p>`;
  }
  return `<div class="card"><h3>${isO?'本义详情':'义项详情'}</h3>
    <div class="sense-title">${esc(s.label)}</div><div>${head}</div>
    ${extra}
    <h4>词族</h4><div class="fam">${s.fam.map(f=>`<span>${esc(f)}</span>`).join('')}</div>
    <h4>构词拆解</h4><p>${esc(s.build)}</p>
    <h4>现代例句</h4><p><span class="tag-sample">示例</span>${esc(s.mod)}</p>
    <h4>文言原句</h4>${classicBlock(s.cl)}
  </div>`;
}
function drawSide(){
  const d = DATA[cur];
  $('#side').innerHTML = senseCard(d) + `
  <div class="card"><h3>偏旁拆分</h3>
    <p style="margin-bottom:8px"><span class="chip" style="background:var(--gold)">${esc(d.parts.kind)}</span></p>
    <div class="parts"><div class="sem"><b>表义部分</b><span>${esc(d.parts.sem)}</span></div><div class="phon"><b>表音部分</b><span>${esc(d.parts.phon)}</span></div></div>
    <p style="margin-top:8px;color:var(--ink2);font-size:12.5px">${esc(d.parts.note)}</p></div>
  <div class="card"><h3>易读错 · 易写错</h3>
    <div class="err-row"><em>读</em><p>${esc(d.err.read)}</p></div>
    <div class="err-row"><em class="w">写</em><p>${esc(d.err.write)}</p></div></div>
  <div class="card code"><h3>汉字密码</h3><p>${esc(d.code)}</p></div>`;
}
function select(i){
  cur=i; selId='o';
  document.querySelectorAll('#charlist button').forEach((b,k)=>b.classList.toggle('on',k===i));
  const d=DATA[i];
  $('#titlecard').innerHTML=`<div class="big">${d.c}</div><div><div class="py">${esc(d.py)}</div><div class="kind">${esc(d.parts.kind)} · ${d.s.length} 个义项分支</div></div>`;
  drawMap(); drawSide(); fit();
}
$('#map').addEventListener('click',()=>{});
select(0);
</script>
