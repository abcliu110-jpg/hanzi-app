<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 第153组（20字）</title>
<style>
:root{
  --paper:#f7f3ea; --paper2:#fffdf8; --ink:#2b2a33; --ink2:#5d5b66; --line:#e4dccb;
  --red:#c8553d; --teal:#2f7d6d; --amber:#c98a1c; --indigo:#5a5fb0; --plum:#8a5a9e;
  --ok:#2f8a57; --mid:#3b74b8; --tbd:#b8742e;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{display:flex;flex-direction:column;overflow:hidden}
/* 顶部一级菜单 */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper2);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.seal{width:34px;height:34px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:20px}
nav.top{display:flex;gap:4px;flex-wrap:wrap}
nav.top button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
nav.top button:hover{background:#f1ebde}
nav.top button.on{background:var(--ink);color:#fff}
nav.top button.off{opacity:.55}
.grp{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
/* 主体 */
main{flex:1;display:grid;grid-template-columns:150px 1fr 380px;min-height:0}
aside.list{border-right:1px solid var(--line);overflow:auto;padding:12px 10px;background:#faf6ee}
.list h3,.panel h3{font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.1em;margin:4px 6px 10px}
.chbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:10px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.chbtn .c{font-family:var(--serif);font-size:24px;width:32px;text-align:center}
.chbtn .p{font-size:12px;color:var(--ink2)}
.chbtn:hover{background:#f1ebde}
.chbtn.on{background:var(--paper2);border-color:var(--red);box-shadow:0 2px 8px rgba(200,85,61,.12)}
.chbtn.on .c{color:var(--red)}
/* 画布 */
section.stage{position:relative;min-width:0;background:
  radial-gradient(circle at 50% 50%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(43,42,51,.035) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(43,42,51,.035) 31px 32px),var(--paper)}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button,.tools label{background:var(--paper2);border:1px solid var(--line);border-radius:10px;min-width:36px;height:36px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);display:grid;place-items:center;padding:0 8px}
.tools label{font-size:12px;gap:4px;display:flex;align-items:center}
.stagehead{position:absolute;left:18px;top:14px;z-index:2;pointer-events:none}
.stagehead .big{font-family:var(--serif);font-size:30px;font-weight:700}
.stagehead .sub{font-size:13px;color:var(--ink2)}
.legend{position:absolute;left:14px;bottom:12px;z-index:2;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hint{color:var(--ink2)}
/* 节点 */
.node{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.card{background:var(--paper2);border:1.5px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:8px 12px;box-shadow:0 4px 14px rgba(43,42,51,.08);cursor:pointer;text-align:center;min-width:130px;max-width:180px;transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(43,42,51,.12)}
.card.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 8px 20px rgba(43,42,51,.12)}
.card .nm{font-size:15px;font-weight:700;line-height:1.35}
.card .mt{font-size:11px;color:var(--ink2);margin-top:3px}
.core{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#fbefe6);border:3px solid var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px rgba(200,85,61,.18)}
.core.sel{box-shadow:0 0 0 6px rgba(200,85,61,.18),0 10px 30px rgba(200,85,61,.25)}
.core .zi{font-family:var(--serif);font-size:72px;line-height:1;color:var(--ink)}
.core .tag{font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;margin-top:6px}
.core .nm{font-size:13px;margin-top:5px;max-width:150px;text-align:center;line-height:1.3}
.elab{display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 9px}
.why{font-size:11px;line-height:1.4;color:var(--ink);background:rgba(255,253,248,.95);border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);border-radius:8px;padding:3px 7px;text-align:center;max-width:170px}
.noreason .why{display:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:1px}
/* 右侧面板 */
aside.panel{border-left:1px solid var(--line);overflow:auto;background:var(--paper2);padding:14px 16px 30px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#fff}
.box h4{margin:0 0 8px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
.ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ttl .name{font-size:19px;font-weight:700}
.cert{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid currentColor;font-weight:600}
.cert.确定{color:var(--ok)} .cert.通行说法{color:var(--mid)} .cert.待查{color:var(--tbd)}
.quote{font-family:var(--serif);font-size:16px;line-height:1.7;background:#fbf7ef;border-left:3px solid var(--red);padding:8px 12px;border-radius:0 8px 8px 0}
.src{font-size:12px;color:var(--ink2);margin-top:6px}
.tr{font-size:13px;line-height:1.6;margin-top:6px}
.words{display:flex;gap:8px;flex-wrap:wrap}
.word{background:#f4efe4;border-radius:10px;padding:5px 11px;font-size:14px}
.demo{font-size:10px;background:#efe7f6;color:var(--plum);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.evo div{border:1px dashed #cdbfa4;border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--ink2);background:#fbf8f1}
.evo div b{font-family:var(--serif);font-size:20px;color:#bfb29a;font-weight:400}
p.t{margin:4px 0;font-size:13.5px;line-height:1.65}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split div{border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
.yi{background:#e9f3f0} .yin{background:#eef0fa}
.split b{display:block;font-size:11px;color:var(--ink2);margin-bottom:2px}
ul.code{margin:0;padding-left:18px;font-size:13px;line-height:1.65}
.err p{margin:4px 0;font-size:13px;line-height:1.6}
.err b{color:var(--red)}
.note{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:8px}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (max-width:1100px){main{grid-template-columns:110px 1fr 320px}.chbtn .p{display:none}}
</style>
</head>

  {"id":"s1","n":"平民百姓","t":"转喻","r":"人数最多的就是普通老百姓，所以用“庶”来称呼他们。","w":["庶民","黎庶","庶人"],"b":"庶民＝庶（众多的）＋民（百姓）。","ex":"古代的庶民大多以种田为生。","cl":{"q":"经始勿亟，庶民子来。","s":"《诗经·大雅·灵台》","tr":"文王说开始建台不要着急，百姓却像儿子帮父亲一样纷纷赶来。"},"c":"确定"},

  {"id":"s3","n":"旁支（庶出）","t":"引申","r":"正妻以外的众多子女，被叫作“庶”，和“嫡”相对。","w":["庶出","嫡庶","庶子"],"b":"庶出＝庶（旁支）＋出（所生）。","ex":"古代小说里常写到“嫡庶之争”。","cl":null,"c":"通行说法"}

 "o":{"n":"干肉（读 fǔ）","why":"《说文》训“干肉”，“月（肉）”表示和肉有关，“甫”表示读音。","w":["肉脯","牛肉脯","脯腊"],"b":"肉脯＝肉＋脯（晒干或烘干的肉片）。","ex":"爸爸出差带回一包香香的猪肉脯。","cl":{"q":"沽酒市脯不食。","s":"《论语·乡党》","tr":"从街上买来的酒和干肉，（孔子）不吃。"},"c":"确定"},

{"ch":"迭","py":"dié",

  {"id":"s1","n":"屡次、接连","t":"引申","r":"一个接一个地替换，就成了一次又一次。","w":["迭起","迭出","高潮迭起"],"b":"高潮迭起＝高潮（最精彩处）＋迭起（接连出现）。","ex":"这场球赛高潮迭起，看得大家直拍手。","cl":null,"c":"确定"},

 "s":[
  {"id":"s1","n":"和睦、亲近","t":"引申","r":"互相看着都很温和，相处就亲亲热热的。","w":["和睦","亲睦","敦亲睦邻"],"b":"和睦＝和（和气）＋睦（亲近）。","ex":"我们家和睦相处，经常一起做饭。","cl":{"q":"选贤与能，讲信修睦。","s":"《礼记·礼运》","tr":"选拔贤能的人，讲求诚信，培养和睦的关系。"},"c":"确定"},
  {"id":"s2","from":"s1","n":"与邻居、邻国友好","t":"引申","r":"把家里的和睦推广到邻居、邻国之间。","w":["睦邻","睦邻友好","睦族"],"b":"睦邻＝睦（使和睦）＋邻（邻居、邻国）。","ex":"两国一直保持睦邻友好的关系。","cl":null,"c":"确定"}

 "s":[
  {"id":"s1","n":"人身上的孔（七窍）","t":"引申","r":"眼睛、耳朵、鼻孔、嘴巴，都是身上的“小洞”。","w":["七窍","七窍生烟","九窍"],"b":"七窍生烟＝七窍（眼耳口鼻）＋生烟（冒烟），形容非常生气。","ex":"弟弟把我的画撕了，气得我七窍生烟。","cl":{"q":"人皆有七窍以视听食息，此独无有，尝试凿之。","s":"《庄子·应帝王》","tr":"人人都有七个孔来看、听、吃饭和呼吸，唯独他没有，我们试着给他凿开。"},"c":"确定"},
  {"id":"s2","n":"关键、诀窍","t":"比喻","r":"找到了“孔”，钥匙就能插进去，比喻事情的关键。","w":["窍门","诀窍","不得其窍"],"b":"窍门＝窍（关键处）＋门（门路）。","ex":"背古诗也有窍门：先读懂意思再背。","cl":null,"c":"确定"},
  {"id":"s3","from":"s1","n":"思路通了（开窍）","t":"比喻","r":"心里的“孔”被打通了，一下子就明白了。","w":["开窍","一窍不通","心窍"],"b":"一窍不通＝一个孔都不通，比喻什么都不懂。","ex":"他以前怕数学，现在终于开窍了。","cl":null,"c":"确定"}
 ],

 "err":{"du":"读 qiào（第四声），不要读成 qiǎo。","xie":"上面是“穴”，不是宝盖“宀”；下面是“巧”。"},
 "code":["“穴”字头的字多和洞有关：窍、空、窗、窟、穿。","简化字常换上更好读的声旁：竅→窍（巧）。"]
},

 "sw":{"t":"《说文》字头作“鬻”类字形，与“粥”的对应关系待查","c":"待查","note":"“粥”是后来通行的简化写法。"},
 "evo":"古字作“鬻”，像锅（鬲）里煮米、两边冒着热气；后来省去“鬲”写成“粥”。",
 "o":{"n":"稀饭","why":"字形中间是“米”，两边的“弓”像锅边升起的热气，表示煮得稀烂的米；古今都指稀饭。","w":["米粥","小米粥","喝粥"],"b":"小米粥＝小米＋粥。","ex":"早上喝一碗热乎乎的小米粥，暖洋洋的。","cl":{"q":"齐疏之服，飦粥之食，自天子达于庶人。","s":"《孟子·滕文公上》","tr":"穿粗布孝服，吃稀饭，从天子到百姓都是这样（守丧）。"},"c":"通行说法"},
 "s":[
  {"id":"s1","n":"东西少、人多（僧多粥少）","t":"比喻","r":"和尚多、粥少，不够分，比喻人多东西少。","w":["僧多粥少","一锅粥","乱成一锅粥"],"b":"乱成一锅粥＝像煮烂的粥一样乱糟糟。","ex":"名额只有三个，报名的却有三十人，真是僧多粥少。","cl":null,"c":"确定"},
  {"id":"s2","n":"卖（通“鬻”，读 yù）","t":"假借","r":"古书里借“粥”表示“卖”的意思，读 yù。","w":["粥（鬻）文","粥（鬻）爵","卖粥（鬻）"],"b":"鬻文＝卖（鬻）＋文（文章）。","ex":"古书中“粥”有时读 yù，意思是卖。","cl":null,"c":"待查"}
 ],

 "code":["“米”旁字都和粮食有关：粥、粮、粉、粒、糖。","有的字由“会意”组成：粥＝米＋两股热气。"]

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const C = DATA.chars, TY = DATA.meta.types;
const CERT = {"确定":"var(--ok)","通行说法":"var(--mid)","待查":"var(--tbd)"};
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
let cur = 0, sel = "o";
const svg = $("#map"), vp = $("#vp"), NS = "http://www.w3.org/2000/svg";
let T = {x:0,y:0,k:1};

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1600);}

/* 顶部菜单 */
$("#topnav").innerHTML = MENU.map((m,i)=>`<button class="${i===0?'on':'off'}" data-i="${i}">${m}</button>`).join("");
$("#topnav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.i!=="0")toast("「"+b.textContent+"」模块在其他页面中，本文件只实现「字义扩展图」");});

/* 左侧字表 */
function renderList(){
  $("#chlist").innerHTML = C.map((c,i)=>`<button class="chbtn ${i===cur?'on':''}" data-i="${i}"><span class="c">${c.ch}</span><span class="p">${c.py}</span></button>`).join("");
}
$("#chlist").addEventListener("click",e=>{const b=e.target.closest(".chbtn");if(!b)return;go(+b.dataset.i);});
document.addEventListener("keydown",e=>{if(e.key==="ArrowDown"){go((cur+1)%C.length);e.preventDefault();}if(e.key==="ArrowUp"){go((cur-1+C.length)%C.length);e.preventDefault();}});

/* 图例 */
$("#legend").innerHTML = Object.entries(TY).filter(([k])=>k!=="本义").map(([k,v])=>`<span title="${DATA.meta.typeDesc[k]}"><i style="background:${v}"></i>${k}：${DATA.meta.typeDesc[k]}</span>`).join("")
 + `<span class="hint">把握：<span class="dot" style="background:var(--ok)"></span>确定 <span class="dot" style="background:var(--mid)"></span>通行说法 <span class="dot" style="background:var(--tbd)"></span>待查 · 滚轮缩放、拖动平移、点击义项看详情、↑↓切换字</span>`;

/* 布局 */
function layout(c){
  const pos = {o:{x:0,y:0,a:0,d:0}};
  const byId = {}; c.s.forEach(s=>byId[s.id]=s);
  const first = c.s.filter(s=>!s.from);
  const n = first.length, R = 300, R2 = 250;
  const start = n===2 ? Math.PI : -Math.PI/2;
  first.forEach((s,i)=>{const a = start + i*2*Math.PI/n; pos[s.id]={x:R*Math.cos(a),y:R*Math.sin(a),a,d:1};});
  let changed = true;
  while(changed){
    changed=false;
    const groups={};
    c.s.forEach(s=>{if(s.from && !pos[s.id] && pos[s.from]) (groups[s.from]=groups[s.from]||[]).push(s);});
    for(const p in groups){
      const pp=pos[p], k=groups[p];
      k.forEach((s,j)=>{
        const a = pp.a + (j-(k.length-1)/2)*0.9;
        pos[s.id]={x:pp.x+R2*Math.cos(a),y:pp.y+R2*Math.sin(a),a,d:pp.d+1};
      });
      changed=true;
    }
  }
  return pos;
}

function fo(x,y,w,h,html,cls){
  const f=document.createElementNS(NS,"foreignObject");
  f.setAttribute("x",x-w/2);f.setAttribute("y",y-h/2);f.setAttribute("width",w);f.setAttribute("height",h);
  if(cls)f.setAttribute("class",cls);
  f.innerHTML=`<div xmlns="http://www.w3.org/1999/xhtml" class="node">${html}</div>`;
  return f;
}

function renderMap(){
  const c=C[cur]; const pos=layout(c);
  vp.innerHTML="";
  const eg=document.createElementNS(NS,"g"), lg=document.createElementNS(NS,"g"), ng=document.createElementNS(NS,"g");
  lg.setAttribute("class",$("#showWhy").checked?"":"noreason");
  c.s.forEach(s=>{
    const a=pos[s.from||"o"], b=pos[s.id], col=TY[s.t]||"#888";
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    const bend=18, cx=mx-dy/L*bend, cy=my+dx/L*bend;
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`);
    p.setAttribute("fill","none");p.setAttribute("stroke",col);p.setAttribute("stroke-width",2.4);
    if(s.t==="假借")p.setAttribute("stroke-dasharray","7 6");
    p.setAttribute("opacity",.85);
    eg.appendChild(p);
    const lx=(a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    lg.appendChild(fo(lx,ly,190,96,`<div class="elab" style="--c:${col}"><span class="badge">${esc(s.t)}</span><span class="why">${esc(s.r)}</span></div>`));
  });
  // 中心
  const core=fo(0,0,210,210,`<div class="core ${sel==='o'?'sel':''}" data-id="o"><div class="zi">${c.ch}</div><span class="tag">本义</span><div class="nm">${esc(c.o.n)}</div></div>`);
  ng.appendChild(core);
  c.s.forEach(s=>{
    const b=pos[s.id], col=TY[s.t];
    ng.appendChild(fo(b.x,b.y,200,110,`<div class="card ${sel===s.id?'sel':''}" data-id="${s.id}" style="--c:${col}"><div class="nm">${esc(s.n)}</div><div class="mt"><span class="dot" style="background:${CERT[s.c]}"></span>${esc(s.c)} · ${esc(s.w.slice(0,2).join("、"))}</div></div>`));
  });
  vp.appendChild(eg);vp.appendChild(lg);vp.appendChild(ng);
  $("#sh-big").textContent=c.ch+"  "+c.py;
  $("#sh-sub").textContent=`${c.s.length+1} 个义项 · 本义：${c.o.n}`;
  return pos;
}

function fit(){
  const pos=layout(C[cur]); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  Object.values(pos).forEach(p=>{x0=Math.min(x0,p.x-120);y0=Math.min(y0,p.y-110);x1=Math.max(x1,p.x+120);y1=Math.max(y1,p.y+110);});
  const r=svg.getBoundingClientRect(); const pad=50;
  const k=Math.min(1.15,Math.max(.35,Math.min((r.width-pad*2)/(x1-x0),(r.height-pad*2-40)/(y1-y0))));
  T.k=k;T.x=r.width/2-(x0+x1)/2*k;T.y=r.height/2+20-(y0+y1)/2*k;apply();
}
function apply(){vp.setAttribute("transform",`translate(${T.x},${T.y}) scale(${T.k})`);}
function zoomAt(f,mx,my){const nk=Math.min(3,Math.max(.25,T.k*f));T.x=mx-(mx-T.x)*nk/T.k;T.y=my-(my-T.y)*nk/T.k;T.k=nk;apply();}
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
$("#zin").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$("#zout").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$("#zfit").onclick=fit;
$("#showWhy").onchange=()=>renderMap();
let drag=null, moved=0;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y};moved=0;svg.classList.add("drag");});
window.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));T.x=drag.tx+dx;T.y=drag.ty+dy;apply();});
window.addEventListener("pointerup",()=>{drag=null;svg.classList.remove("drag");});
svg.addEventListener("click",e=>{if(moved>5)return;const n=e.target.closest("[data-id]");if(!n)return;sel=n.dataset.id;renderMap();renderPanel();});

/* 右侧面板 */
function classic(cl){
  if(!cl) return `<p class="t" style="color:var(--tbd)">暂未找到可靠的文言原句，标记为 <span class="cert 待查">待查</span></p>`;
  return `<div class="quote">${esc(cl.q)}</div><div class="src">出处：${esc(cl.s)}</div><div class="tr"><b>译文：</b>${esc(cl.tr)}</div>`;
}
function senseBody(s){
  return `
  <div class="box"><h4>词族 · 3个</h4><div class="words">${s.w.map(w=>`<span class="word">${esc(w)}</span>`).join("")}</div></div>
  <div class="box"><h4>构词拆解</h4><p class="t">${esc(s.b||"—")}</p></div>
  <div class="box"><h4>现代例句<span class="demo">示例</span></h4><p class="t">${esc(s.ex)}</p></div>
  <div class="box"><h4>文言原句</h4>${classic(s.cl)}</div>`;
}
function renderPanel(){
  const c=C[cur]; let h="";
  if(sel==="o"){
    h+=`<div class="ttl"><span class="badge" style="--c:${TY['本义']}">本义</span><span class="name">${esc(c.o.n)}</span><span class="cert ${c.o.c}">${c.o.c}</span></div>
    <div class="box"><h4>《说文解字》原文 <span class="cert ${c.sw.c}">${c.sw.c}</span></h4><div class="quote">${esc(c.sw.t)}</div>${c.sw.note?`<div class="src">${esc(c.sw.note)}</div>`:""}</div>
    <div class="box"><h4>字形演变（图片占位）</h4><div class="evo">${["甲骨文","金文","小篆","隶书","楷书"].map((n,i)=>`<div><b>${i===4?c.ch:"□"}</b>${n}</div>`).join("")}</div><p class="t">${esc(c.evo)}</p></div>
    <div class="box"><h4>本义判定理由</h4><p class="t">${esc(c.o.why)}</p></div>` + senseBody(c.o);
  } else {
    const s=c.s.find(x=>x.id===sel); const from=s.from?c.s.find(x=>x.id===s.from).n:("本义："+c.o.n);
    h+=`<div class="ttl"><span class="badge" style="--c:${TY[s.t]}">${s.t}</span><span class="name">${esc(s.n)}</span><span class="cert ${s.c}">${s.c}</span></div>
    <div class="box"><h4>从哪里来</h4><p class="t">由「${esc(from)}」${esc(s.t)}而来：${esc(s.r)}</p><p class="t" style="color:var(--ink2);font-size:12px">${s.t}＝${DATA.meta.typeDesc[s.t]}</p></div>` + senseBody(s);
  }
  h+=`<h3 style="margin-top:18px">字的档案 · ${c.ch}</h3>
  <div class="box"><h4>偏旁拆分</h4><div class="split"><div class="yi"><b>表义部分</b>${esc(c.parts.yi)}</div><div class="yin"><b>表音部分</b>${esc(c.parts.yin)}</div></div></div>
  <div class="box err"><h4>易错提醒</h4><p><b>易读错：</b>${esc(c.err.du)}</p><p><b>易写错：</b>${esc(c.err.xie)}</p></div>
  <div class="box"><h4>相关汉字密码</h4><ul class="code">${c.code.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="note">${esc(DATA.meta.note)}</div>`;
  $("#panel").innerHTML=h; $("#panel").scrollTop=0;
}

function go(i){cur=i;sel="o";renderList();renderMap();renderPanel();fit();}
window.addEventListener("resize",fit);
go(0);
})();
</script>
