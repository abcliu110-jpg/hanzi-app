<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字义扩展图 · 第156组 | 汉字学习</title>
<style>
:root{
  --paper:#f6f1e7;--card:#fffdf8;--ink:#2d2a26;--muted:#7d7466;--line:#e8dfcd;--soft:#f1eadb;
  --seal:#c8463d;--seal-d:#a8342c;
  --t-yin:#3d7cc9;--t-bi:#e0862b;--t-zhuan:#8a5cc2;--t-jia:#2b9a77;
  --ok:#2b9a77;--common:#3d7cc9;--todo:#a89f90;
  --r:18px;--shadow:0 6px 24px rgba(80,60,30,.08),0 1px 3px rgba(80,60,30,.06);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai",var(--serif);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(rgba(160,130,80,.07) 1px,transparent 1px);background-size:18px 18px;font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}

/* ===== 顶部一级菜单 ===== */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:12px 24px;
  background:rgba(255,253,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.seal{width:38px;height:38px;border-radius:10px;background:var(--seal);color:#fff;display:grid;place-items:center;
  font-family:var(--kai);font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.brand b{font-size:16px;letter-spacing:1px}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 14px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:500;transition:.2s}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff}
.nav button .soon{font-size:10px;margin-left:4px;opacity:.6}

/* ===== 布局 ===== */
.app{display:grid;grid-template-columns:212px minmax(0,1fr) 360px;gap:18px;padding:18px 24px 28px;max-width:1720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.left{position:sticky;top:80px;align-self:start;padding:16px 12px;max-height:calc(100vh - 100px);overflow:auto}
.left h2,.sec-h{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;padding:0 6px 10px;display:flex;justify-content:space-between;align-items:center}
.progress{height:4px;background:var(--soft);border-radius:4px;margin:0 6px 12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--seal);border-radius:4px;transition:width .4s}
.clist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.citem{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;border-radius:12px;border:1px solid transparent;transition:.18s}
.citem:hover{background:var(--soft)}
.citem .zi{font-family:var(--kai);font-size:28px;line-height:1.15}
.citem .py{font-size:11px;color:var(--muted)}
.citem.on{background:var(--ink);color:#fff}
.citem.on .py{color:rgba(255,255,255,.7)}
.citem.seen::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.citem.on.seen::after{background:#8fe3c6}

/* ===== 中间 ===== */
.mid{display:flex;flex-direction:column;gap:18px;min-width:0}
.mapcard{overflow:hidden}
.maphead{display:flex;align-items:center;gap:18px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bigzi{font-family:var(--kai);font-size:56px;line-height:1;width:76px;height:76px;display:grid;place-items:center;
  border-radius:16px;background:var(--soft);position:relative}
.bigzi::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(200,70,61,.35);border-radius:10px}
.hinfo{flex:1;min-width:200px}
.hinfo .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hinfo .l1 b{font-size:20px}
.hinfo .l1 span{color:var(--muted);font-size:13px}
.hinfo .l2{margin-top:4px;color:var(--ink)}
.hinfo .l2 em{font-style:normal;color:var(--seal);font-weight:600}
.tools{display:flex;gap:6px;align-items:center}
.tbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:17px;transition:.15s}
.tbtn:hover{border-color:var(--ink)}
.tbtn.wide{width:auto;padding:0 10px;font-size:12px}
.zoomval{font-size:12px;color:var(--muted);width:42px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:#fffaf0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.legend .dot{width:9px;height:9px;border-radius:50%}
.legend .dot.todo{background:none;border:1.5px dashed var(--todo)}
.legend .sep{width:1px;height:14px;background:var(--line)}
.stage{position:relative;height:min(68vh,640px);min-height:440px;background:
  radial-gradient(circle at 50% 50%,#fffdf6 0,#fbf6ea 60%,#f5eedd 100%);cursor:grab;touch-action:none}
.stage.dragging{cursor:grabbing}
#map{width:100%;height:100%;display:block;user-select:none}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(255,253,248,.85);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.navbtns{position:absolute;right:14px;bottom:12px;display:flex;gap:6px}

/* svg 元素 */
.edge{fill:none;stroke-width:2.6;stroke-linecap:round;transition:opacity .2s,stroke-width .2s}
.edge.dash{stroke-dasharray:6 6}
.elabel rect{fill:#fffdf8;stroke-width:1.4}
.elabel .et{font-size:13px;font-weight:700}
.elabel .er{font-size:12.5px;fill:#4b453d}
.node{cursor:pointer}
.node circle.body{fill:#fff;stroke-width:3;transition:fill .2s}
.node .nt{font-size:16px;font-weight:700;fill:var(--ink);pointer-events:none}
.node .nlv{font-size:11px;fill:var(--muted);pointer-events:none}
.node:hover circle.body{fill:#fffaf0}
.node.sel circle.body{fill:var(--c)}
.node.sel .nt{fill:#fff}
.node .halo{fill:none;stroke-width:10;opacity:0;transition:opacity .2s}
.node.sel .halo,.node:hover .halo{opacity:.18}
.dim .edge,.dim .elabel,.dim .node{opacity:.35}
.dim .hot{opacity:1!important}
.center{cursor:pointer}
.center .zi{font-family:var(--kai);font-size:66px;fill:#fff;pointer-events:none}
.center .cs{font-size:13px;fill:rgba(255,255,255,.92);pointer-events:none}
.center .ctag{font-size:11px;fill:var(--seal);font-weight:700;pointer-events:none}
.center.sel .ring{stroke:var(--ink)}
.appear{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

/* 本义档案 */
.origin{padding:18px 20px}
.origin .sec-h{padding:0 0 12px}
.ogrid{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:16px}
.obox{background:#fffaf0;border:1px solid var(--line);border-radius:14px;padding:14px}
.obox h4{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:600}
.sw{font-family:var(--serif);font-size:16px;line-height:1.9;color:#3a2f22}
.sw.none{font-family:var(--sans);font-size:13px;color:var(--muted)}
.swnote{font-size:12px;color:var(--muted);margin-top:6px}
.evo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.evo .st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.evo .ph{width:100%;aspect-ratio:1;border:1.5px dashed #d8ccb3;border-radius:12px;display:grid;place-items:center;
  font-size:11px;color:#b3a68d;background:repeating-linear-gradient(45deg,#fffdf8,#fffdf8 6px,#faf4e6 6px,#faf4e6 12px)}
.evo .ph b{font-family:var(--kai);font-size:30px;color:#cdbf9f;font-weight:400;display:block;line-height:1}
.evo .sn{font-size:12px;font-weight:600}
.evo .sd{font-size:11px;color:var(--muted);line-height:1.45}
.oreason{font-size:13.5px}

/* 右侧 */
.right{display:flex;flex-direction:column;gap:14px;position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:4px}
.right .card{padding:16px 18px}
.right h3.ct{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.right h3.ct::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--seal)}
.empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.empty b{display:block;font-size:30px;margin-bottom:6px;opacity:.5}
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{font-size:20px}
.type{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--c)}
.lv{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid}
.lv.ok{color:var(--ok);border-color:#bfe3d6;background:#effaf5}
.lv.common{color:var(--common);border-color:#c7daf1;background:#f0f6fd}
.lv.todo{color:#8b8271;border:1px dashed #c9bfae;background:#f8f5ef}
.whybox{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.whybox b{color:var(--seal);margin-right:4px}
.blk{margin-top:12px}
.blk h4{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:14px}
.chip em,.ex em,.cls em{font-style:normal;color:var(--seal);font-weight:700}
.split{font-size:13.5px;background:#fffaf0;border-left:3px solid var(--line);padding:6px 10px;border-radius:0 8px 8px 0}
.tag-s{font-size:10.5px;padding:1px 7px;border-radius:6px;background:#fdeee0;color:#b5611d;font-weight:700}
.ex{font-size:14px}
.cls{background:#fbf7ee;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cls .ct2{font-family:var(--serif);font-size:15.5px;line-height:1.8;color:#3a2f22}
.cls .src{font-size:12px;color:var(--muted);margin:4px 0 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cls .tr{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.cls.none{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.lvline{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.parts{display:flex;align-items:stretch;gap:10px;margin-bottom:10px}
.pbig{width:74px;flex-shrink:0;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-family:var(--kai);font-size:48px}
.plist{flex:1;display:flex;flex-direction:column;gap:6px}
.pp{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:#fff}
.pp .pf{font-family:var(--kai);font-size:22px;min-width:30px;text-align:center;line-height:1.2}
.pp .pr{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
.pp .pr.yi{background:#effaf5;color:var(--ok)}
.pp .pr.yin{background:#f0f6fd;color:var(--common)}
.pp .pr.both{background:#f5effc;color:var(--t-zhuan)}
.pp .pn{font-size:12px;color:var(--muted);margin-top:2px}
.pstruct{font-size:12px;color:var(--muted)}
.err{display:flex;flex-direction:column;gap:8px}
.err .row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.err .ic{flex-shrink:0;width:42px;text-align:center;font-size:11px;font-weight:700;border-radius:8px;padding:2px 0}
.err .ic.r{background:#fdeee0;color:#b5611d}
.err .ic.w{background:#fde8e6;color:var(--seal-d)}
.code .rule{padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#fffaf0,#fbf3e2);border:1px solid var(--line);margin-bottom:8px}
.code .rule b{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-bottom:2px}
.code .rule b::before{content:"🔑";font-size:12px}
.code .rule p{font-size:13px;color:#4b453d}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted);padding-top:4px}

@media (max-width:1280px){.app{grid-template-columns:180px minmax(0,1fr) 320px}.ogrid{grid-template-columns:1fr 1fr}.ogrid .obox:last-child{grid-column:1/-1}}
@media (max-width:980px){
  .app{grid-template-columns:1fr;padding:12px}
  .left,.right{position:static;max-height:none}
  .clist{grid-template-columns:repeat(10,1fr)}
  .citem .py{display:none}
  .ogrid{grid-template-columns:1fr}
}
@media (max-width:560px){.clist{grid-template-columns:repeat(5,1fr)}.evo{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="seal">字</div><div><b>汉字花园</b><small>第 156 组 · 20 字</small></div></div>
  <nav class="nav" id="nav"></nav>
</header>

<div class="app">
  <aside class="card left">
    <h2><span>本组汉字</span><span id="cnt">0/20</span></h2>
    <div class="progress"><i id="prog"></i></div>
    <div class="clist" id="clist"></div>
  </aside>

  <main class="mid">
    <section class="card mapcard">
      <div class="maphead">
        <div class="bigzi" id="hz"></div>
        <div class="hinfo">
          <div class="l1"><b id="hpy"></b><span id="hmeta"></span></div>
          <div class="l2">本义：<em id="hm"></em></div>
        </div>
        <div class="tools">
          <button class="tbtn" id="zout" title="缩小">−</button>
          <span class="zoomval" id="zval">100%</span>
          <button class="tbtn" id="zin" title="放大">＋</button>
          <button class="tbtn wide" id="zreset" title="复位">复位</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="stage" id="stage">
        <svg id="map" viewBox="0 0 1100 800" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="sealg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#d9574d"/><stop offset="1" stop-color="#a8342c"/></radialGradient>
            <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6b4a1f" flood-opacity=".15"/></filter>
          </defs>
          <g id="vp"></g>
        </svg>
        <div class="hint">滚轮缩放 · 拖动平移 · 点击义项看详情</div>
        <div class="navbtns"><button class="tbtn" id="prev" title="上一个字（←）">‹</button><button class="tbtn" id="next" title="下一个字（→）">›</button></div>
      </div>
    </section>

    <section class="card origin">
      <div class="sec-h"><span>本义档案</span><span id="olv"></span></div>
      <div class="ogrid">
        <div class="obox"><h4>《说文解字》原文</h4><div id="osw"></div></div>
        <div class="obox"><h4>字形演变 <span class="tag-s" style="background:#f1eadb;color:#8b7d63">字形图占位</span></h4><div class="evo" id="oevo"></div></div>
        <div class="obox"><h4>本义判定理由</h4><div class="oreason" id="oreason"></div></div>
      </div>
    </section>
  </main>

  <aside class="right">
    <div class="card" id="detail"></div>
    <div class="card"><h3 class="ct">偏旁拆分</h3><div id="parts"></div></div>
    <div class="card"><h3 class="ct">易读错 · 易写错</h3><div class="err" id="err"></div></div>
    <div class="card code"><h3 class="ct">相关汉字密码</h3><div id="code"></div></div>
  </aside>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

"侈袂",
"侈大"
],
"split": "侈口 ＝ 侈（宽大）＋ 口（器物的口）",
"ex": "博物馆里有一只侈口的陶罐。",
"cls": null,
"lv": "待查"
}
],
"read": [
"读 chǐ，不读 duō 或 chī。"
],
"write": [
"右边是“多”，两个“夕”上小下大。"
],
"code": [
{
"t": "“多”声家族",
"d": "侈 chǐ、移 yí、哆 duō：都含“多”，读音变化很大，要逐个记。"
},
{
"t": "亻旁·人的行为",
"d": "侈、伪、傲、俭：亻旁的字常说人的行为和品性。"
}
]
}
]
}
</script>

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const CH = DATA.chars;
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const TYPE = {
  "引申":{c:"#3d7cc9",d:"顺着意思往外延伸"},
  "比喻":{c:"#e0862b",d:"因为“像”而借用"},
  "转喻":{c:"#8a5cc2",d:"用相关的东西来代指"},
  "假借":{c:"#2b9a77",d:"只借读音，与原义无关"}
};
const LV = {
  "确定":{k:"ok",d:"有《说文》、经典文献或权威辞书作依据。"},
  "通行说法":{k:"common",d:"多数辞书采用的解释，但学界仍有讨论。"},
  "待查":{k:"todo",d:"暂时没有找到可靠依据，需要进一步查证。"}
};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const hl = (s,z) => esc(s).split(z).join('<em>'+z+'</em>');
const chunk = (s,n) => {const a=[...s],o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n).join(''));return o;};
const lvBadge = l => `<span class="lv ${LV[l]?LV[l].k:'todo'}">${l==="确定"?"✓":l==="待查"?"?":"◎"} ${esc(l)}</span>`;

const state = {idx:0, sel:-1, seen:new Set(), view:{k:1,x:0,y:0}};

/* ---------- 顶部菜单 ---------- */
$('nav').innerHTML = MENU.map((m,i)=>`<button class="${i===0?'on':''}" data-i="${i}">${m}${i?'<span class="soon">建设中</span>':''}</button>`).join('');
$('nav').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(+b.dataset.i!==0) toast(`「${MENU[+b.dataset.i]}」模块正在建设中，本页先体验「字义扩展图」`);
});
let tt; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- 图例 ---------- */
$('legend').innerHTML = Object.entries(TYPE).map(([k,v])=>`<span title="${v.d}"><i style="background:${v.c}"></i>${k}·${v.d}</span>`).join('')
 + `<span class="sep"></span>`
 + `<span><span class="dot" style="background:var(--ok)"></span>确定</span><span><span class="dot" style="background:var(--common)"></span>通行说法</span><span><span class="dot todo"></span>待查（虚线）</span>`;

/* ---------- 左侧字表 ---------- */
function renderList(){
  $('clist').innerHTML = CH.map((d,i)=>`<button class="citem ${i===state.idx?'on':''} ${state.seen.has(i)?'seen':''}" data-i="${i}" title="${esc(d.origin.s)}"><span class="zi">${d.c}</span><span class="py">${esc(d.py)}</span></button>`).join('');
  $('cnt').textContent = state.seen.size+'/'+CH.length;
  $('prog').style.width = (state.seen.size/CH.length*100)+'%';
}
$('clist').addEventListener('click',e=>{const b=e.target.closest('.citem'); if(b) go(+b.dataset.i);});

/* ---------- 义项网 ---------- */
const CX=550, CY=400, RX=350, RY=262, RC=96, RN=62;
function layout(n){
  const start = n===4?-45:(n===2?0:-90), step=360/n;
  return Array.from({length:n},(_,i)=>{const a=(start+step*i)*Math.PI/180;return {x:CX+RX*Math.cos(a),y:CY+RY*Math.sin(a),a};});
}
function renderMap(){
  const d=CH[state.idx], pos=layout(d.senses.length);
  let edges='',labels='',nodes='';
  d.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPE[s.k].c, dash=s.lv==="待查"?' dash':'';
    const dx=p.x-CX, dy=p.y-CY, L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L, bend=26*(i%2?1:-1);
    const qx=CX+dx/2+nx*bend, qy=CY+dy/2+ny*bend;
    edges+=`<path class="edge${dash}" data-i="${i}" d="M${CX},${CY} Q${qx.toFixed(1)},${qy.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}" stroke="${col}"/>`;
    // 标签放在两圆之间的中点
    const t=(RC+(L-RC-RN)/2)/L, u=1-t;
    const lx=u*u*CX+2*u*t*qx+t*t*p.x, ly=u*u*CY+2*u*t*qy+t*t*p.y;
    const lines=chunk(s.why,12).slice(0,4), w=Math.max(...lines.map(l=>[...l].length))*12.6+22, h=30+lines.length*17;
    labels+=`<g class="elabel" data-i="${i}" transform="translate(${lx.toFixed(1)},${ly.toFixed(1)})">
      <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="12" stroke="${col}"/>
      <rect x="${-22}" y="${-h/2-9}" width="44" height="18" rx="9" fill="${col}" stroke="none"/>
      <text class="et" x="0" y="${-h/2+4.5}" text-anchor="middle" fill="#fff" style="font-size:11.5px">${s.k}</text>
      ${lines.map((l,j)=>`<text class="er" x="0" y="${-h/2+24+j*17}" text-anchor="middle">${esc(l)}</text>`).join('')}
    </g>`;
    const tl=chunk(s.t,[...s.t].length>6?4:([...s.t].length>4?3:4)).slice(0,3), th=tl.length*19;
    nodes+=`<g class="node ${state.sel===i?'sel':''}" data-i="${i}" style="--c:${col}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">
      <g class="appear" style="animation-delay:${.08*i+.1}s">
      <circle class="halo" r="${RN+6}" stroke="${col}"/>
      <circle class="body" r="${RN}" stroke="${col}" ${s.lv==="待查"?'stroke-dasharray="7 5"':''} filter="url(#sh)"/>
      ${tl.map((l,j)=>`<text class="nt" x="0" y="${-th/2+15+j*19}" text-anchor="middle">${esc(l)}</text>`).join('')}
      <text class="nlv" x="0" y="${RN+20}" text-anchor="middle">${s.lv==="确定"?"● ":s.lv==="待查"?"○ ":"◐ "}${esc(s.lv)} · ${esc(s.words[0])}</text>
      </g></g>`;
  });
  const sl=chunk(d.origin.s,5).slice(0,2);
  const center=`<g class="center ${state.sel===-1?'sel':''}" data-i="-1" transform="translate(${CX},${CY})"><g class="appear">
     <circle class="ring" r="${RC+14}" fill="none" stroke="#c8463d" stroke-width="1.5" stroke-dasharray="3 6"/>
     <circle r="${RC}" fill="url(#sealg)" filter="url(#sh)"/>
     <rect x="-26" y="${-RC-11}" width="52" height="22" rx="11" fill="#fffdf8" stroke="#c8463d" stroke-width="1.4"/>
     <text class="ctag" x="0" y="${-RC+4}" text-anchor="middle">本 义</text>
     <text class="zi" x="0" y="${sl.length>1?6:14}" text-anchor="middle">${d.c}</text>
     ${sl.map((l,j)=>`<text class="cs" x="0" y="${(sl.length>1?34:44)+j*17}" text-anchor="middle">${esc(l)}</text>`).join('')}
  </g></g>`;
  $('vp').innerHTML = `<g id="eg">${edges}</g>${center}<g>${labels}</g><g>${nodes}</g>`;
  applyView();
}

/* 悬停高亮 */
$('vp').addEventListener('mouseover',e=>{
  const g=e.target.closest('.node,.elabel'); if(!g) return;
  const i=g.dataset.i; $('vp').classList.add('dim');
  $('vp').querySelectorAll(`[data-i="${i}"]`).forEach(x=>x.classList.add('hot'));
});
$('vp').addEventListener('mouseout',e=>{
  const g=e.target.closest('.node,.elabel'); if(!g) return;
  $('vp').classList.remove('dim'); $('vp').querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
});

/* ---------- 缩放 / 平移 ---------- */
const svg=$('map'), stage=$('stage');
function applyView(){const v=state.view;$('vp').setAttribute('transform',`translate(${v.x.toFixed(1)},${v.y.toFixed(1)}) scale(${v.k.toFixed(3)})`);$('zval').textContent=Math.round(v.k*100)+'%';}
function svgPt(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(f,px,py){const v=state.view,nk=Math.min(2.6,Math.max(.45,v.k*f));v.x=px-(px-v.x)*(nk/v.k);v.y=py-(py-v.y)*(nk/v.k);v.k=nk;applyView();}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.12:1/1.12,p.x,p.y);},{passive:false});
$('zin').onclick=()=>zoomAt(1.2,CX,CY);
$('zout').onclick=()=>zoomAt(1/1.2,CX,CY);
$('zreset').onclick=()=>{state.view={k:1,x:0,y:0};applyView();};
svg.addEventListener('dblclick',e=>{if(!e.target.closest('.node,.center')){state.view={k:1,x:0,y:0};applyView();}});
let drag=null,moved=false;
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node,.center')) return;
  drag={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y,s:svg.getScreenCTM().a};moved=false;
  stage.classList.add('dragging');svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)/drag.s,dy=(e.clientY-drag.y)/drag.s;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;state.view.x=drag.vx+dx;state.view.y=drag.vy+dy;applyView();});
const endDrag=()=>{drag=null;stage.classList.remove('dragging');};
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('click',e=>{
  const g=e.target.closest('.node,.center,.elabel'); if(!g) return;
  state.sel=+g.dataset.i; renderMap(); renderDetail();
});

/* ---------- 本义档案 ---------- */
function renderOrigin(){
  const d=CH[state.idx], o=d.origin;
  $('olv').innerHTML='判定把握：'+lvBadge(o.lv);
  $('osw').innerHTML = o.sw ? `<div class="sw">${hl(o.sw,o.sw.includes(d.trad)?d.trad:d.c)}</div><div class="swnote">${esc(o.swNote)}</div>`
                            : `<div class="sw none">${lvBadge('待查')} 暂无可引用的《说文》原文</div><div class="swnote">${esc(o.swNote)}</div>`;
  $('oevo').innerHTML = o.evo.map(([n,t])=>`<div class="st"><div class="ph"><span><b>${/未见/.test(t)?'—':(n==='楷书'||n==='简化'||n==='今字'||n==='今义'?d.c:d.trad)}</b>${/未见|待查/.test(t)?'待补':'字形占位'}</span></div><div class="sn">${esc(n)}</div><div class="sd">${esc(t)}</div></div>`).join('');
  $('oreason').innerHTML = esc(o.why) + (o.cls?`<div class="cls" style="margin-top:10px"><div class="ct2">${hl(o.cls.t,d.trad)}</div><div class="src">— ${esc(o.cls.src)} ${lvBadge(o.cls.lv)}</div><div class="tr">译：${esc(o.cls.tr)}</div></div>`:'');
}

/* ---------- 右侧：详情 ---------- */
function clsBlock(c,d){
  if(!c) return `<div class="cls none">${lvBadge('待查')} 暂未找到可靠的文言用例，不作编造。</div>`;
  const z=c.t.includes(d.trad)?d.trad:d.c;
  return `<div class="cls"><div class="ct2">${hl(c.t,z)}</div><div class="src">出处：${esc(c.src)} ${lvBadge(c.lv)}</div><div class="tr">译文：${esc(c.tr)}</div></div>`;
}
function renderDetail(){
  const d=CH[state.idx], el=$('detail');
  if(state.sel<0){
    const o=d.origin;
    el.innerHTML=`<h3 class="ct">义项详情</h3>
      <div class="dhead"><span class="type" style="--c:var(--seal)">本义</span><h2>${esc(o.m)}</h2>${lvBadge(o.lv)}</div>
      <div class="whybox"><b>为什么这是本义？</b>${esc(o.why)}</div>
      <div class="blk"><h4>文言原句</h4>${clsBlock(o.cls,d)}</div>
      <div class="empty" style="padding:14px 0 2px"><b>👆</b>点击外圈的义项，看看“${d.c}”的意思是怎么一步步长大的</div>`;
    return;
  }
  const s=d.senses[state.sel], T=TYPE[s.k];
  el.innerHTML=`<h3 class="ct">义项详情</h3>
    <div class="dhead"><span class="type" style="--c:${T.c}">${s.k}</span><h2>${esc(s.t)}</h2></div>
    <div class="whybox"><b>为什么能这样变？</b>${esc(s.why)}</div>
    <div class="blk"><h4>词族（3个）</h4><div class="chips">${s.words.map(w=>`<span class="chip">${hl(w,d.c)}</span>`).join('')}</div></div>
    <div class="blk"><h4>构词拆解</h4><div class="split">${hl(s.split,d.c)}</div></div>
    <div class="blk"><h4>现代例句 <span class="tag-s">示例</span></h4><div class="ex">${hl(s.ex,d.c)}</div></div>
    <div class="blk"><h4>文言原句</h4>${clsBlock(s.cls,d)}</div>
    <div class="lvline">把握程度：${lvBadge(s.lv)} <span>${esc(LV[s.lv].d)}</span></div>`;
}

/* ---------- 右侧：偏旁 / 易错 / 密码 ---------- */
function renderSide(){
  const d=CH[state.idx];
  const rcls=r=>/兼/.test(r)?'both':(/音/.test(r)?'yin':'yi');
  $('parts').innerHTML=`<div class="parts"><div class="pbig">${d.c}</div><div class="plist">${d.parts.map(p=>`
     <div class="pp"><span class="pf">${esc(p.f.split('（')[0])}</span><div><span class="pr ${rcls(p.role)}">${esc(p.role)}</span>${p.f.includes('（')?` <small style="color:var(--muted)">${esc(p.f.slice(p.f.indexOf('（')))}</small>`:''}<div class="pn">${esc(p.note)}</div></div></div>`).join('')}</div></div>
     <div class="pstruct">结构：${esc(d.struct)}　繁体/古字：<span style="font-family:var(--kai);font-size:16px;color:var(--ink)">${esc(d.trad)}</span></div>`;
  $('err').innerHTML = d.read.map(r=>`<div class="row"><span class="ic r">易读错</span><span>${esc(r)}</span></div>`).join('')
                     + d.write.map(w=>`<div class="row"><span class="ic w">易写错</span><span>${esc(w)}</span></div>`).join('');
  $('code').innerHTML = d.code.map(c=>`<div class="rule"><b>${esc(c.t)}</b><p>${esc(c.d)}</p></div>`).join('');
}

/* ---------- 切换 ---------- */
function go(i){
  state.idx=(i+CH.length)%CH.length; state.sel=-1; state.view={k:1,x:0,y:0}; state.seen.add(state.idx);
  const d=CH[state.idx];
  $('hz').textContent=d.c; $('hpy').textContent=d.py;
  $('hmeta').textContent=`${d.struct} · ${d.senses.length} 个扩展义项 · 第 ${state.idx+1}/${CH.length} 字`;
  $('hm').textContent=d.origin.m;
  renderList(); renderMap(); renderOrigin(); renderDetail(); renderSide();
  if(location.hash!=='#'+d.c) history.replaceState(null,'','#'+encodeURIComponent(d.c));
}
$('prev').onclick=()=>go(state.idx-1);
$('next').onclick=()=>go(state.idx+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(state.idx-1);
  else if(e.key==='ArrowRight')go(state.idx+1);
  else if(e.key==='Escape'){state.sel=-1;renderMap();renderDetail();}
});
$('foot').textContent=DATA.meta.note;

const h=decodeURIComponent(location.hash.slice(1)), hi=CH.findIndex(d=>d.c===h);
go(hi>=0?hi:0);
})();
</script>
</body>
</html>
