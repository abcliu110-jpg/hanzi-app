<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 儿童汉字学习</title>
<style>
:root{
  --paper:#fbf7ef; --paper2:#f4ecdc; --ink:#2d2a26; --ink2:#6b6358; --line:#e3d8c3;
  --red:#c8553d; --red-soft:#f6e1d9; --teal:#2a7f7a; --gold:#d9a441; --card:#fffdf8;
  --t-yin:#2a7f7a; --t-bi:#d9822b; --t-zhuan:#7b5ea7; --t-jia:#c8553d;
  --c-ok:#3c8d5a; --c-mid:#d9a441; --c-q:#b0563f;
  --shadow:0 6px 22px rgba(80,60,30,.10);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;}
.kai{font-family:"STKaiti","KaiTi","楷体","Kaiti SC","AR PL UKai CN",serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* 顶部一级菜单 */
header{display:flex;align-items:center;gap:18px;padding:10px 22px;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.05);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.logo .seal{width:36px;height:36px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px}
nav.top{display:flex;gap:4px;flex-wrap:wrap}
nav.top button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14.5px;color:var(--ink2);cursor:pointer;font-family:inherit}
nav.top button:hover{background:var(--paper2);color:var(--ink)}
nav.top button.on{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(200,85,61,.3)}
.main{display:grid;grid-template-columns:150px 1fr 360px;min-height:0}
/* 二级菜单 */
aside.chars{border-right:1px solid var(--line);background:var(--paper2);overflow:auto;padding:14px 10px}
aside.chars h3{font-size:12px;color:var(--ink2);margin:2px 6px 10px;letter-spacing:2px}
.charlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.charlist button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;transition:.15s;font-family:inherit}
.charlist button .z{font-size:26px;line-height:1.15}
.charlist button .p{font-size:11px;color:var(--ink2)}
.charlist button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.charlist button.on{background:var(--red);border-color:var(--red);color:#fff}
.charlist button.on .p{color:#ffe9e2}
/* 中央图 */
section.stage{position:relative;min-width:0;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,#fffaf0 0,#fbf7ef 55%,#f5eedf 100%)}
.stage .title{position:absolute;left:20px;top:16px;z-index:2;pointer-events:none}
.stage .title .big{font-size:40px;font-weight:700;line-height:1}
.stage .title .sub{font-size:13px;color:var(--ink2);margin-top:6px}
.tools{position:absolute;right:16px;top:16px;z-index:2;display:flex;gap:6px}
.tools button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:17px;box-shadow:var(--shadow);color:var(--ink)}
.tools button:hover{background:var(--paper2)}
.legend{position:absolute;left:20px;bottom:16px;z-index:2;background:rgba(255,253,248,.92);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow);max-width:calc(100% - 40px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:4px;border-radius:2px;display:inline-block}
.legend .dot{width:9px;height:9px;border-radius:50%}
.hint{position:absolute;right:16px;bottom:16px;font-size:12px;color:var(--ink2);z-index:2}
svg#map{width:100%;height:100%;cursor:grab;display:block;touch-action:none}
svg#map.drag{cursor:grabbing}
.node{cursor:pointer}
.node rect{transition:.15s}
.node:hover rect{filter:drop-shadow(0 4px 8px rgba(80,60,30,.2))}
.edgeLabel div{font-size:11.5px;line-height:1.35;color:var(--ink2);text-align:center}
.edgeLabel .pill{display:inline-block;color:#fff;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;margin-bottom:2px}
/* 右侧栏 */
aside.side{border-left:1px solid var(--line);overflow:auto;padding:14px;background:var(--paper)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(80,60,30,.04)}
.card h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h4 .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#fff}
.card p{margin:6px 0;font-size:13.5px;line-height:1.7}
.lbl{font-size:12px;color:var(--ink2);margin-top:10px;margin-bottom:4px;font-weight:600;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper2);border-radius:999px;padding:3px 10px;font-size:13px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;font-weight:600}
.tag.demo{background:#e8f1f0;color:var(--teal)}
.tag.ok{background:#e3f1e7;color:var(--c-ok)}
.tag.mid{background:#fbefd6;color:#9a6c12}
.tag.q{background:#f6e1d9;color:var(--c-q)}
.quote{border-left:3px solid var(--gold);background:#fdf6e6;padding:8px 10px;border-radius:0 10px 10px 0;font-size:14.5px;line-height:1.7}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.trans{font-size:13px;color:var(--ink);margin-top:4px}
.parts{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.part{flex:1;min-width:90px;border-radius:12px;padding:8px;text-align:center;border:1px dashed var(--line)}
.part .pz{font-size:28px}
.part .pr{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;display:inline-block;margin:3px 0}
.part.yi .pr{background:#e8f1f0;color:var(--teal)}
.part.yin .pr{background:#fbefd6;color:#9a6c12}
.part.fu .pr{background:#eee7f6;color:var(--t-zhuan)}
.part .pn{font-size:12px;color:var(--ink2);line-height:1.5}
ul.tight{margin:4px 0;padding-left:18px;font-size:13.5px;line-height:1.7}
.forms{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.forms div{flex:1;min-width:52px;border:1px dashed #d6c7a8;border-radius:10px;text-align:center;padding:6px 2px;font-size:11px;color:var(--ink2);background:#fffaf0}
.forms div b{display:block;font-size:12px;color:var(--ink);margin-bottom:2px}
.empty{color:var(--ink2);font-size:13px;text-align:center;padding:10px}
.placeholder{display:grid;place-items:center;height:100%;color:var(--ink2);font-size:16px;text-align:center}
.placeholder .zz{font-size:64px;color:var(--line)}
@media (max-width:1100px){.main{grid-template-columns:120px 1fr 300px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="seal kai">字</div>小字源 · 汉字乐园</div>
    <nav class="top" id="topnav"></nav>
  </header>
  <div class="main" id="main">
    <aside class="chars"><h3>本组 20 字</h3><div class="charlist" id="charlist"></div></aside>
    <section class="stage" id="stage">
      <div class="title"><div class="big kai" id="tChar"></div><div class="sub" id="tSub"></div></div>
      <div class="tools">
        <button id="zin" title="放大">＋</button><button id="zout" title="缩小">－</button><button id="zreset" title="复位">⟲</button>
      </div>
      <svg id="map"><g id="vp"></g></svg>
      <div class="legend">
        <span><i style="background:var(--t-yin)"></i>引申</span>
        <span><i style="background:var(--t-bi)"></i>比喻</span>
        <span><i style="background:var(--t-zhuan)"></i>转喻</span>
        <span><i style="background:var(--t-jia)"></i>假借</span>
        <span>｜</span>
        <span><b class="dot" style="background:var(--c-ok)"></b>确定</span>
        <span><b class="dot" style="background:var(--c-mid)"></b>通行说法</span>
        <span><b class="dot" style="background:var(--c-q)"></b>待查</span>
      </div>
      <div class="hint">滚轮缩放 · 拖动平移 · 点击义项看详情</div>
    </section>
    <aside class="side" id="side"></aside>
  </div>
</div>

"conf": "确定"
}
],
"side": {
"structure": "上下结构 · 形声",
"parts": [
{
"z": "酉",
"role": "yi",
"r": "表义",
"n": "和酒、发酵有关"
},
{
"z": "将（省）",
"role": "yin",
"r": "表音",
"n": "读 jiàng/jiāng"
}
],
"misread": [
"读 jiàng（第四声），不读 jiāng。"
],
"miswrite": [
"下面是“酉”，不是“西”；上面左边是“丬”。"
],
"code": {

]

},
{

"shuowen": "赁，庸也。从贝，任声。",

"detail": {

],

"modern": "老师讲，古时有人靠替人舂米谋生。",
"classic": {
"text": "居庑下，为人赁舂。",
"src": "《后汉书·梁鸿传》",
"trans": "住在别人家的廊屋下，受雇给人家舂米。"
},
"conf": "通行说法"
}
},
"senses": [
{
"id": "s1",
"from": "root",
"name": "租用（房屋、东西）",
"type": "引申",
"reason": "出钱借人的力气，变成出钱借用别人的东西。",
"words": [

],

},
{

],

}
],

},
{

"n": "和钱财有关"
}
],
"misread": [
"读 lìn（第四声），不读 rèn 或 lín。"
],
"miswrite": [

],
"code": {

<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const MENU = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const TYPE_COLOR = {'引申':'#2a7f7a','比喻':'#d9822b','转喻':'#7b5ea7','假借':'#c8553d'};
const CONF = {'确定':['ok','#3c8d5a'],'通行说法':['mid','#d9a441'],'待查':['q','#b0563f']};
const SVGNS='http://www.w3.org/2000/svg';
let curMenu=0, curChar=0, curSel='root';
const $=id=>document.getElementById(id);
function el(tag,attrs,kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='text')e.textContent=attrs[k];else if(k==='cls')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(c=>c&&e.appendChild(c));return e;}
function sv(tag,attrs){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function confTag(c){const t=el('span',{cls:'tag '+(CONF[c]||CONF['待查'])[0],text:c});return t;}

/* 顶部菜单 */
const nav=$('topnav');
MENU.forEach((m,i)=>{const b=el('button',{text:m});b.onclick=()=>{curMenu=i;renderAll();};nav.appendChild(b);});
/* 字表 */
const list=$('charlist');
DATA.chars.forEach((c,i)=>{const b=el('button',{},[el('span',{cls:'z kai',text:c.c}),el('span',{cls:'p',text:c.py})]);b.onclick=()=>{curChar=i;curSel='root';resetView();renderAll();};list.appendChild(b);});

/* 视图缩放 */
const svg=$('map'), vp=$('vp');
let view={x:0,y:0,k:1};
function applyView(){vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function resetView(){const r=svg.getBoundingClientRect();view={x:r.width/2,y:r.height/2+20,k:Math.min(1,Math.min(r.width,r.height)/980)};applyView();}
function zoomAt(f,cx,cy){const nk=Math.max(.3,Math.min(3,view.k*f));const s=nk/view.k;view.x=cx-(cx-view.x)*s;view.y=cy-(cy-view.y)*s;view.k=nk;applyView();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyView();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$('zreset').onclick=resetView;
window.addEventListener('resize',resetView);

/* 布局：中心本义，一级放射，二级沿父方向外推 */
function layout(ch){
  const pos={root:{x:0,y:0,a:0,d:0}};
  const kids=id=>ch.senses.filter(s=>s.from===id);
  const l1=kids('root'); const n=l1.length;
  l1.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n+(n===2?Math.PI/2:0);pos[s.id]={x:Math.cos(a)*260,y:Math.sin(a)*230,a:a,d:1};});
  function place(pid,depth){const p=pos[pid];const ks=kids(pid);const span=ks.length>1?0.55:0;
    ks.forEach((s,i)=>{const a=p.a+(ks.length>1?(-span/2+i*span/(ks.length-1)):0);const R=260+depth*200;pos[s.id]={x:Math.cos(a)*R,y:Math.sin(a)*R*0.88,a:a,d:depth+1};place(s.id,depth+1);});}
  l1.forEach(s=>place(s.id,1));
  return pos;
}
function wrap(t,n){const out=[];for(let i=0;i<t.length;i+=n)out.push(t.slice(i,i+n));return out;}

function renderMap(){
  const ch=DATA.chars[curChar]; vp.innerHTML='';
  const pos=layout(ch);
  const gE=sv('g',{}), gL=sv('g',{}), gN=sv('g',{});
  vp.append(gE,gL,gN);
  // 装饰圆环
  [260,460].forEach(r=>gE.appendChild(sv('ellipse',{cx:0,cy:0,rx:r,ry:r*0.88,fill:'none',stroke:'#eadfca','stroke-dasharray':'4 8'})));
  ch.senses.forEach(s=>{
    const a=pos[s.from], b=pos[s.id], col=TYPE_COLOR[s.type]||'#888';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const nx=-(b.y-a.y), ny=(b.x-a.x), L=Math.hypot(nx,ny)||1;
    const cx=mx+nx/L*28, cy=my+ny/L*28;
    gE.appendChild(sv('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':s.id===curSel?4:2.6,'stroke-linecap':'round',opacity:.85,'stroke-dasharray':s.type==='假借'?'7 6':'none'}));
    const fo=sv('foreignObject',{x:cx-75,y:cy-28,width:150,height:64,class:'edgeLabel'});
    const div=document.createElement('div');
    div.style.cssText='background:rgba(255,253,248,.92);border-radius:10px;padding:3px 6px;border:1px solid '+col+'33';
    const pill=el('span',{cls:'pill',text:s.type}); pill.style.background=col;
    div.append(pill, el('div',{text:s.reason}));
    div.lastChild.style.cssText='font-size:11px;max-height:30px;overflow:hidden';
    div.title=s.type+'：'+s.reason;
    fo.appendChild(div); gL.appendChild(fo);
  });
  // 根节点
  const root=sv('g',{class:'node',transform:'translate(0,0)'});
  root.appendChild(sv('circle',{r:92,fill:curSel==='root'?'#c8553d':'#fffdf8',stroke:'#c8553d','stroke-width':3}));
  root.appendChild(sv('circle',{r:80,fill:'none',stroke:curSel==='root'?'#f6c9bb':'#f1d6cc','stroke-dasharray':'3 5'}));
  const tz=sv('text',{y:-14,'text-anchor':'middle','font-size':58,class:'kai',fill:curSel==='root'?'#fff':'#2d2a26'});tz.textContent=ch.c;root.appendChild(tz);
  const tb=sv('text',{y:22,'text-anchor':'middle','font-size':12,'font-weight':700,fill:curSel==='root'?'#ffe6de':'#c8553d'});tb.textContent='本义';root.appendChild(tb);
  wrap(ch.root.meaning.replace(/（.*?）/g,''),9).slice(0,2).forEach((ln,i)=>{const t=sv('text',{y:42+i*16,'text-anchor':'middle','font-size':12.5,fill:curSel==='root'?'#fff':'#6b6358'});t.textContent=ln;root.appendChild(t);});
  root.onclick=()=>{curSel='root';renderMap();renderSide();};
  gN.appendChild(root);
  // 义项节点
  ch.senses.forEach(s=>{
    const p=pos[s.id], col=TYPE_COLOR[s.type], sel=s.id===curSel;
    const lines=wrap(s.name,8).slice(0,3); const w=150, h=34+lines.length*17;
    const g=sv('g',{class:'node',transform:`translate(${p.x},${p.y})`});
    g.appendChild(sv('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:sel?col:'#fffdf8',stroke:col,'stroke-width':sel?3:2}));
    const cc=CONF[s.conf]||CONF['待查'];
    g.appendChild(sv('circle',{cx:w/2-12,cy:-h/2+12,r:5,fill:cc[1],stroke:'#fff','stroke-width':1.5}));
    const w0=sv('text',{x:0,y:-h/2+20,'text-anchor':'middle','font-size':12.5,'font-weight':700,fill:sel?'#fff':col});w0.textContent=s.words[0];g.appendChild(w0);
    lines.forEach((ln,i)=>{const t=sv('text',{x:0,y:-h/2+40+i*17,'text-anchor':'middle','font-size':13.5,fill:sel?'#fff':'#2d2a26'});t.textContent=ln;g.appendChild(t);});
    g.onclick=()=>{curSel=s.id;renderMap();renderSide();};
    gN.appendChild(g);
  });
  $('tChar').textContent=ch.c+'  '+ch.py;
  $('tSub').textContent='本义 + '+ch.senses.length+' 个常用义项 · 点击卡片查看详情';
}

function quoteBlock(cl){
  if(!cl) return [el('p',{},[document.createTextNode('文言原句：'),confTag('待查')])];
  return [el('div',{cls:'quote kai',text:cl.text}),el('div',{cls:'src',text:'出处：'+cl.src}),el('div',{cls:'trans',text:'译文：'+cl.trans})];
}
function detailCard(ch){
  const card=el('div',{cls:'card'});
  if(curSel==='root'){
    const r=ch.root;
    const h=el('h4',{},[el('span',{cls:'ic',text:'本'}),document.createTextNode('本义：'+r.meaning)]);h.firstChild.style.background='#c8553d';
    card.append(h,
      el('div',{cls:'lbl',text:'《说文》原文'}), el('div',{cls:'quote kai',text:r.shuowen}), el('div',{cls:'src'},[document.createTextNode('把握程度'),confTag(r.swConf)]),
      el('div',{cls:'lbl',text:'字形演变'}));
    const f=el('div',{cls:'forms'});DATA.stages.forEach(st=>f.appendChild(el('div',{},[el('b',{text:st}),document.createTextNode(st==='楷书'?ch.c:'图待补')])));
    card.append(f, el('p',{cls:'src',text:r.formsNote}), el('div',{cls:'lbl',text:'为什么这是本义'}), el('p',{text:r.reason}));
    if(r.detail){const d=r.detail;
      card.append(el('div',{cls:'lbl',text:'词族'}),chipBox(d.words),el('div',{cls:'lbl',text:'构词拆解'}),el('p',{text:d.parse}),
        el('div',{cls:'lbl',text:'现代例句'}),el('p',{},[document.createTextNode(d.modern),el('span',{cls:'tag demo',text:'示例'})]),
        el('div',{cls:'lbl',text:'文言原句'}),...quoteBlock(d.classic),el('div',{cls:'lbl',text:'把握程度'}),confTag(d.conf));}
    return card;
  }
  const s=ch.senses.find(x=>x.id===curSel); const col=TYPE_COLOR[s.type];
  const parent=s.from==='root'?'本义':ch.senses.find(x=>x.id===s.from).name;
  const h=el('h4',{},[el('span',{cls:'ic',text:s.type[0]}),document.createTextNode(s.name)]);h.firstChild.style.background=col;
  card.append(h, el('p',{cls:'src',text:'由「'+parent+'」→ '+s.type+'：'+s.reason}),
    el('div',{cls:'lbl',text:'词族'}),chipBox(s.words),
    el('div',{cls:'lbl',text:'构词拆解'}),el('p',{text:s.parse}),
    el('div',{cls:'lbl',text:'现代例句'}),el('p',{},[document.createTextNode(s.modern),el('span',{cls:'tag demo',text:'示例'})]),
    el('div',{cls:'lbl',text:'文言原句'}),...quoteBlock(s.classic),
    el('div',{cls:'lbl',text:'把握程度'}),confTag(s.conf));
  return card;
}
function chipBox(ws){const b=el('div',{cls:'chips'});ws.forEach(w=>b.appendChild(el('span',{cls:'chip',text:w})));return b;}

function renderSide(){
  const side=$('side'); side.innerHTML=''; const ch=DATA.chars[curChar]; const sd=ch.side;
  side.appendChild(detailCard(ch));
  // 偏旁拆分
  const c1=el('div',{cls:'card'});const h1=el('h4',{},[el('span',{cls:'ic',text:'拆'}),document.createTextNode('偏旁拆分 · '+sd.structure)]);h1.firstChild.style.background='#2a7f7a';
  const ps=el('div',{cls:'parts'});sd.parts.forEach(p=>ps.appendChild(el('div',{cls:'part '+p.role},[el('div',{cls:'pz kai',text:p.z}),el('div',{cls:'pr',text:p.r}),el('div',{cls:'pn',text:p.n})])));
  c1.append(h1,ps); side.appendChild(c1);
  // 易错
  const c2=el('div',{cls:'card'});const h2=el('h4',{},[el('span',{cls:'ic',text:'!'}),document.createTextNode('易读错 · 易写错')]);h2.firstChild.style.background='#b0563f';
  const u1=el('ul',{cls:'tight'});sd.misread.forEach(t=>u1.appendChild(el('li',{text:t})));
  const u2=el('ul',{cls:'tight'});sd.miswrite.forEach(t=>u2.appendChild(el('li',{text:t})));
  c2.append(h2,el('div',{cls:'lbl',text:'读音'}),u1,el('div',{cls:'lbl',text:'字形'}),u2); side.appendChild(c2);
  // 密码
  const c3=el('div',{cls:'card'});const h3=el('h4',{},[el('span',{cls:'ic',text:'密'}),document.createTextNode('汉字密码：'+sd.code.title)]);h3.firstChild.style.background='#d9a441';
  const ex=el('div',{cls:'chips'});sd.code.ex.forEach(z=>ex.appendChild(el('span',{cls:'chip kai',text:z})));ex.querySelectorAll('.chip').forEach(c=>c.style.fontSize='18px');
  c3.append(h3,el('p',{text:sd.code.text}),ex); side.appendChild(c3);
}

function renderAll(){
  [...nav.children].forEach((b,i)=>b.classList.toggle('on',i===curMenu));
  [...list.children].forEach((b,i)=>b.classList.toggle('on',i===curChar));
  const stage=$('stage');
  let ph=document.getElementById('ph');
  if(curMenu!==0){
    if(!ph){ph=el('div',{id:'ph',cls:'placeholder'});ph.style.cssText+='position:absolute;inset:0;background:var(--paper);z-index:3';stage.appendChild(ph);}
    ph.innerHTML='';ph.append(el('div',{},[el('div',{cls:'zz kai',text:DATA.chars[curChar].c}),el('div',{text:'「'+MENU[curMenu]+'」模块即将上线'}),el('div',{cls:'src',text:'本文件只实现「字义扩展图」'})]));
  } else if(ph){ph.remove();}
  renderMap(); renderSide();
}
resetView(); renderAll();
})();
</script>
