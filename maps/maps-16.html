<style>
/* ---------- 本页 ---------- */
:root{--t-yin:#4C7DF0;--t-bi:#F59E3A;--t-zhuan:#8B6CEF;--t-jia:#E8505B}

.left,.right{position:sticky;top:calc(var(--xzq-topbar-h) + 18px);max-height:calc(100vh - var(--xzq-topbar-h) - 36px);overflow:auto;scrollbar-width:thin}
.left{background:#fff;border-radius:22px;padding:12px;box-shadow:var(--xzq-shadow)}

.zlist button:hover{background:var(--xzq-meaning-soft)}
.zlist button .z{font-family:var(--xzq-kai);font-size:28px;font-weight:700;line-height:1.1;display:block}
.zlist button small{font-size:11px;color:var(--xzq-muted);font-weight:700}
.zlist button.on{background:var(--xzq-meaning);color:#fff;box-shadow:0 3px 0 #2F5BC4}
.zlist button.on small{color:#DCE6FF}
.zlist button .seen{position:absolute;right:5px;top:3px;font-size:10px;color:var(--xzq-review)}
.zlist button.on .seen{color:#B8FFE9}

.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.head .big{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#4C7DF0,#7FA2FF);color:#fff;display:grid;place-items:center;font-family:var(--xzq-kai);font-size:52px;font-weight:700;box-shadow:0 5px 0 #2F5BC4}
.head h1{margin:0;font-size:22px}
.head .sub{color:var(--xzq-muted);font-size:14px}
.head .nav2{margin-left:auto;display:flex;gap:8px}
.mapcard{position:relative;background:#fff;border-radius:24px;box-shadow:var(--xzq-shadow);overflow:hidden}
.mapcard svg{display:block;width:100%;height:600px;cursor:grab;touch-action:none;background:
  radial-gradient(circle at 50% 50%,#F4F7FF 0,#fff 60%);}
.mapcard svg.drag{cursor:grabbing}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button{width:36px;height:36px;border-radius:12px;border:2px solid var(--xzq-line);background:#fff;font-size:18px;font-weight:800;color:var(--xzq-ink)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;background:rgba(255,255,255,.9);padding:6px 10px;border-radius:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--xzq-muted);background:rgba(255,255,255,.9);padding:4px 10px;border-radius:10px}
.node{cursor:pointer}
.node rect.bx{transition:.15s}
.node:hover rect.bx{stroke-width:4}
.node.sel rect.bx{stroke-width:5;filter:drop-shadow(0 6px 10px rgba(43,42,76,.18))}
.cnode{cursor:pointer}
.edge{transition:opacity .2s}
.dim{opacity:.28}

.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{margin:0;font-size:20px}

.sure.s3{background:#F1EEE8;color:#8A8698}

.toast.show{opacity:1;transform:translateX(-50%)}

</head>

<script>

const TYPE={'引申':'var(--t-yin)','比喻':'var(--t-bi)','转喻':'var(--t-zhuan)','假借':'var(--t-jia)'};
const TYPEHEX={'引申':'#4C7DF0','比喻':'#F59E3A','转喻':'#8B6CEF','假借':'#E8505B'};
const SURE={'确定':'s1','通行说法':'s2','待查':'s3'};

/* 路径：本文件放在 maps/ 文件夹里时，其他页面在上一级 */
const BASE=/\/maps\/[^\/]*$/.test(location.pathname)?'../':'';
const NAV=[['字义扩展图','jie-ziyi-kuozhan-tu.html',1],['偏旁部首','pianpang-bushou.html'],['声旁音部','pianpang-bushou.html#shengpang'],['字词句','zicijv.html'],['汉字密码','hanzi-mima.html'],['易错诊所','yicuo-fuxi.html'],['记忆复习','yicuo-fuxi.html#review'],['学习路径','index.html#path']];
document.getElementById('nav').innerHTML=NAV.map(([n,f,on])=>'<a href="'+BASE+f+'"'+(on?' class="on"':'')+'>'+n+'</a>').join('');
document.getElementById('home').href=BASE+'index.html';

/* 存储（与其他页面共用） */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function markLearned(zi){const l=LS.get('xzq_learned',[]);if(!l.some(x=>x.zi===zi)){l.push({zi,date:today()});LS.set('xzq_learned',l)}}
const meanKey=(c,s)=>c+':'+s.n;
const hasMean=k=>LS.get('xzq_meanings',[]).includes(k);
function toggleMean(k){let m=LS.get('xzq_meanings',[]);if(m.includes(k))m=m.filter(x=>x!==k);else m.push(k);LS.set('xzq_meanings',m);toast(m.includes(k)?'已记为掌握的义项':'已取消');renderDetail()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 状态 */
let cur=0,sel=-1;
function pick(){const q=new URLSearchParams(location.search).get('zi')||decodeURIComponent(location.hash.slice(1));const i=DATA.findIndex(d=>d.c===q);return i<0?0:i}

/* 左侧字表 */
function renderList(){
  const L=LS.get('xzq_learned',[]).map(x=>x.zi);
  document.getElementById('zlist').innerHTML=DATA.map((d,i)=>'<button class="'+(i===cur?'on':'')+'" onclick="go('+i+')"><span class="z">'+d.c+'</span><small>'+d.center.py.split('（')[0]+'</small>'+(L.includes(d.c)?'<span class="seen">●</span>':'')+'</button>').join('');
}
function go(i){cur=i;sel=-1;history.replaceState(null,'','#'+encodeURIComponent(DATA[i].c));markLearned(DATA[i].c);resetView();renderAll()}

/* 头部 */
function renderHead(){
  const d=DATA[cur];
  document.getElementById('head').innerHTML='<div class="big">'+d.c+'</div><div><h1>“'+d.c+'”的字义扩展图</h1><div class="sub">本义：'+esc(d.center.ben)+' · 共 '+d.senses.length+' 个常用义项</div></div>'+
   '<div class="nav2"><button class="xzq-btn ghost sm" onclick="go('+((cur+DATA.length-1)%DATA.length)+')">← '+DATA[(cur+DATA.length-1)%DATA.length].c+'</button><button class="xzq-btn sm" style="background:var(--xzq-meaning);box-shadow:0 3px 0 #2F5BC4" onclick="go('+((cur+1)%DATA.length)+')">'+DATA[(cur+1)%DATA.length].c+' →</button></div>';
}

/* SVG 义项网 */
function wrap(s,n,max){const out=[];for(let i=0;i<s.length&&out.length<max;i+=n)out.push(s.slice(i,i+n));if(s.length>n*max)out[max-1]=out[max-1].slice(0,n-1)+'…';return out}
function renderMap(){
  const d=DATA[cur],N=d.senses.length,R=N<=3?285:300,RX=R*1.32,RY=R*0.86;
  let edges='',labels='',nodes='';
  d.senses.forEach((s,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/N, x=Math.cos(a)*RX, y=Math.sin(a)*RY;
    const col=TYPEHEX[s.t]||'#999',dim=sel>=0&&sel!==i?' dim':'';
    edges+='<line class="edge'+dim+'" x1="0" y1="0" x2="'+x+'" y2="'+y+'" stroke="'+col+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(s.t==='假借'?'10 8':'0')+'"/>';
    const tt=0.5+0.1*Math.abs(Math.sin(a)),mx=x*tt,my=y*tt,lines=wrap(s.why,11,3),w=156,h=30+lines.length*17;
    labels+='<g class="edge'+dim+'" transform="translate('+mx+','+my+')"><rect x="'+(-w/2)+'" y="'+(-h/2)+'" width="'+w+'" height="'+h+'" rx="12" fill="#fff" stroke="'+col+'" stroke-opacity=".35" stroke-width="1.5"/>'+
      '<rect x="-24" y="'+(-h/2+6)+'" width="48" height="20" rx="10" fill="'+col+'"/><text x="0" y="'+(-h/2+20.5)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">'+s.t+'</text>'+
      lines.map((l,k)=>'<text x="0" y="'+(-h/2+43+k*17)+'" text-anchor="middle" font-size="12" fill="#55536F">'+esc(l)+'</text>').join('')+'</g>';
    const nw=184,nh=70,name=s.n.length>11?s.n.slice(0,10)+'…':s.n;
    nodes+='<g class="node'+(sel===i?' sel':'')+dim+'" onclick="selSense('+i+')" transform="translate('+x+','+y+')"><rect class="bx" x="'+(-nw/2)+'" y="'+(-nh/2)+'" width="'+nw+'" height="'+nh+'" rx="18" fill="#fff" stroke="'+col+'" stroke-width="2.5"/>'+
      '<text x="0" y="-6" text-anchor="middle" font-size="17" font-weight="800" fill="#2B2A4C">'+esc(name)+'</text>'+
      '<text x="0" y="18" text-anchor="middle" font-size="13" fill="'+col+'" font-weight="700">'+s.py+' · '+s.t+(hasMean(meanKey(d.c,s))?' · ✓':'')+'</text></g>';
  });
  const center='<g class="cnode" onclick="selSense(-1)"><circle r="88" fill="url(#cg)" stroke="#fff" stroke-width="6"/><circle r="96" fill="none" stroke="#4C7DF0" stroke-opacity=".25" stroke-width="3" stroke-dasharray="4 8"/>'+
    '<text y="20" text-anchor="middle" font-size="70" font-weight="700" fill="#fff" style="font-family:var(--xzq-kai)">'+d.c+'</text>'+
    '<rect x="-26" y="36" width="52" height="20" rx="10" fill="#fff" fill-opacity=".25"/><text y="50.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">本义</text>'+
    '<text y="-50" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" fill-opacity=".9">'+esc(d.center.py)+'</text></g>';
  document.getElementById('vp').innerHTML='<defs><radialGradient id="cg" cx="35%" cy="30%"><stop offset="0" stop-color="#7FA2FF"/><stop offset="1" stop-color="#3D63D8"/></radialGradient></defs>'+edges+center+labels+nodes;
  applyView();
}
function selSense(i){sel=(sel===i&&i>=0)?-1:i;renderMap();renderDetail();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}

/* 缩放与平移 */
let V={k:1,x:0,y:0};
function applyView(){document.getElementById('vp').setAttribute('transform','translate('+V.x+','+V.y+') scale('+V.k+')')}
function resetView(){V={k:1,x:0,y:0};applyView()}
function zoom(f,cx=0,cy=0){const k=Math.min(2.6,Math.max(.45,V.k*f));const r=k/V.k;V.x=cx-(cx-V.x)*r;V.y=cy-(cy-V.y)*r;V.k=k;applyView()}
const svg=document.getElementById('map');
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e);zoom(e.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.cnode'))return;drag={p:svgPt(e),x:V.x,y:V.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svgPt(e);V.x=drag.x+(p.x-drag.p.x);V.y=drag.y+(p.y-drag.p.y);applyView()});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag')});
document.getElementById('zin').onclick=()=>zoom(1.2);
document.getElementById('zout').onclick=()=>zoom(1/1.2);
document.getElementById('zreset').onclick=resetView;

/* 详情 */
function sureBadge(s){return '<span class="sure '+(SURE[s]||'s3')+'">把握程度：'+s+'</span>'}
function renderDetail(){
  const d=DATA[cur],el=document.getElementById('detail');
  if(sel<0){const c=d.center;
    el.innerHTML='<div class="dhead"><h2>本义 · '+esc(c.ben)+'</h2><span class="py">'+esc(c.py)+'</span>'+sureBadge(c.sure)+'</div>'+
     '<div class="dgrid"><div class="box full"><h4>《说文解字》原文</h4><div class="sw">'+esc(c.sw)+'</div></div>'+
     '<div class="box full"><h4>字形演变（字形图占位，待补图片）</h4><div class="forms">'+c.forms.split(' → ').map(f=>'<div><b>'+d.c+'</b>'+f+'</div>').join('')+'</div></div>'+
     '<div class="box full"><h4>本义判定理由</h4><div class="why">'+esc(c.reason)+'</div></div></div>'+
     '<p class="xzq-muted" style="font-size:13px;margin:10px 0 0">点击外圈的义项，看它是怎样从本义变化来的。</p>';
    return;}
  const s=d.senses[sel],k=meanKey(d.c,s),has=hasMean(k);
  el.innerHTML='<div class="dhead"><h2>'+esc(s.n)+'</h2><span class="py">'+s.py+'</span><span class="tbadge" style="background:'+TYPE[s.t]+'">'+s.t+'</span>'+sureBadge(s.sure)+
   '<button class="xzq-btn sm" style="margin-left:auto;'+(has?'background:var(--xzq-review);box-shadow:0 3px 0 #17836F':'background:var(--xzq-meaning);box-shadow:0 3px 0 #2F5BC4')+'" onclick="toggleMean(\''+k.replace(/'/g,"\\'")+'\')">'+(has?'✓ 已掌握':'我掌握了这个义项')+'</button></div>'+
   '<div class="why" style="margin-bottom:12px;border-color:'+TYPE[s.t]+'"><b>为什么是“'+s.t+'”？</b>'+esc(s.why)+'</div>'+
   '<div class="dgrid"><div class="box"><h4>词族</h4><div class="fam">'+s.fam.map(f=>'<span>'+esc(f)+'</span>').join('')+'</div></div>'+
   '<div class="box"><h4>构词拆解</h4><div>'+esc(s.parse)+'</div></div>'+
   '<div class="box full"><h4>现代例句</h4><div class="ex"><span class="tag demo">示例</span>'+esc(s.ex)+'</div></div>'+
   '<div class="box full"><h4>文言原句</h4>'+(s.cl?'<div class="cl">'+esc(s.cl.t)+'</div><div class="cl-src">——'+esc(s.cl.src)+'</div><div class="cl-tr"><b>译文：</b>'+esc(s.cl.tr)+'</div>':'<div class="xzq-muted">待查（暂未收录可靠的文言出处）</div>')+'</div></div>';
}

/* 右侧栏 */
function roleCls(r){return r.startsWith('表义')?'r-yi':r.startsWith('表音')?'r-yin':'r-ji'}
function renderRight(){
  const d=DATA[cur],sd=d.side;
  document.getElementById('right').innerHTML=
   '<div class="xzq-card"><h3>🧩 偏旁拆分</h3><div class="parts">'+sd.parts.map(p=>'<div class="part '+roleCls(p.r)+'"><div class="pz">'+esc(p.p)+'</div><div class="pr">'+esc(p.r)+'</div></div>').join('')+'</div>'+
     '<p class="xzq-muted" style="font-size:12px;margin-top:8px">绿色＝表义部分　紫色＝表音部分　灰色＝独体或记号</p></div>'+
   '<div class="xzq-card"><h3>🩺 易读错 · 易写错</h3><div class="lab">易读错</div><p>'+esc(sd.read)+'</p><div class="sep"></div><div class="lab w">易写错</div><p>'+esc(sd.write)+'</p>'+
     '<p style="margin-top:10px"><a class="xzq-btn ghost sm" href="'+BASE+'yicuo-fuxi.html">去易错诊所练一练</a></p></div>'+
   '<div class="xzq-card" style="background:linear-gradient(150deg,#FCE6F2,#fff 65%)"><h3>🔐 相关汉字密码</h3><p>'+esc(sd.code)+'</p><p style="margin-top:10px"><a class="xzq-btn sm" style="background:var(--xzq-code);box-shadow:0 3px 0 #A83A76" href="'+BASE+'hanzi-mima.html">更多汉字密码 →</a></p></div>'+
   '<div class="xzq-card"><h3>📏 把握程度说明</h3><p style="font-size:13px"><span class="sure s1">确定</span> 有可靠文献或学界共识<br><span class="sure s2" style="display:inline-block;margin-top:6px">通行说法</span> 常见解释，但仍有不同意见<br><span class="sure s3" style="display:inline-block;margin-top:6px">待查</span> 来源或解释还需要核实</p></div>';
}

function renderAll(){renderList();renderHead();renderMap();renderDetail();renderRight()}
cur=pick();markLearned(DATA[cur].c);renderAll();
window.addEventListener('hashchange',()=>{const i=pick();if(i!==cur){cur=i;sel=-1;renderAll()}});
</script>
