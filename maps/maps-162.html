<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 识字星球</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2f2a24; --ink2:#6b6257; --ink3:#a2978a;
  --line:#e7dccb; --brand:#d9643a; --brand-soft:#fbe6dc;
  --t-yin:#2a9d8f; --t-bi:#e08a2e; --t-zhuan:#8467c4; --t-jia:#5b84b8;
  --ok:#3f9b5a; --mid:#c99417; --todo:#c8553d;
  --r:16px; --shadow:0 6px 24px rgba(80,60,30,.10); --shadow-s:0 2px 8px rgba(80,60,30,.08);
  --kai:"STKaiti","KaiTi","Kaiti SC","楷体","Noto Serif SC","Songti SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,rgba(150,120,80,.10) 1px,transparent 0);background-size:22px 22px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{display:grid;grid-template-rows:64px 1fr;height:100vh}

/* 顶部一级菜单 */
header{display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow-s);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#f08a5d,#d9643a);color:#fff;font-style:normal;font-family:var(--kai);font-size:22px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(217,100,58,.35)}
.logo small{display:block;font-size:11px;color:var(--ink3);font-weight:400}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{padding:9px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
nav.top button:hover{background:#f3ebdf;color:var(--ink)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(217,100,58,.3)}
nav.top button .soon{font-size:10px;opacity:.6;margin-left:3px}

.main{display:grid;grid-template-columns:168px 1fr 360px;min-height:0}

/* 左侧二级菜单 */
aside.left{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.sec-title{font-size:12px;color:var(--ink3);letter-spacing:.1em;margin:2px 6px 10px}
.charlist{display:flex;flex-direction:column;gap:6px}
.charlist button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-align:left;transition:.18s;border:1px solid transparent}
.charlist button:hover{background:#f7efe3}
.charlist button.on{background:var(--brand-soft);border-color:#f2c3ad}
.charlist .ch{font-family:var(--kai);font-size:26px;width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#f6efe4;flex:none}
.charlist button.on .ch{background:var(--brand);color:#fff}
.charlist .meta{min-width:0}
.charlist .py{font-size:12px;color:var(--brand);font-weight:600}
.charlist .gist{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:82px}

/* 中央义项网 */
section.stage-wrap{position:relative;min-width:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px 0}
.toolbar h1{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.toolbar h1 .big{font-family:var(--kai);font-size:30px;color:var(--brand)}
.toolbar h1 .sub{font-size:12px;color:var(--ink3);font-weight:400}
.toolbar .sp{flex:1}
.tbtn{height:34px;min-width:34px;padding:0 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:14px;color:var(--ink2);box-shadow:var(--shadow-s);transition:.15s}
.tbtn:hover{color:var(--brand);border-color:#f0c2ac}
.zoomval{font-size:12px;color:var(--ink3);width:42px;text-align:center}
.stage{position:relative;flex:1;margin:12px 18px 0;border-radius:22px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;cursor:grab;touch-action:none}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1300px;height:900px;transform-origin:0 0}
.world svg{position:absolute;left:0;top:0;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 22px 14px;font-size:12px;color:var(--ink2)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .bar{width:22px;height:0;border-top:3px solid}
.legend .bar.dash{border-top-style:dashed}
.legend .dot{width:9px;height:9px;border-radius:50%}
.hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--ink3);background:rgba(255,253,248,.85);padding:4px 10px;border-radius:999px;pointer-events:none}

.center-node{position:absolute;width:200px;height:200px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7ef,#fde3d4 70%);border:3px solid var(--brand);box-shadow:0 10px 30px rgba(217,100,58,.25),0 0 0 10px rgba(217,100,58,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform .2s;animation:pop .45s ease both}
.center-node:hover{transform:translate(-50%,-50%) scale(1.03)}
.center-node.sel{box-shadow:0 10px 30px rgba(217,100,58,.35),0 0 0 14px rgba(217,100,58,.16)}
.center-node .tag{font-size:11px;background:var(--brand);color:#fff;padding:2px 10px;border-radius:999px;letter-spacing:.15em}
.center-node .zi{font-family:var(--kai);font-size:72px;line-height:1.05;margin-top:2px}
.center-node .p{font-size:13px;color:var(--brand);font-weight:600}
.center-node .m{font-size:13px;color:var(--ink2);margin-top:3px;padding:0 22px;line-height:1.35}

.sense-node{position:absolute;width:184px;transform:translate(-50%,-50%);background:#fff;border-radius:16px;border:2px solid;padding:10px 12px 10px;box-shadow:var(--shadow-s);cursor:pointer;transition:transform .18s,box-shadow .18s;animation:pop .45s ease both}
.sense-node:hover{transform:translate(-50%,-50%) translateY(-3px);box-shadow:var(--shadow)}
.sense-node.sel{box-shadow:0 0 0 5px rgba(217,100,58,.18),var(--shadow)}
.sense-node .no{position:absolute;top:-11px;left:12px;font-size:11px;color:#fff;padding:1px 9px;border-radius:999px}
.sense-node .lb{font-size:15px;font-weight:700;line-height:1.35;margin-top:3px}
.sense-node .lb em{font-style:normal;font-size:12px;color:var(--brand);margin-left:4px;font-weight:600}
.sense-node .wd{font-size:12px;color:var(--ink2);margin-top:5px}
.sense-node .ct{position:absolute;right:10px;top:-9px;font-size:10px;padding:1px 7px;border-radius:999px;background:#fff;border:1px solid}

.edge-label{position:absolute;width:168px;transform:translate(-50%,-50%);background:rgba(255,253,248,.96);border-radius:12px;border:1px dashed var(--line);padding:6px 9px;font-size:12px;line-height:1.45;color:var(--ink2);text-align:center;animation:fade .5s ease both;pointer-events:none}
.edge-label .chip{margin-bottom:3px}

@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.chip{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:1px 9px;border-radius:999px;letter-spacing:.05em}
.c-引申{background:var(--t-yin)}.c-比喻{background:var(--t-bi)}.c-转喻{background:var(--t-zhuan)}.c-假借{background:var(--t-jia)}
.cert{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid;font-weight:600}
.k-确定{color:var(--ok);border-color:var(--ok);background:#eef7f0}
.k-通行说法{color:var(--mid);border-color:var(--mid);background:#fbf5e3}
.k-待查{color:var(--todo);border-color:var(--todo);background:#fbecE8}
.k-未收{color:var(--ink2);border-color:var(--ink3);background:#f4f0ea}

/* 右侧栏 */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:14px;box-shadow:var(--shadow-s)}
.card h3{font-size:13px;color:var(--ink3);letter-spacing:.08em;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--brand)}
.detail-head{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.detail-head .ttl{font-size:18px;font-weight:700;flex-basis:100%}
.detail-head .ttl em{font-style:normal;font-size:13px;color:var(--brand);margin-left:6px}
.field{margin-top:12px}
.field .k{font-size:12px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.field .v{font-size:14px;line-height:1.7}
.why{background:#f8f4ec;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.6}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{font-family:var(--kai);font-size:17px;padding:3px 11px;border-radius:10px;background:#fdf0e8;color:#9b4524;border:1px solid #f6d3c1}
.quote{border-left:3px solid var(--brand);padding:6px 10px;background:#fdf8f2;border-radius:0 10px 10px 0;font-family:var(--kai);font-size:16px;line-height:1.65}
.src{font-size:12px;color:var(--ink2);margin-top:5px}
.tr{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.6}
.tr b{color:var(--ink);font-weight:600}
.pending{font-size:13px;color:var(--todo);background:#fbefeb;border-radius:10px;padding:8px 10px;line-height:1.55}
.demo{font-size:10px;color:#fff;background:var(--ink3);padding:1px 7px;border-radius:6px;margin-left:4px;vertical-align:2px}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo div{border:1px dashed #d9cbb5;border-radius:10px;padding:6px 2px 5px;text-align:center;background:#fffaf2}
.evo .g{height:38px;display:grid;place-items:center;font-size:10.5px;color:var(--ink3);line-height:1.2}
.evo .g.real{font-family:var(--kai);font-size:30px;color:var(--ink)}
.evo .n{font-size:11px;color:var(--ink2);margin-top:2px}
.evo-note{font-size:11.5px;color:var(--ink3);margin-top:6px}

.parts{display:flex;gap:10px;align-items:stretch}
.part{flex:1;border-radius:12px;padding:10px;text-align:center}
.part.yi{background:#e9f5f2;border:1px solid #bfe1d9}
.part.yin{background:#eef2fa;border:1px solid #c9d6ec}
.part .pz{font-family:var(--kai);font-size:34px;line-height:1.1}
.part .pl{font-size:11px;font-weight:700;margin-top:2px}
.part.yi .pl{color:var(--t-yin)}.part.yin .pl{color:var(--t-jia)}
.part .pd{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.5}
.plus{align-self:center;font-size:20px;color:var(--ink3)}
.pnote{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.6}
ul.warn{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.warn li{font-size:13.5px;line-height:1.6;padding-left:26px;position:relative}
ul.warn li::before{position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
ul.warn li.r::before{content:"读";background:#e07a5f}
ul.warn li.w::before{content:"写";background:#81a67a}
ol.code{list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:8px}
ol.code li{counter-increment:c;font-size:13.5px;line-height:1.6;padding:8px 10px 8px 34px;background:#f7f3fb;border-radius:10px;position:relative}
ol.code li::before{content:counter(c);position:absolute;left:10px;top:9px;width:17px;height:17px;border-radius:50%;background:var(--t-zhuan);color:#fff;font-size:11px;display:grid;place-items:center}

.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1180px){.main{grid-template-columns:150px 1fr 310px}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#e2d6c3;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i>字</i><div>识字星球<small>儿童汉字学习</small></div></div>
    <nav class="top" id="topnav"></nav>
  </header>
  <div class="main">
    <aside class="left">
      <div class="sec-title">本组 20 字</div>
      <div class="charlist" id="charlist"></div>
    </aside>
    <section class="stage-wrap">
      <div class="toolbar">
        <h1><span class="big" id="tChar"></span><span id="tTitle">字义扩展图</span><span class="sub" id="tSub"></span></h1>
        <div class="sp"></div>
        <button class="tbtn" id="prev" title="上一个字（↑）">‹ 上一字</button>
        <button class="tbtn" id="next" title="下一个字（↓）">下一字 ›</button>
        <button class="tbtn" id="zout" title="缩小">－</button>
        <span class="zoomval" id="zval">100%</span>
        <button class="tbtn" id="zin" title="放大">＋</button>
        <button class="tbtn" id="zfit" title="复位">复位</button>
      </div>
      <div class="stage" id="stage">
        <div class="world" id="world"></div>
        <div class="hint">滚轮缩放 · 拖动平移 · 点击义项看详情</div>
      </div>
      <div class="legend">
        <span class="lg"><span class="bar" style="border-color:var(--t-yin)"></span>引申</span>
        <span class="lg"><span class="bar" style="border-color:var(--t-bi)"></span>比喻</span>
        <span class="lg"><span class="bar" style="border-color:var(--t-zhuan)"></span>转喻</span>
        <span class="lg"><span class="bar dash" style="border-color:var(--t-jia)"></span>假借</span>
        <span style="width:10px"></span>
        <span class="lg"><span class="dot" style="background:var(--ok)"></span>确定</span>
        <span class="lg"><span class="dot" style="background:var(--mid)"></span>通行说法</span>
        <span class="lg"><span class="dot" style="background:var(--todo)"></span>待查</span>
      </div>
    </section>
    <aside class="right" id="right">
      <div class="card" id="detail"></div>
      <div class="card" id="partsCard"></div>
      <div class="card" id="wrongCard"></div>
      <div class="card" id="codeCard"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

 "code":["“丑”作声旁读 niu：扭（手）、纽（绳）、钮（金）、妞（女）。","女字旁的称呼：妞、妈、姐、妹、姑。"]},

{"c":"巍","py":"wēi","gist":"高大",
 "origin":{"meaning":"高大","shuowen":"巍，高也。从嵬，委聲。","swStatus":"确定","swNote":"“嵬”是山高的样子。","reason":"上面“山”加“鬼”组成“嵬”，表示高山，《说文》说“高也”。雄伟、崇高、稳固都由“高大”引申，所以这是本义。","cert":"确定"},
 "senses":[
  {"label":"山高大雄伟","type":"引申","why":"高大的样子最常用来形容山和建筑。","words":["巍峨","巍巍","巍峨壮观"],"build":"巍峨 ＝ 巍（高）＋ 峨（高），两字同义","ex":"巍峨的长城在群山间蜿蜒。","cl":null,"cert":"确定"},
  {"label":"崇高伟大","type":"比喻","why":"品德、功业像高山一样让人仰望。","words":["巍巍乎","功德巍巍","巍然可敬"],"build":"巍巍乎 ＝ 巍巍（崇高）＋ 乎（啊）","ex":"人们赞美英雄的功绩巍巍如山。","cl":{"t":"巍巍乎！唯天为大，唯尧则之。","src":"《论语·泰伯》","tr":"多么崇高啊！只有天最高大，只有尧能效法天。"},"cert":"确定"},
  {"label":"稳固不动","type":"比喻","why":"高山稳稳地立着不倒，比喻坚定不动摇。","words":["巍然屹立","巍然不动","巍然"],"build":"巍然屹立 ＝ 巍然（高大稳固）＋ 屹立（挺立）","ex":"人民英雄纪念碑巍然屹立在广场上。","cl":null,"cert":"确定"}
 ],
 "parts":{"yi":{"p":"嵬","d":"山＋鬼：表示山高"},"yin":{"p":"委","d":"wěi → wēi，表音"},"note":"字分三块：上“山”，左下“委”，右下“鬼”；《说文》分析为“从嵬，委声”。"},
 "wrong":{"read":["读一声 wēi，不要读成 wéi 或 wèi（魏）。"],"write":["上面有“山”，去掉“山”就成了“魏”。","右下“鬼”头上的短撇不要漏写。"]},
 "code":["“委”族字：萎、魏、巍、倭，读音多为 wei；“矮”读 ǎi 是例外。","有山没山不一样：巍（高大）、魏（国名、姓）。"]}
]
}

</script>

<script>
(function(){
const DB = JSON.parse(document.getElementById('char-data').textContent);
const CH = DB.chars;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TCOLOR = {"引申":"var(--t-yin)","比喻":"var(--t-bi)","转喻":"var(--t-zhuan)","假借":"var(--t-jia)"};
const KCOLOR = {"确定":"var(--ok)","通行说法":"var(--mid)","待查":"var(--todo)"};
let cur = 0, sel = 'o';
const W=1300,H=900,CX=650,CY=450,R=335;
const view={x:0,y:0,k:1};

/* 顶部菜单 */
const nav=$('#topnav');
DB.modules.forEach((m,i)=>{
  const b=document.createElement('button');
  b.innerHTML = i===0? esc(m) : esc(m)+'<span class="soon">·待开放</span>';
  if(i===0) b.className='on';
  b.onclick=()=>{ if(i!==0) toast('「'+m+'」模块正在建设中，敬请期待'); };
  nav.appendChild(b);
});
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800);}

/* 左侧字表 */
const list=$('#charlist');
CH.forEach((d,i)=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="ch">${esc(d.c)}</span><span class="meta"><div class="py">${esc(d.py)}</div><div class="gist">${esc(d.gist)}</div></span>`;
  b.onclick=()=>go(i);
  list.appendChild(b);
});

function go(i){
  cur=(i+CH.length)%CH.length; sel='o';
  [...list.children].forEach((b,j)=>b.classList.toggle('on',j===cur));
  list.children[cur].scrollIntoView({block:'nearest'});
  renderMap(); renderSide(); renderDetail(); fit();
}

/* 义项网 */
function renderMap(){
  const d=CH[cur], n=d.senses.length, world=$('#world');
  $('#tChar').textContent=d.c;
  $('#tSub').textContent=`${d.py} · ${n} 个常用义项 · 第 ${cur+1}/${CH.length} 字`;
  const start = n===2?0:-90, step=360/n;
  const pts=d.senses.map((s,i)=>{const a=(start+i*step)*Math.PI/180;return {x:CX+R*Math.cos(a),y:CY+R*Math.sin(a)*0.92};});
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <circle cx="${CX}" cy="${CY}" r="${R*0.55}" fill="none" stroke="#efe5d6" stroke-dasharray="3 7"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#f3ebde" stroke-dasharray="2 9"/>`;
  d.senses.forEach((s,i)=>{const p=pts[i],c=TCOLOR[s.type];
    svg+=`<line x1="${CX}" y1="${CY}" x2="${p.x}" y2="${p.y}" stroke="${c}" stroke-width="3" stroke-linecap="round" ${s.type==='假借'?'stroke-dasharray="9 7"':''} opacity=".85"/>`;
    svg+=`<circle cx="${p.x}" cy="${p.y}" r="5" fill="${c}"/>`;
  });
  svg+='</svg>';
  let html=svg;
  d.senses.forEach((s,i)=>{const p=pts[i];
    const lx=CX+(p.x-CX)*0.52, ly=CY+(p.y-CY)*0.52;
    html+=`<div class="edge-label" style="left:${lx}px;top:${ly}px;animation-delay:${.15+i*.07}s"><span class="chip c-${s.type}">${s.type}</span><div>${esc(s.why)}</div></div>`;
  });
  html+=`<div class="center-node ${sel==='o'?'sel':''}" data-k="o" style="left:${CX}px;top:${CY}px"><span class="tag">本 义</span><div class="zi">${esc(d.c)}</div><div class="p">${esc(d.py)}</div><div class="m">${esc(d.origin.meaning)}</div></div>`;
  d.senses.forEach((s,i)=>{const p=pts[i],c=TCOLOR[s.type],k=s.cert;
    html+=`<div class="sense-node ${sel===i?'sel':''}" data-k="${i}" style="left:${p.x}px;top:${p.y}px;border-color:${c};animation-delay:${.1+i*.07}s">
      <span class="no" style="background:${c}">义项 ${i+1}</span>
      <span class="ct" style="color:${KCOLOR[k]};border-color:${KCOLOR[k]}">${k}</span>
      <div class="lb">${esc(s.label)}${s.py?`<em>${esc(s.py)}</em>`:''}</div>
      <div class="wd">${s.words.map(esc).join(' · ')}</div></div>`;
  });
  world.innerHTML=html;
  world.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('pointerdown',e=>e.stopPropagation());
    el.addEventListener('click',()=>{const k=el.dataset.k;sel=k==='o'?'o':+k;
      world.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('sel',x===el));renderDetail();});
  });
}

/* 详情 */
function classicBlock(cl,cert){
  if(!cl) return `<div class="pending">待查：暂未找到可核实的文言原句，宁缺勿编。</div>`;
  return `<div class="quote">${esc(cl.t)}</div><div class="src">—— ${esc(cl.src)}${cert?` <span class="cert k-${cert}">${cert}</span>`:''}</div><div class="tr"><b>译文：</b>${esc(cl.tr)}</div>`;
}
function renderDetail(){
  const d=CH[cur], box=$('#detail');
  if(sel==='o'){
    const o=d.origin;
    const stages=['甲骨文','金文','小篆','隶书','楷书'];
    const evo=stages.map((s,i)=>{
      const real=i===4;
      const g= real? esc(d.c) : (o.late&&i<3? '无此<br>字形' : '字形图<br>待补');
      return `<div><div class="g ${real?'real':''}">${g}</div><div class="n">${s}</div></div>`;}).join('');
    box.innerHTML=`<h3>义项详情 · 本义</h3>
      <div class="detail-head"><div class="ttl">${esc(d.c)}<em>${esc(d.py)}</em></div><span class="chip" style="background:var(--brand)">本义</span><span class="cert k-${o.cert}">${o.cert}</span></div>
      <div class="field"><div class="k">本义</div><div class="v"><b>${esc(o.meaning)}</b></div></div>
      <div class="field"><div class="k">《说文解字》原文 <span class="cert k-${o.swStatus}">${o.swStatus==='未收'?'未收录':o.swStatus}</span></div>
        <div class="quote">${esc(o.shuowen)}</div>${o.swNote?`<div class="src">${esc(o.swNote)}</div>`:''}</div>
      <div class="field"><div class="k">字形演变（占位）</div><div class="evo">${evo}</div>
        <div class="evo-note">${o.late?'后起字，古文字阶段无对应字形；':''}古文字字形图待插入，此处为文字占位。</div></div>
      <div class="field"><div class="k">本义判定理由</div><div class="why">${esc(o.reason)}</div></div>
      ${o.words?`<div class="field"><div class="k">词族</div><div class="words">${o.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>`:''}
      ${o.cl?`<div class="field"><div class="k">文言原句</div>${classicBlock(o.cl,o.clCert||'确定')}</div>`:''}
      <div class="field"><div class="k">提示</div><div class="v" style="font-size:13px;color:var(--ink2)">点击外圈的义项，看看这个字的意思是怎么“长”出来的。</div></div>`;
  } else {
    const s=d.senses[sel];
    box.innerHTML=`<h3>义项详情 · 义项 ${sel+1}</h3>
      <div class="detail-head"><div class="ttl">${esc(s.label)}${s.py?`<em>${esc(s.py)}</em>`:''}</div><span class="chip c-${s.type}">${s.type}</span><span class="cert k-${s.cert}">把握：${s.cert}</span></div>
      <div class="field"><div class="k">从本义到这里</div><div class="why">${esc(d.origin.meaning)} → ${esc(s.label)}：${esc(s.why)}</div></div>
      <div class="field"><div class="k">词族</div><div class="words">${s.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
      <div class="field"><div class="k">构词拆解</div><div class="v">${esc(s.build)}</div></div>
      <div class="field"><div class="k">现代例句<span class="demo">示例</span></div><div class="v">${esc(s.ex)}</div></div>
      <div class="field"><div class="k">文言原句</div>${classicBlock(s.cl, s.cl? (s.clCert||'确定'):null)}</div>
      <div class="field"><div class="k">把握程度</div><div class="v"><span class="cert k-${s.cert}">${s.cert}</span>
        <span style="font-size:12px;color:var(--ink3);margin-left:6px">${{'确定':'辞书与古籍用例一致','通行说法':'常见解释，学界或有不同意见','待查':'来源或演变路线还需核实'}[s.cert]}</span></div></div>`;
  }
  box.style.animation='none';box.offsetHeight;box.style.animation='fade .35s ease';
}

/* 侧栏：偏旁 / 易错 / 密码 */
function renderSide(){
  const d=CH[cur],p=d.parts;
  $('#partsCard').innerHTML=`<h3>偏旁拆分</h3>
    <div class="parts"><div class="part yi"><div class="pz">${esc(p.yi.p)}</div><div class="pl">表义部分</div><div class="pd">${esc(p.yi.d)}</div></div>
    <div class="plus">＋</div>
    <div class="part yin"><div class="pz">${esc(p.yin.p)}</div><div class="pl">表音部分</div><div class="pd">${esc(p.yin.d)}</div></div></div>
    <div class="pnote">${esc(p.note)}</div>`;
  $('#wrongCard').innerHTML=`<h3>易读错 · 易写错</h3><ul class="warn">
    ${d.wrong.read.map(t=>`<li class="r">${esc(t)}</li>`).join('')}
    ${d.wrong.write.map(t=>`<li class="w">${esc(t)}</li>`).join('')}</ul>`;
  $('#codeCard').innerHTML=`<h3>相关汉字密码</h3><ol class="code">${d.code.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`;
}

/* 缩放与平移 */
const stage=$('#stage'), world=$('#world');
function apply(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;$('#zval').textContent=Math.round(view.k*100)+'%';}
function fit(){const w=stage.clientWidth,h=stage.clientHeight;view.k=Math.min(w/W,h/H)*0.98;view.x=(w-W*view.k)/2;view.y=(h-H*view.k)/2;apply();}
function zoomAt(f,px,py){const nk=Math.max(.35,Math.min(2.6,view.k*f));view.x=px-(px-view.x)*nk/view.k;view.y=py-(py-view.y)*nk/view.k;view.k=nk;apply();}
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};stage.classList.add('drag');stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;apply();});
const end=()=>{drag=null;stage.classList.remove('drag');};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
$('#zin').onclick=()=>zoomAt(1.2,stage.clientWidth/2,stage.clientHeight/2);
$('#zout').onclick=()=>zoomAt(1/1.2,stage.clientWidth/2,stage.clientHeight/2);
$('#zfit').onclick=fit;
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();go(cur-1);}if(e.key==='ArrowDown'){e.preventDefault();go(cur+1);}});
window.addEventListener('resize',fit);

go(0);
})();
</script>
</body>
</html>
