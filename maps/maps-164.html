<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#fbf7ef; --card:#ffffff; --ink:#2b2a33; --sub:#6c6878; --line:#e9e2d4;
  --brand:#2f8f83; --brand-soft:#e3f3f0; --accent:#e9774b;
  --yin:#2f8f83; --bi:#e9874b; --zhuan:#7b5fc4; --jia:#c2546b;
  --ok:#2e9a5b; --tong:#3b78c4; --cha:#d8962b;
  --radius:16px; --shadow:0 6px 24px rgba(60,50,30,.08);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink)}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
/* top */
.top{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(60,50,30,.04);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo .seal{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f8f83,#4fb3a5);color:#fff;display:grid;place-items:center;font-size:19px;font-family:"STKaiti","KaiTi","Kaiti SC",serif}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--sub);white-space:nowrap;transition:.15s}
.nav button:hover{background:#f3eee3;color:var(--ink)}
.nav button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(47,143,131,.3)}
.nav button .soon{font-size:10px;margin-left:4px;opacity:.6}
/* layout */
.app{flex:1;display:grid;grid-template-columns:200px 1fr 360px;min-height:0}
.left{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.left h3{margin:16px 16px 4px;font-size:14px}
.left .tip{margin:0 16px 10px;font-size:12px;color:var(--sub)}
.list{overflow:auto;padding:4px 10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.list button{border:1px solid var(--line);background:#fffdf8;border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.list button b{font-size:24px;font-weight:500;font-family:"STKaiti","KaiTi","Kaiti SC",serif;line-height:1.1}
.list button span{font-size:11px;color:var(--sub)}
.list button:hover{border-color:var(--brand);transform:translateY(-1px)}
.list button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.list button.on span{color:#dff4f0}
/* stage */
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.charbar{display:flex;align-items:center;gap:16px;padding:14px 20px 10px}
.bigchar{width:68px;height:68px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:46px;font-family:"STKaiti","KaiTi","Kaiti SC",serif;position:relative}
.bigchar:before{content:"";position:absolute;inset:8px;border:1px dashed #e6c9b8;border-radius:8px;background:linear-gradient(transparent 49.5%,#f2dfd4 49.5%,#f2dfd4 50.5%,transparent 50.5%),linear-gradient(90deg,transparent 49.5%,#f2dfd4 49.5%,#f2dfd4 50.5%,transparent 50.5%);z-index:-0;opacity:.8}
.bigchar span{position:relative}
.cinfo .py{font-size:15px;color:var(--brand);font-weight:600}
.cinfo .bn{font-size:20px;font-weight:700;margin:2px 0}
.cinfo .swl{font-size:13px;color:var(--sub)}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);max-width:330px;justify-content:flex-end}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.mapwrap{flex:1;position:relative;margin:0 16px 16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  background-image:radial-gradient(#efe7d8 1px,transparent 1px);background-size:22px 22px}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#map.drag{cursor:grabbing}
.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.zoomctl button:hover{border-color:var(--brand);color:var(--brand)}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:999px}
/* svg styles */
.node{cursor:pointer}
.node rect{fill:#fff;stroke:#ddd3c2;stroke-width:1.5;transition:.15s}
.node:hover rect{stroke:var(--brand)}
.node.sel rect{stroke-width:3}
.node text{font-size:15px;fill:var(--ink);font-weight:600}
.node .tag{font-size:11px;font-weight:600}
.center circle.outer{fill:#fff7ef;stroke:#f0c9ae;stroke-width:2}
.center circle.inner{fill:url(#cg)}
.center.sel circle.outer{stroke:var(--accent);stroke-width:4}
.edge{fill:none;stroke-width:2.6}
.elabel rect{fill:#fff;stroke-width:1.2}
.elabel text{font-size:12px;fill:#55516a}
.elabel .ty{font-size:12px;font-weight:700;fill:#fff}
/* right panel */
.right{background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 30px}
.sec{margin-bottom:18px}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.sec h4:before{content:"";width:4px;height:13px;border-radius:2px;background:var(--brand)}
.stitle{font-size:21px;font-weight:700;margin:2px 0 8px;line-height:1.35}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;color:#fff;font-weight:600}
.badge.c-确定{background:var(--ok)} .badge.c-通行说法{background:var(--tong)} .badge.c-待查{background:var(--cha)}
.box{background:#fbf8f2;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.quote{font-family:"STKaiti","KaiTi","Kaiti SC",serif;font-size:16px}
.src{font-size:12px;color:var(--sub);margin-top:4px}
.tr{font-size:13px;color:#4c4858;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:10px;background:var(--brand-soft);color:#1f6f65;font-size:14px;font-weight:600}
.evo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.evo div{border:1px dashed #d9cdb8;border-radius:10px;text-align:center;padding:8px 2px 6px;background:#fffdf8}
.evo .g{height:38px;display:grid;place-items:center;font-size:11px;color:#b3a790}
.evo .g.k{font-size:30px;color:var(--ink);font-family:"STKaiti","KaiTi","Kaiti SC",serif}
.evo .n{font-size:11px;color:var(--sub)}
.evo .st{font-size:10px;color:var(--cha)}
.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.path .p{padding:3px 9px;border-radius:8px;background:#f3eee3}
.ex .lab{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#fde7dc;color:#b6532a;margin-right:6px;font-weight:600;vertical-align:1px}
.pending{color:#9b6b12;background:#fff6e3;border-color:#f1dcae}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.part{border-radius:12px;padding:10px;border:1px solid var(--line)}
.part .k{font-size:11px;font-weight:700;letter-spacing:1px}
.part.f{background:#eef7f5}.part.f .k{color:var(--brand)}
.part.s{background:#fdf1ea}.part.s .k{color:var(--accent)}
.part .pc{font-size:22px;font-family:"STKaiti","KaiTi","Kaiti SC",serif;margin:2px 0}
.part .pd{font-size:12px;color:#55516a;line-height:1.5}
.err{display:grid;gap:8px}
.err div{font-size:14px;line-height:1.6;padding:8px 10px;border-radius:10px;background:#fbf2f3;border-left:3px solid var(--jia)}
.err b{color:var(--jia);margin-right:4px}
.code{font-size:14px;line-height:1.7;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#f1ecff,#f8f5ff);border:1px solid #e2d9fb}
.code:before{content:"🔑 ";}
.divider{height:1px;background:var(--line);margin:18px 0}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:#2b2a33;color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){.app{grid-template-columns:170px 1fr 300px}.legend{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><div class="seal">字</div>汉字探索</div>
  <nav class="nav" id="nav"></nav>
</header>
<div class="app">
  <aside class="left">
    <h3>本组 20 字</h3>
    <p class="tip">点一个字，查看它的义项网</p>
    <div class="list" id="list"></div>
  </aside>
  <main class="stage">
    <div class="charbar">
      <div class="bigchar"><span id="bc"></span></div>

      <div class="legend">
        <span><i style="background:var(--yin)"></i>引申</span>
        <span><i style="background:var(--bi)"></i>比喻</span>
        <span><i style="background:var(--zhuan)"></i>转喻</span>
        <span><i style="background:var(--jia);background:repeating-linear-gradient(90deg,var(--jia) 0 5px,transparent 5px 8px)"></i>假借</span>
      </div>
    </div>
    <div class="mapwrap">
      <svg id="map"><defs>
        <radialGradient id="cg" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#ff9c6e"/><stop offset="100%" stop-color="#e9774b"/></radialGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a4a30" flood-opacity=".12"/></filter>

      <div class="zoomctl"><button id="zin" title="放大">＋</button><button id="zout" title="缩小">－</button><button id="zfit" title="复位">⤢</button></div>
      <div class="hint">滚轮缩放 · 拖动平移 · 点击义项看详情</div>
    </div>
  </main>
  <aside class="right" id="panel"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const MENUS = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const TYPE_COLOR = {'引申':'#2f8f83','比喻':'#e9874b','转喻':'#7b5fc4','假借':'#c2546b','本义':'#e9774b'};
const NS = 'http://www.w3.org/2000/svg';
let cur = 0, sel = 0, view = {x:0,y:0,k:1};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* nav */
MENUS.forEach((m,i)=>{
  const b=document.createElement('button');
  b.innerHTML = esc(m) + (i? '<span class="soon">即将上线</span>':'');
  if(!i) b.className='on';
  b.onclick=()=>{ if(i) toast('「'+m+'」模块正在建设中，先来看看字义扩展图吧'); };
  $('nav').appendChild(b);
});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);}

/* list */
DATA.forEach((d,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<b>'+esc(d.c)+'</b><span>'+esc(d.py.split(' / ')[0])+'</span>';
  b.onclick=()=>load(i);
  $('list').appendChild(b);
});

function wrap(text, n){ const a=[...text]; const out=[]; for(let i=0;i<a.length;i+=n) out.push(a.slice(i,i+n).join('')); return out; }
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* layout */
function layout(d){
  const s=d.s, pos=[{x:0,y:0,a:0}];
  const kids = i => s.map((x,j)=>j).filter(j=>j>0 && s[j].from===i);
  const l1 = kids(0), n=l1.length;
  const R1 = 390, R2 = 690;
  const startA = n===2 ? -160 : -90;
  const step = n===2 ? 140 : 360/n;
  l1.forEach((j,k)=>{
    const a = startA + step*k;
    pos[j]={x:R1*Math.cos(a*Math.PI/180), y:R1*Math.sin(a*Math.PI/180), a};
    const l2=kids(j);
    l2.forEach((q,m)=>{
      const b = a + (m-(l2.length-1)/2)*34;
      pos[q]={x:R2*Math.cos(b*Math.PI/180), y:R2*Math.sin(b*Math.PI/180), a:b};
    });
  });
  return pos;
}

function drawMap(){
  const d=DATA[cur], vp=$('vp'); vp.innerHTML='';
  const pos=layout(d);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  const NW=180, NH=74;
  d.s.forEach((s,i)=>{
    if(i===0) return;
    const p=pos[s.from], c=pos[i], col=TYPE_COLOR[s.type]||'#999';
    // slight curve
    const mx=(p.x+c.x)/2, my=(p.y+c.y)/2, dx=c.x-p.x, dy=c.y-p.y, len=Math.hypot(dx,dy);
    const off=len*0.06, cx=mx - dy/len*off, cy=my + dx/len*off;
    el('path',{d:`M${p.x},${p.y} Q${cx},${cy} ${c.x},${c.y}`,class:'edge',stroke:col,'stroke-dasharray':s.type==='假借'?'9 7':'none','stroke-linecap':'round'},gE);
    // label
    const lines=wrap(s.why,12);
    const lw=168, lh=30+lines.length*17;
    const lx=(p.x+2*cx+c.x)/4, ly=(p.y+2*cy+c.y)/4;
    const g=el('g',{class:'elabel',transform:`translate(${lx-lw/2},${ly-lh/2})`},gL);
    el('rect',{width:lw,height:lh,rx:12,stroke:col,filter:'url(#sh)'},g);
    el('rect',{x:10,y:7,width:44,height:20,rx:10,fill:col,stroke:'none'},g);
    const t=el('text',{x:32,y:21,'text-anchor':'middle',class:'ty'},g); t.textContent=s.type;
    lines.forEach((ln,k)=>{const tt=el('text',{x:12,y:44+k*17},g); tt.textContent=ln;});
  });
  d.s.forEach((s,i)=>{
    const p=pos[i];
    if(i===0){
      const g=el('g',{class:'node center'+(sel===0?' sel':''),transform:`translate(${p.x},${p.y})`},gN);
      el('circle',{r:96,class:'outer',filter:'url(#sh)'},g);
      el('circle',{r:74,class:'inner'},g);
      const c=el('text',{y:12,'text-anchor':'middle','font-size':58,fill:'#fff','font-family':'STKaiti,KaiTi,Kaiti SC,serif','font-weight':400},g); c.textContent=d.c;
      const t=el('text',{y:-40,'text-anchor':'middle','font-size':12,fill:'#ffe9de','font-weight':700},g); t.textContent='本 义';
      const ls=wrap(s.t,8).slice(0,2);
      ls.forEach((ln,k)=>{const tt=el('text',{y:38+k*16,'text-anchor':'middle','font-size':13,fill:'#fff','font-weight':600},g); tt.textContent=ln;});
      g.onclick=e=>{e.stopPropagation();pick(0);};
      return;
    }
    const col=TYPE_COLOR[s.type];
    const g=el('g',{class:'node'+(sel===i?' sel':''),transform:`translate(${p.x-NW/2},${p.y-NH/2})`},gN);
    el('rect',{width:NW,height:NH,rx:16,filter:'url(#sh)',style:sel===i?`stroke:${col}`:''},g);
    el('rect',{x:0,y:0,width:6,height:NH,rx:3,fill:col,stroke:'none'},g);
    const certCol={'确定':'#2e9a5b','通行说法':'#3b78c4','待查':'#d8962b'}[s.cert];
    el('circle',{cx:NW-14,cy:14,r:5,fill:certCol},g);
    const tag=el('text',{x:16,y:20,class:'tag',fill:col},g); tag.textContent=s.type+' · 义项'+i;
    const ls=wrap(s.t,10).slice(0,2);
    ls.forEach((ln,k)=>{const tt=el('text',{x:16,y:42+k*19},g); tt.textContent=ln;});
    g.onclick=e=>{e.stopPropagation();pick(i);};
  });
}

/* zoom & pan */
const svg=$('map');
function apply(){ $('vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){
  const b=$('vp').getBBox(), W=svg.clientWidth, H=svg.clientHeight;
  if(!b.width) return;
  const k=Math.min(W/(b.width+60), H/(b.height+60), 1.4);
  view.k=k; view.x=W/2-(b.x+b.width/2)*k; view.y=H/2-(b.y+b.height/2)*k; apply();
}
function zoomAt(f,cx,cy){
  const nk=Math.max(.25,Math.min(3,view.k*f)); f=nk/view.k;
  view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.k=nk; apply();
}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};svg.classList.add('drag');});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;apply();});
let lastMoved=false;
window.addEventListener('pointerup',()=>{lastMoved=!!(drag&&drag.moved);drag=null;svg.classList.remove('drag');});
$('zin').onclick=()=>zoomAt(1.2,svg.clientWidth/2,svg.clientHeight/2);
$('zout').onclick=()=>zoomAt(1/1.2,svg.clientWidth/2,svg.clientHeight/2);
$('zfit').onclick=fit;
window.addEventListener('resize',fit);

/* panel */
function certBadge(c){return `<span class="badge c-${esc(c)}">把握：${esc(c)}</span>`;}
function renderPanel(){
  const d=DATA[cur], s=d.s[sel];
  let h='';
  if(sel===0){
    h+=`<div class="sec"><h4>中心 · 本义</h4><div class="stitle">${esc(d.c)}：${esc(d.ben)}</div><div class="badges"><span class="badge" style="background:${TYPE_COLOR['本义']}">本义</span>${certBadge(d.benCert)}</div></div>`;
    h+=`<div class="sec"><h4>《说文解字》原文</h4><div class="box ${d.sw.cert==='待查'?'pending':''}"><div class="quote">${esc(d.sw.t)}</div><div class="src">把握：${esc(d.sw.cert)}</div></div></div>`;
    const names=['甲骨文','金文','小篆','楷书'];
    h+=`<div class="sec"><h4>字形演变</h4><div class="evo">${names.map((n,k)=>{
      const v=d.evo[k]; const isK=k===3;
      return `<div><div class="g ${isK?'k':''}">${isK?esc(v):'字形图占位'}</div><div class="n">${n}</div>${isK?'':`<div class="st">${esc(v)}</div>`}</div>`;}).join('')}</div></div>`;
    h+=`<div class="sec"><h4>为什么说这是本义</h4><div class="box">${esc(d.why)}</div></div>`;
  }else{
    const p=d.s[s.from];
    h+=`<div class="sec"><h4>义项 ${sel}</h4><div class="stitle">${esc(s.t)}</div><div class="badges"><span class="badge" style="background:${TYPE_COLOR[s.type]}">${esc(s.type)}</span>${certBadge(s.cert)}</div>
      <div class="path"><span class="p">${esc(p.t)}</span>→<b style="color:${TYPE_COLOR[s.type]}">${esc(s.type)}</b>→<span class="p">${esc(s.t)}</span></div>
      <div class="box">${esc(s.why)}</div></div>`;
  }
  h+=`<div class="sec"><h4>词族</h4><div class="chips">${s.w.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div></div>`;
  h+=`<div class="sec"><h4>构词拆解</h4><div class="box">${esc(s.parse)}</div></div>`;
  const isEx=s.ex.startsWith('示例：'); const exT=isEx?s.ex.slice(3):s.ex;
  h+=`<div class="sec ex"><h4>现代例句</h4><div class="box">${isEx?'<span class="lab">示例</span>':''}${esc(exT)}</div></div>`;
  if(s.cl){
    h+=`<div class="sec"><h4>文言原句</h4><div class="box"><div class="quote">${esc(s.cl.q)}</div><div class="src">—— ${esc(s.cl.src)}</div><div class="tr">译文：${esc(s.cl.tr)}</div></div></div>`;
  }else{
    h+=`<div class="sec"><h4>文言原句</h4><div class="box pending">待查：暂未核实到可靠书证，不列出处。</div></div>`;
  }
  if(sel!==0) h+=`<div class="sec"><h4>把握程度</h4><div class="badges">${certBadge(s.cert)}</div></div>`;
  h+=`<div class="divider"></div>`;
  h+=`<div class="sec"><h4>偏旁拆分</h4><div class="parts">
     ${d.parts.f.map(x=>`<div class="part f"><div class="k">表义</div><div class="pc">${esc(x.p)}</div><div class="pd">${esc(x.d)}</div></div>`).join('')}
     ${d.parts.s.map(x=>`<div class="part s"><div class="k">表音</div><div class="pc">${esc(x.p)}</div><div class="pd">${esc(x.d)}</div></div>`).join('')}
   </div></div>`;
  h+=`<div class="sec"><h4>易读错 · 易写错</h4><div class="err"><div><b>读</b>${esc(d.err.r)}</div><div><b>写</b>${esc(d.err.w)}</div></div></div>`;
  h+=`<div class="sec"><h4>相关汉字密码</h4><div class="code">${esc(d.code)}</div></div>`;
  $('panel').innerHTML=h; $('panel').scrollTop=0;
}

function pick(i){ sel=i; drawMap(); apply(); renderPanel(); }
function load(i){
  cur=i; sel=0; const d=DATA[i];
  [...$('list').children].forEach((b,k)=>b.classList.toggle('on',k===i));
  $('bc').textContent=d.c; $('cpy').textContent=d.py; $('cbn').textContent='本义：'+d.ben;
  $('csw').textContent='《说文》：'+d.sw.t;
  drawMap(); fit(); renderPanel();
}
svg.addEventListener('click',e=>{ if(lastMoved){ e.stopPropagation(); lastMoved=false; } },true);
load(0);
</script>
</body>
