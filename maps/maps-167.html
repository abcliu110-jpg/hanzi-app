<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#fbf7ef;--card:#ffffff;--ink:#2b2a33;--sub:#6f6b7a;--line:#e8e1d3;
  --brand:#c2483d;--brand-soft:#fbe9e5;--accent:#2f6f6a;
  --yin:#3f9a6b;--bi:#e08a2b;--zhuan:#3b74c9;--jia:#8a56c2;
  --sure:#3f9a6b;--common:#3b74c9;--check:#c98a1b;
  --shadow:0 6px 20px rgba(80,60,30,.08);
  --r:16px;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.kai{font-family:"STKaiti","KaiTi","Kaiti SC","楷体","AR PL UKai CN",serif}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.04);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap}
.logo b{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;transition:.2s}
nav.top button:hover{background:#f4efe5;color:var(--ink)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(194,72,61,.3)}
nav.top button.soon::after{content:"·待开放";font-size:11px;opacity:.6}
.main{flex:1;display:grid;grid-template-columns:150px 1fr 360px;min-height:0}
/* left */
aside.left{border-right:1px solid var(--line);background:#fffdf8;overflow-y:auto;padding:14px 10px}
aside.left h4{font-size:12px;color:var(--sub);font-weight:500;margin:0 6px 10px;letter-spacing:.1em}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chars button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 0 6px;cursor:pointer;transition:.2s;font:inherit}
.chars button .c{font-size:26px;line-height:1.1;display:block}
.chars button .p{font-size:10px;color:var(--sub)}
.chars button:hover{border-color:var(--brand);transform:translateY(-1px)}
.chars button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chars button.on .p{color:#ffe3de}
/* center */
section.stage{position:relative;min-width:0;display:flex;flex-direction:column}
.stagehead{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 20px 6px;gap:12px;flex-wrap:wrap}
.stagehead .t{display:flex;align-items:baseline;gap:12px}
.stagehead .big{font-size:44px;line-height:1}
.stagehead .py{color:var(--brand);font-size:16px}
.stagehead .hint{font-size:12px;color:var(--sub)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.canvas{flex:1;position:relative;margin:6px 16px 16px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
  background-image:radial-gradient(#efe8da 1px,transparent 1px);background-size:22px 22px}
svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.zoom button:hover{border-color:var(--brand);color:var(--brand)}
.node{cursor:pointer}
.node rect{transition:filter .2s}
.node:hover rect{filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.node.sel rect.box{stroke-width:3}
.elabel{cursor:pointer}
/* right */
aside.right{border-left:1px solid var(--line);background:#fffdf8;overflow-y:auto;padding:14px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--brand)}
.card h3.g::before{background:var(--accent)}
.row{font-size:13px;line-height:1.7;margin-bottom:8px}
.row .k{display:inline-block;font-size:11px;color:var(--sub);background:#f5f0e6;border-radius:6px;padding:0 6px;margin-right:6px}
.quote{font-size:15px;line-height:1.8;background:#fbf5ea;border-left:3px solid var(--brand);border-radius:6px;padding:8px 12px;margin:6px 0}
.src{font-size:11px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;color:#fff;vertical-align:middle;margin-left:4px}
.tag.确定{background:var(--sure)}.tag.通行说法{background:var(--common)}.tag.待查{background:var(--check)}
.tag.示例{background:#9a8f7c}
.tag.t-引申{background:var(--yin)}.tag.t-比喻{background:var(--bi)}.tag.t-转喻{background:var(--zhuan)}.tag.t-假借{background:var(--jia)}
.fam{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.fam span{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:3px 10px;font-size:13px}
.why{background:#f2f7f6;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;color:#2b4f4c;margin-bottom:8px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parts div{border-radius:12px;padding:10px;font-size:12.5px;line-height:1.6}
.parts .s{background:#eef6f1}.parts .p{background:#eef2fa}
.parts b{display:block;font-size:12px;margin-bottom:2px}
.warn{display:flex;gap:8px;font-size:13px;line-height:1.6;margin-bottom:8px}
.warn em{font-style:normal;flex:none;width:44px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#fff}
.warn .r{background:#e07a5f}.warn .w{background:#c2483d}
ul.code{list-style:none}
ul.code li{font-size:13px;line-height:1.6;padding:6px 0 6px 22px;position:relative;border-bottom:1px dashed var(--line)}
ul.code li:last-child{border:0}
ul.code li::before{content:"🔑";position:absolute;left:0;top:6px;font-size:12px}
.empty{color:var(--sub);font-size:13px;line-height:1.7}
.soonpane{position:absolute;inset:0;display:none;place-items:center;background:rgba(251,247,239,.92);z-index:3;text-align:center;color:var(--sub)}
.soonpane.show{display:grid}
.soonpane .big{font-size:40px;margin-bottom:8px}
footer.note{font-size:11px;color:var(--sub);padding:0 20px 10px}
@media (max-width:1100px){.main{grid-template-columns:120px 1fr 300px}}
</style>
</head>
<body>
<header>
  <div class="logo"><b class="kai">字</b>汉字小探险</div>
  <nav class="top" id="topnav"></nav>
</header>
<div class="main">
  <aside class="left"><h4>本组 20 字</h4><div class="chars" id="chars"></div></aside>
  <section class="stage">
    <div class="stagehead">

      <div class="legend">
        <span><i style="background:var(--yin)"></i>引申</span>
        <span><i style="background:var(--bi)"></i>比喻</span>
        <span><i style="background:var(--zhuan)"></i>转喻</span>
        <span><i style="background:var(--jia)"></i>假借</span>
      </div>
    </div>
    <div class="canvas" id="canvas">
      <svg id="svg"><g id="vp"></g></svg>
      <div class="zoom"><button id="zin" title="放大">＋</button><button id="zout" title="缩小">－</button><button id="zreset" title="复位">⟳</button></div>

    </div>

  </section>
  <aside class="right" id="right"></aside>
</div>

<script>
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const MENU = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const TC = {'引申':'#3f9a6b','比喻':'#e08a2b','转喻':'#3b74c9','假借':'#8a56c2'};
const NS = 'http://www.w3.org/2000/svg';
let cur = 0, sel = 0, view = {x:0,y:0,k:1};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// top nav
MENU.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;if(i===0)b.className='on';else b.classList.add('soon');
  b.onclick=()=>{document.querySelectorAll('nav.top button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const s=$('soon'); if(i===0){s.classList.remove('show')}else{$('soonText').innerHTML='「'+m+'」模块正在建设中<br><small>本页仅实现「字义扩展图」</small>';s.classList.add('show')}};
  $('topnav').appendChild(b)});
// left list
DATA.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML='<span class="c kai">'+d.ch+'</span><span class="p">'+esc(d.py.split(' / ')[0])+'</span>';
  b.onclick=()=>load(i);$('chars').appendChild(b)});

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function textW(s,size){let w=0;for(const c of s)w+=/[\x00-\xff]/.test(c)?size*.58:size;return w}

function layout(d){
  const S=d.senses, pos={}, kids={};
  S.forEach(s=>{if(s.id===0)return;(kids[s.from]=kids[s.from]||[]).push(s.id)});
  pos[0]={x:0,y:0};
  const l1=kids[0]||[]; const n=l1.length;
  const R1 = n<=3?230:255;
  l1.forEach((id,i)=>{const a=-Math.PI/2+i*2*Math.PI/n+(n===2?Math.PI/2:0); pos[id]={x:Math.cos(a)*R1*1.25,y:Math.sin(a)*R1,a}});
  l1.forEach(pid=>{const ch=kids[pid]||[];const pa=pos[pid].a;ch.forEach((id,j)=>{const off=(j-(ch.length-1)/2)*0.55;const a=pa+off;pos[id]={x:pos[pid].x+Math.cos(a)*230,y:pos[pid].y+Math.sin(a)*150,a}})});
  return pos;
}

function render(){
  const d=DATA[cur], vp=$('vp'); vp.innerHTML='';
  const pos=layout(d);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  d.senses.forEach(s=>{
    if(s.id===0)return; const a=pos[s.from], b=pos[s.id], c=TC[s.t]||'#999';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y, cx=mx-dy*.12, cy=my+dx*.12;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:c,'stroke-width':s.id===sel?4:2.6,'stroke-dasharray':s.t==='假借'?'7 6':'', opacity:.85},gE);
    const lx=(a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    const g=el('g',{class:'elabel',transform:`translate(${lx},${ly})`},gL);
    const w=textW(s.t,12)+16;
    el('rect',{x:-w/2,y:-11,width:w,height:22,rx:11,fill:c},g);
    const t=el('text',{'text-anchor':'middle',y:4,'font-size':12,fill:'#fff','font-weight':600},g);t.textContent=s.t;
    const tip=el('title',{},g);tip.textContent=s.w;
    g.onclick=e=>{e.stopPropagation();select(s.id)};
  });
  d.senses.forEach(s=>{
    const p=pos[s.id], center=s.id===0;
    const g=el('g',{class:'node'+(s.id===sel?' sel':''),transform:`translate(${p.x},${p.y})`},gN);
    if(center){
      el('circle',{r:92,fill:'#fff5f2',stroke:'#c2483d','stroke-width':s.id===sel?4:2.5},g);
      el('circle',{r:82,fill:'none',stroke:'#f0c7bf','stroke-dasharray':'3 5'},g);
      const t0=el('text',{'text-anchor':'middle',y:-30,'font-size':12,fill:'#c2483d','font-weight':600},g);t0.textContent='本 义';
      const t1=el('text',{'text-anchor':'middle',y:22,'font-size':56,fill:'#2b2a33',class:'kai'},g);t1.textContent=d.ch;
      const t2=el('text',{'text-anchor':'middle',y:52,'font-size':14,fill:'#2b2a33','font-weight':600},g);t2.textContent=s.n;
      const t3=el('text',{'text-anchor':'middle',y:70,'font-size':11,fill:'#6f6b7a'},g);t3.textContent=s.py;
    } else {
      const c=TC[s.t]||'#999'; const w=Math.max(textW(s.n,15),textW(s.d.slice(0,11),11))+36, h=60;
      el('rect',{class:'box',x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:'#fff',stroke:c,'stroke-width':s.id===sel?3:1.6},g);
      el('rect',{x:-w/2,y:-h/2,width:6,height:h,rx:3,fill:c},g);
      const t1=el('text',{'text-anchor':'middle',y:-4,'font-size':15,'font-weight':700,fill:'#2b2a33'},g);t1.textContent=s.n;
      const t2=el('text',{'text-anchor':'middle',y:16,'font-size':11,fill:'#6f6b7a'},g);t2.textContent=s.py+' · '+(s.fam[0]||'');
      const cfc={'确定':'#3f9a6b','通行说法':'#3b74c9','待查':'#c98a1b'}[s.cf];
      el('circle',{cx:w/2-9,cy:-h/2+9,r:4.5,fill:cfc},g);
    }
    g.onclick=e=>{e.stopPropagation();select(s.id)};
  });
  applyView();
}

function fit(){
  const r=$('svg').getBoundingClientRect(); const pos=layout(DATA[cur]);
  let minX=-110,maxX=110,minY=-110,maxY=110;
  Object.values(pos).forEach(p=>{minX=Math.min(minX,p.x-110);maxX=Math.max(maxX,p.x+110);minY=Math.min(minY,p.y-50);maxY=Math.max(maxY,p.y+50)});
  const k=Math.min(r.width/(maxX-minX),r.height/(maxY-minY),1.25)*.94;
  view={k,x:r.width/2-k*(minX+maxX)/2,y:r.height/2-k*(minY+maxY)/2};applyView();
}
function applyView(){$('vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`)}
function zoomAt(f,cx,cy){const nk=Math.max(.3,Math.min(3,view.k*f));const r=nk/view.k;view.x=cx-(cx-view.x)*r;view.y=cy-(cy-view.y)*r;view.k=nk;applyView()}
const svg=$('svg');
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null,lastMoved=false;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};svg.classList.add('drag')});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;applyView()});
window.addEventListener('pointerup',()=>{lastMoved=drag?drag.moved:false;drag=null;svg.classList.remove('drag')});
$('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2)};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2)};
$('zreset').onclick=fit;
window.addEventListener('resize',fit);

function tag(t,cls){return `<span class="tag ${cls||t}">${esc(t)}</span>`}
function sideHTML(){
  const d=DATA[cur], s=d.senses.find(x=>x.id===sel), center=s.id===0;
  let h='';
  if(center){
    h+=`<div class="card"><h3>本义 · ${esc(s.n)} ${tag(d.sw.cf)}</h3>
      <div class="row"><span class="k">《说文》</span></div>
      <div class="quote kai">${esc(d.sw.t)}</div><div class="src">出处：${esc(d.sw.src)}</div>
      <div class="row" style="margin-top:10px"><span class="k">字形演变</span>${esc(d.evo)}</div>
      <div class="row"><span class="k">判定理由</span>${esc(d.reason)}</div></div>`;
  } else {
    const parent=d.senses.find(x=>x.id===s.from);
    h+=`<div class="card"><h3>${esc(s.n)} <span class="src">${esc(s.py)}</span></h3>
      <div class="row">${esc(s.d)}</div>
      <div class="why">${tag(s.t,'t-'+s.t)} 从「${esc(parent.n)}」来：${esc(s.w)}</div></div>`;
  }
  h+=`<div class="card"><h3>义项详情 ${tag(s.cf)}</h3>
    <div class="row"><span class="k">词族</span><div class="fam">${s.fam.map(f=>`<span>${esc(f)}</span>`).join('')}</div></div>
    <div class="row"><span class="k">构词拆解</span>${esc(s.bd)}</div>
    <div class="row"><span class="k">现代例句</span>${tag('示例')}<br>${esc(s.ex.replace('（示例）',''))}</div>
    <div class="row"><span class="k">文言原句</span>${s.cl?`<div class="quote kai">${esc(s.cl.s)}</div><div class="src">出处：${esc(s.cl.src)}</div><div style="margin-top:4px"><span class="k">译文</span>${esc(s.cl.tr)}</div>`:`${tag('待查')} <span class="empty">暂未找到可核实的文言原句，不作编造。</span>`}</div>
    <div class="row"><span class="k">把握程度</span>${tag(s.cf)}</div></div>`;
  h+=`<div class="card"><h3 class="g">偏旁拆分</h3><div class="parts">
    <div class="s"><b>表义部分</b>${esc(d.parts.sem)}</div><div class="p"><b>表音部分</b>${esc(d.parts.pho)}</div></div>
    <div class="src" style="margin-top:6px">${esc(d.parts.note)}</div></div>`;
  h+=`<div class="card"><h3 class="g">易错提醒</h3>
    <div class="warn"><em class="r">易读错</em><span>${esc(d.misread)}</span></div>
    <div class="warn"><em class="w">易写错</em><span>${esc(d.miswrite)}</span></div></div>`;
  h+=`<div class="card"><h3 class="g">汉字密码</h3><ul class="code">${d.code.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  $('right').innerHTML=h;
}
function select(id){if(lastMoved){lastMoved=false;return}sel=id;render();sideHTML()}
function load(i){cur=i;sel=0;document.querySelectorAll('.chars button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('hChar').textContent=DATA[i].ch;$('hPy').textContent=DATA[i].py;render();sideHTML();fit()}
svg.addEventListener('click',()=>{});
load(0);
</script>
<script src="../xzq-back.js" data-home="../index.html"></script>
</body>
</html>
