<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 儿童汉字学习</title>
<style>
:root{
  --paper:#fbf7ef; --card:#ffffff; --ink:#2b2a33; --ink2:#5d5a66; --mute:#9a95a3;
  --line:#ece5d8; --brand:#c4482f; --brand-soft:#fbe9e3;
  --yin:#2f8f83; --bi:#e08a1e; --zhuan:#7b5cc4; --jia:#4a78c2;
  --ok:#3a9a5b; --mid:#d39a1c; --tbd:#cf4b4b;
  --r:16px; --shadow:0 6px 24px rgba(80,60,30,.08);
  --kai:"KaiTi","STKaiti","楷体","Kaiti SC","BiauKai",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6}
/* header */
header{height:64px;display:flex;align-items:center;gap:22px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo b{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;font-family:var(--kai);font-size:22px}
nav.top{display:flex;gap:4px;overflow-x:auto}
nav.top button{border:0;background:none;padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-family:inherit}
nav.top button:hover{background:#f5efe4}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600}
/* layout */
.wrap{display:grid;grid-template-columns:132px 1fr 360px;gap:18px;padding:18px;height:calc(100vh - 64px)}
aside.left,main,aside.right{min-height:0;overflow:auto}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
aside.left{padding:12px 10px}
aside.left h3{margin:2px 6px 10px;font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.1em}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chars button{border:1px solid var(--line);background:#fffdf8;border-radius:12px;padding:6px 0 4px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s}
.chars button .z{display:block;font-family:var(--kai);font-size:26px;line-height:1.2}
.chars button .p{display:block;font-size:11px;color:var(--mute)}
.chars button:hover{border-color:var(--brand);transform:translateY(-1px)}
.chars button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chars button.on .p{color:#ffe1d8}
main{display:flex;flex-direction:column;gap:16px}
/* origin card */
.origin{padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.bigchar{width:104px;height:104px;border-radius:22px;background:var(--brand-soft);display:grid;place-items:center;font-family:var(--kai);font-size:72px;color:var(--brand);position:relative}
.bigchar small{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-family:inherit;font-size:13px;color:var(--ink2)}
.o-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.o-title h2{margin:0;font-size:20px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;font-weight:600;line-height:20px;white-space:nowrap}
.lv-确定{background:#e4f4e9;color:var(--ok)} .lv-通行说法{background:#fbf0d6;color:#a8770c} .lv-待查{background:#fbe3e3;color:var(--tbd)}
.t-引申{background:#dff2ef;color:var(--yin)} .t-比喻{background:#fdebd3;color:#b86a0b} .t-转喻{background:#ebe4f8;color:var(--zhuan)} .t-假借{background:#e2eaf8;color:var(--jia)}
.sw{background:#faf6ee;border-left:4px solid var(--brand);padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0}
.sw .q{font-family:var(--kai);font-size:17px}
.sw .src{font-size:12px;color:var(--mute)}
.evo{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
.evo div{width:74px;border:1px dashed #d9cdb8;border-radius:10px;text-align:center;padding:6px 0 4px;background:#fffdf8}
.evo .g{font-family:var(--kai);font-size:24px;color:#c9bca5;height:32px;line-height:32px}
.evo .g.kai{color:var(--ink)}
.evo .n{font-size:11px;color:var(--mute)}
.reason{color:var(--ink2);font-size:13.5px}
.reason b{color:var(--ink)}
/* map */
.mapbox{position:relative;flex:1;min-height:460px;overflow:hidden}
.mapbox svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.mapbox svg.drag{cursor:grabbing}
.maptools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.maptools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--ink2);box-shadow:var(--shadow)}
.maptools button:hover{color:var(--brand);border-color:var(--brand)}
.legend{position:absolute;left:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.maphint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--mute)}
.node{cursor:pointer}
.node rect{transition:.15s}
.node:hover rect{stroke-width:2.5}
.node.sel rect{stroke:var(--brand)!important;stroke-width:3}
.edge-label{cursor:help}
/* edge list */
.edges{padding:14px 18px}
.edges h4,.right h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.edges h4:before,.right h4:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--brand)}
.edge-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px;cursor:pointer}
.edge-row:first-of-type{border-top:0}
.edge-row:hover .ft{color:var(--brand)}
.edge-row .ft{font-weight:600;white-space:nowrap}
.edge-row .why{color:var(--ink2)}
/* right */
aside.right{display:flex;flex-direction:column;gap:16px}
.right .panel{padding:16px 18px}
.d-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-head h3{margin:0;font-size:18px}
.d-gloss{color:var(--ink2);margin:4px 0 10px}
.rel{background:#f7f3ea;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.sec{margin-top:12px}
.sec .lb{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.06em;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:2px 10px;font-size:13.5px}
.ex{background:#fffaf0;border:1px solid #f1e6cf;border-radius:10px;padding:8px 10px}
.ex .demo{font-size:11px;background:#eee8dc;color:var(--ink2);padding:0 6px;border-radius:5px;margin-left:6px}
.cl{background:#f6f8fc;border:1px solid #e1e8f4;border-radius:10px;padding:8px 10px}
.cl .t{font-family:var(--kai);font-size:16px}
.cl .s{font-size:12px;color:var(--jia);margin-top:2px}
.cl .y{font-size:13px;color:var(--ink2);margin-top:4px}
.cl.none{background:#fdf3f3;border-color:#f3d6d6;color:var(--tbd);font-size:13px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.part{border-radius:12px;padding:8px 10px;font-size:13px}
.part .k{font-size:11px;font-weight:700;letter-spacing:.08em}
.part.y{background:#e6f3f1}.part.y .k{color:var(--yin)}
.part.s{background:#eef1fb}.part.s .k{color:var(--jia)}
.form{font-size:12px;color:var(--mute);margin-bottom:8px}
.err li,.code li{margin-bottom:6px;font-size:13.5px}
.err ul,.code ul{margin:0;padding-left:18px}
.err .k{font-weight:700;color:var(--tbd)}
.code li::marker{color:var(--zhuan)}
.soon{display:none;place-items:center;height:calc(100vh - 64px);color:var(--ink2);text-align:center}
.soon .big{font-family:var(--kai);font-size:54px;color:var(--brand)}
.foot{font-size:12px;color:var(--mute);padding:0 4px 4px}
@media (max-width:1180px){.wrap{grid-template-columns:120px 1fr;height:auto}aside.right{grid-column:1/-1}.mapbox{min-height:480px}}
</style>
</head>

<header>

    <section class="panel edges" id="edges"></section>

  </main>

  <aside class="right">
    <section class="panel" id="detail"></section>
    <section class="panel" id="parts"></section>
    <section class="panel err" id="err"></section>
    <section class="panel code" id="code"></section>
  </aside>
</div>

"y": "高大的是那四岳，巍峨高耸直到天上。（此处写作“崧”）"
},
"lv": "通行说法"
},
"s": [
{
"id": "s1",
"from": "o",
"type": "转喻",
"why": "用“高大的山”来专门称呼中岳——嵩山。",
"name": "嵩山",
"gloss": "五岳中的中岳，在河南。",
"words": [
"嵩山",
"嵩岳",
"嵩阳书院"
],
"build": "嵩山＝嵩（中岳）＋山",
"modern": "少林寺就在河南嵩山脚下。",
"cl": null,
"lv": "确定"
},
{
"id": "s2",
"from": "o",
"type": "比喻",
"why": "人的年纪像高山一样高，就是很长寿。",
"name": "高寿",
"gloss": "比喻年纪大、长寿（敬辞）。",
"words": [
"嵩寿",
"嵩龄（待查）",
"寿比南山（近义）"
],
"build": "嵩寿＝嵩（像山一样高）＋寿（年纪）",
"modern": "祝太爷爷福如东海、嵩寿无疆。",
"cl": null,
"lv": "通行说法"
}
],
"parts": {
"form": "会意字",
"yi": "山＋高：高高的山",
"yin": "无声旁"
},
"err": {
"read": "读 sōng，不读 gāo 或 sóng。",
"write": "上“山”下“高”，“山”写得扁一点。"
},
"code": [
"会意密码：山＋高＝嵩，不＋用＝甭，小＋大＝尖。",
"“山”部的字多和山有关：嵩、峰、岭、岳。"
]
}
]
}
</script>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.chars;
const COLORS = {"引申":"#2f8f83","比喻":"#e08a1e","转喻":"#7b5cc4","假借":"#4a78c2"};
let cur = 0, sel = 'o';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const lv = l => `<span class="tag lv-${l}">${l}</span>`;
const tp = t => `<span class="tag t-${t}">${t}</span>`;

/* top menu */
$('topnav').innerHTML = DATA.menu.map((m,i)=>`<button data-i="${i}" class="${i===0?'on':''}">${m}</button>`).join('');
$('topnav').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('topnav').children].forEach(x=>x.classList.toggle('on', x===b));
  const i = +b.dataset.i;
  $('app').style.display = i===0 ? '' : 'none';
  $('soon').style.display = i===0 ? 'none' : 'grid';
  $('soonname').textContent = '「'+DATA.menu[i]+'」';
  if(i===0) fit();
};

/* left nav */
$('charnav').innerHTML = C.map((c,i)=>`<button data-i="${i}"><span class="z">${c.c}</span><span class="p">${c.py}</span></button>`).join('');
$('charnav').onclick = e => { const b = e.target.closest('button'); if(b) show(+b.dataset.i); };

function show(i){
  cur = i; sel = 'o';
  [...$('charnav').children].forEach((b,j)=>b.classList.toggle('on', j===i));
  const d = C[i];
  renderOrigin(d); renderMap(d); renderEdges(d); renderDetail(d); renderAside(d);
}

function renderOrigin(d){
  const evo = ['甲骨文','金文','小篆','隶书','楷书'].map((n,k)=>
    `<div><div class="g ${k===4?'kai':''}">${k===4?d.c:'□'}</div><div class="n">${n}${k===4?'':'·待补'}</div></div>`).join('');
  $('origin').innerHTML = `
    <div class="bigchar">${d.c}<small>${d.py}</small></div>
    <div>
      <div class="o-title"><h2>本义：${esc(d.o.name)}</h2>${lv(d.o.lv)}</div>
      <div class="sw"><div class="q">${esc(d.sw.text)}</div><div class="src">${esc(d.sw.src)} · 原文把握 ${lv(d.sw.lv)}</div></div>
      <div class="evo">${evo}</div>
      <div class="reason"><b>本义判定：</b>${esc(d.reason)}</div>
    </div>`;
}

/* ---------- map ---------- */
const svg = $('map');
let view = {k:1, tx:0, ty:0}, layout = null;
function textW(s, fs){ return [...s].reduce((w,ch)=>w + (ch.charCodeAt(0)>255?fs:fs*.6),0); }

function computeLayout(d){
  const nodes = {o:{id:'o', x:0, y:0, depth:0, data:d.o}};
  const kids = {}; d.s.forEach(s=>{(kids[s.from]=kids[s.from]||[]).push(s);});
  const R = [0, 215, 385, 540];
  function place(pid, a0, a1, depth){
    const list = kids[pid]||[]; if(!list.length) return;
    const step = (a1-a0)/list.length;
    list.forEach((s,i)=>{
      const a = a0 + step*(i+.5);
      nodes[s.id] = {id:s.id, x:Math.cos(a)*R[depth], y:Math.sin(a)*R[depth]*0.78, depth, data:s, a};
      const span = Math.min(step, Math.PI/2.4);
      place(s.id, a-span/2, a+span/2, depth+1);
    });
  }
  const n1 = (kids.o||[]).length;
  const start = -Math.PI/2 - (n1===1?0:Math.PI/n1);
  place('o', start, start+Math.PI*2, 1);
  return nodes;
}

function renderMap(d){
  layout = computeLayout(d);
  let edges = '', labels = '', nodesH = '';
  d.s.forEach(s=>{
    const a = layout[s.from], b = layout[s.id], col = COLORS[s.type];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const nx = -(b.y-a.y), ny = (b.x-a.x), L = Math.hypot(nx,ny)||1;
    const cx = mx + nx/L*18, cy = my + ny/L*18;
    edges += `<path d="M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}" fill="none" stroke="${col}" stroke-width="2.4" stroke-dasharray="${s.type==='假借'?'7 6':''}" opacity=".85"/>`;
    const lx = (a.x+2*cx+b.x)/4, ly=(a.y+2*cy+b.y)/4;
    labels += `<g class="edge-label" data-id="${s.id}" transform="translate(${lx},${ly})"><title>${esc(s.type+'：'+s.why)}</title>
      <rect x="-22" y="-12" width="44" height="24" rx="12" fill="#fff" stroke="${col}" stroke-width="1.5"/>
      <text text-anchor="middle" dy="4.5" font-size="13" font-weight="700" fill="${col}">${s.type}</text></g>`;
  });
  Object.values(layout).forEach(n=>{
    const isO = n.id==='o';
    const title = isO ? d.c : n.data.name;
    const sub = isO ? '本义 · '+d.o.name : (n.data.lv==='待查'?'待查':'');
    const fs = isO ? 40 : 16;
    const w = Math.max(isO?150:textW(title,fs)+36, isO?150:96), h = isO?96:46;
    const col = isO ? '#c4482f' : COLORS[n.data.type];
    const fill = isO ? '#fbe9e3' : '#fff';
    nodesH += `<g class="node ${n.id===sel?'sel':''}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
      <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${isO?28:23}" fill="${fill}" stroke="${col}" stroke-width="${isO?2.5:1.8}" filter="url(#sh)"/>
      ${isO
        ? `<text text-anchor="middle" y="6" font-size="${fs}" font-family="KaiTi,STKaiti,楷体,serif" fill="#c4482f">${title}</text>
           <text text-anchor="middle" y="34" font-size="12.5" fill="#5d5a66">${esc(sub)}</text>`
        : `<text text-anchor="middle" y="${sub?1:6}" font-size="${fs}" font-weight="600" fill="#2b2a33">${esc(title)}</text>
           ${sub?`<text text-anchor="middle" y="17" font-size="11" fill="#cf4b4b">待查</text>`:''}`}
    </g>`;
  });
  svg.innerHTML = `<defs><filter id="sh" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8a6a3a" flood-opacity=".12"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e9e0cf"/></pattern></defs>
    <rect id="bg" x="-5000" y="-5000" width="10000" height="10000" fill="url(#dots)"/>
    <g id="world"><g>${edges}</g><g>${labels}</g><g>${nodesH}</g></g>`;
  fit();
}

function apply(){
  const r = svg.getBoundingClientRect();
  const w = $('world'); if(!w) return;
  const x = r.width/2 + view.tx, y = r.height/2 + view.ty;
  w.setAttribute('transform', `translate(${x},${y}) scale(${view.k})`);
  $('bg').setAttribute('transform', `translate(${x},${y}) scale(${view.k})`);
}
function fit(){
  if(!layout) return;
  const r = svg.getBoundingClientRect(); if(!r.width) return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  Object.values(layout).forEach(n=>{minX=Math.min(minX,n.x-90);maxX=Math.max(maxX,n.x+90);minY=Math.min(minY,n.y-55);maxY=Math.max(maxY,n.y+55);});
  const k = Math.min(r.width/(maxX-minX+60), r.height/(maxY-minY+60), 1.4);
  view = {k, tx:-(minX+maxX)/2*k, ty:-(minY+maxY)/2*k};
  apply();
}
function zoomAt(f, mx, my){
  const r = svg.getBoundingClientRect();
  if(mx===undefined){mx=r.width/2; my=r.height/2;}
  const cx=r.width/2, cy=r.height/2;
  const px=(mx-cx-view.tx)/view.k, py=(my-cy-view.ty)/view.k;
  view.k = Math.max(.35, Math.min(3, view.k*f));
  view.tx = mx-cx-px*view.k; view.ty = my-cy-py*view.k;
  apply();
}
svg.addEventListener('wheel', e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);}, {passive:false});
let drag=null, moved=false;
svg.addEventListener('pointerdown', e=>{drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty}; moved=false;});
window.addEventListener('pointermove', e=>{ if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){moved=true; svg.classList.add('drag');}
  if(moved){view.tx=drag.tx+dx; view.ty=drag.ty+dy; apply();}
});
window.addEventListener('pointerup', e=>{
  if(drag && !moved){
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const g = t && t.closest && (t.closest('.node')||t.closest('.edge-label'));
    if(g) select(g.dataset.id);
  }
  drag=null; svg.classList.remove('drag');
});
$('zin').onclick=()=>zoomAt(1.2); $('zout').onclick=()=>zoomAt(1/1.2); $('zfit').onclick=fit;
window.addEventListener('resize', fit);

function select(id){
  sel = id;
  svg.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel', n.dataset.id===id));
  renderDetail(C[cur]);
}

function renderEdges(d){
  const name = id => id==='o' ? '本义·'+d.o.name : d.s.find(x=>x.id===id).name;
  $('edges').innerHTML = `<h4>连线说明：意思是怎么变过来的</h4>` + d.s.map(s=>
    `<div class="edge-row" data-id="${s.id}">${tp(s.type)}<span class="ft">${esc(name(s.from))} → ${esc(s.name)}</span><span class="why">${esc(s.why)}</span></div>`).join('');
  $('edges').onclick = e => { const r = e.target.closest('.edge-row'); if(r) select(r.dataset.id); };
}

function renderDetail(d){
  const isO = sel==='o';
  const n = isO ? d.o : d.s.find(x=>x.id===sel);
  const parent = !isO && (n.from==='o' ? '本义·'+d.o.name : d.s.find(x=>x.id===n.from).name);
  const cl = n.cl
    ? `<div class="cl"><div class="t">${esc(n.cl.t)}</div><div class="s">—— ${esc(n.cl.s)}</div><div class="y">译文：${esc(n.cl.y)}</div></div>`
    : `<div class="cl none">文言原句：待查（暂未找到可核对的出处，不作编造）</div>`;
  $('detail').innerHTML = `
    <h4>义项详情</h4>
    <div class="d-head"><h3>${d.c} · ${esc(isO?'本义：'+n.name:n.name)}</h3>${isO?'<span class="tag" style="background:#fbe9e3;color:#c4482f">本义</span>':tp(n.type)}</div>
    <div class="d-gloss">${esc(n.gloss)}</div>
    ${isO?'':`<div class="rel">由「${esc(parent)}」<b style="color:${COLORS[n.type]}">${n.type}</b>而来：${esc(n.why)}</div>`}
    <div class="sec"><div class="lb">词族</div><div class="chips">${n.words.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div></div>
    <div class="sec"><div class="lb">构词拆解</div>${esc(n.build)}</div>
    <div class="sec"><div class="lb">现代例句</div><div class="ex">${esc(n.modern)}<span class="demo">示例</span></div></div>
    <div class="sec"><div class="lb">文言原句</div>${cl}</div>
    <div class="sec"><div class="lb">把握程度</div>${lv(n.lv)}</div>`;
}

function renderAside(d){
  $('parts').innerHTML = `<h4>偏旁拆分</h4><div class="form">${esc(d.parts.form)}</div>
    <div class="parts"><div class="part y"><div class="k">表义</div>${esc(d.parts.yi)}</div><div class="part s"><div class="k">表音</div>${esc(d.parts.yin)}</div></div>`;
  $('err').innerHTML = `<h4>易错提醒</h4><ul><li><span class="k">易读错：</span>${esc(d.err.read)}</li><li><span class="k">易写错：</span>${esc(d.err.write)}</li></ul>`;
  $('code').innerHTML = `<h4>汉字密码</h4><ul>${d.code.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`;
}

show(0);
})();
</script>
</body>
</html>
