<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2a2730; --ink2:#5d5866; --ink3:#948e9c;
  --line:#e7dfcf; --red:#c4553f; --red-soft:#f8e3dc;
  --t-yin:#2f8a72; --t-bi:#d9822b; --t-zhuan:#3f63a8; --t-jia:#8a52b5;
  --c-ok:#2f8a5c; --c-com:#3f63a8; --c-tbd:#c98a12;
  --shadow:0 6px 22px rgba(70,50,20,.08);
  --r:16px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* ===== 顶栏 ===== */
header{display:flex;align-items:center;gap:20px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(70,50,20,.04);z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#d8674f,#b8432f);color:#fff;font-family:var(--kai);font-size:24px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(196,85,63,.35)}
.brand b{font-size:16px;letter-spacing:1px}
.brand small{display:block;font-size:11px;color:var(--ink3);font-weight:400}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
nav.top button:hover{background:#f3ece0}
nav.top button.on{background:var(--red);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(196,85,63,.3)}
nav.top button .soon{font-size:10px;margin-left:4px;color:var(--ink3)}

/* ===== 主体 ===== */
main{display:grid;grid-template-columns:200px 1fr 360px;min-height:0}
aside.left{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.left h3{font-size:12px;color:var(--ink3);font-weight:500;padding:16px 18px 8px;letter-spacing:1px}
.clist{overflow-y:auto;padding:0 10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.citem{display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;border-radius:12px;border:1px solid transparent;transition:.18s}
.citem:hover{background:#faf5ec;border-color:var(--line)}
.citem .ch{font-family:var(--kai);font-size:28px;line-height:1.1}
.citem .py{font-size:11px;color:var(--ink3)}
.citem.on{background:var(--red-soft);border-color:#ebb8a9}
.citem.on .ch{color:var(--red)}
.left .tip{font-size:11px;color:var(--ink3);padding:10px 16px;border-top:1px dashed var(--line);line-height:1.6}

/* ===== 画布 ===== */
section.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:
  radial-gradient(circle at 50% 45%,#fffaf0 0,#f6f1e7 70%);}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#e4dccb 1px,transparent 1px);background-size:22px 22px;opacity:.55;pointer-events:none}
.stage-head{position:absolute;left:18px;top:14px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;z-index:2;pointer-events:none}
.title-card{pointer-events:auto;background:rgba(255,253,248,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.title-card .big{font-family:var(--kai);font-size:44px;color:var(--red);line-height:1}
.title-card .meta b{font-size:16px}
.title-card .meta div{font-size:12px;color:var(--ink2);margin-top:3px}
.legend{pointer-events:auto;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;max-width:300px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.zoombar{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombar button{width:38px;height:38px;border-radius:12px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px;color:var(--ink2)}
.zoombar button:hover{color:var(--red)}
.zoomtxt{position:absolute;left:18px;bottom:16px;font-size:11px;color:var(--ink3);z-index:2}

/* SVG 节点 */
.node{cursor:pointer}
.node rect.bg{fill:#fff;stroke:var(--line);stroke-width:1.5;transition:.2s}
.node:hover rect.bg{stroke:#d9b9a8}
.node.sel rect.bg{stroke:var(--red);stroke-width:2.5;filter:drop-shadow(0 4px 10px rgba(196,85,63,.25))}
.node text.m{font-size:15px;font-weight:600;fill:var(--ink)}
.node text.s{font-size:11px;fill:var(--ink3)}
.core circle.halo{fill:rgba(196,85,63,.08)}
.core circle.bg{fill:#fff;stroke:var(--red);stroke-width:2}
.core.sel circle.bg{stroke-width:4}
.core text.ch{font-family:var(--kai);font-size:58px;fill:var(--red)}
.core text.tag{font-size:11px;fill:#fff;font-weight:600}
.edge{fill:none;stroke-width:2.5;stroke-linecap:round}
.elabel rect{fill:rgba(255,253,248,.96);stroke:var(--line)}
.elabel text{font-size:11px;fill:var(--ink2)}
.elabel text.t{font-size:11px;font-weight:700;fill:#fff}

/* ===== 右栏 ===== */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 30px;min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(70,50,20,.04)}

.card h4::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--red)}
.detail-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.detail-title b{font-size:18px}
.chip{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:999px}
.cert{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid}
.cert.ok{color:var(--c-ok);border-color:#bfe0cd;background:#eef8f2}
.cert.com{color:var(--c-com);border-color:#c5d3ee;background:#eff3fb}
.cert.tbd{color:var(--c-tbd);border-color:#efd9a6;background:#fdf6e6}
.why{font-size:13px;color:var(--ink2);background:#faf6ee;border-radius:10px;padding:8px 10px;line-height:1.7;margin-bottom:10px}
.sec{margin-top:12px}
.sec .lab{font-size:12px;color:var(--ink3);margin-bottom:6px}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--red-soft);color:#9b3a27;border-radius:8px;padding:4px 10px;font-size:14px;font-weight:600}
.bk{font-size:13.5px;line-height:1.7;background:#f5f8fb;border-radius:10px;padding:8px 10px;color:#34465e}
.ex{font-size:14px;line-height:1.8}
.ex .tag,.tbdtag{font-size:10px;font-weight:700;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.classic{border-left:3px solid var(--red);padding:6px 12px;background:#fdf8f3;border-radius:0 10px 10px 0}
.classic .q{font-family:var(--serif);font-size:15px;line-height:1.8}
.classic .src{font-size:12px;color:var(--red);margin-top:2px}
.classic .tr{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.7}
.classic.none .q{font-family:var(--font);font-size:13px;color:var(--c-tbd)}
.sw{font-family:var(--serif);font-size:15px;line-height:1.9;background:#fbf7ef;border:1px dashed #e2d3b8;border-radius:10px;padding:8px 12px}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo div{border:1px dashed #d9cdb6;border-radius:10px;text-align:center;padding:6px 2px;background:#fffdf8}
.evo div b{display:block;font-family:var(--kai);font-size:22px;color:#b9ad97;font-weight:400}
.evo div small{font-size:10.5px;color:var(--ink3)}
.evo div.na b{font-size:12px;font-family:var(--font);padding:6px 0}
.evo-note{font-size:11px;color:var(--ink3);margin-top:6px}
.parts{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;font-size:13.5px;line-height:1.6}
.parts .k{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.k.yi{background:var(--t-yin)}.k.yin{background:var(--t-zhuan)}.k.ty{background:var(--ink3)}
.err{display:grid;gap:8px}
.err div{font-size:13.5px;line-height:1.7;padding:8px 10px;border-radius:10px}
.err .r{background:#fff4ec}.err .w{background:#f3f0fb}
.err b{font-size:12px;margin-right:6px}
.err .r b{color:#c2611f}.err .w b{color:#7046a3}
.code li{list-style:none;font-size:13.5px;line-height:1.7;padding:6px 0 6px 26px;position:relative;border-bottom:1px dashed var(--line)}
.code li:last-child{border:none}
.code li::before{content:"🔑";position:absolute;left:0;top:6px;font-size:13px}
.hint{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:6px}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:1100px){main{grid-template-columns:150px 1fr 320px}.clist{grid-template-columns:1fr}}
</style>

<script>
(function(){
var D = JSON.parse(document.getElementById('hz-data').textContent);
var MENU = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
var TYPE_COLOR = {'引申':'var(--t-yin)','比喻':'var(--t-bi)','转喻':'var(--t-zhuan)','假借':'var(--t-jia)'};
var TYPE_HEX = {'引申':'#2f8a72','比喻':'#d9822b','转喻':'#3f63a8','假借':'#8a52b5'};
var TYPE_DESC = {'引申':'意思顺着延伸','比喻':'借相像打比方','转喻':'借相关来代指','假借':'借音不借义'};
var cur = 0, sel = 'core';
var view = {x:0,y:0,k:1};
var NS = 'http://www.w3.org/2000/svg';
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function wrap(s,n){var out=[],a=Array.from(s);for(var i=0;i<a.length;i+=n)out.push(a.slice(i,i+n).join(''));return out}
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(function(){x.classList.remove('show')},1800)}
function certCls(c){return c==='确定'?'ok':(c==='通行说法'?'com':'tbd')}
function certIcon(c){return c==='确定'?'●':(c==='通行说法'?'◐':'○')}

/* 顶部菜单 */
MENU.forEach(function(m,i){
  var b=document.createElement('button');
  b.innerHTML=esc(m)+(i?'<span class="soon">·</span>':'');
  if(i===0)b.className='on';
  b.onclick=function(){if(i)toast('「'+m+'」模块在本文件中暂未实现');};
  $('topnav').appendChild(b);
});
/* 图例 */
$('legend').innerHTML=Object.keys(TYPE_HEX).map(function(t){return '<span><i style="background:'+TYPE_HEX[t]+'"></i>'+t+'</span>'}).join('')+
 '<span style="width:100%;height:0"></span><span class="cert ok" style="padding:0 6px">● 确定</span><span class="cert com" style="padding:0 6px">◐ 通行说法</span><span class="cert tbd" style="padding:0 6px">○ 待查</span>';

/* 左侧列表 */
function renderList(){
  $('clist').innerHTML='';
  D.chars.forEach(function(c,i){
    var b=document.createElement('button');
    b.className='citem'+(i===cur?' on':'');
    b.innerHTML='<span class="ch">'+c.c+'</span><span class="py">'+c.py+'</span>';
    b.onclick=function(){go(i)};
    $('clist').appendChild(b);
  });
}
function go(i){cur=(i+D.chars.length)%D.chars.length;sel='core';renderList();renderAll();fit();
  var on=$('clist').children[cur];if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});}

/* 义项网 */
function renderMap(){
  var C=D.chars[cur], vp=$('vp');
  vp.innerHTML='';
  var n=C.br.length, R=n>3?290:270;
  var gEdge=el('g',{},vp), gLab=el('g',{},vp), gNode=el('g',{},vp);
  C.br.forEach(function(b,i){
    var ang=-Math.PI/2+i*2*Math.PI/n + (n===2?Math.PI/2:0);
    var x=R*Math.cos(ang), y=R*Math.sin(ang);
    var col=TYPE_HEX[b.type]||'#999';
    // 曲线
    var mx=x*0.5, my=y*0.5, nx=-y*0.08, ny=x*0.08;
    el('path',{d:'M0,0 Q'+(mx+nx)+','+(my+ny)+' '+x+','+y,class:'edge',stroke:col,'stroke-dasharray':b.type==='假借'?'7 6':'none'},gEdge);
    // 连线标注
    var lx=x*0.52+nx*0.5, ly=y*0.52+ny*0.5;
    var lines=wrap(b.why,12).slice(0,4);
    var w=12*12+16, h=26+lines.length*15;
    var lg=el('g',{class:'elabel',transform:'translate('+(lx-w/2)+','+(ly-h/2)+')'},gLab);
    el('rect',{x:0,y:0,width:w,height:h,rx:10},lg);
    el('rect',{x:8,y:6,width:40,height:17,rx:8.5,style:'fill:'+col+';stroke:none'},lg);
    var tt=el('text',{x:28,y:18.5,'text-anchor':'middle',class:'t'},lg);tt.textContent=b.type;
    var dsc=el('text',{x:54,y:18.5},lg);dsc.textContent=TYPE_DESC[b.type]||'';dsc.setAttribute('style','fill:#948e9c;font-size:10px');
    lines.forEach(function(L,j){var t=el('text',{x:8,y:38+j*15},lg);t.textContent=L;});
    // 节点
    var mw=Math.max(130,Array.from(b.m).length*16+36), nh=56;
    var g=el('g',{class:'node'+(sel===i?' sel':''),transform:'translate('+(x-mw/2)+','+(y-nh/2)+')'},gNode);
    el('rect',{class:'bg',x:0,y:0,width:mw,height:nh,rx:14},g);
    el('rect',{x:0,y:12,width:4,height:nh-24,rx:2,style:'fill:'+col},g);
    var t1=el('text',{class:'m',x:mw/2,y:24,'text-anchor':'middle'},g);t1.textContent=b.m;
    var t2=el('text',{class:'s',x:mw/2,y:43,'text-anchor':'middle'},g);t2.textContent=b.words.slice(0,2).join(' · ')+'  '+certIcon(b.cert);
    g.addEventListener('click',function(ev){ev.stopPropagation();sel=i;renderMap();renderRight();});
  });
  // 中心本义
  var core=el('g',{class:'core node'+(sel==='core'?' sel':'')},gNode);
  el('circle',{class:'halo',r:112},core);
  el('circle',{class:'bg',r:86},core);
  var ch=el('text',{class:'ch',x:0,y:8,'text-anchor':'middle'},core);ch.textContent=C.c;
  el('rect',{x:-26,y:-66,width:52,height:20,rx:10,style:'fill:#c4553f'},core);
  var tg=el('text',{class:'tag',x:0,y:-52,'text-anchor':'middle'},core);tg.textContent='本义';
  var cl=wrap(C.core,8).slice(0,2);
  cl.forEach(function(L,j){var t=el('text',{x:0,y:36+j*16,'text-anchor':'middle',style:'font-size:12.5px;fill:#5d5866;font-weight:600'},core);t.textContent=L;});
  core.addEventListener('click',function(ev){ev.stopPropagation();sel='core';renderMap();renderRight();});
}

/* 标题卡 */
function renderTitle(){
  var C=D.chars[cur];
  $('titleCard').innerHTML='<div class="big">'+C.c+'</div><div class="meta"><b>'+C.py+'</b> · '+(cur+1)+' / '+D.chars.length+
   '<div>本义：'+esc(C.core)+'</div><div>义项分支 '+C.br.length+' 条 · 点击节点看详情</div></div>';
}

/* 右栏 */
function nodeDetail(N){
  var h='';
  h+='<div class="sec"><div class="lab">词族</div><div class="words">'+N.words.map(function(w){return '<span>'+esc(w)+'</span>'}).join('')+'</div></div>';
  h+='<div class="sec"><div class="lab">构词拆解</div><div class="bk">'+esc(N.bk)+'</div></div>';
  h+='<div class="sec"><div class="lab">现代例句</div><div class="ex"><span class="tag">示例</span>'+esc(N.ex)+'</div></div>';
  if(N.cl){
    h+='<div class="sec"><div class="lab">文言原句</div><div class="classic"><div class="q">'+esc(N.cl.q)+'</div><div class="src">——'+esc(N.cl.src)+'</div><div class="tr">译文：'+esc(N.cl.tr)+'</div></div></div>';
  }else{
    h+='<div class="sec"><div class="lab">文言原句</div><div class="classic none"><div class="q"><span class="tbdtag">待查</span>暂未核实到可靠的文言用例，不作编造。</div></div></div>';
  }
  h+='<div class="sec"><div class="lab">把握程度</div><span class="cert '+certCls(N.cert)+'">'+certIcon(N.cert)+' '+esc(N.cert)+'</span></div>';
  return h;
}
function renderRight(){
  var C=D.chars[cur], h='';
  if(sel==='core'){
    var N=C.coreNode;
    h+='<div class="card"><h4>本义</h4><div class="detail-title"><span class="chip" style="background:#c4553f">本义</span><b>'+esc(C.core)+'</b></div>';
    h+='<div class="sec"><div class="lab">《说文解字》 <span class="cert '+certCls(C.swCert)+'" style="padding:0 7px;font-size:11px">'+certIcon(C.swCert)+' '+esc(C.swCert)+'</span></div><div class="sw">'+esc(C.sw)+'</div></div>';
    h+='<div class="sec"><div class="lab">字形演变（字形图占位）</div><div class="evo">'+D.evoStages.map(function(s,i){
      var na=C.late&&i<3;
      return '<div class="'+(na?'na':'')+'"><b>'+(na?'未见':(i===4?C.c:'〔　〕'))+'</b><small>'+s+'</small></div>';
    }).join('')+'</div><div class="evo-note">'+(C.late?'后起字：甲骨文、金文、小篆阶段未见（待查）；字形图待补。':'各阶段字形图待补，此处为文字占位。')+'</div></div>';
    h+='<div class="sec"><div class="lab">本义判定理由</div><div class="why" style="margin:0">'+esc(C.reason)+'</div></div>';
    h+=nodeDetail(N)+'</div>';
  }else{
    var B=C.br[sel];
    h+='<div class="card"><h4>义项详情</h4><div class="detail-title"><span class="chip" style="background:'+TYPE_HEX[B.type]+'">'+esc(B.type)+'</span><b>'+esc(B.m)+'</b></div>';
    h+='<div class="why">💡 '+esc(B.why)+'</div>';
    h+=nodeDetail(B);
    h+='<div class="hint"><a href="#" id="backCore" style="color:var(--red)">← 回到本义</a></div></div>';
  }
  var P=C.parts;
  h+='<div class="card"><h4>偏旁拆分</h4><div class="parts">'+
     '<span class="k ty">结构</span><span>'+esc(P.type)+'</span>'+
     '<span class="k yi">表义</span><span>'+esc(P.yi)+'</span>'+
     '<span class="k yin">表音</span><span>'+esc(P.yin)+'</span></div></div>';
  h+='<div class="card"><h4>易读错 · 易写错</h4><div class="err"><div class="r"><b>读</b>'+esc(C.err.read)+'</div><div class="w"><b>写</b>'+esc(C.err.write)+'</div></div></div>';
  h+='<div class="card"><h4>汉字密码</h4><ul class="code">'+C.code.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul></div>';
  $('right').innerHTML=h;
  $('right').scrollTop=0;
  var bc=$('backCore');if(bc)bc.onclick=function(e){e.preventDefault();sel='core';renderMap();renderRight();};
}
function renderAll(){renderTitle();renderMap();renderRight();}

/* 缩放平移 */
var svg=$('map');
function apply(){$('vp').setAttribute('transform','translate('+view.x+','+view.y+') scale('+view.k+')');$('zoomtxt').textContent='缩放 '+Math.round(view.k*100)+'%';}
function fit(){var r=svg.getBoundingClientRect();var k=Math.min(r.width/900,r.height/820);k=Math.max(.45,Math.min(1.25,k));view={x:r.width/2,y:r.height/2+30,k:k};apply();}
function zoomAt(f,cx,cy){var nk=Math.max(.3,Math.min(3,view.k*f));f=nk/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=nk;apply();}
svg.addEventListener('wheel',function(e){e.preventDefault();var r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
var drag=null;
svg.addEventListener('pointerdown',function(e){if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',function(e){if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;apply();});
svg.addEventListener('pointerup',function(){drag=null;svg.classList.remove('drag');});
function center(){var r=svg.getBoundingClientRect();return [r.width/2,r.height/2]}
$('zin').onclick=function(){var c=center();zoomAt(1.2,c[0],c[1])};
$('zout').onclick=function(){var c=center();zoomAt(1/1.2,c[0],c[1])};
$('zfit').onclick=fit;
window.addEventListener('resize',fit);
document.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowUp'){e.preventDefault();go(cur-1)}});

renderList();renderAll();fit();
})();
</script>
