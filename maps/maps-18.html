<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#FBF6EC; --paper:#FFFDF8; --ink:#2E2A26; --ink2:#6B635A; --line:#EADFCB;
  --brand:#D9534F; --brand2:#F3C969; --soft:#F6EEDD;
  --yin:#2FA36B; --bi:#EE8433; --zhuan:#8A63D2; --jia:#2F86D6;
  --ok:#2FA36B; --mid:#D99A1E; --tbd:#B5544F;
  --r:16px; --shadow:0 6px 24px rgba(90,60,20,.10);
  --kai:"KaiTi","STKaiti","Kaiti SC","楷体",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:64px 1fr;height:100vh}
/* top nav */
.top{display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(90,60,20,.05);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo .seal{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:24px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:9px 14px;border-radius:12px;color:var(--ink2);font-size:14px;white-space:nowrap;position:relative}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:#FDE9E4;color:var(--brand);font-weight:700}
.nav button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:3px;height:3px;border-radius:3px;background:var(--brand)}
.nav button .soon{font-size:10px;color:#B8AD9C;margin-left:3px}
/* body */
.main{display:grid;grid-template-columns:132px 1fr 380px;min-height:0}
.side-l{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.side-l h3{margin:2px 6px 10px;font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.1em}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chars button{border:1.5px solid var(--line);background:#fff;border-radius:14px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s}
.chars button b{font-family:var(--kai);font-size:26px;font-weight:400;line-height:1}
.chars button i{font-style:normal;font-size:10px;color:var(--ink2);margin-top:2px}
.chars button:hover{border-color:var(--brand2);transform:translateY(-1px)}
.chars button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(217,83,79,.35)}
.chars button.on i{color:#FFE3DD}
/* map */
.stage{position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,#FFFBF2 0,#FBF6EC 70%);}
.stage svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.stage svg.drag{cursor:grabbing}
.stage .grid{position:absolute;inset:0;background-image:radial-gradient(#E9DDC6 1px,transparent 1px);background-size:22px 22px;opacity:.55;pointer-events:none}
.hd{position:absolute;left:18px;top:14px;display:flex;align-items:center;gap:12px;pointer-events:none}
.hd .big{font-family:var(--kai);font-size:44px;line-height:1;background:#fff;border:2px solid var(--line);border-radius:14px;width:62px;height:62px;display:grid;place-items:center;box-shadow:var(--shadow)}
.hd .t1{font-size:18px;font-weight:700}
.hd .t2{font-size:12px;color:var(--ink2);margin-top:3px}
.tools{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink);box-shadow:0 2px 6px rgba(90,60,20,.08)}
.tools button:hover{background:var(--soft)}
.tools .tg{font-size:11px;line-height:1.1}
.tools .tg.off{color:#B8AD9C}
.legend{position:absolute;left:16px;bottom:14px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;max-width:calc(100% - 32px);font-size:12px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:6px}
.legend em{width:22px;height:4px;border-radius:3px;display:inline-block}
.legend .dash{background:repeating-linear-gradient(90deg,var(--jia) 0 5px,transparent 5px 8px)!important}
.hint{position:absolute;right:16px;bottom:16px;font-size:11px;color:var(--ink2);background:rgba(255,253,248,.85);padding:4px 8px;border-radius:8px}
/* svg nodes */
.node{cursor:pointer}
.node rect,.node circle{transition:filter .15s}
.node:hover rect,.node:hover circle.core{filter:drop-shadow(0 4px 10px rgba(90,60,20,.22))}
.node.sel rect{stroke-width:3.5}
.node.sel circle.core{stroke-width:5}
.elabel{cursor:pointer}
.dim{opacity:.28}
/* right panel */
.side-r{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(90,60,20,.04)}
.card h4{margin:0 0 10px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;letter-spacing:.05em}
.card h4 .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.sense-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sense-title .nm{font-size:20px;font-weight:800}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.t-引申{background:#E3F5EB;color:var(--yin)} .t-比喻{background:#FDEBDC;color:#C9661B} .t-转喻{background:#EEE7FA;color:var(--zhuan)} .t-假借{background:#E1EEFB;color:var(--jia)} .t-本义{background:#FDE4E0;color:var(--brand)}
.c-确定{background:#E3F5EB;color:var(--ok)} .c-通行说法{background:#FBF0D6;color:#A87410} .c-待查{background:#F7E3E1;color:var(--tbd)}
.demo{background:#F1ECE2;color:#8C7F6C}
.why{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-bottom:12px}
.why b{color:var(--ink)}
.row{margin:12px 0 0}
.row .lb{font-size:12px;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#FFF6E3;border:1px solid #F3DFB4;border-radius:10px;padding:4px 10px;font-size:13px}
.txt{font-size:14px;line-height:1.75}
.quote{font-family:var(--kai);font-size:17px;line-height:1.7;border-left:4px solid var(--brand2);padding:4px 0 4px 12px;background:linear-gradient(90deg,#FFF8E6,transparent)}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.tr{font-size:13px;color:#4C463F;line-height:1.7;margin-top:6px}
.tbdbox{font-size:13px;color:var(--tbd);background:#FBF0EF;border:1px dashed #E4B6B2;border-radius:10px;padding:8px 10px}
.sw{font-family:var(--kai);font-size:18px;line-height:1.7;background:#FBF6EA;border-radius:12px;padding:10px 12px}
.evo{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.evo div{flex:0 0 auto;min-width:74px;border:1.5px dashed #D9C9A8;border-radius:12px;padding:8px 6px;text-align:center;background:#FFFCF4}
.evo div .g{height:40px;display:grid;place-items:center;font-family:var(--kai);font-size:28px;color:#B9A882}
.evo div .s{font-size:11px;color:var(--ink2);line-height:1.4}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parts div{border-radius:12px;padding:10px;font-size:13px;line-height:1.6}
.parts .y1{background:#E9F6EF}.parts .y2{background:#E6F0FB}
.parts b{display:block;font-size:12px;margin-bottom:2px}
.parts .y1 b{color:var(--yin)} .parts .y2 b{color:var(--jia)}
.warn{display:flex;gap:10px;margin-top:8px;font-size:13px;line-height:1.65}
.warn .ic{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
.code{background:linear-gradient(135deg,#FFF4E0,#FDE9E4);border-radius:12px;padding:12px;font-size:13px;line-height:1.75}
.code .k{font-weight:800;color:var(--brand);margin-right:4px}
.empty{color:var(--ink2);font-size:13px;line-height:1.7}
.foot{font-size:11px;color:#9E9383;line-height:1.6;padding:0 4px}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:1100px){.main{grid-template-columns:112px 1fr 320px}}
@media (max-width:820px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .side-l{border-right:0;border-bottom:1px solid var(--line)}
  .chars{grid-template-columns:repeat(10,1fr)}
  .stage{height:62vh}
  .side-r{border-left:0}
}
</style>
</head>

 "origin":{"m":"度量的标准、单位","sw":"程，品也。十髮爲程，十程爲分，十分爲寸。从禾呈聲。","swNote":"","evo":["小篆｜从禾呈声","隶书｜从禾呈声","楷书｜程"],"reason":"从「禾」，古人常用禾谷做度量标准；「呈」表音。《说文》说十根头发并排的宽度为一「程」，是长度单位，引申为一般的标准。","cert":"通行说法","words":["程度","规程","程式"],"build":"程（标准）＋ 度（尺度）","modern":"这次测验的难易程度刚刚好。","cl":{"t":"程者，物之准也；礼者，节之准也。","s":"《荀子·致士》","tr":"程（度量标准）是衡量事物的准则；礼是衡量行为节度的准则。"}},

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hz-data').textContent);
const CH = DATA.chars;
const TYPE_COLOR = {"引申":"#2FA36B","比喻":"#EE8433","转喻":"#8A63D2","假借":"#2F86D6"};
const TYPE_BG = {"引申":"#E9F7F0","比喻":"#FEF0E3","转喻":"#F1EBFB","假借":"#E6F1FC"};
const NAV = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

let cur = 0, sel = "origin", showWhy = true;
let view = {k:1,tx:0,ty:0};

/* ---------- nav ---------- */
const nav = $('nav');
NAV.forEach((n,i)=>{
  const b = document.createElement('button');
  b.innerHTML = esc(n) + (i? '<span class="soon">·即将上线</span>':'');
  if(i===0) b.className='on';
  b.onclick = ()=>{ if(i) toast('「'+n+'」模块正在建设中，先来看看字义扩展图吧'); };
  nav.appendChild(b);
});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}

/* ---------- char menu ---------- */
const chars = $('chars');
CH.forEach((d,i)=>{
  const b = document.createElement('button');
  b.innerHTML = '<b>'+esc(d.c)+'</b><i>'+esc(d.py)+'</i>';
  b.onclick = ()=>go(i);
  chars.appendChild(b);
});

/* ---------- layout ---------- */
function layout(d){
  const pos = {origin:{x:0,y:0,depth:0}};
  const kids = p => d.senses.filter(s=>s.p===p);
  const L1 = kids('origin');
  const n = L1.length;
  const R = [0,300,560,800];
  function place(node, ang, spread, depth){
    pos[node.id] = {x:Math.cos(ang)*R[depth], y:Math.sin(ang)*R[depth], depth, ang};
    const ks = kids(node.id);
    ks.forEach((k,j)=>{
      const a = ks.length>1 ? ang + (j/(ks.length-1)-0.5)*spread : ang;
      place(k, a, spread*0.6, Math.min(depth+1,3));
    });
  }
  L1.forEach((s,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    place(s, ang, Math.min(2*Math.PI/n*0.62, 1.0), 1);
  });
  return pos;
}
function wrap(s, n){ const out=[]; let t=String(s); while(t.length>n){out.push(t.slice(0,n)); t=t.slice(n);} if(t) out.push(t); return out; }
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ---------- map ---------- */
function drawMap(){
  const d = CH[cur];
  const vp = $('vp'); vp.innerHTML='';
  const pos = layout(d);
  const gE = el('g',{},vp), gL = el('g',{},vp), gN = el('g',{},vp);
  const byId = {origin:{label:'本义：'+d.origin.m}}; d.senses.forEach(s=>byId[s.id]=s);

  // edges + labels
  d.senses.forEach(s=>{
    const a = pos[s.p], b = pos[s.id];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const off = s.p==='origin'?0:28;
    const cx = mx - dy/len*off, cy = my + dx/len*off;
    const col = TYPE_COLOR[s.type]||'#999';
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':3.2,'stroke-linecap':'round','stroke-dasharray':s.type==='假借'?'9 7':'none',opacity:.85,'data-id':s.id,class:'edge'},gE);
    // arrow dot
    el('circle',{cx:b.x-dx/len*0, cy:b.y, r:0},gE);
    // label at t=.5 on quadratic
    const t=.5, lx=(1-t)*(1-t)*a.x+2*(1-t)*t*cx+t*t*b.x, ly=(1-t)*(1-t)*a.y+2*(1-t)*t*cy+t*t*b.y;
    const g = el('g',{class:'elabel','data-id':s.id,transform:`translate(${lx},${ly})`},gL);
    const lines = showWhy ? wrap(s.why, 13) : [];
    const w = showWhy ? 13*12+18 : 56, h = 24 + (showWhy? lines.length*16+6 : 0);
    el('rect',{x:-w/2,y:-12,width:w,height:h,rx:12,fill:showWhy?'#FFFDF8':TYPE_BG[s.type],stroke:col,'stroke-width':1.2,opacity:.97},g);
    const pill = el('rect',{x:-26,y:-8,width:52,height:18,rx:9,fill:col},g);
    const tt = el('text',{x:0,y:5,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff'},g); tt.textContent=s.type;
    lines.forEach((ln,i)=>{ const tx=el('text',{x:0,y:26+i*16,'text-anchor':'middle','font-size':12,fill:'#5A524A'},g); tx.textContent=ln; });
    g.addEventListener('click',e=>{e.stopPropagation();select(s.id);});
  });

  // center node
  const c = el('g',{class:'node'+(sel==='origin'?' sel':''),'data-id':'origin'},gN);
  el('circle',{cx:0,cy:0,r:96,fill:'#FDE9E4',opacity:.6},c);
  el('circle',{class:'core',cx:0,cy:0,r:80,fill:'#fff',stroke:'#D9534F','stroke-width':3},c);
  const ct = el('text',{x:0,y:12,'text-anchor':'middle','font-size':64,'font-family':'KaiTi,STKaiti,serif',fill:'#2E2A26'},c); ct.textContent=d.c;
  const cp = el('text',{x:0,y:-46,'text-anchor':'middle','font-size':13,fill:'#9A8F80'},c); cp.textContent=d.py;
  const tagW = Math.min(18*d.origin.m.length+40, 300);
  el('rect',{x:-tagW/2,y:96,width:tagW,height:30,rx:15,fill:'#D9534F'},c);
  const cm = el('text',{x:0,y:116,'text-anchor':'middle','font-size':14,'font-weight':700,fill:'#fff'},c);
  cm.textContent = '本义 · ' + (d.origin.m.length>16 ? d.origin.m.slice(0,16)+'…' : d.origin.m);
  c.addEventListener('click',e=>{e.stopPropagation();select('origin');});

  // sense nodes
  d.senses.forEach(s=>{
    const p = pos[s.id], col = TYPE_COLOR[s.type];
    const g = el('g',{class:'node'+(sel===s.id?' sel':''),'data-id':s.id,transform:`translate(${p.x},${p.y})`},gN);
    const w = Math.max(96, s.label.length*16+34), h=48;
    el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:16,fill:'#fff',stroke:col,'stroke-width':2.2},g);
    el('rect',{x:-w/2,y:-h/2,width:8,height:h,rx:4,fill:col},g);
    const t = el('text',{x:4,y:-1,'text-anchor':'middle','font-size':15,'font-weight':700,fill:'#2E2A26'},g); t.textContent=s.label;
    const sub = el('text',{x:4,y:16,'text-anchor':'middle','font-size':11,fill:'#8C8274'},g); sub.textContent=s.words.slice(0,2).join(' · ');
    const cc = {"确定":"#2FA36B","通行说法":"#D99A1E","待查":"#B5544F"}[s.cert];
    el('circle',{cx:w/2-8,cy:-h/2+8,r:5,fill:cc},g);
    g.addEventListener('click',e=>{e.stopPropagation();select(s.id);});
  });
  highlight();
}

function highlight(){
  const d = CH[cur];
  // path of selected to root
  const keep = new Set(['origin']);
  if(sel!=='origin'){ let id=sel; while(id && id!=='origin'){ keep.add(id); const s=d.senses.find(x=>x.id===id); id=s&&s.p; } d.senses.filter(x=>x.p===sel).forEach(x=>keep.add(x.id)); }
  document.querySelectorAll('#vp .node').forEach(n=>{
    const id=n.dataset.id; n.classList.toggle('sel',id===sel);
    n.classList.toggle('dim', sel!=='origin' && !keep.has(id));
  });
  document.querySelectorAll('#vp .edge, #vp .elabel').forEach(n=>{
    n.classList.toggle('dim', sel!=='origin' && !keep.has(n.dataset.id));
  });
}

/* ---------- zoom / pan ---------- */
const svg = $('svg'), vpG = $('vp');
function apply(){ vpG.setAttribute('transform',`translate(${view.tx},${view.ty}) scale(${view.k})`); }
function fit(){
  const r = svg.getBoundingClientRect();
  let bb; try{ bb = vpG.getBBox(); }catch(e){ bb={x:-500,y:-500,width:1000,height:1000}; }
  const pad = 70, top=70;
  const k = Math.min((r.width-pad*2)/bb.width, (r.height-pad-top)/bb.height, 1.25);
  view.k = Math.max(.25,k);
  view.tx = r.width/2 - (bb.x+bb.width/2)*view.k;
  view.ty = top/2 + r.height/2 - (bb.y+bb.height/2)*view.k;
  apply();
}
function zoomAt(f, mx, my){
  const k2 = Math.min(3, Math.max(.2, view.k*f));
  view.tx = mx - (mx-view.tx)*(k2/view.k);
  view.ty = my - (my-view.ty)*(k2/view.k);
  view.k = k2; apply();
}
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top); },{passive:false});
let drag=null; const pts=new Map();
svg.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.target.closest('.node,.elabel')) return;
  drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false}; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId) && pts.size===2){
    const prev=[...pts.values()]; const d0=Math.hypot(prev[0].x-prev[1].x,prev[0].y-prev[1].y);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const now=[...pts.values()]; const d1=Math.hypot(now[0].x-now[1].x,now[0].y-now[1].y);
    const r=svg.getBoundingClientRect(); if(d0>0) zoomAt(d1/d0,(now[0].x+now[1].x)/2-r.left,(now[0].y+now[1].y)/2-r.top);
    return;
  }
  if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
  view.tx=drag.tx+dx; view.ty=drag.ty+dy; apply();
});
function up(e){ pts.delete(e.pointerId); if(drag && !drag.moved && sel!=='origin'){ select('origin'); } drag=null; svg.classList.remove('drag'); }
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
$('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
$('zfit').onclick=fit;
$('zwhy').onclick=()=>{showWhy=!showWhy; $('zwhy').classList.toggle('off',!showWhy); drawMap(); fit();};
window.addEventListener('resize',()=>fit());

/* ---------- panel ---------- */
function clBlock(cl){
  if(!cl) return '<div class="tbdbox">暂未收录可靠的文言原句 · <b>待查</b></div>';
  return '<div class="quote">'+esc(cl.t)+'</div><div class="src">—— '+esc(cl.s)+'</div><div class="tr"><b>译文：</b>'+esc(cl.tr)+'</div>';
}
function senseCard(d, s, isOrigin){
  const parentLabel = isOrigin? '' : (s.p==='origin' ? '本义（'+d.origin.m+'）' : (d.senses.find(x=>x.id===s.p)||{}).label);
  let h = '<div class="card">';
  h += '<h4><span class="dot"></span>'+(isOrigin?'本义详情':'义项详情')+'</h4>';
  h += '<div class="sense-title"><span class="nm">'+esc(isOrigin? d.origin.m : s.label)+'</span>';
  h += '<span class="tag t-'+(isOrigin?'本义':s.type)+'">'+(isOrigin?'本义':esc(s.type))+'</span>';
  h += '<span class="tag c-'+esc(s.cert)+'">把握：'+esc(s.cert)+'</span></div>';
  if(isOrigin){
    h += '<div class="row"><div class="lb">《说文解字》原文</div><div class="sw">'+esc(d.origin.sw)+'</div>'+(d.origin.swNote?'<div class="src">'+esc(d.origin.swNote)+'</div>':'')+'</div>';
    h += '<div class="row"><div class="lb">字形演变（字形图待接入）</div><div class="evo">'+d.origin.evo.map(e=>{const p=e.split('｜');return '<div><div class="g">'+(p[0]==='楷书'||p[0]==='简化字'||p[0]==='繁体'?esc(p[1].slice(0,1)):'？')+'</div><div class="s"><b>'+esc(p[0])+'</b><br>'+esc(p[1]||'')+'</div></div>';}).join('')+'</div></div>';
    h += '<div class="row"><div class="lb">本义判定理由</div><div class="why">'+esc(d.origin.reason)+'</div></div>';
  } else {
    h += '<div class="why"><b>从「'+esc(parentLabel)+'」到「'+esc(s.label)+'」：</b>'+esc(s.why)+'</div>';
  }
  h += '<div class="row"><div class="lb">词族</div><div class="chips">'+s.words.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div>';
  h += '<div class="row"><div class="lb">构词拆解</div><div class="txt">'+esc(s.build)+'</div></div>';
  h += '<div class="row"><div class="lb">现代例句 <span class="tag demo">示例</span></div><div class="txt">'+esc(s.modern)+'</div></div>';
  h += '<div class="row"><div class="lb">文言原句</div>'+clBlock(s.cl)+'</div>';
  h += '</div>';
  return h;
}
function drawPanel(){
  const d = CH[cur];
  let h='';
  if(sel==='origin'){
    const o = Object.assign({cert:d.origin.cert}, d.origin);
    h += senseCard(d, o, true);
  } else {
    h += senseCard(d, d.senses.find(x=>x.id===sel), false);
  }
  h += '<div class="card"><h4><span class="dot" style="background:var(--yin)"></span>偏旁拆分 · '+esc(d.struct)+'</h4>';
  h += '<div class="txt" style="margin-bottom:8px">'+esc(d.parts.type)+'</div>';
  h += '<div class="parts"><div class="y1"><b>表义部分</b>'+esc(d.parts.yi)+'</div><div class="y2"><b>表音部分</b>'+esc(d.parts.yin)+'</div></div></div>';
  h += '<div class="card"><h4><span class="dot" style="background:var(--bi)"></span>易错提醒</h4>';
  h += '<div class="warn"><div class="ic" style="background:#2F86D6">读</div><div>'+esc(d.misread)+'</div></div>';
  h += '<div class="warn"><div class="ic" style="background:#EE8433">写</div><div>'+esc(d.miswrite)+'</div></div></div>';
  h += '<div class="card"><h4><span class="dot" style="background:var(--zhuan)"></span>相关汉字密码</h4><div class="code"><span class="k">密码</span>'+esc(d.code)+'</div></div>';
  h += '<div class="foot">'+esc(DATA.meta.note)+'</div>';
  $('panel').innerHTML = h;
  $('panel').scrollTop = 0;
}

function select(id){ sel=id; highlight(); drawPanel(); }
function go(i){
  cur=(i+CH.length)%CH.length; sel='origin';
  [...chars.children].forEach((b,j)=>b.classList.toggle('on',j===cur));
  const d=CH[cur];
  $('hdChar').textContent=d.c; $('hdT1').textContent='「'+d.c+'」的义项网';
  $('hdT2').textContent='本义 + '+d.senses.length+' 个常用义项 · '+d.py;
  drawMap(); drawPanel(); requestAnimationFrame(fit);
  if(location.hash!=='#'+encodeURIComponent(d.c)) history.replaceState(null,'','#'+encodeURIComponent(d.c));
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'&&e.altKey) go(cur+1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'&&e.altKey) go(cur-1);
});
const fromHash = decodeURIComponent(location.hash.slice(1));
const hi = CH.findIndex(x=>x.c===fromHash);
go(hi>=0?hi:0);
})();
</script>
