<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 20字</title>
<style>
:root{
  --paper:#f7f2e8; --paper2:#fbf8f1; --card:#ffffff; --ink:#2b2622; --ink2:#6b625a; --ink3:#a39a90;
  --line:#e6ddcf; --red:#b8402f; --red2:#d9654f; --gold:#c9a45c;
  --yin:#2f7d6d; --bi:#d07a2a; --zhuan:#5a63b8; --jia:#b8476a;
  --ok:#2f8a57; --mid:#3a6fb0; --tbd:#c58a14;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);overflow:hidden;
  background-image:radial-gradient(circle at 20% 0%,rgba(201,164,92,.10),transparent 40%),radial-gradient(circle at 100% 100%,rgba(184,64,47,.06),transparent 45%)}
.app{display:grid;grid-template-rows:64px 1fr;height:100vh}
/* top nav */
.top{display:flex;align-items:center;gap:22px;padding:0 22px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap}
.seal{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 10px rgba(184,64,47,.3)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink2);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s}
.nav button:hover{background:#f1ebdf;color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(43,38,34,.2)}
.nav button .soon{font-size:10px;opacity:.55;margin-left:3px}
/* main */
.main{display:grid;grid-template-columns:200px 1fr 380px;min-height:0}
.side{border-right:1px solid var(--line);background:rgba(255,255,255,.45);display:flex;flex-direction:column;min-height:0}
.side h3{font-size:12px;letter-spacing:.12em;color:var(--ink3);padding:16px 18px 8px;font-weight:600}
.list{overflow:auto;padding:0 10px 16px;display:flex;flex-direction:column;gap:3px}
.item{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;cursor:pointer;transition:.18s;border:1px solid transparent}
.item:hover{background:#fff}
.item.on{background:#fff;border-color:var(--line);box-shadow:0 4px 14px rgba(80,60,30,.08)}
.item .ch{font-family:var(--serif);font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:#f3ece0;color:var(--ink)}
.item.on .ch{background:var(--red);color:#fff}
.item .py{font-size:12px;color:var(--ink3)}
.item .gl{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .no{font-size:10px;color:var(--ink3)}
/* stage */
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 22px 10px;gap:16px}
.title{display:flex;align-items:center;gap:16px}
.title .big{font-family:var(--serif);font-size:54px;line-height:1;color:var(--red)}
.title .meta .py{font-size:15px;color:var(--ink2)}
.title .meta .g{font-size:15px;margin-top:4px}
.title .meta .g b{font-family:var(--serif)}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;color:#fff;font-weight:600;white-space:nowrap}
.pill.lg{background:#fff;color:var(--ink2);border:1px solid var(--line);font-weight:500}
.pill.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.canvas{position:relative;flex:1;min-height:0;margin:0 16px 16px;border-radius:20px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;
  background-image:linear-gradient(rgba(201,164,92,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(201,164,92,.09) 1px,transparent 1px);background-size:32px 32px}
svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.drag{cursor:grabbing}
.tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.tools button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(80,60,30,.06)}
.tools button:hover{background:#f6f0e6}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--ink3);background:rgba(255,255,255,.8);padding:5px 10px;border-radius:8px}
.node{cursor:pointer}
.node rect{transition:fill .2s}
.node:hover rect.box{filter:drop-shadow(0 4px 10px rgba(80,60,30,.18))}
.elab{font-family:var(--sans);font-size:11.5px;line-height:1.4;color:var(--ink2);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:5px 7px;text-align:center}
.elab .t{display:inline-block;color:#fff;font-weight:700;border-radius:999px;padding:0 7px;margin-bottom:2px;font-size:11px}
/* right panel */
.panel{border-left:1px solid var(--line);background:rgba(255,255,255,.6);overflow:auto;padding:16px 16px 30px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(80,60,30,.05)}
.card h4{font-size:12px;letter-spacing:.1em;color:var(--ink3);margin-bottom:10px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.sense-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sense-h .nm{font-family:var(--serif);font-size:21px;font-weight:700}
.sense-h .py{color:var(--ink3);font-size:13px}
.why{font-size:13.5px;color:var(--ink2);background:#faf6ee;border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.6}
.row{margin-top:11px}
.row .k{font-size:12px;color:var(--ink3);margin-bottom:5px;font-weight:600}
.row .v{font-size:14px;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--serif);font-size:15px;background:#f4eee3;border-radius:8px;padding:3px 10px}
.quote{font-family:var(--serif);font-size:15.5px;line-height:1.7;border-left:3px solid var(--gold);padding:2px 0 2px 10px}
.src{font-size:12px;color:var(--ink2);margin-top:3px}
.tr{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.6}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;font-weight:600;vertical-align:1px;margin-left:4px}
.tag.ex{background:#eef0fa;color:var(--zhuan)}
.tag.ok{background:#e6f4ec;color:var(--ok)}
.tag.mid{background:#e8f0fa;color:var(--mid)}
.tag.tbd{background:#fbf1dc;color:var(--tbd)}
.muted{color:var(--ink3);font-size:13px}
.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.forms div{border:1px dashed #d6c9b3;border-radius:10px;text-align:center;padding:8px 2px;font-size:11px;color:var(--ink3);background:#fdfbf6}
.forms div b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink3);font-weight:400;margin-bottom:2px}
.forms div.last b{color:var(--ink)}
.sw{font-family:var(--serif);font-size:15.5px;line-height:1.75;background:#fbf7ef;border-radius:10px;padding:10px 12px}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.part .p{font-family:var(--serif);font-size:15px;background:#f4eee3;border-radius:8px;padding:4px 9px;white-space:nowrap}
.part .r{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px}
.r-表义{background:#e6f4ec;color:var(--ok)} .r-表音{background:#e8f0fa;color:var(--mid)} .r-记号,.r-无{background:#f1ede6;color:var(--ink2)} .r-待查{background:#fbf1dc;color:var(--tbd)}
.part .n{font-size:13px;color:var(--ink2);line-height:1.6}
ul.err{list-style:none;display:flex;flex-direction:column;gap:6px}
ul.err li{font-size:13.5px;line-height:1.6;padding-left:22px;position:relative}
ul.err li:before{content:attr(data-i);position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:5px;font-size:10px;display:grid;place-items:center;color:#fff;font-weight:700}
ul.err.read li:before{background:var(--mid)} ul.err.write li:before{background:var(--red2)} ul.err.code li:before{background:var(--gold)}
.sub{font-size:12px;font-weight:700;color:var(--ink2);margin:4px 0 6px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.6}
@media (max-width:1100px){.main{grid-template-columns:160px 1fr 320px}}
</style>
</head>

"cl": null, "conf": "确定"}], "parts": [{"p": "阝（左，阜）", "r": "表义", "n": "表示土山、土墙。"}, {"p": "完", "r": "表音", "n": "完 wán → 院 yuàn，古音相近，今音已变。"}], "read": ["读 yuàn，第四声，不要读成 yuán。"], "write": ["左耳刀「阝」在左边，表示土山、墙垣。", "右边是「完」，「元」最后一笔是竖弯钩。"], "code": ["左「阝」多与地势、土墙有关：阶、陡、陵、隔、防。", "「完」作声旁：院、皖、浣（读音都有变化）。"]}, {"c": "让", "py": "ràng", "core": {"g": "责备", "sw": "讓，相責讓。从言襄聲。", "swc": "确定", "why": "形旁「言」说明和说话有关；《说文》训「相责让」，先秦文献有「让」作责备讲的例子，书面语「责让」至今还在用。", "conf": "通行说法", "cl": {"t": "公使让之。", "src": "《左传·僖公五年》", "tr": "晋献公派人责备他（士蒍）。"}}, "s": [{"id": "a", "f": "core", "l": "谦让、退让", "py": "ràng", "t": "引申", "w": "被责备时要往后退一步，后来常指把好处推给别人。（这条引申路线学界说法不一）", "fam": ["谦让", "礼让", "推让"], "b": "礼让＝礼（礼貌）＋让（退让）。", "m": "过马路时，车辆要礼让行人。", "cl": {"t": "夫子温、良、恭、俭、让以得之。", "src": "《论语·学而》", "tr": "老师靠温和、善良、恭敬、节俭、谦让得到这些消息。"}, "conf": "确定"}, {"id": "b", "f": "a", "l": "把东西给别人", "py": "ràng", "t": "引申", "w": "谦让到最后，就是真的把东西交给别人。", "fam": ["让座", "转让", "出让"], "b": "让座＝让（给出）＋座（座位）。", "m": "小明在公交车上给老人让座。", "cl": {"t": "尧让天下于许由。", "src": "《庄子·逍遥游》", "tr": "尧要把天下让给许由。"}, "conf": "确定"}, {"id": "c", "f": "b", "l": "使、叫", "py": "ràng", "t": "引申", "w": "把机会让给别人，别人就能去做，于是变成「叫他做」。", "fam": ["让开", "让路", "让他去"], "b": "让开＝让（使）＋开（离开）。", "m": "妈妈让我早点睡觉。", "cl": null, "conf": "通行说法"}, {"id": "d", "f": "c", "l": "被（让雨淋了）", "py": "ràng", "t": "引申", "w": "「让人看见」既能是「叫人看见」，也能是「被人看见」。", "fam": ["让雨淋了", "让人笑话", "让狗咬了"], "b": "让＋人＋动作：表示被动。", "m": "晾在外面的衣服让雨淋湿了。", "cl": null, "conf": "通行说法"}], "parts": [{"p": "讠", "r": "表义", "n": "和说话有关。"}, {"p": "上（繁体「襄」）", "r": "记号", "n": "繁体「讓」从襄声；简化后右边「上」只是符号，不表音。"}], "read": ["读 ràng，不要读成 rǎng（嚷）。"], "write": ["简化字右边是「上」，不要写成「计、认」。"], "code": ["「襄」作声旁的繁体字：讓、嚷、壤、攘、釀（酿）——韵母多为 -ang。", "简化后「让」的声旁信息丢了，可借繁体理解。"]}, {"c": "识", "py": "shí / zhì", "core": {"g": "知道、认得", "sw": "識，常也。一曰知也。从言戠聲。", "swc": "确定", "why": "《说文》第一义作「常」，段玉裁认为当作「意」（通行说法）；「一曰知也」与先秦用例一致，所以取「知道、认得」作为常用本义。", "conf": "通行说法", "cl": null}, "s": [{"id": "a", "f": "core", "l": "认识、认得出", "py": "shí", "t": "引申", "w": "知道一样东西，再见到时就能认出来。", "fam": ["认识", "识字", "相识"], "b": "识字＝识（认得）＋字。", "m": "我已经认识五百多个汉字了。", "cl": {"t": "不识庐山真面目，只缘身在此山中。", "src": "苏轼《题西林壁》", "tr": "认不清庐山真正的样子，只因为自己就在山里。"}, "conf": "确定"}, {"id": "b", "f": "core", "l": "知识、见识", "py": "shí", "t": "转喻", "w": "知道的东西攒多了，就成了「知识」和「见识」。", "fam": ["知识", "见识", "常识"], "b": "常识＝常（平常）＋识（知道的东西）。", "m": "多读书能增长知识。", "cl": null, "conf": "确定"}, {"id": "c", "f": "core", "l": "记住", "py": "zhì", "t": "引申", "w": "知道了，还要牢牢记在心里。", "fam": ["默识", "强识", "博闻强识"], "b": "默识＝默（不出声）＋识（记住）。", "m": "「博闻强识」就是见得多、记得牢。", "cl": {"t": "默而识之，学而不厌，诲人不倦。", "src": "《论语·述而》", "tr": "默默把知识记在心里，学习不满足，教人不疲倦。"}, "conf": "确定"}, {"id": "d", "f": "c", "l": "标志、记号", "py": "zhì", "t": "转喻", "w": "为了记住，就做个记号。", "fam": ["标识", "款识", "题识"], "b": "标识＝标（标明）＋识（记号）。", "m": "教学楼门口有醒目的安全标识。", "cl": null, "conf": "通行说法"}], "parts": [{"p": "讠", "r": "表义", "n": "和语言、认知有关。"}, {"p": "只（繁体「戠」）", "r": "记号", "n": "繁体从戠声；简化后换成「只」，与读音关系弱。"}], "read": ["一般读 shí；「博闻强识」「款识」读 zhì。", "「标识」的规范读音辞书有过调整，以最新版《现代汉语词典》为准（待查）。"], "write": ["右边是「只」，不要写成「贝」。", "别和「织、职」混：左边不同，意思不同。"], "code": ["「戠」作声旁：識、織（织）、職（职）、幟（帜）——简化后都换成「只」。", "形旁分意思：讠＝认知，纟＝丝线，耳＝职守。"]}, {"c": "候", "py": "hòu", "core": {"g": "守望、侦察", "sw": "候，伺望也。从人侯聲。", "swc": "确定", "why": "《说文》训「伺望」，就是悄悄观察、守望；古代「斥候」指侦察兵，保留了这个意思。", "conf": "通行说法", "cl": null}, "s": [{"id": "a", "f": "core", "l": "等待", "py": "hòu", "t": "引申", "w": "一直守着看，其实就是在等。", "fam": ["等候", "候车", "守候"], "b": "候车＝候（等）＋车。", "m": "我们在站台上等候火车。", "cl": {"t": "僮仆欢迎，稚子候门。", "src": "陶渊明《归去来兮辞》", "tr": "仆人高兴地迎接，小孩子在门口等候。"}, "conf": "确定"}, {"id": "b", "f": "a", "l": "问候、看望", "py": "hòu", "t": "引申", "w": "去看望别人、向人请安，就是「问候」。", "fam": ["问候", "致候", "候教"], "b": "问候＝问（询问）＋候（请安）。", "m": "过年时，我给爷爷打电话问候。", "cl": null, "conf": "通行说法"}, {"id": "c", "f": "core", "l": "时节、节令", "py": "hòu", "t": "转喻", "w": "古人守望观察天气和动植物，观察到的一段时间就叫「候」。", "fam": ["气候", "时候", "候鸟"], "b": "候鸟＝候（随季节）＋鸟。", "m": "大雁是候鸟，秋天飞往南方。", "cl": {"t": "五日谓之候，三候谓之气。", "src": "《素问·六节藏象论》", "tr": "五天叫一「候」，三候叫一「气」（节气）。"}, "conf": "通行说法"}, {"id": "d", "f": "c", "l": "情况 <script>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const confTag = c => `<span class="tag ${CONF[c]||'tbd'}">${esc(c)}</span>`;

  $('list').innerHTML = CH.map((c,i)=>`<div class="item ${i===cur?'on':''}" data-i="${i}">

}

document.addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ e.preventDefault(); select(Math.min(CH.length-1,cur+1)); }
  if(e.key==='ArrowUp'){ e.preventDefault(); select(Math.max(0,cur-1)); }
});

/* layout: radial tree, angle share by leaf count */
function layout(ch){
  const kids = {}; ch.s.forEach(s => (kids[s.f] = kids[s.f]||[]).push(s));
  const leaves = id => (kids[id]||[]).length ? kids[id].reduce((a,s)=>a+leaves(s.id),0) : 1;
  pos = {core:{x:0,y:0,depth:0}};
  const R = [0, 300, 540, 760, 960, 1150];
  function place(id, a0, a1, depth){
    const list = kids[id]||[]; const tot = list.reduce((a,s)=>a+leaves(s.id),0); let a = a0;
    list.forEach(s=>{ const span=(a1-a0)*leaves(s.id)/tot; const mid=a+span/2;
      pos[s.id] = {x:Math.cos(mid)*R[depth], y:Math.sin(mid)*R[depth]*0.82, depth, a:mid};
      place(s.id, a, a+span, depth+1); a += span; });
  }
  place('core', -Math.PI/2, Math.PI*1.5, 1);
}

const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function nodeW(s){ return Math.max(118, s.l.length*15 + 34); }

function renderMap(){
  const ch = CH[cur]; layout(ch);
  const vp = $('vp'); vp.innerHTML = '';
  const gE = el('g',{},vp), gL = el('g',{},vp), gN = el('g',{},vp);
  ch.s.forEach(s=>{
    const p = pos[s.f], q = pos[s.id], col = TCOL[s.t];
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2, dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1;
    const cx = mx - dy/len*28, cy = my + dx/len*28;
    el('path',{d:`M${p.x},${p.y} Q${cx},${cy} ${q.x},${q.y}`,fill:'none',stroke:col,'stroke-width':2.4,'stroke-dasharray':s.t==='假借'?'7 6':'', 'stroke-linecap':'round',opacity:.85},gE);
    const lx = .25*p.x+.5*cx+.25*q.x, ly = .25*p.y+.5*cy+.25*q.y;
    const fo = el('foreignObject',{x:lx-80,y:ly-34,width:160,height:80},gL);
    fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="elab"><span class="t" style="background:${col}">${s.t}</span><br>${esc(s.w)}</div>`;
    // shrink height to content
    requestAnimationFrame(()=>{ const d=fo.firstChild; if(d){ const h=d.offsetHeight+2; fo.setAttribute('height',h); fo.setAttribute('y',ly-h/2);} });
  });
  // sense nodes
  ch.s.forEach(s=>{
    const q = pos[s.id], w = nodeW(s), h = 58, col = TCOL[s.t], on = sel===s.id;
    const g = el('g',{class:'node',transform:`translate(${q.x-w/2},${q.y-h/2})`},gN);
    el('rect',{class:'box',width:w,height:h,rx:16,fill:on?col:'#fff',stroke:col,'stroke-width':on?0:2},g);
    el('rect',{x:10,y:10,width:4,height:h-20,rx:2,fill:on?'rgba(255,255,255,.7)':col},g);
    const t1 = el('text',{x:w/2+4,y:25,'text-anchor':'middle','font-size':12,fill:on?'rgba(255,255,255,.85)':'#a39a90','font-family':'PingFang SC, Microsoft YaHei, sans-serif'},g); t1.textContent = s.py + (s.conf==='待查'?' · 待查':'');
    const t2 = el('text',{x:w/2+4,y:45,'text-anchor':'middle','font-size':16,'font-weight':700,fill:on?'#fff':'#2b2622','font-family':'Noto Serif SC, Songti SC, STSong, SimSun, serif'},g); t2.textContent = s.l;
    g.addEventListener('click', ()=>{ if(!moved) pick(s.id); });
  });
  // core
  const cg = el('g',{class:'node'},gN), con = sel==='core';
  el('circle',{r:92,fill:'none',stroke:'#c9a45c','stroke-width':con?3:1.5,'stroke-dasharray':'3 6'},cg);
  el('circle',{r:78,fill:'url(#coreg)'},cg);
  const tc = el('text',{y:18,'text-anchor':'middle','font-size':66,fill:'#fff','font-family':'Noto Serif SC, Songti SC, STSong, SimSun, serif'},cg); tc.textContent = ch.c;
  const tb = el('text',{y:-44,'text-anchor':'middle','font-size':12,fill:'rgba(255,255,255,.85)','letter-spacing':'2'},cg); tb.textContent = '本义';
  const gw = Math.max(120, ch.core.g.length*16+30);
  el('rect',{x:-gw/2,y:100,width:gw,height:32,rx:16,fill:'#2b2622'},cg);
  const tg = el('text',{y:121,'text-anchor':'middle','font-size':15,fill:'#fff','font-family':'Noto Serif SC, Songti SC, STSong, SimSun, serif'},cg); tg.textContent = ch.core.g;
  cg.addEventListener('click', ()=>{ if(!moved) pick('core'); });
}

/* pan & zoom */
const svg = $('svg'); let drag=null, moved=false;
function apply(){ $('vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){
  const r = svg.getBoundingClientRect(); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  CH[cur].s.forEach(s=>{ const q=pos[s.id], w=nodeW(s)/2; x0=Math.min(x0,q.x-w); x1=Math.max(x1,q.x+w); y0=Math.min(y0,q.y-40); y1=Math.max(y1,q.y+40); });
  x0=Math.min(x0,-110); x1=Math.max(x1,110); y0=Math.min(y0,-110); y1=Math.max(y1,140);
  const pad=40, k = Math.min((r.width-pad*2)/(x1-x0), (r.height-pad*2)/(y1-y0), 1.15);
  view.k = Math.max(.3,k); view.x = r.width/2 - (x0+x1)/2*view.k; view.y = r.height/2 - (y0+y1)/2*view.k; apply();
}
function zoomAt(f, mx, my){ const k2=Math.min(3,Math.max(.25,view.k*f)); view.x = mx-(mx-view.x)*(k2/view.k); view.y = my-(my-view.y)*(k2/view.k); view.k=k2; apply(); }
svg.addEventListener('wheel', e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
svg.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; moved=false; });
window.addEventListener('pointermove', e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){ moved=true; svg.classList.add('drag'); } if(moved){ view.x=drag.vx+dx; view.y=drag.vy+dy; apply(); } });
window.addEventListener('pointerup', ()=>{ drag=null; svg.classList.remove('drag'); setTimeout(()=>moved=false,0); });
const center = f => { const r=svg.getBoundingClientRect(); zoomAt(f, r.width/2, r.height/2); };
$('zin').onclick=()=>center(1.25); $('zout').onclick=()=>center(0.8); $('zfit').onclick=fit;
window.addEventListener('resize', fit);

/* right panel */
function quoteBlock(cl, emptyMsg){
  if(!cl) return `<div class="muted">${emptyMsg}</div>`;
  return `<div class="quote">${esc(cl.t)}</div><div class="src">—— ${esc(cl.src)}</div>${cl.tr?`<div class="tr">译文：${esc(cl.tr)}</div>`:''}`;
}
function renderPanel(){
  const ch = CH[cur]; let top='';
  if(sel==='core'){
    const c = ch.core, f = ch.c;
    top = `<div class="card"><h4>本义 · 中心节点 ${confTag(c.conf)}</h4>
      <div class="sense-h"><span class="nm">${esc(c.g)}</span><span class="py">${esc(ch.py)}</span></div>
      <div class="row"><div class="k">《说文解字》原文 ${confTag(c.swc)}</div><div class="sw">${esc(c.sw)}</div></div>
      <div class="row"><div class="k">字形演变 <span class="tag tbd">字形图待补</span></div>
        <div class="forms">${['甲骨文','金文','小篆','隶书','楷书'].map((n,i)=>`<div class="${i===4?'last':''}"><b>${i===4?f:'▢'}</b>${n}</div>`).join('')}</div></div>
      <div class="row"><div class="k">本义判定理由</div><div class="v">${esc(c.why)}</div></div>
      <div class="row"><div class="k">文言原句</div>${quoteBlock(c.cl,'本义例句待查（未核实的不列出）。')}</div></div>`;
  } else {
    const s = ch.s.find(x=>x.id===sel), par = s.f==='core' ? '本义「'+ch.core.g+'」' : '「'+ch.s.find(x=>x.id===s.f).l+'」';
    top = `<div class="card"><h4>义项详情 ${confTag(s.conf)}</h4>
      <div class="sense-h"><span class="nm">${esc(s.l)}</span><span class="py">${esc(s.py)}</span><span class="pill" style="background:${TCOL[s.t]}">${s.t}</span></div>
      <div class="why">从${esc(par)}→ ${esc(s.w)}</div>
      <div class="row"><div class="k">词族</div><div class="chips">${s.fam.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div></div>
      <div class="row"><div class="k">构词拆解</div><div class="v">${esc(s.b)}</div></div>
      <div class="row"><div class="k">现代例句 <span class="tag ex">示例</span></div><div class="v">${esc(s.m)}</div></div>
      <div class="row"><div class="k">文言原句</div>${quoteBlock(s.cl,'待查：暂无核实过的文言例句（多为现代常用义）。')}</div>
      <div class="row"><div class="k">把握程度</div><div class="v">${confTag(s.conf)} <span class="muted">${esc(DATA.meta.confNote.split('；').find(x=>x.startsWith(s.conf))||'')}</span></div></div></div>`;
  }
  const parts = ch.parts.map(p=>`<div class="part"><span class="p">${esc(p.p)}</span><div class="n"><span class="r r-${esc(p.r)}">${esc(p.r)}</span>${esc(p.n)}</div></div>`).join('');
  const li = (arr,cls,m) => `<ul class="err ${cls}">${arr.map(x=>`<li data-i="${m}">${esc(x)}</li>`).join('')}</ul>`;
  $('panel').innerHTML = top +
   `<div class="card"><h4>偏旁拆分 <span class="muted">${ch.c}</span></h4><div class="parts">${parts}</div></div>
    <div class="card"><h4>易读错 · 易写错</h4><div class="sub">读音</div>${li(ch.read,'read','读')}<div class="sub" style="margin-top:10px">字形</div>${li(ch.write,'write','写')}</div>
    <div class="card"><h4>相关汉字密码</h4>${li(ch.code,'code','密')}</div>
    <div class="foot">把握程度：${esc(DATA.meta.confNote)}<br>现代例句均为自编，标「示例」。</div>`;
  $('panel').scrollTop = 0;
}

function pick(id){ sel=id; const v={...view}; renderMap(); view=v; apply(); renderPanel(); }
function select(i){
  cur=i; sel='core'; renderList(); const ch=CH[i];
  $('bigc').textContent=ch.c; $('bigpy').textContent=ch.py+' · 义项 '+ch.s.length+' 条';
  $('bigg').innerHTML='本义：<b>'+esc(ch.core.g)+'</b>';
  renderMap(); fit(); renderPanel();
  const it=$('list').children[i]; it && it.scrollIntoView({block:'nearest'});
}
select(0);
</script>
