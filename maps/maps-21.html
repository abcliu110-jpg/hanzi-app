<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#faf6ee; --paper2:#f3ecdf; --card:#fffdf8; --ink:#2b2622; --ink2:#5d544b; --ink3:#8f857a;
  --line:#e6dccb; --seal:#c8553d; --seal-soft:#f6e1d9;
  --t-yin:#2f8f83; --t-bi:#e08a2e; --t-zhuan:#7b5ea7; --t-jia:#8a8f98;
  --c-sure:#3f8f4f; --c-common:#3b72b8; --c-tbd:#c9871a;
  --radius:14px; --shadow:0 2px 10px rgba(80,60,30,.08),0 1px 2px rgba(80,60,30,.06);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* top nav */
.topbar{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .seal{width:34px;height:34px;border-radius:9px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:20px}
.brand small{display:block;font-weight:400;color:var(--ink3);font-size:11px;line-height:1.1}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;color:var(--ink2);font-size:14px;white-space:nowrap;position:relative}
.nav button:hover{background:var(--paper2)}
.nav button.active{background:var(--seal);color:#fff;font-weight:600}
.nav button.soon::after{content:"";position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--line)}
/* layout */
.main{display:grid;grid-template-columns:200px 1fr 360px;min-height:0}
.side{border-right:1px solid var(--line);background:var(--paper2);overflow:auto;padding:14px 10px}
.side h3{margin:4px 8px 10px;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.1em}
.charlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.charbtn{border:1px solid transparent;background:var(--card);border-radius:12px;padding:8px 4px 6px;text-align:center;box-shadow:var(--shadow);transition:.15s}
.charbtn .c{font-family:var(--serif);font-size:26px;line-height:1.1;display:block;color:var(--ink)}
.charbtn .p{font-size:11px;color:var(--ink3)}
.charbtn:hover{transform:translateY(-1px);border-color:var(--line)}
.charbtn.active{border-color:var(--seal);background:var(--seal-soft)}
.charbtn.active .c{color:var(--seal)}
/* center */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.stagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 8px;flex-wrap:wrap}
.title{display:flex;align-items:baseline;gap:12px}
.title .big{font-family:var(--serif);font-size:40px;line-height:1;color:var(--seal)}
.title .meta{color:var(--ink2)}
.title .meta b{font-size:16px;color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px;border-radius:2px}
.legend .jia i{border-top-style:dashed}
.canvaswrap{position:relative;flex:1;margin:0 20px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-height:340px;
  background-image:radial-gradient(circle,#efe6d6 1px,transparent 1px);background-size:22px 22px}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
svg#map.drag{cursor:grabbing}
.tools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;color:var(--ink2);box-shadow:var(--shadow)}
.tools button:hover{color:var(--seal);border-color:var(--seal)}
.toggles{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink2);background:rgba(255,253,248,.92);padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.hint{position:absolute;left:12px;top:10px;font-size:12px;color:var(--ink3)}
.node{cursor:pointer}
.node rect{transition:filter .15s}
.node:hover rect{filter:brightness(.97) drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.node.sel rect{stroke-width:3}
.elabel{pointer-events:none}
/* right panel */
.panel{border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px;background:var(--paper)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card h4{margin:0 0 10px;font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.card h4::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--seal)}
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dhead .name{font-size:19px;font-weight:700;font-family:var(--serif)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.why{background:var(--paper2);border-radius:10px;padding:8px 10px;color:var(--ink2);margin:6px 0 10px}
.why b{color:var(--ink)}
.row{margin:10px 0}
.row .lab{font-size:12px;color:var(--ink3);margin-bottom:4px}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--seal-soft);color:#8e3a27;padding:3px 10px;border-radius:8px;font-weight:600}
.quote{font-family:var(--serif);font-size:15.5px;border-left:3px solid var(--seal);padding:4px 0 4px 10px;margin:4px 0}
.src{font-size:12px;color:var(--ink3)}
.trans{color:var(--ink2);font-size:13px;margin-top:2px}
.tbd{color:var(--c-tbd);font-weight:600}
.tag{font-size:11px;padding:0 6px;border-radius:5px;background:#eef1f5;color:#5b6676;margin-left:6px;vertical-align:1px}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.evo div{border:1px dashed var(--line);border-radius:10px;text-align:center;padding:6px 2px;background:var(--paper)}
.evo .g{font-family:var(--serif);font-size:22px;color:#cbbfae;line-height:1.3}
.evo .s{font-size:11px;color:var(--ink3)}
.kv{display:grid;grid-template-columns:52px 1fr;gap:6px 10px;align-items:start}
.kv .k{font-size:12px;padding:2px 0;text-align:center;border-radius:6px;font-weight:600}
.k.yi{background:#e3f1ef;color:var(--t-yin)} .k.yin{background:#fdeedd;color:#b0671c}
ul.clean{margin:0;padding-left:18px} ul.clean li{margin:3px 0}
.pit{display:flex;gap:8px;margin:4px 0}
.pit .k{flex:none;font-size:12px;padding:1px 7px;border-radius:6px;height:fit-content}
.k.r{background:#fbe6e2;color:#b2412b} .k.w{background:#e7edf8;color:#335f9e}
.codeitem{display:flex;gap:8px;margin:6px 0}
.codeitem::before{content:"🔑";flex:none}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.7}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){.main{grid-template-columns:150px 1fr}.panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.app{height:auto}.canvaswrap{height:520px;flex:none}.charlist{grid-template-columns:1fr}}
@media (max-width:640px){.main{grid-template-columns:1fr}.side{border-right:0}.charlist{grid-template-columns:repeat(5,1fr)}}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="brand"><div class="seal">字</div><div>汉字学习<small>字义扩展图 · 第21组</small></div></div>
    <nav class="nav" id="nav"></nav>
  </header>
  <div class="main">

      </div>
      <div class="canvaswrap" id="wrap">
        <svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>

      </div>
    </section>
    <aside class="panel" id="panel"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

rn": "我们小组一共有四个人。", "classical": null, "certainty": "确定"}, {"id": "c", "label": "量词：一组", "parent": "b", "type": "引申", "why": "一群放在一起的东西，可以数成「一组、两组」。", "words": ["一组", "组诗", "组图"], "parse": "组诗 ＝ 组（成套的一批）＋ 诗", "modern": "老师给我们看了一组秋天的照片。", "classical": null, "certainty": "确定"}], "parts": {"meaning": "纟（糸）：和丝线、织物有关", "sound": "且：「祖、阻、租」都用它表音", "note": "形声字，左形右声。"}, "pitfalls": {"read": ["读 zǔ（第三声）。"], "write": ["右边「且」里面是两横，不要写成一横的「旦」。", "和「祖、租、阻、粗」只差偏旁，按意思选偏旁。"]}, "code": ["纟旁的字多和丝线有关：线、织、组、结、绳。", "「且」族字：祖、组、阻、租、粗、助，读音多带 u 韵。"]}, {"char": "每", "trad": "每", "pinyin": "měi", "origin": {"meaning": "草长得茂盛", "shuowen": "每，艸盛上出也。从屮母聲。", "evo": "小篆上面是「屮」（小草），下面是「母」；楷书上部变成「𠂉」，下部仍是「母」。", "reason": "《说文》训「草盛向上长」，上部「屮」就是草，所以「草茂盛」是本义。", "certainty": "通行说法", "classical": {"text": "原田每每，舍其旧而新是谋。", "src": "《左传·僖公二十八年》", "trans": "原野上的草长得很茂盛，（要）丢开旧的而谋求新的。", "certainty": "确定"}}, "senses": [{"id": "a", "label": "每一个、各个", "parent": "o", "type": "假借", "why": "这个意思和草没关系，是借用了「每」的读音。", "words": ["每天", "每人", "每次"], "parse": "每天 ＝ 每（任何一个）＋ 天", "modern": "我每天睡前都读一会儿书。", "classical": {"text": "子入太庙，每事问。", "src": "《论语·八佾》", "trans": "孔子进入太庙，每件事都要问一问。", "certainty": "确定"}, "certainty": "通行说法"}, {"id": "b", "label": "每当、常常", "parent": "a", "type": "引申", "why": "每一次都这样，也就是「常常这样」。", "words": ["每每", "每逢", "每当"], "parse": "每逢 ＝ 每（每一次）＋ 逢（碰到）", "modern": "每逢下雨，小狗就躲进屋里。", "classical": {"text": "每与臣论此事，未尝不叹息痛恨于桓、灵也。", "src": "诸葛亮《出师表》", "trans": "（先帝）每次和我谈论这件事，没有一次不对桓帝、灵帝感到叹息痛心。", "certainty": "确定"}, "certainty": "确定"}], "parts": {"meaning": "屮（楷书变作「𠂉」）：小草", "sound": "母：古音与「每」相近", "note": "今天看不出草的样子了，可以记作「草长得像妈妈一样多」。"}, "pitfalls": {"read": ["读 měi（第三声）。"], "write": ["下面是「母」（里面两点），不是「毋」（一撇）。", "上面是「𠂉」，一撇一横，别写成「人」。"]}, "code": ["「每」族字：梅、霉、海、悔、敏、晦——都用「每」做声旁。", "假借密码：有些常用义是「借音」来的，和字形没关系。"]}, {"char": "济", "trad": "濟", "pinyin": "jì", "origin": {"meaning": "水名（济水）", "shuowen": "濟，水。出常山房子贊皇山，東入泜。从水齊聲。", "evo": "小篆左水右齐，楷书繁体「濟」，简化为「济」。古代「四渎」之一的济水，《说文》另作「泲」（待查）。", "reason": "字从水，《说文》用水名来解释，所以按《说文》本义是水名；「渡河」与水名的关系 <script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const CHARS = DATA.chars;
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const TYPE_COLOR = {"引申":"#2f8f83","比喻":"#e08a2e","转喻":"#7b5ea7","假借":"#8a8f98"};
const CERT = {"确定":["#3f8f4f","#e6f3e8"],"通行说法":["#3b72b8","#e5eef9"],"待查":["#c9871a","#fbf0dc"]};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = 0, sel = "o", tf = {x:0,y:0,k:1}, bbox = null;

/* nav */
$('#nav').innerHTML = MENU.map((m,i)=>`<button class="${i===0?'active':'soon'}" data-i="${i}">${m}</button>`).join('');
$('#nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.i!=="0") toast(`「${b.textContent}」模块在独立页面中，本页只包含「字义扩展图」`);
});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

/* char list */
$('#charlist').innerHTML = CHARS.map((c,i)=>`<button class="charbtn" data-i="${i}"><span class="c">${c.char}</span><span class="p">${c.pinyin}</span></button>`).join('');
$('#charlist').addEventListener('click', e=>{const b=e.target.closest('.charbtn'); if(b) selectChar(+b.dataset.i);});

function certChip(c){const v=CERT[c]||CERT["待查"];return `<span class="chip" style="color:${v[0]};background:${v[1]};border-color:${v[0]}33">${c==="确定"?"✓":c==="待查"?"?":"≈"} ${esc(c)}</span>`;}
function typeChip(t){const col=TYPE_COLOR[t];return `<span class="chip" style="color:${col};border-color:${col}66;background:${col}12">${esc(t)}</span>`;}

/* layout */
function layout(c){
  const nodes=[{id:"o",label:c.origin.meaning,x:0,y:0,lvl:0}];
  const s=c.senses, byParent={};
  s.forEach(n=>{(byParent[n.parent]=byParent[n.parent]||[]).push(n);});
  const l1=byParent["o"]||[]; const R1=250, R2=440;
  const pos={o:{x:0,y:0,a:0}};
  // weight by children count so branches get space
  const weight=n=>1+((byParent[n.id]||[]).length)*0.6;
  const total=l1.reduce((a,n)=>a+weight(n),0);
  let acc=-Math.PI/2 - (Math.PI*2)*(weight(l1[0]||{id:''})/total)/2;
  l1.forEach(n=>{
    const span=Math.PI*2*weight(n)/total, a=acc+span/2; acc+=span;
    pos[n.id]={x:R1*Math.cos(a),y:R1*Math.sin(a),a,span};
    nodes.push(Object.assign({},n,pos[n.id],{lvl:1}));
  });
  // deeper levels
  let frontier=l1.slice(), depth=2;
  while(frontier.length){
    const next=[];
    frontier.forEach(p=>{
      const kids=byParent[p.id]||[]; if(!kids.length) return;
      const pp=pos[p.id], span=Math.min(pp.span||1, 1.1)*0.8;
      kids.forEach((k,j)=>{
        const a = kids.length===1? pp.a : pp.a - span/2 + span*j/(kids.length-1);
        const R = R1 + (R2-R1)*(depth-1);
        pos[k.id]={x:R*Math.cos(a),y:R*Math.sin(a),a,span:span/kids.length};
        nodes.push(Object.assign({},k,pos[k.id],{lvl:depth}));
        next.push(k);
      });
    });
    frontier=next; depth++;
  }
  return nodes;
}
function wrapText(t,n){const out=[];let s=String(t);while(s.length>n){out.push(s.slice(0,n));s=s.slice(n);}if(s)out.push(s);return out;}
function textW(t,size){let w=0;for(const ch of t){w+= /[\x00-\xff]/.test(ch)?size*0.58:size;}return w;}

function renderMap(){
  const c=CHARS[cur], nodes=layout(c), map={}; nodes.forEach(n=>map[n.id]=n);
  const showWhy=$('#showWhy').checked;
  let edges="", labels="", nds="";
  nodes.forEach(n=>{
    if(n.id==="o") return;
    const p=map[n.parent], col=TYPE_COLOR[n.type]||"#999";
    const dash=n.type==="假借"?'stroke-dasharray="8 6"':'';
    const mx=(p.x+n.x)/2, my=(p.y+n.y)/2;
    // gentle curve
    const dx=n.x-p.x, dy=n.y-p.y, len=Math.hypot(dx,dy)||1, off=18;
    const cx=mx - dy/len*off, cy=my + dx/len*off;
    edges+=`<path d="M${p.x},${p.y} Q${cx},${cy} ${n.x},${n.y}" fill="none" stroke="${col}" stroke-width="2.4" ${dash} opacity=".85"/>`;
    const lx=(p.x+2*cx+n.x)/4, ly=(p.y+2*cy+n.y)/4;
    const tw=textW(n.type,12)+16;
    labels+=`<g class="elabel" transform="translate(${lx},${ly})"><rect x="${-tw/2}" y="-11" width="${tw}" height="22" rx="11" fill="#fff" stroke="${col}" stroke-width="1.4"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="600" fill="${col}">${esc(n.type)}</text>`;
    if(showWhy){
      const lines=wrapText(n.why,11);
      const bw=Math.max(...lines.map(l=>textW(l,11)))+12, bh=lines.length*15+8;
      labels+=`<rect x="${-bw/2}" y="14" width="${bw}" height="${bh}" rx="7" fill="#fffdf8" fill-opacity=".93" stroke="${col}" stroke-opacity=".25"/>`;
      lines.forEach((l,i)=>labels+=`<text y="${28+i*15}" text-anchor="middle" font-size="11" fill="#5d544b">${esc(l)}</text>`);
    }
    labels+=`</g>`;
  });
  nodes.forEach(n=>{
    const isSel=n.id===sel;
    if(n.id==="o"){
      const lines=wrapText(n.label,8);
      nds+=`<g class="node${isSel?' sel':''}" data-id="o"><circle r="86" fill="#c8553d" opacity=".12"/><rect x="-74" y="-74" width="148" height="148" rx="74" fill="#c8553d" stroke="${isSel?'#7d2e1f':'#c8553d'}" stroke-width="${isSel?4:0}"/>
      <text y="-14" text-anchor="middle" font-size="52" fill="#fff" style="font-family:var(--serif)">${esc(c.char)}</text>
      <text y="16" text-anchor="middle" font-size="11" fill="#ffe7df" letter-spacing="2">本 义</text>
      ${lines.map((l,i)=>`<text y="${36+i*16}" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">${esc(l)}</text>`).join('')}</g>`;
    }else{
      const col=TYPE_COLOR[n.type]||"#999", w=textW(n.label,15)+34, h=40;
      const cc=(CERT[n.certainty]||CERT["待查"])[0];
      nds+=`<g class="node${isSel?' sel':''}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
      <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="12" fill="${isSel?col:'#fffdf8'}" stroke="${col}" stroke-width="${isSel?3:1.8}"/>
      <circle cx="${-w/2+13}" cy="0" r="4" fill="${isSel?'#fff':cc}"/>
      <text x="6" y="5.5" text-anchor="middle" font-size="15" font-weight="600" fill="${isSel?'#fff':'#2b2622'}">${esc(n.label)}</text></g>`;
    }
  });
  $('#vp').innerHTML=`<g>${edges}</g><g>${nds}</g><g>${labels}</g>`;
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  bbox={x0:Math.min(...xs)-140,x1:Math.max(...xs)+140,y0:Math.min(...ys)-110,y1:Math.max(...ys)+130};
}
function applyTf(){ $('#vp').setAttribute('transform',`translate(${tf.x},${tf.y}) scale(${tf.k})`); }
function fit(){
  const svg=$('#map'), W=svg.clientWidth, H=svg.clientHeight; if(!bbox||!W) return;
  const k=Math.min(W/(bbox.x1-bbox.x0), H/(bbox.y1-bbox.y0), 1.3);
  tf.k=k; tf.x=W/2-k*(bbox.x0+bbox.x1)/2; tf.y=H/2-k*(bbox.y0+bbox.y1)/2; applyTf();
}
function zoomAt(px,py,f){ const k2=Math.max(.3,Math.min(3.5,tf.k*f)); tf.x=px-(px-tf.x)*k2/tf.k; tf.y=py-(py-tf.y)*k2/tf.k; tf.k=k2; applyTf(); }

/* interactions */
const svg=$('#map');
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx:tf.x,ty:tf.y,moved:false,target:e.target};svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;svg.classList.add('drag');}if(drag.moved){tf.x=drag.tx+dx;tf.y=drag.ty+dy;applyTf();}});
svg.addEventListener('pointerup',e=>{
  if(drag&&!drag.moved){const n=drag.target.closest&&drag.target.closest('.node');if(n){sel=n.dataset.id;renderMap();renderDetail();}}
  drag=null;svg.classList.remove('drag');
});
$('#zin').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1.2);
$('#zout').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1/1.2);
$('#zfit').onclick=fit;
$('#showWhy').onchange=()=>{renderMap();};
window.addEventListener('resize',()=>fit());
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){selectChar((cur+1)%CHARS.length);}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){selectChar((cur-1+CHARS.length)%CHARS.length);}
});

/* detail */
function classicalBlock(cl){
  if(!cl) return `<div class="row"><div class="lab">文言原句</div><span class="tbd">待查</span><span class="src">　暂未核实到合适的可靠出处，不作编造。</span></div>`;
  return `<div class="row"><div class="lab">文言原句 ${certChip(cl.certainty||"确定")}</div><div class="quote">${esc(cl.text)}</div><div class="src">—— ${esc(cl.src)}</div><div class="trans">译文：${esc(cl.trans)}</div></div>`;
}
function renderDetail(){
  const c=CHARS[cur]; let h="";
  if(sel==="o"){
    const o=c.origin;
    h+=`<div class="card"><h4>本义</h4>
      <div class="dhead"><span class="name">${esc(o.meaning)}</span>${certChip(o.certainty)}</div>
      <div class="row"><div class="lab">《说文解字》原文</div><div class="quote">${esc(o.shuowen)}</div></div>
      <div class="row"><div class="lab">字形演变 <span class="tag">字形图占位</span></div>
        <div class="evo">${["甲骨文","金文","小篆","隶书","楷书"].map((s,i)=>`<div><div class="g">${i===4?esc(c.trad):"□"}</div><div class="s">${s}</div></div>`).join('')}</div>
        <div class="trans">${esc(o.evo)}</div></div>
      <div class="row"><div class="lab">本义判定理由</div><div class="why">${esc(o.reason)}</div></div>
      ${o.classical?classicalBlock(o.classical):''}
      <div class="foot">点击图中的义项，查看词族、构词、例句。</div></div>`;
  }else{
    const s=c.senses.find(x=>x.id===sel), p=s.parent==="o"?"本义":(c.senses.find(x=>x.id===s.parent)||{}).label;
    h+=`<div class="card"><h4>义项详情</h4>
      <div class="dhead"><span class="name">${esc(s.label)}</span>${typeChip(s.type)}${certChip(s.certainty)}</div>
      <div class="src">由「${esc(p)}」${esc(s.type)}而来</div>
      <div class="why"><b>为什么？</b>${esc(s.why)}</div>
      <div class="row"><div class="lab">词族</div><div class="words">${s.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
      <div class="row"><div class="lab">构词拆解</div><div>${esc(s.parse)}</div></div>
      <div class="row"><div class="lab">现代例句<span class="tag">示例</span></div><div>${esc(s.modern)}</div></div>
      ${classicalBlock(s.classical)}
      <div class="row"><div class="lab">把握程度</div>${certChip(s.certainty)}</div></div>`;
  }
  const pt=c.parts;
  h+=`<div class="card"><h4>偏旁拆分</h4><div class="kv">
      <span class="k yi">表义</span><span>${esc(pt.meaning)}</span>
      <span class="k yin">表音</span><span>${esc(pt.sound)}</span></div>
      <div class="trans" style="margin-top:8px">${esc(pt.note)}</div></div>
    <div class="card"><h4>易读错 · 易写错</h4>
      ${c.pitfalls.read.map(t=>`<div class="pit"><span class="k r">读</span><span>${esc(t)}</span></div>`).join('')}
      ${c.pitfalls.write.map(t=>`<div class="pit"><span class="k w">写</span><span>${esc(t)}</span></div>`).join('')}</div>
    <div class="card"><h4>相关汉字密码</h4>${c.code.map(t=>`<div class="codeitem">${esc(t)}</div>`).join('')}</div>
    <div class="foot">把握程度：<b style="color:var(--c-sure)">确定</b>＝有原文可依；<b style="color:var(--c-common)">通行说法</b>＝多数辞书采用但仍有分歧；<b style="color:var(--c-tbd)">待查</b>＝尚未核实，不作定论。现代例句均为自编示例；字形图为占位，待接入字形库。</div>`;
  $('#panel').innerHTML=h;
}
function selectChar(i){
  cur=i; sel="o";
  document.querySelectorAll('.charbtn').forEach((b,j)=>b.classList.toggle('active',j===i));
  const c=CHARS[i];
  $('#tChar').textContent=c.char;
  $('#tMeta').innerHTML=`<b>${esc(c.pinyin)}</b>　繁体 ${esc(c.trad)}　·　${c.senses.length} 个常用义项`;
  renderMap(); fit(); renderDetail();
  const b=document.querySelector(`.charbtn[data-i="${i}"]`); if(b&&b.scrollIntoView) b.scrollIntoView({block:'nearest'});
}
selectChar(0);
requestAnimationFrame(fit);
})();
</script>
</body>
</html>
