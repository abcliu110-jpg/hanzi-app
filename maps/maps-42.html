<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 第42组</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2622; --ink2:#6b625a; --line:#e6dccb;
  --red:#c2412d; --red-soft:#f7e3dc;
  --t-yin:#2f8f83; --t-bi:#e08a2b; --t-zhuan:#7a5bc0; --t-jia:#9a6a5a;
  --ok:#2f8f5b; --mid:#c79a1e; --wait:#b0473a;
  --r:14px; --shadow:0 6px 24px rgba(80,60,30,.08);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --kai:"STKaiti","KaiTi","Kaiti SC","BiauKai","AR PL UKai CN",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{display:grid;grid-template-rows:64px 1fr;height:100vh}
/* top */
header{display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.04);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.seal{width:36px;height:36px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink2);letter-spacing:.5px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
nav.top button:hover{background:#f3ece0;color:var(--ink)}
nav.top button.on{background:var(--red);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(194,65,45,.3)}
.grp{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap;background:#f3ece0;padding:5px 12px;border-radius:999px}
/* body */
.main{display:grid;grid-template-columns:168px 1fr 320px;gap:14px;padding:14px;min-height:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:0}
aside.left{display:flex;flex-direction:column;overflow:hidden}
aside.left h3{font-size:12px;color:var(--ink2);font-weight:600;padding:14px 14px 8px;letter-spacing:1px}
.charlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 12px;overflow-y:auto}
.charlist button{display:flex;flex-direction:column;align-items:center;padding:7px 0 5px;border-radius:12px;border:1px solid transparent;transition:.18s}
.charlist button b{font-family:var(--kai);font-size:26px;font-weight:400;line-height:1.15}
.charlist button i{font-style:normal;font-size:10.5px;color:var(--ink2)}
.charlist button:hover{background:#f7f0e4}
.charlist button.on{background:var(--red-soft);border-color:#eab8aa}
.charlist button.on b{color:var(--red)}
/* center */
section.stage{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;position:relative}
.stagehead{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px dashed var(--line)}
.bigchar{font-family:var(--kai);font-size:44px;line-height:1;color:var(--red);width:58px;height:58px;display:grid;place-items:center;border:2px solid #eab8aa;border-radius:12px;background:
 linear-gradient(#f2d5cc,#f2d5cc) center/1px 100% no-repeat, linear-gradient(#f2d5cc,#f2d5cc) center/100% 1px no-repeat, #fff}
.headinfo .py{color:var(--ink2);font-size:13px}
.headinfo .t{font-size:16px;font-weight:700}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend em{width:18px;height:4px;border-radius:2px;display:inline-block}
.canvas{position:relative;overflow:hidden;cursor:grab;background:
 radial-gradient(circle,#e9dfcd 1px,transparent 1.2px) 0 0/22px 22px}
.canvas.drag{cursor:grabbing}
.canvas svg{width:100%;height:100%;display:block;user-select:none}
.zoombar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:34px;height:34px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:17px;box-shadow:var(--shadow)}
.zoombar button:hover{color:var(--red)}
.hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--ink2);background:rgba(255,253,248,.85);padding:3px 10px;border-radius:999px}
.node{cursor:pointer}
.node rect,.node circle{transition:.18s}
.node:hover rect{stroke-width:2.5}
.node.sel rect{stroke-width:3;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.node.sel circle.core{stroke-width:5}
/* detail */
.detail{border-top:1px solid var(--line);padding:14px 18px;max-height:44%;overflow-y:auto;background:linear-gradient(#fffdf8,#fffaf0)}
.dtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dtitle h2{font-size:18px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.lv-确定{background:#e2f2e8;color:var(--ok)} .lv-通行说法{background:#fbf0d2;color:#9a7410} .lv-待查{background:#f8e0dc;color:var(--wait)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box h4{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:5px;letter-spacing:.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f5eee2;border-radius:8px;padding:3px 10px;font-size:14px}
.chip b{color:var(--red);font-weight:600}
.sample{font-size:10.5px;background:#eef0f6;color:#5a6690;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
.guwen{font-family:var(--kai);font-size:16px}
.src{font-size:12px;color:var(--ink2)}
.trans{font-size:13px;color:var(--ink2);margin-top:3px}
.evo{display:flex;gap:8px}
.evo div{flex:1;border:1px dashed #d8c9b0;border-radius:10px;padding:8px 6px;text-align:center;background:#fffcf5}
.evo b{display:block;font-size:12px;color:var(--red)}
.evo span{font-size:11.5px;color:var(--ink2)}
.full{grid-column:1/-1}
/* right */
aside.right{overflow-y:auto;padding:14px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.rcard h3{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rcard h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--red)}
.split{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.split .pc{flex:1;border-radius:10px;padding:8px;font-size:12.5px}
.pc.f{background:#e5f3f0;color:#245f58} .pc.s{background:#fdf0de;color:#8a5a14}
.pc b{display:block;font-size:11px;opacity:.8;margin-bottom:2px}
.rcard p{font-size:13px;color:var(--ink)}
.rcard .muted{color:var(--ink2);font-size:12px}
.err{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.err i{font-style:normal;flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;height:fit-content;margin-top:2px}
.err .r{background:#e7eefb;color:#3f5fa0} .err .w{background:#fbe5e0;color:var(--red)}
.code{background:linear-gradient(135deg,#fff7ea,#fdeee6);border-color:#f0d6c4}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:11.5px;color:var(--ink2);margin-top:6px}
@media (max-width:1100px){.main{grid-template-columns:140px 1fr}aside.right{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="seal">字</div><div>汉字小学堂<small>儿童汉字学习</small></div></div>
  <nav class="top" id="topnav"></nav>
  <div class="grp">第42组 · 20字</div>
</header>
<div class="main">
  <aside class="panel left"><h3>本组汉字</h3><div class="charlist" id="charlist"></div></aside>

    </div>
    <div class="detail" id="detail"></div>
  </section>
  <aside class="panel right" id="right"></aside>
</div>
</div>
<div class="toast" id="toast"></div>

口）", "modern": "他推托有事，没有来。", "sample": true, "classical": null, "level": "确定"}, {"label": "衬托、陪衬", "py": "", "type": "比喻", "why": "像从下面托着一样，让主体更突出。", "words": ["衬托", "烘托", "托出"], "parse": "衬托 = 衬（陪衬）+ 托（托起）", "modern": "绿叶衬托着红花。", "sample": true, "classical": null, "level": "确定"}], "parts": {"form": "扌：表示和手的动作有关", "sound": "乇（zhé）：提示读音（今音差别较大）", "type": "形声字", "note": "同声旁：宅、诧、咤。"}, "errors": {"read": "读 tuō（第一声）。", "write": "右边“乇”是撇、横、竖弯钩三笔，不要写成“七”或“毛”。"}, "code": "提手旁密码：托、拿、推、拉——带“扌”的字多和手的动作有关。"}, {"char": "央", "py": "yāng", "trad": "央", "core": {"meaning": "正中间", "shuowen": "央，中央也。从大在冂之內。大，人也。央旁同意。一曰久也。", "swNote": "", "evo": [{"stage": "甲骨文", "note": "像人（大）在框（冂）的正中（占位）"}, {"stage": "金文", "note": "同上（占位）"}, {"stage": "小篆", "note": "从大在冂之内（占位）"}, {"stage": "楷书", "note": "央"}], "why": "字形是“大”（人）站在“冂”的正中，《说文》释为“中央”，所以本义是正中间。", "words": ["中央", "央心", "居央"], "parse": "中央 = 中（中间）+ 央（正中）", "modern": "广场中央有一座喷泉。", "classical": {"text": "溯游从之，宛在水中央。", "src": "《诗经·秦风·蒹葭》", "trans": "顺着河流去寻找她，她仿佛就在水的中央。"}, "level": "确定"}, "senses": [{"label": "尽、完结", "py": "", "type": "引申", "why": "中间是分界，过了中间就快到头；“未央”指没有尽头。", "words": ["未央", "夜未央", "乐未央"], "parse": "未央 = 未（没有）+ 央（尽）", "modern": "（示例）“夜未央”就是夜还没过完。", "sample": true, "classical": {"text": "夜如何其？夜未央。", "src": "《诗经·小雅·庭燎》", "trans": "夜里什么时候了？夜还没有过完。"}, "level": "确定"}, {"label": "恳求", "py": "", "type": "假借", "why": "借“央”的音表示请求。", "words": ["央求", "央告", "央托"], "parse": "央求 = 央（恳求）+ 求", "modern": "弟弟央求妈妈再讲一个故事。", "sample": true, "classical": null, "level": "通行说法"}, {"label": "国家的最高机关", "py": "", "type": "引申", "why": "处在全国“中心”位置的机构。", "words": ["中央", "党中央", "央行"], "parse": "央行 = 中央 + 银行", "modern": "（示例）中央电视台简称“央视”。", "sample": true, "classical": null, "level": "确定"}], "parts": {"form": "大：人（会意）＋冂：框", "sound": "无声旁（会意字）", "type": "会意字", "note": "作声旁：秧、殃、鸯、泱。"}, "errors": {"read": "读 yāng（后鼻音），不要读成 yān。", "write": "先写“冂”的变形，中间一竖穿出顶部，再写“大”；不要写成“夬”。"}, "code": "声旁“央”密码：秧、殃、鸯、泱——带“央”的字多读 yang。"}, {"char": "户", "py": "hù", "trad": "戶", "core": {"meaning": "单扇的门", "shuowen": "戶，護也。半門曰戶。象形。", "swNote": "", "evo": [{"stage": "甲骨文", "note": "像单扇门（占位）"}, {"stage": "金文", "note": "同上（占位）"}, {"stage": "小篆", "note": "象形（占位）"}, {"stage": "楷书", "note": "户"}], "why": "甲骨文像一扇门，《说文》说“半门曰户”，两扇是“门”，一扇是“户”，所以本义是单扇门。", "words": ["门户", "窗户", "户外"], "parse": "窗户 = 窗 + 户（门）", "modern": "推开窗户，花香飘进来。", "classical": {"text": "唧唧复唧唧，木兰当户织。", "src": "北朝民歌《木兰诗》", "trans": "叹息声一声接一声，木兰对着门在织布。"}, "level": "确定"}, "senses": [{"label": "人家、住户", "py": "", "type": "转喻", "why": "一家一户，用门代指一户人家。", "words": ["住户", "家家户户", "农户"], "parse": "住户 = 住（居住）+ 户（人家）", "modern": "这栋楼有二十户住户。", "sample": true, "classical": {"text": "户庭无尘杂，虚室有余闲。", "src": "陶渊明《归园田居》（其一）", "trans": "门庭里没有世俗杂事，空空的屋子里有的是闲暇。"}, "level": "通行说法"}, {"label": "账户、户头", "py": "", "type": "比喻", "why": "银行里像一扇“门”一样的个人账目。", "words": ["账户", "户头", "开户"], "parse": "开户 = 开（开设）+ 户（账户）", "modern": "（示例）爸爸带我去银行开户。", "sample": true, "classical": null, "level": "确定"}, {"label": "从事某行业的人家", "py": "", "type": "引申", "why": "按职业来分的人家。", "words": ["商户", "个体户", "专业户"], "parse": "商户 = 商（做买卖）+ 户（人家）", "modern": "街上的商户都挂起了灯笼。", "sample": true, "classical": null, "level": "确定"}, {"label": "门第、家庭地位", "py": "", "type": "比喻", "why": "大门小门，比喻家庭的地位。", "words": ["门当户对", "大户", "小户"], "parse": "门当户对 = 门 + 当 + 户 + 对（家庭条件相当）", "modern": "（示例）古人讲究门当户对。", "sample": true, "classical": null, "level": "确定"}], "parts": {"form": "整字象形：一扇门", "sound": "无单独声旁（独体字）", "type": "象形字", "note": "作形旁：房、扇、扁、扉；简化字中作声旁：护、沪。"}, "errors": {"read": "读 hù（第四声）。", "write": "上面是一点，不是一撇；繁体“戶”上面是一撇。"}, "code": "户字头密码：房、扇、扉、扁——带“户”的字多和门、房屋有关。"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const TYPES = {"引申":"var(--t-yin)","比喻":"var(--t-bi)","转喻":"var(--t-zhuan)","假借":"var(--t-jia)"};
const TYPEHEX = {"引申":"#2f8f83","比喻":"#e08a2b","转喻":"#7a5bc0","假借":"#9a6a5a"};
const TYPEBG = {"引申":"#e5f3f0","比喻":"#fdf0de","转喻":"#efe9fa","假借":"#f4ebe7"};
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur = 0, sel = 'core';

// top menu
$('#topnav').innerHTML = MENU.map((m,i)=>`<button class="${i===0?'on':''}" data-i="${i}">${m}</button>`).join('');
$('#topnav').onclick = e => { const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.i !== '0') toast(`「${b.textContent}」模块正在建设中，敬请期待`); };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),1800); }

$('#legend').innerHTML = Object.keys(TYPES).map(k=>`<span><em style="background:${TYPES[k]}"></em>${k}</span>`).join('');

// left list
$('#charlist').innerHTML = DATA.map((d,i)=>`<button data-i="${i}"><b>${d.char}</b><i>${esc(d.py.split(' / ')[0])}</i></button>`).join('');
$('#charlist').onclick = e => { const b=e.target.closest('button'); if(b) select(+b.dataset.i); };

function wrap(t,n){ const out=[]; let s=String(t); while(s.length>n){ out.push(s.slice(0,n)); s=s.slice(n);} if(s) out.push(s); return out; }

// zoom / pan
let view = {x:0,y:0,k:1};
const world = $('#world'), svg=$('#svg'), canvas=$('#canvas');
function applyView(){ world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function zoom(f,cx=0,cy=0){ const k=Math.min(3,Math.max(.4,view.k*f)); const r=k/view.k; view.x=cx-(cx-view.x)*r; view.y=cy-(cy-view.y)*r; view.k=k; applyView(); }
function svgPt(e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
canvas.addEventListener('wheel',e=>{ e.preventDefault(); const p=svgPt(e); zoom(e.deltaY<0?1.12:1/1.12,p.x,p.y); },{passive:false});
let drag=null;
canvas.addEventListener('pointerdown',e=>{ if(e.target.closest('.node')||e.target.closest('.zoombar')) return; drag={p:svgPt(e),x:view.x,y:view.y}; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const p=svgPt(e); view.x=drag.x+(p.x-drag.p.x); view.y=drag.y+(p.y-drag.p.y); applyView(); });
canvas.addEventListener('pointerup',()=>{ drag=null; canvas.classList.remove('drag'); });
$('#zin').onclick=()=>zoom(1.2); $('#zout').onclick=()=>zoom(1/1.2); $('#zreset').onclick=()=>{view={x:0,y:0,k:1};applyView();};

function drawMap(d){
  const n=d.senses.length, R=250, ns='http://www.w3.org/2000/svg';
  let h='';
  // rings
  h+=`<circle r="${R}" fill="none" stroke="#eadfcb" stroke-dasharray="4 8"/>`;
  const pos=d.senses.map((s,i)=>{ const a=-Math.PI/2+ (i+0.5-(n%2?0.5:0))*2*Math.PI/n; return {a,x:Math.cos(a)*R*1.25,y:Math.sin(a)*R*1.0}; });
  // edges
  d.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPEHEX[s.type]||'#999';
    const mx=p.x*0.5, my=p.y*0.5, cx=mx-p.y*0.12, cy=my+p.x*0.12;
    h+=`<path d="M0,0 Q${cx},${cy} ${p.x},${p.y}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" ${s.type==='假借'?'stroke-dasharray="7 6"':''} opacity=".85"/>`;
    const T=0.6, lx=2*T*(1-T)*cx+T*T*p.x, ly=2*T*(1-T)*cy+T*T*p.y;
    const lines=wrap(s.why,13).slice(0,3);
    const w=13*13+16, hh=22+lines.length*15;
    h+=`<g transform="translate(${lx},${ly})">
      <rect x="${-w/2}" y="-11" width="${w}" height="${hh}" rx="9" fill="#fffdf8" stroke="${col}" stroke-opacity=".35"/>
      <rect x="-20" y="-20" width="40" height="18" rx="9" fill="${col}"/>
      <text y="-7" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">${s.type}</text>
      ${lines.map((l,j)=>`<text y="${8+j*15}" text-anchor="middle" font-size="11.5" fill="#5b524a">${esc(l)}${j===2&&wrap(s.why,13).length>3?'…':''}</text>`).join('')}
    </g>`;
  });
  // sense nodes
  d.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPEHEX[s.type], bg=TYPEBG[s.type];
    const lines=wrap(s.label,8); const w=Math.max(...lines.map(l=>l.length))*15+34, hh=lines.length*18+(s.words?24:6)+14;
    h+=`<g class="node ${sel===i?'sel':''}" data-k="${i}" transform="translate(${p.x},${p.y})">
      <rect x="${-w/2}" y="${-hh/2}" width="${w}" height="${hh}" rx="14" fill="${bg}" stroke="${col}" stroke-width="1.6"/>
      ${lines.map((l,j)=>`<text y="${-hh/2+22+j*18}" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2b2622">${esc(l)}</text>`).join('')}
      <text y="${hh/2-11}" text-anchor="middle" font-size="11" fill="${col}">${esc(s.words[0])} · ${esc(s.words[1])}</text>
    </g>`;
  });
  // core
  const c=d.core;
  h+=`<g class="node ${sel==='core'?'sel':''}" data-k="core">
    <circle r="92" fill="#fff4ef" stroke="#f0cfc4" stroke-width="10" opacity=".7"/>
    <circle class="core" r="78" fill="#fffdf8" stroke="#c2412d" stroke-width="3"/>
    <text y="-22" text-anchor="middle" font-size="56" fill="#c2412d" style="font-family:var(--kai)">${d.char}</text>
    <text y="10" text-anchor="middle" font-size="11" fill="#9b8f84" letter-spacing="2">本 义</text>
    ${wrap(c.meaning,8).slice(0,2).map((l,j)=>`<text y="${30+j*17}" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2622">${esc(l)}</text>`).join('')}
  </g>`;
  world.innerHTML=h;
  world.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>{ const k=g.dataset.k; sel = k==='core'?'core':+k; drawMap(d); drawDetail(d); }));
}

function lvTag(l){ return `<span class="tag lv-${l}">把握程度：${l}</span>`; }
function classicalBox(c){
  if(!c) return `<div class="box"><h4>文言原句</h4><p class="src">待查 —— 暂未找到可靠的原句出处，宁缺勿编。</p></div>`;
  return `<div class="box"><h4>文言原句</h4><div class="guwen">${esc(c.text)}</div><div class="src">—— ${esc(c.src)}</div><div class="trans">译文：${esc(c.trans)}</div></div>`;
}
function wordsBox(w,p){ return `<div class="box"><h4>词族</h4><div class="chips">${w.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>
  <div class="box"><h4>构词拆解</h4><p>${esc(p)}</p></div>`; }
function modernBox(m){ const isS=/^（示例）/.test(m); const t=m.replace(/^（示例）/,''); return `<div class="box"><h4>现代例句</h4><p><span class="sample">示例</span>${esc(t)}</p></div>`; }

function drawDetail(d){
  let h='';
  if(sel==='core'){
    const c=d.core;
    h+=`<div class="dtitle"><h2>本义 · ${esc(c.meaning)}</h2><span class="tag" style="background:#f7e3dc;color:#c2412d">中心义</span>${lvTag(c.level)}</div>
    <div class="dgrid">
      <div class="box full"><h4>《说文解字》原文</h4><div class="guwen">${esc(c.shuowen)}</div>${c.swNote?`<div class="note">注：${esc(c.swNote)}</div>`:''}</div>
      <div class="box full"><h4>字形演变（图片占位）</h4><div class="evo">${c.evo.map(e=>`<div><b>${e.stage}</b><span>${esc(e.note)}</span></div>`).join('')}</div></div>
      <div class="box full"><h4>本义判定理由</h4><p>${esc(c.why)}</p></div>
      ${wordsBox(c.words,c.parse)}${modernBox(c.modern)}${classicalBox(c.classical)}
    </div>`;
  } else {
    const s=d.senses[sel];
    h+=`<div class="dtitle"><h2>${esc(s.label)}</h2>${s.py?`<span class="src">${esc(s.py)}</span>`:''}<span class="tag" style="background:${TYPEBG[s.type]};color:${TYPEHEX[s.type]}">${s.type}</span>${lvTag(s.level)}</div>
    <div class="dgrid">
      <div class="box full"><h4>为什么会这样变？</h4><p>本义「${esc(d.core.meaning)}」→「${esc(s.label)}」：${esc(s.why)}</p></div>
      ${wordsBox(s.words,s.parse)}${modernBox(s.modern)}${classicalBox(s.classical)}
    </div>`;
  }
  $('#detail').innerHTML=h;
}

function drawRight(d){
  const p=d.parts, e=d.errors;
  $('#right').innerHTML=`
  <div class="rcard"><h3>偏旁拆分</h3>
    <div class="split"><div class="pc f"><b>表义部分</b>${esc(p.form)}</div><div class="pc s"><b>表音部分</b>${esc(p.sound)}</div></div>
    <p class="muted">结构：${esc(p.type)}${d.trad&&d.trad!==d.char?` · 繁体：${esc(d.trad)}`:''}</p>
    <p class="note">${esc(p.note)}</p></div>
  <div class="rcard"><h3>易读错 · 易写错</h3>
    <div class="err"><i class="r">读</i><span>${esc(e.read)}</span></div>
    <div class="err"><i class="w">写</i><span>${esc(e.write)}</span></div></div>
  <div class="rcard code"><h3>汉字密码</h3><p>${esc(d.code)}</p></div>
  <div class="rcard"><h3>义项速览</h3>
    ${d.senses.map((s,i)=>`<p style="margin-bottom:4px;cursor:pointer" data-k="${i}"><span class="tag" style="background:${TYPEBG[s.type]};color:${TYPEHEX[s.type]}">${s.type}</span> ${esc(s.label)}</p>`).join('')}
    <p class="note">把握程度：确定＝有可靠出处；通行说法＝多数教材辞书采用；待查＝来源未核实。</p></div>`;
  $('#right').querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{ sel=+el.dataset.k; drawMap(d); drawDetail(d); });
}

function select(i){
  cur=i; sel='core'; const d=DATA[i];
  document.querySelectorAll('#charlist button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('#bigchar').textContent=d.char;
  $('#htitle').textContent=`「${d.char}」的字义扩展图`;
  $('#hpy').textContent=`拼音 ${d.py} · ${d.senses.length} 个常用义项`;
  view={x:0,y:0,k:1}; applyView();
  drawMap(d); drawDetail(d); drawRight(d);
}
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowRight'&&e.altKey) select((cur+1)%DATA.length); if(e.key==='ArrowUp') select((cur-1+DATA.length)%DATA.length); });
select(0);
</script>
</body>
</html>
