<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 第44组</title>
<style>
:root{
  --paper:#f7f2e8; --paper2:#fffdf8; --ink:#2b2622; --ink2:#6b6259; --line:#e4dccd;
  --red:#c4513a; --red-soft:#f6e3dc;
  --t-yin:#2a7f7a; --t-bi:#d9822b; --t-zhuan:#7b5ea7; --t-jia:#8a8f98;
  --ok:#3f8f5a; --tong:#3d72b4; --dai:#c98a12;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","BiauKai",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --r:14px; --shadow:0 2px 10px rgba(60,40,20,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
body{display:flex;flex-direction:column;overflow:hidden}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper2);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:3}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .seal{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;font-family:var(--kai);font-size:22px;display:grid;place-items:center}
.brand small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
nav.top{display:flex;gap:4px;flex-wrap:wrap}
nav.top button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font:inherit;color:var(--ink2);cursor:pointer;transition:.15s}
nav.top button:hover{background:#f1ebdf;color:var(--ink)}
nav.top button.on{background:var(--red);color:#fff;font-weight:600}
/* layout */
main{flex:1;display:grid;grid-template-columns:132px 1fr 360px;min-height:0}
aside.list{border-right:1px solid var(--line);background:var(--paper2);overflow:auto;padding:12px 10px}
aside.list h3{margin:4px 6px 10px;font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:.1em}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 0 4px;text-align:center;cursor:pointer;transition:.15s}
.chip b{display:block;font-family:var(--kai);font-size:24px;font-weight:400;line-height:1.1}
.chip i{font-style:normal;font-size:10px;color:var(--ink2)}
.chip:hover{border-color:var(--red)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on i{color:#fde7e0}
/* map */
section.stage{position:relative;min-width:0;display:flex;flex-direction:column}
.stagehead{display:flex;align-items:flex-end;gap:16px;padding:14px 22px 6px}
.bigchar{font-family:var(--kai);font-size:56px;line-height:1;color:var(--ink)}
.meta .py{font-size:18px;color:var(--red);font-weight:600}
.meta .sub{color:var(--ink2);font-size:12px;margin-top:4px}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend em{width:18px;height:4px;border-radius:2px;display:inline-block}
.mapbox{flex:1;position:relative;margin:0 16px 16px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  background-image:radial-gradient(circle,#ece4d4 1px,transparent 1px);background-size:22px 22px}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#map.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;color:var(--ink)}
.zoom button:hover{border-color:var(--red);color:var(--red)}
.hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--ink2);background:rgba(255,253,248,.85);padding:4px 8px;border-radius:8px}
/* svg styles */
.node{cursor:pointer}
.node rect{transition:.15s}
.node:hover rect{filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.node.sel rect.box{stroke-width:3}
.leaf text{font-size:12px;fill:var(--ink2)}
.edge-why{font-size:11px;fill:var(--ink2)}
/* right panel */
aside.side{border-left:1px solid var(--line);background:var(--paper2);overflow:auto;padding:14px 16px 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px}
.card h4{margin:0 0 10px;font-size:13px;color:var(--red);display:flex;align-items:center;gap:6px;letter-spacing:.05em}
.card h4::before{content:"";width:4px;height:14px;background:var(--red);border-radius:2px}
.sname{font-size:18px;font-weight:700;margin:0 0 6px}
.row{margin:9px 0}
.lab{font-size:11px;color:var(--ink2);margin-bottom:3px;letter-spacing:.05em}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;margin-right:4px;vertical-align:middle}
.cert{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid;vertical-align:middle}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--red-soft);color:#8d3523;padding:3px 10px;border-radius:8px;font-size:13px}
.quote{font-family:var(--kai);font-size:16px;line-height:1.6;background:#faf6ee;border-left:3px solid var(--red);padding:8px 10px;border-radius:0 8px 8px 0}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.trans{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.6}
.ex{display:flex;gap:6px;align-items:flex-start;line-height:1.6}
.ex .tag{background:#b8a98f;flex:none;margin-top:3px}
.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.forms div{border:1px dashed #d8ccb6;border-radius:8px;text-align:center;padding:6px 2px;font-size:10px;color:var(--ink2)}
.forms div b{display:block;font-family:var(--kai);font-size:22px;font-weight:400;color:#bfb3a0;height:28px;line-height:28px}
.forms div.last b{color:var(--ink)}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parts div{border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
.p-m{background:#e6f2f1}.p-s{background:#fbeee0}
.parts .lab{color:inherit;opacity:.7}
ul.code{margin:0;padding-left:18px;line-height:1.7}
.mis{line-height:1.7}
.mis b{color:var(--red);font-weight:600}
.muted{color:var(--ink2);font-size:12px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:.92}
@media (max-width:1100px){main{grid-template-columns:110px 1fr 300px}}
</style>
</head>

  <div class="brand"><div class="seal">字</div><div>汉字学习<small>第44组 · 20字</small></div></div>

</header>

  <aside class="side" id="side"></aside>
</main>

", "note": ""}, "mistakes": {"read": "读 liàng（第四声），不读 liáng。", "write": "下面是「几」，不是「儿」；上面是「亠」加「口」加「冖」。"}, "code": ["和「高」长得像的字：亮、京、亭、享，上面都有「亠」和「口」。", "「亮」字里藏着「高」的上半和「几」：人站在高处，四周明亮（记忆提示）。"]}, {"char": "露", "pinyin": "lù", "trad": "露", "structure": "上下结构·形声", "origin": {"meaning": "露水", "shuowen": "露，潤澤也。从雨路聲。", "reason": "「雨」表示和天上落下的水有关，《说文》训「润泽」，指夜里凝结、滋润万物的露水。", "certainty": "确定", "classic": {"text": "可怜九月初三夜，露似真珠月似弓。", "source": "白居易《暮江吟》", "trans": "最可爱的是九月初三的夜晚，露珠像珍珠，月亮像弯弓。"}}, "senses": [{"name": "显露；露出", "type": "引申", "why": "露水挂在草叶外面，人人都看得见，于是指显露出来。", "family": ["露出", "暴露", "显露"], "build": "暴（显出）＋露 → 完全露出来", "example": "小鸡从蛋壳里露出了小脑袋。", "classic": {"text": "小荷才露尖尖角，早有蜻蜓立上头。", "source": "杨万里《小池》", "trans": "小荷叶刚露出尖尖的角，就已经有蜻蜓站在上面了。"}, "certainty": "确定"}, {"name": "在屋外；不遮盖", "type": "转喻", "why": "会被露水打湿的地方，就是屋子外面。", "family": ["露天", "露营", "风餐露宿"], "build": "露（屋外）＋营（住处）→ 在野外搭帐篷住", "example": "暑假我们去山里露营。", "classic": null, "certainty": "确定"}, {"name": "花果做的饮料", "type": "比喻", "why": "清清亮亮的液体，像露水一样。", "family": ["果子露", "花露水", "枇杷露"], "build": "花＋露（像露水的液体）＋水 → 花香做的香水", "example": "夏天，妈妈给我擦了花露水。", "classic": null, "certainty": "确定"}, {"name": "口语：露（lòu）", "type": "引申", "why": "「露出来」在口语里读 lòu。", "family": ["露脸", "露馅儿", "露一手"], "build": "露（显出）＋一手（本事）→ 显显本事", "example": "包子露馅儿了！", "classic": null, "certainty": "确定"}], "parts": {"meaning": "雨（雨字头，与天上落水有关）", "sound": "路（lù，与「露」同音）", "note": "多音字：lù（露水、暴露）、lòu（露脸、露馅儿）。"}, "mistakes": {"read": "书面读 lù；口语「露脸、露馅儿、露一手」读 lòu。", "write": "雨字头下是「路」，「足」字旁最后一笔是提。"}, "code": ["雨字头的字与天气有关：雪、雷、霜、雾、露。", "「路」作声旁：露、鹭、璐，读 lu。"]}]</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const TYPE_COLOR = {"引申":"var(--t-yin)","比喻":"var(--t-bi)","转喻":"var(--t-zhuan)","假借":"var(--t-jia)"};
const TYPE_HEX = {"引申":"#2a7f7a","比喻":"#d9822b","转喻":"#7b5ea7","假借":"#8a8f98"};
const TYPE_TIP = {"引申":"从原来的意思自然延伸出去","比喻":"因为「像」而借用","转喻":"因为「相关、挨着」而借指","假借":"只借读音，和原义无关"};
const CERT = {"确定":"var(--ok)","通行说法":"var(--tong)","待查":"var(--dai)"};
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS="http://www.w3.org/2000/svg";
let cur=0, sel=-1, view={x:0,y:0,k:1};

/* top nav */
const topnav=$('#topnav');
MENU.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;if(i===0)b.className='on';
  b.onclick=()=>{if(i)toast('「'+m+'」模块在其他页面中，本页只展示字义扩展图');};topnav.appendChild(b);});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}

/* legend */
$('#legend').innerHTML=Object.keys(TYPE_COLOR).map(t=>`<span title="${TYPE_TIP[t]}"><em style="background:${TYPE_COLOR[t]}"></em>${t}</span>`).join('');

/* char list */
const chips=$('#chips');
DATA.forEach((d,i)=>{const c=document.createElement('div');c.className='chip';c.innerHTML=`<b>${esc(d.char)}</b><i>${esc(d.pinyin)}</i>`;c.onclick=()=>select(i);chips.appendChild(c);});

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function wrap(str,n){const out=[];let s=String(str);while(s.length>n){out.push(s.slice(0,n));s=s.slice(n);}if(s)out.push(s);return out;}
function textLines(parent,lines,x,y,lh,attrs){const t=el('text',Object.assign({x,y,'text-anchor':'middle'},attrs||{}),parent);
  lines.forEach((ln,i)=>{const ts=el('tspan',{x,dy:i?lh:0},t);ts.textContent=ln;});return t;}

/* map */
const vp=$('#vp'), svg=$('#map');
function applyView(){vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function drawMap(){
  const d=DATA[cur]; vp.innerHTML='';
  const n=d.senses.length, R=330, LR=470;
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  d.senses.forEach((s,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, x=R*Math.cos(a), y=R*Math.sin(a), col=TYPE_HEX[s.type]||'#999';
    // leaves
    s.family.forEach((w,j)=>{const b=a+(j-1)*0.21, lx=LR*Math.cos(b), ly=LR*Math.sin(b);
      el('line',{x1:x,y1:y,x2:lx,y2:ly,stroke:col,'stroke-opacity':.35,'stroke-width':1.2,'stroke-dasharray':'3 4'},gL);
      const g=el('g',{class:'leaf'},gL); const wdt=Math.max(56,w.length*13+18);
      el('rect',{x:lx-wdt/2,y:ly-13,width:wdt,height:26,rx:13,fill:'#fff',stroke:col,'stroke-opacity':.4},g);
      const t=el('text',{x:lx,y:ly+4,'text-anchor':'middle'},g); t.textContent=w;});
    // edge
    const dash = s.type==='假借' ? '7 6' : '';
    el('line',{x1:0,y1:0,x2:x,y2:y,stroke:col,'stroke-width':3,'stroke-dasharray':dash,'stroke-linecap':'round'},gE);
    // edge label
    const mx=0.56*x, my=0.56*y, gl=el('g',{},gE);
    const lines=wrap(s.why,12).slice(0,3);
    const bw=12*11+20, bh=26+lines.length*15;
    el('rect',{x:mx-bw/2,y:my-14,width:bw,height:bh,rx:10,fill:'#fffdf8','fill-opacity':.94,stroke:col,'stroke-opacity':.35},gl);
    el('rect',{x:mx-22,y:my-10,width:44,height:18,rx:9,fill:col},gl);
    const tt=el('text',{x:mx,y:my+3,'text-anchor':'middle','font-size':11,fill:'#fff','font-weight':600},gl); tt.textContent=s.type;
    textLines(gl,lines,mx,my+24,15,{class:'edge-why'});
    // node
    const g=el('g',{class:'node'+(sel===i?' sel':''),'data-i':i},gN);
    const nl=wrap(s.name,8), w=Math.max(130,Math.min(8,s.name.length)*17+30), h=34+nl.length*20;
    el('rect',{class:'box',x:x-w/2,y:y-h/2,width:w,height:h,rx:14,fill:sel===i?col:'#fff',stroke:col,'stroke-width':2},g);
    const num=el('text',{x:x-w/2+12,y:y-h/2+16,'font-size':10,fill:sel===i?'#fff':col,'font-weight':700},g); num.textContent='义'+(i+1);
    textLines(g,nl,x,y-(nl.length-1)*10+6,20,{'font-size':16,'font-weight':600,fill:sel===i?'#fff':'#2b2622'});
    el('circle',{cx:x+w/2-12,cy:y-h/2+12,r:4,fill:CERT_HEX(s.certainty)},g);
    g.addEventListener('click',e=>{if(!moved)pick(i);});
  });
  // center
  const o=d.origin, g=el('g',{class:'node'+(sel===-1?' sel':'')},gN);
  el('circle',{cx:0,cy:0,r:118,fill:'#fff',stroke:'#c4513a','stroke-width':sel===-1?4:2.5},g);
  el('circle',{cx:0,cy:0,r:108,fill:'none',stroke:'#c4513a','stroke-opacity':.25,'stroke-dasharray':'2 4'},g);
  const c1=el('text',{x:0,y:-24,'text-anchor':'middle','font-size':64,'font-family':'Kaiti SC,STKaiti,KaiTi,serif',fill:'#2b2622'},g); c1.textContent=d.char;
  const tag=el('text',{x:0,y:12,'text-anchor':'middle','font-size':12,fill:'#c4513a','font-weight':700},g); tag.textContent='本义';
  textLines(g,wrap(o.meaning,9).slice(0,3),0,34,17,{'font-size':14,fill:'#2b2622'});
  g.addEventListener('click',()=>{if(!moved)pick(-1);});
  applyView();
}
function CERT_HEX(c){return {"确定":"#3f8f5a","通行说法":"#3d72b4","待查":"#c98a12"}[c]||'#999';}

/* zoom & pan */
let drag=null, moved=false;
function svgPt(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(f,px,py){const k=Math.min(3,Math.max(.4,view.k*f));f=k/view.k;view.x=px-(px-view.x)*f;view.y=py-(py-view.y)*f;view.k=k;applyView();}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.12:1/1.12,p.x,p.y);},{passive:false});
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,s:1/svg.getScreenCTM().a};moved=false;});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!moved&&Math.hypot(dx,dy)>4){moved=true;svg.classList.add('drag');}
  if(moved){view.x=drag.vx+dx*drag.s;view.y=drag.vy+dy*drag.s;applyView();}});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');setTimeout(()=>moved=false,0);});
$('#zin').onclick=()=>zoomAt(1.2,0,0); $('#zout').onclick=()=>zoomAt(1/1.2,0,0);
$('#zreset').onclick=()=>{view={x:0,y:0,k:1};applyView();};

/* side panel */
function certBadge(c){return `<span class="cert" style="color:${CERT[c]};border-color:${CERT[c]}">把握：${esc(c)}</span>`;}
function classicHTML(c){
  if(!c) return `<div class="muted">文言原句：<b style="color:var(--dai)">待查</b>（未找到可靠出处，暂不列出）</div>`;
  return `<div class="quote">${esc(c.text)}</div><div class="src">—— ${esc(c.source)}</div><div class="trans"><span class="muted">译文：</span>${esc(c.trans)}</div>`;
}
function detailHTML(){
  const d=DATA[cur];
  if(sel===-1){
    const o=d.origin;
    const stages=["甲骨文","金文","小篆","隶书","楷书"];
    return `<div class="card"><h4>本义 · 中心</h4>
      <div class="sname">${esc(o.meaning)}</div>${certBadge(o.certainty)}
      <div class="row"><div class="lab">《说文解字》原文</div><div class="quote">${esc(o.shuowen)}</div></div>
      <div class="row"><div class="lab">字形演变（字形图占位，待补）</div><div class="forms">${stages.map((s,i)=>`<div class="${i===4?'last':''}"><b>${i===4?esc(d.char):'〔 〕'}</b>${s}</div>`).join('')}</div>
        <div class="muted" style="margin-top:4px">各阶段字形图待补入；是否见于甲骨文、金文，以字形工具书核对为准（待查）。</div></div>
      <div class="row"><div class="lab">本义判定理由</div><div style="line-height:1.7">${esc(o.reason)}</div></div>
      ${o.classic?`<div class="row"><div class="lab">古诗文里的本义</div>${classicHTML(o.classic)}</div>`:''}
      <div class="muted">点击外圈的义项，看它是怎么从本义变来的。</div></div>`;
  }
  const s=d.senses[sel];
  return `<div class="card"><h4>义项 ${sel+1}</h4>
    <div class="sname">${esc(s.name)}</div>
    <span class="tag" style="background:${TYPE_COLOR[s.type]}">${esc(s.type)}</span>${certBadge(s.certainty)}
    <div class="row"><div class="lab">为什么会有这个意思</div><div style="line-height:1.7">${esc(s.why)}</div></div>
    <div class="row"><div class="lab">词族</div><div class="words">${s.family.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
    <div class="row"><div class="lab">构词拆解</div><div>${esc(s.build)}</div></div>
    <div class="row"><div class="lab">现代例句</div><div class="ex"><span class="tag">示例</span><span>${esc(s.example)}</span></div></div>
    <div class="row"><div class="lab">文言原句</div>${classicHTML(s.classic)}</div>
    <div class="muted" style="margin-top:8px;cursor:pointer;color:var(--red)" id="backO">← 回到本义</div></div>`;
}
function sideHTML(){
  const d=DATA[cur];
  return `<div class="card"><h4>偏旁拆分</h4>
      <div class="muted" style="margin-bottom:8px">${esc(d.structure)}</div>
      <div class="parts"><div class="p-m"><div class="lab">表义部分</div>${esc(d.parts.meaning)}</div>
      <div class="p-s"><div class="lab">表音部分</div>${esc(d.parts.sound)}</div></div>
      ${d.parts.note?`<div class="muted" style="margin-top:8px">${esc(d.parts.note)}</div>`:''}</div>
    <div class="card"><h4>易读错 · 易写错</h4><div class="mis"><b>读：</b>${esc(d.mistakes.read)}<br><b>写：</b>${esc(d.mistakes.write)}</div></div>
    <div class="card"><h4>汉字密码</h4><ul class="code">${d.code.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
}
function renderSide(){
  $('#side').innerHTML=detailHTML()+sideHTML();
  const b=$('#backO'); if(b) b.onclick=()=>pick(-1);
}
function pick(i){sel=i;drawMap();renderSide();}
function select(i){
  cur=i;sel=-1;view={x:0,y:0,k:1};
  document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',j===i));
  const d=DATA[i];
  $('#hChar').textContent=d.char; $('#hPy').textContent=d.pinyin;
  $('#hSub').textContent=`繁体/古体：${d.trad} · ${d.senses.length} 个常用义项 · ${d.structure}`;
  drawMap(); renderSide();
}
window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();select((cur+1)%DATA.length);}if(e.key==='ArrowUp'){e.preventDefault();select((cur-1+DATA.length)%DATA.length);}});
select(0);
})();
</script>
</body>
</html>
