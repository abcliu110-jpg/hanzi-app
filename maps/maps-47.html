<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 第47组</title>
<style>
:root{
  --paper:#fbf7ef; --paper2:#f4ecdc; --ink:#2b2622; --ink2:#6b6157; --line:#e6dccb;
  --brand:#c0502e; --brand2:#e9a13b; --card:#fffdf8;
  --yin:#2a8c82; --bi:#e07b28; --zhuan:#7b5cc4; --jia:#d0476f; --ben:#c0502e;
  --ok:#3a9a5b; --tong:#3b7dc4; --dai:#b58a1e;
  --kai:"KaiTi","STKaiti","Kaiti SC","楷体","BiauKai",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --shadow:0 2px 10px rgba(80,55,30,.08),0 1px 2px rgba(80,55,30,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font-family:inherit;cursor:pointer}
/* top nav */
header{height:60px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo .seal{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:22px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{border:0;background:none;padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap}
nav.top button:hover{background:var(--paper2)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600}
nav.top i{font-style:normal;color:var(--line);align-self:center}
/* layout */
.app{display:grid;grid-template-columns:96px 1fr 380px;height:calc(100% - 60px)}
aside.chars{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
aside.chars h4{margin:4px 4px 8px;font-size:12px;color:var(--ink2);font-weight:500;text-align:center}
.cbtn{display:flex;flex-direction:column;align-items:center;width:100%;border:1px solid transparent;background:none;border-radius:12px;padding:6px 0 4px;margin-bottom:4px;color:var(--ink)}
.cbtn b{font-family:var(--kai);font-size:28px;font-weight:400;line-height:1.1}
.cbtn span{font-size:11px;color:var(--ink2)}
.cbtn:hover{background:var(--paper2)}
.cbtn.on{background:#fff2e8;border-color:#f0c7ad}
.cbtn.on b{color:var(--brand)}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
/* head strip */
.strip{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.bigc{width:96px;height:96px;border-radius:18px;background:linear-gradient(145deg,#fff,#f6eadb);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.bigc b{font-family:var(--kai);font-size:60px;font-weight:400;line-height:1}
.bigc span{font-size:12px;color:var(--ink2);margin-top:2px}
.stripR{display:flex;flex-direction:column;gap:8px;min-width:0}
.sw{font-family:var(--kai);font-size:16px;line-height:1.6}
.sw em{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--ink2);margin-right:6px}
.evo{display:flex;gap:8px;flex-wrap:wrap}
.evo div{border:1px dashed #d8c8ad;background:var(--paper);border-radius:10px;padding:5px 9px;font-size:12px;color:var(--ink2);max-width:240px}
.evo div b{color:var(--ink);font-weight:600;margin-right:4px}
.benyi{font-size:13px;color:var(--ink);line-height:1.6}
.benyi strong{color:var(--brand)}
/* map */
.mapwrap{position:relative;flex:1;min-height:300px;background:
  radial-gradient(circle at 50% 50%,rgba(255,255,255,.7),transparent 60%),
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(200,180,150,.13) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(200,180,150,.13) 31px 32px),var(--paper);overflow:hidden;cursor:grab;touch-action:none}
.mapwrap.drag{cursor:grabbing}
svg#map{width:100%;height:100%;display:block;user-select:none}
.tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.tools button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:18px;color:var(--ink)}
.tools button:hover{background:var(--paper2)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);max-width:calc(100% - 28px)}
.legend span{display:inline-flex;align-items:center;gap:4px;color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--ink2);background:rgba(255,253,248,.85);padding:4px 9px;border-radius:8px}
.node{cursor:pointer}
.node rect{fill:#fff;stroke:#dccbb0;stroke-width:1.5;transition:all .15s}
.node:hover rect{stroke:var(--brand2);filter:drop-shadow(0 3px 6px rgba(150,90,30,.18))}
.node.sel rect{stroke:var(--brand);stroke-width:2.5;fill:#fff6ee}
.node text{font-size:16px;fill:var(--ink);pointer-events:none}
.node .py{font-size:11px;fill:var(--ink2)}
.core circle.c1{fill:#fff;stroke:var(--brand);stroke-width:3}
.core circle.c2{fill:none;stroke:#f0c7ad;stroke-width:1;stroke-dasharray:4 5}
.core.sel circle.c1{fill:#fff6ee;stroke-width:4}
.core text.ch{font-family:var(--kai);font-size:56px;fill:var(--brand)}
.core text.lb{font-size:13px;fill:var(--ink)}
.edge{fill:none;stroke-width:2.4;opacity:.75}
.elab{font-size:11px;line-height:1.35;text-align:center;pointer-events:none}
.elab .t{display:inline-block;color:#fff;border-radius:999px;padding:1px 8px;font-weight:600;font-size:11px}
.elab .w{display:block;color:var(--ink2);margin-top:2px;background:rgba(251,247,239,.9);border-radius:6px;padding:1px 3px}
/* right */
aside.side{background:var(--card);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 30px}
.sec{margin-bottom:16px}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:.5px}
.sec h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--brand)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.dt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dt h2{margin:0;font-size:20px}
.dt .py{color:var(--ink2);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;color:#fff;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;border:1px solid}
.badge.确定{color:var(--ok);border-color:#bfe2cb;background:#effaf2}
.badge.通行说法{color:var(--tong);border-color:#c3d8f0;background:#eff5fc}
.badge.待查{color:var(--dai);border-color:#ecd9a6;background:#fdf7e6}
.why{margin:8px 0 2px;background:var(--paper);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6}
.lab{font-size:12px;color:var(--ink2);margin:12px 0 5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:#fff4ea;border:1px solid #f2d3bd;color:#8a3d22;border-radius:9px;padding:4px 10px;font-size:14px}
.txt{font-size:13.5px;line-height:1.7}
.tag{font-size:11px;border-radius:5px;padding:0 5px;margin-right:5px;background:#eee6d8;color:var(--ink2);vertical-align:1px}
.gu{font-family:var(--kai);font-size:17px;line-height:1.6;border-left:3px solid var(--brand2);padding-left:10px}
.src{font-size:12px;color:var(--ink2);margin-top:3px}
.tr{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.6}
.miss{font-size:13px;color:var(--dai);background:#fdf7e6;border-radius:8px;padding:6px 9px}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.part{flex:1;min-width:100px;border-radius:12px;padding:8px 10px;border:1px solid}
.part.yi{background:#effaf8;border-color:#bfe3de}
.part.yin{background:#f4f0fc;border-color:#d6caf0}
.part.ji{background:#f6f3ee;border-color:#e2d8c8}
.part small{display:block;font-size:11px;color:var(--ink2)}
.part b{font-family:var(--kai);font-size:26px;font-weight:400}
.part p{margin:2px 0 0;font-size:12px;line-height:1.5}
.warn{display:flex;gap:8px;margin-bottom:6px;font-size:13px;line-height:1.6}
.warn span{flex:none;font-size:11px;border-radius:6px;padding:1px 6px;height:20px;margin-top:2px;color:#fff}
.code{background:linear-gradient(135deg,#fff8ec,#fdf0e1);border:1px solid #f0d5b2;border-radius:14px;padding:12px 14px}
.code h4{margin:0 0 4px;font-size:14px;color:#8a3d22}
.code p{margin:0;font-size:13px;line-height:1.7}
.code .ex{margin-top:6px;font-family:var(--kai);font-size:20px;letter-spacing:4px;color:var(--brand)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){
  .app{grid-template-columns:80px 1fr;grid-template-rows:1fr auto;height:auto;min-height:calc(100% - 60px)}
  aside.side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .mapwrap{min-height:520px}
}
</style>
</head>

        <button id="zout" title="缩小">－</button>
        <button id="zfit" title="复位">⤢</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </main>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}

/* legend */
$('#legend').innerHTML = Object.entries(TYPES).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('')+
 '<span style="margin-left:6px">把握：</span><span class="badge 确定">确定</span><span class="badge 通行说法">通行说法</span><span class="badge 待查">待查</span>';

/* char list */
$('#charlist').innerHTML = DATA.chars.map((c,i)=>`<button class="cbtn" data-i="${i}"><b>${c.c}</b><span>${c.py}</span></button>`).join('');
$('#charlist').addEventListener('click',e=>{const b=e.target.closest('.cbtn'); if(b) select(+b.dataset.i);});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();select((cur+(e.key==='ArrowDown'?1:-1)+DATA.chars.length)%DATA.chars.length);}
});

let cur=0, curChar=null, selId='0';

function select(i){
  cur=i; curChar=DATA.chars[i]; selId='0';
  document.querySelectorAll('.cbtn').forEach((b,j)=>b.classList.toggle('on',j===i));
  const ob=document.querySelector('.cbtn.on'); if(ob) ob.scrollIntoView({block:'nearest'});
  renderStrip(); renderMap(); renderSide(); fit();
}

function badge(c){return `<span class="badge ${c}">${c}</span>`;}

function renderStrip(){
  const c=curChar;
  $('#strip').innerHTML = `
   <div class="bigc"><b>${c.c}</b><span>${c.py}${c.trad&&c.trad!==c.c?' · '+esc(c.trad):''}</span></div>
   <div class="stripR">
     <div class="sw"><em>《说文解字》</em>${esc(c.sw)} ${badge(c.swCert)}${c.swNote?`<div style="font-family:var(--sans);font-size:12px;color:var(--ink2)">${esc(c.swNote)}</div>`:''}</div>
     <div class="evo">${c.evo.map(e=>`<div><b>${esc(e[0])}</b>${esc(e[1])}</div>`).join('<span style="align-self:center;color:#c9b38f">→</span>')}</div>
     <div class="benyi"><strong>本义：${esc(c.benyi)}</strong>　判定理由：${esc(c.reason)}</div>
   </div>`;
}

/* ---------- map ---------- */
const svg=$('#map'), vp=$('#viewport'), wrap=$('#mapwrap');
let view={k:1,x:0,y:0}, bounds={x0:-300,y0:-300,x1:300,y1:300};
function applyView(){vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}

function textW(s){let w=0;for(const ch of s){w+= /[\x00-\xff]/.test(ch)?8.5:16;}return w;}

function layout(senses){
  const pos={}; const kids={};
  senses.forEach(s=>{if(s.p!==null){(kids[s.p]=kids[s.p]||[]).push(s);}});
  pos['0']={x:0,y:0,a:-Math.PI/2,depth:0};
  const L1=kids['0']||[]; const n=L1.length;
  const R1= n>4?270:240;
  L1.forEach((s,i)=>{
    const a=-Math.PI/2 + i*2*Math.PI/n;
    pos[s.id]={x:R1*Math.cos(a),y:R1*Math.sin(a),a,depth:1};
  });
  function place(pid,depth){
    const ks=kids[pid]; if(!ks) return;
    const pa=pos[pid].a; const R=R1+ (depth-1)*200;
    const spread=0.42;
    ks.forEach((s,i)=>{
      const a=pa+(i-(ks.length-1)/2)*spread;
      pos[s.id]={x:pos[pid].x+200*Math.cos(a)*1.02,y:pos[pid].y+200*Math.sin(a)*0.92,a,depth};
      place(s.id,depth+1);
    });
  }
  L1.forEach(s=>place(s.id,2));
  return pos;
}

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

function renderMap(){
  const c=curChar; vp.innerHTML='';
  const pos=layout(c.senses);
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const grow=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  c.senses.forEach(s=>{
    const p=pos[s.id];
    if(s.p!==null){
      const q=pos[s.p]; const col=TYPES[s.type]||'#999';
      const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
      const dx=p.x-q.x, dy=p.y-q.y, len=Math.hypot(dx,dy)||1;
      const cx=mx - dy/len*24, cy=my + dx/len*24;
      el('path',{d:`M${q.x},${q.y} Q${cx},${cy} ${p.x},${p.y}`,class:'edge',stroke:col,'stroke-dasharray':s.type==='假借'?'7 5':''},gE);
      const lx=(q.x+2*cx+p.x)/4, ly=(q.y+2*cy+p.y)/4;
      const fo=el('foreignObject',{x:lx-78,y:ly-24,width:156,height:52},gL);
      fo.innerHTML=`<div xmlns="http://www.w3.org/1999/xhtml" class="elab"><span class="t" style="background:${col}">${esc(s.type)}</span><span class="w">${esc(s.why)}</span></div>`;
    }
  });
  c.senses.forEach(s=>{
    const p=pos[s.id];
    if(s.p===null){
      const g=el('g',{class:'node core'+(selId===s.id?' sel':''),'data-id':s.id,transform:`translate(${p.x},${p.y})`},gN);
      el('circle',{r:92,class:'c2'},g);
      el('circle',{r:74,class:'c1'},g);
      const t1=el('text',{class:'ch','text-anchor':'middle',y:6},g); t1.textContent=c.c;
      const t2=el('text',{class:'lb','text-anchor':'middle',y:38},g); t2.textContent='本义 · '+(s.m.length>8?s.m.slice(0,8)+'…':s.m);
      grow(p.x-95,p.y-95);grow(p.x+95,p.y+95);
    }else{
      const label=s.m; const w=Math.max(96,textW(label)+30); const h=s.py?54:44;
      const g=el('g',{class:'node'+(selId===s.id?' sel':''),'data-id':s.id,transform:`translate(${p.x},${p.y})`},gN);
      el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:14},g);
      el('rect',{x:-w/2,y:-h/2,width:6,height:h,rx:3,style:`fill:${TYPES[s.type]};stroke:none`},g);
      const t=el('text',{'text-anchor':'middle',y:s.py?-2:6},g); t.textContent=label;
      if(s.py){const t2=el('text',{class:'py','text-anchor':'middle',y:16},g);t2.textContent=s.py;}
      const cert={'确定':'#3a9a5b','通行说法':'#3b7dc4','待查':'#b58a1e'}[s.cert];
      el('circle',{cx:w/2-9,cy:-h/2+9,r:4,style:`fill:${cert};stroke:none`},g);
      grow(p.x-w/2,p.y-h/2);grow(p.x+w/2,p.y+h/2);
    }
  });
  bounds={x0:x0-40,y0:y0-40,x1:x1+40,y1:y1+40};
}

vp.addEventListener('click',e=>{
  const n=e.target.closest('.node'); if(!n||moved) return;
  selId=n.dataset.id;
  vp.querySelectorAll('.node').forEach(x=>x.classList.toggle('sel',x.dataset.id===selId));
  renderSide();
});

function fit(){
  const r=wrap.getBoundingClientRect();
  const bw=bounds.x1-bounds.x0, bh=bounds.y1-bounds.y0;
  const k=Math.min(r.width/bw, r.height/bh, 1.4)*0.96;
  view.k=k; view.x=r.width/2-(bounds.x0+bw/2)*k; view.y=r.height/2-(bounds.y0+bh/2)*k; applyView();
}
function zoomAt(f,cx,cy){
  const nk=Math.max(0.3,Math.min(3.5,view.k*f)); f=nk/view.k;
  view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.k=nk; applyView();
}
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null, moved=false; const pts=new Map(); let pinch=null;
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('.tools,.legend')) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};drag=null;return;}
  drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; moved=false;
});
window.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=wrap.getBoundingClientRect();zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;moved=true;return;}
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){moved=true;wrap.classList.add('drag');}
  view.x=drag.vx+dx; view.y=drag.vy+dy; applyView();
});
window.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;drag=null;wrap.classList.remove('drag');setTimeout(()=>moved=false,0);});
const zc=()=>{const r=wrap.getBoundingClientRect();return [r.width/2,r.height/2];};
$('#zin').onclick=()=>zoomAt(1.25,...zc());
$('#zout').onclick=()=>zoomAt(0.8,...zc());
$('#zfit').onclick=fit;
window.addEventListener('resize',fit);

/* ---------- side ---------- */
function renderSide(){
  const c=curChar; const s=c.senses.find(x=>x.id===selId)||c.senses[0];
  const col=TYPES[s.type];
  const parent=s.p!==null?c.senses.find(x=>x.id===s.p):null;
  const gu = s.gu ? `<div class="gu">${esc(s.gu.t)}</div><div class="src">—— ${esc(s.gu.src)}</div><div class="tr"><span class="tag">译文</span>${esc(s.gu.tr)}</div>`
                  : `<div class="miss">待查：暂未核实到可靠的文言原句，宁缺勿编。</div>`;
  const P=c.parts;
  const partCards=[
    ...(P.yi||[]).map(p=>`<div class="part yi"><small>表义部分</small><b>${esc(p[0])}</b><p>${esc(p[1])}</p></div>`),
    ...(P.yin||[]).map(p=>`<div class="part yin"><small>表音部分</small><b>${esc(p[0])}</b><p>${esc(p[1])}</p></div>`),
    ...(P.ji||[]).map(p=>`<div class="part ji"><small>记号部分</small><b>${esc(p[0])}</b><p>${esc(p[1])}</p></div>`)
  ].join('');
  $('#side').innerHTML=`
   <div class="sec"><h3>义项详情</h3>
    <div class="card">
     <div class="dt"><h2>${esc(s.m)}</h2>${s.py?`<span class="py">${esc(s.py)}</span>`:''}<span class="pill" style="background:${col}">${esc(s.type)}</span>${badge(s.cert)}</div>
     <div class="why">${parent?`从「${esc(parent.m)}」来：`:'中心本义：'}${esc(s.why)}</div>
     <div class="lab">词族</div><div class="chips">${s.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div>
     <div class="lab">构词拆解</div><div class="txt">${esc(s.gou)}</div>
     <div class="lab">现代例句</div><div class="txt"><span class="tag">示例</span>${esc(s.ex)}</div>
     <div class="lab">文言原句</div>${gu}
    </div></div>
   <div class="sec"><h3>偏旁拆分</h3>
    <div class="parts">${partCards}</div>
    ${P.note?`<div class="txt" style="margin-top:6px;color:var(--ink2);font-size:12.5px">${esc(P.note)}</div>`:''}
   </div>
   <div class="sec"><h3>易读错 · 易写错</h3>
    <div class="card">
     <div class="warn"><span style="background:var(--tong)">读</span><div>${esc(c.misread)}</div></div>
     <div class="warn"><span style="background:var(--jia)">写</span><div>${esc(c.miswrite)}</div></div>
    </div></div>
   <div class="sec"><h3>相关汉字密码</h3>
    <div class="code"><h4>🔑 ${esc(c.code.t)}</h4><p>${esc(c.code.d)}</p><div class="ex">${esc(c.code.ex)}</div></div>
   </div>
   <div class="txt" style="font-size:11.5px;color:var(--ink2)">${esc(DATA.meta.note)}</div>`;
}

select(0);
})();
</script>
</body>
</html>
