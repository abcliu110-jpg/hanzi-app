<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学堂</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2622; --ink2:#6b625a; --ink3:#a1978c;
  --line:#e7ddcd; --brand:#c0392b; --brand2:#e9b44c;
  --yin:#3f7fd9; --bi:#e2902b; --zhuan:#1f9d78; --jia:#9b59c9;
  --ok:#2e9d5b; --tong:#3f7fd9; --dai:#d9822b;
  --r:14px; --shadow:0 6px 24px rgba(80,60,30,.08);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* top */
header{height:64px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:18px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;font-style:normal;font-family:var(--serif);font-size:22px;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top button{border:0;background:none;font:inherit;font-size:14px;color:var(--ink2);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.top button:hover{background:#f3ebdd}
nav.top button.on{background:var(--ink);color:#fff;font-weight:600}
nav.top button.soon::after{content:"即将上线";font-size:10px;margin-left:4px;color:var(--ink3)}
nav.top button.on::after{content:none}
/* body */
.wrap{flex:1;display:grid;grid-template-columns:150px 1fr 360px;min-height:0}
aside.list{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
aside.list h4{font-size:12px;color:var(--ink3);font-weight:500;margin:0 6px 10px;letter-spacing:.1em}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chars button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:.15s}
.chars button b{font-family:var(--serif);font-size:26px;line-height:1.1;font-weight:600}
.chars button span{font-size:11px;color:var(--ink3)}
.chars button:hover{border-color:var(--brand2);transform:translateY(-1px)}
.chars button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chars button.on span{color:#ffe5dc}
main{position:relative;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:14px 20px 8px}
.bar .big{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1}
.bar .meta{display:flex;flex-direction:column;gap:3px}
.bar .meta b{font-size:16px}
.bar .meta small{color:var(--ink2);font-size:12px}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend em{width:18px;height:4px;border-radius:2px;display:inline-block}
.stage{flex:1;margin:0 16px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;
  background-image:radial-gradient(#ece3d3 1px,transparent 1px);background-size:22px 22px}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer;color:var(--ink)}
.zoom button:hover{background:#f7efe2}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--ink3)}
.node{cursor:pointer}
.node rect{transition:.15s}
.node:hover rect.box{filter:brightness(.97);stroke-width:2.5}
.node.sel rect.box{stroke-width:3}
.edge{fill:none;stroke-width:2.2;opacity:.75}
.edge.hl{stroke-width:4;opacity:1}
.dim{opacity:.28}
/* right */
aside.side{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--brand)}
.dt-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dt-title b{font-size:18px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.lv{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.lv.确定{color:var(--ok)} .lv.通行说法{color:var(--tong)} .lv.待查{color:var(--dai)}
.row{margin-top:10px}
.row>label{display:block;font-size:11px;color:var(--ink3);margin-bottom:4px;letter-spacing:.05em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:#f6efe3;border-radius:8px;padding:4px 10px;font-size:14px}
.quote{font-family:var(--serif);font-size:15px;line-height:1.7;background:#fbf6ec;border-left:3px solid var(--brand2);padding:8px 10px;border-radius:0 8px 8px 0}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.tr{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.6}
.ex{font-size:14px;line-height:1.6}
.ex mark{background:#fde9c8;border-radius:4px;padding:0 3px;font-size:11px;margin-right:4px;color:#8a5a12}
.why{font-size:13px;line-height:1.7;color:var(--ink)}
.note{font-size:12px;color:var(--dai);margin-top:6px;line-height:1.5}
.evo{display:flex;gap:6px;margin-top:2px}
.evo div{flex:1;text-align:center}
.evo .g{height:46px;border:1.5px dashed #d8ccb8;border-radius:8px;display:grid;place-items:center;font-size:10px;color:var(--ink3);background:#fffaf1}
.evo .g.k{font-family:var(--serif);font-size:28px;color:var(--ink);border-style:solid;border-color:var(--brand2)}
.evo small{font-size:10px;color:var(--ink2)}
.change{font-size:13px;line-height:1.6;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:10px;align-items:center}
.part .pc{min-width:44px;height:44px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:600;background:#f6efe3}
.part .pc.small{font-size:13px}
.part .pr{font-size:11px;color:#fff;border-radius:6px;padding:1px 6px;display:inline-block;margin-bottom:2px}
.part .pr.义{background:var(--zhuan)} .part .pr.音{background:var(--yin)} .part .pr.兼{background:var(--jia)}
.part p{font-size:12.5px;color:var(--ink2);line-height:1.5}
ul.err{list-style:none;display:flex;flex-direction:column;gap:6px}
ul.err li{font-size:13px;line-height:1.55;padding-left:22px;position:relative}
ul.err li::before{position:absolute;left:0;top:1px;font-size:12px}
ul.err.r li::before{content:"🔊"} ul.err.w li::before{content:"✏️"} ul.err.c li::before{content:"🔑"}
.sub{font-size:12px;color:var(--ink3);margin:8px 0 4px}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
footer.foot{font-size:11px;color:var(--ink3);line-height:1.6;padding:4px 2px}
@media (max-width:1100px){.wrap{grid-template-columns:120px 1fr 300px}}
@media (max-width:820px){body{overflow:auto}.wrap{grid-template-columns:1fr;grid-template-rows:auto 70vh auto}
  aside.list{border-right:0}.chars{grid-template-columns:repeat(10,1fr)}.legend{display:none}}
</style>
</head>

</div>

广大、普遍", "sw": "溥也。从二，闕；方聲。", "swlv": "确定", "swNote": "「闕」表示许慎对字形某部分的意思存疑。", "why": "《说文》训「溥」（广大）；早期文献有「旁求」（广泛寻求）的用法。", "lv": "通行说法", "evoNote": "", "cl": {"q": "旁求俊彦，启迪后人。", "s": "《尚书·太甲上》", "tr": "广泛寻求才德出众的人，来开导后代。"}}, "s": [{"id": "a", "p": "0", "n": "旁边、侧面", "t": "引申", "r": "广大就向四面伸展，四周就是旁边", "w": ["旁边", "身旁", "路旁"], "b": "旁（侧）＋边", "e": "我的座位在窗户旁边。", "cl": null, "lv": "通行说法"}, {"id": "b", "p": "a", "n": "其他的、别的", "t": "引申", "r": "不在中间、在旁边的，就是「别的」", "w": ["旁人", "旁观", "旁若无人"], "b": "旁（别的）＋人", "e": "他画画时专心致志，旁若无人。", "cl": null, "lv": "确定"}, {"id": "c", "p": "a", "n": "汉字偏旁", "t": "转喻", "r": "写在字旁边的部件就叫「旁」", "w": ["偏旁", "言字旁", "提手旁"], "b": "偏（侧）＋旁（旁边）", "e": "「清」字的偏旁是三点水。", "cl": null, "lv": "确定"}], "side": {"parts": [["上部（亠丷冖）", "表义", "《说文》说「从二，闕」，意思存疑，待查"], ["方", "表音", "fāng → páng"]], "read": ["读 páng，不读 bàng 或 fáng"], "write": ["上半部是「亠、丷、冖」叠起来，别写成「立」", "下面是「方」"], "code": ["旁作声旁一家人：磅、膀、榜、傍、滂、谤、螃", "偏旁的「旁」就是这个字：部首在字的旁边"]}}]</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const MENU = ['字义扩展图','偏旁部首','声旁音部','字词句','汉字密码','易错诊所','记忆复习','学习路径'];
const TC = {'引申':'var(--yin)','比喻':'var(--bi)','转喻':'var(--zhuan)','假借':'var(--jia)'};
const TCH = {'引申':'#3f7fd9','比喻':'#e2902b','转喻':'#1f9d78','假借':'#9b59c9'};
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, sel='0', T={x:0,y:0,k:1}, POS={};

/* top menu */
const tn=$('topnav');
MENU.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;
  if(i===0)b.className='on';else{b.className='soon';b.onclick=()=>toast('「'+m+'」模块即将上线');}
  tn.appendChild(b);});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600);}

/* char list */
const cl=$('chars');
DATA.forEach((d,i)=>{const b=document.createElement('button');
  b.innerHTML='<b>'+d.ch+'</b><span>'+d.py.split(' ')[0]+'</span>';b.onclick=()=>pick(i);cl.appendChild(b);});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){pick((cur+1)%DATA.length);e.preventDefault();}
  if(e.key==='ArrowUp'){pick((cur-1+DATA.length)%DATA.length);e.preventDefault();}});

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function tw(s,fs){let w=0;for(const c of s)w+= /[\x00-\xff]/.test(c)?fs*0.58:fs;return w;}

function pick(i){
  cur=i;sel='0';
  [...cl.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  const d=DATA[i];
  $('bigch').textContent=d.ch;
  $('bigpy').textContent=d.py+(d.fan?'　繁体：'+d.fan:'');
  $('bigsub').textContent='本义：'+d.c.n+' ｜ 共 '+d.s.length+' 个扩展义项';
  draw();fit();renderSide();
  const btn=cl.children[i];if(btn.scrollIntoViewIfNeeded)btn.scrollIntoViewIfNeeded();
}

function layout(d){
  POS={'0':{x:0,y:0,a:0,d:0}};
  const kids=id=>d.s.filter(s=>s.p===id);
  const R1=290,R2=270;
  const top=kids('0');
  top.forEach((s,i)=>place(s,-Math.PI/2+i*2*Math.PI/top.length,R1,1));
  function place(s,a,r,dep){
    POS[s.id]={x:r*Math.cos(a),y:r*Math.sin(a),a,d:dep};
    const k=kids(s.id);
    const spread=k.length>2?0.36:0.44;
    k.forEach((c,j)=>place(c,a+(j-(k.length-1)/2)*spread,r+R2,dep+1));
  }
}
function ancestors(d,id){const out=new Set([id]);let s=d.s.find(x=>x.id===id);while(s){out.add(s.p);s=d.s.find(x=>x.id===s.p);}return out;}

function draw(){
  const d=DATA[cur];layout(d);
  const E=$('edges'),L=$('labels'),N=$('nodes');E.innerHTML=L.innerHTML=N.innerHTML='';
  const path=ancestors(d,sel);
  d.s.forEach(s=>{
    const a=POS[s.p],b=POS[s.id],col=TCH[s.t]||'#999';
    const on=path.has(s.id)&&sel!=='0';
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    // gentle curve
    const nx=-(b.y-a.y),ny=b.x-a.x,len=Math.hypot(nx,ny)||1,off=18;
    const cx=mx+nx/len*off,cy=my+ny/len*off;
    el('path',{d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,class:'edge'+(on?' hl':''),stroke:col,'stroke-dasharray':s.t==='假借'?'7 6':''},E);
    // label at curve midpoint
    const lx=0.25*a.x+0.5*cx+0.25*b.x, ly=0.25*a.y+0.5*cy+0.25*b.y;
    const g=el('g',{transform:`translate(${lx},${ly})`,class:sel!=='0'&&!on?'dim':''},L);
    const tag=s.t;const tW=tw(tag,12)+16;
    let rs=s.r;if([...rs].length>15)rs=[...rs].slice(0,15).join('')+'…';
    const rW=tw(rs,11)+14;
    el('rect',{x:-rW/2,y:-2,width:rW,height:20,rx:6,fill:'#fffdf8',stroke:'#eadfcd'},g);
    const rt=el('text',{x:0,y:12,'text-anchor':'middle','font-size':11,fill:'#6b625a'},g);rt.textContent=rs;
    el('rect',{x:-tW/2,y:-24,width:tW,height:19,rx:9.5,fill:col},g);
    const tt=el('text',{x:0,y:-10.5,'text-anchor':'middle','font-size':12,fill:'#fff','font-weight':600},g);tt.textContent=tag;
    const ti=el('title',{},g);ti.textContent=s.t+'：'+s.r;
  });
  // center
  const cg=el('g',{class:'node'+(sel==='0'?' sel':''),transform:'translate(0,0)'},N);
  el('circle',{r:84,fill:'#fff3e6',stroke:'#e9b44c','stroke-width':2,'stroke-dasharray':'4 5'},cg);
  el('circle',{r:70,fill:'#c0392b',stroke:sel==='0'?'#2b2622':'#a5301f','stroke-width':sel==='0'?4:2},cg);
  const c1=el('text',{y:6,'text-anchor':'middle','font-size':54,fill:'#fff',style:'font-family:var(--serif)','font-weight':700},cg);c1.textContent=d.ch;
  const c2=el('text',{y:34,'text-anchor':'middle','font-size':12,fill:'#ffe3d6'},cg);c2.textContent='本义';
  let cn=d.c.n;if([...cn].length>14)cn=[...cn].slice(0,14).join('')+'…';
  const lab=el('g',{transform:'translate(0,108)'},cg);
  const cw=tw(cn,13)+20;
  el('rect',{x:-cw/2,y:-14,width:cw,height:24,rx:12,fill:'#2b2622'},lab);
  const c3=el('text',{y:3,'text-anchor':'middle','font-size':13,fill:'#fff'},lab);c3.textContent=cn;
  cg.onclick=e=>{e.stopPropagation();select('0');};
  // senses
  d.s.forEach(s=>{
    const p=POS[s.id],col=TCH[s.t];
    const on=path.has(s.id);
    const g=el('g',{class:'node'+(sel===s.id?' sel':'')+(sel!=='0'&&!on?' dim':''),transform:`translate(${p.x},${p.y})`},N);
    const w=Math.max(96,tw(s.n,15)+34),h=s.y?50:40;
    el('rect',{class:'box',x:-w/2,y:-h/2,width:w,height:h,rx:12,fill:sel===s.id?col:'#fff',stroke:col,'stroke-width':sel===s.id?3:1.8},g);
    el('circle',{cx:-w/2+12,cy:-h/2+12,r:3.5,fill:sel===s.id?'#fff':col},g);
    const t=el('text',{y:s.y?-2:5,'text-anchor':'middle','font-size':15,'font-weight':600,fill:sel===s.id?'#fff':'#2b2622'},g);t.textContent=s.n;
    if(s.y){const t2=el('text',{y:15,'text-anchor':'middle','font-size':11,fill:sel===s.id?'#fff':'#a1978c'},g);t2.textContent=s.y;}
    const dotc={'确定':'#2e9d5b','通行说法':'#3f7fd9','待查':'#d9822b'}[s.lv];
    el('circle',{cx:w/2-10,cy:-h/2+10,r:4,fill:dotc,stroke:'#fff','stroke-width':1.5},g);
    g.onclick=e=>{e.stopPropagation();select(s.id);};
  });
  apply();
}
function select(id){sel=id;draw();renderSide();}

/* pan & zoom */
const svg=$('map'),vp=$('vp');
function apply(){vp.setAttribute('transform',`translate(${T.x},${T.y}) scale(${T.k})`);}
function fit(){
  const r=svg.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  Object.values(POS).forEach(p=>{x0=Math.min(x0,p.x-110);x1=Math.max(x1,p.x+110);y0=Math.min(y0,p.y-60);y1=Math.max(y1,p.y+130);});
  const k=Math.min(r.width/(x1-x0),r.height/(y1-y0),1.25)*0.92;
  T.k=k;T.x=r.width/2-(x0+x1)/2*k;T.y=r.height/2-(y0+y1)/2*k;apply();
}
function zoomAt(f,cx,cy){const nk=Math.min(3.2,Math.max(0.25,T.k*f));f=nk/T.k;T.x=cx-(cx-T.x)*f;T.y=cy-(cy-T.y)*f;T.k=nk;apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y,m:false};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.m=true;T.x=drag.tx+dx;T.y=drag.ty+dy;apply();});
svg.addEventListener('pointerup',e=>{if(drag&&!drag.m&&sel!=='0')select('0');drag=null;svg.classList.remove('drag');});
const mid=()=>{const r=svg.getBoundingClientRect();return[r.width/2,r.height/2];};
$('zin').onclick=()=>zoomAt(1.25,...mid());$('zout').onclick=()=>zoomAt(0.8,...mid());$('zfit').onclick=fit;
window.addEventListener('resize',fit);

/* side panel */
function lvTag(l){return '<span class="lv '+l+'">'+l+'</span>';}
function classic(c){
  if(!c)return '<div class="row"><label>文言原句</label><div class="note">待查：暂未核实到可靠的文言用例，不作编造。</div></div>';
  return '<div class="row"><label>文言原句</label><div class="quote">'+esc(c.q)+'</div><div class="src">—— '+esc(c.s)+'</div><div class="tr">译文：'+esc(c.tr)+'</div></div>';
}
function renderSide(){
  const d=DATA[cur];let h='';
  if(sel==='0'){
    const c=d.c;
    const st=['甲骨文','金文','小篆','隶书','楷书'];
    h+='<div class="card"><h3>本义 · 中心</h3><div class="dt-title"><b>'+esc(c.n)+'</b>'+lvTag(c.lv)+'</div>'
      +'<div class="row"><label>《说文解字》原文</label><div class="quote">'+esc(c.sw)+'</div><div class="src">'+lvTag(c.swlv)+(c.swNote?' '+esc(c.swNote):'')+'</div></div>'
      +'<div class="row"><label>字形演变（字形图占位）</label><div class="evo">'
      +st.map((s,i)=>'<div><div class="g'+(i===4?' k':'')+'">'+(i===4?d.ch:'〔字形图〕')+'</div><small>'+s+'</small></div>').join('')+'</div>'
      +(c.evoNote?'<div class="note">'+esc(c.evoNote)+'</div>':'')+'</div>'
      +'<div class="row"><label>本义判定理由</label><div class="why">'+esc(c.why)+'</div></div>'
      +(c.cl?classic(c.cl):'')
      +'<div class="sub">点击图中任一义项，查看词族、例句和文言出处。</div></div>';
  }else{
    const s=d.s.find(x=>x.id===sel);const par=s.p==='0'?'本义「'+d.c.n+'」':'「'+d.s.find(x=>x.id===s.p).n+'」';
    h+='<div class="card"><h3>义项详情</h3><div class="dt-title"><b>'+esc(s.n)+'</b>'+lvTag(s.lv)+'</div>'
      +'<div class="row"><label>怎么变来的</label><div class="change">从'+esc(par)+' → <span class="tag" style="background:'+TC[s.t]+'">'+s.t+'</span><span>'+esc(s.r)+'</span></div></div>'
      +'<div class="row"><label>词族</label><div class="chips">'+s.w.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div>'
      +'<div class="row"><label>构词拆解</label><div class="why">'+esc(s.b)+'</div></div>'
      +'<div class="row"><label>现代例句</label><div class="ex"><mark>示例</mark>'+esc(s.e)+'</div></div>'
      +classic(s.cl)
      +'<div class="row"><label>把握程度</label>'+lvTag(s.lv)+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+'</div>'
      +'</div>';
  }
  const sd=d.side;
  h+='<div class="card"><h3>偏旁拆分</h3><div class="parts">'+sd.parts.map(p=>{
      const k=p[1].includes('兼')?'兼':(p[1].includes('音')?'音':'义');
      return '<div class="part"><div class="pc'+([...p[0]].length>2?' small':'')+'">'+esc(p[0])+'</div><div><span class="pr '+k+'">'+esc(p[1])+'</span><p>'+esc(p[2])+'</p></div></div>';}).join('')+'</div></div>';
  h+='<div class="card"><h3>易错提醒</h3><div class="sub">易读错</div><ul class="err r">'+sd.read.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'
    +'<div class="sub">易写错</div><ul class="err w">'+sd.write.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  h+='<div class="card"><h3>汉字密码</h3><ul class="err c">'+sd.code.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  h+='<footer class="foot">把握程度：<span style="color:var(--ok)">●</span>确定　<span style="color:var(--tong)">●</span>通行说法　<span style="color:var(--dai)">●</span>待查。《说文》引文据通行大徐本；现代例句均为自编示例；未核实的出处一律标「待查」。</footer>';
  $('side').innerHTML=h;
}
pick(0);
})();
</script>
