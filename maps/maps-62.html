<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#f7f3ec; --card:#fffdf9; --ink:#2b2a33; --ink2:#5d5a66; --ink3:#9a96a3;
  --line:#e8e1d5; --red:#c8553d; --red-soft:#f6e3dc;
  --t-yin:#2f8f83; --t-bi:#e07a3f; --t-zhuan:#7a5cc7; --t-jia:#5b7a99;
  --c-ok:#2f8f83; --c-tong:#c9962b; --c-cha:#c85a5a;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- 顶部一级菜单 ---------- */
header{height:64px;display:flex;align-items:center;gap:28px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(60,40,20,.04);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo .seal{width:38px;height:38px;border-radius:10px;background:var(--red);color:#fff;font-family:var(--serif);font-size:22px;font-weight:700;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.logo b{font-family:var(--serif);font-size:18px;letter-spacing:2px}
.logo small{display:block;font-size:11px;color:var(--ink3);letter-spacing:1px}
nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.top::-webkit-scrollbar{display:none}
nav.top button{padding:9px 15px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
nav.top button:hover{background:#f1ebe1;color:var(--ink)}
nav.top button.on{background:var(--ink);color:#fff;font-weight:600}
nav.top button .soon{font-size:10px;color:var(--ink3);margin-left:3px}

/* ---------- 主体 ---------- */
main{height:calc(100% - 64px);display:grid;grid-template-columns:212px 1fr 380px}
aside.left{border-right:1px solid var(--line);background:#fbf8f2;display:flex;flex-direction:column;min-height:0}
aside.left h3{font-size:12px;color:var(--ink3);letter-spacing:2px;padding:18px 18px 10px;font-weight:600}
.charlist{flex:1;overflow-y:auto;padding:0 12px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}
.charlist button{display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:.18s}
.charlist button:hover{border-color:#d9cdbb;transform:translateY(-1px)}
.charlist button .z{font-family:var(--serif);font-size:30px;line-height:1.15}
.charlist button .p{font-size:11px;color:var(--ink3)}
.charlist button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px rgba(200,85,61,.3)}
.charlist button.on .p{color:rgba(255,255,255,.85)}

/* ---------- 画布 ---------- */
section.stage{position:relative;min-width:0;min-height:0;overflow:hidden;
  background-color:var(--paper);
  background-image:radial-gradient(circle,#e3dacb 1px,transparent 1.2px);background-size:22px 22px}
.stage-head{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.stage-title{pointer-events:auto}
.stage-title h1{font-family:var(--serif);font-size:22px;letter-spacing:1px}
.stage-title h1 span{font-size:14px;color:var(--ink3);font-family:var(--sans);margin-left:8px;font-weight:400}
.stage-title p{font-size:12px;color:var(--ink3);margin-top:4px}
.legend{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
svg#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#graph.drag{cursor:grabbing}
.zoombar{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:2}
.zoombar button{width:40px;height:38px;font-size:18px;color:var(--ink2)}
.zoombar button:hover{background:#f3ede3;color:var(--ink)}
.zoombar button+button{border-top:1px solid var(--line)}
.zoombar .lvl{font-size:11px;text-align:center;padding:4px 0;color:var(--ink3);border-top:1px solid var(--line)}
.hint{position:absolute;left:20px;bottom:18px;font-size:12px;color:var(--ink3);background:rgba(255,253,249,.85);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}

/* svg 元素 */
.node{cursor:pointer}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:.15s}
.node:hover rect.box{stroke:#cbbda8}
.node.on rect.box{stroke-width:3}
.node text{font-family:var(--sans)}
.center-node{cursor:pointer}
.edge-label rect{fill:rgba(255,253,249,.96);stroke:var(--line)}
.edge-label text{font-family:var(--sans)}

/* ---------- 右侧栏 ---------- */
aside.right{border-left:1px solid var(--line);background:#fbf8f2;overflow-y:auto;padding:16px 16px 28px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card-kicker{font-size:11px;letter-spacing:2px;color:var(--ink3);font-weight:600;margin-bottom:8px}
.d-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.d-title h2{font-family:var(--serif);font-size:20px;line-height:1.35}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;white-space:nowrap}
.tag.ghost{background:transparent !important;border:1.5px solid currentColor}
.blk{margin-top:14px}
.blk h4{font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.blk h4::before{content:"";width:4px;height:12px;border-radius:2px;background:var(--red)}
.blk p,.blk li{font-size:14px;line-height:1.75;color:var(--ink)}
.why{background:#f4efe6;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.shuowen{font-family:var(--serif);font-size:16px;line-height:1.8;background:var(--red-soft);border-left:3px solid var(--red);padding:10px 12px;border-radius:0 10px 10px 0}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{font-family:var(--serif);font-size:16px;padding:4px 12px;border-radius:10px;background:#f1ebe1;border:1px solid #e6dccb}
.muted{color:var(--ink3) !important;font-size:13px !important}
.ex{font-size:15px;line-height:1.7}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:6px;background:#eae4f7;color:#6a51b5;font-weight:700;margin-left:6px;vertical-align:2px}
.gw{background:#f7f3ea;border:1px dashed #dccfb8;border-radius:12px;padding:12px}
.gw .t{font-family:var(--serif);font-size:16px;line-height:1.8}
.gw .src{font-size:12px;color:var(--ink2);margin-top:4px}
.gw .tr{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.7;border-top:1px solid #e8dfcf;padding-top:6px}
.pending{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--c-cha);background:#fbeeee;border-radius:10px;padding:9px 11px;line-height:1.6}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo div{border:1px dashed #d5c8b3;border-radius:10px;text-align:center;padding:8px 2px 6px;background:#fbf8f2}
.evo .g{height:38px;display:grid;place-items:center;font-size:10px;color:var(--ink3);font-family:var(--serif)}
.evo .g.real{font-size:30px;color:var(--ink)}
.evo .n{font-size:11px;color:var(--ink2);margin-top:2px}
.cert{display:flex;gap:6px}
.cert span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:10px;border:1px solid var(--line);color:var(--ink3)}
.cert span.on{color:#fff;font-weight:700;border-color:transparent}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parts div{border-radius:12px;padding:10px;font-size:13px;line-height:1.6}
.parts .yi{background:#e6f2ef}
.parts .yin{background:#fdf0e3}
.parts b{display:block;font-size:11px;letter-spacing:1px;margin-bottom:2px}
.parts .yi b{color:var(--t-yin)} .parts .yin b{color:var(--t-bi)}
.warn{display:flex;gap:8px;font-size:13px;line-height:1.65;padding:8px 0;border-bottom:1px dashed var(--line)}
.warn:last-child{border-bottom:none}
.warn em{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:var(--c-cha);border-radius:6px;padding:1px 6px;height:fit-content;white-space:nowrap;margin-top:2px}
.warn em.x{background:var(--t-bi)}
.mima{background:linear-gradient(135deg,#efe9fb,#f8f4ff);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;color:#3d3361}
.bigchar{font-family:var(--serif);font-size:56px;line-height:1;width:78px;height:78px;display:grid;place-items:center;border-radius:16px;background:var(--red-soft);color:var(--red);flex-shrink:0;position:relative}
.bigchar::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(200,85,61,.35);border-radius:10px}
.charhead{display:flex;gap:14px;align-items:center}
.charhead .py{font-size:18px;font-weight:600}
.charhead .sub{font-size:12px;color:var(--ink3);margin-top:3px}

.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){main{grid-template-columns:168px 1fr 330px}.charlist{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>

const CERTS = {"确定":"#2f8f83","通行说法":"#c9962b","待查":"#c85a5a"};
const MENUS = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const NS = "http://www.w3.org/2000/svg";
const R_NODE = 330, R_LABEL = 185, NODE_W = 168, NODE_H = 70, LABEL_W = 148;

let cur = 0, sel = "ben";
let view = {x:0, y:0, k:1};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 顶部菜单 ---------- */
$("topnav").innerHTML = MENUS.map((m,i)=>`<button class="${i===0?'on':''}" data-i="${i}">${m}${i?'<span class="soon">·未开放</span>':''}</button>`).join("");
$("topnav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.i!=="0") toast("「"+MENUS[+b.dataset.i]+"」模块即将上线");
});
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1800);}

/* ---------- 图例 ---------- */
$("legend").innerHTML = Object.keys(TYPES).map(t=>`<span class="chip" title="${TYPE_TIP[t]}"><i style="background:${TYPES[t]}"></i>${t}<span style="color:#aaa">·${TYPE_TIP[t]}</span></span>`).join("");

/* ---------- 左侧字表 ---------- */
$("charlist").innerHTML = CH.map((d,i)=>`<button data-i="${i}"><span class="z">${d.c}</span><span class="p">${esc(d.py)}</span></button>`).join("");
$("charlist").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  pick(+b.dataset.i);
});

function pick(i){
  cur = i; sel = "ben";
  [...$("charlist").children].forEach((b,j)=>b.classList.toggle("on", j===i));
  const d = CH[i];
  $("stTitle").innerHTML = `「${d.c}」的义项网<span>${d.s.length+1} 个义项 · ${esc(d.py)}</span>`;
  drawGraph(); fit(); renderDetail(); renderCharInfo();
  $("right").scrollTop = 0;
}

/* ---------- SVG 工具 ---------- */
function el(tag, attrs, parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function wrap(str, n){const out=[];let s=String(str);while(s.length>n){out.push(s.slice(0,n));s=s.slice(n);}if(s)out.push(s);return out;}
function textLines(g, lines, opt){
  const lh = opt.lh, top = -(lines.length-1)*lh/2 + (opt.dy||0);
  lines.forEach((ln,i)=>{const t=el("text",{x:opt.x||0,y:top+i*lh,"text-anchor":"middle","dominant-baseline":"central","font-size":opt.size,fill:opt.fill,"font-weight":opt.weight||400},g);
    if(opt.serif)t.setAttribute("font-family","Noto Serif SC, Songti SC, STSong, SimSun, serif");t.textContent=ln;});
}

/* ---------- 画义项网 ---------- */
function drawGraph(){
  const d = CH[cur], vp = $("vp");
  vp.innerHTML = "";
  const n = d.s.length;
  const gEdges = el("g",{},vp), gLabels = el("g",{},vp), gNodes = el("g",{},vp);

  d.s.forEach((s,i)=>{
    const a = (-90 + i*360/n) * Math.PI/180;
    const x = R_NODE*Math.cos(a), y = R_NODE*Math.sin(a);
    const col = TYPES[s.t] || "#888";
    // 连线
    const ln = el("line",{x1:0,y1:0,x2:x,y2:y,stroke:col,"stroke-width":3,"stroke-linecap":"round",opacity:.8},gEdges);
    if(s.t==="假借") ln.setAttribute("stroke-dasharray","8 7");
    if(s.t==="比喻") ln.setAttribute("stroke-dasharray","2 7");
    // 箭头点
    const ax = (R_NODE-NODE_H/2-14)*Math.cos(a), ay=(R_NODE-NODE_H/2-14)*Math.sin(a);
    el("circle",{cx:ax,cy:ay,r:5,fill:col},gEdges);

    // 连线标注：类型 + 原因
    const lx = R_LABEL*Math.cos(a), ly = R_LABEL*Math.sin(a);
    const lines = wrap(s.why, 10);
    const h = 30 + lines.length*18;
    const lg = el("g",{class:"edge-label",transform:`translate(${lx},${ly})`},gLabels);
    el("rect",{x:-LABEL_W/2,y:-h/2,width:LABEL_W,height:h,rx:12},lg);
    el("rect",{x:-26,y:-h/2+7,width:52,height:20,rx:10,fill:col,stroke:"none"},lg);
    const tt = el("text",{x:0,y:-h/2+17,"text-anchor":"middle","dominant-baseline":"central","font-size":12,fill:"#fff","font-weight":700},lg); tt.textContent=s.t;
    textLines(lg, lines, {lh:18,size:12.5,fill:"#4a4752",dy:14});

    // 义项节点
    const g = el("g",{class:"node"+(sel===i?" on":""),transform:`translate(${x},${y})`},gNodes);
    g.dataset.i = i;
    const box = el("rect",{class:"box",x:-NODE_W/2,y:-NODE_H/2,width:NODE_W,height:NODE_H,rx:18},g);
    if(sel===i) box.setAttribute("stroke",col);
    el("rect",{x:-NODE_W/2,y:-NODE_H/2+14,width:5,height:NODE_H-28,rx:2.5,fill:col},g);
    const nm = wrap(s.m, 9).slice(0,2);
    textLines(g, nm, {lh:21,size:16,fill:"#2b2a33",weight:700,dy:-7});
    el("circle",{cx:-30,cy:NODE_H/2-14,r:4,fill:CERTS[s.cert]},g);
    const ct = el("text",{x:-22,y:NODE_H/2-14,"dominant-baseline":"central","font-size":11,fill:"#9a96a3"},g); ct.textContent=s.cert;
    g.addEventListener("click", ev=>{ev.stopPropagation(); select(i);});
  });

  // 中心本义
  const c = el("g",{class:"center-node"},gNodes);
  el("circle",{r:104,fill:"#f6e3dc",opacity:.6},c);
  el("circle",{r:92,fill:"#fffdf9",stroke:"#c8553d","stroke-width":sel==="ben"?4:2.5},c);
  el("circle",{r:84,fill:"none",stroke:"#c8553d","stroke-width":1,"stroke-dasharray":"3 5",opacity:.5},c);
  const tag = el("text",{y:-52,"text-anchor":"middle","font-size":12,fill:"#c8553d","font-weight":700,"letter-spacing":"3"},c); tag.textContent="本 义";
  const z = el("text",{y:-6,"text-anchor":"middle","dominant-baseline":"central","font-size":62,fill:"#2b2a33","font-family":"Noto Serif SC, Songti SC, STSong, SimSun, serif"},c); z.textContent=d.c;
  textLines(c, wrap(d.ben.m, 8).slice(0,2), {lh:16,size:12.5,fill:"#5d5a66",dy:50});
  c.addEventListener("click", ev=>{ev.stopPropagation(); select("ben");});
}

function select(s){
  sel = s; drawGraph(); applyView(); renderDetail();
  $("right").scrollTop = 0;
}

/* ---------- 缩放平移 ---------- */
const svg = $("graph");
function applyView(){ $("vp").setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); $("zlvl").textContent=Math.round(view.k*100)+"%"; }
function fit(){
  const r = svg.getBoundingClientRect();
  const need = 2*(R_NODE+NODE_W/2)+40;
  const k = Math.max(.45, Math.min(1.1, Math.min(r.width, r.height-70)/need));
  view = {x:r.width/2, y:(r.height+50)/2, k}; applyView();
}
function zoomAt(f, cx, cy){
  const nk = Math.max(.3, Math.min(3, view.k*f)); f = nk/view.k;
  view.x = cx - (cx-view.x)*f; view.y = cy - (cy-view.y)*f; view.k = nk; applyView();
}
svg.addEventListener("wheel", e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener("pointerdown", e=>{ if(e.target.closest(".node,.center-node")) return; drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; svg.classList.add("drag"); svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e=>{ if(!drag) return; view.x=drag.vx+e.clientX-drag.x; view.y=drag.vy+e.clientY-drag.y; applyView(); });
const endDrag=()=>{drag=null;svg.classList.remove("drag");};
svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);
const mid = ()=>{const r=svg.getBoundingClientRect();return [r.width/2,r.height/2];};
$("zin").onclick = ()=>zoomAt(1.2,...mid());
$("zout").onclick = ()=>zoomAt(1/1.2,...mid());
$("zfit").onclick = fit;
window.addEventListener("resize", fit);

/* ---------- 详情 ---------- */
function certBar(c){
  return `<div class="cert">${Object.keys(CERTS).map(k=>`<span class="${k===c?'on':''}" style="${k===c?'background:'+CERTS[k]:''}">${k}</span>`).join("")}</div>`;
}
function gwBlock(gw){
  if(!gw) return `<div class="pending">⚠︎<span><b>待查</b>：暂未找到可靠的文言原句和出处，宁缺勿编。</span></div>`;
  return `<div class="gw"><div class="t">${esc(gw.t)}</div><div class="src">—— ${esc(gw.src)}</div><div class="tr"><b>译文</b>　${esc(gw.tr)}</div></div>`;
}
function wordsBlock(o){
  if(!o.words || !o.words.length) return `<p class="muted">${esc(o.wn||"暂无常用词")}</p>`;
  return `<div class="words">${o.words.map(w=>`<span>${esc(w)}</span>`).join("")}</div>${o.wn?`<p class="muted" style="margin-top:6px">${esc(o.wn)}</p>`:""}`;
}
function commonBlocks(o){
  return `
  <div class="blk"><h4>词族</h4>${wordsBlock(o)}</div>
  <div class="blk"><h4>构词拆解</h4><p>${esc(o.gc)}</p></div>
  <div class="blk"><h4>现代例句</h4><p class="ex">${esc(o.ex)}<span class="badge">示例</span></p></div>
  <div class="blk"><h4>文言原句</h4>${gwBlock(o.gw)}</div>
  <div class="blk"><h4>把握程度</h4>${certBar(o.cert)}</div>`;
}
function renderDetail(){
  const d = CH[cur]; let h = "";
  if(sel==="ben"){
    const b = d.ben;
    const stages = ["甲骨文","金文","小篆","隶书","楷书"];
    h = `<div class="card-kicker">中心 · 本义</div>
    <div class="d-title"><h2>${esc(b.m)}</h2><span class="tag" style="background:#c8553d">本义</span></div>
    <div class="blk"><h4>《说文解字》原文</h4>${d.sw?`<div class="shuowen">${esc(d.sw)}</div>`:`<div class="pending">⚠︎<span>《说文解字》未收此字（待查）。</span></div>`}</div>
    <div class="blk"><h4>字形演变</h4><div class="evo">${stages.map((s,i)=>`<div><div class="g ${i===4?'real':''}">${i===4?d.c:'字形图<br>待补'}</div><div class="n">${s}</div></div>`).join("")}</div>
      <p class="muted" style="margin-top:6px">古文字字形以文字占位，后续替换为图片。</p></div>
    <div class="blk"><h4>本义判定理由</h4><div class="why">${esc(b.why)}</div></div>
    ${commonBlocks(b)}`;
  } else {
    const s = d.s[sel], col = TYPES[s.t];
    h = `<div class="card-kicker">义项 ${sel+1} / ${d.s.length}</div>
    <div class="d-title"><h2>${esc(s.m)}</h2><span class="tag" style="background:${col}">${s.t}</span></div>
    <div class="blk"><h4>它是怎么来的</h4><div class="why"><b style="color:${col}">本义「${esc(d.ben.m)}」→ ${s.t}</b><br>${esc(s.why)}</div></div>
    ${commonBlocks(s)}`;
  }
  h += `<div class="blk" style="display:flex;gap:8px;margin-top:16px">
    <button class="chip" id="prevS">← 上一个</button><button class="chip" id="toBen">回到本义</button><button class="chip" id="nextS">下一个 →</button></div>`;
  $("detail").innerHTML = h;
  const order = ["ben", ...d.s.map((_,i)=>i)];
  const idx = order.indexOf(sel);
  $("prevS").onclick = ()=>select(order[(idx-1+order.length)%order.length]);
  $("nextS").onclick = ()=>select(order[(idx+1)%order.length]);
  $("toBen").onclick = ()=>select("ben");
}

function renderCharInfo(){
  const d = CH[cur];
  $("charinfo").innerHTML = `
  <div class="card-kicker">字的档案</div>
  <div class="charhead"><div class="bigchar">${d.c}</div><div><div class="py">${esc(d.py)}</div><div class="sub">${d.s.length+1} 个义项 · 本义：${esc(d.ben.m)}</div></div></div>
  <div class="blk"><h4>偏旁拆分</h4><div class="parts"><div class="yi"><b>表义部分</b>${esc(d.yi)}</div><div class="yin"><b>表音部分</b>${esc(d.yin)}</div></div></div>
  <div class="blk"><h4>易读错 · 易写错</h4>
    <div class="warn"><em>读</em><span>${esc(d.du)}</span></div>
    <div class="warn"><em class="x">写</em><span>${esc(d.xie)}</span></div></div>
  <div class="blk"><h4>相关汉字密码</h4><div class="mima">🔑 ${esc(d.mm)}</div></div>`;
}

pick(0);
})();
</script>
