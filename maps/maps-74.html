<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2a2733; --ink2:#5d5866; --ink3:#948d9c;
  --line:#e7dfd0; --seal:#c8483b; --seal-soft:#fbe9e5;
  --t-yin:#2f8f83; --t-bi:#e08a2c; --t-zhuan:#7a5bc4; --t-jia:#d24a6e; --t-ben:#c8483b;
  --sure-ok:#2f8f5b; --sure-mid:#c08a12; --sure-q:#b9483f;
  --radius:16px; --shadow:0 6px 24px rgba(60,40,20,.08);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* 顶部 */
header{height:64px;display:flex;align-items:center;gap:20px;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo .seal{width:34px;height:34px;border-radius:9px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.top button{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
nav.top button:hover{background:#f3ece0}
nav.top button.on{background:var(--ink);color:#fff;font-weight:600}
nav.top button .soon{font-size:10px;margin-left:4px;color:var(--ink3)}

/* 主体 */
.app{display:grid;grid-template-columns:200px 1fr 360px;height:calc(100% - 64px)}
aside.left{background:var(--paper);border-right:1px solid var(--line);padding:16px 14px;overflow-y:auto}
.sec-title{font-size:12px;color:var(--ink3);letter-spacing:.1em;margin:4px 4px 10px}
.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.char-grid button{aspect-ratio:1;border-radius:12px;background:#f7f2e8;font-family:var(--serif);font-size:22px;transition:.15s;position:relative}
.char-grid button:hover{background:#efe6d4;transform:translateY(-1px)}
.char-grid button.on{background:var(--seal);color:#fff;box-shadow:0 4px 12px rgba(200,72,59,.35)}
.char-grid button small{position:absolute;bottom:2px;left:0;right:0;font-family:var(--sans);font-size:9px;opacity:.6}
.legend{margin-top:20px;padding:12px;border-radius:12px;background:#f7f2e8;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px;margin:5px 0}
.legend i{width:22px;height:4px;border-radius:2px;display:inline-block}
.legend .dot{width:10px;height:10px;border-radius:50%}

/* 中间图 */
main{position:relative;overflow:hidden}
.char-head{position:absolute;left:20px;top:16px;z-index:3;display:flex;align-items:center;gap:14px;background:rgba(255,253,248,.92);padding:10px 16px;border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.char-head .big{font-family:var(--serif);font-size:42px;line-height:1;color:var(--seal)}
.char-head .meta b{font-size:15px}
.char-head .meta div{font-size:12px;color:var(--ink2)}
.zoom{position:absolute;right:16px;top:16px;z-index:3;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow);font-size:18px;color:var(--ink2)}
.zoom button:hover{color:var(--seal)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--ink3);background:rgba(255,253,248,.85);padding:4px 12px;border-radius:999px;z-index:3}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;
  background-image:radial-gradient(circle,#e5dccb 1px,transparent 1.2px);background-size:26px 26px}
svg#map.drag{cursor:grabbing}
.node{cursor:pointer}
.node rect{transition:stroke-width .15s}
.node:hover rect.box{stroke-width:2.5}
.node.sel rect.box{stroke-width:3.5}
.edge-path{fill:none;stroke-width:2.4}
.edge-label text{font-family:var(--sans)}

/* 右侧 */
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--seal)}
.d-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:4px}
.d-py{color:var(--ink3);font-size:13px;margin-left:6px;font-family:var(--sans);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.row{margin-top:12px}
.row .lab{font-size:12px;color:var(--ink3);margin-bottom:4px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{padding:4px 12px;border-radius:10px;background:#f7f2e8;font-family:var(--serif);font-size:15px}
.quote{font-family:var(--serif);font-size:15px;background:#faf6ee;border-left:3px solid var(--seal);padding:8px 12px;border-radius:0 10px 10px 0}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.tr{font-size:13px;color:var(--ink2);margin-top:4px}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:6px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.tag.demo{color:#5b7fc4}
.tag.q{color:var(--sure-q)}
.sure{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.sure i{width:10px;height:10px;border-radius:50%}
.forms{display:flex;gap:6px;flex-wrap:wrap}
.forms div{flex:1;min-width:52px;border:1px dashed #d8ccb6;border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--ink3);background:#fcfaf5}
.forms div b{display:block;font-size:12px;color:var(--ink2);margin-bottom:2px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parts div{border-radius:12px;padding:10px;font-size:13px}
.parts .yi{background:#e8f4f2}
.parts .yin{background:#fdf0e1}
.parts b{display:block;font-size:12px;margin-bottom:2px}
.warn{display:flex;gap:8px;margin-top:8px;font-size:13px}
.warn em{font-style:normal;flex:none;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;height:fit-content}
.code{background:linear-gradient(135deg,#fff7e8,#fdebe6);border-radius:12px;padding:12px;font-size:13px}
.code b{color:var(--seal)}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--ink3);margin-top:6px}
@media (max-width:1100px){.app{grid-template-columns:150px 1fr 300px}.char-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const TYPE = {"引申":"var(--t-yin)","比喻":"var(--t-bi)","转喻":"var(--t-zhuan)","假借":"var(--t-jia)","本义":"var(--t-ben)"};
const TYPEHEX = {"引申":"#2f8f83","比喻":"#e08a2c","转喻":"#7a5bc4","假借":"#d24a6e"};
const SURE = {"确定":"#2f8f5b","通行说法":"#c08a12","待查":"#b9483f"};
const $ = s=>document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let cur = 0, sel = "c", view = {k:1,x:0,y:0};

/* 顶部菜单 */
const nav = $("#topnav");
D.menu.forEach((m,i)=>{
  const b = document.createElement("button");
  b.innerHTML = esc(m) + (i? '<span class="soon">建设中</span>':'');
  if(!i) b.className="on";
  b.onclick = ()=>{ if(i) toast("「"+m+"」模块正在建设中，敬请期待"); };
  nav.appendChild(b);
});
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1800);}

/* 左侧字表 */
const list = $("#charList");
D.chars.forEach((c,i)=>{
  const b=document.createElement("button");
  b.innerHTML = esc(c.c)+"<small>"+esc(c.py.split(" ")[0])+"</small>";
  b.onclick=()=>load(i);
  list.appendChild(b);
});

function wrap(t,n){const out=[];for(let i=0;i<t.length;i+=n)out.push(t.slice(i,i+n));return out;}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

/* 布局 */
function layout(ch){
  const pos={c:{x:0,y:0}}; const S=ch.senses;
  const lv1=S.filter(s=>!s.p||s.p==="c"); const n=lv1.length;
  const R1=260,R2=500;
  lv1.forEach((s,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n; pos[s.id]={x:R1*Math.cos(a),y:R1*Math.sin(a),a};
  });
  lv1.forEach(s=>{
    const kids=S.filter(k=>k.p===s.id); const m=kids.length; if(!m)return;
    const spread=Math.min(1.1,(2*Math.PI/n)*0.8)*(m>1?1:0);
    kids.forEach((k,j)=>{
      const a=m===1?pos[s.id].a:pos[s.id].a-spread/2+j*spread/(m-1);
      pos[k.id]={x:R2*Math.cos(a),y:R2*Math.sin(a),a};
      // 三级
      S.filter(g=>g.p===k.id).forEach((g,gi)=>{pos[g.id]={x:(R2+220)*Math.cos(a+gi*0.25),y:(R2+220)*Math.sin(a+gi*0.25),a};});
    });
  });
  return pos;
}

function render(){
  const ch=D.chars[cur], vp=$("#vp"); vp.innerHTML="";
  const pos=layout(ch);
  const gE=el("g",{},vp), gL=el("g",{},vp), gN=el("g",{},vp);
  // 连线
  ch.senses.forEach(s=>{
    const p=pos[s.p||"c"], q=pos[s.id], col=TYPEHEX[s.t]||"#999";
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy);
    const cx=mx-dy/len*28, cy=my+dx/len*28;
    el("path",{d:`M${p.x},${p.y} Q${cx},${cy} ${q.x},${q.y}`,class:"edge-path",stroke:col,"stroke-dasharray":s.ls==="待查"?"7 6":"none",opacity:.85},gE);
    // 标签
    const lx=(p.x+2*cx+q.x)/4, ly=(p.y+2*cy+q.y)/4;
    const g=el("g",{class:"edge-label",transform:`translate(${lx},${ly})`},gL);
    const lines=wrap(s.r,11), w=Math.max(...lines.map(l=>l.length))*11.5+18, h=24+lines.length*15;
    el("rect",{x:-w/2,y:-12,width:w,height:h,rx:10,fill:"#fffdf8",stroke:col,"stroke-opacity":.35},g);
    const tagW=s.t.length*13+16;
    el("rect",{x:-tagW/2,y:-21,width:tagW,height:18,rx:9,fill:col},g);
    const tt=el("text",{x:0,y:-8,"text-anchor":"middle","font-size":11,"font-weight":700,fill:"#fff"},g); tt.textContent=s.t+(s.ls==="待查"?"?":"");
    lines.forEach((l,i)=>{const t=el("text",{x:0,y:6+i*15,"text-anchor":"middle","font-size":11,fill:"#5d5866"},g);t.textContent=l;});
  });
  // 中心
  const cg=el("g",{class:"node"+(sel==="c"?" sel":""),"data-id":"c"},gN);
  el("circle",{cx:0,cy:0,r:92,fill:"#fbe9e5",opacity:.7},cg);
  el("circle",{cx:0,cy:0,r:76,fill:"#fff",stroke:"#c8483b","stroke-width":sel==="c"?4:2.5,class:"box"},cg);
  const t1=el("text",{x:0,y:-4,"text-anchor":"middle","font-size":54,"font-family":"var(--serif)",fill:"#c8483b"},cg);t1.textContent=ch.c;
  const t2=el("text",{x:0,y:26,"text-anchor":"middle","font-size":11,fill:"#948d9c"},cg);t2.textContent="本义";
  wrap(ch.center.m,8).forEach((l,i)=>{const t=el("text",{x:0,y:44+i*15,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"#2a2733"},cg);t.textContent=l;});
  cg.onclick=()=>clickNode("c");
  // 义项
  ch.senses.forEach(s=>{
    const q=pos[s.id], col=TYPEHEX[s.t]||"#999";
    const lines=wrap(s.m,7), w=140, h=30+lines.length*19;
    const g=el("g",{class:"node"+(sel===s.id?" sel":""),transform:`translate(${q.x},${q.y})`},gN);
    el("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:16,fill:"#fff",stroke:col,"stroke-width":sel===s.id?3.5:1.8,class:"box"},g);
    el("rect",{x:-w/2,y:-h/2,width:8,height:h,rx:4,fill:col},g);
    lines.forEach((l,i)=>{const t=el("text",{x:4,y:-h/2+24+i*19,"text-anchor":"middle","font-size":15,"font-weight":700,"font-family":"var(--serif)",fill:"#2a2733"},g);t.textContent=l;});
    el("circle",{cx:-w/2+20,cy:h/2-10,r:4,fill:SURE[s.s]},g);
    const st=el("text",{x:-w/2+28,y:h/2-6,"font-size":10,fill:"#948d9c"},g);st.textContent=s.s+(s.py?" · "+s.py:"");
    g.onclick=()=>clickNode(s.id);
  });
}

let moved=false;
function clickNode(id){ if(moved) return; sel=id; render(); renderDetail(); }

function sureHTML(s){return `<span class="sure"><i style="background:${SURE[s]}"></i>${esc(s)}</span>`;}
function gwHTML(gw){
  if(!gw) return `<div class="quote" style="border-color:#b9483f;color:#948d9c">暂未找到可靠的文言用例<span class="tag q">待查</span></div>`;
  return `<div class="quote">${esc(gw.t)}</div><div class="src">出处：${esc(gw.s)}</div><div class="tr">译文：${esc(gw.tr)}</div>`;
}
function renderDetail(){
  const ch=D.chars[cur], box=$("#detail");
  if(sel==="c"){
    const c=ch.center;
    box.innerHTML=`<h3>中心 · 本义</h3>
      <div class="d-title">${esc(ch.c)}：${esc(c.m)}<span class="d-py">${esc(ch.py)}</span></div>
      <div class="row"><div class="lab">《说文解字》原文</div><div class="quote">${esc(c.sw)}</div>${c.swn?`<div class="note">注：${esc(c.swn)}</div>`:""}</div>
      <div class="row"><div class="lab">字形演变（字形图待补）</div><div class="forms">${c.fs.map(f=>`<div><b>${esc(f)}</b>图待补</div>`).join("")}</div></div>
      <div class="row"><div class="lab">本义判定理由</div><div>${esc(c.why)}</div></div>
      <div class="row"><div class="lab">词族</div><div class="words">${c.w.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
      <div class="row"><div class="lab">构词拆解</div><div>${esc(c.b)}</div></div>
      <div class="row"><div class="lab">现代例句</div><div>${esc(c.ex)}<span class="tag demo">示例</span></div></div>
      <div class="row"><div class="lab">文言原句</div>${gwHTML(c.gw)}</div>
      <div class="row"><div class="lab">把握程度</div>${sureHTML(c.s)}</div>`;
    return;
  }
  const s=ch.senses.find(x=>x.id===sel);
  const parent = s.p ? ch.senses.find(x=>x.id===s.p).m : "本义（"+ch.center.m+"）";
  box.innerHTML=`<h3>义项详情</h3>
    <div class="d-title">${esc(s.m)}<span class="d-py">${esc(s.py||ch.py)}</span></div>
    <div class="row"><div class="lab">从「${esc(parent)}」变来</div>
      <span class="chip" style="background:${TYPEHEX[s.t]}">${esc(s.t)}</span> <span style="margin-left:6px">${esc(s.r)}</span>
      ${s.ls?`<div class="note">这条演变关系：${esc(s.ls)}</div>`:""}</div>
    <div class="row"><div class="lab">词族</div><div class="words">${s.w.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
    <div class="row"><div class="lab">构词拆解</div><div>${esc(s.b)}</div></div>
    <div class="row"><div class="lab">现代例句</div><div>${esc(s.ex)}<span class="tag demo">示例</span></div></div>
    <div class="row"><div class="lab">文言原句</div>${gwHTML(s.gw)}</div>
    <div class="row"><div class="lab">把握程度</div>${sureHTML(s.s)}</div>`;
}
function renderSide(){
  const ch=D.chars[cur];
  $("#side").innerHTML=`<h3>「${esc(ch.c)}」的身体密码</h3>
    <div class="parts"><div class="yi"><b>表义部分</b>${esc(ch.parts.yi)}</div><div class="yin"><b>表音部分</b>${esc(ch.parts.yin)}</div></div>
    <div class="warn"><em style="background:#fdf0e1;color:#c08a12">易读错</em><span>${esc(ch.misread)}</span></div>
    <div class="warn"><em style="background:#fbe9e5;color:#c8483b">易写错</em><span>${esc(ch.miswrite)}</span></div>
    <div class="row"><div class="lab">相关汉字密码</div><div class="code">${ch.code}</div></div>`;
  $("#charHead").innerHTML=`<div class="big">${esc(ch.c)}</div><div class="meta"><b>${esc(ch.py)}</b><div>本义：${esc(ch.center.m)} · ${ch.senses.length} 个义项</div></div>`;
}
function load(i){
  cur=i; sel="c";
  [...list.children].forEach((b,j)=>b.classList.toggle("on",j===i));
  render(); renderDetail(); renderSide(); fit();
}

/* 缩放平移 */
const svg=$("#map");
function apply(){ $("#vp").setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){
  const r=svg.getBoundingClientRect();
  const k=Math.min(r.width/1300,r.height/1180,1.15);
  view={k,x:r.width/2,y:r.height/2+20}; apply();
}
function zoomAt(f,px,py){
  const k2=Math.max(.3,Math.min(3,view.k*f)); const ratio=k2/view.k;
  view.x=px-(px-view.x)*ratio; view.y=py-(py-view.y)*ratio; view.k=k2; apply();
}
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false;});
window.addEventListener("pointermove",e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){moved=true;svg.classList.add("drag");}
  if(moved){view.x=drag.vx+dx;view.y=drag.vy+dy;apply();} });
window.addEventListener("pointerup",()=>{drag=null;svg.classList.remove("drag");setTimeout(()=>moved=false,0);});
const center=()=>{const r=svg.getBoundingClientRect();return [r.width/2,r.height/2];};
$("#zin").onclick=()=>zoomAt(1.2,...center());
$("#zout").onclick=()=>zoomAt(1/1.2,...center());
$("#zfit").onclick=fit;
window.addEventListener("resize",fit);

load(0);
})();
</script>
