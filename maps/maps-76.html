<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --paper:#fbf7ef; --paper2:#f4ecdc; --ink:#2b2622; --ink2:#6b6157; --line:#e4d8c3;
  --red:#c8553d; --red-soft:#f7e3dc;
  --t-yin:#3f8f6b; --t-bi:#e08a2e; --t-zhuan:#7b5ea7; --t-jia:#8a8f98;
  --ok:#3f8f6b; --mid:#c99a2e; --tbd:#b5524a;
  --r:14px; --shadow:0 6px 24px rgba(80,60,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC",serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* top nav */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .seal{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px}
nav.top{display:flex;gap:4px;flex-wrap:wrap}
nav.top button{border:0;background:transparent;padding:8px 13px;border-radius:999px;font-size:14px;color:var(--ink2);cursor:pointer;font-family:inherit;position:relative}
nav.top button:hover{background:var(--paper2)}
nav.top button.on{background:var(--red);color:#fff;font-weight:600}
nav.top button.off::after{content:"即将上线";position:absolute;top:-6px;right:-4px;font-size:9px;background:#efe6d6;color:#9a8a72;border-radius:6px;padding:0 4px;display:none}
nav.top button.off:hover::after{display:block}
/* main */
.main{display:grid;grid-template-columns:116px 1fr 380px;min-height:0}
aside.left{border-right:1px solid var(--line);background:#fffdf8;overflow-y:auto;padding:12px 10px}
aside.left h4{margin:4px 4px 10px;font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:.1em}
.charlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.charlist button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:26px;cursor:pointer;color:var(--ink);transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.charlist button small{font-size:10px;color:var(--ink2);margin-top:3px;font-family:sans-serif}
.charlist button:hover{border-color:var(--red);transform:translateY(-1px)}
.charlist button.on{background:var(--red);color:#fff;border-color:var(--red)}
.charlist button.on small{color:#fde}
/* stage */
.stage{position:relative;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,#fffaf0 0,#fbf7ef 60%,#f5eedf 100%);}
.stage svg{width:100%;height:100%;cursor:grab;display:block}
.stage svg.drag{cursor:grabbing}
.stage .title{position:absolute;left:20px;top:16px;pointer-events:none}
.stage .title .big{font-size:44px;line-height:1}
.stage .title .py{color:var(--ink2);font-size:14px;margin-top:4px}
.zoombar{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.zoombar button:hover{border-color:var(--red);color:var(--red)}
.legend{position:absolute;left:20px;bottom:16px;display:flex;gap:12px;background:rgba(255,255,255,.85);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.hint{position:absolute;right:16px;bottom:16px;font-size:12px;color:var(--ink2);background:rgba(255,255,255,.85);border:1px solid var(--line);padding:6px 10px;border-radius:10px}
/* svg nodes */
.node{cursor:pointer}
.node rect,.node circle{transition:filter .15s}
.node:hover rect,.node:hover circle{filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.node.sel rect,.node.sel circle{stroke:var(--red)!important;stroke-width:3!important}
/* right panel */
aside.right{border-left:1px solid var(--line);background:#fffdf8;overflow-y:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(80,60,30,.04)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.sense-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sense-head .m{font-size:20px;font-weight:700}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;font-weight:600}
.cert{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;font-weight:600}
.cert.c1{color:var(--ok);border-color:var(--ok);background:#eaf5ef}
.cert.c2{color:var(--mid);border-color:var(--mid);background:#fbf3df}
.cert.c3{color:var(--tbd);border-color:var(--tbd);background:#fbe9e7}
.why{font-size:13px;color:var(--ink2);background:var(--paper);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.sec{margin-top:10px}
.sec .lab{font-size:12px;color:var(--ink2);margin-bottom:4px;letter-spacing:.05em}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--red-soft);color:#8a3524;padding:4px 10px;border-radius:8px;font-size:15px}
.quote{border-left:3px solid var(--red);padding:6px 10px;background:var(--paper);border-radius:0 10px 10px 0;font-size:15px}
.quote .src{font-size:12px;color:var(--ink2);margin-top:4px}
.quote .tr{font-size:13px;color:var(--ink2);margin-top:6px;font-family:sans-serif}
.tag{font-size:10px;background:#efe6d6;color:#8a7658;border-radius:5px;padding:1px 5px;margin-right:4px;vertical-align:middle;font-family:sans-serif}
.tbd{color:var(--tbd);font-size:13px}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.forms div{border:1px dashed var(--line);border-radius:10px;text-align:center;padding:8px 2px;background:var(--paper)}
.forms b{display:block;font-size:24px;font-weight:400;min-height:30px;color:#7a6c5c}
.forms small{font-size:11px;color:var(--ink2)}
.parts{display:flex;gap:8px;align-items:stretch}
.parts .p{flex:1;border-radius:12px;padding:10px;text-align:center}
.parts .p .g{font-size:30px}
.parts .p .r{font-size:12px;margin-top:2px}
.p.yi{background:#eaf5ef;color:#2d6b50}
.p.yin{background:#eef0fb;color:#46529a}
.p.other{background:var(--paper2);color:#7a6040}
ul.clean{margin:0;padding-left:18px;font-size:13px;line-height:1.75}
ul.clean li::marker{color:var(--red)}
.muted{color:var(--ink2);font-size:12px}
.placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink2)}
@media (max-width:1100px){.main{grid-template-columns:96px 1fr 320px}}
</style>
</head>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hanzi-data').textContent);
const CH = DATA.chars;
const TYPE_COLOR = {"引申":"#3f8f6b","比喻":"#e08a2e","转喻":"#7b5ea7","假借":"#8a8f98"};
const CERT_CLS = {"确定":"c1","通行说法":"c2","待查":"c3"};
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* top nav */
const nav = $('#topnav');
MENU.forEach((m,i)=>{
  const b=document.createElement('button');
  b.textContent=m; b.className=i===0?'on':'off';
  if(i>0){b.title='本模块即将上线';b.onclick=()=>toast('「'+m+'」模块即将上线');}
  nav.appendChild(b);
});
function toast(t){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';
    el.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9;transition:opacity .3s';
    document.body.appendChild(el);}
  el.textContent=t; el.style.opacity=1; clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity=0,1600);
}

/* left list */
const list=$('#charlist');
CH.forEach((d,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<span class="kai">'+d.c+'</span><small>'+esc(d.py.split(' ')[0])+'</small>';
  b.onclick=()=>select(i);
  list.appendChild(b);
});

/* svg zoom/pan */
const svg=$('#svg'), vp=$('#vp');
let view={x:0,y:0,k:1};
function applyView(){vp.setAttribute('transform','translate('+view.x+','+view.y+') scale('+view.k+')');}
function fit(){
  const r=svg.getBoundingClientRect();
  const k=Math.min(r.width/860, r.height/760, 1.15);
  view={k:k,x:r.width/2,y:r.height/2+10}; applyView();
}
function zoomAt(f,cx,cy){
  const r=svg.getBoundingClientRect();
  if(cx==null){cx=r.width/2;cy=r.height/2;}
  const nk=Math.max(.35,Math.min(3.5,view.k*f));
  view.x=cx-(cx-view.x)*(nk/view.k); view.y=cy-(cy-view.y)*(nk/view.k); view.k=nk; applyView();
}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyView();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('#zin').onclick=()=>zoomAt(1.2);
$('#zout').onclick=()=>zoomAt(1/1.2);
$('#zreset').onclick=fit;
window.addEventListener('resize',fit);

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function wrap(t,n){const out=[];let s=String(t);while(s.length>n){out.push(s.slice(0,n));s=s.slice(n);}if(s)out.push(s);return out;}

let cur=0, selNode=-1;
function select(i){
  cur=(i+CH.length)%CH.length; selNode=-1;
  [...list.children].forEach((b,j)=>b.classList.toggle('on',j===cur));
  list.children[cur].scrollIntoView({block:'nearest'});
  const d=CH[cur];
  $('#tChar').textContent=d.c; $('#tPy').textContent=d.py+(d.trad!==d.c?'　繁体：'+d.trad:'');
  draw(d); fit(); renderRight(d,-1);
}

function draw(d){
  vp.innerHTML='';
  const n=d.senses.length, R= n<=2?270:300;
  const gE=el('g',{},vp), gN=el('g',{},vp);
  const pos=d.senses.map((s,i)=>{
    const a=-Math.PI/2 + (n===1?0:i*2*Math.PI/n) + (n===2?Math.PI/2:0);
    return {x:Math.cos(a)*R, y:Math.sin(a)*R, a:a};
  });
  // edges
  d.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPE_COLOR[s.type]||'#999';
    const mx=p.x*0.5, my=p.y*0.5;
    const nx=-Math.sin(p.a)*28, ny=Math.cos(p.a)*28;
    el('path',{d:'M0,0 Q'+(mx+nx)+','+(my+ny)+' '+p.x+','+p.y,fill:'none',stroke:col,'stroke-width':3,'stroke-linecap':'round','stroke-dasharray':s.type==='假借'?'8 7':'none',opacity:.85},gE);
    // label
    const lx=p.x*0.52+nx*0.5, ly=p.y*0.52+ny*0.5;
    const g=el('g',{transform:'translate('+lx+','+ly+')'},gE);
    const lines=wrap(s.why,11).slice(0,4);
    const h=26+lines.length*16;
    el('rect',{x:-92,y:-12,width:184,height:h,rx:10,fill:'#fffdf8',stroke:col,'stroke-width':1,opacity:.96},g);
    el('rect',{x:-24,y:-21,width:48,height:20,rx:10,fill:col},g);
    const tt=el('text',{x:0,y:-7,'text-anchor':'middle','font-size':12,fill:'#fff','font-weight':700},g); tt.textContent=s.type;
    lines.forEach((ln,k)=>{const t=el('text',{x:0,y:8+k*16,'text-anchor':'middle','font-size':11.5,fill:'#5b5249'},g);t.textContent=ln;});
  });
  // center
  const c=el('g',{class:'node'+(selNode===-1?' sel':''),'data-i':-1},gN);
  el('circle',{r:92,fill:'#fff5ef',stroke:'#c8553d','stroke-width':2,opacity:.6},c);
  el('circle',{r:78,fill:'#c8553d',stroke:'#c8553d','stroke-width':0},c);
  let t=el('text',{y:6,'text-anchor':'middle','font-size':54,fill:'#fff',class:'kai'},c); t.textContent=d.c;
  t=el('text',{y:-44,'text-anchor':'middle','font-size':11,fill:'#fde4dc','letter-spacing':2},c); t.textContent='本　义';
  wrap(d.origin.m,8).slice(0,2).forEach((ln,k)=>{const x=el('text',{y:34+k*15,'text-anchor':'middle','font-size':12.5,fill:'#fff','font-weight':600},c);x.textContent=ln;});
  c.onclick=()=>pick(-1);
  // branches
  d.senses.forEach((s,i)=>{
    const p=pos[i], col=TYPE_COLOR[s.type];
    const g=el('g',{class:'node'+(selNode===i?' sel':''),transform:'translate('+p.x+','+p.y+')','data-i':i},gN);
    const w=Math.max(120, s.m.length*17+40);
    el('rect',{x:-w/2,y:-30,width:w,height:60,rx:16,fill:'#fff',stroke:col,'stroke-width':2},g);
    el('rect',{x:-w/2,y:-30,width:8,height:60,rx:4,fill:col},g);
    let tx=el('text',{y:2,'text-anchor':'middle','font-size':16,'font-weight':700,fill:'#2b2622'},g); tx.textContent=s.m;
    tx=el('text',{y:20,'text-anchor':'middle','font-size':11,fill:'#8a7f73'},g); tx.textContent=s.words.slice(0,2).join(' · ');
    const cc={"确定":"#3f8f6b","通行说法":"#c99a2e","待查":"#b5524a"}[s.cert];
    el('circle',{cx:w/2-10,cy:-20,r:5,fill:cc},g);
    g.onclick=()=>pick(i);
  });
}
function pick(i){
  selNode=i;
  vp.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel',+n.getAttribute('data-i')===i));
  renderRight(CH[cur],i);
}

function certTag(c){return '<span class="cert '+(CERT_CLS[c]||'c3')+'">'+esc(c)+'</span>';}
function clsBlock(cls){
  if(!cls) return '<div class="tbd">文言原句：待查（未找到可靠出处，暂不列）</div>';
  return '<div class="quote kai">'+esc(cls.t)+'<div class="src">—— '+esc(cls.s)+'</div><div class="tr"><span class="tag">译文</span>'+esc(cls.y)+'</div></div>';
}
function detailHTML(d,i){
  const isO=i===-1, s=isO?d.origin:d.senses[i];
  let h='<div class="card"><h3><span class="dot"></span>'+(isO?'本义 · 中心':'义项详情')+'</h3>';
  h+='<div class="sense-head"><span class="m">'+esc(s.m)+'</span>';
  if(!isO) h+='<span class="pill" style="background:'+TYPE_COLOR[s.type]+'">'+esc(s.type)+'</span>';
  h+=certTag(s.cert)+'</div>';
  if(isO){
    h+='<div class="sec"><div class="lab">《说文解字》</div>'+(s.sw?'<div class="quote kai">'+esc(s.sw)+(s.swNote?'<div class="src">注：'+esc(s.swNote)+'</div>':'')+'</div>':'<div class="tbd">'+esc(s.swNote||'待查')+'</div>')+'</div>';
    h+='<div class="sec"><div class="lab">字形演变（字形图占位）</div><div class="forms">'+s.forms.map(f=>{const p=f.split('：');return '<div><b class="kai">'+(/待补|待查|未见|未收/.test(p[1])?'□':esc(p[1]))+'</b><small>'+esc(p[0])+(/待补|待查|未见|未收/.test(p[1])?'<br>'+esc(p[1]):'')+'</small></div>';}).join('')+'</div></div>';
    h+='<div class="sec"><div class="lab">本义判定理由</div><div class="why" style="margin:0">'+esc(s.why)+'</div></div>';
  } else {
    h+='<div class="why">💡 '+esc(s.why)+'</div>';
  }
  h+='<div class="sec"><div class="lab">词族</div><div class="words">'+s.words.map(w=>'<span class="kai">'+esc(w)+'</span>').join('')+'</div></div>';
  h+='<div class="sec"><div class="lab">构词拆解</div><div style="font-size:14px">'+esc(s.parse)+'</div></div>';
  h+='<div class="sec"><div class="lab">现代例句</div>'+(s.ex?'<div style="font-size:14px"><span class="tag">示例</span>'+esc(s.ex)+'</div>':'<div class="muted">现代汉语已不常用此义。</div>')+'</div>';
  h+='<div class="sec"><div class="lab">文言原句</div>'+clsBlock(s.cls)+'</div>';
  h+='<div class="sec"><div class="lab">把握程度</div>'+certTag(s.cert)+' <span class="muted">确定＝有字书或典籍直接依据；通行说法＝教材辞书常见解释但学界有不同意见；待查＝暂无可靠依据</span></div>';
  return h+'</div>';
}
function renderRight(d,i){
  let h=detailHTML(d,i);
  h+='<div class="card"><h3><span class="dot" style="background:#46529a"></span>偏旁拆分</h3><div class="parts">'+
    d.parts.map(p=>'<div class="p '+(p.role==='表义'?'yi':(p.role.indexOf('表音')===0?'yin':'other'))+'"><div class="g kai">'+esc(p.g)+'</div><div class="r"><b>'+esc(p.role)+'</b><br>'+esc(p.r)+'</div></div>').join('')+
    '</div><div class="muted" style="margin-top:8px">'+esc(d.struct)+'</div></div>';
  h+='<div class="card"><h3><span class="dot" style="background:#b5524a"></span>易读错 · 易写错</h3><ul class="clean">'+d.errs.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>';
  h+='<div class="card"><h3><span class="dot" style="background:#c99a2e"></span>汉字密码</h3><ul class="clean">'+d.codes.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>';
  h+='<div class="muted" style="padding:0 4px 10px">'+esc(DATA.meta.note)+'</div>';
  $('#right').innerHTML=h; $('#right').scrollTop=0;
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight') select(cur+1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft') select(cur-1);
  if(e.key==='+'||e.key==='=') zoomAt(1.2);
  if(e.key==='-') zoomAt(1/1.2);
});
select(0);
})();
</script>
