<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字乐园 · 字义扩展图（20字）</title>
<style>
:root{
  --bg:#FFF9F0; --ink:#2D2A32; --muted:#7A7385;
  --c1:#FF7A59; --c2:#3D8BFD; --c3:#2EC4B6; --c4:#9B5DE5; --c5:#FFB703;
  --yy:#3D8BFD; --by:#9B5DE5; --zy:#2EC4B6; --jj:#8E8E93; --orig:#FF7A59;
  --sh:0 6px 0 rgba(45,42,50,.06),0 12px 28px rgba(45,42,50,.08);
  --han:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC","PingFang SC","Microsoft YaHei",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;
  background-image:radial-gradient(circle at 10% 10%,#FFE8D6 0,transparent 30%),radial-gradient(circle at 90% 0,#E0F0FF 0,transparent 30%)}
button{font-family:inherit}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(0,0,0,.06)}
.hd{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1400px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;white-space:nowrap}
.logo svg{width:42px;height:42px}
nav.top{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
nav.top::-webkit-scrollbar{display:none}
.tb{flex:none;border:none;background:transparent;padding:10px 14px;border-radius:16px;font-size:17px;font-weight:800;color:var(--muted);cursor:pointer;min-height:48px}
.tb:hover{background:#F4EFE8}
.tb.on{background:var(--ink);color:#fff}
.tb .soon{font-size:11px;background:#EEE;color:#999;border-radius:6px;padding:1px 4px;margin-left:3px;vertical-align:2px}
.wrap{display:grid;grid-template-columns:148px 1fr 320px;gap:16px;max-width:1400px;margin:0 auto;padding:16px 16px 40px}
.wrap.full{grid-template-columns:1fr}
aside.left{position:sticky;top:88px;align-self:start;background:#fff;border-radius:26px;box-shadow:var(--sh);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:calc(100vh - 100px);overflow:auto}
aside.left h4{grid-column:1/-1}
aside.left h4{margin:2px 0 4px;text-align:center;font-size:14px;color:var(--muted)}
.cb{border:none;border-radius:20px;background:#FFF1EA;color:var(--c1);font-family:var(--han);font-size:34px;font-weight:700;cursor:pointer;height:56px;box-shadow:0 4px 0 #F8D3C4;transition:transform .12s}
.cb:active{transform:translateY(3px);box-shadow:0 1px 0 #F8D3C4}
.cb.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 #C9583C}
main{min-width:0}
.panel{background:#fff;border-radius:26px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.head .g{width:96px;height:96px;border-radius:26px;background:linear-gradient(145deg,#FF9A7A,#FF7A59);color:#fff;font-family:var(--han);font-size:72px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #D9603F}
.head h1{margin:0;font-size:30px}
.head .py{font-size:22px;font-weight:800;color:var(--c1)}
.head .st{color:var(--muted);font-size:15px;margin-top:2px}
.say{border:none;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:800;cursor:pointer;min-height:44px}
.say.sm{padding:4px 10px;min-height:34px;font-size:14px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.lg{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:800;background:#F5F2EC}
.lg i{width:22px;height:5px;border-radius:3px;display:inline-block}
.arch{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:12px;margin-top:14px}
.ab{border-radius:20px;padding:12px 14px;background:#FFF7F2}
.ab h3{margin:0 0 6px;font-size:16px;color:var(--c1);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ab p{margin:0;font-size:16px;line-height:1.65}
.sw{font-family:var(--han);font-size:19px;line-height:1.7}
.evo{display:flex;gap:6px;align-items:stretch}
.es{flex:1;background:#fff;border:2px dashed #F2C9B8;border-radius:14px;padding:6px;text-align:center;min-width:0}
.es b{display:block;font-size:13px;color:var(--muted)}
.es .ph{font-family:var(--han);font-size:30px;font-weight:700;height:40px;line-height:40px;color:#E7B9A6}
.es .ph.k{color:var(--ink)}
.es small{display:block;font-size:12px;line-height:1.35;color:var(--muted)}
.cert{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800}
.c-确定{background:#E2F7EA;color:#1E8E4E}.c-通行说法{background:#FFF4CC;color:#9A7400}.c-待查{background:#FFE3E3;color:#C0392B}

.mapbox{position:relative;background:#fff;border-radius:26px;box-shadow:var(--sh);overflow:hidden;height:600px;touch-action:none;
  background-image:radial-gradient(#F0E8DC 1.2px,transparent 1.2px);background-size:22px 22px}
.mapbox svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.mapbox svg.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:48px;height:48px;border:none;border-radius:16px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);font-size:24px;font-weight:900;cursor:pointer}
.tog{position:absolute;left:12px;top:12px;border:none;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);padding:8px 12px;font-size:15px;font-weight:800;cursor:pointer;min-height:44px}
.tog.on{background:var(--ink);color:#fff}
.maphint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:10px;padding:4px 8px}
.node{cursor:pointer}
.node.sel rect,.node.sel circle.bd{stroke:#2D2A32;stroke-width:6}
.node text{pointer-events:none}

.detail{display:none;animation:rise .3s ease}
.detail.on{display:block}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh h2{margin:0;font-size:28px}
.tag{border-radius:999px;padding:3px 12px;font-size:15px;font-weight:800;background:#F3F0EA}
.why{margin-top:10px;padding:12px 14px;border-radius:18px;font-size:18px;line-height:1.6}
.sec{margin-top:12px}
.sec h4{margin:0 0 6px;font-size:16px;color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.w{background:#fff;border:3px solid #ECE6DC;border-radius:14px;padding:6px 12px;font-size:20px;font-weight:700;cursor:pointer}
.w:hover{border-color:var(--c2)}
.gc{display:flex;flex-wrap:wrap;gap:8px}
.gci{background:#F4F8FF;border-radius:14px;padding:8px 12px;font-size:16px;line-height:1.5}
.gci b{font-family:var(--han);font-size:22px}
.hl{color:#E2552D;font-weight:900}
.ex{background:#F7FBF4;border-radius:16px;padding:10px 14px;font-size:18px;line-height:1.6}
.demo{display:inline-block;background:#E8F0FF;color:#2F6FD8;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:4px;vertical-align:2px}
.cl{background:#FFFBEA;border:2px solid #F2D16B;border-radius:16px;padding:10px 14px;font-size:17px;line-height:1.65}
.cl .t{font-family:var(--han);font-size:21px}
.cl .s{color:#9A7400;font-weight:800;font-size:15px}
.cl .tr{color:var(--muted);font-size:16px}

aside.right{align-self:start;position:sticky;top:88px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:6px}
.rc{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:14px}
.rc h3{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:6px}
.part{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;margin-bottom:8px}
.part .pg{width:58px;height:58px;flex:none;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--han);font-size:36px;font-weight:700}
.part .role{font-weight:900;font-size:15px}
.part .pn{font-size:14px;color:var(--muted);line-height:1.45}
.r-表义{background:#EAF3FF}.r-表义 .role{color:var(--c2)}
.r-表音{background:#FFF1E3}.r-表音 .role{color:#D9731C}
.r-记号{background:#F2F2F4}.r-记号 .role{color:#666}
.r-整字{background:#F1E9FF}.r-整字 .role{color:var(--c4)}
.pit{list-style:none;padding:0;margin:0}
.pit li{padding:8px 10px;border-radius:14px;margin-bottom:6px;font-size:15px;line-height:1.5}
.pit li.rd{background:#FFF0F3}.pit li.wr{background:#F0F7FF}
.pit li b{font-size:13px;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff}
.pit li.rd b{background:#EF476F}.pit li.wr b{background:#3D8BFD}
.code{padding:10px 12px;border-radius:16px;background:linear-gradient(150deg,#F3ECFF,#fff);margin-bottom:8px;font-size:15px;line-height:1.55}
.code b{color:var(--c4)}
.soonpage{text-align:center;padding:60px 20px}
.soonpage .big{font-size:110px}
.btn{border:none;border-radius:18px;padding:12px 22px;font-size:18px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;min-height:50px}
.foot{color:var(--muted);font-size:14px;text-align:center;margin-top:10px;line-height:1.6}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:1100px){
  .wrap{grid-template-columns:148px 1fr}
  aside.right{grid-column:2;position:static;max-height:none}
  .arch{grid-template-columns:1fr}
}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;padding:10px}
  aside.left{position:static;display:flex;flex-direction:row;overflow-x:auto;padding:8px;max-height:none}
  aside.left h4{display:none}
  .cb{flex:none;width:58px;height:58px;font-size:36px}
  aside.right{grid-column:1}
  .logo span{display:none}
  .mapbox{height:460px}
  .head .g{width:76px;height:76px;font-size:56px}
  .legend{margin-left:0}
}
</style>
</head>

</header>
<div class="wrap" id="wrap">

  <main id="main"></main>
  <aside class="right" id="right"></aside>
</div>

<script>
var DATA=JSON.parse(document.getElementById('maps-data').textContent);
var TYPE={"本义":{c:"#FF7A59",bg:"#FFF1EA"},"引申":{c:"#3D8BFD",bg:"#EAF3FF"},"比喻":{c:"#9B5DE5",bg:"#F3ECFF"},"转喻":{c:"#2EC4B6",bg:"#E3F8F6"},"假借":{c:"#8E8E93",bg:"#F2F2F4"}};
var TOP=[["kz","字义扩展图"],["rad","偏旁部首"],["pho","声旁音部"],["zcj","字词句"],["mm","汉字密码"],["yc","易错诊所"],["jy","记忆复习"],["lj","学习路径"]];
var st={top:"kz",cur:0,sel:null,showWhy:true,k:1,tx:0,ty:0};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
function tw(s,f){var n=0;for(var i=0;i<s.length;i++)n+=s.charCodeAt(i)>255?1:.55;return n*f}
function cert(c){return '<span class="cert c-'+c+'">'+c+'</span>'}
function wrapTxt(s,n){var out=[];for(var i=0;i<s.length;i+=n)out.push(s.slice(i,i+n));return out.slice(0,3)}

/* 菜单 */
function drawTop(){
  $('topnav').innerHTML=TOP.map(function(t){return '<button class="tb'+(st.top===t[0]?' on':'')+'" data-k="'+t[0]+'">'+t[1]+(t[0]==='kz'?'':'<span class="soon">建设中</span>')+'</button>'}).join('');
  $('topnav').querySelectorAll('.tb').forEach(function(b){b.onclick=function(){st.top=b.dataset.k;render()}});
}
function drawLeft(){
  $('left').innerHTML='<h4>选字</h4>'+DATA.map(function(d,i){return '<button class="cb'+(i===st.cur?' on':'')+'" data-i="'+i+'">'+d.char+'</button>'}).join('');
  $('left').querySelectorAll('.cb').forEach(function(b){b.onclick=function(){st.cur=+b.dataset.i;st.sel=null;st.k=1;st.tx=0;st.ty=0;render();say(DATA[st.cur].char)}});
}

/* 主区 */
function drawMain(){
  var d=DATA[st.cur],root=d.senses.filter(function(s){return s.type==='本义'})[0];
  var lg=['引申','比喻','转喻','假借'].map(function(k){return '<span class="lg"><i style="background:'+TYPE[k].c+(k==='假借'?';background:repeating-linear-gradient(90deg,#8E8E93 0 5px,transparent 5px 9px)':'')+'"></i>'+k+'</span>'}).join('');
  var evo='<div class="evo">'+d.evolution.map(function(e){return '<div class="es"><b>'+e.stage+'</b><div class="ph'+(e.glyph?' k':'')+'">'+(e.glyph||'▢')+'</div><small>'+esc(e.desc)+'</small></div>'}).join('')+'</div>';
  $('main').innerHTML=
   '<div class="panel"><div class="head"><div class="g">'+d.char+'</div><div><h1>「'+d.char+'」的义项网</h1><div class="py">'+d.pinyin+'</div><div class="st">'+esc(d.structure)+' · 共 '+d.senses.length+' 个义项</div></div>'+
   '<button class="say" id="sayc">🔊 读一读</button><div class="legend">'+lg+'</div></div>'+
   '<div class="arch">'+
     '<div class="ab"><h3>📜 《说文》原文 '+cert(d.shuowen.certainty)+'</h3><p class="sw">'+esc(d.shuowen.text)+'</p></div>'+
     '<div class="ab"><h3>🔄 字形演变 <span class="cert c-待查">字形图待补</span></h3>'+evo+'</div>'+
     '<div class="ab"><h3>🎯 本义判定：'+esc(root.gloss)+'</h3><p>'+esc(d.benyi_reason)+'</p></div>'+
   '</div></div>'+
   '<div class="mapbox" id="mapbox"><svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>'+
   '<button class="tog'+(st.showWhy?' on':'')+'" id="tog">💬 连线原因</button>'+
   '<div class="zoom"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="缩小">－</button><button id="zre" aria-label="复位">⟲</button></div>'+
   '<div class="maphint">拖动移动 · 滚轮/双指缩放 · 点义项看详情</div></div>'+
   '<div class="panel detail" id="detail" style="margin-top:14px"></div>'+
   '<p class="foot">例句均为自编，标「示例」。文言原句与《说文》引文请对照原书核对后使用；拿不准的标「待查」。</p>';
  $('sayc').onclick=function(){say(d.char)};
  $('tog').onclick=function(){st.showWhy=!st.showWhy;this.classList.toggle('on',st.showWhy);drawMap()};
  $('zin').onclick=function(){zoomAt(1.25)};$('zout').onclick=function(){zoomAt(.8)};$('zre').onclick=function(){st.k=1;st.tx=0;st.ty=0;applyVP()};
  drawMap();bindPanZoom();
  if(st.sel)showSense(st.sel,true);
}

/* 义项网布局 */
function drawMap(){
  var d=DATA[st.cur],S=d.senses,root=S.filter(function(s){return !s.parent&&s.type==='本义'})[0];
  var kids={};S.forEach(function(s){var p=s.parent||(s===root?null:root.id);if(p){(kids[p]=kids[p]||[]).push(s)}});
  function leaves(s){var k=kids[s.id]||[];return k.length?k.reduce(function(a,c){return a+leaves(c)},0):1}
  var R=[0,290,520],pos={};pos[root.id]={x:0,y:0};
  (function place(s,a0,a1,dep){var k=kids[s.id]||[],t=leaves(s),a=a0;k.forEach(function(c){var sp=(a1-a0)*leaves(c)/t,m=a+sp/2,r=R[Math.min(dep+1,2)]+(dep+1>2?150:0);pos[c.id]={x:Math.cos(m)*r,y:Math.sin(m)*r,par:s.id};place(c,a,a+sp,dep+1);a+=sp})})(root,-Math.PI/2,Math.PI*1.5,0);
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,box={};
  S.forEach(function(s){var p=pos[s.id];if(!p)return;var w=s===root?250:Math.max(150,tw(s.gloss,26)+40),h=s===root?250:66;box[s.id]={w:w,h:h};
    minx=Math.min(minx,p.x-w/2);maxx=Math.max(maxx,p.x+w/2);miny=Math.min(miny,p.y-h/2);maxy=Math.max(maxy,p.y+h/2)});
  var m=40;$('svg').setAttribute('viewBox',[minx-m,miny-m,maxx-minx+2*m,maxy-miny+2*m].join(' '));
  var g='';
  S.forEach(function(s){var p=pos[s.id];if(!p||!p.par)return;var a=pos[p.par],T=TYPE[s.type];
    g+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+p.x+'" y2="'+p.y+'" stroke="'+T.c+'" stroke-width="5" stroke-linecap="round"'+(s.type==='假借'?' stroke-dasharray="12 10"':'')+' opacity=".85"/>'});
  S.forEach(function(s){var p=pos[s.id];if(!p||!p.par)return;var a=pos[p.par],T=TYPE[s.type],x=(a.x+p.x)/2,y=(a.y+p.y)/2,w=70;
    g+='<g><rect x="'+(x-w/2)+'" y="'+(y-16)+'" width="'+w+'" height="32" rx="16" fill="'+T.c+'"/><text x="'+x+'" y="'+(y+7)+'" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">'+s.type+'</text>';
    if(st.showWhy){var ls=wrapTxt(s.reason,9);var bw=Math.max.apply(null,ls.map(function(l){return tw(l,15)}))+16;
      g+='<rect x="'+(x-bw/2)+'" y="'+(y+20)+'" width="'+bw+'" height="'+(ls.length*19+8)+'" rx="10" fill="#fff" stroke="'+T.c+'" stroke-width="1.5" opacity=".95"/>';
      ls.forEach(function(l,i){g+='<text x="'+x+'" y="'+(y+38+i*19)+'" text-anchor="middle" font-size="15" fill="#4A4553">'+esc(l)+'</text>'})}
    g+='</g>'});
  S.forEach(function(s){var p=pos[s.id];if(!p)return;var b=box[s.id],T=TYPE[s.type],sel=st.sel===s.id;
    if(s===root){g+='<g class="node'+(sel?' sel':'')+'" data-id="'+s.id+'"><circle class="bd" cx="0" cy="0" r="125" fill="#FFF1EA" stroke="#FF7A59" stroke-width="6"/><circle cx="0" cy="0" r="138" fill="none" stroke="#FF7A59" stroke-width="2" stroke-dasharray="6 7" opacity=".6"/>'+
      '<text x="0" y="10" text-anchor="middle" font-size="110" font-weight="700" fill="#2D2A32" style="font-family:var(--han)">'+esc(d.char)+'</text>'+
      '<text x="0" y="52" text-anchor="middle" font-size="22" font-weight="900" fill="#FF7A59">本义 · '+esc(s.gloss)+'</text>'+
      '<text x="0" y="80" text-anchor="middle" font-size="15" fill="#7A7385">点我看《说文》与判定</text></g>'}
    else{g+='<g class="node'+(sel?' sel':'')+'" data-id="'+s.id+'"><rect x="'+(p.x-b.w/2)+'" y="'+(p.y-b.h/2)+'" width="'+b.w+'" height="'+b.h+'" rx="22" fill="'+T.c+'"'+(s.type==='假借'?' fill-opacity=".85"':'')+'/>'+
      '<text x="'+p.x+'" y="'+(p.y+9)+'" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">'+esc(s.gloss)+'</text></g>'}});
  $('vp').innerHTML=g;applyVP();
  $('vp').querySelectorAll('.node').forEach(function(n){n.addEventListener('click',function(){if(moved)return;showSense(n.dataset.id)})});
}

/* 缩放平移 */
var moved=false;
function applyVP(){var vp=$('vp');if(vp)vp.setAttribute('transform','translate('+st.tx+','+st.ty+') scale('+st.k+')')}
function svgPt(cx,cy){var s=$('svg'),p=s.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(s.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){var s=$('svg'),r=s.getBoundingClientRect();var p=svgPt(cx==null?r.left+r.width/2:cx,cy==null?r.top+r.height/2:cy);
  var k2=Math.min(4,Math.max(.4,st.k*f));f=k2/st.k;st.tx=p.x-(p.x-st.tx)*f;st.ty=p.y-(p.y-st.ty)*f;st.k=k2;applyVP()}
function bindPanZoom(){
  var s=$('svg'),pts={},last=null,pinch=null;
  s.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
  s.addEventListener('pointerdown',function(e){pts[e.pointerId]={x:e.clientX,y:e.clientY};moved=false;last={x:e.clientX,y:e.clientY};s.classList.add('drag');
    var ids=Object.keys(pts);if(ids.length===2){var a=pts[ids[0]],b=pts[ids[1]];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
  s.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(pts);
    if(ids.length===2&&pinch){var a=pts[ids[0]],b=pts[ids[1]],dd=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(dd/pinch,(a.x+b.x)/2,(a.y+b.y)/2);pinch=dd;moved=true;return}
    var dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=moved||Math.hypot(e.clientX-last.x,e.clientY-last.y)>0;
    var sc=s.getScreenCTM().a;st.tx+=dx/sc;st.ty+=dy/sc;last={x:e.clientX,y:e.clientY};applyVP();
    if(Math.abs(dx)+Math.abs(dy)>2)moved=true});
  function up(e){delete pts[e.pointerId];if(Object.keys(pts).length<2)pinch=null;s.classList.remove('drag');setTimeout(function(){moved=false},0)}
  s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up);s.addEventListener('pointerleave',function(e){if(pts[e.pointerId])up(e)});
}

/* 义项详情 */
function showSense(id,noScroll){
  var d=DATA[st.cur],s=d.senses.filter(function(x){return x.id===id})[0];if(!s)return;
  st.sel=id;drawMap();var T=TYPE[s.type],par=d.senses.filter(function(x){return x.id===s.parent})[0];
  if(!par&&s.type!=='本义')par=d.senses.filter(function(x){return x.type==='本义'})[0];
  var hl=function(t){return esc(t).split(d.char).join('<span class="hl">'+d.char+'</span>')};
  var h='<div class="dh"><h2>'+hl(s.gloss)+'</h2><span class="tag">'+esc(s.reading)+'</span><span class="tag" style="background:'+T.c+';color:#fff">'+s.type+'</span>'+cert(s.certainty)+'<button class="say sm" data-s="'+esc(d.char)+'">🔊</button></div>';
  if(s.type==='本义')h+='<div class="why" style="background:'+T.bg+'">🎯 <b>本义</b>：'+esc(d.benyi_reason)+'</div><div class="why" style="background:#FFF7F2">📜 '+esc(d.shuowen.text)+' '+cert(d.shuowen.certainty)+'</div>';
  else h+='<div class="why" style="background:'+T.bg+'">'+(s.type==='假借'?'🎈':'🤔')+' <b>'+(par?'「'+esc(par.gloss)+'」→「'+esc(s.gloss)+'」':'')+'</b>　'+esc(s.reason)+'</div>';
  h+='<div class="sec"><h4>📚 词族</h4><div class="words">'+s.words.map(function(w){return '<span class="w" data-s="'+esc(w)+'">'+hl(w)+'</span>'}).join('')+'</div></div>';
  h+='<div class="sec"><h4>🧩 构词拆解</h4><div class="gc">'+s.gouci.map(function(g){return '<div class="gci">'+hl(g[0])+' → <b>'+hl(g[1])+'</b>：'+esc(g[2])+'</div>'}).join('')+'</div></div>';
  h+='<div class="sec"><h4>✏️ 现代例句</h4><div class="ex">'+hl(s.example)+'<span class="demo">示例</span> <button class="say sm" data-s="'+esc(s.example)+'">🔊</button></div></div>';
  h+='<div class="sec"><h4>🏮 文言原句</h4>'+(s.classical?'<div class="cl"><div class="t">'+hl(s.classical.text)+'</div><div class="s">—— '+esc(s.classical.source)+'</div><div class="tr">译文：'+esc(s.classical.trans)+'</div></div>':'<div class="cl"><span class="cert c-待查">待查</span> 这个义项的文言用例暂未核实，宁缺不编。</div>')+'</div>';
  var el=$('detail');el.innerHTML=h;el.classList.add('on');el.style.borderTop='8px solid '+T.c;
  el.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){say(b.dataset.s)}});
  if(!noScroll)el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* 右侧栏 */
function drawRight(){
  var d=DATA[st.cur];
  $('right').innerHTML=
   '<div class="rc"><h3>🔍 偏旁拆分</h3>'+d.parts.map(function(p){return '<div class="part r-'+p.role+'"><div class="pg">'+esc(p.part)+'</div><div><div class="role">'+(p.role==='整字'?'整字（不拆）':p.role)+'</div><div class="pn">'+esc(p.note)+'</div></div></div>'}).join('')+'</div>'+
   '<div class="rc"><h3>⚠️ 易读错 · 易写错</h3><ul class="pit">'+d.pitfalls.read.map(function(t){return '<li class="rd"><b>读</b>'+esc(t)+'</li>'}).join('')+d.pitfalls.write.map(function(t){return '<li class="wr"><b>写</b>'+esc(t)+'</li>'}).join('')+'</ul></div>'+
   '<div class="rc"><h3>🔐 汉字密码</h3>'+d.code.map(function(c){return '<div class="code"><b>'+esc(c.t)+'</b><br>'+esc(c.d)+'</div>'}).join('')+'</div>';
}

function render(){
  drawTop();
  if(st.top!=='kz'){var t=TOP.filter(function(x){return x[0]===st.top})[0];$('wrap').classList.add('full');$('left').style.display='none';$('right').style.display='none';
    $('main').innerHTML='<div class="panel soonpage"><div class="big">🚧</div><h2>「'+t[1]+'」建设中</h2><p style="color:var(--muted)">先去「字义扩展图」看看 20 个字的义项网吧！</p><button class="btn" id="back">去字义扩展图 ➜</button></div>';
    $('back').onclick=function(){st.top='kz';render()};return}
  $('wrap').classList.remove('full');$('left').style.display='';$('right').style.display='';
  drawLeft();drawMain();drawRight();
}
render();
</script>
</body>
</html>
