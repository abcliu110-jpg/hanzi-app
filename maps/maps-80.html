<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · maps-80</title>
<style>
:root{
  --paper:#fbf7ef; --card:#ffffff; --ink:#2b2a27; --sub:#6f6a60; --line:#e9e1d1;
  --brand:#b5482f; --brand-soft:#f6e3dc; --gold:#c99a3b;
  --t-ben:#8a5a2b; --t-yin:#2f7d6d; --t-bi:#d07a2a; --t-zhuan:#7a5bb5; --t-jia:#c2456a;
  --ok:#2f7d4f; --mid:#b07a12; --todo:#b8423a;
  --r:16px; --shadow:0 6px 22px rgba(90,70,40,.08);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif CJK SC","Songti SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px}
button{font-family:inherit;cursor:pointer}
/* top */
.top{height:58px;display:flex;align-items:center;gap:22px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--kai);font-size:22px}
.brand small{font-weight:400;color:var(--sub);font-size:12px}
#nav{display:flex;gap:4px;overflow-x:auto}
#nav button{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--sub);font-size:14px;white-space:nowrap}
#nav button:hover{background:#f3ede1;color:var(--ink)}
#nav button.on{background:var(--brand);color:#fff;font-weight:600}
/* layout */
.app{display:grid;grid-template-columns:150px 1fr 360px;height:calc(100% - 58px)}
.left{border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px;background:#fffdf8}
.lt{font-size:12px;color:var(--sub);margin:0 6px 10px}
#chars{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#chars li button{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;transition:.15s}
#chars li button b{font-family:var(--kai);font-size:26px;line-height:1.1;font-weight:400}
#chars li button span{font-size:11px;color:var(--sub)}
#chars li button:hover{border-color:var(--gold)}
#chars li button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#chars li button.on span{color:#fde9e2}
.stage{display:flex;flex-direction:column;min-width:0;overflow:hidden}
/* origin */
.origin{margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:92px 1fr;gap:16px}
.bigc{width:92px;height:92px;border-radius:18px;background:linear-gradient(145deg,#fff6ec,#f7e6d3);border:1px solid #efd9bf;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigc b{font-family:var(--kai);font-size:52px;font-weight:400;line-height:1}
.bigc span{font-size:12px;color:var(--sub);margin-top:2px}
.oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oh h2{margin:0;font-size:17px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#f3ede1;color:var(--sub)}
.sw{margin:8px 0 6px;font-family:var(--kai);font-size:16px;line-height:1.6;background:#fbf4e6;border-left:3px solid var(--gold);padding:6px 10px;border-radius:6px}
.sw em{font-style:normal;font-family:var(--font);font-size:12px;color:var(--sub);margin-left:6px}
.xing{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.xing div{flex:1;min-width:120px;border:1px dashed #d9cbb2;border-radius:10px;padding:6px 8px;font-size:12px;color:var(--sub);background:#fffdf9}
.xing div b{display:block;color:var(--ink);font-size:12px;margin-bottom:2px}
.why{font-size:13px;line-height:1.65;color:#4a463f}
.why b{color:var(--brand)}
/* map */
.mapwrap{flex:1;position:relative;margin:12px 16px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-height:300px;
  background-image:radial-gradient(#efe6d6 1px,transparent 1px);background-size:22px 22px}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;color:var(--ink);box-shadow:var(--shadow)}
.zoom button:hover{border-color:var(--gold)}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);background:rgba(255,255,255,.9);padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.hint{position:absolute;left:12px;top:10px;font-size:12px;color:var(--sub)}
.node{cursor:pointer}
.node rect{transition:all .15s}
.node:hover rect.box{stroke-width:2.5}
.node.sel rect.box{stroke-width:3;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
/* right */
.right{border-left:1px solid var(--line);overflow-y:auto;background:#fffdf8;padding:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.panel h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--brand)}
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dh strong{font-size:17px}
.tp{color:#fff;font-size:11px;padding:2px 9px;border-radius:999px}
.lv{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid}
.lv.ok{color:var(--ok);border-color:#bcdcc6;background:#eef7f1}
.lv.mid{color:var(--mid);border-color:#ecd7a6;background:#fdf6e6}
.lv.todo{color:var(--todo);border-color:#efc1bc;background:#fdf0ee}
.row{margin:10px 0}
.row .k{font-size:12px;color:var(--sub);margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--brand-soft);color:#8e3420;border-radius:8px;padding:4px 10px;font-size:13px}
.box2{background:#faf6ee;border-radius:10px;padding:8px 10px;line-height:1.6}
.demo{font-size:10px;background:#e7e1d4;color:#5c574d;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.cl{font-family:var(--kai);font-size:15px}
.src{font-size:12px;color:var(--sub);margin-top:2px}
.tr{font-size:13px;color:#4a463f;margin-top:4px}
.pending{color:var(--todo);font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split div{border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
.split .y{background:#eef6f3;border:1px solid #cfe5dd}
.split .s{background:#f3effa;border:1px solid #ddd3ef}
.split b{display:block;font-size:11px;margin-bottom:3px}
.split .y b{color:var(--t-yin)} .split .s b{color:var(--t-zhuan)}
.how{font-size:12px;color:var(--sub);margin-top:6px}
.err{display:flex;gap:8px;margin:8px 0;font-size:13px;line-height:1.55}
.err i{font-style:normal;flex:none;font-size:11px;color:#fff;background:var(--todo);border-radius:6px;padding:2px 6px;height:fit-content;margin-top:1px}
.err i.w{background:var(--mid)}
.code li{margin:6px 0;line-height:1.55;font-size:13px}
.code{padding-left:18px;margin:0}
.foot{font-size:11px;color:var(--sub);line-height:1.6;padding:0 4px 10px}
/* placeholder */
.ph{position:absolute;inset:58px 0 0 0;background:var(--paper);display:none;align-items:center;justify-content:center;z-index:4}
.ph.show{display:flex}
.ph div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 40px;text-align:center;box-shadow:var(--shadow)}
.ph b{font-size:18px;display:block;margin-bottom:6px}
.ph span{color:var(--sub)}
@media (max-width:1100px){.app{grid-template-columns:130px 1fr 300px}}
</style>
</head>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const NAV=["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const TC={"本义":"#8a5a2b","引申":"#2f7d6d","比喻":"#d07a2a","转喻":"#7a5bb5","假借":"#c2456a"};
const LV={"确定":"ok","通行说法":"mid","待查":"todo"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, sel=0, view={x:0,y:0,k:1};

/* nav */
$('#nav').innerHTML=NAV.map((n,i)=>`<button class="${i?'':'on'}" data-i="${i}">${n}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  const i=+b.dataset.i; $('#ph').classList.toggle('show',i>0); $('#phT').textContent=NAV[i];};

/* left list */
$('#chars').innerHTML=D.chars.map((c,i)=>`<li><button data-i="${i}"><b>${c.c}</b><span>${c.py}</span></button></li>`).join('');
$('#chars').onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){pick((cur+1)%D.chars.length);e.preventDefault()}
  if(e.key==='ArrowUp'){pick((cur-1+D.chars.length)%D.chars.length);e.preventDefault()}});

$('#legend').innerHTML=Object.entries(TC).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('');
$('#foot').textContent=D.meta.note;

function lvTag(l){return `<span class="lv ${LV[l]||'todo'}">把握：${esc(l)}</span>`}

function pick(i){
  cur=i; sel=0; view={x:0,y:0,k:1};
  document.querySelectorAll('#chars button').forEach((b,j)=>b.classList.toggle('on',j===i));
  const ch=D.chars[i];
  const c=ch.cen;
  $('#origin').innerHTML=`
   <div class="bigc"><b>${ch.c}</b><span>${ch.py}${ch.fan?' · '+ch.fan:''}</span></div>
   <div>
     <div class="oh"><h2>本义：${esc(c.n)}</h2>${lvTag(c.lv)}<span class="tag">${esc(ch.bu)}</span></div>
     <div class="sw">“${esc(c.sw)}”<em>${esc(c.sws)}</em></div>
     <div class="xing">${c.xing.map(x=>{const [a,...b]=x.split('：');return `<div><b>${esc(a)}</b>${esc(b.join('：'))}</div>`}).join('')}</div>
     <div class="why"><b>判定理由：</b>${esc(c.why)}</div>
   </div>`;
  drawMap(); detail(); side();
  document.querySelector('#chars button.on')?.scrollIntoView({block:'nearest'});
}

/* map */
function wrap(t,n){const out=[];for(let i=0;i<t.length;i+=n)out.push(t.slice(i,i+n));return out}
function drawMap(){
  const ch=D.chars[cur], ss=ch.s, n=ss.length-1;
  const R=n>=5?270:250;
  let E='',L='',N='';
  ss.forEach((s,i)=>{ if(!i)return;
    const a=(-90+(i-1)*360/n+(n%2?0:360/n/2))*Math.PI/180;
    const x=Math.cos(a)*R*1.25, y=Math.sin(a)*R*0.95; s._x=x; s._y=y;
    const col=TC[s.t]||'#888';
    const qx=x*.5-y*.12, qy=y*.5+x*.06;
    E+=`<path d="M0 0 Q${qx} ${qy} ${x} ${y}" fill="none" stroke="${col}" stroke-width="2.4" stroke-dasharray="${s.t==='假借'?'6 5':'0'}" opacity=".85"/>`;
    // label at t=.5 of quad
    const lx=.25*0+.5*qx+.25*x, ly=.5*qy+.25*y;
    const lines=wrap(s.w,13).slice(0,3);
    const lw=13*12+16, lh=22+lines.length*15;
    L+=`<g transform="translate(${lx-lw/2},${ly-lh/2})" class="lab">
      <rect width="${lw}" height="${lh}" rx="9" fill="#fff" stroke="${col}" stroke-opacity=".35"/>
      <rect x="${lw/2-22}" y="-9" width="44" height="18" rx="9" fill="${col}"/>
      <text x="${lw/2}" y="4" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${s.t}</text>
      ${lines.map((t,k)=>`<text x="8" y="${24+k*15}" font-size="11.5" fill="#5a554c">${esc(t)}</text>`).join('')}
    </g>`;
    const w=Math.max(120,s.n.length*16+34);
    N+=`<g class="node" data-i="${i}" transform="translate(${x},${y})">
      <rect class="box" x="${-w/2}" y="-26" width="${w}" height="52" rx="14" fill="#fff" stroke="${col}" stroke-width="1.6"/>
      <rect x="${-w/2}" y="-26" width="6" height="52" rx="3" fill="${col}"/>
      <text y="-3" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2a27">${esc(s.n)}</text>
      <text y="16" text-anchor="middle" font-size="11" fill="#8a847a">${esc(s.wd.slice(0,2).join(' · '))}</text>
    </g>`;
  });
  const c=ss[0];
  N+=`<g class="node" data-i="0">
    <circle r="80" fill="url(#cg)" stroke="${TC['本义']}" stroke-width="2"/>
    <circle r="88" fill="none" stroke="${TC['本义']}" stroke-opacity=".25" stroke-dasharray="3 5"/>
    <text y="10" text-anchor="middle" font-size="62" fill="#5b3a1a" style="font-family:var(--kai)">${ch.c}</text>
    <rect class="box" x="-62" y="28" width="124" height="0" fill="none" stroke="${TC['本义']}"/>
    <text y="46" text-anchor="middle" font-size="12" fill="#8a5a2b" font-weight="600">本义 · ${esc(c.n.length>8?c.n.slice(0,8)+'…':c.n)}</text>
  </g>`;
  $('#vp').innerHTML=`<defs><radialGradient id="cg"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f6e2c8"/></radialGradient></defs>${E}${L}${N}`;
  markSel(); applyView();
}
function markSel(){document.querySelectorAll('#vp .node').forEach(g=>g.classList.toggle('sel',+g.dataset.i===sel))}
function fitScale(){const r=$('#map').getBoundingClientRect();return Math.min(r.width/860,r.height/720,1.3)}
function applyView(){const r=$('#map').getBoundingClientRect();const k=view.k*fitScale();
  $('#vp').setAttribute('transform',`translate(${r.width/2+view.x},${r.height/2+view.y}) scale(${k})`)}
window.addEventListener('resize',applyView);
const svg=$('#map');
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();
  const px=e.clientX-r.left-r.width/2-view.x, py=e.clientY-r.top-r.height/2-view.y;
  const f=Math.exp(-e.deltaY*0.0015), nk=Math.min(3,Math.max(.4,view.k*f)), rf=nk/view.k;
  view.x-=px*(rf-1); view.y-=py*(rf-1); view.k=nk; applyView();},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,m:false};});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){drag.m=true;svg.classList.add('drag')}
  if(drag.m){view.x=drag.vx+dx;view.y=drag.vy+dy;applyView()}});
window.addEventListener('pointerup',e=>{if(drag&&!drag.m){const g=e.target.closest&&e.target.closest('.node');
  if(g){sel=+g.dataset.i;markSel();detail()}} drag=null;svg.classList.remove('drag')});
document.querySelector('.zoom').onclick=e=>{const z=e.target.dataset.z;if(!z)return;
  if(z==='reset')view={x:0,y:0,k:1};else view.k=Math.min(3,Math.max(.4,view.k*(z==='in'?1.2:1/1.2)));applyView()};

/* detail */
function detail(){
  const ch=D.chars[cur], s=ch.s[sel], col=TC[s.t];
  const cl=s.cl?`<div class="box2"><div class="cl">${esc(s.cl.tx)}</div><div class="src">—— ${esc(s.cl.src)}</div><div class="tr">译：${esc(s.cl.tr)}</div></div>`
               :`<div class="box2 pending">待查：暂未核到可靠的文言用例，宁缺不编。</div>`;
  $('#detail').innerHTML=`<div class="panel">
    <h3>义项详情</h3>
    <div class="dh"><span class="tp" style="background:${col}">${s.t}</span><strong>${esc(s.n)}</strong>${lvTag(s.lv)}</div>
    <div class="why" style="font-size:13px">${sel?'<b style="color:'+col+'">为什么这样变：</b>':'<b>本义说明：</b>'}${esc(s.w)}</div>
    <div class="row"><div class="k">词族（3个）</div><div class="chips">${s.wd.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
    <div class="row"><div class="k">构词拆解</div><div class="box2">${esc(s.b)}</div></div>
    <div class="row"><div class="k">现代例句</div><div class="box2"><span class="demo">示例</span>${esc(s.m)}</div></div>
    <div class="row"><div class="k">文言原句 · 出处 · 译文</div>${cl}</div>
  </div>`;
}
function side(){
  const ch=D.chars[cur], p=ch.parts, e=ch.err;
  $('#side').innerHTML=`
  <div class="panel"><h3>偏旁拆分</h3>
    <div class="split"><div class="y"><b>表义部分</b>${esc(p.yi)}</div><div class="s"><b>表音部分</b>${esc(p.yin)}</div></div>
    <div class="how">结构：${esc(p.how)}</div></div>
  <div class="panel"><h3>易读错 · 易写错</h3>
    <div class="err"><i>读</i><span>${esc(e.du)}</span></div>
    <div class="err"><i class="w">写</i><span>${esc(e.xie)}</span></div></div>
  <div class="panel"><h3>汉字密码</h3><ul class="code">${ch.code.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
pick(0);
</script>
