<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 第89组</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2622; --ink2:#6b625a; --ink3:#a39a90;
  --line:#e6dccb; --accent:#c8553d; --accent2:#2f6f6a; --gold:#d9a441;
  --yin:#2a9d8f; --bi:#e9883a; --zhuan:#8a6bd1; --jia:#d6577a;
  --sure:#3b9a5a; --common:#3a78c2; --tbd:#9a9187;
  --radius:16px; --shadow:0 6px 22px rgba(80,60,30,.10);
  --serif:"Kaiti SC","STKaiti","KaiTi","BiauKai","Noto Serif SC","Songti SC","STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,rgba(150,120,80,.08) 1px,transparent 0);background-size:22px 22px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{display:grid;grid-template-rows:64px 1fr;height:100vh}
/* 顶部 */
.top{display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,30,.05);z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#e07a5f);color:#fff;font-family:var(--serif);font-size:24px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(200,85,61,.35)}
.brand b{font-size:16px;letter-spacing:1px}
.brand small{display:block;font-size:11px;color:var(--ink3);font-weight:400}
.nav1{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav1::-webkit-scrollbar{display:none}
.nav1 button{padding:9px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
.nav1 button:hover{background:#f3ebdd;color:var(--ink)}
.nav1 button.on{background:var(--ink);color:#fff;box-shadow:0 3px 10px rgba(43,38,34,.25)}
.nav1 button.off{opacity:.55}
.nav1 .sep{color:var(--line);align-self:center}
/* 主体 */
.main{display:grid;grid-template-columns:200px 1fr 380px;min-height:0}
.side{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h3{font-size:12px;color:var(--ink3);font-weight:500;padding:16px 16px 8px;letter-spacing:2px}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 14px 16px;overflow-y:auto}
.chars button{background:#faf6ee;border:1px solid var(--line);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;transition:.18s}
.chars button:hover{transform:translateY(-2px);border-color:var(--gold)}
.chars button .z{font-family:var(--serif);font-size:28px;line-height:1.1}
.chars button .p{font-size:11px;color:var(--ink3)}
.chars button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(200,85,61,.35)}
.chars button.on .p{color:#ffe3da}
.side .foot{margin-top:auto;padding:12px 16px;font-size:11px;color:var(--ink3);border-top:1px dashed var(--line);line-height:1.6}
/* 画布 */
.stage{position:relative;min-height:0;overflow:hidden}
.stage-head{position:absolute;left:20px;top:16px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.title-card{pointer-events:auto;background:rgba(255,253,248,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.title-card .big{font-family:var(--serif);font-size:40px;line-height:1;color:var(--accent)}
.title-card .meta{font-size:13px;color:var(--ink2);line-height:1.5}
.title-card .meta b{color:var(--ink);font-size:15px}
.legend{pointer-events:auto;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;font-size:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.legend .row{display:flex;gap:10px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:5px;color:var(--ink2)}
.lg i{width:18px;height:4px;border-radius:2px;display:inline-block}
.lg i.dash{background:repeating-linear-gradient(90deg,var(--jia) 0 4px,transparent 4px 7px)!important}
svg#map{width:100%;height:100%;cursor:grab;display:block}
svg#map:active{cursor:grabbing}
.tools{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:2}
.tools button{width:40px;height:40px;border-radius:12px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px;color:var(--ink2);transition:.15s}
.tools button:hover{color:var(--accent);border-color:var(--accent)}
.tools button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.hint{position:absolute;left:20px;bottom:20px;font-size:12px;color:var(--ink3);background:rgba(255,253,248,.85);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
/* SVG 元素 */
.node{cursor:pointer}
.node rect{transition:fill .2s,stroke .2s}
.node:hover rect{stroke:var(--gold);stroke-width:2.5}
.node.sel rect{stroke:var(--accent);stroke-width:3}
.node text{pointer-events:none;font-family:var(--sans)}
.cnode{cursor:pointer}
.cnode:hover circle.ring{stroke:var(--gold)}
.edge{fill:none;stroke-width:2.4;opacity:.85}
.elabel text{font-family:var(--sans);pointer-events:none}
.dim{opacity:.28}
/* 右栏 */
.panel{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:#fffefb;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:0 2px 8px rgba(80,60,30,.04)}
.card h4{font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h4::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
.sense-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sense-title .nm{font-size:20px;font-weight:600}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:2px 10px;border-radius:999px;color:#fff;font-weight:500;white-space:nowrap}
.cert{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;border:1.5px solid;font-weight:500}
.cert.sure{color:var(--sure);border-color:var(--sure);background:#eef8f1}
.cert.common{color:var(--common);border-color:var(--common);background:#eef4fb}
.cert.tbd{color:var(--tbd);border-color:var(--tbd);border-style:dashed;background:#f6f4f1}
.why{font-size:13.5px;color:var(--ink2);background:#faf5ea;border-radius:10px;padding:8px 12px;line-height:1.7}
.sec{margin-top:12px}
.sec .lab{font-size:12px;color:var(--ink3);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f3ece0;border-radius:8px;padding:4px 10px;font-size:14px}
.parse{font-size:14px;line-height:1.7}
.parse em{font-style:normal;color:var(--accent);font-weight:600}
.ex{font-size:14.5px;line-height:1.8;border-left:3px solid var(--gold);padding-left:10px}
.tag{font-size:11px;background:var(--gold);color:#fff;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.classic{background:linear-gradient(180deg,#fbf6ec,#f7efe0);border-radius:12px;padding:10px 12px}
.classic .t{font-family:var(--serif);font-size:18px;line-height:1.7}
.classic .s{font-size:12px;color:var(--accent2);margin-top:4px}
.classic .y{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.7}
.classic.empty .t{font-family:var(--sans);font-size:14px;color:var(--tbd)}
.sw{font-family:var(--serif);font-size:18px;line-height:1.8;background:#fbf6ec;border-radius:10px;padding:8px 12px}
.evo{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.evo .st{flex:0 0 96px;border:1px dashed #d8c9ae;border-radius:12px;padding:8px;text-align:center;background:#fffcf5}
.evo .ph{height:52px;border-radius:8px;background:repeating-linear-gradient(45deg,#f4ecdc 0 6px,#efe5d1 6px 12px);display:grid;place-items:center;font-size:11px;color:var(--ink3);margin-bottom:6px}
.evo .ph.k{background:none;font-family:var(--serif);font-size:36px;color:var(--ink)}
.evo b{font-size:12px;display:block}
.evo span{font-size:11px;color:var(--ink2);line-height:1.4;display:block;margin-top:2px}
.split{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 10px}
.split .whole{font-family:var(--serif);font-size:48px;color:var(--accent)}
.split .eq{color:var(--ink3);font-size:20px}
.part{text-align:center}
.part .g{font-family:var(--serif);font-size:34px;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:#f6efe2}
.part .r{font-size:11px;margin-top:4px;padding:1px 6px;border-radius:5px;color:#fff;display:inline-block}
.r.yi{background:var(--accent2)} .r.yin{background:var(--bi)} .r.ji{background:var(--ink3)}
.partnote{font-size:13px;color:var(--ink2);line-height:1.7}
.errs{display:flex;flex-direction:column;gap:8px}
.err{display:flex;gap:8px;font-size:13.5px;line-height:1.65}
.err .k{flex-shrink:0;font-size:12px;width:50px;text-align:center;border-radius:6px;padding:2px 0;height:fit-content;color:#fff}
.err .k.read{background:#d98b3a}.err .k.write{background:#c8553d}
.code{list-style:none;display:flex;flex-direction:column;gap:8px}
.code li{font-size:13.5px;line-height:1.65;padding:8px 10px 8px 34px;background:#f4f8f7;border-radius:10px;position:relative}
.code li::before{content:"🔑";position:absolute;left:10px;top:8px;font-size:13px}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){.main{grid-template-columns:150px 1fr 320px}.chars{grid-template-columns:1fr}}
</style>
</head>

  </header>
  <div class="main">
    <aside class="side">
      <h3>本组汉字 · 20</h3>

          </div>
          <div class="row" style="color:var(--ink3)">点义项看详情 · 滚轮缩放 · 拖动平移</div>
        </div>
      </div>
      <svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
      <div class="tools">
        <button id="zin" title="放大">＋</button>
        <button id="zout" title="缩小">－</button>
        <button id="zfit" title="适应窗口">⤢</button>
        <button id="zrea" class="on" title="显示/隐藏连线原因">💬</button>
      </div>
      <div class="hint">↑ ↓ 键切换汉字</div>
    </section>
    <aside class="panel" id="panel"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('hz-data').textContent).chars;
const TYPE = {"引申":"var(--yin)","比喻":"var(--bi)","转喻":"var(--zhuan)","假借":"var(--jia)"};
const TYPEHEX = {"引申":"#2a9d8f","比喻":"#e9883a","转喻":"#8a6bd1","假借":"#d6577a"};
const CERT = {"确定":"sure","通行说法":"common","待查":"tbd"};
const MENU = ["字义扩展图","偏旁部首","声旁音部","字词句","汉字密码","易错诊所","记忆复习","学习路径"];
const NS = "http://www.w3.org/2000/svg";
let cur = 0, sel = "c", showReason = true;
let view = {x:0,y:0,k:1};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 顶部菜单 */
const nav1 = $("nav1");
MENU.forEach((m,i)=>{
  if(i) { const s=document.createElement("span"); s.className="sep"; s.textContent="｜"; nav1.appendChild(s); }
  const b=document.createElement("button"); b.textContent=m;
  b.className = i===0 ? "on" : "off";
  b.onclick = ()=>{ if(i) toast("「"+m+"」模块即将上线"); };
  nav1.appendChild(b);
});
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1600); }

/* 左侧字表 */
const charsEl = $("chars");
DATA.forEach((d,i)=>{
  const b=document.createElement("button");
  b.innerHTML = '<span class="z">'+d.ch+'</span><span class="p">'+d.py+'</span>';
  b.onclick = ()=>select(i);
  charsEl.appendChild(b);
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); select((cur+1)%DATA.length); }
  if(e.key==="ArrowUp"){ e.preventDefault(); select((cur-1+DATA.length)%DATA.length); }
});

function select(i){
  cur=i; sel="c";
  [...charsEl.children].forEach((b,j)=>b.classList.toggle("on",j===i));
  charsEl.children[i].scrollIntoView({block:"nearest"});
  renderTitle(); renderMap(); fit(); renderPanel();
}

function renderTitle(){
  const d=DATA[cur];
  $("titleCard").innerHTML = '<div class="big">'+d.ch+'</div><div class="meta"><b>'+d.py+'</b>　繁体：'+d.trad+'<br>本义：'+esc(d.center.name)+' · 义项 '+d.senses.length+' 条</div>';
}

/* 布局 */
function layout(d){
  const nodes={c:{id:"c",name:d.center.name,children:[],depth:0}};
  d.senses.forEach(s=>nodes[s.id]=Object.assign({},s,{children:[]}));
  d.senses.forEach(s=>(nodes[s.p]||nodes.c).children.push(nodes[s.id]));
  (function dep(n,k){ n.depth=k; n.children.forEach(c=>dep(c,k+1)); })(nodes.c,0);
  (function lv(n){ n.leaves = n.children.length ? n.children.reduce((a,c)=>a+lv(c),0) : 1; return n.leaves; })(nodes.c);
  const R1=270, STEP=230, SX=1.35;
  (function place(n,a0,a1){
    const a=(a0+a1)/2;
    if(n.depth===0){ n.x=0; n.y=0; }
    else { const r=R1+(n.depth-1)*STEP; n.x=Math.cos(a)*r*SX; n.y=Math.sin(a)*r; }
    let s=a0;
    n.children.forEach(c=>{ const span=(a1-a0)*c.leaves/n.leaves; place(c,s,s+span); s+=span; });
  })(nodes.c, -Math.PI/2 - Math.PI/Math.max(nodes.c.leaves,1), 3*Math.PI/2 - Math.PI/Math.max(nodes.c.leaves,1));
  return nodes;
}
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function wrap(str,n){ const out=[]; let s=str; while(s.length){ out.push(s.slice(0,n)); s=s.slice(n);} return out; }
function textW(s,fs){ let w=0; for(const ch of s){ w += /[\x00-\xff]/.test(ch) ? fs*0.58 : fs; } return w; }

function renderMap(){
  const d=DATA[cur], nodes=layout(d), vp=$("vp");
  vp.innerHTML="";
  const gE=el("g",{},vp), gL=el("g",{},vp), gN=el("g",{},vp);
  const list=Object.values(nodes);
  // 选中链路
  const chain=new Set(); let p=nodes[sel]; while(p){ chain.add(p.id); p = p.id==="c"?null:(nodes[p.p]||nodes.c); }
  list.forEach(n=>{ if(n.id==="c") return;
    const par=nodes[n.p]||nodes.c, col=TYPEHEX[n.type]||"#999";
    const onChain = chain.has(n.id);
    el("path",{d:"M"+par.x+","+par.y+" L"+n.x+","+n.y, class:"edge"+(sel!=="c"&&!onChain?" dim":""), stroke:col, "stroke-dasharray": n.type==="假借"?"7 6":"none"},gE);
    // 箭头点
    const t=0.5, mx=par.x+(n.x-par.x)*t, my=par.y+(n.y-par.y)*t;
    const lab=el("g",{class:"elabel"+(sel!=="c"&&!onChain?" dim":""),transform:"translate("+mx+","+my+")"},gL);
    const lines = showReason ? wrap(n.why,11).slice(0,4) : [];
    const pw=44, lh=15, h = 22 + (lines.length? lines.length*lh+8 : 0);
    const w = Math.max(pw+12, ...lines.map(l=>textW(l,11.5)+16));
    el("rect",{x:-w/2,y:-11,width:w,height:h,rx:10,fill:"#fffdf8",stroke:col,"stroke-width":1.2,opacity:.96},lab);
    el("rect",{x:-pw/2,y:-8,width:pw,height:17,rx:8.5,fill:col},lab);
    const tt=el("text",{x:0,y:4.5,"text-anchor":"middle","font-size":11.5,fill:"#fff","font-weight":600},lab); tt.textContent=n.type;
    lines.forEach((l,i)=>{ const tx=el("text",{x:0,y:23+i*lh,"text-anchor":"middle","font-size":11.5,fill:"#5d554d"},lab); tx.textContent=l; });
  });
  list.forEach(n=>{
    if(n.id==="c"){
      const g=el("g",{class:"cnode",transform:"translate(0,0)"},gN);
      el("circle",{r:92,fill:"url(#cg)",opacity:.35},g);
      el("circle",{class:"ring",r:76,fill:"#fffdf8",stroke: sel==="c"?"#c8553d":"#d9a441","stroke-width":sel==="c"?4:3},g);
      el("circle",{r:68,fill:"none",stroke:"#efe2c8","stroke-width":1,"stroke-dasharray":"3 4"},g);
      const t=el("text",{y:8,"text-anchor":"middle","font-size":64,fill:"#c8553d","font-family":"Kaiti SC,STKaiti,KaiTi,serif"},g); t.textContent=d.ch;
      const nm=el("text",{y:40,"text-anchor":"middle","font-size":12.5,fill:"#6b625a"},g); nm.textContent="本义 · "+d.center.name;
      el("rect",{x:-26,y:-62,width:52,height:18,rx:9,fill:"#2b2622"},g);
      const bt=el("text",{y:-49,"text-anchor":"middle","font-size":11,fill:"#fff"},g); bt.textContent="本 义";
      g.addEventListener("click",ev=>{ev.stopPropagation(); sel="c"; renderMap(); renderPanel();});
      return;
    }
    const fs=15, w=Math.max(textW(n.name,fs)+34,80), h=42, col=TYPEHEX[n.type];
    const g=el("g",{class:"node"+(sel===n.id?" sel":"")+(sel!=="c"&&!chain.has(n.id)?" dim":""),transform:"translate("+n.x+","+n.y+")"},gN);
    el("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:14,fill: sel===n.id?"#fff4ee":"#fffefb",stroke:col,"stroke-width":1.8,filter:"url(#sh)"},g);
    el("circle",{cx:-w/2+13,cy:0,r:4.5,fill:col},g);
    const t=el("text",{x:7,y:5.5,"text-anchor":"middle","font-size":fs,fill:"#2b2622","font-weight":600},g); t.textContent=n.name;
    if(n.cert==="待查"){ el("rect",{x:w/2-26,y:-h/2-9,width:34,height:16,rx:8,fill:"#f6f4f1",stroke:"#9a9187","stroke-dasharray":"2 2"},g); const q=el("text",{x:w/2-9,y:-h/2+3,"text-anchor":"middle","font-size":10,fill:"#9a9187"},g); q.textContent="待查"; }
    g.addEventListener("click",ev=>{ev.stopPropagation(); sel=n.id; renderMap(); renderPanel();});
  });
  applyView();
}
/* defs */
(function(){
  const svg=$("map"); const defs=el("defs",{}); svg.insertBefore(defs,svg.firstChild);
  const rg=el("radialGradient",{id:"cg"},defs);
  el("stop",{offset:"0%","stop-color":"#f6c88a"},rg); el("stop",{offset:"100%","stop-color":"#f6c88a","stop-opacity":0},rg);
  const f=el("filter",{id:"sh",x:"-20%",y:"-30%",width:"140%",height:"170%"},defs);
  el("feDropShadow",{dx:0,dy:3,stdDeviation:3,"flood-color":"#7a5a2a","flood-opacity":.12},f);
})();

/* 缩放平移 */
const svg=$("map");
function applyView(){ $("vp").setAttribute("transform","translate("+view.x+","+view.y+") scale("+view.k+")"); }
function fit(){
  const r=svg.getBoundingClientRect(), b=$("vp").getBBox();
  const pad=60, top=90;
  const k=Math.min((r.width-pad*2)/b.width,(r.height-top-pad)/b.height,1.3);
  view.k=k; view.x=r.width/2-(b.x+b.width/2)*k; view.y=top+(r.height-top)/2-(b.y+b.height/2)*k; applyView();
}
function zoomAt(f,cx,cy){ const nk=Math.min(Math.max(view.k*f,.25),3.5); const ff=nk/view.k; view.x=cx-(cx-view.x)*ff; view.y=cy-(cy-view.y)*ff; view.k=nk; applyView(); }
svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; });
window.addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; view.x=drag.vx+dx; view.y=drag.vy+dy; applyView(); });
window.addEventListener("pointerup",()=>{ drag=null; });
const center=()=>{ const r=svg.getBoundingClientRect(); return [r.width/2,r.height/2]; };
$("zin").onclick=()=>zoomAt(1.25,...center());
$("zout").onclick=()=>zoomAt(0.8,...center());
$("zfit").onclick=fit;
$("zrea").onclick=function(){ showReason=!showReason; this.classList.toggle("on",showReason); renderMap(); };
window.addEventListener("resize",fit);

/* 右栏 */
function certTag(c){ return '<span class="cert '+(CERT[c]||"tbd")+'">'+(c==="待查"?"○ ":"● ")+c+'</span>'; }
function classic(cl){
  if(!cl) return '<div class="classic empty"><div class="t">文言原句：待查（暂未找到可靠出处，不作编造）</div></div>';
  return '<div class="classic"><div class="t">'+esc(cl.t)+'</div><div class="s">—— '+esc(cl.s)+'</div><div class="y">译文：'+esc(cl.y)+'</div></div>';
}
function detailBlock(s){
  return '<div class="sec"><div class="lab">词族</div><div class="chips">'+s.fam.map(f=>'<span class="chip">'+esc(f)+'</span>').join("")+'</div></div>'+
    '<div class="sec"><div class="lab">构词拆解</div><div class="parse">'+s.parse+'</div></div>'+
    '<div class="sec"><div class="lab">现代例句</div><div class="ex">'+esc(s.ex)+'<span class="tag">示例</span></div></div>'+
    '<div class="sec"><div class="lab">文言原句</div>'+classic(s.cl)+'</div>';
}
function renderPanel(){
  const d=DATA[cur]; let h="";
  if(sel==="c"){
    const c=d.center;
    h+='<div class="card"><h4>本义</h4><div class="sense-title"><span class="nm">'+esc(c.name)+'</span><span class="pill" style="background:#2b2622">本义</span>'+certTag(c.cert)+'</div>'+
      '<div class="sec"><div class="lab">《说文解字》原文</div><div class="sw">'+esc(c.sw)+'</div></div>'+
      '<div class="sec"><div class="lab">字形演变（字形图为占位）</div><div class="evo">'+
        c.evo.map(e=>'<div class="st"><div class="ph'+(e[0]==="楷书"||e[0]==="简化字"?" k":"")+'"'+(e[0]==="楷书"&&d.trad.length>1?' style="font-size:22px"':'')+'>'+(e[0]==="楷书"?esc(d.trad):e[0]==="简化字"?esc(d.ch):"字形图待补")+'</div><b>'+esc(e[0])+'</b><span>'+esc(e[1])+'</span></div>').join("")+
      '</div></div>'+
      '<div class="sec"><div class="lab">本义判定理由</div><div class="why">'+esc(c.why)+'</div></div>'+
      detailBlock(c)+'</div>';
  } else {
    const s=d.senses.find(x=>x.id===sel);
    const par = s.p==="c" ? "本义「"+d.center.name+"」" : "「"+d.senses.find(x=>x.id===s.p).name+"」";
    h+='<div class="card"><h4>义项详情</h4><div class="sense-title"><span class="nm">'+esc(s.name)+'</span><span class="pill" style="background:'+TYPE[s.type]+'">'+s.type+'</span>'+certTag(s.cert)+'</div>'+
      '<div class="why">从 '+esc(par)+' → 这里：'+esc(s.why)+'</div>'+detailBlock(s)+'</div>';
  }
  // 偏旁
  const roleCls={"表义":"yi","表音":"yin"};
  h+='<div class="card"><h4>偏旁拆分</h4><div class="split"><div class="whole">'+d.ch+'</div><div class="eq">＝</div>'+
    d.parts.map((p,i)=>(i?'<div class="eq">＋</div>':'')+'<div class="part"><div class="g">'+esc(p[0])+'</div><span class="r '+(roleCls[p[1]]||"ji")+'">'+esc(p[1])+'</span></div>').join("")+
    '</div><div class="partnote">'+d.parts.map(p=>'<b>'+esc(p[0])+'</b>：'+esc(p[2])).join("；")+'。<br>'+esc(d.partNote)+'</div></div>';
  h+='<div class="card"><h4>易读错 · 易写错</h4><div class="errs"><div class="err"><span class="k read">易读错</span><span>'+esc(d.errs.read)+'</span></div><div class="err"><span class="k write">易写错</span><span>'+esc(d.errs.write)+'</span></div></div></div>';
  h+='<div class="card"><h4>相关汉字密码</h4><ul class="code">'+d.code.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul></div>';
  const panel=$("panel"); panel.innerHTML=h; panel.scrollTop=0;
}
svg.addEventListener("click",()=>{ if(drag&&drag.moved) return; });
select(0);
})();
</script>
</body>
</html>
