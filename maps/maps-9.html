<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>字趣乐园 · 字义扩展图</title>
<style>
:root{
  --bg:#FFF9F0;--paper:#FFFFFF;--ink:#33302E;--soft:#7A716A;--line:#F1E6D6;
  --pri:#E8613C;--pri2:#FFB547;--teal:#2BA89A;--sky:#4A8FE7;
  --yin:#4A8FE7;--bi:#E35D9A;--zhuan:#F08A24;--jia:#8C8C8C;
  --r:22px;--sh:0 6px 0 #F1E2CC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:17px;line-height:1.6;min-height:100vh;
  background-image:radial-gradient(#F6E8D2 1.2px,transparent 1.2px);background-size:22px 22px}
.kai{font-family:"KaiTi","STKaiti","楷体","Kaiti SC","BiauKai",serif}
button{font-family:inherit;cursor:pointer;border:none}
.brand{display:flex;align-items:center;gap:12px;padding:14px 20px 6px;max-width:1360px;margin:0 auto}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:32px;display:grid;place-items:center;box-shadow:0 4px 0 #C94A28}
.brand h1{font-size:26px;letter-spacing:2px}
.brand small{display:block;font-size:14px;color:var(--soft);letter-spacing:0;font-weight:400}
.topnav{position:sticky;top:0;z-index:20;background:rgba(255,249,240,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.topnav .in{max-width:1360px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.topnav .in::-webkit-scrollbar{display:none}
.tn{flex:none;font-size:17px;font-weight:700;padding:10px 16px;border-radius:999px;background:transparent;color:var(--soft)}
.tn:hover{background:#FCEBD9}
.tn.on{background:var(--pri);color:#fff;box-shadow:0 4px 0 #C94A28}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 50px;display:grid;grid-template-columns:150px minmax(0,1fr) 320px;gap:20px}
/* 左侧选字 */
.side{position:sticky;top:76px;align-self:start;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:calc(100vh - 90px);overflow:auto;padding:2px 2px 8px}
.side h3{grid-column:1/-1}
.side h3{font-size:15px;color:var(--soft);padding-left:6px}
.sn{display:flex;flex-direction:column;align-items:center;gap:0;font-size:17px;font-weight:700;padding:6px 4px;border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:var(--sh);transition:.15s}
.sn .c{font-size:30px;line-height:1.1;text-align:center}
.sn .p{font-size:12px;color:var(--soft);font-weight:600;white-space:nowrap}
.sn:hover{transform:translateY(-2px)}
.sn.on{background:var(--teal);color:#fff;box-shadow:0 6px 0 #1E7F74}
.sn.on .p{color:#DDF5F1}
/* 中间 */
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;background:var(--paper);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh)}
.tian{font-size:96px;line-height:1;width:124px;height:124px;display:grid;place-items:center;border-radius:20px;border:3px dashed #F3C9A8;position:relative}
.tian:before,.tian:after{content:"";position:absolute;background:#F7DCC6}
.tian:before{left:50%;top:0;bottom:0;width:1.5px}.tian:after{top:50%;left:0;right:0;height:1.5px}
.tian span{position:relative;z-index:1}
.hmeta .py{font-size:26px;font-weight:900;color:var(--pri)}
.sw{margin-top:6px;background:#F6EEDF;border-radius:14px;padding:8px 12px;font-size:17px}
.sw b{color:#8A6A33}
.evo{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.evo div{flex:1;min-width:70px;text-align:center;border:2px dashed #E7D7BF;border-radius:12px;padding:6px 4px;font-size:13px;color:var(--soft);background:#FFFCF7}
.evo div b{display:block;font-size:15px;color:var(--ink)}
.reason{grid-column:1/-1;background:#FFF3C9;border-radius:14px;padding:10px 14px;border-left:6px solid var(--pri2);font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;color:#fff;vertical-align:2px;white-space:nowrap}
.b-确定{background:var(--teal)}.b-通行说法{background:var(--sky)}.b-待查{background:#E07B39}
/* 图 */
.mapcard{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);position:relative;overflow:hidden}
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg{font-size:13px;font-weight:800;color:#fff;border-radius:999px;padding:2px 10px}
.zoom{display:flex;gap:6px}
.zb{width:42px;height:42px;border-radius:12px;background:#FFF1E3;font-size:20px;font-weight:900;color:var(--ink)}
.zb:active{transform:translateY(2px)}
svg.map{width:100%;height:clamp(380px,62vh,640px);display:block;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 50%,#FFF8EC 0,#fff 70%)}
svg.map.drag{cursor:grabbing}
.node{cursor:pointer}
.node rect{stroke-width:4;transition:filter .15s}
.node:hover rect{filter:brightness(1.06) drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.node text{text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#33302E}
.edge{fill:none;stroke-width:5;stroke-linecap:round}
.edge.jia{stroke-dasharray:10 10}
.elab rect{fill:#fff;stroke-width:3}
.elab text{font-size:20px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--soft);background:rgba(255,255,255,.85);border-radius:999px;padding:2px 10px;pointer-events:none}
.edges{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px}
.edges h3{font-size:20px;margin-bottom:6px}
.erow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:16px}
.erow:last-child{border-bottom:none}
.erow .path{font-weight:800;white-space:nowrap}
.jbox{font-size:15px;color:var(--soft);margin-top:6px}
/* 右侧 */
.info{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:14px}
.ic{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.ic h3{font-size:18px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:10px;align-items:center;background:#FBF7F1;border-radius:14px;padding:8px 10px}
.part .g{font-size:36px;line-height:1;min-width:44px;text-align:center}
.part .r{font-size:12px;font-weight:800;color:#fff;border-radius:999px;padding:1px 8px;margin-right:4px}
.r-表义{background:var(--teal)}.r-表音{background:var(--sky)}.r-象形{background:var(--pri)}.r-会意{background:#8E6CDB}
.ic ul{padding-left:18px;font-size:15.5px}
.ic li{margin:4px 0}
.code{background:linear-gradient(135deg,#FFF1E3,#FFE8F0)}
.code .ex{font-size:24px;letter-spacing:4px;margin-top:4px}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(40,30,20,.38);display:none;z-index:50;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.pop{background:#fff;border-radius:28px 28px 0 0;padding:22px 22px 30px;width:100%;max-width:760px;max-height:88vh;overflow:auto;animation:up .28s;position:relative}
@media(min-width:900px){.mask{align-items:center}.pop{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;right:14px;top:12px;width:44px;height:44px;border-radius:50%;background:#F5EDE3;font-size:22px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:50px}
.ph .g{font-size:34px;font-weight:900}
.pyp{font-size:14px;font-weight:700;background:#FDEBDD;color:#B4482A;border-radius:999px;padding:1px 10px}
.blk{border-radius:16px;padding:10px 14px;margin-top:12px}
.blk .t{display:block;font-size:13px;font-weight:900;letter-spacing:1px;margin-bottom:4px;opacity:.75}
.why{background:#FFF3C9}
.wl{display:flex;flex-direction:column;gap:6px}
.w{display:flex;gap:10px;align-items:baseline;background:#FFF5EA;border-radius:12px;padding:6px 12px;flex-wrap:wrap}
.w b{font-size:24px;min-width:3.5em}
.w span{font-size:16px;color:var(--soft)}
.now{background:#EAF3FF}
.old{background:#F6EEDF;background-image:repeating-linear-gradient(0deg,transparent 0 31px,#EBDDC4 31px 32px)}
.sent{font-size:22px;line-height:1.7}
.sent em{font-style:normal;color:var(--pri);font-weight:900;background:linear-gradient(transparent 60%,#FFE1A8 60%)}
.src{font-size:15px;color:#8A6A33}
.tr{font-size:15.5px;color:var(--soft);border-top:1px dashed #D9C6A4;margin-top:4px;padding-top:4px}
.ex-tag{font-size:12px;font-weight:800;background:var(--sky);color:#fff;border-radius:6px;padding:0 6px;margin-left:4px}
.pend{color:#B4482A;font-weight:700}
.wip{text-align:center;padding:70px 20px;background:var(--paper);border-radius:28px;box-shadow:var(--sh)}
.wip .em{font-size:90px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.wip h2{font-size:32px;margin:8px 0}.wip p{color:var(--soft)}
footer{text-align:center;color:var(--soft);font-size:14px;padding:0 16px 30px}
@media(max-width:1100px){.wrap{grid-template-columns:130px minmax(0,1fr)}.info{grid-column:1/-1;position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media(max-width:720px){
  .wrap{grid-template-columns:1fr;gap:12px}
  .side{position:static;display:flex;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;scrollbar-width:none}
  .side h3{display:none}.side::-webkit-scrollbar{display:none}
  .sn{flex:none;padding:6px 10px}.sn .p{display:none}.sn .c{width:auto}
  .hero{grid-template-columns:1fr}.tian{margin:0 auto}
}
</style>
</head>

<div class="brand"><div class="logo kai">字</div><h1>字趣乐园<small>8–14 岁汉字学习</small></h1></div>
<nav class="topnav"><div class="in" id="topnav"></div></nav>

<div id="wipView" class="wrap" style="display:none;grid-template-columns:1fr">

</div>

<div id="mainView" class="wrap">
  <aside class="side"><h3>选一个字</h3><div id="charList" style="display:contents"></div></aside>
  <main>
    <div class="hero" id="hero"></div>
    <div class="mapcard">
      <div class="mapbar">
        <div class="legend"><span class="lg" style="background:var(--yin)">引申</span><span class="lg" style="background:var(--bi)">比喻</span><span class="lg" style="background:var(--zhuan)">转喻</span><span class="lg" style="background:var(--jia)">假借（虚线·只借读音）</span></div>
        <div class="zoom"><button class="zb" id="zin" aria-label="放大">＋</button><button class="zb" id="zout" aria-label="缩小">－</button><button class="zb" id="zreset" aria-label="复位">⟲</button></div>
      </div>
      <svg class="map" id="map"></svg>
      <div class="hint">滚轮/双指缩放 · 拖动平移 · 点圆框看详情</div>
    </div>
    <div class="edges" id="edges"></div>
  </main>
  <aside class="info" id="info"></aside>
</div>
<footer>《说文》引文请对照原书核对；“示例”为自编现代句；把握程度：确定／通行说法／待查。</footer>

var ptrs={},last=null,pinch=null,moved=false;
svg.addEventListener('pointerdown',function(e){ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=false;svg.classList.add('drag');
  var ids=Object.keys(ptrs);if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
svg.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId])return;var prev=ptrs[e.pointerId];ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===2&&pinch){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);var p=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(pinch/d,p.x,p.y);pinch=d;moved=true;return}
  var dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
  if(moved){if(!svg.hasPointerCapture(e.pointerId))svg.setPointerCapture(e.pointerId);var s=toSvg(0,0).s;VB.x-=dx*s;VB.y-=dy*s;setVB()}});
function up(e){delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch=null;if(!Object.keys(ptrs).length)svg.classList.remove('drag')}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
$('#zin').onclick=function(){zoomAt(1/1.25,VB.x+VB.w/2,VB.y+VB.h/2)};
$('#zout').onclick=function(){zoomAt(1.25,VB.x+VB.w/2,VB.y+VB.h/2)};
$('#zreset').onclick=function(){VB=Object.assign({},BASE);setVB()};

/* 文字宽度估算 */
function tw(s,fs){var w=0;for(var i=0;i<s.length;i++)w+=/[\x00-\xff]/.test(s[i])?fs*.55:fs;return w}

function render(i){
  cur=i;var d=D[i];
  $$('.sn').forEach(function(b,j){b.classList.toggle('on',j===i)});
  var root=d.senses.filter(function(s){return !s.parent})[0];

  /* 本义卡 */
  $('#hero').innerHTML='<div class="tian kai"><span>'+d.char+'</span></div><div class="hmeta"><div class="py">'+esc(d.pinyin)+'</div>'+
   '<div>本义：<b style="font-size:20px">'+esc(root.gloss)+'</b> '+badge(d.rootCertainty)+'</div>'+
   '<div class="sw kai"><b>《说文》</b>'+esc(d.shuowen)+(d.shuowenNote?' <span class="badge b-待查">'+esc(d.shuowenNote)+'</span>':'')+'</div>'+
   '<div class="evo">'+['甲骨文','金文','小篆','楷书'].map(function(t,k){return '<div><b>'+t+'</b>'+(k===3?'<span class="kai" style="font-size:24px;color:var(--ink)">'+d.char+'</span>':'字形图待补')+'</div>'}).join('')+'</div></div>'+
   '<div class="reason">🔎 <b>为什么这是本义：</b>'+esc(d.rootReason)+'</div>';

  /* 布局 */
  var inMap=d.senses,kids=function(id){return inMap.filter(function(s){return s.parent===id})};
  var pos={};pos[root.id]={x:0,y:0,lv:0};
  var L1=kids(root.id),n=L1.length,RR=[0,300,580,820];
  function place(s,a,lv,span){pos[s.id]={x:RR[lv]*Math.cos(a),y:RR[lv]*Math.sin(a)*0.82,lv:lv};
    var g=kids(s.id),m=g.length,sp=Math.min(0.6,span*0.6);
    g.forEach(function(t,j){place(t,a+(m===1?0:(-sp/2+sp*j/(m-1))),Math.min(lv+1,3),sp/Math.max(m,1))});}
  L1.forEach(function(s,k){var a=(-90+k*360/n)*Math.PI/180;if(n===2)a=(k===0?180:0)*Math.PI/180;place(s,a,1,2*Math.PI/n)});
  var es='',ls='',ns='',rows='';
  inMap.forEach(function(s){if(!s.parent||!pos[s.parent])return;var p=pos[s.parent],q=pos[s.id],c=COL[s.type];
    es+='<line class="edge'+(s.type==='假借'?' jia':'')+'" x1="'+p.x+'" y1="'+p.y+'" x2="'+q.x+'" y2="'+q.y+'" stroke="'+c+'"/>';
    var mx=(p.x+q.x)/2,my=(p.y+q.y)/2,w=tw(s.type,20)+28;
    ls+='<g class="elab"><rect x="'+(mx-w/2)+'" y="'+(my-17)+'" width="'+w+'" height="34" rx="17" stroke="'+c+'"/><text x="'+mx+'" y="'+my+'" fill="'+c+'">'+s.type+'</text></g>';
    var pa=d.senses.filter(function(x){return x.id===s.parent})[0];
    rows+='<div class="erow"><span class="lg" style="background:'+c+'">'+s.type+'</span><span class="path kai">'+esc(pa.gloss)+' → '+esc(s.gloss)+'</span><span>'+esc(s.reason)+'</span></div>';
  });
  inMap.forEach(function(s,k){var p=pos[s.id];if(!p)return;var isR=s===root,fs=isR?40:30,w=Math.max(tw(s.gloss,fs)+48,isR?190:140),h=isR?118:88;
    var fill=isR?'#FFE7B3':(s.type==='比喻'?'#FDE7F1':s.type==='转喻'?'#FFEBD8':s.type==='假借'?'#F0F0F0':'#E7F0FF'),st=isR?'#E0A800':COL[s.type];
    ns+='<g class="node" data-id="'+s.id+'"><rect x="'+(p.x-w/2)+'" y="'+(p.y-h/2)+'" width="'+w+'" height="'+h+'" rx="'+(h/2)+'" fill="'+fill+'" stroke="'+st+'"/>'+
      (isR?'<text x="'+p.x+'" y="'+(p.y-22)+'" style="font-size:22px;font-weight:800;fill:#B07800">本义</text>':'')+
      '<text x="'+p.x+'" y="'+(p.y+(isR?14:(s.py?-8:0)))+'" style="font-size:'+fs+'px;font-weight:800">'+esc(s.gloss)+'</text>'+
      (s.py&&!isR?'<text x="'+p.x+'" y="'+(p.y+22)+'" style="font-size:17px;font-weight:700;fill:#B4482A">'+s.py+'</text>':'')+
      (isR&&s.py?'<text x="'+p.x+'" y="'+(p.y+44)+'" style="font-size:17px;font-weight:700;fill:#B4482A">'+s.py+'</text>':'')+'</g>';
  });
  svg.innerHTML=es+ls+ns;
  /* 视口适配 */
  var xs=[],ys=[];inMap.forEach(function(s){var p=pos[s.id];if(p){xs.push(p.x);ys.push(p.y)}});
  var minx=Math.min.apply(0,xs)-180,maxx=Math.max.apply(0,xs)+180,miny=Math.min.apply(0,ys)-110,maxy=Math.max.apply(0,ys)+110;
  BASE={x:minx,y:miny,w:maxx-minx,h:maxy-miny};VB=Object.assign({},BASE);setVB();
  $$('#map .node').forEach(function(g){g.addEventListener('click',function(){if(!moved)openSense(g.dataset.id)})});

  var jj=d.senses.filter(function(s){return s.type==='假借'});
  $('#edges').innerHTML='<h3>🔗 连线说明：意思是怎么变的</h3>'+rows+'<div class="jbox">📦 假借：'+(jj.length?'虚线表示只借了读音，「'+jj.map(function(s){return esc(s.gloss)}).join('、')+'」和本义没有意思上的联系。':'这个字的常用义里暂无公认的假借义。')+'</div>';

  /* 右侧 */
  $('#info').innerHTML=
   '<div class="ic"><h3>🧩 偏旁拆分</h3><div class="parts">'+d.parts.map(function(p){return '<div class="part"><span class="g kai">'+esc(p.p)+'</span><div><span class="r r-'+p.role+'">'+p.role+'</span>'+esc(p.note)+'</div></div>'}).join('')+'</div></div>'+
   '<div class="ic"><h3>🗣️ 易读错</h3><ul>'+d.misread.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+
   '<div class="ic"><h3>✍️ 易写错</h3><ul>'+d.miswrite.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+
   '<div class="ic code"><h3>🔐 汉字密码</h3><div>'+esc(d.code.rule)+'</div><div class="ex kai">'+esc(d.code.ex)+'</div></div>';
}

/* 义项详情 */
function openSense(id){
  var d=D[cur],s=d.senses.filter(function(x){return x.id===id})[0];if(!s)return;
  var pa=s.parent?d.senses.filter(function(x){return x.id===s.parent})[0]:null;
  var h='<button class="x" id="px">✕</button><div class="ph"><span class="g kai">'+d.char+' · '+esc(s.gloss)+'</span>'+(s.py?'<span class="pyp">'+s.py+'</span>':'')+
    (s.type?'<span class="lg" style="background:'+COL[s.type]+'">'+s.type+'</span>':'<span class="lg" style="background:#E0A800">本义</span>')+badge(s.certainty)+'</div>';
  h+='<div class="blk why"><span class="t">💡 '+(pa?'从「'+esc(pa.gloss)+'」变来的原因':'为什么是本义')+'</span>'+esc(pa?s.reason:d.rootReason)+'</div>';
  h+='<div class="blk" style="padding:10px 0 0"><span class="t">📚 词族 · 构词拆解</span><div class="wl">'+s.words.map(function(w){return '<div class="w"><b class="kai">'+esc(w.w)+'</b><span>'+esc(w.s)+'</span></div>'}).join('')+'</div></div>';
  h+='<div class="blk now"><span class="t">🏙️ 现代例句 <span class="ex-tag">示例</span></span><div class="sent kai">'+mark(s.modern,d.char)+'</div></div>';
  h+='<div class="blk old"><span class="t">📜 文言原句</span>'+(s.classical?'<div class="sent kai">'+mark(s.classical.text,d.char)+'</div><div class="src">—— '+esc(s.classical.src)+'</div><div class="tr">译文：'+esc(s.classical.trans)+'</div>':'<div class="pend">文言例句待查</div><div class="tr">暂未找到可靠出处，宁缺勿编。</div>')+'</div>';
  h+='<div class="blk" style="background:#F4F4F6"><span class="t">🎯 把握程度</span>'+badge(s.certainty)+' <span style="font-size:15px;color:var(--soft)">'+({"确定":"辞书通行、证据充分","通行说法":"多数资料这样讲，理据仍可讨论","待查":"需要进一步核对"}[s.certainty])+'</span></div>';
  $('#pop').innerHTML=h;$('#mask').classList.add('show');$('#px').onclick=closePop;
}
function closePop(){$('#mask').classList.remove('show')}
$('#mask').onclick=function(e){if(e.target===this)closePop()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop()});
window.addEventListener('resize',function(){setVB()});
render(0);
</script>
<script src="../xzq-back.js" data-home="../index.html"></script>
</body>
</html>
