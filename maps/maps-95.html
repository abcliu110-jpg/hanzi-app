<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#f7f3ea; --paper:#fffdf8; --ink:#2b2a33; --ink2:#6b6875; --line:#e6dfcf;
  --brand:#d9573b; --brand2:#f2a541; --soft:#fbefe2;
  --yin:#3f7fd9; --bi:#ee8a2a; --zhuan:#2f9e6e; --jia:#8a5cd1;
  --ok:#2f9e6e; --tong:#d99a1e; --dai:#c4493f;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,20,.05);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-style:normal;font-family:var(--serif);font-size:20px}
nav.top{display:flex;gap:4px;overflow-x:auto}
nav.top button{border:0;background:none;padding:8px 14px;border-radius:999px;font:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav.top button:hover{background:var(--soft)}
nav.top button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 3px 8px rgba(217,87,59,.3)}
nav.top button.off{opacity:.55}
.main{display:grid;grid-template-columns:120px 1fr 380px;min-height:0}
aside.left{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px}
aside.left h4{margin:4px 6px 10px;font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:.1em}
.clist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.clist button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 0 4px;cursor:pointer;font:inherit;transition:.15s}
.clist button b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1;color:var(--ink)}
.clist button span{font-size:10px;color:var(--ink2)}
.clist button:hover{border-color:var(--brand2);transform:translateY(-1px)}
.clist button.on{background:var(--brand);border-color:var(--brand)}
.clist button.on b,.clist button.on span{color:#fff}
section.stage{position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,#fffaf0 0,#f7f3ea 70%);}
section.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#e5dccb 1px,transparent 1px);background-size:22px 22px;opacity:.6;pointer-events:none}
svg#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.stage-head{position:absolute;left:18px;top:14px;z-index:2;pointer-events:none}
.stage-head h2{margin:0;font-family:var(--serif);font-size:26px}
.stage-head p{margin:2px 0 0;color:var(--ink2);font-size:12px}
.tools{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.tools button:hover{border-color:var(--brand2)}
.legend{position:absolute;left:18px;bottom:14px;display:flex;gap:12px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;z-index:2}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.hint{position:absolute;right:16px;bottom:14px;font-size:11px;color:var(--ink2);z-index:2}
aside.right{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(80,60,20,.04)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.card h5{margin:12px 0 6px;font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.05em}
.card p{margin:4px 0;line-height:1.7}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:18px;white-space:nowrap}
.tag.fill{color:#fff!important;border:0}
.cert-确定{color:var(--ok)} .cert-通行说法{color:var(--tong)} .cert-待查{color:var(--dai)}
.quote{font-family:var(--serif);background:var(--soft);border-left:3px solid var(--brand2);padding:8px 12px;border-radius:0 10px 10px 0;line-height:1.8;font-size:15px}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
.trans{font-size:13px;color:#4b4855;margin-top:4px}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:#f3f6fd;color:#2e5ea8;border-radius:8px;padding:3px 10px;font-size:13px}
.evo{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.evo div{text-align:center}
.evo .g{width:46px;height:46px;border:1.5px dashed #cfc4ad;border-radius:10px;display:grid;place-items:center;font-size:10px;color:#a79c86;background:#fffaf0}
.evo .n{font-size:11px;color:var(--ink2);margin-top:3px}
.evo .ar{color:#c8bda6;font-size:12px}
.split{display:flex;gap:8px}
.split > div{flex:1;border-radius:12px;padding:10px;text-align:center}
.split .f{background:#eef6f1}
.split .s{background:#f4effc}
.split b{display:block;font-family:var(--serif);font-size:26px}
.split small{display:block;font-size:11px;color:var(--ink2)}
.split em{font-style:normal;font-size:12px;display:block;margin-top:4px;line-height:1.5}
.warn{display:flex;gap:8px;align-items:flex-start;margin:6px 0;line-height:1.6}
.warn i{font-style:normal;flex:none;font-size:11px;padding:1px 6px;border-radius:6px;color:#fff;margin-top:2px}
.code{background:linear-gradient(135deg,#fff6e8,#fdeee6);border-radius:12px;padding:10px 12px;line-height:1.7}
.ex{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.small{font-size:12px;color:var(--ink2)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:.92}
/* svg */
.edge{fill:none;stroke-width:2.5}
.node{cursor:pointer}
.node rect{transition:.15s}
.node:hover rect.box{filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.node.sel rect.box{stroke-width:3}
.ctr{cursor:pointer}
@media (max-width:1100px){.main{grid-template-columns:100px 1fr 320px}}
</style>
</head>

<header>
  <div class="logo"><i>字</i>汉字探险家</div>

    <div class="hint">滚轮缩放 · 拖动平移</div>

</div>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TC = D.types;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
let cur = 0, sel = -1, view = {x:0,y:0,k:1};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function certTag(c){return `<span class="tag cert-${c}">把握：${c}</span>`}
function wrap(s,n){const a=[];for(let i=0;i<s.length;i+=n)a.push(s.slice(i,i+n));return a}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}

// top menu
D.menu.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;b.className=i?'off':'on';
  b.onclick=()=>{if(i)toast(`「${m}」模块即将上线`)};$('#topnav').appendChild(b)});
// legend
$('#legend').innerHTML=Object.entries(TC).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('');
// char list
D.chars.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${c.char}</b><span>${c.py.split(' ')[0]}</span>`;
  b.onclick=()=>select(i);$('#clist').appendChild(b)});

function select(i){cur=i;sel=-1;
  document.querySelectorAll('.clist button').forEach((b,j)=>b.classList.toggle('on',j===i));
  const c=D.chars[i];$('#sh').innerHTML=`${c.char} <span style="font-size:15px;color:var(--ink2);font-family:var(--sans)">${c.py} · 字义扩展图</span>`;
  draw();fit();renderSide();}

function draw(){
  const c=D.chars[cur], vp=$('#vp'); vp.innerHTML='';
  const n=c.senses.length, R=310, CR=88;
  const gE=el('g',{},vp), gL=el('g',{},vp), gN=el('g',{},vp);
  c.senses.forEach((s,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, x=Math.cos(a)*R, y=Math.sin(a)*R, col=TC[s.type];
    // curved edge
    const mx=Math.cos(a+0.12)*R*0.5, my=Math.sin(a+0.12)*R*0.5;
    el('path',{d:`M${Math.cos(a)*CR},${Math.sin(a)*CR} Q${mx},${my} ${x-Math.cos(a)*70},${y-Math.sin(a)*30}`,class:'edge',stroke:col,'stroke-dasharray':s.type==='假借'?'7 6':'none',opacity:.85},gE);
    // edge label
    const lx=Math.cos(a+0.1)*R*0.56, ly=Math.sin(a+0.1)*R*0.56;
    const lines=wrap(s.why,11), w=150, h=26+lines.length*15;
    const g=el('g',{transform:`translate(${lx-w/2},${ly-h/2})`},gL);
    el('rect',{width:w,height:h,rx:10,fill:'#fffdf8',stroke:col,'stroke-opacity':.35},g);
    el('rect',{x:8,y:6,width:40,height:16,rx:8,fill:col},g);
    const t=el('text',{x:28,y:18,'text-anchor':'middle','font-size':11,fill:'#fff','font-weight':600},g);t.textContent=s.type;
    lines.forEach((ln,j)=>{const tt=el('text',{x:8,y:38+j*15,'font-size':11,fill:'#5a5763'},g);tt.textContent=ln});
    // node
    const nw=168, nl=wrap(s.name,10), nh=34+nl.length*17;
    const ng=el('g',{class:'node'+(sel===i?' sel':''),transform:`translate(${x-nw/2},${y-nh/2})`},gN);
    el('rect',{class:'box',width:nw,height:nh,rx:16,fill:'#fff',stroke:col,'stroke-width':sel===i?3:1.5,filter:'url(#sh)'},ng);
    el('rect',{width:6,height:nh-20,x:0,y:10,rx:3,fill:col},ng);
    nl.forEach((ln,j)=>{const tt=el('text',{x:nw/2,y:24+j*17,'text-anchor':'middle','font-size':14,'font-weight':600,fill:'#2b2a33'},ng);tt.textContent=ln});
    const ct={'确定':'#2f9e6e','通行说法':'#d99a1e','待查':'#c4493f'}[s.cert];
    const wt=el('text',{x:nw/2,y:nh-10,'text-anchor':'middle','font-size':11,fill:'#8a8794'},ng);
    wt.textContent=s.words.slice(0,3).join(' · ');
    el('circle',{cx:nw-12,cy:12,r:4,fill:ct},ng);
    ng.addEventListener('click',e=>{e.stopPropagation();sel=i;draw();renderSide()});
  });
  // center
  const cg=el('g',{class:'ctr'},gN);
  el('circle',{r:CR+14,fill:'#fbe3d6',opacity:.7},cg);
  el('circle',{r:CR,fill:'url(#cg)',filter:'url(#sh)',stroke:sel===-1?'#fff':'none','stroke-width':4},cg);
  const ch=el('text',{y:-6,'text-anchor':'middle','font-size':62,fill:'#fff','font-family':'Songti SC,STSong,Noto Serif SC,serif'},cg);ch.textContent=c.char;
  const lab=el('text',{y:24,'text-anchor':'middle','font-size':11,fill:'#ffe9dc','letter-spacing':2},cg);lab.textContent='本 义';
  wrap(c.center.meaning,9).slice(0,2).forEach((ln,j)=>{const t=el('text',{y:42+j*15,'text-anchor':'middle','font-size':12,fill:'#fff','font-weight':600},cg);t.textContent=ln});
  cg.addEventListener('click',e=>{e.stopPropagation();sel=-1;draw();renderSide()});
}

function renderSide(){
  const c=D.chars[cur], s=c.side; let h='';
  if(sel===-1){
    const k=c.center;
    h+=`<div class="card"><h3><span class="dot"></span>本义 · ${esc(k.meaning)} ${certTag(k.cert)}</h3>
      <h5>《说文解字》原文</h5><div class="quote">${esc(k.shuowen)}</div>
      <h5>字形演变</h5><div class="evo">${k.evo.map((e,i)=>`${i?'<span class="ar">→</span>':''}<div><div class="g">字形<br>占位</div><div class="n">${esc(e)}</div></div>`).join('')}</div>
      <p class="small">字形图待接入字形库；各阶段字形是否存在，以字形库核对为准。</p>
      <h5>为什么说这是本义</h5><p>${esc(k.reason)}</p>
      ${k.classical?`<h5>文言用例</h5><div class="quote">${esc(k.classical.text)}</div><div class="src">—— ${esc(k.classical.src)}</div><div class="trans">译：${esc(k.classical.trans)}</div>`:''}
      <p class="small" style="margin-top:10px">👉 点击外圈义项卡片，看词族、例句和文言原句。</p></div>`;
  } else {
    const v=c.senses[sel], col=TC[v.type];
    h+=`<div class="card" style="border-color:${col}55"><h3><span class="dot" style="background:${col}"></span>${esc(v.name)}</h3>
      <p><span class="tag fill" style="background:${col}">${v.type}</span> ${certTag(v.cert)}</p>
      <p class="small">本义 → ${esc(v.name)}：${esc(v.why)}</p>
      <h5>词族</h5><div class="words">${v.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div>
      <h5>构词拆解</h5><p>${esc(v.split)}</p>
      <h5>现代例句 <span class="tag" style="color:#8a8794">示例</span></h5><p>${esc(v.modern.replace(/（示例）$/,''))}</p>
      <h5>文言原句</h5>${v.classical?`<div class="quote">${esc(v.classical.text)}</div><div class="src">—— ${esc(v.classical.src)}</div><div class="trans">译：${esc(v.classical.trans)}</div>`
        :`<p><span class="tag cert-待查">待查</span> <span class="small">暂未找到可靠的文言出处，不编造。</span></p>`}
      <div class="ex small"><a href="#" id="back" style="color:var(--brand)">← 回到本义</a></div></div>`;
  }
  h+=`<div class="card"><h3><span class="dot" style="background:var(--zhuan)"></span>偏旁拆分 <span class="small">${esc(s.struct)}</span></h3>
    <div class="split"><div class="f"><small>表义部分</small><b>${esc(s.form[0])}</b><em>${esc(s.form[1])}</em></div>
    <div class="s"><small>表音部分</small><b>${esc(s.sound[0])}</b><em>${esc(s.sound[1])}</em></div></div></div>
  <div class="card"><h3><span class="dot" style="background:var(--dai)"></span>易错诊所</h3>
    <div class="warn"><i style="background:#3f7fd9">读</i><span>${esc(s.misread)}</span></div>
    <div class="warn"><i style="background:#c4493f">写</i><span>${esc(s.miswrite)}</span></div></div>
  <div class="card"><h3><span class="dot" style="background:var(--brand2)"></span>汉字密码</h3><div class="code">🔑 ${esc(s.code)}</div></div>`;
  $('#side').innerHTML=h;
  const b=$('#back'); if(b) b.onclick=e=>{e.preventDefault();sel=-1;draw();renderSide()};
}

// zoom & pan
const svg=$('#map');
function apply(){$('#vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`)}
function fit(){const r=svg.getBoundingClientRect();const k=Math.min(r.width,r.height)/820;view={x:r.width/2,y:r.height/2+10,k:Math.max(.45,Math.min(k,1.2))};apply()}
function zoomAt(f,px,py){const k=Math.max(.3,Math.min(3,view.k*f));const r=k/view.k;view.x=px-(px-view.x)*r;view.y=py-(py-view.y)*r;view.k=k;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.ctr'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;apply()});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag')});
const mid=()=>{const r=svg.getBoundingClientRect();return[r.width/2,r.height/2]};
$('#zin').onclick=()=>zoomAt(1.2,...mid());$('#zout').onclick=()=>zoomAt(1/1.2,...mid());$('#zfit').onclick=fit;
window.addEventListener('resize',fit);
select(0);
</script>
</body>
</html>
