<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字义扩展图 · 汉字学习</title>
<style>
:root{
  --bg:#FAF6EE; --paper:#FFFFFF; --ink:#2B2A33; --ink2:#5E5B6B; --ink3:#9A96A6; --line:#ECE5D8;
  --brand:#E2583E; --brand-soft:#FDECE7;
  --yin:#2A9D8F; --yin-soft:#E3F4F1;     /* 引申 */
  --bi:#E9962F;  --bi-soft:#FDF1E0;      /* 比喻 */
  --zhuan:#8B6BC8; --zhuan-soft:#F0EAFA; /* 转喻 */
  --jia:#4F7CB8; --jia-soft:#E6EEF8;     /* 假借 */
  --ok:#2E9E5B; --ok-soft:#E3F5EA; --mid:#C98A12; --mid-soft:#FBF1D9; --tbd:#D2483A; --tbd-soft:#FBE6E3;
  --r:18px; --shadow:0 6px 24px rgba(80,60,30,.08);
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
  background-image:radial-gradient(circle at 1px 1px,rgba(160,130,90,.10) 1px,transparent 0);background-size:22px 22px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
/* ---------- top nav ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px 24px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-family:var(--serif);font-size:20px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:.2s}
.nav button:hover{background:#F5EFE4}
.nav button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(226,88,62,.3)}
.nav button.off{opacity:.62}
/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:200px minmax(0,1fr) 310px;gap:18px;padding:18px 24px 28px;max-width:1680px;margin:0 auto}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.side-l{padding:14px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.side-l h3,.panel h3{font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.08em;margin-bottom:10px}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chars button{display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;border-radius:14px;border:1.5px solid var(--line);background:#FFFCF7;transition:.18s}
.chars button b{font-family:var(--serif);font-size:26px;line-height:1.1;font-weight:600}
.chars button span{font-size:11px;color:var(--ink3)}
.chars button:hover{border-color:#E8C9B8;transform:translateY(-1px)}
.chars button.on{background:var(--brand-soft);border-color:var(--brand)}
.chars button.on b{color:var(--brand)}
.mid{display:flex;flex-direction:column;gap:18px;min-width:0}
/* head strip */
.head{display:flex;gap:18px;padding:18px 20px;align-items:stretch}
.big{width:104px;min-width:104px;height:104px;border-radius:22px;background:linear-gradient(145deg,#FFF3EA,#FDE3D8);display:grid;place-items:center;
  font-family:var(--serif);font-size:68px;color:var(--brand);border:2px solid #F6CDBE;position:relative}
.big small{position:absolute;bottom:-10px;font-family:var(--sans);font-size:12px;background:#fff;border:1px solid #F6CDBE;color:var(--brand);border-radius:999px;padding:0 10px}
.headinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.headinfo .py{font-size:22px;font-weight:600}
.headinfo .py em{font-style:normal;font-size:13px;color:var(--ink3);margin-left:10px;font-weight:400}
.sw{font-family:var(--kai);font-size:16px;background:#FBF7EF;border-left:4px solid #D9B98C;padding:6px 12px;border-radius:0 10px 10px 0}
.sw b{font-family:var(--sans);font-size:12px;color:#A07D4C;margin-right:6px;font-weight:600}
.evo{display:flex;gap:6px;flex-wrap:wrap}
.evo div{flex:1;min-width:112px;background:#FAFAFC;border:1px dashed #D9D5E2;border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink2)}
.evo div b{display:block;font-size:11px;color:var(--ink3);font-weight:600}
/* map */
.mapcard{position:relative;overflow:hidden}
.maptools{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:2}
.maptools>*{pointer-events:auto}
.legend{display:flex;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);padding:0 4px}
.legend i{width:10px;height:10px;border-radius:50%}
.zoom{display:flex;gap:4px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:4px}
.zoom button{min-width:32px;height:28px;border-radius:999px;font-size:15px;color:var(--ink2);padding:0 8px}
.zoom button:hover{background:#F3EDE2}
.zoom button.tog{font-size:12px}
.zoom button.tog.on{background:var(--ink);color:#fff}
svg#map{display:block;width:100%;height:560px;cursor:grab;touch-action:none;user-select:none}
svg#map.drag{cursor:grabbing}
.node{cursor:pointer}
.node circle{transition:r .2s,stroke-width .2s}
.node:hover circle.ring{stroke-width:4}
.node.sel circle.ring{stroke-width:5}
.node text{pointer-events:none;font-family:var(--sans)}
.hint{position:absolute;bottom:10px;right:14px;font-size:12px;color:var(--ink3);background:rgba(255,255,255,.85);padding:2px 10px;border-radius:999px}
/* detail */
.detail{padding:20px 22px}
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dtop h2{font-size:22px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.t-本义{background:var(--brand-soft);color:var(--brand)}
.t-引申{background:var(--yin-soft);color:var(--yin)}
.t-比喻{background:var(--bi-soft);color:#C27412}
.t-转喻{background:var(--zhuan-soft);color:var(--zhuan)}
.t-假借{background:var(--jia-soft);color:var(--jia)}
.s-确定{background:var(--ok-soft);color:var(--ok)}
.s-通行说法{background:var(--mid-soft);color:var(--mid)}
.s-待查{background:var(--tbd-soft);color:var(--tbd)}
.demo{background:#EEF0F4;color:#6B7280}
.def{font-size:15px;color:var(--ink2);margin-bottom:14px}
.why{display:flex;gap:8px;align-items:flex-start;background:#FBF8F2;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.why::before{content:"💡";}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#FFFDF9}
.box h4{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words span{font-family:var(--serif);font-size:17px;padding:4px 12px;border-radius:10px;background:#FFF4EC;border:1px solid #F7D8C6}
.brk{font-size:14px}
.ex{font-size:15px}
.cls{font-family:var(--kai);font-size:17px;line-height:1.7}
.cls cite{display:block;font-family:var(--sans);font-style:normal;font-size:12px;color:var(--ink3);margin:2px 0 6px}
.cls p{font-family:var(--sans);font-size:13px;color:var(--ink2)}
.full{grid-column:1/-1}
.tbd-note{color:var(--tbd);font-size:13px}
.origin{background:linear-gradient(135deg,#FFF6F0,#FFFDF9);border:1px solid #F6D5C8}
/* right panel */
.side-r{display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.panel{padding:16px}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:#FCFAF6;border:1px solid var(--line)}
.part .pc{font-family:var(--serif);font-size:18px;font-weight:600;min-width:0;flex:1}
.part .pc small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink2);font-weight:400;line-height:1.5;margin-top:2px}
.r-表义{background:#E3F4F1;color:#1F7F73}
.r-表音{background:#E6EEF8;color:#3F6BA6}
.struct{font-size:12px;color:var(--ink3);margin-top:8px}
.err h5{font-size:13px;margin:4px 0 6px;display:flex;align-items:center;gap:6px}
.err ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.err li{font-size:13px;padding:7px 10px 7px 26px;border-radius:10px;background:#FFF7F5;position:relative}
.err li::before{content:"!";position:absolute;left:9px;top:7px;font-weight:700;color:var(--tbd)}
.err ul.w li{background:#FFF9EC}
.err ul.w li::before{content:"✎";color:var(--mid);font-weight:400}
.code{display:flex;flex-direction:column;gap:10px}
.rule{border-radius:12px;padding:10px 12px;background:linear-gradient(135deg,#F2EEFB,#FBF9FE);border:1px solid #E3DAF5}
.rule b{font-size:14px;color:#5E46A0}
.rule .ex2{font-family:var(--serif);font-size:15px;margin:4px 0}
.rule small{font-size:12px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:1180px){
  .wrap{grid-template-columns:180px minmax(0,1fr)}
  .side-r{grid-column:1/-1;position:static;max-height:none;display:grid;grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;padding:12px}
  .side-l{position:static;max-height:none}
  .chars{grid-template-columns:repeat(5,1fr)}
  .side-r{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  svg#map{height:440px}
  .head{flex-direction:column}
}
</style>
</head>

const SOFT  = {"本义":"#FDECE7","引申":"#E3F4F1","比喻":"#FDF1E0","转喻":"#F0EAFA","假借":"#E6EEF8"};
const VB0 = {x:-560,y:-400,w:1120,h:800};
const st = {ci:0, sel:"s0", vb:{...VB0}, showWhy:true};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---- nav ---- */
$('nav').innerHTML = MENU.map((m,i)=>`<button class="${i===0?'on':'off'}" data-i="${i}">${m}</button>`).join('');
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(+b.dataset.i!==0)toast(`「${b.textContent}」模块在独立页面中，本页只展示字义扩展图`);});

/* ---- char list ---- */
function renderList(){
  $('chars').innerHTML = DATA.chars.map((c,i)=>`<button class="${i===st.ci?'on':''}" data-i="${i}" title="${esc(c.char)} ${esc(c.py)}"><b>${esc(c.char)}</b><span>${esc(c.py.split(/[ （(]/)[0])}</span></button>`).join('');
}
$('chars').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;select(+b.dataset.i);});

function select(i){st.ci=i;st.sel="s0";st.vb={...VB0};renderList();renderAll();}

const tagS = s => `<span class="tag s-${esc(s)}">${s==='确定'?'✔':s==='待查'?'？':'≈'} ${esc(s)}</span>`;
const tagT = t => `<span class="tag t-${esc(t)}">${esc(t)}</span>`;

/* ---- head ---- */
function renderHead(c){
  $('head').innerHTML = `
    <div class="big">${esc(c.char)}<small>${c.trad!==c.char?'繁 '+esc(c.trad):'正体'}</small></div>
    <div class="headinfo">
      <div class="py">${esc(c.py)}<em>本义：${esc(c.origin.meaning)}</em></div>
      <div class="sw"><b>《说文》</b>${esc(c.sw[0])} ${tagS(c.sw[1])}</div>
      <div class="evo">${c.evo.map(e=>`<div><b>${esc(e[0])}</b>${esc(e[1])}</div>`).join('')}</div>
    </div>`;
}

/* ---- layout ---- */
function layout(senses){
  const pos = {}; const kids = {};
  senses.forEach(s=>{ if(s.parent){(kids[s.parent]=kids[s.parent]||[]).push(s);} });
  pos.s0 = {x:0,y:0,lv:0};
  const l1 = kids.s0||[]; const n=l1.length;
  const start = -Math.PI/2 + (n%2===0? Math.PI/n/2 : 0);
  l1.forEach((s,i)=>{
    const a = start + i*2*Math.PI/n;
    const hasK = (kids[s.id]||[]).length>0;
    const r = hasK ? 200 : 235;
    pos[s.id] = {x:Math.cos(a)*r, y:Math.sin(a)*r*0.86, a, lv:1};
  });
  l1.forEach(s=>{
    const k = kids[s.id]||[]; const p=pos[s.id];
    const spread = k.length>1 ? Math.min(0.95, 2.2/n) : 0;
    k.forEach((c,j)=>{
      const a = p.a + (k.length>1 ? -spread/2 + spread*j/(k.length-1) : 0);
      const r = 400;
      pos[c.id] = {x:Math.cos(a)*r, y:Math.sin(a)*r*0.84, a, lv:2};
    });
  });
  /* 兜底：根节点不叫 s0 或层级更深时，补上位置，避免报错 */
  let rest = senses.filter(s=>!pos[s.id]);
  for(let guard=0; rest.length && guard<6; guard++){
    rest.forEach(s=>{ const p=s.parent&&pos[s.parent]; if(!s.parent){pos[s.id]={x:0,y:0,lv:0};} else if(p){const a=(p.a||0)+0.25,r=Math.hypot(p.x,p.y)+170; pos[s.id]={x:Math.cos(a)*r,y:Math.sin(a)*r*0.84,a,lv:(p.lv||0)+1};} });
    rest = senses.filter(s=>!pos[s.id]);
  }
  rest.forEach((s,i)=>{ pos[s.id]={x:-300+i*120,y:460,a:Math.PI/2,lv:3}; });
  return pos;
}

function el(tag, attrs, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function splitLabel(t){ if(t.length<=3) return [t]; const h=Math.ceil(t.length/2); return [t.slice(0,h),t.slice(h)]; }
function wrap(t,n){const out=[];for(let i=0;i<t.length;i+=n)out.push(t.slice(i,i+n));return out;}

/* ---- map ---- */
function renderMap(c){
  const svg=$('map'); svg.innerHTML='';
  const defs=el('defs',{},svg);
  const f=el('filter',{id:'sh',x:'-30%',y:'-30%',width:'160%',height:'160%'},defs);
  el('feDropShadow',{dx:0,dy:4,stdDeviation:6,'flood-color':'#7a5a30','flood-opacity':.16},f);
  const pos=layout(c.senses);
  const gE=el('g',{},svg), gL=el('g',{},svg), gN=el('g',{},svg);
  // orbit rings
  [215,400].forEach(r=>el('ellipse',{cx:0,cy:0,rx:r,ry:r*0.85,fill:'none',stroke:'#EADFCD','stroke-dasharray':'4 8'},gE));
  const byId={}; c.senses.forEach(s=>byId[s.id]=s);
  c.senses.forEach(s=>{
    if(!s.parent) return;
    const a=pos[s.parent], b=pos[s.id], col=COLOR[s.type]||'#999';
    if(!a||!b) return; // 第三层义项没有布局位置时跳过连线（原来会报错）
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    const ra = a.lv===0?70:48, rb=48;
    const x1=a.x+ux*ra, y1=a.y+uy*ra, x2=b.x-ux*rb, y2=b.y-uy*rb;
    el('line',{x1,y1,x2,y2,stroke:col,'stroke-width':2.5,'stroke-linecap':'round','stroke-dasharray':s.type==='假借'?'7 6':'none',opacity:.85},gE);
    // arrow
    const ah=10, ax=x2, ay=y2;
    el('path',{d:`M${ax},${ay} L${ax-ux*ah-uy*ah*0.55},${ay-uy*ah+ux*ah*0.55} L${ax-ux*ah+uy*ah*0.55},${ay-uy*ah-ux*ah*0.55}Z`,fill:col},gE);
    // label chip
    const t=0.5, mx=x1+(x2-x1)*t, my=y1+(y2-y1)*t;
    const g=el('g',{transform:`translate(${mx},${my})`,class:'elab',style:'cursor:pointer'},gL);
    g.addEventListener('click',()=>{st.sel=s.id;renderDetail(c);markSel();});
    el('rect',{x:-22,y:-11,width:44,height:22,rx:11,fill:'#fff',stroke:col,'stroke-width':1.5},g);
    const tt=el('text',{x:0,y:4.5,'text-anchor':'middle','font-size':12,'font-weight':700,fill:col},g); tt.textContent=s.type;
    if(st.showWhy && s.why){
      const lines=wrap(s.why,9);
      const w=Math.max(...lines.map(l=>l.length))*12+14, h=lines.length*15+8;
      el('rect',{x:-w/2,y:15,width:w,height:h,rx:8,fill:'rgba(255,253,248,.95)',stroke:'#EFE6D6'},g);
      lines.forEach((l,i)=>{const tx=el('text',{x:0,y:29+i*15,'text-anchor':'middle','font-size':11.5,fill:'#5E5B6B'},g);tx.textContent=l;});
    }
  });
  c.senses.forEach(s=>{
    const p=pos[s.id], isRoot=!s.parent, col=COLOR[s.type], soft=SOFT[s.type];
    const g=el('g',{class:'node','data-id':s.id,transform:`translate(${p.x},${p.y})`,tabindex:0},gN);
    const R=isRoot?68:46;
    el('circle',{r:R,fill:soft,filter:'url(#sh)'},g);
    el('circle',{class:'ring',r:R,fill:'none',stroke:col,'stroke-width':isRoot?3:2.5},g);
    if(isRoot){
      const t1=el('text',{x:0,y:8,'text-anchor':'middle','font-size':54,'font-weight':600,fill:col,style:'font-family:var(--serif)'},g);t1.textContent=c.char;
      const t2=el('text',{x:0,y:36,'text-anchor':'middle','font-size':12,fill:'#9A5A48'},g);t2.textContent='本义 · '+s.label;
      el('rect',{x:-24,y:-56,width:48,height:20,rx:10,fill:col},g);
      const t3=el('text',{x:0,y:-42,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#fff'},g);t3.textContent='中心';
    } else {
      const ls=splitLabel(s.label);
      ls.forEach((l,i)=>{const t=el('text',{x:0,y:(ls.length===1?6:-3+i*19),'text-anchor':'middle','font-size':16,'font-weight':600,fill:'#2B2A33'},g);t.textContent=l;});
      const dotc = s.status==='确定'?'#2E9E5B':s.status==='待查'?'#D2483A':'#C98A12';
      el('circle',{cx:32,cy:-32,r:6,fill:dotc,stroke:'#fff','stroke-width':2},g);
    }
    g.addEventListener('click',ev=>{ev.stopPropagation();st.sel=s.id;renderDetail(c);markSel();});
    g.addEventListener('keydown',ev=>{if(ev.key==='Enter'){st.sel=s.id;renderDetail(c);markSel();}});
  });
  markSel(); applyVB();
}
function markSel(){document.querySelectorAll('#map .node').forEach(n=>n.classList.toggle('sel',n.dataset.id===st.sel));}
function applyVB(){const v=st.vb;$('map').setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);}

/* ---- zoom & pan ---- */
(function(){
  const svg=$('map');
  function pt(e){const r=svg.getBoundingClientRect();const v=st.vb;
    const s=Math.max(v.w/r.width,v.h/r.height); const ox=(r.width*s-v.w)/2, oy=(r.height*s-v.h)/2;
    return {x:v.x-ox+(e.clientX-r.left)*s, y:v.y-oy+(e.clientY-r.top)*s, s};}
  function zoom(f,cx,cy){const v=st.vb;const nw=Math.min(3200,Math.max(280,v.w*f));const k=nw/v.w;
    if(cx===undefined){cx=v.x+v.w/2;cy=v.y+v.h/2;}
    st.vb={x:cx-(cx-v.x)*k,y:cy-(cy-v.y)*k,w:nw,h:v.h*k};applyVB();}
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e);zoom(e.deltaY>0?1.12:1/1.12,p.x,p.y);},{passive:false});
  let drag=null;
  svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.target.closest('.elab'))return;drag={x:e.clientX,y:e.clientY,vb:{...st.vb},s:pt(e).s};svg.setPointerCapture(e.pointerId);svg.classList.add('drag');});
  svg.addEventListener('pointermove',e=>{if(!drag)return;st.vb={...drag.vb,x:drag.vb.x-(e.clientX-drag.x)*drag.s,y:drag.vb.y-(e.clientY-drag.y)*drag.s};applyVB();});
  const end=()=>{drag=null;svg.classList.remove('drag');};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  $('zin').onclick=()=>zoom(1/1.25);$('zout').onclick=()=>zoom(1.25);$('zreset').onclick=()=>{st.vb={...VB0};applyVB();};
  $('togWhy').onclick=()=>{st.showWhy=!st.showWhy;$('togWhy').classList.toggle('on',st.showWhy);renderMap(DATA.chars[st.ci]);};
})();

/* ---- detail ---- */
function renderDetail(c){
  const s=c.senses.find(x=>x.id===st.sel)||c.senses[0];
  const isRoot=!s.parent;
  const parent=s.parent?c.senses.find(x=>x.id===s.parent):null;
  const cls=s.classical;
  let h=`<div class="dtop"><h2>${esc(c.char)} · ${esc(s.label)}</h2>${tagT(s.type)}<span style="font-size:12px;color:var(--ink3)">把握程度</span>${tagS(s.status)}</div>`;
  h+=`<div class="def">${esc(s.def)}</div>`;
  if(isRoot){
    h+=`<div class="box origin full" style="margin-bottom:12px"><h4>本义判定理由 ${tagS(c.origin.status)}</h4><div>${esc(c.origin.reason)}</div>
        <div style="margin-top:8px;font-family:var(--kai);font-size:16px">《说文》：${esc(c.sw[0])} ${tagS(c.sw[1])}</div>
        ${c.sw[2]?`<div style="font-size:12px;color:var(--ink2);margin-top:4px">注：${esc(c.sw[2])}</div>`:''}</div>`;
  } else {
    h+=`<div class="why"><div><b>${esc(parent.label)}</b> → <b>${esc(s.label)}</b>（${esc(s.type)}）：${esc(s.why)}</div></div>`;
  }
  h+=`<div class="grid2">
    <div class="box"><h4>🌱 词族</h4><div class="words">${s.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
    <div class="box"><h4>🧩 构词拆解</h4><div class="brk">${esc(s.breakdown)}</div></div>
    <div class="box full"><h4>📝 现代例句 <span class="tag demo">示例</span></h4><div class="ex">${esc(s.modern)}</div></div>
    <div class="box full"><h4>📜 文言原句 ${cls?tagS(cls.status):tagS('待查')}</h4>${cls?`<div class="cls">${esc(cls.text)}<cite>—— ${esc(cls.src)}</cite><p>译文：${esc(cls.trans)}</p></div>`:`<div class="tbd-note">暂未找到可靠的文言原句，标为“待查”，不作编造。</div>`}</div>
  </div>`;
  $('detail').innerHTML=h;
}

/* ---- side ---- */
function renderSide(c){
  $('pParts').innerHTML=`<h3>偏旁拆分</h3><div class="parts">${c.parts.map(p=>`<div class="part"><span class="tag r-${esc(p.role)}">${esc(p.role)}</span><div class="pc">${esc(p.part)}<small>${esc(p.note)}</small></div></div>`).join('')}</div><div class="struct">结构：${esc(c.struct)}</div>`;
  $('pErr').innerHTML=`<h3>易错提醒</h3><h5>🔊 易读错</h5><ul>${c.read.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h5>✏️ 易写错</h5><ul class="w">${c.write.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  $('pCode').innerHTML=`<h3>相关汉字密码</h3><div class="code">${c.code.map(r=>`<div class="rule"><b>🔑 ${esc(r[0])}</b><div class="ex2">${esc(r[1])}</div><small>${esc(r[2])}</small></div>`).join('')}</div>`;
}

function renderAll(){const c=DATA.chars[st.ci];renderHead(c);renderMap(c);renderDetail(c);renderSide(c);}
renderList();renderAll();
})();
</script>
