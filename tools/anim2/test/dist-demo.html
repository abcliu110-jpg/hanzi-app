<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>xzq-anim2 dist 演示</title>
<style>body{margin:0;background:#ECE9E3;display:flex;justify-content:center;padding:20px}.wrap{width:min(1120px,100%)}</style></head>
<body><div class="wrap"><div id="player"></div></div>
<!-- 从仓库根目录起服务：python3 -m http.server 8000 → http://localhost:8000/tools/anim2/test/dist-demo.html?zi=人 -->
<script src="../../../dist/anim2/xzq-anim2.js"></script>
<script>
var zi=new URLSearchParams(location.search).get('zi')||'人';
XZQAnim.mount(document.getElementById('player'),zi,{base:'../../../anim/'}).then(function(p){window.XZQ=p;window.XZQ_READY=true})
.catch(function(e){console.error(e);window.XZQ_ERROR=String(e)});
</script></body></html>
