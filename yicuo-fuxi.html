<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>识字星球 · 易错诊所 & 记忆复习</title>
<style>
:root{
  --bg:#FFF8EE;--ink:#2B2A4C;--muted:#7A7896;--card:#FFFFFF;--line:#F0E6D6;
  --red:#E8505B;--red-soft:#FFE8E9;--orange:#F59E3A;--orange-soft:#FFF0DC;
  --green:#22A98F;--green-soft:#DDF5EF;--blue:#4C7DF0;--blue-soft:#E4ECFF;
  --purple:#8B6CEF;--purple-soft:#EEE8FF;
  --kai:"STKaiti","KaiTi","Kaiti SC","KaiTi_GB2312","楷体",serif;
  --shadow:0 6px 0 rgba(43,42,76,.06),0 10px 30px rgba(43,42,76,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);
  background:var(--bg);
  background-image:radial-gradient(circle at 8% -5%,#FFE3C6 0,transparent 38%),radial-gradient(circle at 105% 18%,#D9F3EC 0,transparent 32%),radial-gradient(circle at 50% 120%,#E9E3FF 0,transparent 40%);
  background-attachment:fixed;min-height:100vh;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
header{padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#FF8A5C,#F7B733);display:grid;place-items:center;color:#fff;font-family:var(--kai);font-size:28px;font-weight:700;box-shadow:0 4px 0 #D9772F}
.brand h1{margin:0;font-size:22px;letter-spacing:1px}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:400;letter-spacing:0}

/* top nav */
.topnav{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav button{flex:0 0 auto;border:2px solid transparent;background:rgba(255,255,255,.7);color:var(--muted);padding:9px 16px;border-radius:999px;font-size:15px;font-weight:600;transition:.2s}
.topnav button:hover{color:var(--ink);background:#fff}
.topnav button.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #15142E}
.topnav button.live:not(.on)::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:6px;vertical-align:middle}

/* hero */
.hero{border-radius:26px;padding:24px 26px;margin:6px 0 16px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero.clinic{background:linear-gradient(120deg,#EE5D6C,#F78F5B)}
.hero.review{background:linear-gradient(120deg,#1FA58C,#4CC3A6)}
.hero h2{margin:0 0 4px;font-size:26px}
.hero p{margin:0;opacity:.92;max-width:640px;font-size:15px}
.hero .big{position:absolute;right:22px;top:-18px;font-family:var(--kai);font-size:150px;opacity:.16;line-height:1}
.hero .chips{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hero .chip{background:rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}

/* sub nav */
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.subnav button{border:2px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:14px;font-size:15px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:6px}
.subnav button:hover{transform:translateY(-1px)}
.subnav button .n{background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:0 7px;line-height:18px}
.clinicT .subnav button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 0 #C23B46}
.reviewT .subnav button.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 0 #17836F}
.subnav button.on .n{background:#fff;color:var(--red)}

/* bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.bar .t{font-weight:700;font-size:17px}
.bar .d{color:var(--muted);font-size:14px}
.btn{border:none;border-radius:14px;padding:10px 18px;font-size:15px;font-weight:700;color:#fff;background:var(--ink);box-shadow:0 4px 0 #15142E;transition:.12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #15142E}
.btn.red{background:var(--red);box-shadow:0 4px 0 #C23B46}
.btn.green{background:var(--green);box-shadow:0 4px 0 #17836F}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 #C97A22}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}

/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);position:relative}
.card .add{position:absolute;right:12px;top:12px;border:none;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.card .add.done{background:#eee;color:#999}
.hz{font-family:var(--kai);font-size:54px;line-height:1.1;font-weight:700}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:none}
.py{display:inline-block;min-width:54px;text-align:center;font-weight:700;border-radius:10px;padding:2px 8px;font-size:15px;font-family:"Segoe UI","PingFang SC",sans-serif}
.py.c0{background:var(--blue-soft);color:var(--blue)}.py.c1{background:var(--orange-soft);color:#C46F0E}.py.c2{background:var(--purple-soft);color:var(--purple)}.py.c3{background:var(--green-soft);color:var(--green)}
.mean{font-size:14px;color:var(--muted)}
.ex{font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px;margin-right:4px}
.tip{background:#FFFAF0;border:1.5px solid #F7E3BF;border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
.tip b{color:#B5651D}
.chars{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.chars .one{text-align:center}
.chars .one .hz{font-size:48px}
.chars .one .p{font-size:13px;color:var(--muted);font-weight:700}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.exs span{background:#F6F3FF;border-radius:10px;padding:3px 10px;font-size:14px}
.exs span em{font-style:normal;color:var(--red);font-weight:700}
.dot{font-weight:800;color:var(--red);-webkit-text-emphasis:dot;text-emphasis:dot;-webkit-text-emphasis-position:under;text-emphasis-position:under right}
.wrongpy{color:var(--red);text-decoration:line-through;font-weight:700}
.okpy{color:var(--green);font-weight:800;font-size:20px}
.strokes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.strokes span{background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:2px 8px;font-size:13px;font-weight:600}
.strokes span i{font-style:normal;opacity:.6;margin-right:3px}

/* empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e{font-size:54px}

/* wrong list */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px;color:var(--ink)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.witem{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.witem .q{flex:1;font-size:15px}
.witem .meta{font-size:12px;color:var(--muted)}
.witem .ans{font-size:14px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(30,28,60,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.mask.show{display:flex}
.modal{background:#fff;border-radius:26px;width:min(560px,100%);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mhead .x{border:none;background:#F3F0EA;border-radius:50%;width:34px;height:34px;font-size:18px}
.prog{height:10px;background:#F3EFE7;border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#F7A440,#E8505B);border-radius:99px;transition:width .3s}
.qtext{font-size:22px;margin:4px 0 18px;line-height:1.7}
.qtext u{display:inline-block;min-width:2em;border-bottom:3px solid var(--ink);text-decoration:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.opt{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:12px;font-size:22px;font-weight:700;transition:.12s;color:var(--ink)}
.opt.hzopt{font-family:var(--kai);font-size:34px}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.fb{margin-top:16px;border-radius:14px;padding:12px 14px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green-soft)}
.fb.no{background:var(--red-soft)}
.mfoot{display:flex;justify-content:flex-end;margin-top:16px}
.result{text-align:center}
.result .stars{font-size:44px;letter-spacing:6px}
.result .score{font-size:46px;font-weight:800}

/* flashcard */
.flash{max-width:560px;margin:0 auto}
.fc{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:30px 24px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center}
.fc .front{font-size:28px;line-height:1.6}
.fc .front .hz{font-size:72px}
.fc .back{margin-top:16px;padding-top:16px;border-top:2px dashed var(--line);font-size:16px;text-align:left;display:none}
.fc.open .back{display:block}
.stages{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.stages span{width:44px;text-align:center;font-size:12px;font-weight:700;border-radius:10px;padding:3px 0;background:#F1EEE8;color:#A9A5B8}
.stages span.done{background:var(--green);color:#fff}
.stages span.cur{background:var(--orange);color:#fff}
.fcbtns{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* plan */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px}
.stat span{color:var(--muted);font-size:13px}
.days{display:grid;grid-template-columns:repeat(16,1fr);gap:6px;align-items:end;height:150px;padding:10px 0}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.day i{display:block;width:100%;max-width:30px;background:linear-gradient(180deg,#4CC3A6,#1FA58C);border-radius:8px 8px 4px 4px;min-height:4px}
.day i.today{background:linear-gradient(180deg,#F7A440,#E8505B)}
.day b{color:var(--ink);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}

.section-title{font-size:17px;font-weight:800;margin:22px 0 10px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.contrast{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.contrast .side{border-radius:14px;padding:12px}
.contrast .side.a{background:var(--blue-soft)}
.contrast .side.b{background:var(--orange-soft)}
.contrast .side .r{font-family:var(--kai);font-size:40px;font-weight:700;line-height:1.1}
.contrast .side .m{font-size:13px;font-weight:700;margin:2px 0 6px}
.contrast .side .w{font-family:var(--kai);font-size:22px;letter-spacing:4px}
.fam .root{display:flex;align-items:center;gap:12px}
.fam .root .hz{width:70px;height:70px;border-radius:18px;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;font-size:46px}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
.mem div{background:#FAF8F4;border-radius:12px;padding:6px;text-align:center}
.mem div .hz{font-size:30px}
.mem div small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.mem div .rad{color:var(--red)}
.placeholder{background:#fff;border-radius:24px;padding:50px 20px;text-align:center;box-shadow:var(--shadow)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0 40px}
@media(max-width:640px){.hero .big{font-size:100px}.qtext{font-size:19px}.days{grid-template-columns:repeat(8,1fr);height:auto}.days .day{height:110px}}
</style>
</head>

<div class="wrap">
  <header>
    <a href="index.html" class="brand" style="text-decoration:none;color:inherit"><div class="logo">字</div><h1>识字星球<small>返回首页</small></h1></a>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <main id="main"></main>
  <footer>学习记录保存在本浏览器（localStorage），换浏览器或清除缓存后会重置。</footer>
</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 存储 ============ */
const MEM={};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in MEM?MEM[k]:d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){MEM[k]=v}}
};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d);t.setDate(t.getDate()+n);return ymd(t)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
const hl=(w,c)=>{const i=w.indexOf(c);return i<0?w:w.slice(0,i)+'<b class="dot">'+c+'</b>'+w.slice(i+1)};

/* ============ 数据：多音字（25个） ============ */
const POLY=[
 {c:'好',r:[['hǎo','优点多，令人满意','好人 好看 友好'],['hào','喜爱','爱好 好奇 好学']]},
 {c:'长',r:[['cháng','两端距离大','长短 长江'],['zhǎng','生长；领头的人','长大 校长']]},
 {c:'行',r:[['xíng','走；可以','行走 步行'],['háng','行列；行业','银行 行业']]},
 {c:'发',r:[['fā','送出；产生','发现 出发'],['fà','头发','头发 理发']]},
 {c:'重',r:[['zhòng','分量大；要紧','重量 重要'],['chóng','再一次','重复 重新']]},
 {c:'还',r:[['huán','归还，回到原处','还书 归还'],['hái','仍然；更','还有 还是']]},
 {c:'和',r:[['hé','平和；连接','和平 我和你'],['hè','跟着唱或说','应和 曲高和寡'],['huó','在粉里加水揉','和面 和泥'],['huo','（轻声）温暖','暖和']]},
 {c:'乐',r:[['lè','快乐','快乐 乐观'],['yuè','音乐','音乐 乐器']]},
 {c:'为',r:[['wéi','做；成为','成为 作为'],['wèi','表示原因、目的','因为 为了']]},
 {c:'着',r:[['zháo','接触到；有了结果','着急 睡着 着火'],['zhe','（轻声）动作在进行','看着 走着'],['zhuó','穿；接触','着装 着陆']]},
 {c:'少',r:[['shǎo','数量小','多少 少数'],['shào','年轻','少年 少先队']]},
 {c:'数',r:[['shǔ','一个个地点数','数一数 数星星'],['shù','数目','数学 数字'],['shuò','屡次','数见不鲜']]},
 {c:'传',r:[['chuán','传递，传播','传说 传递'],['zhuàn','记录人一生的文字','传记 自传']]},
 {c:'差',r:[['chà','不够；不好','差不多 差点儿'],['chā','不同','差别 误差'],['chāi','派去办事','出差 差事'],['cī','不整齐','参差']]},
 {c:'背',r:[['bèi','身体后面；凭记忆念出','背后 背诵'],['bēi','用背驮','背书包 背包袱']]},
 {c:'便',r:[['biàn','方便','方便 便利'],['pián','价钱低','便宜']]},
 {c:'朝',r:[['cháo','面对；朝代','朝向 朝代'],['zhāo','早晨','朝阳 朝气']]},
 {c:'种',r:[['zhǒng','种子；种类','种子 品种'],['zhòng','栽种','种树 种地']]},
 {c:'觉',r:[['jué','感到','感觉 觉得'],['jiào','睡眠','睡觉 午觉']]},
 {c:'都',r:[['dōu','全部','都是 全都'],['dū','大城市','首都 都市']]},
 {c:'角',r:[['jiǎo','角落；兽角','角落 牛角'],['jué','演员扮演的人物','角色 主角']]},
 {c:'降',r:[['jiàng','落下','降落 下降'],['xiáng','投降；制服','投降 降服']]},
 {c:'薄',r:[['báo','厚度小（口语）','薄饼 薄纸'],['bó','不强；少','薄弱 单薄'],['bò','植物名','薄荷']]},
 {c:'空',r:[['kōng','什么都没有；天空','天空 空气'],['kòng','空闲；空出','空白 有空']]},
 {c:'教',r:[['jiāo','传授知识','教书 教唱歌'],['jiào','教育','教室 教育']]}
];

/* ============ 数据：易读错字（26个） ============ */
const MISREAD=[
 {w:'胳膊',c:'胳',ok:'gē',bad:'gé',full:'gē bo'},
 {w:'档案',c:'档',ok:'dàng',bad:'dǎng',full:'dàng àn'},
 {w:'友谊',c:'谊',ok:'yì',bad:'yí',full:'yǒu yì'},
 {w:'符合',c:'符',ok:'fú',bad:'fǔ',full:'fú hé'},
 {w:'处理',c:'处',ok:'chǔ',bad:'chù',full:'chǔ lǐ',n:'动词“处理、相处”读 chǔ；名词“处所、到处”读 chù。'},
 {w:'氛围',c:'氛',ok:'fēn',bad:'fèn',full:'fēn wéi'},
 {w:'剖析',c:'剖',ok:'pōu',bad:'pāo',full:'pōu xī'},
 {w:'粗糙',c:'糙',ok:'cāo',bad:'zào',full:'cū cāo'},
 {w:'酝酿',c:'酿',ok:'niàng',bad:'rǎng',full:'yùn niàng'},
 {w:'憎恨',c:'憎',ok:'zēng',bad:'zèng',full:'zēng hèn'},
 {w:'刹那',c:'刹',ok:'chà',bad:'shā',full:'chà nà',n:'“刹车”才读 shā。'},
 {w:'潜力',c:'潜',ok:'qián',bad:'qiǎn',full:'qián lì'},
 {w:'赡养',c:'赡',ok:'shàn',bad:'zhān',full:'shàn yǎng'},
 {w:'惩罚',c:'惩',ok:'chéng',bad:'chěng',full:'chéng fá'},
 {w:'暂时',c:'暂',ok:'zàn',bad:'zhàn',full:'zàn shí'},

const CATS={poly:'多音字',misread:'易读错字',similar:'形近字',stroke:'笔画笔顺',homo:'同音别字'};

/* ============ 生成题目 ============ */
function questions(cat){
  const qs=[];
  if(cat==='poly'){POLY.forEach(it=>{const ops=it.r.map(x=>x[0]);it.r.forEach(rd=>rd[2].split(' ').forEach(w=>{
    qs.push({key:'poly|'+w,q:'「'+hl(w,it.c)+'」中的“'+it.c+'”读什么？',opts:ops,ans:rd[0],hz:false,exp:'“'+it.c+'”读 '+rd[0]+' 时表示“'+rd[1]+'”，如：'+rd[2].replace(/ /g,'、')+'。'})}))})}
  if(cat==='misread'){MISREAD.forEach(it=>qs.push({key:'mis|'+it.w,q:'「'+hl(it.w,it.c)+'」中的“'+it.c+'”读什么？',opts:[it.ok,it.bad],ans:it.ok,hz:false,exp:'正确读音：'+it.w+' '+it.full+'；常见误读为 '+it.bad+'。'+(it.n||'')}))}
  if(cat==='similar'||cat==='homo'){(cat==='similar'?SIMILAR:HOMO).forEach(it=>it.q.forEach(([t,a])=>qs.push({key:cat+'|'+t,q:'选字填空：'+t.replace('__','<u>　</u>'),opts:it.g,ans:a,hz:true,exp:it.tip})))}
  if(cat==='stroke'){STROKE.forEach(it=>{const n=it.s.length;
    qs.push({key:'stk|n|'+it.c,q:'<span style="font-family:var(--kai);font-size:44px">'+it.c+'</span>　一共几画？',opts:[n-1,n,n+1].filter(x=>x>0).map(x=>x+'画'),ans:n+'画',hz:false,exp:'“'+it.c+'”共'+n+'画：'+it.s.join('、')+'。'+it.r});
    const last=it.s[n-1];const others=shuffle(STROKE_POOL.filter(x=>x!==last)).slice(0,2);
    qs.push({key:'stk|l|'+it.c,q:'<span style="font-family:var(--kai);font-size:44px">'+it.c+'</span>　最后一笔是什么？',opts:[last,...others],ans:last,hz:false,exp:'“'+it.c+'”的笔顺：'+it.s.join('、')+'。'+it.r});})}
  return qs;
}

/* ============ 错题本 ============ */
const getWrong=()=>LS.get('hz_wrong',[]);
const setWrong=v=>LS.set('hz_wrong',v);
function addWrong(cat,q,picked){
  const w=getWrong();let it=w.find(x=>x.key===q.key);
  if(it){it.times++;it.picked=picked;it.last=today()}
  else w.unshift({key:q.key,cat,q:q.q,opts:q.opts,ans:q.ans,exp:q.exp,hz:q.hz,picked,times:1,last:today()});
  setWrong(w);
  srsAdd({id:'w|'+q.key,tag:CATS[cat]+'错题',front:q.q,back:'答案：<b>'+q.ans+'</b><br>'+q.exp},true);
}
function removeWrong(key){setWrong(getWrong().filter(x=>x.key!==key))}

/* ============ 间隔重复（第1、2、4、7、15天） ============ */
const INT=[1,2,4,7,15];
const getSRS=()=>LS.get('hz_srs',[]);
const setSRS=v=>LS.set('hz_srs',v);
function srsAdd(card,silent){
  const s=getSRS();
  if(s.find(x=>x.id===card.id)){if(!silent)toast('已经在复习计划里啦');return false}
  const t=today();s.push(Object.assign({stage:0,base:t,due:addDays(t,1),added:t},card));setSRS(s);
  if(!silent)toast('已加入复习计划，明天开始第1次复习');return true;
}
const inSRS=id=>getSRS().some(x=>x.id===id);
function dueCards(){const t=today();return getSRS().filter(x=>x.stage<5&&x.due<=t)}
function grade(id,ok){
  const s=getSRS();const c=s.find(x=>x.id===id);if(!c)return;const t=today();
  if(ok){c.stage++;if(c.stage>=5){c.due=null}else{let d=addDays(c.base,INT[c.stage]);if(d<=t)d=addDays(t,1);c.due=d}}
  else{c.stage=0;c.base=t;c.due=addDays(t,1)}
  setSRS(s);
}

let Q=null;

function openQuiz(title,list,mode){Q={title,list,mode,i:0,score:0,wrong:0};document.getElementById('mask').classList.add('show');drawQ()}
function closeQuiz(){document.getElementById('mask').classList.remove('show');Q=null;render()}
function drawQ(){
  const md=document.getElementById('modal');

    const n=Q.list.length,p=Math.round(Q.score/n*100),st=p>=90?3:p>=60?2:p>0?1:0;
    md.innerHTML='<div class="result"><div class="stars">'+'⭐'.repeat(st)+'<span style="opacity:.25">'+'⭐'.repeat(3-st)+'</span></div><div class="score">'+Q.score+' / '+n+'</div><p>'+(p===100?'全对！太棒了！':p>=60?'不错！错的题已收进错题本。':'别灰心，错题已收进错题本，按计划复习就能记牢。')+'</p>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+(Q.mode==='normal'?'<button class="btn red" onclick="startQuiz(\''+Q.list[0].cat+'\')">再来一组</button>':'')+(Q.wrong?'<button class="btn orange" onclick="S.top=\'clinic\';S.sub.clinic=\'wrong\';closeQuiz()">去错题本</button>':'')+'<button class="btn ghost" onclick="closeQuiz()">关闭</button></div></div>';
    return;
  }
  const q=Q.list[Q.i];
  md.innerHTML='<div class="mhead"><b>'+Q.title+'　'+(Q.i+1)+' / '+Q.list.length+'</b><button class="x" onclick="closeQuiz()">✕</button></div>'+
   '<div class="prog"><i style="width:'+(Q.i/Q.list.length*100)+'%"></i></div><div class="qtext">'+q.q+'</div>'+
   '<div class="opts">'+shuffle(q.opts).map(o=>'<button class="opt'+(q.hz?' hzopt':'')+'" data-o="'+o+'" onclick="pick(this)">'+o+'</button>').join('')+'</div>'+
   '<div class="fb" id="fb"></div><div class="mfoot" id="mf"></div>';
}
function pick(btn){
  const q=Q.list[Q.i],o=btn.dataset.o,ok=o===String(q.ans);
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.o===String(q.ans))b.classList.add('right')});
  if(!ok)btn.classList.add('bad');
  if(ok){Q.score++;if(Q.mode==='redo')removeWrong(q.key)}else{Q.wrong++;addWrong(q.cat,q,o)}
  const fb=document.getElementById('fb');fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ <b>答对了！</b> ':'❌ <b>正确答案是“'+q.ans+'”</b>，已收进错题本。<br>')+q.exp;
  document.getElementById('mf').innerHTML='<button class="btn '+(ok?'green':'red')+'" onclick="Q.i++;drawQ()">'+(Q.i+1<Q.list.length?'下一题 →':'看成绩')+'</button>';
}
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeQuiz()});

/* ============ 记忆复习视图 ============ */
let RV={queue:null,open:false};
function stageDots(c){return '<div class="stages">'+INT.map((d,i)=>'<span class="'+(i<c.stage?'done':i===c.stage?'cur':'')+'">第'+d+'天</span>').join('')+'</div>'}
function vToday(){
  const due=dueCards();
  if(!RV.queue||!RV.queue.length)RV.queue=due.map(x=>x.id);
  RV.queue=RV.queue.filter(id=>due.some(x=>x.id===id));
  const s=getSRS(),t=today(),newToday=s.filter(x=>x.added===t&&x.stage===0&&x.due>t);
  let h='<div class="bar"><div><div class="t">今日复习 · '+t+'</div><div class="d">新卡片在加入后第 1、2、4、7、15 天各复习一次；“没记住”会从第 1 天重新开始。</div></div><div class="d">待复习 <b style="color:var(--green);font-size:20px">'+RV.queue.length+'</b> 张</div></div>';
  if(RV.queue.length){
    const c=s.find(x=>x.id===RV.queue[0]);
    h+='<div class="flash"><div class="fc'+(RV.open?' open':'')+'"><div><span class="tag" style="background:var(--green-soft);color:var(--green)">'+(c.tag||'')+'</span></div><div class="front">'+c.front.replace(/font-size:44px/g,'font-size:40px')+'</div><div class="back">'+c.back+'</div></div>'+stageDots(c)+
    '<div class="fcbtns">'+(RV.open?'<button class="btn red" onclick="rate(false)">😣 没记住</button><button class="btn green" onclick="rate(true)">😄 记住了</button>':'<button class="btn" onclick="RV.open=true;render()">先想一想，再看答案</button>')+'</div></div>';
  }else{
    h+='<div class="empty"><div class="e">🌱</div><p>'+(s.length?'今天的复习完成了！明天再来。':'复习计划还是空的。')+'</p><p class="note">在易错诊所、字族、偏旁、对比的卡片上点“＋ 复习”，或者做小测——错题会自动加入。</p>'+
    '<p><button class="btn green" onclick="seed()">一键加入：10 个多音字 + 10 个易读错字</button></p></div>';
  }
  if(newToday.length)h+='<div class="section-title">今天新加入（明天开始第 1 次复习）· '+newToday.length+' 张</div><div class="exs">'+newToday.slice(0,40).map(x=>'<span>'+(x.tag||'')+'：'+x.front.replace(/<[^>]+>/g,'').replace(/有哪几个读音？|怎么读？|怎么区分？|怎么用？|几画？笔顺是？/,'').slice(0,18)+'</span>').join('')+'</div>';
  return h;
}
function rate(ok){const id=RV.queue.shift();grade(id,ok);if(!ok){} RV.open=false;toast(ok?'很好！下次复习时间已排好':'没关系，明天再见它');render()}
function seed(){let n=0;POLY.slice(0,10).forEach(it=>{if(srsAdd({id:'poly|'+it.c,tag:'多音字',front:'<span class="hz">'+it.c+'</span><br>有哪几个读音？',back:it.r.map(r=>'<b>'+r[0]+'</b>：'+r[1]+'（'+r[2].replace(/ /g,'、')+'）').join('<br>')},true))n++});
  MISREAD.slice(0,10).forEach(it=>{if(srsAdd({id:'mis|'+it.w,tag:'易读错字',front:'<span class="hz" style="font-size:56px">'+hl(it.w,it.c)+'</span><br>怎么读？',back:'<b>'+it.full+'</b>（不读 '+it.bad+'）'+(it.n?'<br>'+it.n:'')},true))n++});
  toast('加入了 '+n+' 张卡片，明天开始复习');render()}

function vFamily(){
  return '<div class="bar"><div><div class="t">字族串记</div><div class="d">同一个声旁串起一串字：声旁提示读音（相同或相近），形旁提示意思。</div></div></div><div class="grid wide">'+FAMILY.map(f=>{
    const id='fam|'+f.root;
    return '<div class="card fam">'+addBtn(id,{id,tag:'字族',front:'<span class="hz">'+f.root+'</span><br>说出这个字族里的字',back:f.m.map(x=>x[0]+' '+x[1]+'（'+x[2]+'）').join('　')})+
    '<div class="root"><div class="hz">'+f.root+'</div><div><b style="font-size:18px">“'+f.root+'”字族</b><div class="mean">声旁 '+f.root+' · '+f.py+'</div></div></div>'+
    '<div class="mem">'+f.m.map(x=>'<div><div class="hz">'+x[0]+'</div><small><b>'+x[1]+'</b></small><small>'+x[2]+'</small><small class="rad">'+x[3]+'</small></div>').join('')+'</div></div>'}).join('')+'</div><p class="note">红色小字是形旁。注意：声旁只提示读音，很多字读音会有变化（如“方”族里的“放、访”声调不同）。</p>';
}
function vRadical(){
  return '<div class="bar"><div><div class="t">偏旁联想</div><div class="d">偏旁大多来自一个独立的字，它告诉我们这个字的意思和什么有关。</div></div></div><div class="grid">'+RADICAL.map(r=>{
    const id='rad|'+r.n;
    return '<div class="card">'+addBtn(id,{id,tag:'偏旁',front:'<span class="hz">'+r.r+'</span><br>'+r.n+'表示什么？举例',back:'来自“'+r.f+'”，'+r.m+'：'+r.e.join(' ')})+
    '<div style="display:flex;gap:12px;align-items:center"><div class="hz" style="width:64px;height:64px;border-radius:16px;background:var(--orange-soft);color:#C46F0E;display:grid;place-items:center;font-size:42px">'+r.r+'</div><div><b>'+r.n+'</b><div class="mean">来自“'+r.f+'”</div></div></div>'+
    '<div class="tip">'+r.m+'</div><div class="exs">'+r.e.map(x=>'<span style="font-family:var(--kai);font-size:20px">'+x+'</span>').join('')+'</div></div>'}).join('')+'</div>';
}
function vContrast(){
  return '<div class="bar"><div><div class="t">对比辨析</div><div class="d">把容易混的部件放在一起比：哪里不同？意思为什么不同？</div></div></div><div class="grid wide">'+CONTRAST.map((c,i)=>{
    const id='con|'+i;
    return '<div class="card">'+addBtn(id,{id,tag:'对比',front:'<span class="hz">'+c.a+' ／ '+c.b+'</span><br>有什么区别？',back:'<b>'+c.an+'</b>：'+c.am+'（'+c.aw+'）<br><b>'+c.bn+'</b>：'+c.bm+'（'+c.bw+'）<br>'+c.k})+
    '<div class="contrast" style="margin-top:22px"><div class="side a"><div class="r">'+c.a+'</div><div class="m">'+c.an+'</div><div class="mean">'+c.am+'</div><div class="w">'+c.aw+'</div></div><div class="side b"><div class="r">'+c.b+'</div><div class="m">'+c.bn+'</div><div class="mean">'+c.bm+'</div><div class="w">'+c.bw+'</div></div></div><div class="tip">'+c.k+'</div></div>'}).join('')+'</div>';
}
function vPlan(){
  const s=getSRS(),t=today(),due=dueCards().length,mast=s.filter(x=>x.stage>=5).length;
  let h='<div class="stats"><div class="stat"><b>'+s.length+'</b><span>计划中的卡片</span></div><div class="stat"><b style="color:var(--orange)">'+due+'</b><span>今天要复习</span></div><div class="stat"><b style="color:var(--green)">'+mast+'</b><span>已完成 5 轮（掌握）</span></div><div class="stat"><b>'+getWrong().length+'</b><span>错题本</span></div></div>';
  const days=[];for(let i=0;i<16;i++){const d=addDays(t,i);days.push({d,n:s.filter(x=>x.stage<5&&(i===0?x.due<=d:x.due===d)).length})}
  const mx=Math.max(1,...days.map(x=>x.n));
  h+='<div class="card"><b>未来 16 天的复习量</b><div class="days">'+days.map((x,i)=>'<div class="day"><b>'+x.n+'</b><i class="'+(i===0?'today':'')+'" style="height:'+(x.n/mx*100)+'px"></i>'+(i===0?'今天':x.d.slice(5))+'</div>').join('')+'</div>'+
  '<div class="note">每张卡片：加入当天学习 → 第1天 → 第2天 → 第4天 → 第7天 → 第15天复习。间隔逐渐拉长，比一次集中背诵记得更牢（间隔重复）。</div></div>';
  h+='<div class="section-title">各轮次分布</div><div class="stats">'+INT.map((d,i)=>'<div class="stat"><b>'+s.filter(x=>x.stage===i).length+'</b><span>等待第'+d+'天复习</span></div>').join('')+'</div>';
  if(s.length){
    h+='<div class="section-title">全部卡片</div><div class="card" style="overflow-x:auto"><table><tr><th>类型</th><th>内容</th><th>进度</th><th>下次复习</th><th></th></tr>'+
    s.slice().sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1).map(x=>'<tr><td>'+(x.tag||'')+'</td><td>'+x.front.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,26)+'</td><td>'+(x.stage>=5?'✅ 掌握':(x.stage+'/5'))+'</td><td>'+(x.due||'—')+'</td><td><button class="btn ghost sm" onclick="delCard(\''+x.id.replace(/'/g,"\\'")+'\')">删除</button></td></tr>').join('')+'</table></div>'+
    '<p style="text-align:right"><button class="btn ghost" onclick="if(confirm(\'确定清空复习计划吗？\')){setSRS([]);render()}">清空复习计划</button></p>';
  }else h+='<div class="empty"><div class="e">🗓️</div><p>还没有复习卡片。去「今日复习」一键加入，或者在任意卡片上点“＋ 复习”。</p></div>';
  return h;
}
function delCard(id){setSRS(getSRS().filter(x=>x.id!==id));render()}

if(location.hash==='#review')S.top='review';
render();
</script>
