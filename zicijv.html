<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>字趣乐园 · 字词句</title>
<link rel="stylesheet" href="xzq-theme.css">
<style>
:root{
  --bg:var(--xzq-bg);--paper:var(--xzq-card);--ink:var(--xzq-ink);--soft:var(--xzq-muted);--line:var(--xzq-line);
  --pri:#E8613C;--pri2:#FFB547;--teal:#2BA89A;--sky:#4A8FE7;
  --pz:#4A8FE7;--bl:#2BA89A;--db:#F08A24;--zw:#8E6CDB;--bc:#E35D9A;--cy:#8C8C8C;--fj:#B08B4F;
  --r:var(--xzq-radius);--sh:0 6px 0 #F1E2CC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:18px;line-height:1.6;min-height:100vh;
  background-image:radial-gradient(#F6E8D2 1.2px,transparent 1.2px);background-size:22px 22px}
.kai{font-family:"KaiTi","STKaiti","楷体","Kaiti SC","BiauKai",serif}
button{font-family:inherit;cursor:pointer;border:none}
/* 顶部 */
.brand{display:flex;align-items:center;gap:12px;padding:14px 20px 6px;max-width:1240px;margin:0 auto}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:32px;display:grid;place-items:center;box-shadow:0 4px 0 #C94A28}
.brand h1{font-size:26px;letter-spacing:2px}
.brand small{display:block;font-size:14px;color:var(--soft);letter-spacing:0;font-weight:400}
.topnav{position:sticky;top:0;z-index:20;background:rgba(255,249,240,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.topnav .in{max-width:1240px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.topnav .in::-webkit-scrollbar{display:none}
.tn{flex:none;font-size:17px;font-weight:700;padding:10px 16px;border-radius:999px;background:transparent;color:var(--soft)}
.tn:hover{background:#FCEBD9}
.tn.on{background:var(--pri);color:#fff;box-shadow:0 4px 0 #C94A28}
/* 布局 */
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:230px 1fr;gap:22px}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:10px}
.sn{display:flex;align-items:center;gap:10px;text-align:left;font-size:18px;font-weight:700;padding:14px 16px;border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:var(--sh);transition:.15s}
.sn .ic{font-size:24px}
.sn:hover{transform:translateY(-2px)}
.sn.on{background:var(--teal);color:#fff;box-shadow:0 6px 0 #1E7F74}
main{min-width:0}
.panel{display:none;animation:fade .35s}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ptitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ptitle h2{font-size:30px}
.ptitle p{color:var(--soft);font-size:16px}
/* 选字 */
.chars{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.ch{width:64px;height:64px;border-radius:18px;background:var(--paper);font-size:38px;box-shadow:var(--sh);color:var(--ink);transition:.15s}
.ch:hover{transform:translateY(-2px)}
.ch.on{background:var(--pri2);color:#5A3200;box-shadow:0 6px 0 #D88F1F;transform:translateY(-2px)}
/* 卡片 */
.hero{display:flex;gap:20px;align-items:center;background:var(--paper);border-radius:var(--r);padding:16px 22px;box-shadow:var(--sh);margin-bottom:18px}
.hero .big{font-size:96px;line-height:1;width:120px;height:120px;display:grid;place-items:center;border-radius:20px;
  background:linear-gradient(#fff,#fff) padding-box;border:3px dashed #F3C9A8;position:relative}
.hero .big:before,.hero .big:after{content:"";position:absolute;background:#F7DCC6}
.hero .big:before{left:50%;top:0;bottom:0;width:1.5px}
.hero .big:after{top:50%;left:0;right:0;height:1.5px}
.hero .big span{position:relative;z-index:1}
.hero .meta{font-size:18px}
.hero .meta b{color:var(--pri);font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--paper);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card .no{position:absolute;right:14px;top:10px;font-size:46px;font-weight:900;color:#FBEFE2}
.sense-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.sk{font-size:22px;font-weight:900;color:var(--pri)}
.py{font-size:14px;font-weight:700;background:#FDEBDD;color:#B4482A;border-radius:999px;padding:1px 10px}
.gl{color:var(--soft);font-size:16px;margin:4px 0 10px;position:relative}
.words{display:flex;flex-wrap:wrap;gap:8px}
.wd{display:inline-flex;align-items:center;gap:6px;font-size:22px;padding:6px 12px;border-radius:14px;background:#FFF5EA;border:2px solid #F7E3CC;color:var(--ink)}
.wd:hover{border-color:var(--pri2)}
.tag{font-size:13px;font-weight:800;color:#fff;border-radius:999px;padding:1px 9px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;white-space:nowrap}
.t-偏正{background:var(--pz)}.t-并列{background:var(--bl)}.t-动宾{background:var(--db)}.t-主谓{background:var(--zw)}.t-补充{background:var(--bc)}.t-成语{background:var(--cy)}.t-附加{background:var(--fj)}
.note{background:#FFF3C9;border-radius:18px;padding:14px 18px;font-size:17px;margin:16px 0;border-left:6px solid var(--pri2)}
.note b{color:#B4482A}
.dq{display:inline-block;font-size:12px;font-weight:800;color:#C2410C;background:#FFE4CC;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:2px}
/* 构词方式 */
.type-card{border-top:8px solid}
.type-card h3{font-size:24px;display:flex;align-items:center;gap:8px}
.formula{font-size:17px;background:#F7F4EF;border-radius:12px;padding:8px 12px;margin:8px 0}
.formula b{font-size:20px}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini span{font-size:18px;background:#F7F4EF;border-radius:10px;padding:2px 10px;cursor:pointer}
.mini span:hover{background:#FDE7D3}
.mono-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.mono{background:var(--paper);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
.mono .w{font-size:34px}
.mono .k{font-size:13px;font-weight:800;background:#EEE;border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:8px}
/* 拆解 */
.eq{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 0;border-bottom:2px dashed var(--line)}
.eq:last-child{border-bottom:none}
.eq .whole{font-size:30px;font-weight:700;min-width:96px}
.eq .eqs{font-size:18px;color:var(--ink);flex:1;min-width:220px}
.eq .eqs .pc{display:inline-block;background:#FFF5EA;border-radius:10px;padding:0 8px;margin:2px 0}
.eq .eqs .pc b{font-size:22px;color:var(--pri)}
.eq .eqs .op{color:var(--soft);font-weight:900;margin:0 4px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.cmp div{border-radius:16px;padding:12px 14px;font-size:17px}
.same{background:#E3F6F3}.diff{background:#FDE6E6}
.cmp .w{font-size:26px;font-weight:700}
/* 古今 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.now,.old{border-radius:16px;padding:12px 14px}
.now{background:#EAF3FF}
.old{background:#F6EEDF;background-image:repeating-linear-gradient(0deg,transparent 0 31px,#EBDDC4 31px 32px)}
.lab{font-size:13px;font-weight:900;letter-spacing:1px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.now .lab{color:var(--sky)}.old .lab{color:#8A6A33}
.sent{font-size:22px;line-height:1.7}
.sent em{font-style:normal;color:var(--pri);font-weight:900;background:linear-gradient(transparent 60%,#FFE1A8 60%)}
.src{font-size:15px;color:#8A6A33;margin-top:4px}
.tr{font-size:16px;color:var(--soft);margin-top:4px;border-top:1px dashed #D9C6A4;padding-top:4px}
.ex-tag{font-size:12px;font-weight:800;background:var(--sky);color:#fff;border-radius:6px;padding:0 6px}
.pend{font-size:18px;color:#B4482A}
/* 练习 */
.quiz{max-width:820px}
.qbar{display:flex;align-items:center;gap:12px;margin:10px 0 16px}
.qbar .bar{flex:1;height:16px;border-radius:999px;background:#F2E6D6;overflow:hidden}
.qbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#7DD3C0);width:0;transition:width .4s;border-radius:999px}
.qbar .n{font-weight:900;font-size:18px;min-width:64px;text-align:right}
.qcard{background:var(--paper);border-radius:28px;padding:22px;box-shadow:var(--sh)}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.qhead .big{font-size:64px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:#FFF1E3;border-radius:20px}
.qhead p{font-size:20px;font-weight:700}
.qs{border-radius:18px;padding:14px 16px;margin-top:12px;background:#FBF7F1;border:2px solid var(--line)}
.qs .sent{font-size:24px}
.qs .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;font-weight:900;margin-right:8px;vertical-align:3px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.opt{font-size:19px;font-weight:700;padding:10px 18px;border-radius:14px;background:#fff;border:3px solid #EADBC6;color:var(--ink);min-height:52px}
.opt:hover{border-color:var(--pri2)}
.opt.sel{border-color:var(--sky);background:#EAF3FF}
.opt.ok{border-color:var(--teal);background:var(--teal);color:#fff}
.opt.bad{border-color:#E5484D;background:#E5484D;color:#fff;animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.qact{display:flex;justify-content:center;margin-top:18px}
.bigbtn{font-size:22px;font-weight:900;padding:14px 38px;border-radius:999px;background:var(--pri);color:#fff;box-shadow:0 6px 0 #C94A28}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #C94A28}
.bigbtn[disabled]{background:#D9CFC4;box-shadow:0 6px 0 #BFB3A6;cursor:not-allowed}
.explain{margin-top:16px;border-radius:18px;padding:14px 18px;font-size:18px;display:none}
.explain.show{display:block;animation:fade .3s}
.explain.good{background:#E3F6F3;border-left:6px solid var(--teal)}
.explain.wrong{background:#FDECEC;border-left:6px solid #E5484D}
.explain h4{font-size:22px;margin-bottom:4px}
.result{text-align:center;padding:30px 20px}
.result .em{font-size:90px}
.result .score{font-size:44px;font-weight:900;color:var(--pri)}
.review{text-align:left;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.review div{background:#FDF3EA;border-radius:14px;padding:10px 14px;font-size:17px}
/* 建设中 */
.wip{text-align:center;padding:70px 20px;background:var(--paper);border-radius:28px;box-shadow:var(--sh)}
.wip .em{font-size:90px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.wip h2{font-size:32px;margin:8px 0}
.wip p{color:var(--soft)}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(40,30,20,.35);display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.pop{background:#fff;border-radius:26px;padding:22px;max-width:520px;width:100%;animation:fade .25s;position:relative}
.pop .x{position:absolute;right:14px;top:12px;width:44px;height:44px;border-radius:50%;background:#F5EDE3;font-size:22px}
.pop .w{font-size:48px}
footer{text-align:center;color:var(--soft);font-size:14px;padding:0 16px 30px}
@media(max-width:820px){
  .wrap{grid-template-columns:1fr;gap:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .sn{flex:none;font-size:16px;padding:10px 14px}
  .pair{grid-template-columns:1fr}
  .hero .big{font-size:72px;width:96px;height:96px}
  .ptitle h2{font-size:26px}
}
</style>
</head>
<body>
<div class="brand"><div class="logo kai">字</div><h1>字趣乐园<small>8–14 岁汉字学习</small></h1></div>
<nav class="topnav"><div class="in" id="topnav"></div></nav>

<div id="wipView" class="wrap" style="display:none;grid-template-columns:1fr">
  <div class="wip"><div class="em">🚧</div><h2 id="wipTitle">建设中</h2><p>这个模块正在建设中，先去「字词句」玩一玩吧！</p></div>
</div>

<div id="zcjView" class="wrap">
  <aside class="side" id="side"></aside>
  <main>
    <section class="panel on" id="p-family">
      <div class="ptitle"><h2>义项词族</h2><p>一个字有好几个意思，每个意思都有自己的“词语家族”</p></div>
      <div class="chars" data-chars></div>
      <div id="familyBox"></div>
    </section>
    <section class="panel" id="p-types">
      <div class="ptitle"><h2>构词方式</h2><p>两个字怎么“手拉手”变成一个词？</p></div>
      <div class="grid" id="typeBox" style="margin-top:14px"></div>
      <h3 style="font-size:24px;margin:26px 0 4px">🧩 不能拆开理解的词</h3>
      <p style="color:var(--soft)">这些词两个字合在一起才有意思，拆开后单个字的意思和整个词没关系。</p>
      <div class="mono-row" id="monoBox"></div>
    </section>
    <section class="panel" id="p-split">
      <div class="ptitle"><h2>词的拆解</h2><p>把词拆成“字 + 字”，看看每个字在这里是什么意思</p></div>
      <div class="chars" data-chars></div>
      <div id="splitBox"></div>
    </section>
    <section class="panel" id="p-oldnew">
      <div class="ptitle"><h2>例句古今对照</h2><p>同一个意思，今天怎么用，古人怎么用</p></div>
      <div class="chars" data-chars></div>
      <div id="oldnewBox"></div>
    </section>
    <section class="panel" id="p-quiz">
      <div class="ptitle"><h2>语境辨义练习</h2><p>同一个字，放进不同句子，意思就变了</p></div>
      <div class="quiz" id="quizBox"></div>
    </section>
  </main>
</div>
<footer>标“待查”的内容请老师对照权威辞书核对；标“示例”的现代句为自编例句。</footer>

<div class="mask" id="mask"><div class="pop" id="pop"></div></div>

<script>
/* ===================== 数据 =====================
 每个字：c 字, py 拼音, note 提示
 ss 义项：k 简称, g 解释, py 该义读音(多音字), ws 词语[词, 构词方式, 拆解], now 现代示例句, old 文言句{t 原文, src 出处, tr 译文} 或 null(待查)
 构词方式：偏正 并列 动宾 主谓 补充；成语另标
================================================== */
var D=[
{c:"节",py:"jié",note:"“节约、节能”里的<b>节</b>都是<b>节省</b>；“春节、过节”里的<b>节</b>是<b>节日</b>。字一样，意思不一样。",
 ss:[
 {k:"分段处",g:"物体分段相连的地方（本来指竹节）",ws:[["竹节","偏正","竹（竹子）+ 节（分段处）"],["骨节","偏正","骨（骨头）+ 节（相连处）"],["指节","偏正","指（手指）+ 节（分段处）"]],
  now:"竹子一节一节地往上长。",old:{t:"彼节者有间，而刀刃者无厚。",src:"《庄子·养生主》",tr:"牛的骨节之间有空隙，而刀刃薄得几乎没有厚度。"}},
 {k:"节省",g:"控制、少用",ws:[["节约","并列","节（节制）+ 约（约束）"],["节俭","并列","节（节省）+ 俭（俭省）"],["节能","动宾","节（节省）+ 能（能源）"],["节水","动宾","节（节省）+ 水"]],
  now:"我们要节约用水，随手关好水龙头。",old:{t:"节用而爱人，使民以时。",src:"《论语·学而》",tr:"节省财用，爱护百姓，役使百姓要选在农闲的时候。"}},
 {k:"节日",g:"一年中特别的日子",ws:[["春节","偏正","春（春天）+ 节（节日）"],["节日","偏正","节（节令）+ 日（日子）"],["过节","动宾","过（度过）+ 节（节日）"]],
  now:"春节快到了，家家户户贴春联。",old:{t:"独在异乡为异客，每逢佳节倍思亲。",src:"王维《九月九日忆山东兄弟》",tr:"独自在外地做客，每到美好的节日就更加思念亲人。"}}
 ]},
{c:"成",py:"chéng",note:"“成功、成就、成果”里的<b>成</b>都是<b>完成</b>的意思；“变成、长成”里的<b>成</b>表示<b>变化的结果</b>。",
 cmp:{same:[["成功","把事情做完成了"],["成就","完成、达到"]],diff:[["成本","做成一样东西要花的费用。这里不是“成功”的意思，“成”的确切理据<span class='dq'>待查</span>"]]},
 ss:[
 {k:"完成",g:"把事情做好、做完",ws:[["成功","动宾","成（完成）+ 功（功业）"],["成就","并列","成（完成）+ 就（达到）"],["完成","并列","完（完结）+ 成（做好）"],["成果","偏正","成（完成后的）+ 果（结果）"]],
  now:"经过一次次练习，他终于跳绳成功了。",old:{t:"有志者事竟成也。",src:"《后汉书·耿弇传》",tr:"有志向的人，事情最终一定能完成。"}},
 {k:"变成",g:"变为另一种样子",ws:[["变成","补充","变（变化）+ 成（结果：成为）"],["长成","补充","长（生长）+ 成（结果）"],["化成","补充","化（融化）+ 成（结果）"]],
  now:"太阳一出来，雪人慢慢化成了一摊水。",old:{t:"积土成山，风雨兴焉。",src:"《荀子·劝学》",tr:"堆积泥土变成高山，风雨就从那里兴起了。"}},
 {k:"现成的",g:"已经有的、定型的",ws:[["成语","偏正","成（现成的、定型的）+ 语（话）"],["成见","偏正","成（早已形成的）+ 见（看法）"],["成规","偏正","成（现成的）+ 规（规矩）"]],
  now:"“画蛇添足”是一个有趣的成语。",old:{t:"故画竹，必先得成竹于胸中。",src:"苏轼《文与可画筼筜谷偃竹记》",tr:"所以画竹子，一定要先在心里有一棵完整的竹子。"}}
 ]},
{c:"明",py:"míng",note:"“明月”的<b>明</b>是<b>亮</b>，“明白”的<b>明</b>是<b>清楚</b>，“明天”的<b>明</b>是<b>下一个</b>。",
 ss:[
 {k:"亮",g:"光线充足",ws:[["光明","并列","光（光亮）+ 明（亮）"],["明亮","并列","明（亮）+ 亮"],["明月","偏正","明（明亮的）+ 月（月亮）"]],

  $$("[data-chars] .ch").forEach(function(b){b.onclick=function(){cur=+b.dataset.i;renderAll()}});
})}
function hero(d){return '<div class="hero"><div class="big kai"><span>'+d.c+'</span></div><div class="meta">拼音 <b>'+d.py+'</b><br>'+d.ss.length+' 个常用义项 · '+d.ss.reduce(function(n,s){return n+s.ws.length},0)+' 个词语</div></div>'}

/* 1 义项词族 */
function renderFamily(){var d=D[cur];
  $("#familyBox").innerHTML=hero(d)+'<div class="grid">'+d.ss.map(function(s,i){
    return '<div class="card"><div class="no">'+(i+1)+'</div><div class="sense-h"><span class="sk">'+s.k+'</span>'+(s.py?'<span class="py">'+s.py+'</span>':'')+'</div><div class="gl">'+s.g+'</div><div class="words">'+
      s.ws.map(function(w){return '<button class="wd kai" data-w="'+w[0]+'" data-s="'+i+'">'+w[0]+tag(w[1])+'</button>'}).join("")+'</div></div>'}).join("")+'</div><div class="note">💡 '+d.note+'</div>';
  $$("#familyBox .wd").forEach(function(b){b.onclick=function(){showWord(cur,+b.dataset.s,b.dataset.w)}});
}
function showWord(ci,si,w){var d=D[ci],s=d.ss[si],x=s.ws.filter(function(v){return v[0]===w})[0];
  $("#pop").innerHTML='<button class="x" onclick="closePop()">✕</button><div class="w kai">'+x[0]+'</div><p style="margin:6px 0">'+tag(x[1])+' <span style="color:var(--soft)">「'+d.c+'」在这里是：<b style="color:var(--pri)">'+s.k+'</b></span></p><div class="formula" style="font-size:20px">'+x[2]+'</div><p style="color:var(--soft);font-size:15px">同一义项的词：'+s.ws.map(function(v){return v[0]}).join("、")+'</p>';
  $("#mask").classList.add("show")}
function closePop(){$("#mask").classList.remove("show")}
$("#mask").onclick=function(e){if(e.target===this)closePop()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePop()});

/* 2 构词方式 */
function renderTypes(){
  var col={};D.forEach(function(d,ci){d.ss.forEach(function(s,si){s.ws.forEach(function(w){(col[w[1]]=col[w[1]]||[]).push([w[0],ci,si])})})});
  var html=TYPES.map(function(t){return '<div class="card type-card" style="border-top-color:'+t.c+'"><h3>'+tag(t.t)+' '+t.t+'式</h3><p>'+t.d+'</p><div class="formula">'+t.f+'</div><p style="font-size:16px;color:var(--soft)">例：'+t.e+'</p><div class="mini kai">'+
    (col[t.t]||[]).map(function(w){return '<span data-ci="'+w[1]+'" data-si="'+w[2]+'" data-w="'+w[0]+'">'+w[0]+'</span>'}).join("")+'</div></div>'}).join("");
  html+='<div class="card type-card" style="border-top-color:var(--cy)"><h3>'+tag("成语")+' 成语</h3><p>四个字的固定说法，可以分成两半来看结构。</p><div class="mini kai">'+(col["成语"]||[]).map(function(w){return '<span data-ci="'+w[1]+'" data-si="'+w[2]+'" data-w="'+w[0]+'">'+w[0]+'</span>'}).join("")+'</div></div>';
  html+='<div class="card type-card" style="border-top-color:var(--fj)"><h3>'+tag("附加")+' 附加式（词尾）</h3><p>“头”读轻声时只是词尾，没有实在意思。</p><div class="mini kai"><span>石头</span><span>木头</span><span>念头</span></div><p style="font-size:14px;color:var(--soft)">本模块重点是上面五种结构，附加式作补充了解。</p></div>';
  $("#typeBox").innerHTML=html;
  $$("#typeBox .mini span[data-w]").forEach(function(s){s.onclick=function(){showWord(+s.dataset.ci,+s.dataset.si,s.dataset.w)}});
  $("#monoBox").innerHTML=MONO.map(function(m){return '<div class="mono"><span class="w kai">'+m.w+'</span><span class="k">'+m.k+'</span><p style="margin-top:6px">'+m.t+'</p></div>'}).join("");
}

/* 3 词的拆解 */
function eqHTML(w,c){var parts=w[2].split(" + ");
  return '<div class="eq"><span class="whole kai">'+w[0]+'</span>'+tag(w[1])+'<span class="eqs">'+parts.map(function(p){
    var m=p.match(/^(.+?)（(.+)）$/);return m?'<span class="pc"><b class="kai">'+m[1]+'</b>（'+m[2]+'）</span>':'<span class="pc"><b class="kai">'+p+'</b></span>'}).join('<span class="op">+</span>')+'</span></div>'}
function renderSplit(){var d=D[cur],h=hero(d);
  h+=d.ss.map(function(s,i){return '<div class="card" style="margin-bottom:14px"><div class="sense-h"><span class="sk">义项'+(i+1)+'：'+s.k+'</span>'+(s.py?'<span class="py">'+s.py+'</span>':'')+'<span style="color:var(--soft);font-size:15px">这一组里的「'+d.c+'」都是这个意思</span></div>'+s.ws.map(function(w){return eqHTML(w,d.c)}).join("")+'</div>'}).join("");
  if(d.cmp){h+='<div class="card"><h3 style="font-size:22px">🔍 找不同：同一个「'+d.c+'」</h3><div class="cmp">'+
    d.cmp.same.map(function(x){return '<div class="same"><div class="w kai">'+x[0]+'</div>✅ '+x[1]+'</div>'}).join("")+
    d.cmp.diff.map(function(x){return '<div class="diff"><div class="w kai">'+x[0]+'</div>⚠️ '+x[1]+'</div>'}).join("")+'</div></div>'}
  h+='<div class="note">💡 '+d.note+'</div>';
  $("#splitBox").innerHTML=h}

/* 4 例句古今对照 */
function renderOldNew(){var d=D[cur];
  $("#oldnewBox").innerHTML=hero(d)+d.ss.map(function(s,i){
    var o=s.old?'<div class="sent kai">'+mark(s.old.t,d.c)+'</div><div class="src">—— '+s.old.src+'</div><div class="tr">译文：'+s.old.tr+'</div>':'<div class="pend">文言例句 <span class="dq">待查</span></div><div class="tr">暂未找到可靠出处，宁缺勿编。</div>';
    return '<div class="card" style="margin-bottom:14px"><div class="sense-h"><span class="sk">义项'+(i+1)+'：'+s.k+'</span>'+(s.py?'<span class="py">'+s.py+'</span>':'')+'</div><div class="gl">'+s.g+'</div><div class="pair"><div class="now"><div class="lab">🏙️ 现代 <span class="ex-tag">示例</span></div><div class="sent kai">'+mark(s.now,d.c)+'</div></div><div class="old"><div class="lab">📜 文言</div>'+o+'</div></div></div>'}).join("")}

/* 5 语境辨义练习 */
var qi=0,score=0,wrongs=[],pick={};
function renderQuiz(){
  if(qi>=Q.length){var star=score>=Q.length-1?"🏆":score>=Q.length*0.7?"🎉":"💪";
    $("#quizBox").innerHTML='<div class="qcard result"><div class="em">'+star+'</div><div class="score">'+score+' / '+Q.length+'</div><p style="font-size:20px">'+(score===Q.length?"全部答对，你是辨义小达人！":"再看看下面的题，记住它们的区别吧！")+'</p>'+
      (wrongs.length?'<div class="review">'+wrongs.map(function(k){var q=Q[k];return '<div><b class="kai" style="font-size:22px">'+q.c+'</b>　'+q.x+'</div>'}).join("")+'</div>':'')+'<div class="qact"><button class="bigbtn" id="restart">🔁 再练一遍</button></div></div>';
    $("#restart").onclick=function(){qi=0;score=0;wrongs=[];renderQuiz()};return}
  var q=Q[qi],d=byChar(q.c);pick={};
  var row=function(id,s){return '<div class="qs"><div class="sent kai"><span class="num">'+id+'</span>'+mark(s[0],q.c)+'</div><div class="opts" data-row="'+id+'">'+d.ss.map(function(x,i){return '<button class="opt" data-i="'+i+'">'+x.k+(x.py?' ('+x.py+')':'')+'</button>'}).join("")+'</div></div>'};
  $("#quizBox").innerHTML='<div class="qbar"><div class="bar"><i style="width:'+(qi/Q.length*100)+'%"></i></div><span class="n">'+(qi+1)+' / '+Q.length+'</span></div>'+
   '<div class="qcard"><div class="qhead"><div class="big kai">'+q.c+'</div><p>两个句子里的「'+q.c+'」分别是什么意思？</p></div>'+row(1,q.a)+row(2,q.b)+
   '<div class="explain" id="exp"></div><div class="qact"><button class="bigbtn" id="chk" disabled>检查答案</button></div></div>';
  $$(".opts .opt").forEach(function(b){b.onclick=function(){var r=b.parentNode.dataset.row;pick[r]=+b.dataset.i;
    $$('.opts[data-row="'+r+'"] .opt').forEach(function(x){x.classList.toggle("sel",x===b)});$("#chk").disabled=!(pick[1]!=null&&pick[2]!=null)}});
  $("#chk").onclick=function(){
    if(this.dataset.done){qi++;renderQuiz();return}
    var ans={1:q.a[1],2:q.b[1]},ok=true;
    [1,2].forEach(function(r){$$('.opts[data-row="'+r+'"] .opt').forEach(function(x){var i=+x.dataset.i;x.disabled=true;x.classList.remove("sel");
      if(i===ans[r])x.classList.add("ok");else if(i===pick[r]){x.classList.add("bad");ok=false}})});
    if(ok)score++;else wrongs.push(qi);
    var e=$("#exp");e.className="explain show "+(ok?"good":"wrong");
    e.innerHTML='<h4>'+(ok?"✅ 全对，真棒！":"❌ 再想想：")+'</h4>①「'+q.c+'」＝'+d.ss[q.a[1]].k+'　②「'+q.c+'」＝'+d.ss[q.b[1]].k+'<p style="margin-top:6px">'+q.x+'</p>';
    this.dataset.done="1";this.textContent=qi===Q.length-1?"看成绩 🏁":"下一题 ▶";
  };
}

function renderAll(){renderChars();renderFamily();renderSplit();renderOldNew()}
renderAll();renderTypes();renderQuiz();
</script>
</body>
</html>
